name: OHSU Digital Pathology Evidence

on:
  pull_request:
    paths:
      - 'revenue/ohsu_digital_pathology_ims/**'
      - '.github/workflows/ohsu-digital-pathology-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/ohsu_digital_pathology_ims/**'
      - '.github/workflows/ohsu-digital-pathology-evidence.yml'

permissions:
  contents: read

jobs:
  focused-evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: revenue/ohsu_digital_pathology_ims
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile qualification.py integration_contract.py cli.py test_qualification.py test_integration_contract.py test_cli.py
      - name: Unit tests
        run: python -m unittest -v
      - name: Optimized-mode unit tests
        run: python -O -m unittest -v
      - name: Public listing remains HOLD
        shell: bash
        run: |
          set +e
          python cli.py fixtures/public_listing_only.json --evaluated-at 2026-09-13T09:30:00Z > /tmp/ohsu-digital-pathology-receipt.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          with open('/tmp/ohsu-digital-pathology-receipt.json', encoding='utf-8') as fh:
              receipt = json.load(fh)
          assert receipt['decision'] == 'HOLD'
          assert 'FULL_RFP_PACKAGE_NOT_CAPTURED' in receipt['holds']
          assert 'MINIMUM_QUALIFICATIONS_NOT_CAPTURED' in receipt['holds']
          assert receipt['proposal_submission_authorized'] is False
          PY
