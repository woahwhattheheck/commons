name: Outbound send guard current authority

on:
  pull_request:
    paths:
      - "tools/outbound_send_guard/**"
      - ".github/workflows/outbound-send-guard-current.yml"
  push:
    branches: [main]
    paths:
      - "tools/outbound_send_guard/**"
      - ".github/workflows/outbound-send-guard-current.yml"

permissions:
  contents: read

jobs:
  current-authority:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile \
            tools/outbound_send_guard/_guard_core.py \
            tools/outbound_send_guard/guard_legacy.py \
            tools/outbound_send_guard/guard.py \
            tools/outbound_send_guard/current_impl.py \
            tools/outbound_send_guard/current.py \
            tools/outbound_send_guard/buyer_scope.py \
            tools/outbound_send_guard/route_guard.py \
            tools/outbound_send_guard/route_quarantine.py \
            tools/outbound_send_guard/__init__.py \
            tools/outbound_send_guard/__main__.py \
            tools/outbound_send_guard/test_guard.py \
            tools/outbound_send_guard/test_current.py \
            tools/outbound_send_guard/test_current_entrypoint.py \
            tools/outbound_send_guard/test_current_clock_boundary.py \
            tools/outbound_send_guard/test_buyer_scope.py \
            tools/outbound_send_guard/test_buyer_scope_custody_escape.py \
            tools/outbound_send_guard/test_route_guard.py \
            tools/outbound_send_guard/test_route_quarantine.py
      - name: Core/current tests
        run: |
          python -m unittest -v \
            tools.outbound_send_guard.test_guard \
            tools.outbound_send_guard.test_current \
            tools.outbound_send_guard.test_current_entrypoint \
            tools.outbound_send_guard.test_current_clock_boundary
      - name: Composed current-authority tests
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import sys
          import unittest
          from unittest.mock import patch
          from tools.outbound_send_guard import current

          cases = [
              ("tools.outbound_send_guard.test_buyer_scope", datetime(2026, 9, 14, 3, 0, 30, tzinfo=timezone.utc)),
              ("tools.outbound_send_guard.test_buyer_scope_custody_escape", datetime(2026, 9, 14, 12, 0, 30, tzinfo=timezone.utc)),
              ("tools.outbound_send_guard.test_route_guard", datetime(2026, 9, 13, 7, 20, 30, tzinfo=timezone.utc)),
              ("tools.outbound_send_guard.test_route_quarantine", datetime(2026, 9, 14, 12, 0, 30, tzinfo=timezone.utc)),
          ]
          ok = True
          for module, now in cases:
              print(f"\n=== {module} @ {now.isoformat()} ===")
              with patch("tools.outbound_send_guard.current.datetime.now", return_value=now):
                  suite = unittest.defaultTestLoader.loadTestsFromName(module)
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  ok = result.wasSuccessful() and ok
          raise SystemExit(0 if ok else 1)
          PY
      - name: Optimized core/current tests
        run: |
          python -O -m unittest -v \
            tools.outbound_send_guard.test_guard \
            tools.outbound_send_guard.test_current \
            tools.outbound_send_guard.test_current_entrypoint \
            tools.outbound_send_guard.test_current_clock_boundary
      - name: Optimized composed current-authority tests
        run: |
          python -O - <<'PY'
          from datetime import datetime, timezone
          import sys
          import unittest
          from unittest.mock import patch
          from tools.outbound_send_guard import current

          cases = [
              ("tools.outbound_send_guard.test_buyer_scope", datetime(2026, 9, 14, 3, 0, 30, tzinfo=timezone.utc)),
              ("tools.outbound_send_guard.test_buyer_scope_custody_escape", datetime(2026, 9, 14, 12, 0, 30, tzinfo=timezone.utc)),
              ("tools.outbound_send_guard.test_route_guard", datetime(2026, 9, 13, 7, 20, 30, tzinfo=timezone.utc)),
              ("tools.outbound_send_guard.test_route_quarantine", datetime(2026, 9, 14, 12, 0, 30, tzinfo=timezone.utc)),
          ]
          ok = True
          for module, now in cases:
              print(f"\n=== {module} @ {now.isoformat()} optimized ===")
              with patch("tools.outbound_send_guard.current.datetime.now", return_value=now):
                  suite = unittest.defaultTestLoader.loadTestsFromName(module)
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  ok = result.wasSuccessful() and ok
          raise SystemExit(0 if ok else 1)
          PY
