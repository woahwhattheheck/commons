name: UArk RFP09112026 CMMC Qualification

on:
  pull_request:
    paths:
      - "revenue/uark_rfp09112026_cmmc/**"
      - "tests/test_uark_rfp09112026_cmmc.py"
      - "tests/test_uark_rfp09112026_current_authority.py"
      - "tests/test_uark_rfp09112026_current_entry.py"
      - ".github/workflows/uark-rfp09112026-cmmc.yml"
  push:
    branches: [main]
    paths:
      - "revenue/uark_rfp09112026_cmmc/**"
      - "tests/test_uark_rfp09112026_cmmc.py"
      - "tests/test_uark_rfp09112026_current_authority.py"
      - "tests/test_uark_rfp09112026_current_entry.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: >-
          python -m py_compile
          revenue/uark_rfp09112026_cmmc/_qualifier_core.py
          revenue/uark_rfp09112026_cmmc/qualifier.py
          revenue/uark_rfp09112026_cmmc/_current_policy.py
          revenue/uark_rfp09112026_cmmc/_current_render.py
          revenue/uark_rfp09112026_cmmc/_current_entry.py
          revenue/uark_rfp09112026_cmmc/current_authority.py
          tests/test_uark_rfp09112026_cmmc.py
          tests/test_uark_rfp09112026_current_authority.py
          tests/test_uark_rfp09112026_current_entry.py
      - name: Focused hostile suites
        run: >-
          python -m unittest -v
          tests/test_uark_rfp09112026_cmmc.py
          tests/test_uark_rfp09112026_current_authority.py
          tests/test_uark_rfp09112026_current_entry.py
      - name: Focused hostile suites optimized
        run: >-
          python -O -m unittest -v
          tests/test_uark_rfp09112026_cmmc.py
          tests/test_uark_rfp09112026_current_authority.py
          tests/test_uark_rfp09112026_current_entry.py
      - name: Historical replay smoke
        run: |
          td=$(mktemp -d)
          python revenue/uark_rfp09112026_cmmc/qualifier.py compile revenue/uark_rfp09112026_cmmc/synthetic_candidate.json --json-out "$td/historical.json"
          python revenue/uark_rfp09112026_cmmc/qualifier.py verify "$td/historical.json"
      - name: Isolated current-authority smoke
        run: |
          td=$(mktemp -d)
          python -I -S revenue/uark_rfp09112026_cmmc/current_authority.py compile revenue/uark_rfp09112026_cmmc/synthetic_candidate.json --json-out "$td/current.json" --markdown-out "$td/current.md"
          python -I -S revenue/uark_rfp09112026_cmmc/current_authority.py verify "$td/current.json" --verification-out "$td/verification.json"
          python - "$td/verification.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["schema"] == "uark-rfp09112026-current-verification/v1"
          assert value["authority_mode"] == "ISOLATED_CLI_PROCESS_UTC"
          assert value["current"] is True
          assert value["external_actions_authorized"] is False
          PY
