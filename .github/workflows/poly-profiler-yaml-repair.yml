name: poly-profiler-yaml-repair

on:
  push:
    branches:
      - astra/poly-profiler-complete-reports-20260908

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/poly-profiler-complete-reports-20260908
          fetch-depth: 0

      - name: Indent embedded guide within the YAML block
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/poly-profiler-complete-reports-one-shot.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          guide = f'''# Complete saved-profiler report integrity\n"
          end_marker = "\n          (root / 'COMPLETE-REPORTS.md').write_text"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('guide markers changed')
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          lines = body.split('\n')
          nonempty = [line for line in lines if line]
          if not nonempty or any(line.startswith(' ') for line in nonempty):
              raise SystemExit('guide body is not the expected zero-column source')
          fixed = '\n'.join(('          ' + line) if line else '          ' for line in lines)
          updated = text[:start] + fixed + text[end:]
          if updated == text:
              raise SystemExit('no repair produced')
          path.write_text(updated, encoding='utf-8')
          changed = [
              (before, after) for before, after in zip(text.splitlines(), updated.splitlines())
              if before != after
          ]
          if not changed or any(after != '          ' + before for before, after in changed):
              raise SystemExit('repair changed more than indentation')
          print('indented_lines=' + str(len(changed)))
          PY

      - name: Publish corrected original one-shot
        run: |
          set -euo pipefail
          git rm .github/workflows/poly-profiler-yaml-repair.yml
          git add .github/workflows/poly-profiler-complete-reports-one-shot.yml
          git diff --cached --check
          git config user.name "Astra YAML Repair"
          git config user.email "brycembusiness2@gmail.com"
          git commit -m "Repair POLY one-shot YAML indentation"
          git push origin HEAD:astra/poly-profiler-complete-reports-20260908
