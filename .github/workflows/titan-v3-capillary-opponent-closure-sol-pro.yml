name: titan-v3-capillary-opponent-closure-sol-pro

on:
  push:
    paths:
      - '.github/workflows/titan-v3-capillary-opponent-closure-sol-pro.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-opponent-closure-sol-pro/**'
      - 'p/sol-pro-titan-v3-capillary-opponent-transitive-closure-20260910-01.md'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-capillary-opponent-closure-sol-pro.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-opponent-closure-sol-pro/**'
      - 'p/sol-pro-titan-v3-capillary-opponent-transitive-closure-20260910-01.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-opponent-closure-bound-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PARENT_HEAD: 'ce740f7d767136185c1bfee46e4a798c17b12303'
      SEEDS: '539131249,1834999074,2609097301,2609097302'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 32
          persist-credentials: false

      - name: Bind exact head and additive parent delta
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PARENT_HEAD" HEAD
          actual=$(mktemp)
          expected=$(mktemp)
          git diff --name-only "$PARENT_HEAD" HEAD | LC_ALL=C sort > "$actual"
          cat > "$expected" <<'EOF'
          .github/workflows/titan-v3-capillary-opponent-closure-sol-pro.yml
          p/sol-pro-titan-v3-capillary-opponent-transitive-closure-20260910-01.md
          revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-opponent-closure-sol-pro/README.md
          revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-opponent-closure-sol-pro/bind_opponents.py
          revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-opponent-closure-sol-pro/strict_compare.py
          revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-opponent-closure-sol-pro/test_bind_opponents.py
          revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-opponent-closure-sol-pro/test_strict_compare.py
          EOF
          sed -i 's/^          //' "$expected"
          LC_ALL=C sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          printf '%s\n' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/exact-head.sha"
          printf '%s\n' "$PARENT_HEAD" | tee "$RUNNER_TEMP/exact-parent.sha"
          cp "$actual" "$RUNNER_TEMP/exact-delta.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned official-interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run inherited and opponent-closure contracts
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          BASE="$LAB/analysis/titan-v3-capillary-panel-sol-cambium"
          CASE="$LAB/analysis/titan-v3-capillary-opponent-closure-sol-pro"
          (
            cd "$BASE"
            python -m unittest -v test_compare.py
          )
          (
            cd "$CASE"
            python -m unittest -v test_bind_opponents.py test_strict_compare.py
            python -m py_compile \
              bind_opponents.py \
              strict_compare.py \
              test_bind_opponents.py \
              test_strict_compare.py
          )
          python -m py_compile \
            "$BASE/audit.py" \
            "$BASE/compare.py" \
            "$BASE/control.py" \
            "$BASE/materialize_evaluator.py"

      - name: Audit exact control, candidate, evaluator, engine, and source opponents
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          BASE="$LAB/analysis/titan-v3-capillary-panel-sol-cambium"
          OUT="$RUNNER_TEMP/titan-v3-capillary-opponent-closure"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python "$BASE/audit.py" \
            --head "$(git rev-parse HEAD)" \
            --output "$OUT/SOURCE-AUDIT.json"

      - name: Materialize pre-interpreter candidate-action evaluator
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          BASE="$LAB/analysis/titan-v3-capillary-panel-sol-cambium"
          OUT="$RUNNER_TEMP/titan-v3-capillary-opponent-closure"
          mkdir -p "$OUT/evaluator"
          python "$BASE/materialize_evaluator.py" \
            --source "$KAG/cloud-eval/evaluate.py" \
            --output "$OUT/evaluator/evaluate.py" \
            --receipt "$OUT/EVALUATOR-MATERIALIZATION.json"

      - name: Build private closure-bound opponent wrappers
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          CASE="$LAB/analysis/titan-v3-capillary-opponent-closure-sol-pro"
          OUT="$RUNNER_TEMP/titan-v3-capillary-opponent-closure"
          python "$CASE/bind_opponents.py" build \
            --output-dir "$OUT/opponents" \
            --receipt "$OUT/OPPONENT-BINDING.json" \
            --head "$(git rev-parse HEAD)"

      - name: Verify canonical package stayed unchanged
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python build_integrated.py --check
          git diff --exit-code -- .

      - name: Run exact no-overlay control against bound opponents
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          BASE="$LAB/analysis/titan-v3-capillary-panel-sol-cambium"
          OUT="$RUNNER_TEMP/titan-v3-capillary-opponent-closure"
          python "$OUT/evaluator/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$BASE/control.py::agent" \
            --opponent "arlene=$OUT/opponents/arlene/arlene.py::agent" \
            --opponent "v1=$OUT/opponents/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --episode-steps 720 \
            --output "$OUT/control.json"

      - name: Run exact Capillary overlay against bound opponents
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          OUT="$RUNNER_TEMP/titan-v3-capillary-opponent-closure"
          python "$OUT/evaluator/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$LAB/candidates/capillary-executable-sol-prism/candidate.py::agent" \
            --opponent "arlene=$OUT/opponents/arlene/arlene.py::agent" \
            --opponent "v1=$OUT/opponents/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --episode-steps 720 \
            --output "$OUT/candidate.json"

      - name: Reverify opponent source, payloads, wrappers, and origins
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          CASE="$LAB/analysis/titan-v3-capillary-opponent-closure-sol-pro"
          OUT="$RUNNER_TEMP/titan-v3-capillary-opponent-closure"
          python "$CASE/bind_opponents.py" verify \
            --output-dir "$OUT/opponents" \
            --binding "$OUT/OPPONENT-BINDING.json" \
            --output "$OUT/OPPONENT-POST-PANEL-VERIFY.json" \
            --head "$(git rev-parse HEAD)"

      - name: Classify only through closure-bound strict facade
        id: classify
        if: always()
        shell: bash
        run: |
          set +e
          LAB=revenue/kaggriculture/cloud-execution-lab
          CASE="$LAB/analysis/titan-v3-capillary-opponent-closure-sol-pro"
          OUT="$RUNNER_TEMP/titan-v3-capillary-opponent-closure"
          python "$CASE/strict_compare.py" \
            --control "$OUT/control.json" \
            --candidate "$OUT/candidate.json" \
            --audit "$OUT/SOURCE-AUDIT.json" \
            --evaluator-receipt "$OUT/EVALUATOR-MATERIALIZATION.json" \
            --opponent-binding "$OUT/OPPONENT-BINDING.json" \
            --opponent-verification "$OUT/OPPONENT-POST-PANEL-VERIFY.json" \
            --output "$OUT/PANEL-REPORT.json" \
            --markdown "$OUT/PANEL-REPORT.md"
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish readable result
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/titan-v3-capillary-opponent-closure/PANEL-REPORT.md"
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Closure-bound Capillary panel did not reach classification' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-capillary-opponent-closure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-head.sha
            ${{ runner.temp }}/exact-parent.sha
            ${{ runner.temp }}/exact-delta.txt
            ${{ runner.temp }}/titan-v3-capillary-opponent-closure/
          if-no-files-found: error
          retention-days: 30

      - name: Assert checkout stayed clean
        if: always()
        run: git diff --exit-code -- .

      - name: Require exact closure-bound broad own-cash upside
        if: always()
        shell: bash
        run: test "${{ steps.classify.outputs.exit_code }}" = '0'
