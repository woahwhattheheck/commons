name: Connector capability preflight

on:
  pull_request:
    paths:
      - "coordination/connector_preflight/**"
      - ".github/workflows/connector-preflight.yml"
  push:
    branches: [main]
    paths:
      - "coordination/connector_preflight/**"
      - ".github/workflows/connector-preflight.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          coordination/connector_preflight/core.py
          coordination/connector_preflight/cli.py
          coordination/connector_preflight/test_preflight.py
      - name: Unit and hostile tests
        run: python -m unittest -q coordination.connector_preflight.test_preflight
      - name: Optimized Python tests
        run: python -O -m unittest -q coordination.connector_preflight.test_preflight
