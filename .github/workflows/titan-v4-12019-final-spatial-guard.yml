name: TITAN V4 #12019 final spatial guard

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/main.py"
      - "revenue/kaggriculture/cloud-execution-lab/spatial_tempo.py"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/runtime/final-spatial-guard/**"
      - ".github/workflows/titan-v4-12019-final-spatial-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-abi-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run exact-current predecessor and repair contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/runtime/final-spatial-guard
        run: python -m unittest -v test_current_abi.py
      - name: Prove optimized-Python closure
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/runtime/final-spatial-guard
        run: python -O -m unittest -v test_current_abi.py
      - name: Materialize candidate without canonical mutation
        run: |
          python revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/runtime/final-spatial-guard/apply_repair.py \
            --tree . \
            --output "$RUNNER_TEMP/main.final-spatial-guard.py" \
            --receipt "$RUNNER_TEMP/final-spatial-guard.json"
          python -m py_compile "$RUNNER_TEMP/main.final-spatial-guard.py"
          git diff --exit-code -- revenue/kaggriculture/cloud-execution-lab/main.py revenue/kaggriculture/cloud-execution-lab/spatial_tempo.py
          cat "$RUNNER_TEMP/final-spatial-guard.json"
