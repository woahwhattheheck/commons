name: SOL KESTREL TITAN pressure materialize

on:
  push:
    branches:
      - sol-kestrel/titan-pressure-final-order-20260908-01
    paths:
      - .github/workflows/sol-kestrel-titan-pressure-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-kestrel/titan-pressure-final-order-20260908-01
          fetch-depth: 0

      - name: Verify exact staging base
        shell: bash
        run: |
          set -euo pipefail
          BASE=0d4d528b2587f5eedb890b4c7571b65cc7aa1931
          test "$(git rev-list --count "${BASE}..HEAD")" = "1"
          test "$(git diff --name-only "${BASE}..HEAD")" = ".github/workflows/sol-kestrel-titan-pressure-materialize.yml"

      - name: Materialize exact pressure consumer
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json

          repo = Path.cwd()
          root = repo / "revenue/kaggriculture/cloud-execution-lab"

          def git_blob(path):
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          expected = {
              root / "titan_runtime.py": "b016a6b5994c4710ecf4a1ef0bc9ac5d12a0960c",
              root / "build_integrated.py": "7931030a63ea674a6272ba4cb23be6042e27f1bf",
              root / "TITAN-CONFIG.json": "0e9690776c26d8583a0be500984b50ab4b1a4199",
              root / "runtime/integrated-selected/RELEASE.json": "a4b9009b91690eadf1cdca7a6c0e495260687ce5",
              repo / "revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py": "d2ce05da8e3f5dbba55c0db1abd0aaa57fa86d0c",
              repo / "revenue/kaggriculture/cloud-opponent-league/lark-responsive/sell_priority.py": "d832174e26451d2bbe326991cc206a212cfebc12",
          }
          for path, want in expected.items():
              got = git_blob(path)
              if got != want:
                  raise SystemExit(f"staging input drift: {path}: {got} != {want}")

          old_archive = root / "exports/titan-current.tar.gz"
          old_bytes = old_archive.read_bytes()
          old_hash = hashlib.sha256(old_bytes).hexdigest()
          if len(old_bytes) != 317217 or old_hash != "d27c4d4f7305003829c639b9683c895915c9c713faea4c7741054af23652aab5":
              raise SystemExit(f"current archive drift: {len(old_bytes)} {old_hash}")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact insertion point, got {count}")
              return text.replace(old, new, 1)

          runtime_path = root / "titan_runtime.py"
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = replace_once(
              runtime,
              "    fourth_quadrant: bool = False\n",
              "    fourth_quadrant: bool = False\n    pressure_priority: bool = True\n",
              "feature flag",
          )
          runtime = replace_once(
              runtime,
              "        self._quadrant_admission = fourth_quadrant_admission\n        self._seed_plan = None\n",
              "        self._quadrant_admission = fourth_quadrant_admission\n        self._seed_plan = None\n        self._pressure_priority = None\n        self._pressure_quote = None\n",
              "pressure state",
          )
          helper = '''    def _pressure_priority_selected(self, obs, cfg, selected):
              """Apply the exact landed public same-lot pressure ordering last."""
              if not self.features.pressure_priority:
                  return selected
              if self._pressure_priority is None or self._pressure_quote is None:
                  # pressure_priority.py imports this exact landed helper by name.
                  load('sell_priority', HERE/'sell_priority.py', cache=True)
                  mechanics = load('_titan_pressure_mechanics', HERE/'mechanics.py', cache=True)
                  module = load('_titan_pressure_priority', HERE/'pressure_priority.py', cache=True)
                  self._pressure_priority = module
                  self._pressure_quote = mechanics.market_price
              result = self._pressure_priority.transform(
                  selected, obs, cfg, quote=self._pressure_quote)
              self.diagnostics['pressure_priority_changed'] = result != selected
              return result

          '''
          runtime = replace_once(
              runtime,
              "    def transform_selected(self, obs, cfg, selected):\n",
              helper + "    def transform_selected(self, obs, cfg, selected):\n",
              "pressure helper",
          )
          old_stage = '''                output = self.transform_selected(obs, cfg, selected)
                          if self.history is not None:
                              self.post = self._selected_snapshot(obs)
                              stage = 'terminal_history'
                              output = self.history.transform(obs,cfg,output,self.post,
                                  deadline=started+self.features.budget_seconds-self.features.reserve_seconds)
                              self.history.remember(obs,cfg,output,self.post)
                              self.diagnostics['history'] = self.history.diagnostics
                          # Build the checkpoint while the deadline is still active, but
          '''
          new_stage = '''                output = self.transform_selected(obs, cfg, selected)
                          if self.history is not None:
                              self.post = self._selected_snapshot(obs)
                              stage = 'terminal_history'
                              output = self.history.transform(obs,cfg,output,self.post,
                                  deadline=started+self.features.budget_seconds-self.features.reserve_seconds)
                          if self.features.pressure_priority:
                              stage = 'pressure_priority'
                              output = self._pressure_priority_selected(obs, cfg, output)
                          if self.history is not None:
                              self.history.remember(obs,cfg,output,self.post)
                              self.diagnostics['history'] = self.history.diagnostics
                          # Build the checkpoint while the deadline is still active, but
          '''
          runtime = replace_once(runtime, old_stage, new_stage, "final action callsite")
          runtime_path.write_text(runtime, encoding="utf-8")

          builder_path = root / "build_integrated.py"
          builder = builder_path.read_text(encoding="utf-8")
          builder = replace_once(
              builder,
              "    mapping['funded_payback.py']='../cloud-economic-stress/funded_payback/funded_payback.py'\n",
              "    mapping['funded_payback.py']='../cloud-economic-stress/funded_payback/funded_payback.py'\n"
              "    mapping['pressure_priority.py']='../cloud-opponent-league/lark-responsive/pressure_priority.py'\n"
              "    mapping['sell_priority.py']='../cloud-opponent-league/lark-responsive/sell_priority.py'\n",
              "builder pressure mapping",
          )
          builder = replace_once(
              builder,
              "'test_route_recovery.py','test_ordered_selected_sell.py','test_engine_semantics.py'):\n",
              "'test_route_recovery.py','test_ordered_selected_sell.py','test_engine_semantics.py','test_pressure_priority_runtime.py'):\n",
              "builder pressure check",
          )
          builder_path.write_text(builder, encoding="utf-8")

          config_path = root / "TITAN-CONFIG.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          if "pressure_priority" in config:
              raise SystemExit("pressure_priority already exists in staging config")
          config["pressure_priority"] = True
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

          release_path = root / "runtime/integrated-selected/RELEASE.json"
          release = json.loads(release_path.read_text(encoding="utf-8"))
          if any(c.get("component") == "Final SELL pressure priority" for c in release["components"]):
              raise SystemExit("pressure release component already exists")
          release["components"].append({
              "component": "Final SELL pressure priority",
              "source_pin": "PR10537 / pressure_priority.py SHA256 635f11abdc29b97422fd24ef0d5a8a52f070fab2754e5c3b24ec3e7370ac7824",
              "callsite": "TitanAgent.act final output after terminal-history transform and before history.remember / seller checkpoint",
              "enabled": True,
              "consumed_result": "ROOT-CLOUD-LEAGUE: development 48-0 vs 35-13; heldout 16-0 vs 8-8, all 16 paired deltas positive and all 8 control losses flipped; combined 64-0 vs 43-21, mean paired margin +446.406. Source-fixed evidence, not a leaderboard claim."
          })
          evidence = release.setdefault("game_evidence_for_this_archive", {})
          evidence["scope"] = (
              "same runtime bytes with redundant_hire and final SELL pressure priority enabled; "
              "development/compatibility evidence, not hosted leaderboard"
          )
          evidence["pressure_priority"] = {
              "source_pr": 10537,
              "source_sha256": "635f11abdc29b97422fd24ef0d5a8a52f070fab2754e5c3b24ec3e7370ac7824",
              "development": {"candidate_W": 48, "candidate_L": 0, "control_W": 35, "control_L": 13},
              "heldout": {"candidate_W": 16, "candidate_L": 0, "control_W": 8, "control_L": 8,
                            "all_paired_deltas_positive": True, "control_losses_flipped": 8},
              "combined_mean_margin_delta": 446.406,
              "errors": 0,
              "limits": "Source-fixed paired strategy evidence; no leaderboard or provider-upload claim."
          }
          release["checkpoint"]["pending_research"] = (
              "Final SELL pressure priority and redundant-hire certificate are enabled from their "
              "source-fixed evidence; terminal route/history and broader capital changes remain "
              "test-only. Root retains provider upload."
          )
          release_path.write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")

          test_path = root / "test_pressure_priority_runtime.py"
          if test_path.exists():
              raise SystemExit("pressure runtime test path unexpectedly exists")
          test_path.write_text('''import copy
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import unittest

          HERE = Path(__file__).resolve().parent
          ROOT = HERE.parent if HERE.name == "checks" else HERE
          UPSTREAM = ROOT.parent / "cloud-opponent-league/lark-responsive"
          PRESSURE_SHA256 = "635f11abdc29b97422fd24ef0d5a8a52f070fab2754e5c3b24ec3e7370ac7824"

          def git_blob(path):
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\\0" + data).hexdigest()

          def source(name):
              packaged = ROOT / name
              return packaged if packaged.is_file() else UPSTREAM / name

          def load_pressure():
              sell_path = source("sell_priority.py")
              pressure_path = source("pressure_priority.py")
              sell_spec = importlib.util.spec_from_file_location("sell_priority", sell_path)
              sell = importlib.util.module_from_spec(sell_spec)
              sell_spec.loader.exec_module(sell)
              sys.modules["sell_priority"] = sell
              pressure_spec = importlib.util.spec_from_file_location("_pressure_priority_test", pressure_path)
              pressure = importlib.util.module_from_spec(pressure_spec)
              pressure_spec.loader.exec_module(pressure)
              return pressure

          class PressurePriorityRuntimeTests(unittest.TestCase):
              def test_exact_landed_source_identity(self):
                  self.assertEqual(hashlib.sha256(source("pressure_priority.py").read_bytes()).hexdigest(), PRESSURE_SHA256)
                  self.assertEqual(git_blob(source("sell_priority.py")), "d832174e26451d2bbe326991cc206a212cfebc12")

              def test_transform_reorders_only_supported_sell_block(self):
                  pressure = load_pressure()
                  action = {"market": [["SELL", "WHEAT", 1], ["SELL", "CARROT", 1], ["HIRE", 1], ["SELL", "WHEAT", 1]], "units": [["PASS"]]}
                  original = copy.deepcopy(action)
                  observation = {"market": {"prices": {"WHEAT": 100, "CARROT": 100}, "inventory": {"WHEAT": 0, "CARROT": 0}}}
                  def quote(item, inventory, params):
                      return (100 - inventory) if item == "WHEAT" else (100 - 10 * inventory)
                  result = pressure.transform(action, observation, {"maxMarketOrdersPerTurn": 10}, quote=quote)
                  self.assertEqual(result["market"][:2], [["SELL", "CARROT", 1], ["SELL", "WHEAT", 1]])
                  self.assertEqual(result["market"][2:], original["market"][2:])
                  self.assertEqual(result["units"], original["units"])
                  self.assertEqual(action, original)

              def test_final_action_callsite_order(self):
                  runtime = (ROOT / "titan_runtime.py").read_text(encoding="utf-8")
                  history = runtime.index("output = self.history.transform")
                  pressure = runtime.index("output = self._pressure_priority_selected(obs, cfg, output)")
                  remember = runtime.index("self.history.remember(obs,cfg,output,self.post)")
                  checkpoint = runtime.index("seller_checkpoint = self._seller_state", pressure)
                  self.assertLess(history, pressure)
                  self.assertLess(pressure, remember)
                  self.assertLess(remember, checkpoint)

              def test_default_is_explicitly_enabled(self):
                  config = json.loads((ROOT / "TITAN-CONFIG.json").read_text(encoding="utf-8"))
                  self.assertIs(config["pressure_priority"], True)
                  runtime = (ROOT / "titan_runtime.py").read_text(encoding="utf-8")
                  self.assertIn("pressure_priority: bool = True", runtime)

              def test_current_source_manifest_binds_exact_sources(self):
                  manifest_path = ROOT / "SOURCE.json"
                  if not manifest_path.is_file():
                      manifest_path = ROOT / "runtime/integrated-selected/CURRENT-SOURCE.json"
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  pressure = manifest["runtime"]["pressure_priority.py"]
                  sell = manifest["runtime"]["sell_priority.py"]
                  self.assertEqual(pressure["source_path"], "../cloud-opponent-league/lark-responsive/pressure_priority.py")
                  self.assertEqual(pressure["sha256"], PRESSURE_SHA256)
                  self.assertEqual(sell["source_path"], "../cloud-opponent-league/lark-responsive/sell_priority.py")
                  self.assertEqual(sell["sha256"], hashlib.sha256(source("sell_priority.py").read_bytes()).hexdigest())

          if __name__ == "__main__":
              unittest.main()
          ''', encoding="utf-8")

          builder_now = builder_path.read_text(encoding="utf-8")
          for expected_text in (
              "mapping['pressure_priority.py']='../cloud-opponent-league/lark-responsive/pressure_priority.py'",
              "mapping['sell_priority.py']='../cloud-opponent-league/lark-responsive/sell_priority.py'",
              "'test_pressure_priority_runtime.py'",
          ):
              if expected_text not in builder_now:
                  raise SystemExit(f"missing builder contract: {expected_text}")

      - name: Build and verify the one current package
        shell: bash
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          python -B build_integrated.py
          python -B -m unittest -v \
            test_pressure_priority_runtime.py \
            test_terminal_history_join.py \
            test_module_recovery.py \
            test_route_recovery.py \
            test_worker_deadline.py \
            test_funded_payback_runtime.py
          python -B build_integrated.py --check
          tmp="$(mktemp -d)"
          tar -xzf exports/titan-current.tar.gz -C "$tmp"
          (cd "$tmp" && python -B -m unittest discover -s checks -p 'test_pressure_priority_runtime.py' -v)

      - name: Commit only the coherent materialized checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/sol-kestrel-titan-pressure-materialize.yml",
              "revenue/kaggriculture/cloud-execution-lab/titan_runtime.py",
              "revenue/kaggriculture/cloud-execution-lab/build_integrated.py",
              "revenue/kaggriculture/cloud-execution-lab/TITAN-CONFIG.json",
              "revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/RELEASE.json",
              "revenue/kaggriculture/cloud-execution-lab/test_pressure_priority_runtime.py",
              "revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz",
              "revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json",
              "revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json",
              "revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-d27c4d4f7305003829c639b9683c895915c9c713faea4c7741054af23652aab5.tar.gz",
          }
          changed = set(filter(None, subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()))
          unexpected = changed - allowed
          required = allowed - {".github/workflows/sol-kestrel-titan-pressure-materialize.yml"}
          missing = required - changed
          if unexpected or missing:
              raise SystemExit(f"staged path contract failed: unexpected={sorted(unexpected)} missing={sorted(missing)}")
          print("STAGED_PATHS")
          for path in sorted(changed):
              print(path)
          PY
          git config user.name "commons-llms"
          git config user.email "commons-board@users.noreply.github.com"
          git commit -m "TITAN: enable heldout-validated final SELL pressure"
          git push origin HEAD:sol-kestrel/titan-pressure-final-order-20260908-01
