name: astra-pixel-catalog-selfpatch

on:
  push:
    branches:
      - astra/pixel-catalog-selfpatch-20260910-01
    paths:
      - '.github/workflows/astra-pixel-catalog-selfpatch-20260910.yml'

permissions:
  contents: write

jobs:
  patch-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: acbbd1a7245ef61628211637eb88655fa93a1c4c
      CATALOG_PATH: revenue/outcome_commerce/catalog.json
      EXPECTED_CATALOG_BLOB: 6654114b382c54de2dcab690a21bec84dea02de0
      SELF_PATH: .github/workflows/astra-pixel-catalog-selfpatch-20260910.yml
    steps:
      - name: Checkout exact helper branch
        uses: actions/checkout@v4
        with:
          ref: astra/pixel-catalog-selfpatch-20260910-01
          fetch-depth: 8
          persist-credentials: true

      - name: Bind helper topology and catalog preimage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$SELF_PATH"
          test "$(git hash-object "$CATALOG_PATH")" = "$EXPECTED_CATALOG_BLOB"

      - name: Patch only existing Pixel funnel and listing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path("revenue/outcome_commerce/catalog.json")
          original_text = path.read_text(encoding="utf-8")
          before = json.loads(original_text)

          assert before["schema_version"] == "outcome-commerce/v1"
          old_funnel = copy.deepcopy(before["funnels"]["ho-pixel-pack"])
          matches = [x for x in before["listings"] if x.get("id") == "ho-pixel-pack"]
          assert len(matches) == 1
          old_listing = copy.deepcopy(matches[0])

          assert old_funnel["priority"] == 7
          assert old_funnel["readiness"] == "READY_FOR_QUALIFICATION"
          assert old_funnel["acquisition"]["primary_channel"] == "Public art or commission route after an original portfolio is available"
          assert old_funnel["acquisition"]["route"] == "commerce.html#ho-pixel-pack"
          assert old_funnel["qualification"]["route"] == "humans.html"
          assert old_funnel["conversion"]["mode"] == "CUSTOMER_SPECIFIC_INVOICE"
          assert old_funnel["conversion"]["status"] == "NOT_ISSUED"
          assert old_listing["state"] == "CANDIDATE"
          assert old_listing["source"]["path"] == "revenue/human_outcomes/offers.json"
          assert old_listing["source"]["pointer"] == "/offers/3"
          assert old_listing["source"]["blob_sha"] == "1b72639aaea1a3d41c0d2419470add5a3ca8d839"
          assert old_listing["pricing"]["components"] == [{
              "id": "fixed_fee",
              "kind": "fixed",
              "amount": "800.00",
              "basis": "one accepted agent pack",
          }]

          new_funnel = copy.deepcopy(old_funnel)
          new_funnel["readiness"] = "READY_FOR_CHECKOUT"
          new_funnel["acquisition"]["primary_channel"] = "pixel-portfolio.html direct public offer and verified checkout route"
          new_funnel["acquisition"]["route"] = "pixel-portfolio.html"
          new_funnel["acquisition"]["cta"] = "Open verified checkout"
          new_funnel["qualification"]["route"] = "pixel-portfolio.html"
          new_funnel["qualification"]["required"] = [
              "Offer id ho-pixel-pack",
              "One human job",
              "One public pixel artifact or page",
              "Start window",
              "Public, non-confidential interest first; founder-sent private contact stays off Commons",
          ]
          new_funnel["conversion"] = {
              "mode": "ACTIVE_STRIPE_LINK",
              "status": "ACTIVE_CHARGEABLE",
              "next_step": "Open the existing verified one-time USD 800 checkout, then follow the source-contract intake and delivery terms. A click is intent, not cash.",
              "state_after": "FUNDED",
              "evidence_required": "Exact active/live link and one-time USD 800 line item readback on 2026-09-10; account capability remains separately dated 2026-08-28. A click is not authorization, settlement, payout, or bank cash.",
          }
          assert new_funnel["fulfillment"] == old_funnel["fulfillment"]
          new_funnel["measurement"]["dom_action"] = "checkout-open"
          new_funnel["measurement"]["first_evidence_state"] = "FUNDED"
          new_funnel["gaps"] = [
              "A click is not authorization, settlement, payout, or BANK_AVAILABLE cash. Collected cash remains USD 0."
          ]

          new_listing = {
              "id": old_listing["id"],
              "name": old_listing["name"],
              "state": "PUBLIC_OFFER",
              "source_artifact": {
                  "path": "revenue/pixel_agent_pack/contract.json",
                  "blob_sha": "299705e062ff98c9939c5d6bde383ca565c21b8f",
                  "terms_authority": "source",
              },
              "pricing": copy.deepcopy(old_listing["pricing"]),
              "outcome": {
                  "acceptance_source": "revenue/pixel_agent_pack/contract.json",
                  "evidence_required": True,
              },
              "routes": {
                  "human": "pixel-portfolio.html",
                  "machine": "revenue/pixel_agent_pack/contract.json",
              },
              "checkout": {
                  "status": "ACTIVE_CHARGEABLE",
                  "provider": "stripe",
                  "url": "https://buy.stripe.com/fZufZgfxb9fj8qBbp843S0t",
                  "link_active": True,
                  "account_charges_enabled": True,
                  "account_payouts_enabled": True,
                  "capability_evidence": {
                      "reference": "provider-receipt-sha256:24c88e28d2b025e55506ae46c377b9720bf9350c213cc4f888ec3924f4ce47ad+account-capability-snapshot:2026-08-28T16:10:00Z",
                      "observed_at": "2026-09-10T23:05:24.713000+00:00",
                  },
              },
          }
          new_listing["pricing"]["mode"] = "fixed"

          def closing_brace(text: str, start: int) -> int:
              depth = 0
              in_string = False
              escaped = False
              for i in range(start, len(text)):
                  ch = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise AssertionError("unterminated object")

          funnel_marker = '    "ho-pixel-pack": '
          assert original_text.count(funnel_marker) == 1
          key_at = original_text.index(funnel_marker)
          f_start = original_text.index("{", key_at + len(funnel_marker))
          f_end = closing_brace(original_text, f_start)
          f_render = json.dumps(new_funnel, ensure_ascii=False, indent=2).replace("\n", "\n    ")
          text = original_text[:f_start] + f_render + original_text[f_end + 1:]

          listing_marker = '    {\n      "id": "ho-pixel-pack",'
          assert text.count(listing_marker) == 1
          l_indent = text.index(listing_marker)
          l_start = l_indent + 4
          assert text[l_start] == "{"
          l_end = closing_brace(text, l_start)
          l_render = "\n".join("    " + line for line in json.dumps(new_listing, ensure_ascii=False, indent=2).splitlines())
          text = text[:l_indent] + l_render + text[l_end + 1:]

          after = json.loads(text)
          actual_funnel = after["funnels"]["ho-pixel-pack"]
          actual_listing = [x for x in after["listings"] if x.get("id") == "ho-pixel-pack"]
          assert len(actual_listing) == 1
          actual_listing = actual_listing[0]

          assert actual_funnel == new_funnel
          assert actual_listing == new_listing
          assert actual_funnel["priority"] == 7
          assert actual_funnel["fulfillment"] == old_funnel["fulfillment"]
          assert actual_listing["pricing"]["components"][0]["amount"] == "800.00"
          assert actual_listing["pricing"]["components"][0]["basis"] == "one accepted agent pack"

          before_other = copy.deepcopy(before)
          after_other = copy.deepcopy(after)
          before_other["funnels"].pop("ho-pixel-pack")
          after_other["funnels"].pop("ho-pixel-pack")
          before_other["listings"] = [x for x in before_other["listings"] if x.get("id") != "ho-pixel-pack"]
          after_other["listings"] = [x for x in after_other["listings"] if x.get("id") != "ho-pixel-pack"]
          assert before_other == after_other

          path.write_text(text, encoding="utf-8")
          print("PIXEL_CATALOG_PATCH_OK")
          PY

      - name: Prove final one-file branch theorem and publish
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$CATALOG_PATH" >/dev/null
          git diff --check "$BASE_SHA" -- "$CATALOG_PATH"
          git rm "$SELF_PATH"
          git add "$CATALOG_PATH"
          git config user.name "Astra Catalog Helper"
          git config user.email "astra-catalog-helper@users.noreply.github.com"
          git commit -m "feat(pixel): promote agent-pack catalog offer"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$CATALOG_PATH"
          git diff --check "$BASE_SHA" HEAD
          git push origin HEAD:astra/pixel-catalog-selfpatch-20260910-01
