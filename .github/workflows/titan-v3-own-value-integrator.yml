name: TITAN V3 own-value integrator

on:
  push:
    branches:
      - codex/titan-v3-own-value-one-tree-20260910
    paths:
      - .github/workflows/titan-v3-own-value-integrator.yml

permissions:
  contents: write

jobs:
  integrate:
    if: "${{ github.event.head_commit.message == 'chore(titan): verify own-value integration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: revenue/kaggriculture/cloud-execution-lab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify synchronized own-value sources
        run: |
          python -m py_compile selected_sell_core.py reference/titan-current/latest/selected_sell_core.py
          python -m unittest -v test_selected_sell_objective.py

      - name: Run focused selected SELL regressions
        run: |
          python -m unittest -v \
            test_joint_market_slots.py \
            test_selected_pruning.py \
            test_ordered_selected_sell.py

      - name: Rebuild and verify canonical package
        run: |
          python build_integrated.py
          python build_integrated.py --check
          python - <<'PY'
          import ast
          import tarfile
          from pathlib import Path

          archive = Path('exports/titan-current.tar.gz')
          with tarfile.open(archive, 'r:gz') as stream:
              member = stream.extractfile('selected_sell_core.py')
              if member is None:
                  raise SystemExit('selected_sell_core.py missing from archive')
              tree = ast.parse(member.read().decode('utf-8'), filename='archive:selected_sell_core.py')
          market = next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == 'MarketPath')
          score = next(node for node in market.body if isinstance(node, ast.FunctionDef) and node.name == 'score')
          returned = next(node for node in ast.walk(score) if isinstance(node, ast.Return)).value
          expected = ast.dump(ast.parse('own_cash + carry', mode='eval').body, include_attributes=False)
          if ast.dump(returned.elts[0], include_attributes=False) != expected:
              raise SystemExit('archive still uses the opponent-relative objective')
          PY

      - name: Commit deterministic release outputs
        shell: bash
        run: |
          git config user.name 'TITAN integration bot'
          git config user.email 'tokenjunkielabs@gmail.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'no package changes produced'; exit 1; }
          git commit -m 'build(titan-v3): refresh own-value canonical package'
          git push origin HEAD:codex/titan-v3-own-value-one-tree-20260910
