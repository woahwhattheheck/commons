name: TITAN V3.1 8e3 cattle OFF current-package A-B

on:
  pull_request:
    branches:
      - astra/v31-a612-restore-5f6-canonical-archive-20260911
    paths:
      - '.github/workflows/titan-v31-8e3-cattle-off-package-ab.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/cattle_ab_8e3/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  exact-current-package-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout literal event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind 8e3 gameplay root, recovery parent, exact scope, donors, and source identity
        shell: bash
        run: |
          set -euo pipefail
          LIVE='8e3d92a286806f9f9525973ee7d359b629a11487'
          STACK='6e5e3c7cc5302d6db4b702cc4fd7c8ca721d7b8a'
          RECOVERY='refs/heads/astra/v31-a612-restore-5f6-canonical-archive-20260911'
          DIR='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/cattle_ab_8e3'
          V3='revenue/kaggriculture/cloud-execution-lab/candidates/v3'
          EVAL='revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py'

          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.sha }}' = "$STACK"
          test "$(git merge-base "$STACK" HEAD)" = "$STACK"
          test "$(git ls-remote origin refs/heads/titan/v3.1-20260911 | awk '{print $1}')" = "$LIVE"
          test "$(git ls-remote origin "$RECOVERY" | awk '{print $1}')" = "$STACK"

          test "$(git hash-object "$DIR/make_submission_12505.py")" = '9c5e46428f0a2357d7db6e46c4aa5f1f4748717d'
          test "$(git hash-object "$DIR/report_ab.py")" = '0cd5a74e02cd9555b8c7c3275f9e27c696512531'
          test "$(git hash-object "$DIR/materialize_ab.py")" = '739ba35a1ef178921a6554db6b1f3e07a153e571'
          test "$(git hash-object "$V3/build_v3.py")" = '528cfabbe377f829cb584726c41bd2f64061373b'
          test "$(git rev-parse HEAD:revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-5f6a4153e502713b9467776eafe7464af650584149173ce7507a31a1b2af60f1.tar.gz)" = '10e92806e24a32f3f301e32edbb1f0b5106be92a'

          git diff --name-only "$STACK...HEAD" > /tmp/cattle-ab-8e3-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/cattle-ab-8e3-paths.txt').read_text().splitlines())
          expected = {
              '.github/workflows/titan-v31-8e3-cattle-off-package-ab.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/cattle_ab_8e3/make_submission_12505.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/cattle_ab_8e3/materialize_ab.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/cattle_ab_8e3/report_ab.py',
          }
          if actual != expected:
              raise SystemExit(f'8e3 cattle A/B scope drift: {sorted(actual)!r}')
          print('CATTLE_AB_8E3_SCOPE_OK', len(actual))
          PY

          for path in \
            "$V3/FILES.json" \
            "$V3/V3-MANIFEST.json" \
            "$V3/apply_v3.py" \
            "$V3/overlay/r04_full_router.py" \
            "$V3/overlay/r04_h4_strawberry.py" \
            "$V3/overlay/r04_no_late_sale_advance.py" \
            "$V3/overlay/b5_fertilize.py" \
            "$V3/overlay/jit_pass_fertilize.py" \
            "$EVAL"
          do
            git show "$LIVE:$path" | cmp - "$path"
          done
          git diff --check "$STACK...HEAD"

      - name: Freeze native evaluator receipt membership and type poisons
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import copy
          import importlib.util
          import math
          from pathlib import Path

          path = Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/cattle_ab_8e3/report_ab.py')
          spec = importlib.util.spec_from_file_location('cattle_report_ab', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          expected_schema = 'titan-v31-8e3-current-package-cattle-off-ab/v2'
          expected_title = '## Cattle OFF vs ON — exact 8e3 current-package score-facing A/B'
          if module.OUTPUT_SCHEMA != expected_schema or 'a612' in module.OUTPUT_SCHEMA.lower():
              raise AssertionError(f'stale cattle receipt schema: {module.OUTPUT_SCHEMA!r}')
          if module.OUTPUT_TITLE != expected_title or 'a612' in module.OUTPUT_TITLE.lower():
              raise AssertionError(f'stale cattle receipt title: {module.OUTPUT_TITLE!r}')
          print('CATTLE_AB_8E3_DURABLE_RECEIPT_IDENTITY_OK', module.OUTPUT_SCHEMA)

          trace = 'a' * 64
          games = []
          for seed in module.EXPECTED_SEEDS:
              for seat in (0, 1):
                  games.append({
                      'opponent': module.EXPECTED_OPPONENT,
                      'seed': seed,
                      'candidate_seat': seat,
                      'status': 'complete',
                      'failure': None,
                      'scores': [100.0 + seat, 90.0 - seat],
                      'trace_sha256': trace,
                  })
          valid = {
              'schema_version': 1,
              'engine_ref': module.ENGINE_REF,
              'agent_rng_seed': module.EXPECTED_RNG_SEED,
              'candidate': {'entry': 'main.py', 'callable': 'agent', 'sha256': 'b' * 64},
              'seeds': list(module.EXPECTED_SEEDS),
              'opponents': {
                  module.EXPECTED_OPPONENT: {'entry': 'main.py', 'callable': 'agent', 'sha256': 'c' * 64},
              },
              'reproducibility': {'same_trace_and_scores': True},
              'games': games,
          }
          normalized = module.normalized_games(copy.deepcopy(valid), 'valid')
          assert frozenset(normalized) == module.EXPECTED_KEYS
          assert len(normalized) == 16

          def rejects(name, mutate):
              poisoned = copy.deepcopy(valid)
              mutate(poisoned)
              try:
                  module.normalized_games(poisoned, name)
              except SystemExit:
                  return
              raise AssertionError(f'{name}: poison was accepted')

          rejects('substituted-seed-metadata', lambda r: r['seeds'].__setitem__(0, 999999))
          rejects('bool-seed-metadata', lambda r: r['seeds'].__setitem__(0, True))
          rejects('wrong-opponent', lambda r: r.__setitem__('opponents', {'other': r['opponents'][module.EXPECTED_OPPONENT]}))
          rejects('wrong-rng', lambda r: r.__setitem__('agent_rng_seed', module.EXPECTED_RNG_SEED + 1))
          rejects('missing-cell', lambda r: r['games'].pop())
          rejects('duplicate-cell', lambda r: r['games'].append(copy.deepcopy(r['games'][0])))
          rejects('bool-game-seed', lambda r: r['games'][0].__setitem__('seed', True))
          rejects('bool-seat', lambda r: r['games'][0].__setitem__('candidate_seat', False))
          rejects('nan-score', lambda r: r['games'][0].__setitem__('scores', [math.nan, 1.0]))
          rejects('failure', lambda r: r['games'][0].__setitem__('failure', 'boom'))
          rejects('incomplete', lambda r: r['games'][0].__setitem__('status', 'error'))
          rejects('truthy-repro', lambda r: r.__setitem__('reproducibility', {'same_trace_and_scores': 1}))
          rejects('bad-trace', lambda r: r['games'][0].__setitem__('trace_sha256', 'not-a-sha'))

          control_config = {
              'r04_sale_window': True,
              'r04_sale_fertilizer': True,
              'r04_strawberry_topup': True,
              'r04_no_late_sale_advance': True,
              'r04_sale_horizon': 8,
              'r04_no_late_sale_advance_step': 648,
              'r04_cattle_early': True,
          }
          candidate_config = dict(control_config)
          candidate_config['r04_cattle_early'] = False
          materialization = {
              'on_package_sha256': 'd' * 64,
              'off_package_sha256': 'e' * 64,
              'on_to_off_changed_members': ['TITAN-CONFIG.json'],
              'on_to_off_changed_config_keys': ['r04_cattle_early'],
              'control_config': control_config,
              'candidate_config': candidate_config,
          }
          module.validate_materialization(copy.deepcopy(materialization))

          def rejects_materialization(name, mutate):
              poisoned = copy.deepcopy(materialization)
              mutate(poisoned)
              try:
                  module.validate_materialization(poisoned)
              except SystemExit:
                  return
              raise AssertionError(f'{name}: materialization poison was accepted')

          rejects_materialization(
              'equal-package-digests',
              lambda r: r.__setitem__('off_package_sha256', r['on_package_sha256']),
          )
          rejects_materialization(
              'extra-config-key-drift',
              lambda r: r.__setitem__(
                  'on_to_off_changed_config_keys',
                  ['r04_cattle_early', 'r04_sale_horizon'],
              ),
          )

          module.validate_receipt_pair(copy.deepcopy(valid), copy.deepcopy(valid))
          fingerprint_drift = copy.deepcopy(valid)
          fingerprint_drift['candidate']['sha256'] = 'd' * 64
          try:
              module.validate_receipt_pair(valid, fingerprint_drift)
          except SystemExit:
              pass
          else:
              raise AssertionError('candidate-entry fingerprint drift was accepted')

          print('CATTLE_AB_8E3_NATIVE_RECEIPT_POISONS_OK', len(module.EXPECTED_KEYS))
          print('CATTLE_AB_8E3_PACKAGE_IDENTITY_POISONS_OK')
          PY
          test -z "$(git status --porcelain)"

      - name: Prove current shipped package rebuilds exactly through recovery parent
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        env:
          PYTHONOPTIMIZE: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -B build_v3.py --check | tee /tmp/cattle-build-check.log
          grep -F 'V3 CHECK OK 4d920b2d8948488dc4f491a3a2b3d038c830d723baaaaba1e4470799b66f7d13 139 files' /tmp/cattle-build-check.log

      - name: Materialize exact cattle ON and OFF score-facing 8e3 package trees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cattle-on /tmp/cattle-off
          python3 -B revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/cattle_ab_8e3/materialize_ab.py \
            --on-tree /tmp/cattle-on \
            --off-tree /tmp/cattle-off \
            --receipt /tmp/cattle-materialization.json | tee /tmp/cattle-materialization.log
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/cattle-materialization.json'))
          assert r['canonical_commit'] == '8e3d92a286806f9f9525973ee7d359b629a11487'
          assert r['canonical_package_sha256'] == '4d920b2d8948488dc4f491a3a2b3d038c830d723baaaaba1e4470799b66f7d13'
          assert r['package_members'] == 139
          assert r['on_package_sha256'] != r['off_package_sha256']
          assert r['on_to_off_changed_members'] == ['TITAN-CONFIG.json']
          assert r['on_to_off_changed_config_keys'] == ['r04_cattle_early']
          assert r['control_config']['r04_cattle_early'] is True
          assert r['candidate_config']['r04_cattle_early'] is False
          for arm in ('control_config', 'candidate_config'):
              c = r[arm]
              assert c['r04_b5_carrot_fertilizer'] is True
              assert c['r04_b5_jit_fertilize'] is True
              assert c['r04_strawberry_topup'] is True
              assert c['r04_no_late_sale_advance'] is True
              assert c['r04_sale_fertilizer'] is True
              assert type(c['r04_sale_horizon']) is int and c['r04_sale_horizon'] == 8
              assert type(c['r04_no_late_sale_advance_step']) is int and c['r04_no_late_sale_advance_step'] == 648
          print('CATTLE_AB_8E3_ONE_KEY_STACK_OK', r['on_package_sha256'], r['off_package_sha256'])
          PY

      - name: Prepare pinned official interpreter cache
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py \
            --prepare-engine /tmp/kag-engine

      - name: Run cattle ON control against fixed cattle ON 8e3 opponent
        shell: bash
        run: |
          set -euo pipefail
          EVAL='revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py'
          python3 -B "$EVAL" \
            --engine-dir /tmp/kag-engine \
            --candidate /tmp/cattle-on/main.py \
            --opponent cattle_on=/tmp/cattle-on/main.py \
            --seeds 2611152001,2611152002,2611152003,2611152004,2611152005,2611152006,2611152007,2611152008 \
            --rng-seed 20260911 \
            --recheck-first \
            --output /tmp/cattle-on-control.json

      - name: Run cattle OFF candidate against identical cattle ON 8e3 opponent
        shell: bash
        run: |
          set -euo pipefail
          EVAL='revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py'
          python3 -B "$EVAL" \
            --engine-dir /tmp/kag-engine \
            --candidate /tmp/cattle-off/main.py \
            --opponent cattle_on=/tmp/cattle-on/main.py \
            --seeds 2611152001,2611152002,2611152003,2611152004,2611152005,2611152006,2611152007,2611152008 \
            --rng-seed 20260911 \
            --recheck-first \
            --output /tmp/cattle-off-candidate.json

      - name: Derive paired own-rival-margin and W-T-L verdict
        shell: bash
        run: |
          set -euo pipefail
          DIR='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/cattle_ab_8e3'
          python3 -B "$DIR/report_ab.py" \
            /tmp/cattle-materialization.json \
            /tmp/cattle-on-control.json \
            /tmp/cattle-off-candidate.json \
            --json-out /tmp/cattle-ab-report.json \
            --markdown-out /tmp/cattle-ab-report.md
          cat /tmp/cattle-ab-report.md
          cat /tmp/cattle-ab-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck live canonical and recovery parent before publication
        shell: bash
        run: |
          set -euo pipefail
          LIVE='8e3d92a286806f9f9525973ee7d359b629a11487'
          STACK='6e5e3c7cc5302d6db4b702cc4fd7c8ca721d7b8a'
          RECOVERY='refs/heads/astra/v31-a612-restore-5f6-canonical-archive-20260911'
          test "$(git ls-remote origin refs/heads/titan/v3.1-20260911 | awk '{print $1}')" = "$LIVE"
          test "$(git ls-remote origin "$RECOVERY" | awk '{print $1}')" = "$STACK"

      - name: Retain exact package and economics receipts
        uses: actions/upload-artifact@v4
        with:
          name: cattle-off-8e3-package-ab-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/cattle-materialization.json
            /tmp/cattle-on-control.json
            /tmp/cattle-off-candidate.json
            /tmp/cattle-ab-report.json
            /tmp/cattle-ab-report.md
          if-no-files-found: error
          retention-days: 7

      - name: Publish durable PR receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LIVE='8e3d92a286806f9f9525973ee7d359b629a11487'
          STACK='6e5e3c7cc5302d6db4b702cc4fd7c8ca721d7b8a'
          RECOVERY='refs/heads/astra/v31-a612-restore-5f6-canonical-archive-20260911'
          test "$(git ls-remote origin refs/heads/titan/v3.1-20260911 | awk '{print $1}')" = "$LIVE"
          test "$(git ls-remote origin "$RECOVERY" | awk '{print $1}')" = "$STACK"
          {
            printf 'Execution head: `%s`\n\n' '${{ github.event.pull_request.head.sha }}'
            cat /tmp/cattle-ab-report.md
            printf '\nExact shipped-8e3 B5+JIT package A/B. Gameplay root: `8e3d92a...`; build-custody parent: #12535 `6e5e3c7c...`; #12505 score-transform donor blob: `9c5e4642...`. Both arms retain B5 CARROT + JIT + H4 + gated L3 + sale-fertilizer; only cattle differs. No source/default/package-input/Kaggle mutation.\n'
          } > /tmp/cattle-comment.md
          gh pr comment '${{ github.event.pull_request.number }}' --body-file /tmp/cattle-comment.md

      - name: Prove checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
