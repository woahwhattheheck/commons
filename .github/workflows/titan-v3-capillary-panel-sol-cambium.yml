name: titan-v3-capillary-panel-sol-cambium

on:
  push:
    paths:
      - '.github/workflows/titan-v3-capillary-panel-sol-cambium.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-panel-sol-cambium/**'
      - 'p/sol-cambium-titan-v3-capillary-action-bound-panel-20260910-01.md'
      - 'p/sol-correlator-titan-v3-panel-wtl-nonregression-gate-20260910-02.md'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-capillary-panel-sol-cambium.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-panel-sol-cambium/**'
      - 'p/sol-cambium-titan-v3-capillary-action-bound-panel-20260910-01.md'
      - 'p/sol-correlator-titan-v3-panel-wtl-nonregression-gate-20260910-02.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-capillary-action-bound-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SEEDS: '539131249,1834999074,2609097301,2609097302'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s\n' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/exact-head.sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned official-interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run classifier contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-capillary-panel-sol-cambium
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_compare.py test_strict_compare.py
          python -m py_compile \
            audit.py \
            compare.py \
            strict_compare.py \
            control.py \
            materialize_evaluator.py \
            test_compare.py \
            test_strict_compare.py

      - name: Audit exact control, candidate, evaluator, engine, and opponents
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          CASE="$LAB/analysis/titan-v3-capillary-panel-sol-cambium"
          OUT="$RUNNER_TEMP/titan-v3-capillary-panel"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python "$CASE/audit.py" \
            --head "$(git rev-parse HEAD)" \
            --output "$OUT/SOURCE-AUDIT.json"

      - name: Materialize pre-interpreter candidate-action evaluator
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          CASE="$LAB/analysis/titan-v3-capillary-panel-sol-cambium"
          OUT="$RUNNER_TEMP/titan-v3-capillary-panel"
          mkdir -p "$OUT/evaluator"
          python "$CASE/materialize_evaluator.py" \
            --source "$KAG/cloud-eval/evaluate.py" \
            --output "$OUT/evaluator/evaluate.py" \
            --receipt "$OUT/EVALUATOR-MATERIALIZATION.json"

      - name: Verify canonical package stayed unchanged
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python build_integrated.py --check
          git diff --exit-code -- .

      - name: Run exact no-overlay control panel
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          CASE="$LAB/analysis/titan-v3-capillary-panel-sol-cambium"
          OUT="$RUNNER_TEMP/titan-v3-capillary-panel"
          python "$OUT/evaluator/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$CASE/control.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --episode-steps 720 \
            --output "$OUT/control.json"

      - name: Run exact Capillary overlay panel
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          OUT="$RUNNER_TEMP/titan-v3-capillary-panel"
          python "$OUT/evaluator/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$LAB/candidates/capillary-executable-sol-prism/candidate.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --episode-steps 720 \
            --output "$OUT/candidate.json"

      - name: Classify exact action-bound causal signal
        id: classify
        if: always()
        shell: bash
        run: |
          set +e
          LAB=revenue/kaggriculture/cloud-execution-lab
          CASE="$LAB/analysis/titan-v3-capillary-panel-sol-cambium"
          OUT="$RUNNER_TEMP/titan-v3-capillary-panel"
          python "$CASE/strict_compare.py" \
            --control "$OUT/control.json" \
            --candidate "$OUT/candidate.json" \
            --audit "$OUT/SOURCE-AUDIT.json" \
            --evaluator-receipt "$OUT/EVALUATOR-MATERIALIZATION.json" \
            --output "$OUT/PANEL-REPORT.json" \
            --markdown "$OUT/PANEL-REPORT.md"
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish readable result
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/titan-v3-capillary-panel/PANEL-REPORT.md"
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Capillary panel did not reach classification' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-capillary-panel-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-head.sha
            ${{ runner.temp }}/titan-v3-capillary-panel/
          if-no-files-found: error
          retention-days: 30

      - name: Assert checkout stayed clean
        if: always()
        run: git diff --exit-code -- .

      - name: Require exact causally-bound own, margin, and W/T/L upside
        if: always()
        shell: bash
        run: test "${{ steps.classify.outputs.exit_code }}" = '0'
