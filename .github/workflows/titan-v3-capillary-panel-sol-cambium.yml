name: titan-v3-capillary-panel-sol-cambium-retired-child

# This closed, unmerged branch was superseded by the exact parent artifact.
# A final push exists only to cancel the redundant queued 32-game child run.
on:
  push:
    branches:
      - 'sol-correlator/titan-v3-panel-outcome-gate-20260910-02'
    paths:
      - '.github/workflows/titan-v3-capillary-panel-sol-cambium.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v3-capillary-panel-sol-cambium-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Retired: parent artifact 10169493664 already proves exact economic identity.'
