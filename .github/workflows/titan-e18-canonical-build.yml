name: titan-e18-canonical-build

on:
  pull_request:
    paths:
      - '.github/workflows/titan-e18-canonical-build.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/**'

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'sol/titan-e18-acceptance-20260909-1124' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-e18-canonical-build.yml
            /revenue/kaggriculture/cloud-execution-lab/
            /revenue/kaggriculture/cloud-quickstep/
            /revenue/kaggriculture/cloud-runtime-pulse/
            /revenue/kaggriculture/cloud-opponent-league/lark-responsive/
            /revenue/kaggriculture/cloud-committed-seed-retry/
            /revenue/kaggriculture/cloud-economic-stress/funded_payback/
      - name: Build verify and atomically publish E18 canonical bytes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          LAB='revenue/kaggriculture/cloud-execution-lab'
          OLD_HASH=$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz')
          print(hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          )
          python3 -B "$LAB/build_integrated.py"
          python3 -B "$LAB/build_integrated.py" --check
          (cd "$LAB" && python3 -B -m unittest -v test_e18_acceptance_rules)
          HIST="$LAB/exports/historical/titan-${OLD_HASH}.tar.gz"
          test -f "$HIST"
          git add -- \
            "$LAB/exports/titan-current.tar.gz" \
            "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" \
            "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json" \
            "$HIST"
          git rm -- .github/workflows/titan-e18-canonical-build.yml
          python3 - <<'PY'
          import os, subprocess
          lab='revenue/kaggriculture/cloud-execution-lab/'
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          required={
            lab+'exports/titan-current.tar.gz',
            lab+'runtime/integrated-selected/CURRENT-SOURCE.json',
            lab+'runtime/integrated-selected/CURRENT-ARCHIVE.json',
            '.github/workflows/titan-e18-canonical-build.yml',
          }
          allowed=set(required)
          allowed.update(p for p in staged if p.startswith(lab+'exports/historical/titan-') and p.endswith('.tar.gz'))
          missing=required-staged
          unexpected=staged-allowed
          if missing or unexpected:
            raise SystemExit(f'bad staged publication missing={sorted(missing)} unexpected={sorted(unexpected)}')
          print('staged publication:', *sorted(staged), sep='\n')
          PY
          git diff --cached --check
          git config user.name 'titan-e18-vm'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Titan E18: publish canonical package bytes'
          NEW_HEAD=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          echo "published_head=$NEW_HEAD"
