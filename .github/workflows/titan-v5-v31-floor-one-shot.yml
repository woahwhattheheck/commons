name: titan-v5-v31-floor-one-shot

on:
  push:
    branches:
      - sol/v5-paired-economics-release-firewall-clean-20260912
    paths:
      - ".github/workflows/titan-v5-v31-floor-one-shot.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/apply_v31_floor_release_patch.py"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/test_release_v31_floor.py"

permissions:
  contents: write

concurrency:
  group: titan-v5-v31-floor-one-shot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exact-anchor floor integration
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate
        run: python -B apply_v31_floor_release_patch.py
      - name: Run full firewall contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m py_compile \
            economics_gate.py v31_floor_gate.py release_transaction.py promotion_gate.py \
            test_economics_gate.py test_v31_floor_gate.py test_release_transaction.py \
            test_release_v31_floor.py test_promotion_gate.py
          python -B -m unittest -v \
            test_economics_gate test_v31_floor_gate test_release_transaction \
            test_release_v31_floor test_promotion_gate
          python -O -B -m unittest -v \
            test_economics_gate test_v31_floor_gate test_release_transaction \
            test_release_v31_floor test_promotion_gate
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Publish tested postimage without racing branch movement
        env:
          BRANCH: sol/v5-paired-economics-release-firewall-clean-20260912
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
          git config user.name "commons-llms"
          git config user.email "commons-board@users.noreply.github.com"
          git rm .github/workflows/titan-v5-v31-floor-one-shot.yml
          git rm revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/apply_v31_floor_release_patch.py
          git add .github/workflows/titan-v5-promotion-release-gates.yml \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/release_transaction.py
          git commit -m "TITAN V5: require exact V3.1 floor at release"
          git push origin "HEAD:$BRANCH"
