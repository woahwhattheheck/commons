name: astra-relay-t05-source-pack
on:
  push:
    branches: [astra-relay-ci/t05-source-pack-20260907-01]
    paths: [.github/workflows/astra-relay-t05-source-pack.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read exact published T05 source and evidence
        uses: actions/checkout@v4
        with:
          ref: 5d707cb3279cf944c32bbfbe4910e5beb089996f
          path: work
          fetch-depth: 1
          sparse-checkout: |
            revenue/kaggriculture/cloud-terminal-routing
            revenue/kaggriculture/cloud-frontier-policy/next-panel
      - name: Read exact previously validated packer
        uses: actions/checkout@v4
        with:
          ref: 8329e78768906dc6e75ca3712e1690adc1ab2148
          path: pinned
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            revenue/kaggriculture/cloud-pack
      - name: Use the tested Python version
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
      - name: Restore every evidence file and verify native archive
        shell: bash
        run: |
          set -euo pipefail
          P="$PWD/work/revenue/kaggriculture/cloud-terminal-routing"
          test "$(git -C work rev-parse HEAD)" = 5d707cb3279cf944c32bbfbe4910e5beb089996f
          test "$(git -C pinned rev-parse HEAD)" = 8329e78768906dc6e75ca3712e1690adc1ab2148
          python "$P/evidence.py" --output "$RUNNER_TEMP/t05-restored" > "$RUNNER_TEMP/t05-evidence-restore.json"
          python -m py_compile "$P/main.py" "$P/terminal.py" "$P/measure.py" "$P/test_terminal.py"
          python pinned/revenue/kaggriculture/cloud-pack/pack.py build --spec "$P/export-spec.json" --output "$P/export"
          python pinned/revenue/kaggriculture/cloud-pack/pack.py verify --bundle "$P/export"
          printf '4954c74023e06c34f5430a942898d691fe61afd77c1bd893d616c26ed3d3af9c  %s\n' "$P/export/submission.tar.gz" | sha256sum -c -
      - name: Publish only verified archive and build receipt to own branch
        shell: bash
        run: |
          set -euo pipefail
          branch=astra-relay-ci/t05-terminal-routing-20260907-01
          remote_head="$(git -C work ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = 5d707cb3279cf944c32bbfbe4910e5beb089996f
          git -C work config user.name 'github-actions[bot]'
          git -C work config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C work add -f -- revenue/kaggriculture/cloud-terminal-routing/export/submission.tar.gz revenue/kaggriculture/cloud-terminal-routing/export/receipt.json
          test "$(git -C work diff --cached --name-only | wc -l)" -eq 2
          git -C work commit -m 'build(t05): publish verified frozen native archive'
          git -C work push origin "HEAD:refs/heads/$branch"
      - name: Retain native package and evidence verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: astra-relay-t05-verified-native-package
          path: |
            work/revenue/kaggriculture/cloud-terminal-routing/export/submission.tar.gz
            work/revenue/kaggriculture/cloud-terminal-routing/export/receipt.json
            ${{ runner.temp }}/t05-evidence-restore.json
          if-no-files-found: error
          retention-days: 7
