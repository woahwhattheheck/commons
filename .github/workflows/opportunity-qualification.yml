name: Opportunity qualification engine

on:
  pull_request:
    paths:
      - "revenue/opportunity_qualification/**"
      - ".github/workflows/opportunity-qualification.yml"
  push:
    branches: [main]
    paths:
      - "revenue/opportunity_qualification/**"
      - ".github/workflows/opportunity-qualification.yml"

permissions:
  contents: read

jobs:
  hostile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        working-directory: revenue/opportunity_qualification
        run: python -m py_compile engine.py engine_core.py test_engine.py test_authority_overlay.py
      - name: Hostile suite
        working-directory: revenue/opportunity_qualification
        run: python -m unittest -v
      - name: Hostile suite optimized
        working-directory: revenue/opportunity_qualification
        run: python -O -m unittest -v
