name: titan-v3-paired-cell-tail-admission-sol-tailguard

on:
  push:
    paths:
      - '.github/workflows/titan-v3-paired-cell-tail-admission-sol-tailguard.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-paired-cell-tail-admission-sol-tailguard/**'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-paired-cell-tail-admission-sol-tailguard.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-paired-cell-tail-admission-sol-tailguard/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run adversarial contracts
        shell: bash
        run: |
          set -euo pipefail
          CASE=revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-paired-cell-tail-admission-sol-tailguard
          cd "$CASE"
          python -m py_compile \
            paired_cell_tail_admission.py \
            mechanism_witness.py \
            test_paired_cell_tail_admission.py
          python -m unittest -v test_paired_cell_tail_admission.py
          python mechanism_witness.py
          git diff --exit-code -- MECHANISM-WITNESS.json
