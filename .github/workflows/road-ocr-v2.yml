name: road-ocr-v2
on:
  pull_request:
    paths:
      - 'revenue/road_barbados_ocr_v2/**'
      - '.github/workflows/road-ocr-v2.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/road_barbados_ocr_v2/**'
      - '.github/workflows/road-ocr-v2.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile revenue/road_barbados_ocr_v2/*.py
      - run: python -m unittest revenue.road_barbados_ocr_v2.test_engine -v
      - run: python -O -m unittest revenue.road_barbados_ocr_v2.test_engine -v
      - run: python revenue/road_barbados_ocr_v2/package.py
