name: Affordable housing compliance demo evidence

on:
  pull_request:
    paths:
      - 'revenue/affordable_housing_compliance_demo/**'
      - '.github/workflows/affordable-housing-compliance-demo.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/affordable_housing_compliance_demo/**'
      - '.github/workflows/affordable-housing-compliance-demo.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile revenue/affordable_housing_compliance_demo/engine.py revenue/affordable_housing_compliance_demo/test_engine.py
      - name: Unit tests
        working-directory: revenue/affordable_housing_compliance_demo
        run: python -m unittest -v test_engine.py
      - name: Optimized unit tests
        working-directory: revenue/affordable_housing_compliance_demo
        run: python -O -m unittest -v test_engine.py
