name: commercial-funnel

on:
  pull_request:
    paths:
      - 'revenue/commercial_funnel/**'
      - '.github/workflows/commercial-funnel.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/commercial_funnel/**'
      - '.github/workflows/commercial-funnel.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse and compile package
        run: |
          python -m py_compile revenue/commercial_funnel/*.py
      - name: Focused hostile and acceptance suites
        run: |
          python -m unittest -v revenue.commercial_funnel.test_ledger revenue.commercial_funnel.test_cli revenue.commercial_funnel.test_review_regressions
          python -O -m unittest -v revenue.commercial_funnel.test_ledger revenue.commercial_funnel.test_cli revenue.commercial_funnel.test_review_regressions
      - name: Deterministic historical library replay
        run: |
          python - <<'PY'
          from pathlib import Path
          from revenue.commercial_funnel import compile_funnel, strict_loads, verify_artifacts

          source = strict_loads(Path("revenue/commercial_funnel/example_input.json").read_text(encoding="utf-8"))
          result = compile_funnel(source, as_of="2026-09-13T10:10:00Z")
          assert verify_artifacts(
              source,
              as_of="2026-09-13T10:10:00Z",
              packet=result["packet"],
              receipt=result["receipt"],
              report_json=result["json"],
              report_csv=result["csv"],
              report_markdown=result["markdown"],
          )
          PY
