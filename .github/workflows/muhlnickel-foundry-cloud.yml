name: muhlnickel-foundry-cloud

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: bounded foundry rounds
        required: false
        default: "6"
        type: string

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: run the bounded foundry in cloud compute
        env:
          FOUNDRY_ROUNDS: ${{ inputs.rounds }}
        run: |
          case "$FOUNDRY_ROUNDS" in
            ''|*[!0-9]*) echo "rounds must be an integer" >&2; exit 2 ;;
          esac
          if [ "$FOUNDRY_ROUNDS" -lt 1 ] || [ "$FOUNDRY_ROUNDS" -gt 100 ]; then
            echo "rounds must be between 1 and 100" >&2
            exit 2
          fi
          python3 muhl/containers/MUHL_VISIBLE/muhl_foundry_live.py --rounds "$FOUNDRY_ROUNDS"
      - name: hash the resulting container
        run: sha256sum muhl/containers/MUHL_VISIBLE/FOUNDRY0.mno
      - uses: actions/upload-artifact@v4
        with:
          name: muhl-foundry-${{ github.run_id }}-${{ github.run_attempt }}
          path: muhl/containers/MUHL_VISIBLE/FOUNDRY0.mno
          if-no-files-found: error
          retention-days: 14
