name: UM 27-0012 finance pursuit

on:
  pull_request:
    paths:
      - "revenue/opportunities/umissouri_27_0012_payables_merchant/**"
      - ".github/workflows/umissouri-27-0012-finance-pursuit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: revenue/opportunities/umissouri_27_0012_payables_merchant
        run: python -m py_compile umissouri_27_0012.py test_umissouri_27_0012.py
      - name: Normal semantic suite
        working-directory: revenue/opportunities/umissouri_27_0012_payables_merchant
        run: python -m unittest -v test_umissouri_27_0012.py
      - name: Optimized semantic suite
        working-directory: revenue/opportunities/umissouri_27_0012_payables_merchant
        run: python -O -m unittest -v test_umissouri_27_0012.py
