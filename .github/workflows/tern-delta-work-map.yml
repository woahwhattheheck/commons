name: TERN-DELTA one-shot work-map regression
on:
  push:
    branches: [tern-delta/work-map-updates-20260906-01]
    paths: [.github/workflows/tern-delta-work-map.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /protocol/
            /host/observatory.py
            /test_protocol_observatory.py
            /test_observatory_timeline_paths.py
            /test_protocol_work_map_updates.py
            /.github/workflows/tern-delta-work-map.yml
      - name: Reproduce baseline and test repaired task history
        shell: bash
        run: |
          python - <<'PYRUN'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import shutil
          import hashlib

          evidence = Path(os.environ['RUNNER_TEMP']) / 'tern-delta-work-map-evidence'
          evidence.mkdir()
          results = []
          def run(label, command, code=0, contains=None):
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (evidence / (label + '.txt')).write_text(result.stdout, encoding='utf-8')
              print(label, result.returncode, '\n' + result.stdout, flush=True)
              results.append({'label': label, 'command': command, 'exit_code': result.returncode})
              assert result.returncode == code, label
              if contains is not None:
                  assert contains in result.stdout, label

          run('before-work-map', [sys.executable, 'test_protocol_work_map_updates.py', '-v'], 1, 'FAILED (failures=17)')
          path = Path('protocol/projector.py')
          data = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob == 'a8f78f07c45663ffae0875736681f14322787913', blob
          source = data.decode('utf-8')
          old = '''                "expected_next": EXPECTED_NEXT.get(UNKNOWN, UNKNOWN),
                          "evidence": list(event.get("evidence") or []),
                      })
                      if event["kind"] in TERMINAL_EVENT_KINDS:'''
          new = '''                "expected_next": EXPECTED_NEXT.get(UNKNOWN, UNKNOWN),
                          "evidence": [],
                      })
                      # Events are already deduplicated and chronologically ordered.
                      # Keep latest known task metadata and retain its full work history.
                      task["last_kind"] = event["kind"]
                      if event["ts"] != UNKNOWN:
                          task["last_ts"] = event["ts"]
                      for field in ("checkpoint", "semantic_area"):
                          if event[field] != UNKNOWN:
                              task[field] = event[field]
                      if event.get("head_sha"):
                          task["head_sha"] = event["head_sha"]
                      for field, source_field in (("claimed_paths", "claimed_paths"), ("lineage", "parent_ids")):
                          for value in event.get(source_field) or []:
                              if value not in task[field]:
                                  task[field].append(value)
                      task["evidence"].extend(event.get("evidence") or [])
                      if event["kind"] in TERMINAL_EVENT_KINDS:'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          old = '''            elif event["kind"] == "BLOCKED":
                          task["state"] = "BLOCKED"
                      elif event["kind"] in WORKING_EVENT_KINDS:
                          task["state"] = "WORKING"'''
          new = '''            elif event["kind"] == "BLOCKED":
                          task["state"] = "BLOCKED"
                          task["blocker"] = dict(event["blocker"])
                      elif event["kind"] in WORKING_EVENT_KINDS:
                          task["state"] = "WORKING"
                          task["blocker"] = {"type": UNKNOWN, "detail": UNKNOWN}'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          data = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'fdb64d0a5d145622264a7ad25b94c7733fac2d62'

          run('after-work-map', [sys.executable, 'test_protocol_work_map_updates.py', '-v'])
          run('retained-timeline-paths', [sys.executable, 'test_observatory_timeline_paths.py', '-v'])
          run('existing-protocol-projector', [sys.executable, '-m', 'unittest', 'test_protocol_observatory.ProtocolEventTests', 'test_protocol_observatory.ProjectorTests', '-v'])
          run('syntax', [sys.executable, '-m', 'compileall', '-q', 'protocol', 'test_protocol_work_map_updates.py'])
          run('diff-check', ['git', 'diff', '--check'])
          changed = ['protocol/projector.py', 'test_protocol_work_map_updates.py']
          def git_blob(name):
              data = Path(name).read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          manifest = {'base': '1603e2a03be0c54363895827bdee51f28673ee51',
                      'before_projector_blob': 'a8f78f07c45663ffae0875736681f14322787913',
                      'after_blobs': {name: git_blob(name) for name in changed}, 'commands': results}
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          (evidence / 'source.patch').write_text(subprocess.check_output(['git', 'diff', '--', 'protocol/projector.py'], text=True), encoding='utf-8')
          source = evidence / 'source'
          for name in [*changed, 'test_protocol_observatory.py', 'test_observatory_timeline_paths.py', 'host/observatory.py', *map(str, Path('protocol').rglob('*.py')), *map(str, Path('protocol/fixtures').glob('*.json'))]:
              target = source / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          PYRUN
      - name: Commit scoped fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/projector.py test_protocol_work_map_updates.py
          git rm .github/workflows/tern-delta-work-map.yml
          git diff --cached --check
          git commit -m 'fix(observatory): update work-map metadata from ordered task events'
          git push origin HEAD:tern-delta/work-map-updates-20260906-01
          git rev-parse HEAD | tee "$RUNNER_TEMP/tern-delta-work-map-evidence/final-head.txt"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tern-delta-work-map-evidence
          path: ${{ runner.temp }}/tern-delta-work-map-evidence
          retention-days: 14
