name: ASTRA ORBIT board bake replay repair

on:
  push:
    branches:
      - astra/orbit-board-bake-replay-20260908
    paths:
      - .github/workflows/astra-orbit-board-bake-replay.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/orbit-board-bake-replay-20260908
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          cp board_ingest.py /tmp/board_ingest_baseline.py
          python .github/astra_orbit_patch_board_ingest.py

      - name: Run repaired source and predecessor controls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile board_ingest.py test_board_ingest_bake_replay.py
          BOARD_INGEST_UNDER_TEST="$PWD/board_ingest.py" python -m unittest -v test_board_ingest_bake_replay.py 2>&1 | tee /tmp/final.log
          set +e
          BOARD_INGEST_UNDER_TEST=/tmp/board_ingest_baseline.py python -m unittest -v test_board_ingest_bake_replay.py > /tmp/baseline.log 2>&1
          baseline_rc=$?
          set -e
          cat /tmp/baseline.log
          if [ "$baseline_rc" -eq 0 ]; then
            echo "predecessor unexpectedly passed" >&2
            exit 1
          fi
          grep -q "_classify_bounded_bake_reset" /tmp/baseline.log
          grep -q "Ran 8 tests" /tmp/final.log
          grep -q "OK" /tmp/final.log

      - name: Commit tested bytes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name commons-board
          git config user.email commons-board@users.noreply.github.com
          rm .github/workflows/astra-orbit-board-bake-replay.yml
          rm .github/astra_orbit_patch_board_ingest.py
          git add -A -- board_ingest.py test_board_ingest_bake_replay.py p/astra-orbit-board-bake-replay-20260908-01.md .github/workflows/astra-orbit-board-bake-replay.yml .github/astra_orbit_patch_board_ingest.py
          git diff --cached --check
          git commit -m "Fix bounded board bake replay classification"
          git push origin HEAD:astra/orbit-board-bake-replay-20260908
