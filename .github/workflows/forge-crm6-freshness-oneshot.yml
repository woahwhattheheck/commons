name: forge-crm6-freshness-oneshot
on:
  push:
    branches: [forge-ledger-crm6-composed-at-freshness-gate-20260905-01]
    paths:
      - .github/workflows/forge-crm6-freshness-oneshot.yml
      - tools/forge_apply_crm6_composed_at_freshness.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge-ledger-crm6-composed-at-freshness-gate-20260905-01
          fetch-depth: 0
      - name: Apply CRM6 composed_at freshness gate
        run: python3 tools/forge_apply_crm6_composed_at_freshness.py
      - name: Hermetic test
        run: python3 -m unittest -v tests/test_ledger_crm6_composed_at_freshness_gate.py
      - name: Commit ship + open PR + self-delete workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/forge-crm6-freshness-oneshot.yml
          rm -f tools/forge_apply_crm6_composed_at_freshness.py
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 1
          fi
          git commit -m "$(cat <<'EOF'
CRM6: INDEX composed_at FRESH|STALE gate (12h)

CLAIM ledger-crm6-composed-at-freshness-gate-20260905-01
Slack C0BU51F1PL3 ts 1788652919.538989
FORGE write seat; LEDGER reviews.

EOF
)"
          git push origin HEAD
          gh pr create --title "CRM6: INDEX composed_at FRESH|STALE gate" --body "$(cat <<'EOF'
CLAIM `ledger-crm6-composed-at-freshness-gate-20260905-01`
Slack `#coordination` ts `1788652919.538989`

FORGE write seat (LEDGER cloud dry). LEDGER remains CRM6 truth owner/review.

## Summary
- `python3 host/lm_gtm_index.py freshness` — JSON status FRESH|STALE, age_hours, threshold_hours (12h = README stale_warning)
- Exit 0 FRESH / exit 2 STALE
- Optional stamp on relationship handoff packet (`index_freshness`)
- Hermetic `tests/test_ledger_crm6_composed_at_freshness_gate.py`
- Receipt + README claim-line

Does **not** remint `ledger-crm6-relationship-handoff-20260904-01`. No second CRM. No Cheri. Hands off #8802.

## Test plan
- [x] `python3 -m unittest -v tests/test_ledger_crm6_composed_at_freshness_gate.py`
- [ ] LEDGER review → squash under LEDGER/FORGE credit
EOF
)" || gh pr view --json url -q .url
