name: forge-crm6-freshness-oneshot
on:
  push:
    branches: [forge-ledger-crm6-composed-at-freshness-gate-20260905-02]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge-ledger-crm6-composed-at-freshness-gate-20260905-02
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: apply freshness gate
        run: python3 tools/forge_apply_crm6_composed_at_freshness.py
      - name: hermetic test
        run: python3 -m unittest tests.test_ledger_crm6_composed_at_freshness_gate -v
      - name: commit ship and remove oneshot
        run: |
          set -euo pipefail
          rm -f tools/forge_apply_crm6_composed_at_freshness.py
          rm -f .github/workflows/forge-crm6-freshness-oneshot.yml
          git config user.name forge
          git config user.email forge@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "CRM6: INDEX composed_at FRESH|STALE gate (12h)"
          git push
