name: titan-s24-champion-freeze

on:
  pull_request:
    paths:
      - ".github/workflows/titan-s24-champion-freeze.yml"
      - "results/v25/s24/runner.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titan-s24-champion-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  robustness-h:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FROZEN_COMMIT: d95388d812e392a07cbe2d9629767ce02857f3e5
      FROZEN_ARCHIVE_SHA256: 0215384841e2eec7f919f82ea900f343f1dc75665747a45e8df8f6b33316c1e5
      OFFICIAL_ENGINE_PY_SHA256: bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e
      OFFICIAL_ENGINE_JSON_SHA256: a82c89c1a2315b93f39775d8e025471a01b738647c9772658368ee6b1b6f4867
      OFFICIAL_UTILS_SHA256: 537b627b11784d424147ef57ebb0369b039bf83c9f891e81f10486b1f552334b
      V1_ARCHIVE_SHA256: 7b58fa06da778b1519b81d509d28dff3481b3bbcc7a2d656e8bdfe4a22540524
      SEED_START: "2609101001"
      SEED_COUNT: "32"
      WORKERS: "8"
      ACTION_TIMEOUT: "15.0"

    steps:
      - name: Checkout exact triggering head (PR) or ref (dispatch)
        uses: actions/checkout@v4
        with:
          # For PR events use the exact head SHA that triggered the run so a
          # later branch advance cannot make this job execute newer bytes than
          # the reviewed commit. workflow_dispatch falls back to the ref name.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert checked-out HEAD matches triggering PR head when present
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          echo "expected_triggering_head=$EXPECTED"
          echo "checked_out_head=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Materialize the frozen champion source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/s24-frozen /tmp/s24
          git cat-file -e "${FROZEN_COMMIT}^{commit}"
          git worktree add --detach /tmp/s24-frozen "$FROZEN_COMMIT"
          mkdir -p /tmp/s24
          echo "FROZEN_ROOT=/tmp/s24-frozen" >> "$GITHUB_ENV"
          echo "S24_WORK=/tmp/s24" >> "$GITHUB_ENV"

      - name: Install and byte-bind official engine plus frozen agents
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$S24_WORK/.venv"
          "$S24_WORK/.venv/bin/pip" install --quiet "kaggle-environments==1.32.7"
          ENGINE_PACKAGE=$("$S24_WORK/.venv/bin/python" -c 'import kaggle_environments,os;print(os.path.dirname(kaggle_environments.__file__))')
          mkdir -p "$S24_WORK/engine" "$S24_WORK/champion" "$S24_WORK/v1"
          cp "$ENGINE_PACKAGE/envs/kaggriculture/kaggriculture.py" \
             "$ENGINE_PACKAGE/envs/kaggriculture/kaggriculture.json" \
             "$ENGINE_PACKAGE/utils.py" \
             "$S24_WORK/engine/"
          printf '%s  %s\n' \
            "$OFFICIAL_ENGINE_PY_SHA256" "$S24_WORK/engine/kaggriculture.py" \
            "$OFFICIAL_ENGINE_JSON_SHA256" "$S24_WORK/engine/kaggriculture.json" \
            "$OFFICIAL_UTILS_SHA256" "$S24_WORK/engine/utils.py" | sha256sum -c -

          EXPORTS="$FROZEN_ROOT/revenue/kaggriculture/cloud-execution-lab/exports"
          CHAMPION="$EXPORTS/titan-current.tar.gz"
          V1="$EXPORTS/historical/titan-${V1_ARCHIVE_SHA256}.tar.gz"
          printf '%s  %s\n' "$FROZEN_ARCHIVE_SHA256" "$CHAMPION" | sha256sum -c -
          printf '%s  %s\n' "$V1_ARCHIVE_SHA256" "$V1" | sha256sum -c -
          tar -xzf "$CHAMPION" -C "$S24_WORK/champion"
          tar -xzf "$V1" -C "$S24_WORK/v1"
          test -f "$S24_WORK/champion/main.py"
          test -f "$S24_WORK/champion/checks/reference/evaluator/evaluate.py"
          test -f "$S24_WORK/v1/main.py"
          test -f "$FROZEN_ROOT/revenue/kaggriculture/20260907-offline-agent/evaluate.py"

      - name: Record immutable H manifest
        shell: python
        env:
          OUT_BASE: results/v25/s24/official-h
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          frozen = pathlib.Path(os.environ["FROZEN_ROOT"])
          work = pathlib.Path(os.environ["S24_WORK"])
          out = repo / os.environ["OUT_BASE"] / f"run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          out.mkdir(parents=True, exist_ok=True)
          seed_start = int(os.environ["SEED_START"])
          seed_count = int(os.environ["SEED_COUNT"])
          paths = {
              "arlene": frozen / "revenue/kaggriculture/cloud-execution-lab/runtime/variants/v1/reference/next-panel/vendor/arlene.py",
              "apex_v7": frozen / "revenue/kaggriculture/cloud-policy-portfolio/vendor/apex/main.py",
              "kaito_v43": frozen / "revenue/kaggriculture/cloud-frontier-policy/vendor/kaito_v43.py",
              "cok_v10": frozen / "revenue/kaggriculture/cloud-policy-portfolio/revision2/vendor/opponents/cok-v10.py",
              "public_bt12": frozen / "revenue/kaggriculture/cloud-frontier-decision/public-opponent/submission.py",
              "v1_submitted": work / "v1/main.py",
          }
          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {
              "schema": "titan-s24-champion-freeze-manifest-v1",
              "operation": "op:titan-v25-orders-20260909-S24",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "evidence_branch_head": subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=repo, text=True).strip(),
              "triggering_head_sha": os.environ.get("GITHUB_SHA", ""),
              "frozen_commit": os.environ["FROZEN_COMMIT"],
              "frozen_archive_sha256": sha256(frozen / "revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz"),
              "official_engine": {
                  "version": "kaggle-environments==1.32.7",
                  "kaggriculture.py": sha256(work / "engine/kaggriculture.py"),
                  "kaggriculture.json": sha256(work / "engine/kaggriculture.json"),
                  "utils.py": sha256(work / "engine/utils.py"),
              },
              "opponents": {name: {"path": str(path.relative_to(frozen)) if str(path).startswith(str(frozen)) else str(path), "sha256": sha256(path)} for name, path in paths.items()},
              "seed_start": seed_start,
              "seed_count": seed_count,
              "seeds": list(range(seed_start, seed_start + seed_count)),
              "both_candidate_seats": True,
              "workers": int(os.environ["WORKERS"]),
              "action_timeout_seconds": float(os.environ["ACTION_TIMEOUT"]),
              "scheduled_games": seed_count * len(paths) * 2,
              "arm_collapse": {
                  "canonical": os.environ["FROZEN_ARCHIVE_SHA256"],
                  "best_single": os.environ["FROZEN_ARCHIVE_SHA256"],
                  "best_compatible_combination": os.environ["FROZEN_ARCHIVE_SHA256"],
                  "robustness_finalist": os.environ["FROZEN_ARCHIVE_SHA256"],
                  "reason": "No distinct patch satisfied the S24 independent source+S/H admission gate at freeze time; identical arms are deduplicated.",
              },
          }
          (out / "MANIFEST.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"S24_OUT={out}", file=open(os.environ["GITHUB_ENV"], "a"))

      - name: Run 384-game official robustness holdout
        shell: bash
        run: |
          set -euo pipefail
          SEEDS=$(python3 - <<'PY'
          import os
          start=int(os.environ['SEED_START']); count=int(os.environ['SEED_COUNT'])
          print(','.join(str(start+i) for i in range(count)))
          PY
          )
          F="$FROZEN_ROOT/revenue/kaggriculture"
          EVALUATOR="$S24_WORK/champion/checks/reference/evaluator/evaluate.py"
          LOADER="$F/20260907-offline-agent/evaluate.py"
          CANDIDATE="$S24_WORK/champion/main.py"

          set +e
          /usr/bin/time -v -o "$S24_OUT/TIME.txt" \
            "$S24_WORK/.venv/bin/python" -B "$GITHUB_WORKSPACE/results/v25/s24/runner.py" \
              --python "$S24_WORK/.venv/bin/python" \
              --evaluator "$EVALUATOR" \
              --engine-dir "$S24_WORK/engine" \
              --loader "$LOADER" \
              --candidate "$CANDIDATE" \
              --seeds "$SEEDS" \
              --workers "$WORKERS" \
              --action-timeout "$ACTION_TIMEOUT" \
              --startup-timeout 60 \
              --game-timeout 1800 \
              --output-dir "$S24_OUT" \
              --opponent "arlene=$F/cloud-execution-lab/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
              --opponent "apex_v7=$F/cloud-policy-portfolio/vendor/apex/main.py::agent" \
              --opponent "kaito_v43=$F/cloud-frontier-policy/vendor/kaito_v43.py::agent" \
              --opponent "cok_v10=$F/cloud-policy-portfolio/revision2/vendor/opponents/cok-v10.py::agent" \
              --opponent "public_bt12=$F/cloud-frontier-decision/public-opponent/submission.py::agent" \
              --opponent "v1_submitted=$S24_WORK/v1/main.py::agent"
          RC=$?
          set -e
          echo "S24_RC=$RC" >> "$GITHUB_ENV"
          echo "$RC" > "$S24_OUT/EXIT_CODE.txt"

      - name: Bind receipt hashes and resource evidence
        if: always()
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import re

          out = pathlib.Path(os.environ["S24_OUT"])
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          time_text = (out / "TIME.txt").read_text(encoding="utf-8") if (out / "TIME.txt").exists() else ""
          max_rss = None
          match = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", time_text)
          if match:
              max_rss = int(match.group(1))
          receipt = {
              "schema": "titan-s24-champion-freeze-receipt-v1",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_exit_code": int(os.environ.get("S24_RC", "255")),
              "max_resident_set_kib_from_gnu_time": max_rss,
              "files": {},
          }
          for name in ("MANIFEST.json", "SUMMARY.json", "GAMES.jsonl", "SHARDS.json", "TIME.txt", "EXIT_CODE.txt"):
              path = out / name
              if path.exists():
                  receipt["files"][name] = {"bytes": path.stat().st_size, "sha256": digest(path)}
          (out / "RECEIPT.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")

      - name: Upload immutable H evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-s24-champion-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.S24_OUT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Commit raw H evidence to the evidence branch
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "commons-s24-vm"
          git config user.email "tokenjunkielabs@gmail.com"
          # Evidence is committed atop the exact detached source that was checked
          # out. Non-force push fails if the branch advanced past that source.
          git add "$S24_OUT"
          if git diff --cached --quiet; then
            echo "No S24 evidence files to commit"
          else
            git commit -m "S24 frozen champion robustness H evidence [${GITHUB_RUN_ID}]"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Enforce complete-game gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${S24_RC:-255}" = "0"
