name: titan-v5-completed-route-continuity

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v5-completed-route-continuity.yml"
      - "revenue/kaggriculture/cloud-execution-lab/main.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_entrypoint_route_capsule.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_entrypoint_route_capsule_continuity.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_entrypoint_deadline.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_entrypoint_step0_replay.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_spatial_outer_recovery.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_final_market_pressure_entrypoint.py"

permissions:
  contents: read

concurrency:
  group: titan-v5-completed-route-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact triggering head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and run completed-route continuity contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m py_compile \
            main.py \
            test_entrypoint_route_capsule.py \
            test_entrypoint_route_capsule_continuity.py \
            test_entrypoint_deadline.py \
            test_entrypoint_step0_replay.py \
            test_spatial_outer_recovery.py \
            test_final_market_pressure_entrypoint.py
          python -B -m unittest -v \
            test_entrypoint_route_capsule.py \
            test_entrypoint_route_capsule_continuity.py \
            test_entrypoint_deadline.py \
            test_entrypoint_step0_replay.py \
            test_spatial_outer_recovery.py \
            test_final_market_pressure_entrypoint.py
          python -O -B -m unittest -v \
            test_entrypoint_route_capsule.py \
            test_entrypoint_route_capsule_continuity.py \
            test_entrypoint_deadline.py \
            test_entrypoint_step0_replay.py \
            test_spatial_outer_recovery.py \
            test_final_market_pressure_entrypoint.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
