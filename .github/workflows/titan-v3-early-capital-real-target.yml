name: titan-v3-early-capital-real-target

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-post-unit-seed-demand.yml'
      - '.github/workflows/titan-v3-early-capital-real-target.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_commit_real.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact stacked checkout and bounded diffs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import os
          import subprocess

          compiler_fix_parent = '88e070511634b4380043559694b6664cee9cb909'
          reviewed_parent = '4403d361bc9769e09d12a59d732ea12861d0b2b7'
          source_parent = '69b07cf42d3111469e8523f84efd9014cc30c0a9'
          source = 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
          predecessor = '21c4ac15583e45f6f55ef615d95fc3db93637194'
          head = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD'], (
              head, os.environ['EXPECTED_HEAD'])
          assert subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^'], text=True).strip() == compiler_fix_parent
          assert subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^^'], text=True).strip() == reviewed_parent
          assert subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^^^'], text=True).strip() == source_parent

          parent_source = subprocess.check_output(
              ['git', 'rev-parse', f'{source_parent}:{source}'], text=True).strip()
          assert parent_source == predecessor, (parent_source, predecessor)

          compiler_child_allowed = {
              '.github/workflows/titan-v3-post-unit-seed-demand.yml',
              '.github/workflows/titan-v3-early-capital-real-target.yml',
          }
          compiler_child_changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', compiler_fix_parent, head],
              text=True,
          ).splitlines())
          assert compiler_child_changed == compiler_child_allowed, (
              compiler_child_changed, compiler_child_allowed)

          repair_allowed = {
              '.github/workflows/titan-v3-post-unit-seed-demand.yml',
              '.github/workflows/titan-v3-early-capital-real-target.yml',
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py',
          }
          repair_changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', reviewed_parent, head],
              text=True,
          ).splitlines())
          assert repair_changed == repair_allowed, (repair_changed, repair_allowed)

          stack_allowed = {
              '.github/workflows/titan-v3-post-unit-seed-demand.yml',
              '.github/workflows/titan-v3-early-capital-real-target.yml',
              source,
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py',
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py',
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_commit_real.py',
          }
          stack_changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', source_parent, head],
              text=True,
          ).splitlines())
          assert stack_changed == stack_allowed, (stack_changed, stack_allowed)
          print({
              'head': head,
              'compiler_fix_parent': compiler_fix_parent,
              'reviewed_parent': reviewed_parent,
              'source_parent': source_parent,
              'compiler_child_changed': sorted(compiler_child_changed),
              'repair_changed': sorted(repair_changed),
              'stack_changed': sorted(stack_changed),
          })

      - name: Bind commit-real source and official interpreter
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          expected = {
              Path('revenue/kaggriculture/cloud-execution-lab/early_capital.py'):
                  'c87f1d1c9d7b416c5316837634f7e721c85811fa',
              Path('revenue/kaggriculture/cloud-execution-lab/mechanics.py'):
                  '044a4f9c0a4a44dde10ada57563238bcaf82075d',
              Path('revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'):
                  '3c202c7ee921da239356789e266b694635103fc4',
          }
          for path, expected_blob in expected.items():
              data = path.read_bytes()
              actual = hashlib.sha1(
                  b'blob ' + str(len(data)).encode() + b'\0' + data
              ).hexdigest()
              assert actual == expected_blob, (path, actual, expected_blob)

      - name: Compile inherited and commit-real contracts without bytecode
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: python
        run: |
          from pathlib import Path

          for name in (
              'early_capital.py',
              'test_early_capital.py',
              'test_early_capital_executable_prefix.py',
              'test_early_capital_post_unit_seed_demand.py',
              'test_early_capital_real_target.py',
              'test_early_capital_commit_real.py',
          ):
              text = Path(name).read_text(encoding='utf-8')
              compile(text, name, 'exec')

      - name: Execute complete early-capital contract stack
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python3 -m unittest -v \
              test_early_capital \
              test_early_capital_executable_prefix \
              test_early_capital_post_unit_seed_demand \
              test_early_capital_real_target \
              test_early_capital_commit_real \
            2>&1 | tee "$RUNNER_TEMP/early-capital-commit-real-tests.log"

      - name: Emit deterministic exact-head receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          paths = [
              Path('.github/workflows/titan-v3-post-unit-seed-demand.yml'),
              Path('.github/workflows/titan-v3-early-capital-real-target.yml'),
              Path('revenue/kaggriculture/cloud-execution-lab/early_capital.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_commit_real.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/mechanics.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'),
          ]
          files = {}
          for path in paths:
              data = path.read_bytes()
              files[str(path)] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'git_blob': hashlib.sha1(
                      b'blob ' + str(len(data)).encode() + b'\0' + data
                  ).hexdigest(),
              }

          source = 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
          mechanics = 'revenue/kaggriculture/cloud-execution-lab/mechanics.py'
          engine = 'revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'
          assert files[source]['git_blob'] == 'c87f1d1c9d7b416c5316837634f7e721c85811fa'
          assert files[mechanics]['git_blob'] == '044a4f9c0a4a44dde10ada57563238bcaf82075d'
          assert files[engine]['git_blob'] == '3c202c7ee921da239356789e266b694635103fc4'

          log = Path(os.environ['RUNNER_TEMP']) / 'early-capital-commit-real-tests.log'
          head = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'schema': 'titan-v3-early-capital-commit-real/v1',
              'head': head,
              'expected_head': os.environ['EXPECTED_HEAD'],
              'source_parent': '69b07cf42d3111469e8523f84efd9014cc30c0a9',
              'reviewed_parent': '4403d361bc9769e09d12a59d732ea12861d0b2b7',
              'compiler_fix_parent': '88e070511634b4380043559694b6664cee9cb909',
              'parent_source_blob':
                  '21c4ac15583e45f6f55ef615d95fc3db93637194',
              'files': files,
              'test_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'scope': (
                  'commit-real capital certificate after guaranteed funding '
                  'and operating costs; exact land/animal resource allocation; '
                  'stale source-pin custody repaired; compile is in-memory so '
                  'strict clean-checkout proof remains meaningful; canonical '
                  'repackaging and games remain T08 custody'
              ),
          }
          assert receipt['head'] == receipt['expected_head']
          out = Path(os.environ['RUNNER_TEMP']) / 'early-capital-commit-real-receipt.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text(), end='')

      - uses: actions/upload-artifact@v4
        with:
          name: titan-v3-early-capital-commit-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/early-capital-commit-real-tests.log
            ${{ runner.temp }}/early-capital-commit-real-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert checkout stayed clean
        run: test -z "$(git status --porcelain)"
