name: titan-v3-early-capital-real-target

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-post-unit-seed-demand.yml'
      - '.github/workflows/titan-v3-early-capital-real-target.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact child, immutable parent, and contract-refresh-only diff
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import os
          import subprocess

          parent = '4403d361bc9769e09d12a59d732ea12861d0b2b7'
          source = 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
          post_test = 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'
          real_test = 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'
          source_blob = 'c87f1d1c9d7b416c5316837634f7e721c85811fa'
          old_post_blob = '535f1762d3ac26d769ee9b7b208d15cf5050f526'
          new_post_blob = '19632a077e21eab9bdeea0ab09c6a500d78aec3c'
          old_real_blob = 'aa3a1315d6137314830b0e877ea9c133c4f6e13a'
          new_real_blob = '69df329eee57389731a52b6271aa04b91a0bcee9'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD'], (head, os.environ['EXPECTED_HEAD'])
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', parent, head])
          commit_count = int(subprocess.check_output(
              ['git', 'rev-list', '--count', f'{parent}..{head}'], text=True,
          ).strip())
          assert commit_count == 1, commit_count
          assert subprocess.check_output(
              ['git', 'rev-parse', f'{parent}:{source}'], text=True,
          ).strip() == source_blob
          assert subprocess.check_output(
              ['git', 'rev-parse', f'HEAD:{source}'], text=True,
          ).strip() == source_blob
          assert subprocess.check_output(
              ['git', 'rev-parse', f'{parent}:{post_test}'], text=True,
          ).strip() == old_post_blob
          assert subprocess.check_output(
              ['git', 'rev-parse', f'HEAD:{post_test}'], text=True,
          ).strip() == new_post_blob
          assert subprocess.check_output(
              ['git', 'rev-parse', f'{parent}:{real_test}'], text=True,
          ).strip() == old_real_blob
          assert subprocess.check_output(
              ['git', 'rev-parse', f'HEAD:{real_test}'], text=True,
          ).strip() == new_real_blob
          allowed = {
              '.github/workflows/titan-v3-post-unit-seed-demand.yml',
              '.github/workflows/titan-v3-early-capital-real-target.yml',
              post_test,
              real_test,
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', parent, head], text=True,
          ).splitlines())
          print({'head': head, 'parent': parent, 'commit_count': commit_count, 'changed': sorted(changed)})
          assert changed == allowed, (changed, allowed)

      - name: Bind mechanism, refreshed contracts, and official interpreter
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          expected = {
              Path('revenue/kaggriculture/cloud-execution-lab/early_capital.py'):
                  'c87f1d1c9d7b416c5316837634f7e721c85811fa',
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'):
                  '19632a077e21eab9bdeea0ab09c6a500d78aec3c',
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'):
                  '69df329eee57389731a52b6271aa04b91a0bcee9',
              Path('revenue/kaggriculture/cloud-execution-lab/mechanics.py'):
                  '044a4f9c0a4a44dde10ada57563238bcaf82075d',
              Path('revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'):
                  '3c202c7ee921da239356789e266b694635103fc4',
          }
          for path, expected_blob in expected.items():
              data = path.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected_blob, (path, actual, expected_blob)

      - name: Compile inherited and commit-real contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            early_capital.py \
            test_early_capital.py \
            test_early_capital_executable_prefix.py \
            test_early_capital_post_unit_seed_demand.py \
            test_early_capital_real_target.py \
            test_early_capital_commit_real.py

      - name: Execute complete early-capital contract stack
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python3 -m unittest -v \
              test_early_capital \
              test_early_capital_executable_prefix \
              test_early_capital_post_unit_seed_demand \
              test_early_capital_real_target \
              test_early_capital_commit_real \
            2>&1 | tee "$RUNNER_TEMP/early-capital-12156-contract-refresh-tests.log"

      - name: Emit deterministic contract-refresh receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          paths = [
              Path('.github/workflows/titan-v3-post-unit-seed-demand.yml'),
              Path('.github/workflows/titan-v3-early-capital-real-target.yml'),
              Path('revenue/kaggriculture/cloud-execution-lab/early_capital.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_executable_prefix.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_commit_real.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/mechanics.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'),
          ]
          files = {}
          for path in paths:
              data = path.read_bytes()
              files[str(path)] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(),
              }
          source = 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
          post_test = 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'
          real_test = 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'
          assert files[source]['git_blob'] == 'c87f1d1c9d7b416c5316837634f7e721c85811fa'
          assert files[post_test]['git_blob'] == '19632a077e21eab9bdeea0ab09c6a500d78aec3c'
          assert files[real_test]['git_blob'] == '69df329eee57389731a52b6271aa04b91a0bcee9'
          log = Path(os.environ['RUNNER_TEMP']) / 'early-capital-12156-contract-refresh-tests.log'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'schema': 'titan-v3-pr12156-inherited-contract-refresh/v1',
              'head': head,
              'expected_head': os.environ['EXPECTED_HEAD'],
              'parent_head': '4403d361bc9769e09d12a59d732ea12861d0b2b7',
              'mechanism_parent': '69b07cf42d3111469e8523f84efd9014cc30c0a9',
              'mechanism_source_blob': 'c87f1d1c9d7b416c5316837634f7e721c85811fa',
              'post_unit_test_head_blob': '19632a077e21eab9bdeea0ab09c6a500d78aec3c',
              'real_target_test_head_blob': '69df329eee57389731a52b6271aa04b91a0bcee9',
              'files': files,
              'test_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'scope': 'inherited test-contract refresh only; commit-real mechanism bytes unchanged',
          }
          assert receipt['head'] == receipt['expected_head']
          out = Path(os.environ['RUNNER_TEMP']) / 'early-capital-12156-contract-refresh-receipt.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text(), end='')

      - uses: actions/upload-artifact@v4
        with:
          name: titan-v3-early-capital-real-target-12156-contract-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/early-capital-12156-contract-refresh-tests.log
            ${{ runner.temp }}/early-capital-12156-contract-refresh-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert checkout stayed clean
        run: test -z "$(git status --porcelain)"
