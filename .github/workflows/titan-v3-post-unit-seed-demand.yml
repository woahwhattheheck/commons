name: titan-v3-post-unit-seed-demand

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-post-unit-seed-demand.yml'
      - '.github/workflows/titan-v3-early-capital-real-target.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_commit_real.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind one-commit repair and complete commit-real stack
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          repair_parent = '4403d361bc9769e09d12a59d732ea12861d0b2b7'
          released_parent = '69b07cf42d3111469e8523f84efd9014cc30c0a9'
          source = 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
          post_unit = 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'
          old_source = '21c4ac15583e45f6f55ef615d95fc3db93637194'
          new_source = 'c87f1d1c9d7b416c5316837634f7e721c85811fa'

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD'], (head, os.environ['EXPECTED_HEAD'])
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == repair_parent
          assert int(subprocess.check_output(['git', 'rev-list', '--count', f'{repair_parent}..{head}'], text=True)) == 1

          repair_paths = {
              '.github/workflows/titan-v3-post-unit-seed-demand.yml',
              '.github/workflows/titan-v3-early-capital-real-target.yml',
              post_unit,
          }
          repair_changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', repair_parent, head], text=True).splitlines())
          assert repair_changed == repair_paths, (repair_changed, repair_paths)

          full_paths = repair_paths | {
              source,
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py',
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_commit_real.py',
          }
          full_changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', released_parent, head], text=True).splitlines())
          assert full_changed == full_paths, (full_changed, full_paths)

          assert subprocess.check_output(
              ['git', 'rev-parse', f'{released_parent}:{source}'], text=True).strip() == old_source
          assert subprocess.check_output(
              ['git', 'rev-parse', f'{head}:{source}'], text=True).strip() == new_source
          pin = "EARLY_CAPITAL_BLOB = 'c87f1d1c9d7b416c5316837634f7e721c85811fa'"
          assert pin in Path(post_unit).read_text(encoding='utf-8')
          subprocess.check_call(['git', 'diff', '--check', repair_parent, head])
          print({'head': head, 'repair_parent': repair_parent, 'repair_paths': sorted(repair_changed), 'full_paths': sorted(full_changed)})

      - name: Bind source, inherited pin, mechanics, and official interpreter
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          expected = {
              Path('revenue/kaggriculture/cloud-execution-lab/early_capital.py'):
                  'c87f1d1c9d7b416c5316837634f7e721c85811fa',
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'):
                  '72e43ac6f189bbe36abcfd38f58fdcea20eae654',
              Path('revenue/kaggriculture/cloud-execution-lab/mechanics.py'):
                  '044a4f9c0a4a44dde10ada57563238bcaf82075d',
              Path('revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'):
                  '3c202c7ee921da239356789e266b694635103fc4',
          }
          for path, expected_blob in expected.items():
              data = path.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected_blob, (path, actual, expected_blob)

      - name: Compile inherited and commit-real contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            early_capital.py \
            test_early_capital.py \
            test_early_capital_executable_prefix.py \
            test_early_capital_post_unit_seed_demand.py \
            test_early_capital_real_target.py \
            test_early_capital_commit_real.py

      - name: Execute complete early-capital contract stack
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python3 -m unittest -v \
              test_early_capital \
              test_early_capital_executable_prefix \
              test_early_capital_post_unit_seed_demand \
              test_early_capital_real_target \
              test_early_capital_commit_real \
            2>&1 | tee "$RUNNER_TEMP/early-capital-commit-real-tests.log"

      - name: Emit deterministic exact-head receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          paths = [
              Path('.github/workflows/titan-v3-post-unit-seed-demand.yml'),
              Path('.github/workflows/titan-v3-early-capital-real-target.yml'),
              Path('revenue/kaggriculture/cloud-execution-lab/early_capital.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_real_target.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_commit_real.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/mechanics.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'),
          ]
          files = {}
          for path in paths:
              data = path.read_bytes()
              files[str(path)] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(),
              }
          assert files['revenue/kaggriculture/cloud-execution-lab/early_capital.py']['git_blob'] == 'c87f1d1c9d7b416c5316837634f7e721c85811fa'
          assert files['revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py']['git_blob'] == '72e43ac6f189bbe36abcfd38f58fdcea20eae654'
          log = Path(os.environ['RUNNER_TEMP']) / 'early-capital-commit-real-tests.log'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'schema': 'titan-v3-early-capital-commit-real-evidence-repair/v1',
              'head': head,
              'expected_head': os.environ['EXPECTED_HEAD'],
              'repair_parent': '4403d361bc9769e09d12a59d732ea12861d0b2b7',
              'released_parent': '69b07cf42d3111469e8523f84efd9014cc30c0a9',
              'files': files,
              'test_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'scope': 'evidence-pin repair only; gameplay source is byte-identical to held #12156 head',
          }
          assert receipt['head'] == receipt['expected_head']
          out = Path(os.environ['RUNNER_TEMP']) / 'early-capital-commit-real-evidence-repair.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text(), end='')

      - uses: actions/upload-artifact@v4
        with:
          name: titan-v3-post-unit-seed-demand-evidence-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/early-capital-commit-real-tests.log
            ${{ runner.temp }}/early-capital-commit-real-evidence-repair.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert checkout stayed clean
        run: test -z "$(git status --porcelain)"
