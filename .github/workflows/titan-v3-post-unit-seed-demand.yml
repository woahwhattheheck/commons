name: titan-v3-post-unit-seed-demand

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-post-unit-seed-demand.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_executable_prefix.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'
      - 'revenue/kaggriculture/cloud-execution-lab/mechanics.py'
      - 'revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checkout and bounded diff
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: python
        run: |
          import os
          import subprocess

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD'], (head, os.environ['EXPECTED_HEAD'])
          base = os.environ.get('BASE_SHA', '')
          if base:
              allowed = {
                  '.github/workflows/titan-v3-post-unit-seed-demand.yml',
                  'revenue/kaggriculture/cloud-execution-lab/early_capital.py',
                  'revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py',
              }
              changed = set(subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True
              ).splitlines())
              assert changed == allowed, (changed, allowed)

      - name: Compile exact source and contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            early_capital.py \
            test_early_capital.py \
            test_early_capital_executable_prefix.py \
            test_early_capital_post_unit_seed_demand.py

      - name: Run early-capital regression suite
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python3 -m unittest -v \
              test_early_capital \
              test_early_capital_executable_prefix \
              test_early_capital_post_unit_seed_demand \
            2>&1 | tee "$RUNNER_TEMP/post-unit-seed-demand-tests.log"

      - name: Emit deterministic receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          paths = [
              Path('.github/workflows/titan-v3-post-unit-seed-demand.yml'),
              Path('revenue/kaggriculture/cloud-execution-lab/early_capital.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/test_early_capital_post_unit_seed_demand.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/mechanics.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'),
          ]
          files = {}
          for path in paths:
              data = path.read_bytes()
              files[str(path)] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'git_blob': hashlib.sha1(
                      b'blob ' + str(len(data)).encode() + b'\0' + data
                  ).hexdigest(),
              }

          source = 'revenue/kaggriculture/cloud-execution-lab/early_capital.py'
          mechanics = 'revenue/kaggriculture/cloud-execution-lab/mechanics.py'
          engine = 'revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py'
          assert files[source]['git_blob'] == 'cef33119f3bfdaa1f81ee7e2068424900110aba6'
          assert files[mechanics]['git_blob'] == '044a4f9c0a4a44dde10ada57563238bcaf82075d'
          assert files[engine]['git_blob'] == '3c202c7ee921da239356789e266b694635103fc4'

          log = Path(os.environ['RUNNER_TEMP']) / 'post-unit-seed-demand-tests.log'
          receipt = {
              'schema': 'titan-v3-post-unit-seed-demand/v2',
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'expected_head': os.environ['EXPECTED_HEAD'],
              'files': files,
              'test_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'scope': 'direct source successor and deterministic contracts; no games or archive rebuild',
          }
          assert receipt['head'] == receipt['expected_head']
          out = Path(os.environ['RUNNER_TEMP']) / 'post-unit-seed-demand-receipt.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text(), end='')

      - uses: actions/upload-artifact@v4
        with:
          name: titan-v3-post-unit-seed-demand-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/post-unit-seed-demand-tests.log
            ${{ runner.temp }}/post-unit-seed-demand-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert checkout stayed clean
        run: test -z "$(git status --porcelain)"
