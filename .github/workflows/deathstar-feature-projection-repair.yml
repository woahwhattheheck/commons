name: Deathstar feature projection repair
on:
  push:
    branches: [codex/deathstar-feature-projection-20260906]
permissions:
  contents: read
jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a312bb51c56b1a43567b78a9c0228ac0328fb4eb
          path: landed
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 72062e16d9466e80e2e787bd7519ea481765b886
          path: baseline
          persist-credentials: false
      - name: Compare baseline, regenerate, and export exact projection bytes
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import sys
          
          def observe(label, directory):
              outcome = subprocess.run([sys.executable, "test_feature_tracker.py"],
                  cwd=directory, capture_output=True, text=True, encoding="utf-8")
              summary = next((line for line in outcome.stdout.splitlines()
                              if line.startswith("FEATURE TRACKER TEST:")), "")
              names = summary.split(":", 2)[-1].strip().split(", ") if "TEST: FAIL" in summary else []
              row = {"label": label, "returncode": outcome.returncode, "summary": summary,
                     "failures": names,
                     "source_sha": subprocess.check_output(["git", "-C", str(directory), "rev-parse", "HEAD"], text=True).strip()}
              print("FT_TEST_OUTCOME " + json.dumps(row, sort_keys=True), flush=True)
              if outcome.returncode and not summary:
                  print("FT_UNEXPECTED_STDOUT " + outcome.stdout, flush=True)
                  print("FT_UNEXPECTED_STDERR " + outcome.stderr, flush=True)
                  raise RuntimeError("test did not produce its expected summary")
              return row
          
          baseline = observe("baseline-before", pathlib.Path("baseline"))
          before = observe("landed-before", pathlib.Path("landed"))
          receipt_raw = "{\n  \"schema\": \"commons-feature-evidence-v1\",\n  \"feature_id\": \"deathstar-commons-transport-20260906-01\",\n  \"id\": \"ev-deathstar-commons-transport-20260906-01\",\n  \"from\": \"CODEX\",\n  \"kind\": \"RECEIPT\",\n  \"recorded_at\": \"2026-09-06T12:20:12Z\",\n  \"note\": \"Focused main tests and owner-host runtime readback. This is a local runtime measurement, not public-hosted LIVE status or a claim about every Commons deployment.\",\n  \"repository\": \"woahwhattheheck/commons\",\n  \"work_sha\": \"9f18359c50a634ed04f9cee4be3917a0e2e235e5\",\n  \"landed_sha\": \"a312bb51c56b1a43567b78a9c0228ac0328fb4eb\",\n  \"readback_target\": \"2762408ef5a8e36451d3d9e843a3416f549a464d\",\n  \"source_blobs\": {\n    \"integrations/shared_equipment/outcomes.py\": \"bd36f48272daaab0e7fbd67730333111df9ec231\",\n    \"integrations/shared_equipment/services.py\": \"ee2550bce85ca00a62fda6d446876e0e8d5cddeb\",\n    \"integrations/gemini_slack/peer_tool_gateway.py\": \"d17cc6701e0ba05a95d19b354fa6f8bba60a96e1\",\n    \"test_commons_transport_outcomes.py\": \"5921399769a4860eb1bdf57163e8ada28ea80f09\",\n    \"host/toolbench.py\": \"5189383f8a923dda9a312c0cde0110f4e3935403\",\n    \"test_toolbench_snapshot_consistency.py\": \"0396395d59dd123522d42c0d2948b38787707734\",\n    \"integrations/claude_headless/client.py\": \"97ab9f5131a8a3c6d0fe0e2191f7fd6ed976e4d8\",\n    \"test_claude_client_transport_outcomes.py\": \"8083633d9368bb98d6841e9a05278f7c275ef9c4\",\n    \".github/workflows/commons-transport-regression.yml\": \"0a880d0db1498690aebd3b29c4454bfa4aa7bf1f\",\n    \"docs/commons-transport-outcomes.md\": \"f8cac338a9ea05f3f62ca9496fc385c21c3404a6\",\n    \"features/registry/deathstar-commons-transport-20260906-01.json\": \"83485205bc619eea734c598f61bd4f18db3cd035\"\n  },\n  \"regressions\": [\n    {\n      \"url\": \"https://github.com/woahwhattheheck/commons/actions/runs/34032266452\",\n      \"commit\": \"a312bb51c56b1a43567b78a9c0228ac0328fb4eb\",\n      \"linux\": {\n        \"ran\": 128,\n        \"passed\": 128\n      },\n      \"windows\": {\n        \"ran\": 128,\n        \"passed\": 127,\n        \"skipped\": 1\n      }\n    },\n    {\n      \"newcomer_direct_credential_retrieval\": true,\n      \"service_authenticated\": true,\n      \"plaintext_absent_journal\": true,\n      \"live_tools\": 43,\n      \"framing\": \"json-source-data/v1\",\n      \"sidecar_pid\": 23068,\n      \"claude_health\": true\n    }\n  ],\n  \"backup_sha\": \"2592313fd9313833b2dfdd6812e4068b79e98520\",\n  \"deployment\": {\n    \"gemini_gateway_source_blob\": \"d17cc6701e0ba05a95d19b354fa6f8bba60a96e1\",\n    \"gemini_services_compatible_blob\": \"e610c9e907ddcec4d3bbdcf704065f671e8832cf\",\n    \"claude_client_normalized_blob\": \"97ab9f5131a8a3c6d0fe0e2191f7fd6ed976e4d8\",\n    \"preserved\": \"Gemini deployment keeps its existing CLI catalog configuration. Claude client preserves unchanged CRLF lines. The Claude gateway, Pylon framing helper, token-pool files and bridge files retain their peer changes.\"\n  },\n  \"terminal_audit\": {\n    \"state\": \"LANDED\",\n    \"clean_recovery_checkout\": true,\n    \"landed_ancestry\": true,\n    \"required_paths\": true,\n    \"source_readback_all_11_blobs\": true\n  },\n  \"fix_first\": {\n    \"outcome\": \"fixed\",\n    \"observed_broken\": true,\n    \"expected_contract\": \"Native tool failures and uncertain writes retain their outcome and available handles; identical journal replay does not repeat an effect; checkpoint revision describes the exported database.\",\n    \"changed_paths\": [\n      \"integrations/shared_equipment/outcomes.py\",\n      \"integrations/shared_equipment/services.py\",\n      \"integrations/gemini_slack/peer_tool_gateway.py\",\n      \"host/toolbench.py\",\n      \"integrations/claude_headless/client.py\",\n      \"docs/commons-transport-outcomes.md\",\n      \"features/registry/deathstar-commons-transport-20260906-01.json\"\n    ],\n    \"tests\": [\n      {\n        \"url\": \"https://github.com/woahwhattheheck/commons/actions/runs/34032266452\",\n        \"commit\": \"a312bb51c56b1a43567b78a9c0228ac0328fb4eb\",\n        \"linux\": {\n          \"ran\": 128,\n          \"passed\": 128\n        },\n        \"windows\": {\n          \"ran\": 128,\n          \"passed\": 127,\n          \"skipped\": 1\n        }\n      },\n      {\n        \"newcomer_direct_credential_retrieval\": true,\n        \"service_authenticated\": true,\n        \"plaintext_absent_journal\": true,\n        \"live_tools\": 43,\n        \"framing\": \"json-source-data/v1\",\n        \"sidecar_pid\": 23068,\n        \"claude_health\": true\n      }\n    ],\n    \"main_sha\": \"a312bb51c56b1a43567b78a9c0228ac0328fb4eb\",\n    \"readback_verified\": true,\n    \"report_only_sessions\": 0,\n    \"unconsumed_findings\": 0\n  }\n}\n".encode("utf-8")
          receipt_path = pathlib.Path("landed/features/evidence/ev-deathstar-commons-transport-20260906-01.json")
          receipt_blob = hashlib.sha1(b"blob " + str(len(receipt_raw)).encode("ascii") + b"\0" + receipt_raw).hexdigest()
          assert receipt_blob == "251cfe86ccc8138ad9d7a4da1f08f8020b9d820d", receipt_blob
          receipt_path.write_bytes(receipt_raw)
          print("FT_INPUT_OVERLAY " + json.dumps({"path": str(receipt_path), "git_blob": receipt_blob}), flush=True)
          generated = subprocess.run([sys.executable, "host/feature_tracker.py", "--write"],
              cwd="landed", capture_output=True, text=True, encoding="utf-8")
          print("FT_GENERATOR_OUTCOME " + json.dumps({"returncode": generated.returncode,
              "stderr": generated.stderr, "stdout_bytes": len(generated.stdout.encode("utf-8"))}), flush=True)
          if generated.returncode:
              print(generated.stdout, flush=True)
              raise RuntimeError("feature tracker generation failed")
          after = observe("landed-after", pathlib.Path("landed"))
          print("FT_DIFFERENTIAL " + json.dumps({
              "resolved": sorted(set(before["failures"]) - set(after["failures"])),
              "remaining_present_at_baseline": sorted(set(after["failures"]) & set(baseline["failures"])),
              "new_after_generation": sorted(set(after["failures"]) - set(baseline["failures"]))}, sort_keys=True), flush=True)
          for name in ("feature-tracker.json", "feature-tracker.html"):
              raw = (pathlib.Path("landed") / name).read_bytes()
              encoded = base64.b64encode(raw).decode("ascii")
              meta = {"path": name, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(),
                      "git_blob": hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()}
              print("FT_EXPORT_BEGIN " + json.dumps(meta, sort_keys=True), flush=True)
              chunks = [encoded[index:index + 4096] for index in range(0, len(encoded), 4096)]
              for index, chunk in enumerate(chunks):
                  print("FT_EXPORT_CHUNK " + json.dumps({"path": name, "index": index, "base64": chunk}, sort_keys=True), flush=True)
              print("FT_EXPORT_END " + json.dumps({"path": name, "chunks": len(chunks)}, sort_keys=True), flush=True)
          if set(after["failures"]) - set(baseline["failures"]):
              raise RuntimeError("generated projection leaves a failure absent from baseline")
          if "golden json matches projection" in after["failures"]:
              raise RuntimeError("generated projection is still stale")
          