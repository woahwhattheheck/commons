name: titan-v3-land-admission-current

on:
  push:
    branches:
      - "sol-plumbline/titan-v3-land-admission-*"
    paths:
      - ".github/workflows/titan-v3-land-admission-current.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3-l01-land-admission-current/**"
  pull_request:
    paths:
      - ".github/workflows/titan-v3-land-admission-current.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3-l01-land-admission-current/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v3-land-admission-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  paired-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LANE: revenue/kaggriculture/cloud-execution-lab/candidates/v3-l01-land-admission-current
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run archive-bound historical and current paired evidence
        id: holdout
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -B "$LANE/ci_driver.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/titan-land" \
            --expected-head "$EXPECTED_HEAD"

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/titan-land/SUMMARY.md" ]]; then
            cat "$RUNNER_TEMP/titan-land/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Evidence driver did not produce a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-land-admission-current-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/titan-land/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete paired execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.holdout.outcome }}" = "success"
          test -f "$RUNNER_TEMP/titan-land/CURRENT-DELTA.json"
          test "$(cat "$RUNNER_TEMP/titan-land/EXIT_CODE.txt")" = "0"
