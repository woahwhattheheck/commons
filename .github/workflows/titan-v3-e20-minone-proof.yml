name: titan-v3-e20-minone-proof

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-e20-minone-proof.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/e20_hire_guard.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_features.py'

permissions:
  contents: read

jobs:
  exact-head-e20-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact successor topology
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          expected_parent='8b0569d1b506c4d1e8075ce8a4e3e32f9b11fd6d'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          mapfile -t changed < <(git diff --name-only "$expected_parent" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/titan-v3-e20-minone-proof.yml'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind reviewed E20 source and declared suite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/e20_hire_guard.py)" = 'cd497140d188794d610d3ae387de8758ecbd0765'
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_features.py)" = '93bc971edc14de3bf60d7a1921bb5d5bbe6df89f'

      - name: Compile E20 source and declared suite
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay
        run: |
          python -m py_compile \
            e20_hire_guard.py \
            checks/test_v3_features.py

      - name: Run declared V3 suite including E20 minimum-one killers
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay
        run: python -m unittest -v checks/test_v3_features.py

      - name: Require clean checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
