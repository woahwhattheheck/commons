name: Right-now human outcome authority

on:
  pull_request:
    paths:
      - "host/right_now_human_authority.py"
      - "host/right_now_revenue.py"
      - "host/reply_to_revenue.py"
      - "host/reply_to_revenue_core.py"
      - "test_right_now_human_authority.py"
      - ".github/workflows/right-now-human-authority.yml"
  push:
    branches: [main]
    paths:
      - "host/right_now_human_authority.py"
      - "host/right_now_revenue.py"
      - "host/reply_to_revenue.py"
      - "host/reply_to_revenue_core.py"
      - "test_right_now_human_authority.py"
      - ".github/workflows/right-now-human-authority.yml"

permissions:
  contents: read

jobs:
  hostile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile host/right_now_human_authority.py host/right_now_revenue.py test_right_now_human_authority.py
      - name: Hostile suite
        run: python -m unittest -v test_right_now_human_authority.py
      - name: Hostile suite optimized
        run: python -O -m unittest -v test_right_now_human_authority.py
