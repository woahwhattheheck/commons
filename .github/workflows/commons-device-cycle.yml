name: commons-device-cycle
on:
  workflow_call:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      reservation_count: ${{ steps.prepare.outputs.reservation_count }}
      prepared_commit: ${{ steps.prepare.outputs.prepared_commit }}
      batch_path: ${{ steps.prepare.outputs.batch_path }}
      batch_sha256: ${{ steps.prepare.outputs.batch_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - id: prepare
        name: preflight recovery routes and reserve a bounded open-action batch
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import re

          import action_executor

          risk_patterns = (
              (
                  "network-disable",
                  re.compile(
                      r"(?im)^\s*(?:(?:powershell(?:\.exe)?\s+.*?-command\s+)?disable-netadapter\b|"
                      r"nmcli\s+(?:networking|radio\s+wifi)\s+off\b|"
                      r"(?:ip\s+link\s+set|ifconfig\s+\S+)\b[^\n]*\bdown\b|"
                      r"netsh\s+(?:interface|wlan)\b[^\n]*\b(?:disable|disconnect)\b)"
                  ),
              ),
              (
                  "control-service-stop",
                  re.compile(
                      r"(?im)^\s*(?:stop-service\b[^\n]*(?:winrm|sshd|tailscale|actions\.runner|github[^\n]*runner)|"
                      r"(?:sc|sc\.exe)\s+stop\s+(?:winrm|sshd|tailscale|actions\.runner\S*|github\S*runner\S*)|"
                      r"systemctl\s+(?:stop|disable|restart)\s+(?:ssh|sshd|tailscaled?|zerotier-one|actions\.runner\S*|github\S*runner\S*))"
                  ),
              ),
              (
                  "host-session-stop",
                  re.compile(
                      r"(?im)^\s*(?:shutdown(?:\.exe)?\b|stop-computer\b|restart-computer\b|logoff\b)"
                  ),
              ),
          )

          failures = []
          for rec in action_executor.pending("device")[:16]:
              meta = rec["meta"]
              payload = rec["payload"]
              detected = [name for name, pattern in risk_patterns if pattern.search(payload)]
              control = (meta.get("control-route") or "").strip()
              if not detected and not control:
                  continue
              ident = meta["id"]
              recovery = (meta.get("recovery-route") or "").strip()
              handoff = (meta.get("operator-handoff") or "").strip()
              if not control:
                  failures.append(
                      f"{ident}: detected {','.join(detected)}; declare control-route and an independent recovery-route or operator-handoff"
                  )
                  continue
              if not handoff and (
                  not recovery or recovery.casefold() == control.casefold()
              ):
                  failures.append(
                      f"{ident}: control-route={control!r}; declare a distinct recovery-route or operator-handoff before reservation"
                  )

          if failures:
              for failure in failures:
                  print("action recovery preflight: " + failure)
              raise SystemExit(2)
          PY
            if python3 device_action_state.py prepare \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --github-output "$GITHUB_OUTPUT"; then
              exit 0
            else
              code=$?
            fi
            if [ "$code" -ne 75 ]; then
              exit "$code"
            fi
          done
          echo "prepare CAS exhausted after 5 fresh-main attempts" >&2
          exit 1

  execute:
    needs: prepare
    if: needs.prepare.outputs.reservation_count != '0'
    runs-on: [self-hosted, commons-device]
    # At most 16 sequential shell payloads at 15 minutes each, plus bounded
    # checkout/validation/receipt headroom.  GitHub's job ceiling is 360.
    timeout-minutes: 260
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.prepared_commit }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      # If this runner or its active control route disappears after reservation,
      # execute/finalize cannot land a terminal result. The PREPARED reservation
      # therefore remains UNKNOWN by the bound device-action protocol.
      - name: execute the prepared batch in sorted order and emit bounded receipts
        run: >-
          python3 device_action_state.py execute-batch
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --prepared-commit "${{ needs.prepare.outputs.prepared_commit }}"
          --batch-path "${{ needs.prepare.outputs.batch_path }}"
          --batch-sha256 "${{ needs.prepare.outputs.batch_sha256 }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commons-device-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/device-receipts
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: [prepare, execute]
    if: ${{ always() && needs.prepare.result == 'success' && needs.execute.result == 'success' && needs.prepare.outputs.reservation_count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: commons-device-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/device-receipts
      - name: validate every receipt on a fresh host and land only terminal records
        env:
          COMMONS_PREPARED_COMMIT: ${{ needs.prepare.outputs.prepared_commit }}
          COMMONS_BATCH_PATH: ${{ needs.prepare.outputs.batch_path }}
          COMMONS_BATCH_SHA256: ${{ needs.prepare.outputs.batch_sha256 }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if python3 device_action_state.py finalize \
              --source "$RUNNER_TEMP/device-receipts" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --prepared-commit "$COMMONS_PREPARED_COMMIT" \
              --batch-path "$COMMONS_BATCH_PATH" \
              --batch-sha256 "$COMMONS_BATCH_SHA256"; then
              exit 0
            else
              code=$?
            fi
            if [ "$code" -ne 75 ]; then
              exit "$code"
            fi
          done
          echo "finalize CAS exhausted after 5 fresh-main attempts" >&2
          exit 1
