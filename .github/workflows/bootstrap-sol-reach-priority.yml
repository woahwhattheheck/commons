name: bootstrap-sol-reach-priority

on:
  push:
    branches:
      - sol-reach/titan-v3-intent-priority-frozen-reachability-20260910-01
    paths:
      - '.github/workflows/bootstrap-sol-reach-priority.yml'
      - '.bootstrap/sol-reach-priority/**'

permissions:
  contents: write

concurrency:
  group: bootstrap-sol-reach-priority
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and expand deterministic source payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, gzip, hashlib, io, json, tarfile

          root = Path('.').resolve()
          stage = root / '.bootstrap/sol-reach-priority'
          meta = json.loads((stage / 'META.json').read_text())
          expected_paths = tuple(meta['paths'])
          parts = sorted(stage.glob('part-*.b64'))
          if len(parts) != meta['parts']:
              raise SystemExit(f"part count drift: {len(parts)} != {meta['parts']}")
          encoded = ''.join(path.read_text().strip() for path in parts)
          if len(encoded) != meta['base64_chars']:
              raise SystemExit('base64 character count drift')
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != meta['bytes']:
              raise SystemExit('payload byte count drift')
          if hashlib.sha256(payload).hexdigest() != meta['sha256']:
              raise SystemExit('payload SHA-256 drift')

          files = {}
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as bundle:
              for member in bundle:
                  path = PurePosixPath(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe member: {member.name!r}')
                  if member.name in files:
                      raise SystemExit(f'duplicate member: {member.name!r}')
                  stream = bundle.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'unreadable member: {member.name!r}')
                  data = stream.read(member.size + 1)
                  if len(data) != member.size:
                      raise SystemExit(f'length drift: {member.name!r}')
                  files[member.name] = data
          if tuple(sorted(files)) != tuple(sorted(expected_paths)):
              raise SystemExit('payload path allowlist drift')
          for relative in expected_paths:
              target = root / relative
              if target.exists():
                  raise SystemExit(f'refusing overwrite: {relative}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(files[relative])
          PY
          analysis='revenue/kaggriculture/cloud-execution-lab/analysis/v3-all-shed-priority-frozen-reachability-sol-reach'
          python -B -m py_compile "$analysis/analyze.py" "$analysis/materialize.py" "$analysis/test_reachability.py"
          python -B "$analysis/test_reachability.py"
          rm -rf "$analysis/__pycache__"
      - name: Replace bootstrap carrier with verified source
        shell: bash
        run: |
          set -euo pipefail
          analysis='revenue/kaggriculture/cloud-execution-lab/analysis/v3-all-shed-priority-frozen-reachability-sol-reach'
          git config user.name 'commons-board'
          git config user.email 'commons-board@users.noreply.github.com'
          git rm -r .bootstrap/sol-reach-priority .github/workflows/bootstrap-sol-reach-priority.yml
          git add "$analysis/analyze.py" "$analysis/materialize.py" "$analysis/test_reachability.py"
          test -n "$(git status --porcelain)"
          git commit -m 'test(titan): bind frozen-path priority reachability'
          git push origin "HEAD:${GITHUB_REF_NAME}"
