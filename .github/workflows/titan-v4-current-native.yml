name: titan-v4-current-native

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/titan-v4-current-native.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/titan-v4-current-native.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/build_integrated.py'
      - 'revenue/kaggriculture/cloud-execution-lab/*.py'
      - 'revenue/kaggriculture/cloud-execution-lab/*.json'
      - 'revenue/kaggriculture/cloud-execution-lab/LICENSE'
      - 'revenue/kaggriculture/cloud-execution-lab/NOTICE'
      - 'revenue/kaggriculture/cloud-execution-lab/TITAN-RELEASE.md'
      - 'revenue/kaggriculture/cloud-execution-lab/reference/**'
      - 'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/RELEASE.json'
      - 'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json'
      - 'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'
      - 'revenue/kaggriculture/cloud-quickstep/seller_snapshot.py'
      - 'revenue/kaggriculture/cloud-runtime-pulse/observed_clone.py'
      - 'revenue/kaggriculture/cloud-runtime-pulse/plant_suffix.py'
      - 'revenue/kaggriculture/cloud-opponent-league/lark-responsive/sell_priority.py'
      - 'revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py'
      - 'revenue/kaggriculture/cloud-committed-seed-retry/seed_retry.py'
      - 'revenue/kaggriculture/cloud-committed-seed-retry/test_seed_retry.py'
      - 'revenue/kaggriculture/cloud-economic-stress/funded_payback/funded_payback.py'

permissions:
  contents: read

concurrency:
  # Let one publisher finish; GitHub coalesces churn behind it to the newest pending run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove publisher trigger covers package source map
        shell: python
        run: |
          import importlib.util
          import re
          from pathlib import Path

          repo = Path.cwd().resolve()
          workflow_path = repo / '.github/workflows/titan-v4-current-native.yml'
          lab = repo / 'revenue/kaggriculture/cloud-execution-lab'
          builder_path = lab / 'build_integrated.py'

          spec = importlib.util.spec_from_file_location('titan_trigger_builder', builder_path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load canonical builder for trigger-coverage proof')
          build = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(build)

          text = workflow_path.read_text(encoding='utf-8')
          marker = '\n  push:\n'
          if marker not in text or '\n\npermissions:' not in text:
              raise SystemExit('cannot isolate push trigger block')
          push_block = text.split(marker, 1)[1].split('\n\npermissions:', 1)[0]
          patterns = re.findall(r"^\s+- '([^']+)'\s*$", push_block, flags=re.MULTILINE)
          if not patterns:
              raise SystemExit('push trigger has no path patterns')

          def compile_glob(pattern: str):
              out = []
              i = 0
              while i < len(pattern):
                  if pattern.startswith('**', i):
                      out.append('.*')
                      i += 2
                      continue
                  char = pattern[i]
                  if char == '*':
                      out.append('[^/]*')
                  elif char == '?':
                      out.append('[^/]')
                  else:
                      out.append(re.escape(char))
                  i += 1
              return re.compile('^' + ''.join(out) + '$')

          matchers = [(pattern, compile_glob(pattern)) for pattern in patterns]
          sources = set()
          for source_path in build.source_files().values():
              absolute = (lab / source_path).resolve()
              try:
                  relative = absolute.relative_to(repo).as_posix()
              except ValueError as exc:
                  raise SystemExit(f'package source escapes checkout: {source_path}') from exc
              sources.add(relative)

          uncovered = sorted(
              source for source in sources
              if not any(regex.fullmatch(source) for _, regex in matchers)
          )
          if uncovered:
              raise SystemExit(
                  'current-native publisher push.paths misses package sources:\n' +
                  '\n'.join(uncovered)
              )
          print(f'publisher trigger covers {len(sources)} package source paths')

      - name: Authenticate checkout and committed current publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lab = Path('revenue/kaggriculture/cloud-execution-lab')
          archive = lab / 'exports/titan-current.tar.gz'
          receipt_path = lab / 'runtime/integrated-selected/CURRENT-ARCHIVE.json'
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          data = archive.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if receipt.get('path') != 'exports/titan-current.tar.gz':
              raise SystemExit('committed current receipt points at an unexpected path')
          if receipt.get('sha256') != digest or receipt.get('bytes') != len(data):
              raise SystemExit('committed current archive does not match its receipt')
          print(json.dumps({'committed_current_sha256': digest, 'bytes': len(data)}))
          PY

      - name: Revalidate exact REBIND runtime when present
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          RUNTIME="$LAB/titan_runtime.py"
          CHECK="$LAB/candidates/v4/repairs/performance/module-cache-binding/check_loader_binding.py"
          BLOB="$(git hash-object "$RUNTIME")"
          if [[ "$BLOB" == "6d9720f4aa1e6b46e92ee5183897074d8e9ea5a0" ]]; then
            python3 -B "$CHECK" "$RUNTIME" --variant repaired
            python3 -O -B "$CHECK" "$RUNTIME" --variant repaired
          else
            echo "REBIND exact checker not applicable to runtime blob $BLOB; continuing with package-local recovery tests"
          fi

      - name: Revalidate canonical publication machinery
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          OUT="$RUNNER_TEMP/titan-v4-current-native"
          mkdir -p "$OUT"
          python3 -B "$LAB/test_build_publication.py" --report "$OUT/build-publication-results.json"

      - name: Render and authenticate exact current-native snapshot
        shell: python
        env:
          OUTPUT: ${{ runner.temp }}/titan-v4-current-native
          CHECKOUT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import hashlib
          import importlib.util
          import io
          import json
          import os
          from pathlib import Path
          import tarfile

          lab = Path('revenue/kaggriculture/cloud-execution-lab').resolve()
          out = Path(os.environ['OUTPUT'])
          out.mkdir(parents=True, exist_ok=True)
          builder_path = lab / 'build_integrated.py'
          spec = importlib.util.spec_from_file_location('titan_current_builder', builder_path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load canonical builder')
          build = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(build)

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(
                  b'blob ' + str(len(data)).encode('ascii') + b'\0' + data
              ).hexdigest()

          def tar_members(data: bytes) -> dict[str, bytes]:
              result: dict[str, bytes] = {}
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  for member in archive.getmembers():
                      if not member.isfile():
                          raise SystemExit(f'non-regular archive member: {member.name}')
                      if member.name in result:
                          raise SystemExit(f'duplicate archive member: {member.name}')
                      stream = archive.extractfile(member)
                      if stream is None:
                          raise SystemExit(f'unreadable archive member: {member.name}')
                      result[member.name] = stream.read()
              return result

          committed_archive = lab / 'exports/titan-current.tar.gz'
          committed_receipt = json.loads(
              (lab / 'runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text(encoding='utf-8')
          )
          old_data = committed_archive.read_bytes()
          old_sha = sha256(old_data)
          if old_sha != committed_receipt.get('sha256'):
              raise SystemExit('committed archive/receipt identity drift')

          data1, source1, receipt1 = build.render()
          data2, source2, receipt2 = build.render()
          if data1 != data2 or source1 != source2 or receipt1 != receipt2:
              raise SystemExit('canonical render is not deterministic')
          if receipt1.get('sha256') != sha256(data1) or receipt1.get('bytes') != len(data1):
              raise SystemExit('rendered receipt does not authenticate rendered archive')

          old_members = tar_members(old_data)
          new_members = tar_members(data1)
          if new_members.get('SOURCE.json') != source1:
              raise SystemExit('rendered SOURCE.json differs from emitted source manifest')

          mapping = build.source_files()
          source_manifest = json.loads(source1)
          runtime = source_manifest.get('runtime')
          if not isinstance(runtime, dict) or set(runtime) != set(mapping):
              raise SystemExit('rendered runtime manifest differs from canonical source map')
          expected_members = set(mapping) | {'SOURCE.json'}
          if set(new_members) != expected_members:
              raise SystemExit('rendered archive member set differs from canonical source map')

          live_blobs: dict[str, str] = {}
          for member, source_path in mapping.items():
              source_bytes = (lab / source_path).read_bytes()
              if new_members[member] != source_bytes:
                  raise SystemExit(f'archive/source byte mismatch: {member}')
              meta = runtime[member]
              if meta.get('source_path') != source_path:
                  raise SystemExit(f'source-path manifest mismatch: {member}')
              if meta.get('sha256') != sha256(source_bytes) or meta.get('bytes') != len(source_bytes):
                  raise SystemExit(f'source manifest identity mismatch: {member}')
              live_blobs[member] = git_blob(source_bytes)

          changed_members = sorted(
              name for name in set(old_members) | set(new_members)
              if old_members.get(name) != new_members.get(name)
          )

          b567 = 'b567942e4fb4e0571ebf9f8eaaf143d4a9156df3289f09a98db37823ef4d68d9'
          current_rebind = '6d9720f4aa1e6b46e92ee5183897074d8e9ea5a0'
          if old_sha == b567:
              expected_live = {
                  'main.py': '4a8cf7bcda1f0fea231a144692cb84a779a9e73e',
                  'TITAN-CONFIG.json': '3a3bef83899d3010fad623b628d9e95d9978111b',
                  'frozen_selected.py': 'fc7baf5c179818a55037f6a61d92984d81d1a21c',
                  'scheduler.py': 'a483b24dd72b580d7d8811636b54d2d44f391575',
                  'titan_runtime.py': current_rebind,
              }
              for name, expected in expected_live.items():
                  if live_blobs.get(name) != expected:
                      raise SystemExit(
                          f'b567 refresh precondition drift for {name}: '
                          f'expected {expected}, observed {live_blobs.get(name)}'
                      )
              old_runtime = old_members.get('titan_runtime.py')
              if old_runtime is None or git_blob(old_runtime) != 'b952c9c228ecbde592bf3d2df01638677abb0d24':
                  raise SystemExit('b567 preimage runtime is not the authenticated predecessor')
              if changed_members != ['SOURCE.json', 'titan_runtime.py']:
                  raise SystemExit(
                      'b567 refresh changed unexpected package members: ' + ','.join(changed_members)
                  )

          (out / 'titan-current.tar.gz').write_bytes(data1)
          (out / 'CURRENT-SOURCE.json').write_bytes(source1)
          (out / 'CURRENT-ARCHIVE.json').write_text(
              json.dumps(receipt1, indent=2) + '\n', encoding='utf-8'
          )
          manifest = {
              'schema': 'titan.v4.current-native-actions-snapshot/v1',
              'checkout_sha': os.environ['CHECKOUT_SHA'],
              'event_name': os.environ['EVENT_NAME'],
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'builder_git_blob': git_blob(builder_path.read_bytes()),
              'committed_current': {
                  'sha256': old_sha,
                  'bytes': len(old_data),
                  'receipt': committed_receipt,
              },
              'rendered_current': receipt1,
              'changed_package_members_from_committed_current': changed_members,
              'production_git_blobs': {
                  name: live_blobs[name]
                  for name in ('main.py', 'titan_runtime.py', 'frozen_selected.py', 'scheduler.py', 'TITAN-CONFIG.json')
              },
              'authenticated_b567_transition': old_sha == b567,
              'authenticated_b567_preimage': {
                  'actions_artifact_id': 10180428228,
                  'inner_tar_sha256': b567,
                  'runtime_git_blob': 'b952c9c228ecbde592bf3d2df01638677abb0d24',
              } if old_sha == b567 else None,
              'required_validation_steps': [
                  'canonical publication filesystem suite',
                  'exact REBIND checker when runtime is 6d9720f4...',
                  'package import/agent smoke',
                  'package-local module recovery normal and optimized',
                  'official-interpreter starter:17 both-seat OFF/ON smoke',
              ],
              'limits': 'Actions artifact only; no runtime/default/config/source/archive/Kaggle repository mutation.',
          }
          (out / 'CURRENT-NATIVE-MANIFEST.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'old_sha256': old_sha,
              'new_sha256': receipt1['sha256'],
              'changed_members': changed_members,
              'runtime_git_blob': live_blobs['titan_runtime.py'],
              'runtime_files': receipt1['runtime_files'],
          }, sort_keys=True))

      - name: Smoke exact rendered package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/titan-v4-current-native"
          RUNTIME="$RUNNER_TEMP/titan-v4-current-native-runtime"
          mkdir -p "$RUNTIME"
          tar -xzf "$OUT/titan-current.tar.gz" -C "$RUNTIME"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$RUNTIME" python3 -B - <<'PY'
          import main
          if not callable(getattr(main, 'agent', None)):
              raise SystemExit('rendered package main.py::agent is not callable')
          print('rendered package import/agent smoke PASS')
          PY
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$RUNTIME:$RUNTIME/checks" \
            python3 -B "$RUNTIME/checks/test_module_recovery.py"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$RUNTIME:$RUNTIME/checks" \
            python3 -O -B "$RUNTIME/checks/test_module_recovery.py"

      - name: Official-interpreter paired smoke
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          OUT="$RUNNER_TEMP/titan-v4-current-native"
          RUNTIME="$RUNNER_TEMP/titan-v4-current-native-runtime"
          python3 -B "$LAB/candidates/v4/repairs/gameplay/animal-yield-headroom/run_current_native_field.py" \
            --runtime "$RUNTIME" \
            --cases starter:17 \
            --output "$OUT/official-interpreter-starter17.json"

      - name: Upload authenticated current-native artifact
        uses: actions/upload-artifact@v4
        with:
          name: titan-v4-current-native-${{ github.sha }}
          path: ${{ runner.temp }}/titan-v4-current-native/
          if-no-files-found: error
          retention-days: 7
