name: titan-v31-b7-shed-room-guard

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/test_b7_shed_room_guard.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard/**'
      - '.github/workflows/titan-v31-b7-shed-room-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v31-b7-shed-room-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout literal event head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind frozen stack, repaired parent, exact scope, and reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          FROZEN='508b342fc46fa91e3d7cdc3f0b7e44934a187c14'
          REPAIRED_PARENT='2220a247a4471767a14becebf70546602286834b'
          WORKFLOW='.github/workflows/titan-v31-b7-shed-room-guard.yml'
          SOURCE='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard.py'
          TEST='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/test_b7_shed_room_guard.py'
          CANDIDATE='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard/candidate.py'
          R04='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py'

          EXPECTED_HEAD='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$FROZEN" HEAD)" = "$FROZEN"
          test "$(git merge-base "$REPAIRED_PARENT" HEAD)" = "$REPAIRED_PARENT"

          test "$(git hash-object "$SOURCE")" = 'a27da659884c0f9a9594cbd9332b5edb4d7f3307'
          test "$(git hash-object "$TEST")" = '406962b66cefbd5e2d6399da94e80df599aee0cc'
          test "$(git hash-object "$CANDIDATE")" = 'aeec4bb5f52f971cff376f8aae21edec3ad77c3a'
          test "$(git hash-object "$R04")" = '21c4f1db0298f8955b1f5ad366bd780a89cad206'

          python3 - <<'PY'
          import subprocess

          frozen = '508b342fc46fa91e3d7cdc3f0b7e44934a187c14'
          parent = '2220a247a4471767a14becebf70546602286834b'
          workflow = '.github/workflows/titan-v31-b7-shed-room-guard.yml'
          expected_stack = {
              workflow,
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/test_b7_shed_room_guard.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard/candidate.py',
          }
          stack = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{frozen}...HEAD'], text=True
          ).splitlines())
          if stack != expected_stack:
              raise SystemExit(f'wrong frozen->HEAD B7 scope: {sorted(stack)!r}')

          child = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{parent}...HEAD'], text=True
          ).splitlines())
          if child != {workflow}:
              raise SystemExit(f'wrong repaired-parent->HEAD child scope: {sorted(child)!r}')
          print('B7 EXACT TOPOLOGY OK')
          PY

      - name: Compile in memory and run focused predecessors
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          for name in (
              'b7_shed_room_guard.py',
              'test_b7_shed_room_guard.py',
              'b7_shed_room_guard/candidate.py',
          ):
              path = Path(name)
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('B7 COMPILE OK')
          PY
          python3 -B -m unittest -v test_b7_shed_room_guard.py

      - name: Bind engine theorem and candidate custody
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import importlib.util
          from pathlib import Path
          import build_v3

          lab = Path('../..').resolve()
          engine = lab / 'reference' / 'engine' / 'kaggriculture.py'
          engine_sha = hashlib.sha256(engine.read_bytes()).hexdigest()
          expected_engine_sha = 'bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          assert engine_sha == expected_engine_sha, (engine_sha, expected_engine_sha)

          candidate = Path('experiments/b7_shed_room_guard/candidate.py').resolve()
          spec = importlib.util.spec_from_file_location('b7_candidate', candidate)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = {
              'r04_sale_horizon': 8,
              'r04_open_roundtrip': 0,
              'r04_row_order': True,
              'r04_evening_flush': True,
              'r04_sale_fertilizer': True,
              'r04_cattle_early': True,
              'b7_shed_room_guard': True,
              'official_interpreter_commit': '28b6d8af3ce73926b3d0fda1410c1ddd8384ab8c',
              'official_engine_sha256': expected_engine_sha,
          }
          assert set(module.B7_EVALUATOR_CONFIG) == set(expected)
          for key, value in expected.items():
              actual = module.B7_EVALUATOR_CONFIG[key]
              assert type(actual) is type(value) and actual == value, (key, actual, value)
          assert module.agent.b7_enabled is True
          assert not any(name.startswith('experiments/') for name in build_v3.source_shas())
          print('B7 CUSTODY OK', engine_sha)
          PY

      - name: Prove checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
