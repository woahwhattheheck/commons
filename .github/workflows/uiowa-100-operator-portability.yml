name: uiowa-100-operator-portability

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'revenue/uiowa_rfq_18649_operator_portability/**'
      - 'revenue/uiowa_rfq_18649_workshare/*.py'
      - 'revenue/uiowa_rfq_18649_workshare/fixtures/synthetic_packet.json'
      - 'revenue/uiowa_rfq_18649_workshare/fixtures/synthetic_authority.json'
      - 'revenue/uiowa_rfq_18649_workbench/server.py'
      - 'revenue/uiowa_rfq_18649_workbench/index.html'
      - 'revenue/uiowa_rfq_18649_workbench/app.js'
      - 'revenue/uiowa_rfq_18649_workbench/style.css'
      - '.github/workflows/uiowa-100-operator-portability.yml'

permissions:
  contents: read

jobs:
  portable-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            revenue/uiowa_rfq_18649_operator_portability
            revenue/uiowa_rfq_18649_workshare
            revenue/uiowa_rfq_18649_workbench
      - name: Exact-source contract tests and two-operator execution
        shell: bash
        run: |
          set -euo pipefail
          DIR=revenue/uiowa_rfq_18649_operator_portability
          python3 -m py_compile "$DIR/uiowa100_portability.py" "$DIR/test_uiowa100_portability.py"
          python3 -m unittest discover -s "$DIR" -p 'test_uiowa100_portability.py' -v
          python3 -O -m unittest discover -s "$DIR" -p 'test_uiowa100_portability.py' -v
          python3 "$DIR/uiowa100_portability.py" acceptance --root . --revision "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/uiowa100-normal"
          python3 -O "$DIR/uiowa100_portability.py" acceptance --root . --revision "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/uiowa100-optimized"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          normal = json.loads((root / 'uiowa100-normal/acceptance.json').read_text())
          optimized = json.loads((root / 'uiowa100-optimized/acceptance.json').read_text())
          if normal['outputs'] != optimized['outputs']:
              raise SystemExit('normal/optimized report bytes disagree')
          print('PASS: normal/optimized and both operator locations produce identical report bytes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uiowa100-operator-portability-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/uiowa100-normal/
            ${{ runner.temp }}/uiowa100-optimized/
          if-no-files-found: warn
          retention-days: 30
