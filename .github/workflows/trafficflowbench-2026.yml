name: trafficflowbench-2026

on:
  push:
    branches:
      - main
    paths:
      - 'revenue/trafficflowbench_2026/**'
      - 'tests/test_trafficflowbench_2026.py'
      - 'test_trafficflowbench_2026.py'
      - '.github/workflows/trafficflowbench-2026.yml'
  pull_request:
    paths:
      - 'revenue/trafficflowbench_2026/**'
      - 'tests/test_trafficflowbench_2026.py'
      - 'test_trafficflowbench_2026.py'
      - '.github/workflows/trafficflowbench-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}"
  cancel-in-progress: true

jobs:
  exact-carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: syntax proof
        run: >-
          python3 -m py_compile
          revenue/trafficflowbench_2026/__init__.py
          revenue/trafficflowbench_2026/benchmark.py
          revenue/trafficflowbench_2026/contract.py
          revenue/trafficflowbench_2026/methods.py
          revenue/trafficflowbench_2026/scoring.py
          revenue/trafficflowbench_2026/submission.py
          tests/test_trafficflowbench_2026.py
          test_trafficflowbench_2026.py

      - name: exact retained suite
        run: python3 test_trafficflowbench_2026.py

      - name: exact retained suite under optimized Python
        run: python3 -O test_trafficflowbench_2026.py
