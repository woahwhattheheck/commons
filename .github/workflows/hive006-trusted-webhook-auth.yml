name: hive006-trusted-webhook-auth

on:
  pull_request:
    paths:
      - 'revenue/hive/voice-support-desk/**'
      - '.github/workflows/hive006-trusted-webhook-auth.yml'

permissions:
  contents: read

jobs:
  exact-head-webhook-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RECOVERY_COMMIT_SHA: '892a9cbb3c198a5a08fd0c5a6be26e27f66fa9af'
      CURRENT_MAIN_SHA: 'de815e79f3ae9acfa380ce6ee91b396c8d6783f4'
      REVIEWED_STACK_SHA: '0186228c6b2a7d87c17692a3e1f1b3f7f2c8d8fd'
    steps:
      - name: Checkout literal event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Assert exact reconciled mainline recovery
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git rev-parse HEAD^1)" = "$RECOVERY_COMMIT_SHA"
          test "$(git rev-parse HEAD^2)" = "$CURRENT_MAIN_SHA"

          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/workflows/hive006-trusted-webhook-auth.yml
          p/sol-astra-hive006-trusted-webhook-auth-20260910-01.md
          p/zccw-hive006-trusted-webhook-mainline-recovery-20260915.md
          revenue/hive/voice-support-desk/TRUSTED-WEBHOOK.md
          revenue/hive/voice-support-desk/requirements-webhook.txt
          revenue/hive/voice-support-desk/test_twilio_webhook.py
          revenue/hive/voice-support-desk/twilio_webhook.py
          EOF
          git diff --name-only "$CURRENT_MAIN_SHA" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

          test "$(git hash-object revenue/hive/voice-support-desk/twilio_webhook.py)" = '1a1680ce9bc7ae16218d104f550c597c028ed3b4'
          test "$(git hash-object revenue/hive/voice-support-desk/test_twilio_webhook.py)" = 'e4ee5e4e2ce95937dedf017d76c6cbf61a1eae46'
          test "$(git hash-object revenue/hive/voice-support-desk/TRUSTED-WEBHOOK.md)" = '3b4b4d408b5a6e76a9c3176cfb04695f8b97ec40'
          test "$(git hash-object revenue/hive/voice-support-desk/requirements-webhook.txt)" = '81bbbb77cad8525f63563615fdb3312b63a91fef'
          test "$(git hash-object p/sol-astra-hive006-trusted-webhook-auth-20260910-01.md)" = 'd10644a81a47bbac45db4918f114a3e8a5955fb3'
          test "$(git hash-object revenue/hive/voice-support-desk/desk.py)" = '1b73693c58f618d961dd38f6d33f525a7c0ee01a'
          test "$(git hash-object revenue/hive/voice-support-desk/merchant_auth.py)" = '8c98004cf909d96dca771d447c4b583a37713d32'

      - name: Install pinned provider validator
        working-directory: revenue/hive/voice-support-desk
        run: python -m pip install --disable-pip-version-check -r requirements-webhook.txt

      - name: Compile recovered edge against current core
        working-directory: revenue/hive/voice-support-desk
        run: python -m py_compile desk.py merchant_auth.py twilio_webhook.py test_desk.py test_merchant_auth.py test_twilio_webhook.py

      - name: Run original and authenticated-edge suites
        working-directory: revenue/hive/voice-support-desk
        run: python -W error::ResourceWarning -B -m unittest -v test_desk.py test_merchant_auth.py test_twilio_webhook.py

      - name: Assert clean tree
        run: |
          find revenue/hive/voice-support-desk -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
