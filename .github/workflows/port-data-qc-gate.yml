name: Port Data QC Gate

on:
  pull_request:
    paths:
      - "revenue/port_data_qc_gate/**"
      - ".github/workflows/port-data-qc-gate.yml"
  push:
    branches:
      - main
    paths:
      - "revenue/port_data_qc_gate/**"
      - ".github/workflows/port-data-qc-gate.yml"

permissions:
  contents: read

concurrency:
  group: port-data-qc-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: Python ${{ matrix.python-version }} gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile QC authority boundary
        run: >-
          python -m py_compile
          revenue/port_data_qc_gate/gate.py
          revenue/port_data_qc_gate/test_gate.py
      - name: Run QC regressions
        run: python -m unittest revenue.port_data_qc_gate.test_gate -v
      - name: Run assertion-independent QC regressions
        run: python -O -m unittest revenue.port_data_qc_gate.test_gate -v
