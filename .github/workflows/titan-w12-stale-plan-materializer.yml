name: titan-w12-stale-plan-materializer

on:
  push:
    branches:
      - 'sol/relay-titan-w12-stale-plan-state-20260909-01'
    paths:
      - '.github/workflows/titan-w12-stale-plan-materializer.yml'

permissions:
  contents: write

concurrency:
  group: titan-w12-stale-plan-materializer
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_PARENT: cbaafbc8a3ae2c138bf515f317299a4ef218f430
      BRANCH: sol/relay-titan-w12-stale-plan-state-20260909-01
      LAB: revenue/kaggriculture/cloud-execution-lab
      SOURCE_PATH: revenue/kaggriculture/cloud-execution-lab/spatial_tempo.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - name: Verify immutable source ancestry and blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SOURCE_PARENT" "$GITHUB_SHA")" = "$SOURCE_PARENT"
          test "$(git hash-object "$SOURCE_PATH")" = edbc423023479dbe2e78131495334384a87b607f
          test -f .github/titan-w12-materialize.py

      - name: Patch source and write focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/titan-w12-materialize.py patch
          python3 -m py_compile "$SOURCE_PATH" "$LAB/test_w12_stale_plan_state.py"

      - name: Prove predecessor failure and current contracts
        shell: bash
        run: |
          set -euo pipefail
          cp "$SOURCE_PATH" /tmp/spatial_tempo.patched.py
          git show "$SOURCE_PARENT:$SOURCE_PATH" > "$SOURCE_PATH"
          set +e
          (cd "$LAB" && python3 -B -m unittest test_w12_stale_plan_state -v) > predecessor.log 2>&1
          predecessor_status=$?
          set -e
          test "$predecessor_status" -ne 0
          grep -q 'FAILED' predecessor.log
          printf '%s\n' "$predecessor_status" > predecessor.status
          cp /tmp/spatial_tempo.patched.py "$SOURCE_PATH"
          (cd "$LAB" && python3 -B -m unittest test_w12_stale_plan_state -v) 2>&1 | tee focused.log
          grep -q '^OK$' focused.log

      - name: Run adjacent retained-plan contracts
        shell: bash
        run: |
          set -euo pipefail
          (cd "$LAB" && python3 -B -m unittest test_idle_fertilizer test_weed_continuation -v) 2>&1 | tee adjacent.log
          grep -q '^OK$' adjacent.log

      - name: Prove disposable canonical build and check
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w12-cloud-execution-lab
          cp -a "$LAB" /tmp/w12-cloud-execution-lab
          (cd /tmp/w12-cloud-execution-lab && python3 -B build_integrated.py && python3 -B build_integrated.py --check) 2>&1 | tee build-check.log

      - name: Write durable evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/titan-w12-materialize.py receipt

      - name: Commit exact guarded patch and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          rm .github/workflows/titan-w12-stale-plan-materializer.yml
          rm .github/titan-w12-materialize.py
          git add -- \
            .github/workflows/titan-w12-stale-plan-materializer.yml \
            .github/titan-w12-materialize.py \
            "$SOURCE_PATH" \
            "$LAB/test_w12_stale_plan_state.py" \
            "$LAB/analysis/w12-stale-plan-state/witness.json" \
            "$LAB/analysis/w12-stale-plan-state/verification.json" \
            p/sol-relay-titan-w12-stale-plan-state-20260909-01.md
          python3 -c "import subprocess; c=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()); e={'.github/workflows/titan-w12-stale-plan-materializer.yml','.github/titan-w12-materialize.py','revenue/kaggriculture/cloud-execution-lab/spatial_tempo.py','revenue/kaggriculture/cloud-execution-lab/test_w12_stale_plan_state.py','revenue/kaggriculture/cloud-execution-lab/analysis/w12-stale-plan-state/witness.json','revenue/kaggriculture/cloud-execution-lab/analysis/w12-stale-plan-state/verification.json','p/sol-relay-titan-w12-stale-plan-state-20260909-01.md'}; assert c==e,(c^e,c)"
          git config user.name 'SOL-RELAY W12'
          git config user.email 'tokenjunkielabs@gmail.com'
          git commit -m 'fix(titan): invalidate stale optional harvest plans'
          git push origin "HEAD:refs/heads/$BRANCH"
