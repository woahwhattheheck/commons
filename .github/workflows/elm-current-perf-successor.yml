name: ELM TITAN successor performance consumer

on:
  push:
    branches:
      - astra/elm-current-perf-successor-20260908-1213

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify exact successor preconditions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json'
          r=json.load(open(p))
          assert r['sha256']=='499989ab907331d4c0c990af2ab3703e6731dc83078964aca8563ea5a069e48e', r
          assert r['bytes']==313471 and r['runtime_files']==83, r
          PY
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/frozen_selected.py)" = 58fde0ad70cbec2c653c7383a6c2835e6726423a
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/scheduler.py)" = 97085acebd7268e87a09e4b5c1bf7d049038cb25
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/reference/integrated-selected/alder/seed_budget.py)" = ef21710d6275a7146854b0fde46f00beb2dcb372
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/reference/titan-current/deadline_adapter.py)" = 184ff5354451d764df95ffb5c952eecd0f4266f0
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/build_integrated.py)" = 8ca5fcae2f49a14f1dc166ed8c1ca391a350e081
          git apply --check --directory=revenue/kaggriculture/cloud-execution-lab revenue/kaggriculture/cloud-quickstep/frozen_selected.integration.patch
          git apply --check revenue/kaggriculture/cloud-worker-trace/worker-trace-lines.patch

      - name: Compose landed helpers without changing policy defaults
        shell: bash
        run: |
          set -euo pipefail
          git apply --directory=revenue/kaggriculture/cloud-execution-lab revenue/kaggriculture/cloud-quickstep/frozen_selected.integration.patch
          git apply revenue/kaggriculture/cloud-worker-trace/worker-trace-lines.patch
          python - <<'PY'
          from pathlib import Path

          root=Path('revenue/kaggriculture/cloud-execution-lab')
          def once(path, old, new):
              text=path.read_text(encoding='utf-8')
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}')
              path.write_text(text.replace(old,new),encoding='utf-8')

          scheduler=root/'scheduler.py'
          once(scheduler,'import mechanics as m\n','import mechanics as m\nfrom observed_clone import detached_json_value\n')
          once(scheduler,
               "    farm, private = copy.deepcopy(obs['farms'][obs['player']]), copy.deepcopy(obs['private'])\n",
               "    farm = detached_json_value(obs['farms'][obs['player']])\n    private = detached_json_value(obs['private'])\n")

          seed=root/'reference/integrated-selected/alder/seed_budget.py'
          once(seed,'from collections import Counter\n','from plant_suffix import immutable_plant_suffixes\n')
          old='''    for name, route in routes.items():\n        suffix = [Counter() for _ in range(len(route) + 1)]\n        for t in range(len(route) - 1, -1, -1):\n            suffix[t] = suffix[t + 1].copy()\n            row = route[t]\n            for action in [row.get("farmer", []), *row.get("hands", [])]:\n                if len(action) >= 2 and action[0] == "PLANT":\n                    suffix[t][action[1]] += 1\n        suffixes[name] = tuple(MappingProxyType(dict(c)) for c in suffix)\n'''
          once(seed,old,"""    for name, route in routes.items():\n        suffixes[name] = immutable_plant_suffixes(route)\n""")

          builder=root/'build_integrated.py'
          anchor="    mapping={p:p for p in RUNTIME if p not in ('integrated_main.py','integrated_parent.py')}\n"
          once(builder,anchor,anchor+
               "    mapping['seller_snapshot.py']='../cloud-quickstep/seller_snapshot.py'\n"+
               "    mapping['observed_clone.py']='../cloud-runtime-pulse/observed_clone.py'\n"+
               "    mapping['plant_suffix.py']='../cloud-runtime-pulse/plant_suffix.py'\n")
          PY

      - name: Run source-bound component checks
        shell: bash
        run: |
          set -euo pipefail
          python -B revenue/kaggriculture/cloud-runtime-pulse/test_observed_clone.py
          python -B revenue/kaggriculture/cloud-runtime-pulse/test_plant_suffix.py
          python -B revenue/kaggriculture/cloud-worker-trace/trace_compatibility_check.py \
            --source revenue/kaggriculture/cloud-execution-lab/reference/titan-current/deadline_adapter.py \
            --report /tmp/worker-trace-composed.json
          python -B -m py_compile \
            revenue/kaggriculture/cloud-execution-lab/frozen_selected.py \
            revenue/kaggriculture/cloud-execution-lab/scheduler.py \
            revenue/kaggriculture/cloud-execution-lab/reference/integrated-selected/alder/seed_budget.py \
            revenue/kaggriculture/cloud-execution-lab/reference/titan-current/deadline_adapter.py \
            revenue/kaggriculture/cloud-execution-lab/build_integrated.py

      - name: Rebuild and verify the single successor CURRENT package
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab
          python -B build_integrated.py | tee /tmp/build-receipt.json
          python -B build_integrated.py --check | tee /tmp/check-receipt.json
          rm -rf /tmp/titan-current-extracted
          mkdir -p /tmp/titan-current-extracted
          tar -xzf exports/titan-current.tar.gz -C /tmp/titan-current-extracted
          python -B ../cloud-quickstep/test_fastpath.py --package /tmp/titan-current-extracted
          for test in test_route_recovery.py test_module_recovery.py test_seed_derived.py test_worker_deadline.py test_entrypoint_clock.py test_funded_payback_runtime.py; do
            PYTHONPATH=/tmp/titan-current-extracted:/tmp/titan-current-extracted/checks python -B "/tmp/titan-current-extracted/checks/$test"
          done
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          receipt=json.loads((root/'runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())
          assert receipt['runtime_files']==86, receipt
          manifest=json.loads((root/'runtime/integrated-selected/CURRENT-SOURCE.json').read_text())
          for name in ('seller_snapshot.py','observed_clone.py','plant_suffix.py','funded_payback.py','funded_payback_runtime.py'):
              assert name in manifest['runtime'], name
          assert hashlib.sha256((root/'reference/titan-current/deadline_adapter.py').read_bytes()).hexdigest()=='7f70a25dfb703f50aa83cd281a9722d575571da1073e605c5927fc35453ab486'
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Commit coherent successor package and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/elm-current-perf-successor.yml
          git add revenue/kaggriculture/cloud-execution-lab
          git diff --cached --check
          git commit -m 'Compose TITAN performance helpers into successor current'
          git push origin HEAD:${GITHUB_REF_NAME}
