name: titan-v5-promotion-release-gates

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v5-promotion-release-gates.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/**"

permissions:
  contents: read

concurrency:
  group: titan-v5-promotion-release-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact triggering head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run promotion/release contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m py_compile \
            economics_gate.py release_transaction.py promotion_gate.py \
            test_economics_gate.py test_release_transaction.py test_promotion_gate.py
          python -B -m unittest -v \
            test_economics_gate test_release_transaction test_promotion_gate
          python -O -B -m unittest -v \
            test_economics_gate test_release_transaction test_promotion_gate
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
