name: titan-e02-canonicalize

on:
  push:
    branches:
      - sol-astra-e02-rival-arrival-20260909
    paths:
      - .github/workflows/titan-e02-canonicalize.yml

permissions:
  contents: write

concurrency:
  group: titan-e02-canonicalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build and verify deterministic canonical TITAN
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab
          python3 build_integrated.py
          python3 build_integrated.py --check
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = {
              'exports/titan-current.tar.gz': ('476f8039abac9665a927bdf8841af0cad2c263cd35c2039d7ff95cb3e7a61df6', 413652),
              'runtime/integrated-selected/CURRENT-SOURCE.json': ('90499028d2552b401bb44f662ae7786392c11800f8735b0bafbf963abe99a129', 42487),
              'runtime/integrated-selected/CURRENT-ARCHIVE.json': ('2a73d3a1316f70d9d867f6f244794f028156b04ce873c38e652d2ac8affcb7e1', 403),
              'exports/historical/titan-f8f1750266b3cfaea0ebfe663f287aa9c5a2682f6fc47bc932957e1d48e63f1c.tar.gz': ('f8f1750266b3cfaea0ebfe663f287aa9c5a2682f6fc47bc932957e1d48e63f1c', 409345),
          }
          for name, (digest, size) in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if (actual, len(data)) != (digest, size):
                  raise SystemExit(f'{name}: got {(actual, len(data))}, expected {(digest, size)}')
          receipt = json.loads(Path('runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())
          if receipt['runtime_files'] != 105 or receipt['sha256'] != expected['exports/titan-current.tar.gz'][0]:
              raise SystemExit('canonical receipt does not describe E02 archive')
          print(json.dumps({'canonical_sha256': receipt['sha256'], 'runtime_files': receipt['runtime_files']}))
          PY
      - name: Commit only generated canonical package
        shell: bash
        run: |
          set -euo pipefail
          expected_current='revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'
          expected_history='revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-f8f1750266b3cfaea0ebfe663f287aa9c5a2682f6fc47bc932957e1d48e63f1c.tar.gz'
          expected_source='revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json'
          expected_receipt='revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json'
          git add -f -- "$expected_current" "$expected_history" "$expected_source" "$expected_receipt"
          python3 - <<'PY'
          import subprocess
          expected = {
              'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz',
              'revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-f8f1750266b3cfaea0ebfe663f287aa9c5a2682f6fc47bc932957e1d48e63f1c.tar.gz',
              'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json',
              'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'generated path set mismatch: {sorted(actual)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'TITAN E02: publish canonical package'
          git push origin HEAD:sol-astra-e02-rival-arrival-20260909
