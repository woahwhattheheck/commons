name: keep-sell-numeric-one-shot

on:
  push:
    branches:
      - astra/keep-sell-numeric-validation-20260908

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/keep-sell-numeric-validation-20260908
          fetch-depth: 1
      - name: Reproduce original failure, apply narrow repair, and publish exact evidence
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=host/business_pack_keep_sell.py
          TEST=test_business_pack_keep_sell_numeric.py
          RECEIPT=p/astra-bridge-keep-sell-numeric-validation-20260908-01.md
          test "$(git hash-object "$SOURCE")" = a375adf9b3d6d0bd4273639da0aa9953bc33870e

          cat > "$TEST" <<'PY'
          #!/usr/bin/env python3
          """Malformed numeric ledgers must return validation errors, not exceptions."""
          from __future__ import annotations

          from contextlib import redirect_stdout
          from copy import deepcopy
          import importlib.util
          import io
          import json
          from pathlib import Path
          import tempfile
          import unittest

          ROOT = Path(__file__).resolve().parent
          MODULE_PATH = ROOT / "host" / "business_pack_keep_sell.py"

          def load_module():
              spec = importlib.util.spec_from_file_location("keep_sell_numeric_under_test", MODULE_PATH)
              module = importlib.util.module_from_spec(spec)
              assert spec.loader is not None
              spec.loader.exec_module(module)
              return module

          MOD = load_module()

          class NumericValidationTests(unittest.TestCase):
              def ledger(self):
                  return MOD.empty_ledger()

              def test_malformed_cash_values_return_errors(self):
                  for value in ("not-a-number", "NaN", "Infinity", True, object()):
                      with self.subTest(value=repr(value)):
                          ledger = self.ledger()
                          ledger["cash_usd"] = value
                          errors = MOD.validate_ledger(ledger)
                          self.assertTrue(any("cash_usd must be a finite decimal" in row for row in errors))

              def test_malformed_buyer_values_return_errors(self):
                  for value in ("oops", 0.5, float("nan"), True, object()):
                      with self.subTest(value=repr(value)):
                          ledger = self.ledger()
                          ledger["buyers"] = value
                          errors = MOD.validate_ledger(ledger)
                          self.assertTrue(any("buyers must be an integer" in row for row in errors))

              def test_malformed_tiers_return_errors(self):
                  for value in ("oops", 20.5, float("nan"), True, object()):
                      with self.subTest(value=repr(value)):
                          ledger = self.ledger()
                          MOD.record_decision(ledger, pack_id="numeric-test-pack-20260908", decision="SELL", title="Numeric test")
                          ledger["packs"][0]["tier_usd"] = value
                          errors = MOD.validate_ledger(ledger)
                          self.assertTrue(any("tier_usd must be an integer" in row for row in errors))

              def test_wrong_pack_container_returns_error(self):
                  for value in ({"id": "not-a-list"}, "not-a-list", 7):
                      with self.subTest(value=repr(value)):
                          ledger = self.ledger()
                          ledger["packs"] = value
                          errors = MOD.validate_ledger(ledger)
                          self.assertIn("packs must be a list", errors)

              def test_integral_encodings_remain_accepted(self):
                  for tier in (20, 20.0, "20"):
                      with self.subTest(tier=tier):
                          ledger = self.ledger()
                          ledger["cash_usd"] = "0.000"
                          ledger["buyers"] = "0"
                          MOD.record_decision(ledger, pack_id="integral-tier-pack-20260908", decision="KEEP", title="Integral tier")
                          ledger["packs"][0]["tier_usd"] = tier
                          self.assertEqual(MOD.validate_ledger(ledger), [])

              def test_nonzero_and_unknown_values_keep_existing_messages(self):
                  ledger = self.ledger()
                  ledger["cash_usd"] = "1.25"
                  ledger["buyers"] = 1
                  MOD.record_decision(ledger, pack_id="unknown-tier-pack-20260908", decision="SELL", title="Unknown tier")
                  ledger["packs"][0]["tier_usd"] = 30
                  errors = MOD.validate_ledger(ledger)
                  self.assertIn("cash_usd must stay 0.00 without BANK_AVAILABLE", errors)
                  self.assertIn("buyers must stay 0 without a receipt", errors)
                  self.assertIn("unknown-tier-pack-20260908 tier_usd must be one of (20, 100, 200, 1000, 10000)", errors)

              def test_cli_validate_reports_invalid_without_traceback(self):
                  ledger = self.ledger()
                  ledger["cash_usd"] = "not-a-number"
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "ledger.json"
                      path.write_text(json.dumps(ledger), encoding="utf-8")
                      output = io.StringIO()
                      with redirect_stdout(output):
                          code = MOD.main(["--ledger", str(path), "validate"])
                  self.assertEqual(code, 1)
                  self.assertTrue(output.getvalue().startswith("INVALID\n"))
                  self.assertIn("cash_usd must be a finite decimal", output.getvalue())

              def test_valid_current_ledger_and_mutation_isolation(self):
                  ledger = self.ledger()
                  before = deepcopy(ledger)
                  self.assertEqual(MOD.validate_ledger(ledger), [])
                  self.assertEqual(ledger, before)

          if __name__ == "__main__":
              unittest.main()
          PY

          set +e
          python3 -m unittest -v "$TEST" > /tmp/original-numeric.log 2>&1
          original_status=$?
          set -e
          test "$original_status" -ne 0
          grep -Eq 'FAILED \(failures=|FAILED \(errors=' /tmp/original-numeric.log

          python3 "$SOURCE" validate > /tmp/original-validate.log
          python3 "$SOURCE" list > /tmp/original-list.log
          python3 "$SOURCE" --self-test > /tmp/original-self-test.log
          cp "$SOURCE" /tmp/business_pack_keep_sell.original.py

          cat > /tmp/numeric.patch <<'PATCH'
          --- a/host/business_pack_keep_sell.py
          +++ b/host/business_pack_keep_sell.py
          @@ -17,7 +17,7 @@ import re
           import sys
           import tempfile
          -from decimal import Decimal
          +from decimal import Decimal, InvalidOperation
           from pathlib import Path
           from typing import Any
          @@ -54,6 +54,28 @@ def _pack_map(ledger: dict[str, Any]) -> dict[str, dict[str, Any]]:
               return rows
           
           
          +def _finite_decimal(value: Any) -> Decimal | None:
          +    """Parse one finite JSON-style number without leaking decimal errors."""
          +    if isinstance(value, bool):
          +        return None
          +    try:
          +        parsed = Decimal(str(value))
          +    except (InvalidOperation, TypeError, ValueError):
          +        return None
          +    return parsed if parsed.is_finite() else None
          +
          +
          +def _integral_value(value: Any) -> int | None:
          +    """Return an exact finite integer; fractional and boolean values are invalid."""
          +    parsed = _finite_decimal(value)
          +    if parsed is None or parsed != parsed.to_integral_value():
          +        return None
          +    try:
          +        return int(parsed)
          +    except (OverflowError, ValueError):
          +        return None
          +
          +
           def checkout_is_live_payment_link(url: str) -> bool:
               text = str(url or "").strip()
               if not text:
          @@ -88,9 +110,19 @@ def validate_ledger(ledger: dict[str, Any]) -> list[str]:
               channel = ledger.get("slack_channel") or {}
               if not isinstance(channel, dict) or channel.get("id") != SLACK_CHANNEL_ID:
                   errors.append("slack_channel.id must be %s" % SLACK_CHANNEL_ID)
          -    if Decimal(str(ledger.get("cash_usd") or "0")) != Decimal("0.00"):
          +    cash_raw = ledger.get("cash_usd")
          +    cash = _finite_decimal("0" if cash_raw in (None, "") else cash_raw)
          +    if cash is None:
          +        errors.append("cash_usd must be a finite decimal")
          +    elif cash != Decimal("0.00"):
                   errors.append("cash_usd must stay 0.00 without BANK_AVAILABLE")
          -    if int(ledger.get("buyers") or 0) != 0:
          +    buyers_raw = ledger.get("buyers")
          +    buyers = _integral_value(0 if buyers_raw in (None, "") else buyers_raw)
          +    if buyers is None:
          +        errors.append("buyers must be an integer")
          +    elif buyers != 0:
                   errors.append("buyers must stay 0 without a receipt")
               honesty = ledger.get("honesty") or {}
               if not isinstance(honesty, dict):
          @@ -101,8 +133,14 @@ def validate_ledger(ledger: dict[str, Any]) -> list[str]:
                       if honesty.get(flag) is not True:
                           errors.append("honesty.%s must be true" % flag)
               seen = set()
          -    for item in ledger.get("packs") or []:
          +    packs = ledger.get("packs")
          +    if packs is None:
          +        packs = []
          +    elif not isinstance(packs, list):
          +        errors.append("packs must be a list")
          +        packs = []
          +    for item in packs:
                   if not isinstance(item, dict):
                       errors.append("pack row is not an object")
                       continue
          @@ -120,8 +158,12 @@ def validate_ledger(ledger: dict[str, Any]) -> list[str]:
                   if not title:
                       errors.append("%s needs a title" % pack_id)
                   tier = item.get("tier_usd")
          -        if tier not in (None, "") and int(tier) not in TIERS_USD:
          -            errors.append("%s tier_usd must be one of %s" % (pack_id, TIERS_USD))
          +        if tier not in (None, ""):
          +            parsed_tier = _integral_value(tier)
          +            if parsed_tier is None:
          +                errors.append("%s tier_usd must be an integer" % pack_id)
          +            elif parsed_tier not in TIERS_USD:
          +                errors.append("%s tier_usd must be one of %s" % (pack_id, TIERS_USD))
                   url = str(item.get("checkout_url") or "").strip()
                   if url:
                       if item.get("owner_pasted") is not True:
          PATCH
          git apply --check /tmp/numeric.patch
          git apply /tmp/numeric.patch

          python3 -m py_compile "$SOURCE" test_business_pack_keep_sell.py "$TEST"
          python3 "$SOURCE" validate > /tmp/repaired-validate.log
          python3 "$SOURCE" list > /tmp/repaired-list.log
          python3 "$SOURCE" --self-test > /tmp/repaired-self-test.log
          diff -u /tmp/original-validate.log /tmp/repaired-validate.log
          diff -u /tmp/original-list.log /tmp/repaired-list.log
          diff -u /tmp/original-self-test.log /tmp/repaired-self-test.log
          python3 -m unittest -v test_business_pack_keep_sell.py "$TEST" 2>&1 | tee /tmp/repaired-tests.log
          grep -q '^Ran 16 tests' /tmp/repaired-tests.log
          grep -q '^OK$' /tmp/repaired-tests.log

          source_sha="$(sha256sum "$SOURCE" | cut -d' ' -f1)"
          source_blob="$(git hash-object "$SOURCE")"
          test_sha="$(sha256sum "$TEST" | cut -d' ' -f1)"
          original_log_sha="$(sha256sum /tmp/original-numeric.log | cut -d' ' -f1)"
          repaired_log_sha="$(sha256sum /tmp/repaired-tests.log | cut -d' ' -f1)"
          {
            echo '# KEEP vs SELL numeric validation repair'
            echo
            echo 'Operation: `astra-bridge-keep-sell-numeric-validation-20260908-01`'
            echo
            echo '## Behavior'
            echo
            echo 'Malformed `cash_usd`, `buyers`, `tier_usd`, and `packs` values now produce ordinary validation errors. They no longer escape `validate_ledger` as decimal, integer-conversion, or iteration exceptions. Valid integer encodings remain accepted; fractional, nonfinite, boolean, and nonnumeric values remain invalid. The live empty ledger and all existing KEEP/SELL/checkout behavior are unchanged.'
            echo
            echo '## Source and execution'
            echo
            echo '- Original source blob: `a375adf9b3d6d0bd4273639da0aa9953bc33870e`'
            echo "- Repaired source blob: \`$source_blob\`"
            echo "- Repaired source SHA-256: \`$source_sha\`"
            echo "- New test SHA-256: \`$test_sha\`"
            echo '- Original focused numeric suite: nonzero exit as expected; malformed values reproduce escaping exceptions and silent fractional coercion.'
            echo "- Original failure log SHA-256: \`$original_log_sha\`"
            echo '- Repaired execution: 16/16 methods pass — 8 existing factory tests plus 8 new numeric/container/CLI tests; zero failures, errors, or skips.'
            echo "- Repaired test log SHA-256: \`$repaired_log_sha\`"
            echo '- Existing `validate`, `list`, and `--self-test` stdout is byte-identical before and after the repair.'
            echo
            echo '## Scope'
            echo
            echo 'This repairs input validation only. It records no pack, decision, buyer, checkout URL, payment, revenue, marketing action, or ad spend. The honest ledger remains empty with cash USD 0. Original Cursor/GOAT implementation credit remains intact; ASTRA-BRIDGE-NUMERIC supplied this focused correction.'
            echo
            echo "Focused hosted run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Coordination claim: https://tokenjunkielabs.slack.com/archives/C0BU7JAPUH3/p1788847607627169?thread_ts=1788323828.692809&cid=C0BU7JAPUH3'
          } > "$RECEIPT"

          rm .github/workflows/keep-sell-numeric-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SOURCE" "$TEST" "$RECEIPT" .github/workflows/keep-sell-numeric-one-shot.yml
          git commit -m 'Return validation errors for malformed KEEP vs SELL numerics'
          git push origin HEAD:astra/keep-sell-numeric-validation-20260908
