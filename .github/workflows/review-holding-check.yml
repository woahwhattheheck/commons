name: review-holding-check

on:
  workflow_call:
    inputs:
      holding_json:
        description: One commons-review-holding/v1 record; empty means no holding.
        required: false
        type: string
        default: ""
      expected_head_sha:
        description: Exact 40-hex head the review holding may block.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      holding_json:
        description: One commons-review-holding/v1 record; empty means no holding.
        required: false
        type: string
        default: ""
      expected_head_sha:
        description: Exact 40-hex head the review holding may block.
        required: true
        type: string

permissions:
  contents: read
  checks: write

jobs:
  reduce:
    runs-on: ubuntu-latest
    env:
      HOLDING_JSON: ${{ inputs.holding_json }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate workflow source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Materialize holding input
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$HOLDING_JSON" ]; then
            printf '%s\n' "$HOLDING_JSON" > "$RUNNER_TEMP/review-holding.json"
          fi
      - name: Publish exact-head review-holding check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--expected-head-sha "$EXPECTED_HEAD_SHA" --publish-check)
          if [ -s "$RUNNER_TEMP/review-holding.json" ]; then
            args+=(--holding "$RUNNER_TEMP/review-holding.json")
          fi
          set +e
          python host/review_holding_check.py "${args[@]}"
          rc=$?
          set -e
          # PENDING intentionally maps to an in-progress Check Run. The
          # workflow itself finishes quickly and does not occupy a runner.
          if [ "$rc" -eq 3 ]; then
            exit 0
          fi
          exit "$rc"
