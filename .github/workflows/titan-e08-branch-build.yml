name: TITAN E08 branch build

on:
  push:
    branches:
      - sol/titan-v25-e08-event-horizon-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e08-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install official engine
        run: python3 -m pip install -q 'kaggle-environments==1.32.7'

      - name: Mount current canonical runtime support
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          rm -rf "$RUNNER_TEMP/e08-runtime"
          mkdir -p "$RUNNER_TEMP/e08-runtime"
          tar -xzf exports/titan-current.tar.gz -C "$RUNNER_TEMP/e08-runtime"
          test -f "$RUNNER_TEMP/e08-runtime/observed_clone.py"
          test -f "$RUNNER_TEMP/e08-runtime/scheduler.py"

      - name: E08 focused and neighboring contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          export PYTHONPATH="$PWD:$RUNNER_TEMP/e08-runtime"
          python3 -B test_event_horizon.py
          python3 -B test_scheduler.py
          python3 -B test_joint_market_slots.py
          python3 -B test_selected_pruning.py

      - name: Rebuild and verify deterministic canonical release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          export PYTHONPATH="$PWD:$RUNNER_TEMP/e08-runtime"
          python3 -B build_integrated.py | tee "$RUNNER_TEMP/e08-build-receipt.json"
          python3 -B build_integrated.py --check | tee "$RUNNER_TEMP/e08-check-receipt.json"
          sha256sum exports/titan-current.tar.gz runtime/integrated-selected/CURRENT-SOURCE.json runtime/integrated-selected/CURRENT-ARCHIVE.json | tee "$RUNNER_TEMP/e08-sha256.txt"
          test -f exports/historical/titan-6ac897241cb54baa205e4132fab1f83e7a21e4ae957e19e16c6c48a7ecbd8bc1.tar.gz

      - name: Stage generated release payload
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          mkdir -p "$RUNNER_TEMP/e08-release/runtime/integrated-selected" "$RUNNER_TEMP/e08-release/exports/historical"
          cp exports/titan-current.tar.gz "$RUNNER_TEMP/e08-release/exports/titan-current.tar.gz"
          cp runtime/integrated-selected/CURRENT-SOURCE.json "$RUNNER_TEMP/e08-release/runtime/integrated-selected/CURRENT-SOURCE.json"
          cp runtime/integrated-selected/CURRENT-ARCHIVE.json "$RUNNER_TEMP/e08-release/runtime/integrated-selected/CURRENT-ARCHIVE.json"
          cp exports/historical/titan-6ac897241cb54baa205e4132fab1f83e7a21e4ae957e19e16c6c48a7ecbd8bc1.tar.gz "$RUNNER_TEMP/e08-release/exports/historical/titan-6ac897241cb54baa205e4132fab1f83e7a21e4ae957e19e16c6c48a7ecbd8bc1.tar.gz"
          cp "$RUNNER_TEMP/e08-build-receipt.json" "$RUNNER_TEMP/e08-release/BUILD-RECEIPT.json"
          cp "$RUNNER_TEMP/e08-check-receipt.json" "$RUNNER_TEMP/e08-release/CHECK-RECEIPT.json"
          cp "$RUNNER_TEMP/e08-sha256.txt" "$RUNNER_TEMP/e08-release/SHA256SUMS.txt"

      - name: Upload E08 generated release
        uses: actions/upload-artifact@v4
        with:
          name: titan-e08-generated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e08-release/
          if-no-files-found: error
          retention-days: 7
