name: TITAN E08 branch build

on:
  push:
    branches:
      - sol/titan-v25-e08-event-horizon-20260909
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titan-e08-event-horizon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e08-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose E08 onto fresh main without losing seller peers
        run: |
          set -euo pipefail
          LAB="revenue/kaggriculture/cloud-execution-lab"
          cp "$LAB/frozen_selected.py" "$RUNNER_TEMP/e08-frozen.py"
          cp "$LAB/test_event_horizon.py" "$RUNNER_TEMP/test-event-horizon.py"
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          MAIN_FROZEN_BLOB="$(git rev-parse "origin/main:$LAB/frozen_selected.py")"
          test "$MAIN_FROZEN_BLOB" = "c68182a698077e6f28082a1f9b0d4f983c3bfae4"
          git merge --no-commit --no-ff origin/main || true
          git checkout --theirs -- "$LAB/frozen_selected.py" "$LAB/exports/titan-current.tar.gz" "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json"
          cp "$RUNNER_TEMP/e08-frozen.py" "$LAB/frozen_selected.py"
          cp "$RUNNER_TEMP/test-event-horizon.py" "$LAB/test_event_horizon.py"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('revenue/kaggriculture/cloud-execution-lab/frozen_selected.py')
          s=p.read_text()
          needle="    return shared_slot_ledger(all_plans,orders_at,max_orders)\n\n\ndef event_aware_horizon"
          insert="""    return shared_slot_ledger(all_plans,orders_at,max_orders)\n\n\ndef seller_choice_rank(info):\n    \"\"\"Return active admission plus deterministic rank for one optimizer report.\"\"\"\n    forced=bool(info.get('forced_feasibility',False))\n    accepted=bool(info.get('accepted',float(info.get('worst_relative_gain',0.0))>0))\n    score=float(info.get('acceptance_score',info.get('worst_relative_gain',0.0)))\n    return forced or accepted,(forced,score)\n\n\ndef event_aware_horizon"""
          assert s.count(needle)==1
          s=s.replace(needle,insert,1)
          old="            eligible=info['worst_relative_gain']>0 or info.get('forced_feasibility',False)\n            rank=(info.get('forced_feasibility',False),info['worst_relative_gain'])\n"
          assert s.count(old)==1
          s=s.replace(old,"            eligible,rank=seller_choice_rank(info)\n",1)
          old="                if best is None or rank>(best[2].get('forced_feasibility',False),best[2]['worst_relative_gain']):best=(item,plan,info)"
          assert s.count(old)==1
          s=s.replace(old,"                if best is None or rank>seller_choice_rank(best[2])[1]:best=(item,plan,info)",1)
          old="            ranked=sorted(options,key=lambda x:(x[2].get('forced_feasibility',False),x[2]['worst_relative_gain']),reverse=True)[:4]"
          assert s.count(old)==1
          s=s.replace(old,"            ranked=sorted(options,key=lambda x:seller_choice_rank(x[2])[1],reverse=True)[:4]",1)
          old="                           'named_worst_relative_gain':metrics['worst_relative_gain'],\n                           'worst_relative_gain':independent}"
          assert s.count(old)==1
          s=s.replace(old,"                           'named_worst_relative_gain':metrics['worst_relative_gain'],\n                           'worst_relative_gain':independent,\n                           'accepted':True,'acceptance_score':independent,\n                           'acceptance_rule':'joint_strict'}",1)
          old="                    if best is None or rank>(best[2].get('forced_feasibility',False),best[2]['worst_relative_gain']):"
          assert s.count(old)==1
          s=s.replace(old,"                    if best is None or rank>seller_choice_rank(best[2])[1]:",1)
          compile(s,str(p),'exec')
          p.write_text(s)
          PY
          git add "$LAB/frozen_selected.py" "$LAB/test_event_horizon.py" "$LAB/exports/titan-current.tar.gz" "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json"
          if git diff --name-only --diff-filter=U | grep .; then
            echo "Unresolved merge paths remain" >&2
            git status --short
            exit 1
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge fresh main into E08 while preserving seller acceptance"
          echo "COMPOSED_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"

      - name: Install official engine
        run: python3 -m pip install -q 'kaggle-environments==1.32.7'

      - name: Mount fresh-main canonical runtime support
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          OLD_SHA="$(python3 -c "import json; print(json.load(open('runtime/integrated-selected/CURRENT-ARCHIVE.json'))['sha256'])")"
          test "$OLD_SHA" = "34174be1b42e3e180617dc0d5e8a50db282c7d72bc833afe8feed2374fe8ebac"
          test "$(sha256sum exports/titan-current.tar.gz | awk '{print $1}')" = "$OLD_SHA"
          echo "E08_PARENT_ARCHIVE_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/e08-runtime"
          mkdir -p "$RUNNER_TEMP/e08-runtime"
          tar -xzf exports/titan-current.tar.gz -C "$RUNNER_TEMP/e08-runtime"
          test -f "$RUNNER_TEMP/e08-runtime/observed_clone.py"
          test -f "$RUNNER_TEMP/e08-runtime/scheduler.py"

      - name: E08 plus E18 and neighboring seller contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$RUNNER_TEMP/e08-runtime"
          python3 -B test_event_horizon.py
          python3 -B test_e18_acceptance_rules.py
          python3 -B test_scheduler.py
          python3 -B test_joint_market_slots.py
          python3 -B test_selected_pruning.py

      - name: Rebuild and verify deterministic canonical release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$RUNNER_TEMP/e08-runtime"
          python3 -B build_integrated.py | tee "$RUNNER_TEMP/e08-build-receipt.json"
          python3 -B build_integrated.py --check | tee "$RUNNER_TEMP/e08-check-receipt.json"
          NEW_SHA="$(sha256sum exports/titan-current.tar.gz | awk '{print $1}')"
          NEW_BYTES="$(stat -c%s exports/titan-current.tar.gz)"
          MANIFEST_SHA="$(sha256sum runtime/integrated-selected/CURRENT-SOURCE.json | awk '{print $1}')"
          test "$NEW_SHA" != "$E08_PARENT_ARCHIVE_SHA"
          python3 -c "import json,hashlib,pathlib; p=json.load(open('runtime/integrated-selected/CURRENT-ARCHIVE.json')); b=pathlib.Path('exports/titan-current.tar.gz').read_bytes(); m=pathlib.Path('runtime/integrated-selected/CURRENT-SOURCE.json').read_bytes(); assert p['sha256']==hashlib.sha256(b).hexdigest(); assert p['bytes']==len(b); assert p['source_manifest_sha256']==hashlib.sha256(m).hexdigest(); assert p['runtime_files']==104"
          test -f "exports/historical/titan-$E08_PARENT_ARCHIVE_SHA.tar.gz"
          test "$(sha256sum "exports/historical/titan-$E08_PARENT_ARCHIVE_SHA.tar.gz" | awk '{print $1}')" = "$E08_PARENT_ARCHIVE_SHA"
          echo "E08_NEW_ARCHIVE_SHA=$NEW_SHA" >> "$GITHUB_ENV"
          echo "E08_NEW_ARCHIVE_BYTES=$NEW_BYTES" >> "$GITHUB_ENV"
          echo "E08_NEW_MANIFEST_SHA=$MANIFEST_SHA" >> "$GITHUB_ENV"
          sha256sum exports/titan-current.tar.gz "exports/historical/titan-$E08_PARENT_ARCHIVE_SHA.tar.gz" runtime/integrated-selected/CURRENT-SOURCE.json runtime/integrated-selected/CURRENT-ARCHIVE.json | tee "$RUNNER_TEMP/e08-sha256.txt"

      - name: Upload E08 generated release audit
        uses: actions/upload-artifact@v4
        with:
          name: titan-e08-generated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz
            revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-${{ env.E08_PARENT_ARCHIVE_SHA }}.tar.gz
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json
            ${{ runner.temp }}/e08-build-receipt.json
            ${{ runner.temp }}/e08-check-receipt.json
            ${{ runner.temp }}/e08-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish merge plus verified release and remove temporary runner
        run: |
          set -euo pipefail
          BRANCH="sol/titan-v25-e08-event-horizon-20260909"
          LAB="revenue/kaggriculture/cloud-execution-lab"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git add "$LAB/exports/titan-current.tar.gz"
          git add "$LAB/exports/historical/titan-$E08_PARENT_ARCHIVE_SHA.tar.gz"
          git add "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json"
          git add "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json"
          git rm .github/workflows/titan-e08-branch-build.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" = "5"
          git commit -m "E08: publish deterministic canonical release"
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'E08 merged main %s; archive %s (%s bytes); manifest %s\n' "$COMPOSED_MAIN_SHA" "$E08_NEW_ARCHIVE_SHA" "$E08_NEW_ARCHIVE_BYTES" "$E08_NEW_MANIFEST_SHA" >> "$GITHUB_STEP_SUMMARY"
