name: poly-profiler-complete-reports-one-shot

"on":
  push:
    branches: ["astra/poly-profiler-complete-reports-20260908"]

permissions:
  contents: write

concurrency:
  group: poly-profiler-complete-reports-one-shot
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply retained patch and execute validation
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-runtime-budget
          test "$(git hash-object "$ROOT/profile_saved.py")" = "031f14ba3e15dd438f248a58a5f1143fc45f0d4b"
          test "$(git hash-object "$ROOT/test_child_reports.py")" = "0f7b1cacba615b614ae2b93833c53a87bd6567df"
          test "$(git hash-object "$ROOT/test_complete_reports.py")" = "c728ac232d5c2b04ef43349b6f97069f526c1dda"
          cp "$ROOT/profile_saved.py" "$RUNNER_TEMP/profile_saved.original.py"
          cat > "$RUNNER_TEMP/complete-reports.patch.b64" <<'PATCH64'
          
          PATCH64
          base64 -d "$RUNNER_TEMP/complete-reports.patch.b64" > "$RUNNER_TEMP/complete-reports.patch"
          git apply --check "$RUNNER_TEMP/complete-reports.patch"
          git apply "$RUNNER_TEMP/complete-reports.patch"
          python -m py_compile "$ROOT/profile_saved.py" "$ROOT/test_child_reports.py" "$ROOT/test_complete_reports.py" "$ROOT/validate_complete_reports.py"
          python -B "$ROOT/validate_complete_reports.py" \
            --source-dir "$ROOT" \
            --output-dir "$ROOT" \
            --baseline-source "$RUNNER_TEMP/profile_saved.original.py" \
            --base-commit "$GITHUB_SHA"
      - name: Publish tested branch without the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/poly-profiler-complete-reports-one-shot.yml
          git config user.name "Astra Poly"
          git config user.email "brycembusiness2@gmail.com"
          git add revenue/kaggriculture/cloud-runtime-budget
          git commit -m "Require complete profiler identity before action parity"
          git push origin HEAD:astra/poly-profiler-complete-reports-20260908
