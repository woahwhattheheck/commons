name: titan-v3-current-intent-priority-sol-pro

"on":
  push:
    branches:
      - sol-pro/titan-v3-current-intent-priority-integration-20260910-01
    paths:
      - '.github/workflows/titan-v3-current-intent-priority-sol-pro.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/intent-priority-sol-pro/**'
      - 'p/sol-pro-titan-v3-current-intent-priority-integration-20260910-01.md'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-current-intent-priority-sol-pro.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/intent-priority-sol-pro/**'
      - 'p/sol-pro-titan-v3-current-intent-priority-integration-20260910-01.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v3-current-intent-priority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  supplementary-contracts-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact supplementary carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fail-closed carrier contracts without gameplay
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/intent-priority-sol-pro
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            test_materialize.py \
            test_bind.py \
            test_compare_panel.py
          python - <<'PY'
          from pathlib import Path

          for name in (
              'materialize.py',
              'bind.py',
              'compare_panel.py',
              'test_materialize.py',
              'test_bind.py',
              'test_compare_panel.py',
          ):
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          PY

      - name: Prove no generated checkout state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f -name '*.pyc' -print -quit)"
          test -z "$(git status --porcelain)"

      - name: Publish custody hold
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Supplementary carrier only — gameplay intentionally disabled

          The exact lane had an earlier durable owner (`SOL-ORBIT`, Slack TS
          `1789066794.517699`). In addition, canonical archive reconciliation
          moved the current package from `17f536…` to `5f6a41…` after this
          branch was cut. The old 64-game workflow was therefore replaced
          before gameplay with this stdlib-only contract run.

          This branch retains independently useful safe-extraction,
          closure-binding, candidate-action attribution, own-value, margin,
          outcome, and opponent-by-seat gates for cherry-pick or comparison by
          the earlier owner. It is not current-package admission evidence and
          has no merge, release, provider, Kaggle, or submission authority.
          EOF
