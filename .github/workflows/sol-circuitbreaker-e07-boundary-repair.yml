name: sol-circuitbreaker-e07-boundary-repair

on:
  push:
    branches:
      - "sol/circuitbreaker-e07-buy-product-boundary-20260909-02"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-circuitbreaker-e07-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: de4121fcadf365c4ce22c9f5a3a136bc7a075a3d
      LAB: revenue/kaggriculture/cloud-execution-lab
      RECEIPT: p/sol-circuitbreaker-e07-buy-product-boundary-20260909-02.md
      WORKFLOW: .github/workflows/sol-circuitbreaker-e07-boundary-repair.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch preimage and apply narrow boundary repair
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          workflow = os.environ["WORKFLOW"]
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True
          )
          preexisting = subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines()
          if preexisting != [workflow]:
              raise SystemExit(f"unexpected preexisting branch paths: {preexisting}")

          lab = Path(os.environ["LAB"])
          source_path = lab / "frozen_selected.py"
          source = source_path.read_text(encoding="utf-8")
          old = (
              "    before=baseline['outcomes'][target]\n"
              "    candidates=[]\n"
              "    targets=set(targets)\n"
              "    for source in range(target+1,len(original)):\n"
          )
          new = (
              "    before=baseline['outcomes'][target]\n"
              "    candidates=[]\n"
              "    targets=set(targets)\n"
              "    source_limit=barrier if barrier is not None else len(original)\n"
              "    for source in range(target+1,source_limit):\n"
          )
          if source.count(old) != 1:
              raise SystemExit("E07 source preimage is absent or ambiguous")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = lab / "test_e07_same_turn_funding.py"
          tests = test_path.read_text(encoding="utf-8")
          marker = "    def test_variable_price_buy_is_a_hard_boundary(self):\n"
          case = (
              "    def test_sale_after_later_variable_price_buy_cannot_fund_earlier_target(self):\n"
              "        obs,base=fixture(shed={'WHEAT':3},money=0)\n"
              "        base['market']=[[],['BUY_SEED','CARROT',1],\n"
              "                        ['BUY_PRODUCT','WHEAT',1],['SELL','WHEAT',3]]\n"
              "        original=deepcopy(base['market'])\n"
              "        out,info=fund(obs,base,{'WHEAT'})\n"
              "        self.assertEqual(out,original)\n"
              "        self.assertIsNotNone(info)\n"
              "        self.assertFalse(info['applied'])\n"
              "        self.assertEqual(info['reason'],'no-safe-prefix-sale')\n"
              "        self.assertEqual(info['target_index'],1)\n"
              "        self.assertEqual(info['baseline_completed'],0)\n"
              "        self.assertEqual(info['required'],1)\n"
              "        self.assertEqual(sale_quantities(out),sale_quantities(original))\n"
              "        self.assertEqual(base['market'],original)\n\n"
          )
          if tests.count(marker) != 1:
              raise SystemExit("E07 test insertion point is absent or ambiguous")
          if "test_sale_after_later_variable_price_buy_cannot_fund_earlier_target" in tests:
              raise SystemExit("E07 regression already exists")
          test_path.write_text(tests.replace(marker, case + marker, 1), encoding="utf-8")

      - name: Prove the discriminating source contracts before packaging
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-runtime-pulse:$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-quickstep:$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-execution-lab"
          python3 -B -m unittest -v test_e07_same_turn_funding.SameTurnFundingContracts

      - name: Rebuild and verify deterministic canonical release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          python3 -B build_integrated.py | tee "$RUNNER_TEMP/e07-build.json"
          python3 -B build_integrated.py --check | tee "$RUNNER_TEMP/e07-check.json"

      - name: Run E07 and neighboring canonical regressions
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-runtime-pulse:$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-quickstep:$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-execution-lab"
          python3 -B -m unittest -v \
            test_e07_hosted_source_path \
            test_e07_same_turn_funding \
            test_joint_market_slots \
            test_e10_floor_cycle \
            test_release_consistency \
            test_build_publication
          git diff --check

      - name: Write source-bound receipt and retire this one-shot carrier
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          lab = root / os.environ["LAB"]
          (root / os.environ["WORKFLOW"]).unlink()
          current = json.loads(
              (lab / "runtime/integrated-selected/CURRENT-ARCHIVE.json").read_text()
          )
          source_path = lab / "frozen_selected.py"
          test_path = lab / "test_e07_same_turn_funding.py"
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"]], text=True
          ).splitlines()
          receipt_rel = os.environ["RECEIPT"]
          paths.append(receipt_rel)
          lines = [
              "# SOL-CIRCUITBREAKER — E07 BUY_PRODUCT source-boundary repair",
              "",
              "Operation: `TITAN-E07-BUY-PRODUCT-SOURCE-BOUNDARY-REPAIR-20260909-02`",
              f"Base: `{os.environ['BASE_SHA']}`",
              "",
              "## Repair",
              "",
              "Candidate SELL sources are now bounded to indexes strictly before the first `BUY_PRODUCT` barrier. A fixed acquisition before that barrier may use an earlier legal SELL, but no later SELL can be pulled across variable-price market state.",
              "",
              "The target=1 / barrier=2 / source=3 regression proves unchanged orders, `no-safe-prefix-sale`, an unfilled fixed target, invariant sale quantities, and an unchanged caller-owned queue.",
              "",
              "## Verification",
              "",
              "- `SameTurnFundingContracts`: PASS, including the new boundary case.",
              "- E07 source-path/full tests, joint-market, E10 floor-cycle, release-consistency, and build-publication suites: PASS.",
              "- `build_integrated.py`, `build_integrated.py --check`, and `git diff --check`: PASS.",
              "- No games, Kaggle submission, provider action, spend, or strategy default change.",
              "",
              "## Generated current package",
              "",
              f"- Archive SHA256: `{current['sha256']}`",
              f"- Bytes/runtime files: `{current['bytes']}` / `{current['runtime_files']}`",
              f"- Source-manifest SHA256: `{current['source_manifest_sha256']}`",
              f"- `frozen_selected.py`: `{len(source_path.read_bytes())}` B / `{hashlib.sha256(source_path.read_bytes()).hexdigest()}`",
              f"- `test_e07_same_turn_funding.py`: `{len(test_path.read_bytes())}` B / `{hashlib.sha256(test_path.read_bytes()).hexdigest()}`",
              "",
              "## Net paths against base",
              "",
              *[f"- `{path}`" for path in sorted(set(paths))],
              "",
          ]
          receipt = root / receipt_rel
          receipt.parent.mkdir(parents=True, exist_ok=True)
          receipt.write_text("\n".join(lines), encoding="utf-8")

      - name: Commit generated source, tests, package, and receipt
        run: |
          git config user.name "SOL-CIRCUITBREAKER"
          git config user.email "tokenjunkielabs@gmail.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "titan: stop E07 sales at BUY_PRODUCT boundary [e07-boundary-generated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
