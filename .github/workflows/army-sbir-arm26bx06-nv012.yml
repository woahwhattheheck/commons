name: Army SBIR decision-program carrier
on:
  pull_request:
    paths:
      - 'revenue/opportunities/army_sbir_arm26bx06_nv012/**'
      - '.github/workflows/army-sbir-arm26bx06-nv012.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/opportunities/army_sbir_arm26bx06_nv012/**'
      - '.github/workflows/army-sbir-arm26bx06-nv012.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact carrier checks
        working-directory: revenue/opportunities/army_sbir_arm26bx06_nv012
        run: |
          set -euo pipefail
          python -m py_compile decision_program.py qualification_gate.py tests/test_carrier.py
          python -B -m unittest discover -s tests -v
          python -O -B -m unittest discover -s tests -v
          python -B decision_program.py evaluate examples/point_trade.json > /tmp/point.json
          python -B decision_program.py evaluate examples/long_horizon_g1.json > /tmp/g1.json
          python -B decision_program.py evaluate examples/long_horizon_g2.json > /tmp/g2.json
          python -B decision_program.py verify-refresh examples/long_horizon_g1.json examples/long_horizon_g2.json > /tmp/refresh.json
          python -B qualification_gate.py qualification.example.json > /tmp/qualification.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/point.json'))['readiness'] == 'READY_FOR_HUMAN_REVIEW'
          assert json.load(open('/tmp/g2.json'))['readiness'] == 'HOLD'
          assert json.load(open('/tmp/qualification.json'))['disposition'] == 'HOLD'
          PY
