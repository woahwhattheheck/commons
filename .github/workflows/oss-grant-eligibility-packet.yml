name: OSS grant eligibility packet

on:
  pull_request:
    paths:
      - "revenue/oss_grant_eligibility_packet/**"
      - ".github/workflows/oss-grant-eligibility-packet.yml"
  push:
    branches: [main]
    paths:
      - "revenue/oss_grant_eligibility_packet/**"
      - ".github/workflows/oss-grant-eligibility-packet.yml"

concurrency:
  group: oss-grant-eligibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile revenue/oss_grant_eligibility_packet/*.py
      - name: Tests
        run: python -m unittest -v revenue.oss_grant_eligibility_packet.test_compiler
      - name: Optimized tests
        run: python -O -m unittest -v revenue.oss_grant_eligibility_packet.test_compiler
      - name: Synthetic compile and verify
        run: |
          OUT="$(mktemp -d)/grant"
          python -m revenue.oss_grant_eligibility_packet compile \
            --programs revenue/oss_grant_eligibility_packet/reference_programs.json \
            --input revenue/oss_grant_eligibility_packet/fixtures/synthetic_project.json \
            --out-dir "$OUT"
          python -m revenue.oss_grant_eligibility_packet verify \
            --programs revenue/oss_grant_eligibility_packet/reference_programs.json \
            --input revenue/oss_grant_eligibility_packet/fixtures/synthetic_project.json \
            --packet "$OUT/packet.json" \
            --markdown "$OUT/packet.md" \
            --receipt "$OUT/receipt.json"
