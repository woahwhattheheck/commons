name: TITAN V3.1 B5 carrot fertilizer

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b5_carrot_fertilizer/**"
      - ".github/workflows/titan-v31-b5-carrot-fertilizer.yml"
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 508b342fc46fa91e3d7cdc3f0b7e44934a187c14
      R04_BLOB: 21c4f1db0298f8955b1f5ad366bd780a89cad206
      TAPE_BLOB: a43289b9cc5e34a2481fddf652762a7d92f427ef
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact head and frozen producer custody
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          git cat-file -e "$BASE_SHA^{commit}"
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/titan-v31-b5-carrot-fertilizer.yml
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b5_carrot_fertilizer/README.md
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b5_carrot_fertilizer/candidate.py
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b5_carrot_fertilizer/test_candidate.py
          EOF
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --name-only "$BASE_SHA...HEAD" | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py)" = "$R04_BLOB"
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r01_tapes.py)" = "$TAPE_BLOB"
      - name: Focused B5 predecessor tests
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b5_carrot_fertilizer
        run: python -B -m unittest -v test_candidate.py
      - name: Compile experiment entrypoint
        run: python -B -m py_compile revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b5_carrot_fertilizer/candidate.py
