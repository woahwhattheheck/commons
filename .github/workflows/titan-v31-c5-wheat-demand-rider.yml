name: TITAN V3.1 C5 wheat demand rider

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v31-c5-wheat-demand-rider.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c5_wheat_demand_rider/**"
  push:
    branches:
      - astra/v31-c5-wheat-demand-rider-20260911
      - astra/v31-c5-wheat-demand-rider-repair-20260911

permissions:
  contents: read

concurrency:
  group: titan-v31-c5-wheat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CASE: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c5_wheat_demand_rider
      R04: revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py
      ENGINE: revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py
      FROZEN_BASE: 508b342fc46fa91e3d7cdc3f0b7e44934a187c14
      EXPECTED_R04_BLOB: 21c4f1db0298f8955b1f5ad366bd780a89cad206
      EXPECTED_ENGINE_BLOB: 3c202c7ee921da239356789e266b694635103fc4
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout literal head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact frozen-base scope and source dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$FROZEN_BASE" HEAD)" = "$FROZEN_BASE"

          git diff --name-only "$FROZEN_BASE" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/C5-ACTUAL-PATHS"
          cat > "$RUNNER_TEMP/C5-EXPECTED-PATHS" <<'EOF'
          .github/workflows/titan-v31-c5-wheat-demand-rider.yml
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c5_wheat_demand_rider/README.md
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c5_wheat_demand_rider/candidate.py
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c5_wheat_demand_rider/test_candidate.py
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/C5-EXPECTED-PATHS" "$RUNNER_TEMP/C5-EXPECTED-PATHS"
          diff -u "$RUNNER_TEMP/C5-EXPECTED-PATHS" "$RUNNER_TEMP/C5-ACTUAL-PATHS"

          test "$(git rev-parse "HEAD:$R04")" = "$EXPECTED_R04_BLOB"
          test "$(git rev-parse "HEAD:$ENGINE")" = "$EXPECTED_ENGINE_BLOB"
          git diff --check
          test -z "$(git status --short)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and run focused repaired predecessor suite
        working-directory: ${{ env.CASE }}
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile candidate.py test_candidate.py
          python -B -m unittest -v test_candidate.py 2>&1 | tee "$RUNNER_TEMP/C5-TEST.log"
          grep -E '^Ran 24 tests in [0-9.]+s$' "$RUNNER_TEMP/C5-TEST.log"
          grep -Fx 'OK' "$RUNNER_TEMP/C5-TEST.log"
          ! grep -E 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/C5-TEST.log"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --short)"

      - name: Upload source-contract receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v31-c5-wheat-demand-rider-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/C5-TEST.log
            ${{ runner.temp }}/C5-ACTUAL-PATHS
            ${{ runner.temp }}/C5-EXPECTED-PATHS
