name: Bitcoin pool verdict focused check
run-name: Bitcoin pool verdict 9e402fa5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          persist-credentials: false
      - name: Check current-main cycle replies and terminal audit
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, subprocess, sys
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          cycle = tmp / 'check_pool_labels.py'
          cycle.write_bytes(base64.b64decode(''))
          subprocess.run([sys.executable, str(cycle)], check=True)
          audit = tmp / 'audit_git_terminal.py'
          audit.write_bytes(base64.b64decode(''))
          subprocess.run([sys.executable, str(audit), '--repo', '.', '--expected-commit', '9e402fa56d537d2d179b0c43bdc316e389def3ab', '--required-path', 'host/pfc_bitcoin_autopilot.py', '--required-path', 'infra/host/pfc_bitcoin_autopilot.py'], check=True)
          PY
