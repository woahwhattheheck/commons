name: Bitcoin pool transport check
run-name: Bitcoin pool transport main cd783073
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /host/pfc_bitcoin_autopilot.py
            /infra/host/pfc_bitcoin_autopilot.py
            /tests/test_pfc_bitcoin_transport.py
            /open_door_guard.py
            /fix_first.py
      - name: Validate actual transport module in cloud
        run: |
          python3 - <<'PY'
          import contextlib, importlib.util, io, json, pathlib, subprocess, sys
          assert pathlib.Path('host/pfc_bitcoin_autopilot.py').read_bytes() == pathlib.Path('infra/host/pfc_bitcoin_autopilot.py').read_bytes()
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_pfc_bitcoin_transport.py', '-v'], check=True)
          subprocess.run([sys.executable, 'open_door_guard.py', '--diff', '6a553d99528a6ba0a3712b2b450e506811b92b1b', 'cd7830735c9f5150a846f546907544abdf3a18d7'], check=True)
          print('CHECKED_HEAD=' + subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          import base64, os
          audit = pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit_git_terminal.py'
          audit.write_bytes(base64.b64decode(''))
          subprocess.run([sys.executable, str(audit), '--repo', '.', '--expected-commit', '0b3c00819cd0e4d0a857d02db3fd8356905ab08e', '--required-path', 'host/pfc_bitcoin_autopilot.py', '--required-path', 'infra/host/pfc_bitcoin_autopilot.py', '--required-path', 'tests/test_pfc_bitcoin_transport.py'], check=True)
          for path, expected in {'host/pfc_bitcoin_autopilot.py': 'c8a22bcccb1aaa00c63465f095f9cad37e93ed57', 'infra/host/pfc_bitcoin_autopilot.py': 'c8a22bcccb1aaa00c63465f095f9cad37e93ed57', 'tests/test_pfc_bitcoin_transport.py': '89a4a186533b95fed1b5a7af9feaa3bff46353eb'}.items():
              observed = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert observed == expected, (path,observed,expected)
          packet = {'outcome':'fixed','observed_broken':True,'expected_contract':'Importable routing helpers and provider-confirmed subscribe, authorize, notify, and submission results on one bounded session','changed_paths':['host/pfc_bitcoin_autopilot.py', 'infra/host/pfc_bitcoin_autopilot.py', 'tests/test_pfc_bitcoin_transport.py'],'tests':['44 transport regressions on both mirrors','Candidate live pool handshake passed','Baseline import failures reproduced'],'main_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'readback_verified':True}
          subprocess.run([sys.executable,'fix_first.py','--json',json.dumps(packet)], check=True)
          PY
