name: Bitcoin pool-freshness check
run-name: Bitcoin pool-freshness main ea89d0f5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /host/pfc_bitcoin_autopilot.py
            /infra/host/pfc_bitcoin_autopilot.py
            /tests/test_pfc_bitcoin_*.py
            /open_door_guard.py
            /fix_first.py
      - name: Check pool behavior and exact shipped bytes
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          for path, expected in {'host/pfc_bitcoin_autopilot.py': '032d7aab1751a2fa8a17d83a5c2953c89e747e6e', 'infra/host/pfc_bitcoin_autopilot.py': '032d7aab1751a2fa8a17d83a5c2953c89e747e6e', 'tests/test_pfc_bitcoin_transport.py': '8014066eadaf6853d4f59af8e4674fd506ef9904', 'tests/test_pfc_bitcoin_freshness.py': 'a0e6e44b644ecb94913a38102a2b256944ee2b35'}.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == expected, path
          assert pathlib.Path('host/pfc_bitcoin_autopilot.py').read_bytes() == pathlib.Path('infra/host/pfc_bitcoin_autopilot.py').read_bytes()
          subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-p','test_pfc_bitcoin_*.py','-v'],check=True)
          subprocess.run([sys.executable,'open_door_guard.py','--diff','df713b878523f634bd89a977adbb33e4eb0cc852','ea89d0f5350d3161be7eaf49286d121966a9dede'],check=True)
          print('CHECKED_HEAD=' + subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          import base64, os
          audit = pathlib.Path(os.environ['RUNNER_TEMP'])/'audit_git_terminal.py'
          audit.write_bytes(base64.b64decode(''))
          subprocess.run([sys.executable,str(audit),'--repo','.','--expected-commit','3f546a6b903f1fca387cebd2c9b033ac6012a72b'],check=True)
          packet = {'outcome':'fixed','observed_broken':True,'expected_contract':'A routed job remains paired with its original answer; clean_jobs true invalidates prior work before submission, while clean_jobs false preserves it and worker settle timing remains unchanged','changed_paths':['host/pfc_bitcoin_autopilot.py', 'infra/host/pfc_bitcoin_autopilot.py', 'tests/test_pfc_bitcoin_transport.py', 'tests/test_pfc_bitcoin_freshness.py'],'tests':['Current-main transport and regression cases'], 'main_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'readback_verified':True}
          subprocess.run([sys.executable,'fix_first.py','--json',json.dumps(packet)],check=True)
          PY
