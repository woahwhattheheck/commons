name: Bitcoin pool-receipt check
run-name: Bitcoin pool-receipt candidate 51db3d8f
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51db3d8f3a7eb1301df35f722c37fb9bb8a30bcb
          fetch-depth: 100
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fix_first.py
            /host/pfc_bitcoin_autopilot.py
            /infra/host/pfc_bitcoin_autopilot.py
            /open_door_guard.py
            /tests/test_pfc_bitcoin_*.py
            /tests/test_pfc_bitcoin_receipt.py
      - name: Check pool behavior and exact shipped bytes
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          for path, expected in {'host/pfc_bitcoin_autopilot.py': '4db0f3f8fc1b8ec3349616b472446ea1414fa365', 'infra/host/pfc_bitcoin_autopilot.py': '4db0f3f8fc1b8ec3349616b472446ea1414fa365', 'tests/test_pfc_bitcoin_receipt.py': '76ef94cb1cccc1287073ad676ab439f61b1ea234'}.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == expected, path
          assert pathlib.Path('host/pfc_bitcoin_autopilot.py').read_bytes() == pathlib.Path('infra/host/pfc_bitcoin_autopilot.py').read_bytes()
          subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-p','test_pfc_bitcoin_*.py','-v'],check=True)
          subprocess.run([sys.executable,'open_door_guard.py','--diff','073cc4b0b2eb0854f02276b4c61410f10a32ee38','51db3d8f3a7eb1301df35f722c37fb9bb8a30bcb'],check=True)
          print('CHECKED_HEAD=' + subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          # Execute only the exact old receipt-publication statement against temp files.
          # No worker, model, pool, signal, or machine path is involved in this comparison.
          import ast
          import tempfile
          import types
          baseline_text = subprocess.check_output(['git','show','8e8afb74fad23891d2a18c2b9fc6eab9e12aa4b6:host/pfc_bitcoin_autopilot.py'],text=True)
          cycle = next(node for node in ast.parse(baseline_text).body if isinstance(node,ast.FunctionDef) and node.name == 'cycle')
          publication = next(node for node in ast.walk(cycle) if isinstance(node,ast.With) and 'open(JOB, "w")' in ast.get_source_segment(baseline_text,node))
          old_bytes = b'{ "job_id": "previous-fixture", "pool": "no-reply" }\n'
          with tempfile.TemporaryDirectory() as directory:
              destination = pathlib.Path(directory)/'autopilot_job.json'
              destination.write_bytes(old_bytes)
              def interrupted_dump(value,stream):
                  serialized = json.dumps(value)
                  stream.write(serialized[:len(serialized)//2])
                  stream.flush()
                  raise OSError('fixture interrupted receipt write')
              scope = {'JOB':str(destination),'job':{'job_id':'next-fixture'},'zb':23,'answer':None,'answer_error':'fixture answer unavailable','pool':'answer-unavailable','verdict':None,'submission_attempted':False,'json':types.SimpleNamespace(dump=interrupted_dump)}
              try:
                  exec(compile(ast.Module(body=[publication],type_ignores=[]),'baseline-publication','exec'),scope)
              except OSError as error:
                  assert str(error) == 'fixture interrupted receipt write'
              else:
                  raise AssertionError('Baseline write interruption was not exercised')
              assert destination.read_bytes() != old_bytes
              try:
                  json.loads(destination.read_bytes())
              except json.JSONDecodeError:
                  print('BASELINE_INTERRUPTED_WRITE_LOST_COMPLETE_RECEIPT=1; FIXED_PUBLICATION_PRESERVES_OLD_BYTES')
              else:
                  raise AssertionError('Baseline receipt did not become partial')
          
          PY

