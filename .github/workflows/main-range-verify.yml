name: Bitcoin pool-answer check
run-name: Bitcoin pool-answer main 44ea4b81
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fix_first.py
            /host/pfc_bitcoin_autopilot.py
            /host/pfc_monitor_ui.py
            /infra/host/pfc_bitcoin_autopilot.py
            /infra/host/pfc_monitor_ui.py
            /open_door_guard.py
            /tests/test_pfc_bitcoin_*.py
            /tests/test_pfc_bitcoin_answer.py
            /tests/test_pfc_bitcoin_monitor.py
      - name: Check pool behavior and exact shipped bytes
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          for path, expected in {'host/pfc_bitcoin_autopilot.py': 'b8fc8921ad4a5fb83bcbc794cdd19912e71f41a4', 'infra/host/pfc_bitcoin_autopilot.py': 'b8fc8921ad4a5fb83bcbc794cdd19912e71f41a4', 'host/pfc_monitor_ui.py': '423fd4b9c787cefb9f3e0bf8202f2a3ad42d66ce', 'infra/host/pfc_monitor_ui.py': '423fd4b9c787cefb9f3e0bf8202f2a3ad42d66ce', 'tests/test_pfc_bitcoin_answer.py': 'b063b8d44c335596ddae42983ccb2dcd87e39072', 'tests/test_pfc_bitcoin_monitor.py': '30637891bc4c26a1d30bdea7dfb19edbe3cffb2c'}.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == expected, path
          assert pathlib.Path('host/pfc_bitcoin_autopilot.py').read_bytes() == pathlib.Path('infra/host/pfc_bitcoin_autopilot.py').read_bytes()
          subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-p','test_pfc_bitcoin_*.py','-v'],check=True)
          subprocess.run([sys.executable,'open_door_guard.py','--diff','9fee0a5a0af9be4f8de90a276708dd5441cd6d67','44ea4b8162303ec83b7e5f7b191592c1456eb02a'],check=True)
          print('CHECKED_HEAD=' + subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          import base64, os
          audit = pathlib.Path(os.environ['RUNNER_TEMP'])/'audit_git_terminal.py'
          audit.write_bytes(base64.b64decode(''))
          subprocess.run([sys.executable,str(audit),'--repo','.','--expected-commit','8e8afb74fad23891d2a18c2b9fc6eab9e12aa4b6'],check=True)
          packet = {'outcome':'fixed','observed_broken':True,'expected_contract':'Unavailable or short external answer files never become synthetic zero submissions; complete nine-byte records preserve their values, and the monitor renders unavailable answers, skipped submissions, and raw record status without crashing','changed_paths':['host/pfc_bitcoin_autopilot.py', 'infra/host/pfc_bitcoin_autopilot.py', 'host/pfc_monitor_ui.py', 'infra/host/pfc_monitor_ui.py', 'tests/test_pfc_bitcoin_answer.py', 'tests/test_pfc_bitcoin_monitor.py'],'tests':['Current-main transport and regression cases'], 'main_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'readback_verified':True}
          subprocess.run([sys.executable,'fix_first.py','--json',json.dumps(packet)],check=True)
          PY
