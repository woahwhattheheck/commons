name: z-sol-loom-workflow-surface-migrate
on:
  push:
    branches:
      - 'z-sol-loom/workflow-surface-14644'
    paths:
      - '.github/workflows/z-sol-loom-workflow-surface-migrate.yml'
      - 'tools/z_sol_loom_workflow_surface_migrate.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural parser
        run: python -m pip install PyYAML==6.0.3
      - name: Migrate escaped workflows into exact-byte recipes
        run: python -B tools/z_sol_loom_workflow_surface_migrate.py
      - name: Run hostile structural unit suite
        run: python -B -m unittest -v test_workflow_surface.py
      - name: Verify bounded active surface and archive inventory
        run: python -B host/workflow_surface.py check
      - name: Reject whitespace damage
        run: git diff --check
      - name: Commit exact migration to recovery branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'Z-SOL-LOOM'
          git config user.email 'z-sol-loom@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'migration produced no changes' >&2; exit 1; }
          git commit -m 'ci: restore bounded workflow surface and recipe integrity'
          git push origin HEAD:"$BRANCH"
