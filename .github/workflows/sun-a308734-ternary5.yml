name: sun-a308734-ternary5

on:
  pull_request:
    paths:
      - "research/sun_a308734_ternary5/**"
      - ".github/workflows/sun-a308734-ternary5.yml"
  push:
    branches:
      - main
    paths:
      - "research/sun_a308734_ternary5/**"
      - ".github/workflows/sun-a308734-ternary5.yml"

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile verifiers
        run: |
          python -m py_compile research/sun_a308734_ternary5/verify.py research/sun_a308734_ternary5/verify_recurrence.py
      - name: Run exact finite checks
        run: |
          cd research/sun_a308734_ternary5
          python verify.py
          python verify_recurrence.py
      - name: Run exact finite checks under optimized Python
        run: |
          cd research/sun_a308734_ternary5
          python -O verify.py
          python -O verify_recurrence.py
