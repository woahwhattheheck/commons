name: source-parses

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/runtime/final-spatial-guard/**"
      - "revenue/kaggriculture/cloud-execution-lab/main.py"
      - "revenue/kaggriculture/cloud-execution-lab/spatial_tempo.py"
      - "revenue/multi_framework_evidence_freshness/**"
      - "tests/test_multi_framework_evidence_freshness*.py"
      - "competitions/nebius-proofpatch-2026/**"
      - "tools/provider_cost_truth/**"
      - "revenue/swarmops_dossier/**"
      - "revenue/pilot_delivery_renewal_expansion_gate/**"
      - "test_pilot_delivery_renewal_expansion_gate.py"
      - "test_pilot_delivery_renewal_reload_trust_root.py"
      - "test_discord_push_scope.py"
      - ".github/workflows/source-parses.yml"
      - ".github/workflows/commons-discord-cloud.yml"
      - "revenue/opportunities/unc_ap_ai_peoplesoft/**"
      - "test_unc_ap_ai_peoplesoft_batch.py"
      - "revenue/external_opportunity_intake/**"
      - "revenue/uiowa_rfq_18649_recovery_evidence/**"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - ".github/workflows/source-parses.yml"
      - ".github/workflows/commons-discord-cloud.yml"
      - "revenue/opportunities/unc_ap_ai_peoplesoft/**"
      - "test_unc_ap_ai_peoplesoft_batch.py"
      - "revenue/external_opportunity_intake/**"
      - "revenue/uiowa_rfq_18649_recovery_evidence/**"

permissions:
  contents: read

concurrency:
  group: source-parses-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify checker contract
        run: |
          if [ -f test_source_parses.py ]; then
            python3 -m unittest -v test_source_parses.py test_discord_push_scope.py
          else
            python3 -m unittest -v test_discord_push_scope.py
          fi
          python3 -O -m unittest -v test_discord_push_scope.py


      - name: Verify bid-owner cockpit regression and retained I/O
        shell: bash
        run: |
          git rev-parse HEAD
          git ls-tree -r HEAD -- revenue/bid_owner_action_cockpit
          python3 -m py_compile revenue/bid_owner_action_cockpit/*.py
          python3 - <<'PYTHON'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'revenue/bid_owner_action_cockpit', pattern='test_*.py', top_level_dir='.'
          )
          count = suite.countTestCases()
          print(f'bid-owner cockpit tests discovered: {count}')
          if count < 84:
              raise SystemExit('BID-OWNER COCKPIT DISCOVERY INCOMPLETE')
          PYTHON
          python3 -m unittest discover -s revenue/bid_owner_action_cockpit -t . -p 'test_*.py' -v
          python3 -O -m unittest discover -s revenue/bid_owner_action_cockpit -t . -p 'test_*.py' -v

      - name: Parse every tracked Python and JavaScript source
        run: python3 source_parses.py

      - name: Verify Fleet CI execution-truth contract when present
        shell: bash
        run: |
          if [ -d ci/actions_execution_truth ]; then
            (
              cd ci/actions_execution_truth
              python3 -m unittest -v test_core.py test_cli.py
              python3 -O -m unittest -v test_core.py test_cli.py
            )
          fi

      - name: Verify provider-starvation merge-train advisory when present
        shell: bash
        run: |
          if [ -d ci/actions_merge_train ]; then
            python3 -m py_compile ci/actions_merge_train/*.py
            python3 -m unittest -v ci.actions_merge_train.test_train ci.actions_merge_train.test_cli ci.actions_merge_train.test_latest_attempts ci.actions_merge_train.test_composition_invariants ci.actions_merge_train.test_terminal_consistency
            python3 -O -m unittest -v ci.actions_merge_train.test_train ci.actions_merge_train.test_cli ci.actions_merge_train.test_latest_attempts ci.actions_merge_train.test_composition_invariants ci.actions_merge_train.test_terminal_consistency
          fi

      - name: Verify Slack mirror durable-delivery contract when present
        shell: bash
        run: |
          if [ -f host/slack_mirror_state.py ] && [ -f test_slack_mirror_delivery.py ]; then
            python3 -m unittest -v test_slack_mirror test_slack_mirror_state test_slack_mirror_delivery test_slack_mirror_receipt_commit
            python3 -O -m unittest -v test_slack_mirror test_slack_mirror_state test_slack_mirror_delivery test_slack_mirror_receipt_commit
          fi

      - name: Verify SwarmOps currentness contract when present
        shell: bash
        run: |
          if [ -f revenue/swarmops_dossier/test_v4_contract.py ]; then
            python3 -m unittest -v \
              revenue.swarmops_dossier.test_engine \
              revenue.swarmops_dossier.test_cli_ingress \
              revenue.swarmops_dossier.test_v4_contract
            python3 -O -m unittest -v \
              revenue.swarmops_dossier.test_engine \
              revenue.swarmops_dossier.test_cli_ingress \
              revenue.swarmops_dossier.test_v4_contract
          fi

      - name: Verify Nebius ProofPatch trust split when present
        shell: bash
        run: |
          if [ -d competitions/nebius-proofpatch-2026 ]; then
            (
              cd competitions/nebius-proofpatch-2026
              python3 -m unittest -v test_proofpatch test_hardening
              python3 -O -m unittest -v test_proofpatch test_hardening
              python3 proofpatch.py demo > /tmp/proofpatch.json
              python3 proofpatch.py verify /tmp/proofpatch.json | grep STRUCTURAL_EVIDENCE_VERIFIED
              python3 proofpatch.py demo-verify | grep EXECUTOR_REPLAY_VERIFIED
            )
          fi

      - name: Verify recovered AP batch review without another workflow slot
        shell: bash
        run: |
          python3 -W error::ResourceWarning -m unittest -v test_unc_ap_ai_peoplesoft_batch.py
          python3 -O -W error::ResourceWarning -m unittest -v test_unc_ap_ai_peoplesoft_batch.py
          (
            cd revenue/opportunities/unc_ap_ai_peoplesoft
            python3 exercise_batch.py
            python3 -O exercise_batch.py
          )

      - name: Verify external opportunity intake without another workflow slot
        shell: bash
        run: |
          python3 -m py_compile revenue/external_opportunity_intake/*.py
          python3 -m revenue.external_opportunity_intake.selftest
          python3 -O -m revenue.external_opportunity_intake.selftest

      - name: Verify UIOWA-068 recovery evidence without another workflow slot
        shell: bash
        run: |
          python3 -m py_compile \
            revenue/uiowa_rfq_18649_recovery_evidence/assess_recovery.py \
            revenue/uiowa_rfq_18649_recovery_evidence/test_assess_recovery.py
          (
            cd revenue/uiowa_rfq_18649_recovery_evidence
            python3 -m unittest -v test_assess_recovery.py
            python3 assess_recovery.py fixtures/synthetic_recovery_records.json \
              --json-output /tmp/uiowa-068-report.json \
              --csv-output /tmp/uiowa-068-matrix.csv \
              --markdown-output /tmp/uiowa-068-scenario.md
            grep -q 'DEMONSTRATED' /tmp/uiowa-068-matrix.csv
            grep -q 'Successful backup evidence does not demonstrate restoration' /tmp/uiowa-068-scenario.md
          )


  # Manual dispatch retains the full battery; automatic component checks use
  # native path filters in their reusable workflows without a router runner.
  provider-cost-truth:
    name: Manual full battery - provider cost
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/source-parses-provider-cost.yml

  multi-framework-evidence-freshness:
    name: Manual full battery - evidence freshness
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/source-parses-freshness.yml

  titan-final-spatial-carrier:
    name: Manual full battery - spatial carrier
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/source-parses-spatial-carrier.yml
