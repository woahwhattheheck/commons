name: source-parses

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/runtime/final-spatial-guard/**"
      - "revenue/kaggriculture/cloud-execution-lab/main.py"
      - "revenue/kaggriculture/cloud-execution-lab/spatial_tempo.py"
      - "revenue/multi_framework_evidence_freshness/**"
      - "tests/test_multi_framework_evidence_freshness*.py"
      - "competitions/nebius-proofpatch-2026/**"
      - "tools/provider_cost_truth/**"
      - "revenue/pilot_delivery_renewal_expansion_gate/**"
      - "test_pilot_delivery_renewal_expansion_gate.py"
      - "test_pilot_delivery_renewal_reload_trust_root.py"
      - "test_discord_push_scope.py"
      - ".github/workflows/source-parses.yml"
      - ".github/workflows/commons-discord-cloud.yml"
      - "revenue/opportunities/unc_ap_ai_peoplesoft/**"
      - "test_unc_ap_ai_peoplesoft_batch.py"
      - "revenue/external_opportunity_intake/**"
      - "revenue/uiowa_rfq_18649_recovery_evidence/**"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - ".github/workflows/source-parses.yml"
      - ".github/workflows/commons-discord-cloud.yml"
      - "revenue/opportunities/unc_ap_ai_peoplesoft/**"
      - "test_unc_ap_ai_peoplesoft_batch.py"
      - "revenue/external_opportunity_intake/**"
      - "revenue/uiowa_rfq_18649_recovery_evidence/**"

permissions:
  contents: read

concurrency:
  group: source-parses-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify checker contract
        run: |
          if [ -f test_source_parses.py ]; then
            python3 -m unittest -v test_source_parses.py test_discord_push_scope.py
          else
            python3 -m unittest -v test_discord_push_scope.py
          fi
          python3 -O -m unittest -v test_discord_push_scope.py


      - name: Verify bid-owner cockpit regression and retained I/O
        shell: bash
        run: |
          git rev-parse HEAD
          git ls-tree -r HEAD -- revenue/bid_owner_action_cockpit
          python3 -m py_compile revenue/bid_owner_action_cockpit/*.py
          python3 - <<'PYTHON'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'revenue/bid_owner_action_cockpit', pattern='test_*.py', top_level_dir='.'
          )
          count = suite.countTestCases()
          print(f'bid-owner cockpit tests discovered: {count}')
          if count < 84:
              raise SystemExit('BID-OWNER COCKPIT DISCOVERY INCOMPLETE')
          PYTHON
          python3 -m unittest discover -s revenue/bid_owner_action_cockpit -t . -p 'test_*.py' -v
          python3 -O -m unittest discover -s revenue/bid_owner_action_cockpit -t . -p 'test_*.py' -v

      - name: Parse every tracked Python and JavaScript source
        run: python3 source_parses.py

      - name: Verify Fleet CI execution-truth contract when present
        shell: bash
        run: |
          if [ -d ci/actions_execution_truth ]; then
            (
              cd ci/actions_execution_truth
              python3 -m unittest -v test_core.py test_cli.py
              python3 -O -m unittest -v test_core.py test_cli.py
            )
          fi

      - name: Verify provider-starvation merge-train advisory when present
        shell: bash
        run: |
          if [ -d ci/actions_merge_train ]; then
            python3 -m py_compile ci/actions_merge_train/*.py
            python3 -m unittest -v ci.actions_merge_train.test_train ci.actions_merge_train.test_cli ci.actions_merge_train.test_latest_attempts ci.actions_merge_train.test_composition_invariants ci.actions_merge_train.test_terminal_consistency
            python3 -O -m unittest -v ci.actions_merge_train.test_train ci.actions_merge_train.test_cli ci.actions_merge_train.test_latest_attempts ci.actions_merge_train.test_composition_invariants ci.actions_merge_train.test_terminal_consistency
          fi

      - name: Verify Slack mirror durable-delivery contract when present
        shell: bash
        run: |
          if [ -f host/slack_mirror_state.py ] && [ -f test_slack_mirror_delivery.py ]; then
            python3 -m unittest -v test_slack_mirror test_slack_mirror_state test_slack_mirror_delivery test_slack_mirror_receipt_commit
            python3 -O -m unittest -v test_slack_mirror test_slack_mirror_state test_slack_mirror_delivery test_slack_mirror_receipt_commit
          fi

      - name: Verify Nebius ProofPatch trust split when present
        shell: bash
        run: |
          if [ -d competitions/nebius-proofpatch-2026 ]; then
            (
              cd competitions/nebius-proofpatch-2026
              python3 -m unittest -v test_proofpatch test_hardening
              python3 -O -m unittest -v test_proofpatch test_hardening
              python3 proofpatch.py demo > /tmp/proofpatch.json
              python3 proofpatch.py verify /tmp/proofpatch.json | grep STRUCTURAL_EVIDENCE_VERIFIED
              python3 proofpatch.py demo-verify | grep EXECUTOR_REPLAY_VERIFIED
            )
          fi

      - name: Verify recovered AP batch review without another workflow slot
        shell: bash
        run: |
          python3 -W error::ResourceWarning -m unittest -v test_unc_ap_ai_peoplesoft_batch.py
          python3 -O -W error::ResourceWarning -m unittest -v test_unc_ap_ai_peoplesoft_batch.py
          (
            cd revenue/opportunities/unc_ap_ai_peoplesoft
            python3 exercise_batch.py
            python3 -O exercise_batch.py
          )

      - name: Verify external opportunity intake without another workflow slot
        shell: bash
        run: |
          python3 -m py_compile revenue/external_opportunity_intake/*.py
          python3 -m revenue.external_opportunity_intake.selftest
          python3 -O -m revenue.external_opportunity_intake.selftest

      - name: Verify UIOWA-068 recovery evidence without another workflow slot
        shell: bash
        run: |
          python3 -m py_compile \
            revenue/uiowa_rfq_18649_recovery_evidence/assess_recovery.py \
            revenue/uiowa_rfq_18649_recovery_evidence/test_assess_recovery.py
          (
            cd revenue/uiowa_rfq_18649_recovery_evidence
            python3 -m unittest -v test_assess_recovery.py
            python3 assess_recovery.py fixtures/synthetic_recovery_records.json \
              --json-output /tmp/uiowa-068-report.json \
              --csv-output /tmp/uiowa-068-matrix.csv \
              --markdown-output /tmp/uiowa-068-scenario.md
            grep -q 'DEMONSTRATED' /tmp/uiowa-068-matrix.csv
            grep -q 'Successful backup evidence does not demonstrate restoration' /tmp/uiowa-068-scenario.md
          )

  provider-cost-truth:
    name: provider-cost-truth (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile pilot delivery / renewal / expansion gate
        run: >-
          python -m py_compile
          revenue/pilot_delivery_renewal_expansion_gate/common.py
          revenue/pilot_delivery_renewal_expansion_gate/model.py
          revenue/pilot_delivery_renewal_expansion_gate/engine.py
          revenue/pilot_delivery_renewal_expansion_gate/_trusted_runtime.py
          revenue/pilot_delivery_renewal_expansion_gate/test_gate.py
          test_pilot_delivery_renewal_expansion_gate.py
          test_pilot_delivery_renewal_reload_trust_root.py

      - name: Normal pilot delivery / renewal / expansion contract
        run: python -m unittest -v test_pilot_delivery_renewal_expansion_gate test_pilot_delivery_renewal_reload_trust_root

      - name: Optimized pilot delivery / renewal / expansion contract
        run: python -O -m unittest -v test_pilot_delivery_renewal_expansion_gate test_pilot_delivery_renewal_reload_trust_root

      - name: Compile provider-cost source
        run: python -m py_compile tools/provider_cost_truth/*.py

      - name: Prove provider-cost discovery is non-vacuous
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tools/provider_cost_truth', pattern='test_*.py')
          count = suite.countTestCases()
          print(f'provider-cost tests discovered: {count}')
          if count < 1:
              raise SystemExit('NO PROVIDER-COST TESTS DISCOVERED')
          PY

      - name: Normal provider-cost hostile suite
        run: python -m unittest discover -s tools/provider_cost_truth -p 'test_*.py' -v

      - name: Optimized provider-cost hostile suite
        run: python -O -m unittest discover -s tools/provider_cost_truth -p 'test_*.py' -v

  multi-framework-evidence-freshness:
    name: multi-framework-evidence-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile freshness gate and custody tests
        run: |
          python -m py_compile \
            revenue/multi_framework_evidence_freshness/__init__.py \
            revenue/multi_framework_evidence_freshness/gate.py \
            revenue/multi_framework_evidence_freshness/custody.py \
            revenue/multi_framework_evidence_freshness/golden.py \
            revenue/multi_framework_evidence_freshness/cli.py \
            tests/test_multi_framework_evidence_freshness.py \
            tests/test_multi_framework_evidence_freshness_custody.py

      - name: Prove focused discovery is non-vacuous
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              "tests", pattern="test_multi_framework_evidence_freshness*.py"
          )
          count = suite.countTestCases()
          print(f"multi-framework freshness tests discovered: {count}")
          if count < 1:
              raise SystemExit("NO TESTS DISCOVERED")
          PY

      - name: Normal Python freshness battery
        run: python -B -m unittest discover -s tests -p 'test_multi_framework_evidence_freshness*.py' -v

      - name: Optimized Python freshness battery
        run: python -O -B -m unittest discover -s tests -p 'test_multi_framework_evidence_freshness*.py' -v

  titan-final-spatial-carrier:
    name: titan-final-spatial-carrier (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/runtime/final-spatial-guard
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prove full carrier test discovery
        run: |
          python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('.', pattern='test_*.py')
          count = suite.countTestCases()
          print(f'final-spatial carrier tests discovered: {count}')
          if count < 36:
              raise SystemExit('incomplete final-spatial carrier discovery')
          PY
      - name: Normal production ABI and output nonmutation contracts
        run: python -B -W error::ResourceWarning -m unittest discover -s . -p 'test_*.py' -v
      - name: Optimized production ABI and output nonmutation contracts
        run: python -O -B -W error::ResourceWarning -m unittest discover -s . -p 'test_*.py' -v
      - name: Materialize exact candidate outside checkout and verify inputs unchanged
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import tempfile
          import apply_repair as carrier
          root = Path(os.environ['GITHUB_WORKSPACE'])
          before = carrier.validate_sources(root)
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as tmp:
              output = Path(tmp) / 'main.py'
              receipt = Path(tmp) / 'receipt.json'
              result = carrier.materialize(root, output, receipt_path=receipt)
              if result['candidate_git_blob_sha1'] != 'bb3a044aedefa36dcdc5d933ca396fefbf1d9fdd':
                  raise SystemExit('candidate semantics changed')
              if result['candidate_bytes'] != 30367:
                  raise SystemExit('candidate byte count changed')
              if json.loads(receipt.read_text()) != result:
                  raise SystemExit('receipt differs from returned result')
              compile(output.read_bytes(), str(output), 'exec')
              if carrier.validate_sources(root) != before:
                  raise SystemExit('canonical inputs changed')
              print(json.dumps(result, sort_keys=True))
          PY
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- \
            revenue/kaggriculture/cloud-execution-lab/main.py \
            revenue/kaggriculture/cloud-execution-lab/spatial_tempo.py
