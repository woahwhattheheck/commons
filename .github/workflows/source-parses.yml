name: source-parses

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "revenue/multi_framework_evidence_freshness/**"
      - "tests/test_multi_framework_evidence_freshness*.py"
      - "tools/provider_cost_truth/**"
      - "revenue/pilot_delivery_renewal_expansion_gate/**"
      - "test_pilot_delivery_renewal_expansion_gate.py"
      - "test_pilot_delivery_renewal_reload_trust_root.py"
      - "test_pilot_proof_scope.py"
      - "test_discord_push_scope.py"
      - ".github/workflows/source-parses.yml"
      - ".github/workflows/commons-discord-cloud.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - ".github/workflows/pilot-delivery-renewal-expansion-gate.yml"
      - ".github/workflows/source-parses.yml"
      - ".github/workflows/commons-discord-cloud.yml"

permissions:
  contents: read

concurrency:
  group: source-parses-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify checker contract
        run: |
          python3 -m unittest -v test_source_parses.py test_pilot_proof_scope.py test_discord_push_scope.py
          python3 -O -m unittest -v test_pilot_proof_scope.py test_discord_push_scope.py

      - name: Parse every tracked Python and JavaScript source
        run: python3 source_parses.py

      - name: Verify Fleet CI execution-truth contract when present
        shell: bash
        run: |
          if [ -d ci/actions_execution_truth ]; then
            (
              cd ci/actions_execution_truth
              python3 -m unittest -v test_core.py test_cli.py
              python3 -O -m unittest -v test_core.py test_cli.py
            )
          fi

      - name: Verify Slack mirror durable-delivery contract when present
        shell: bash
        run: |
          if [ -f host/slack_mirror_state.py ] && [ -f test_slack_mirror_delivery.py ]; then
            python3 -m unittest -v test_slack_mirror test_slack_mirror_state test_slack_mirror_delivery test_slack_mirror_receipt_commit
            python3 -O -m unittest -v test_slack_mirror test_slack_mirror_state test_slack_mirror_delivery test_slack_mirror_receipt_commit
          fi

  provider-cost-truth:
    name: provider-cost-truth (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile provider-cost source
        run: python -m py_compile tools/provider_cost_truth/*.py

      - name: Prove provider-cost discovery is non-vacuous
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tools/provider_cost_truth', pattern='test_*.py')
          count = suite.countTestCases()
          print(f'provider-cost tests discovered: {count}')
          if count < 1:
              raise SystemExit('NO PROVIDER-COST TESTS DISCOVERED')
          PY

      - name: Normal provider-cost hostile suite
        run: python -m unittest discover -s tools/provider_cost_truth -p 'test_*.py' -v

      - name: Optimized provider-cost hostile suite
        run: python -O -m unittest discover -s tools/provider_cost_truth -p 'test_*.py' -v

  multi-framework-evidence-freshness:
    name: multi-framework-evidence-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile freshness gate and custody tests
        run: |
          python -m py_compile \
            revenue/multi_framework_evidence_freshness/__init__.py \
            revenue/multi_framework_evidence_freshness/gate.py \
            revenue/multi_framework_evidence_freshness/custody.py \
            revenue/multi_framework_evidence_freshness/golden.py \
            revenue/multi_framework_evidence_freshness/cli.py \
            tests/test_multi_framework_evidence_freshness.py \
            tests/test_multi_framework_evidence_freshness_custody.py

      - name: Prove focused discovery is non-vacuous
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              "tests", pattern="test_multi_framework_evidence_freshness*.py"
          )
          count = suite.countTestCases()
          print(f"multi-framework freshness tests discovered: {count}")
          if count < 1:
              raise SystemExit("NO TESTS DISCOVERED")
          PY

      - name: Normal Python freshness battery
        run: python -B -m unittest discover -s tests -p 'test_multi_framework_evidence_freshness*.py' -v

      - name: Optimized Python freshness battery
        run: python -O -B -m unittest discover -s tests -p 'test_multi_framework_evidence_freshness*.py' -v


  pilot-delivery-renewal-expansion-gate:
    name: pilot-delivery-renewal-expansion-gate (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect pilot-renewal proof-surface changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|push|workflow_dispatch) ;;
            *) echo "Unsupported pilot proof-scope event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pilot proof scope requires an exact head commit SHA" >&2
            exit 2
          fi
          git rev-parse --verify "${HEAD_SHA}^{commit}" >/dev/null
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pilot proof scope requires an exact base commit SHA" >&2
            exit 2
          fi
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              # A newly created branch has no before commit: conservatively run proof.
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "A pull request cannot use the new-branch sentinel as its base" >&2
            exit 2
          fi
          git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null
          # Exit 0 means no relevant change, 1 means change, >1 means an error.
          # Do not pipe to grep -q: its early close can SIGPIPE git and hide changes.
          diff_status=0
          git diff --quiet --no-ext-diff --no-textconv "$BASE_SHA" "$HEAD_SHA" -- \
              'revenue/pilot_delivery_renewal_expansion_gate/**' \
              'test_pilot_delivery_renewal_expansion_gate.py' \
              'test_pilot_delivery_renewal_reload_trust_root.py' \
              'test_pilot_proof_scope.py' \
              '.github/workflows/pilot-delivery-renewal-expansion-gate.yml' \
              '.github/workflows/source-parses.yml' || diff_status=$?
          case "$diff_status" in
            0) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Pilot proof-scope git diff failed (exit $diff_status)" >&2
               exit "$diff_status" ;;
          esac

      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile pilot-renewal gate
        if: steps.scope.outputs.run == 'true'
        run: >-
          python -m py_compile
          revenue/pilot_delivery_renewal_expansion_gate/_trusted_runtime.py
          revenue/pilot_delivery_renewal_expansion_gate/common.py
          revenue/pilot_delivery_renewal_expansion_gate/model.py
          revenue/pilot_delivery_renewal_expansion_gate/engine.py
          revenue/pilot_delivery_renewal_expansion_gate/test_gate.py
          test_pilot_delivery_renewal_expansion_gate.py
          test_pilot_delivery_renewal_reload_trust_root.py

      - name: Contract tests
        if: steps.scope.outputs.run == 'true'
        run: >-
          python -m unittest -v
          test_pilot_delivery_renewal_expansion_gate
          test_pilot_delivery_renewal_reload_trust_root

      - name: Optimized contract tests
        if: steps.scope.outputs.run == 'true'
        run: >-
          python -O -m unittest -v
          test_pilot_delivery_renewal_expansion_gate
          test_pilot_delivery_renewal_reload_trust_root
