name: PR 14330 transfer repair

on:
  push:
    branches: [work-zad-001]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-zad-001
          fetch-depth: 0
      - name: Repair transferred test byte and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("coordination/connector_preflight/test_latest.py")
          text = path.read_text(encoding="utf-8")
          old = 'packet["overall_state""]'
          new = 'packet["overall_state"]'
          if text.count(old) != 1:
              raise SystemExit(f"expected one transfer marker, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git rm .github/workflows/pr14330-transfer-repair.yml
          git add coordination/connector_preflight/test_latest.py
          git -c user.name="commons-pr14330-repair" \
              -c user.email="commons-pr14330-repair@users.noreply.github.com" \
              commit -m "test(connector-preflight): repair exact transferred byte"
          git push origin HEAD:work-zad-001
