name: actions-execution-truth

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ci/actions_execution_truth/**"
      - ".github/workflows/actions-execution-truth.yml"

permissions:
  contents: read

concurrency:
  group: actions-execution-truth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile exact carrier
        run: python -m py_compile ci/actions_execution_truth/schema.py ci/actions_execution_truth/truth.py ci/actions_execution_truth/core.py ci/actions_execution_truth/cli.py ci/actions_execution_truth/test_core.py ci/actions_execution_truth/test_cli.py
      - name: Hostile suite
        run: python -m unittest -v ci/actions_execution_truth/test_core.py ci/actions_execution_truth/test_cli.py
      - name: Hostile suite (optimized)
        run: python -O -m unittest -v ci/actions_execution_truth/test_core.py ci/actions_execution_truth/test_cli.py
