name: e14-scheduler-vm

on:
  pull_request:
    paths:
      - '.github/workflows/e14-scheduler-vm.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/scheduler.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_scheduler_overflow_timing.py'

permissions:
  contents: write

jobs:
  e14:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: E14 scheduler regressions and existing scheduler suite
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONPATH: .:../cloud-runtime-pulse
        run: |
          set -euo pipefail
          python3 -B -m unittest -v test_scheduler_overflow_timing test_scheduler
      - name: Preserve old canonical archive, rebuild, and verify
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          old_sha="$(python3 - <<'PY'
import json
from pathlib import Path
print(json.loads(Path('runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())['sha256'])
PY
)"
          mkdir -p exports/historical
          historical="exports/historical/titan-${old_sha}.tar.gz"
          if [ -e "$historical" ]; then
            cmp "$historical" exports/titan-current.tar.gz
          else
            cp exports/titan-current.tar.gz "$historical"
          fi
          python3 -B build_integrated.py
          python3 -B build_integrated.py --check
          sha256sum exports/titan-current.tar.gz
          cat runtime/integrated-selected/CURRENT-ARCHIVE.json
      - name: Stage exact generated Git blobs and remove carrier
        run: |
          set -euo pipefail
          git config user.name "e14-vm-carrier"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/e14-scheduler-vm.yml
          git add \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/exports/historical/ \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Stage E14 canonical runtime artifacts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
