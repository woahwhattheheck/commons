name: titan-v3-inherited-sell-priority-sol-priority

on:
  push:
    branches:
      - 'sol-priority/titan-v3-inherited-sell-priority-20260910-01'
    paths:
      - '.github/workflows/titan-v3-inherited-sell-priority-sol-priority.yml'

permissions:
  contents: read

concurrency:
  group: titan-v3-inherited-sell-priority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collision-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record earlier-owner release
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'SOL-PARALLAX claimed this exact all-shed intent-priority arm first.' \
            'This branch is evidence-only; no patch, build, game, publication, or promotion runs.'
