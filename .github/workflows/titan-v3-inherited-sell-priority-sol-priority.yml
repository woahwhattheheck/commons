name: titan-v3-inherited-sell-priority-sol-priority

on:
  push:
    branches:
      - 'sol-priority/titan-v3-inherited-sell-priority-20260910-01'
    paths:
      - '.github/workflows/titan-v3-inherited-sell-priority-sol-priority.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/inherited-sell-priority-sol-priority/**'
      - 'revenue/kaggriculture/cloud-execution-lab/test_scheduler_priority.py'

permissions:
  contents: write

concurrency:
  group: titan-v3-inherited-sell-priority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact predecessor and apply one bounded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          LAB=revenue/kaggriculture/cloud-execution-lab
          CASE="$LAB/analysis/inherited-sell-priority-sol-priority"
          python -B "$CASE/verify.py" \
            --phase before \
            --output "$RUNNER_TEMP/BEFORE.json"
          git apply --check --whitespace=error-all "$CASE/change.patch"
          git apply --whitespace=error-all "$CASE/change.patch"
          python -B "$CASE/verify.py" \
            --phase after \
            --output "$RUNNER_TEMP/AFTER.json"
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "$LAB/build_integrated.py"
            "$LAB/frozen_selected.py"
            "$LAB/scheduler.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}" | sort)"

      - name: Run predecessor-killing and adjacent contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          for name in (
              'scheduler.py',
              'frozen_selected.py',
              'build_integrated.py',
              'test_scheduler_priority.py',
          ):
              source = Path(name).read_text(encoding='utf-8')
              compile(source, name, 'exec')
          PY
          python -B -m unittest -v \
            test_scheduler_priority.py \
            test_joint_market_slots.py \
            test_selected_pruning.py \
            test_funded_prefix.py \
            test_ordered_selected_sell.py \
            test_engine_semantics.py \
            2>&1 | tee "$RUNNER_TEMP/UNIT-TESTS.log"

      - name: Rebuild and verify the one canonical release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python -B build_integrated.py | tee "$RUNNER_TEMP/BUILD.json"
          python -B build_integrated.py --check | tee "$RUNNER_TEMP/CHECK.json"
          python -B - <<'PY' > "$RUNNER_TEMP/RELEASE.json"
          from pathlib import Path
          import hashlib
          import json
          import tarfile

          root = Path('.')
          archive = root / 'exports/titan-current.tar.gz'
          pointer_path = root / 'runtime/integrated-selected/CURRENT-ARCHIVE.json'
          source_path = root / 'runtime/integrated-selected/CURRENT-SOURCE.json'
          pointer = json.loads(pointer_path.read_text(encoding='utf-8'))
          archive_bytes = archive.read_bytes()
          actual_archive = hashlib.sha256(archive_bytes).hexdigest()
          if actual_archive != pointer['sha256']:
              raise SystemExit(
                  f"archive digest mismatch: {actual_archive} != {pointer['sha256']}"
              )
          source_bytes = source_path.read_bytes()
          actual_source = hashlib.sha256(source_bytes).hexdigest()
          if actual_source != pointer['source_manifest_sha256']:
              raise SystemExit(
                  f"source digest mismatch: {actual_source} != "
                  f"{pointer['source_manifest_sha256']}"
              )
          with tarfile.open(archive, mode='r:gz') as bundle:
              names = set(bundle.getnames())
              required = {
                  'scheduler.py',
                  'frozen_selected.py',
                  'checks/test_scheduler_priority.py',
                  'SOURCE.json',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'missing archive members: {missing}')
              if bundle.extractfile('scheduler.py').read() != (root / 'scheduler.py').read_bytes():
                  raise SystemExit('archive scheduler bytes differ from source')
              if bundle.extractfile('frozen_selected.py').read() != (
                      root / 'frozen_selected.py').read_bytes():
                  raise SystemExit('archive selected bytes differ from source')
              if bundle.extractfile('checks/test_scheduler_priority.py').read() != (
                      root / 'test_scheduler_priority.py').read_bytes():
                  raise SystemExit('archive priority contract differs from source')
              if bundle.extractfile('SOURCE.json').read() != source_bytes:
                  raise SystemExit('archive SOURCE.json differs from current manifest')
          manifest = json.loads(source_bytes)
          runtime = manifest['runtime']
          if pointer['runtime_files'] != len(runtime):
              raise SystemExit('pointer runtime count differs from source manifest')
          for member in ('scheduler.py', 'frozen_selected.py',
                         'checks/test_scheduler_priority.py'):
              if member not in runtime:
                  raise SystemExit(f'missing runtime manifest member: {member}')
          receipt = {
              'schema_version': 1,
              'operation': 'titan-v3-inherited-sell-priority-20260910-sol-priority-01',
              'event_sha': __import__('os').environ['GITHUB_SHA'],
              'archive': pointer,
              'scheduler_sha256': hashlib.sha256(
                  (root / 'scheduler.py').read_bytes()).hexdigest(),
              'frozen_selected_sha256': hashlib.sha256(
                  (root / 'frozen_selected.py').read_bytes()).hexdigest(),
              'contract_sha256': hashlib.sha256(
                  (root / 'test_scheduler_priority.py').read_bytes()).hexdigest(),
              'archive_required_members': sorted(required),
          }
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Enforce mutation boundary and publish generated release commit
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python -B - <<'PY'
          import subprocess

          lab = 'revenue/kaggriculture/cloud-execution-lab'
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'],
              text=True).splitlines())
          required = {
              f'{lab}/scheduler.py',
              f'{lab}/frozen_selected.py',
              f'{lab}/build_integrated.py',
              f'{lab}/exports/titan-current.tar.gz',
              f'{lab}/runtime/integrated-selected/CURRENT-SOURCE.json',
              f'{lab}/runtime/integrated-selected/CURRENT-ARCHIVE.json',
          }
          missing = sorted(required - changed)
          unexpected = sorted(
              path for path in changed
              if path not in required
              and not path.startswith(f'{lab}/exports/historical/titan-')
          )
          if missing:
              raise SystemExit(f'missing required generated paths: {missing}')
          if unexpected:
              raise SystemExit(f'unexpected generated paths: {unexpected}')
          historical = sorted(
              path for path in changed
              if path.startswith(f'{lab}/exports/historical/titan-')
          )
          if len(historical) > 1:
              raise SystemExit(f'multiple historical archives changed: {historical}')
          print('\n'.join(sorted(changed)))
          PY
          git config user.name 'SOL-PRIORITY'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$LAB/scheduler.py" \
            "$LAB/frozen_selected.py" \
            "$LAB/build_integrated.py" \
            "$LAB/exports/titan-current.tar.gz" \
            "$LAB/exports/historical" \
            "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" \
            "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json"
          git diff --cached --check
          git commit -m 'titan: restore inherited SELL target priority' \
            -m 'Preserve the complete V2 stock domain while restoring pending and baseline insertion order as the deterministic equal-rank tie break. Rebuild the exact canonical archive and bind the new predecessor-killing contract.'
          test -z "$(git status --porcelain)"
          remote="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD | tee "$RUNNER_TEMP/GENERATED-COMMIT.sha"

      - name: Retain exact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-inherited-sell-priority-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/BEFORE.json
            ${{ runner.temp }}/AFTER.json
            ${{ runner.temp }}/UNIT-TESTS.log
            ${{ runner.temp }}/BUILD.json
            ${{ runner.temp }}/CHECK.json
            ${{ runner.temp }}/RELEASE.json
            ${{ runner.temp }}/GENERATED-COMMIT.sha
          if-no-files-found: error
          retention-days: 30
