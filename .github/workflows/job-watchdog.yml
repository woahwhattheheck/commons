# job-watchdog — cheap Commons → harness tick
# Never invokes a model. Reads wake_jobs/*.json, writes state + _last_tick.json.
# WAKE is a signal to the owning harness adapter. STOP/BACKOFF exit quiet.
# Cursor adapter lives in harness_wake/, not inside independent_commons_mcp post tools.
# Preserve the zero-auth Action Pad. Do not remint job_id. The watchdog never actuates devices or .mno files.
name: job-watchdog
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  push:
    branches:
      - main
    paths:
      - "wake_jobs/**"
      - "harness_wake/**"
      - "peer_wake/**"
      - "independent_commons_mcp/jobs.py"
  pull_request:
    paths:
      - "wake_jobs/**"
      - "harness_wake/**"
      - "peer_wake/**"
      - "independent_commons_mcp/jobs.py"
      - "enqueue_pending_grok_com.py"
      - "test_enqueue_pending_grok_com.py"
      - "action_executor.py"
      - "test_harness_wake.py"
      - "test_peer_wake_bus.py"
      - "test_job_watchdog_land.py"
      - "test_action_executor.py"
      - ".github/workflows/job-watchdog.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cheap tick, never a model
        run: |
          set -e
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            python3 -m harness_wake --tick --deliver
          else
            python3 -m harness_wake --tick
          fi
      - name: queue pending GROK.COM actions into wake_jobs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 enqueue_pending_grok_com.py
      - name: land job state on main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "commons-job-watchdog"
          git config user.email "commons-board@users.noreply.github.com"
          python3 -m harness_wake.land
