name: reply to revenue envelope identity

on:
  push:
    paths:
      - "host/reply_to_revenue.py"
      - "host/reply_to_revenue_core.py"
      - "test_reply_to_revenue.py"
      - "test_reply_to_revenue_chronology.py"
      - "test_reply_to_revenue_event_identity.py"
      - ".github/workflows/reply-to-revenue-envelope-identity.yml"
  pull_request:
    paths:
      - "host/reply_to_revenue.py"
      - "host/reply_to_revenue_core.py"
      - "test_reply_to_revenue.py"
      - "test_reply_to_revenue_chronology.py"
      - "test_reply_to_revenue_event_identity.py"
      - ".github/workflows/reply-to-revenue-envelope-identity.yml"

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile exact surface
        run: |
          python -m py_compile \
            host/reply_to_revenue.py \
            host/reply_to_revenue_core.py \
            test_reply_to_revenue.py \
            test_reply_to_revenue_chronology.py \
            test_reply_to_revenue_event_identity.py
      - name: Run reply-to-revenue regressions
        run: |
          python -m unittest -v \
            test_reply_to_revenue \
            test_reply_to_revenue_chronology \
            test_reply_to_revenue_event_identity
      - name: Run optimized reply-to-revenue regressions
        run: |
          python -O -m unittest -v \
            test_reply_to_revenue \
            test_reply_to_revenue_chronology \
            test_reply_to_revenue_event_identity
