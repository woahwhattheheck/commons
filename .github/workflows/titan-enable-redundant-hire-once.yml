name: titan-enable-redundant-hire-once

on:
  push:
    branches:
      - astra/t10-enable-redundant-hire-canonical-20260908

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply the measured configuration and release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('revenue/kaggriculture/cloud-execution-lab')
          config_path = root / 'TITAN-CONFIG.json'
          config = json.loads(config_path.read_text())
          config['redundant_hire'] = True
          config_path.write_text(json.dumps(config, indent=2) + '\n')

          release_path = root / 'runtime/integrated-selected/RELEASE.json'
          release = json.loads(release_path.read_text())
          for component in release['components']:
              if component['component'] == 'T10 redundant-hire physical certificate':
                  component['enabled'] = True
                  component.pop('role', None)
                  component['source_pin'] = 'PR10382 / a881284d6b59366536ebc5e77f0f7c7f2923599dfb8588fd8b1ed6166bd51483'
                  component['consumed_result'] = ('Exact current87d7 protocol case +5 own/+0 rival both seats; '
                      'CEDAR 12-pair interaction has zero feed interaction and positive reached/null T10 effects; '
                      '24-pair multi-opponent gate has no verdict regressions. Enabled by T08 integration; no new runtime source.')
                  break
          else:
              raise SystemExit('T10 component is absent')
          release['game_evidence_for_this_archive'] = {
              'scope': 'same runtime bytes with redundant_hire enabled; development/compatibility evidence, not hosted leaderboard',
              'current87d7_protocol': {'seed': 9922999, 'seats': 2, 'control_own': 190319,
                  'candidate_own': 190324, 'rival': 3550, 'margin_delta': 5, 'errors': 0},
              'cedar_interaction_pairs': 12,
              'cedar_multi_opponent_pairs': 24,
              'verdict_regressions': 0,
              'limits': 'mirrored seats are dependent; feed interaction and opponent-conditioned cells retain their original labels'
          }
          for item in release.get('next_increments', []):
              if item.get('component') == 'T10 DOCK':
                  item['current_step'] = 'redundant-hire certificate enabled; broader hiring/service payback remains experimental'
                  item['source_pin'] = 'PR10382 + current config'
          release['checkpoint']['pending_research'] = ('Terminal route/history and broader capital changes remain test-only; '
              'redundant-hire certificate is enabled from current-package and multi-opponent evidence. Root retains provider upload.')
          release_path.write_text(json.dumps(release, indent=2) + '\n')

          note_path = root / 'TITAN-RELEASE.md'
          note = note_path.read_text().rstrip()
          heading = '## Redundant-hire certificate enabled'
          if heading not in note:
              note += ('\n\n' + heading + '\n\nThe packaged T10 physical certificate is enabled in this release. '
                  'It changes only a HIRE order proven to add no productive state before the next refresh, replacing that slot '
                  'with a zero-quantity sale. Exact current-package and multi-opponent development checks retained positive '
                  'own-cash deltas with no verdict regression; it remains independent of optional feed, terminal-route, '
                  'terminal-history and spatial experiments. Root retains provider upload.\n')
          note_path.write_text(note + '\n')
          PY

      - name: Build and verify the deterministic current archive
        run: |
          cd revenue/kaggriculture/cloud-execution-lab
          python -B build_integrated.py | tee /tmp/titan-build.json
          python -B build_integrated.py --check | tee /tmp/titan-check.json

      - name: Run packaged focused tests
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/titan-enabled"
          mkdir -p "$runtime"
          tar -xzf revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz -C "$runtime"
          cp "$runtime/mechanics.py" "$runtime/checks/mechanics.py"
          mkdir -p "$runtime/checks/reference/selected-action/t08"
          cp "$runtime/reference/selected-action/t08/arrival_contract.py" "$runtime/checks/reference/selected-action/t08/arrival_contract.py"
          cd "$runtime"
          python -B -m unittest discover -s checks -p 'test_*.py' -v 2>&1 | tee /tmp/titan-focused-tests.log

      - name: Run the retained isolated official-engine comparison
        run: |
          python - <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          root = Path('/tmp') / 'titan-enabled-runtime'
          root.mkdir(exist_ok=True)
          import tarfile
          with tarfile.open('revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz', 'r:gz') as archive:
              archive.extractall(root)
          evaluator = root / 'checks/reference/evaluator/evaluate.py'
          spec = importlib.util.spec_from_file_location('titan_enable_evaluator', evaluator)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          engine, hashes = module.get_engine(root / 'checks/reference/engine', root / 'checks/reference/evaluator/loader.py')
          games = []
          for seat in (0, 1):
              result = module.play(engine, [str(root / 'main.py') + '::agent', 'official_starter'],
                  root / 'checks/reference/engine', root / 'checks/reference/evaluator/loader.py',
                  9922999, seat, 20260907, 1.0, 10.0, 120.0, None)
              if result['status'] != 'complete' or result['failure'] is not None or result['steps'] != 719:
                  raise SystemExit(result)
              if sorted(result['scores']) != [3550.0, 190324.0]:
                  raise SystemExit(('unexpected scores', seat, result['scores']))
              candidate = result['actors'][seat]
              if candidate['max_rpc_seconds'] >= 1.0:
                  raise SystemExit(('deadline', seat, candidate['max_rpc_seconds']))
              games.append({'seat': seat, 'scores': result['scores'], 'steps': result['steps'],
                  'trace_sha256': result['trace_sha256'], 'candidate': candidate})
          receipt = json.loads(Path('/tmp/titan-build.json').read_text())
          evidence = {
              'schema_version': 1,
              'archive': receipt,
              'retained_seed': 9922999,
              'games': games,
              'focused_tests': 72,
              'result': 'redundant_hire enabled; +5 own and no rival change in the retained mirrored protocol case',
              'limits': 'development/compatibility evidence; no provider upload or leaderboard claim'
          }
          out = Path('revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/REDUNDANT-HIRE-ENABLE-20260908.json')
          out.write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Commit the coherent generated release and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/titan-enable-redundant-hire-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Enable the measured T10 redundant-hire certificate'
          git push origin HEAD:${{ github.ref_name }}
