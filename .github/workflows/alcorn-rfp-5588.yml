name: Alcorn RFP 5588 qualification

on:
  pull_request:
    paths:
      - 'commercial/alcorn-rfp-5588/**'
      - '.github/workflows/alcorn-rfp-5588.yml'
  push:
    branches: [main]
    paths:
      - 'commercial/alcorn-rfp-5588/**'
      - '.github/workflows/alcorn-rfp-5588.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normal hostile suite
        run: python -m unittest commercial/alcorn-rfp-5588/test_qualification.py -v
      - name: Optimized hostile suite
        run: python -O -m unittest commercial/alcorn-rfp-5588/test_qualification.py -v
      - name: Current evidence must remain HOLD
        run: |
          python commercial/alcorn-rfp-5588/qualification.py commercial/alcorn-rfp-5588/current_evidence.json > /tmp/result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/result.json'))
          assert r['state']=='HOLD', r
          assert set(r['missing_buyer_artifacts']) == {
              'section_viii_cost_information',
              'section_ix_references',
              'section_vii_item_12_requirements_matrix',
          }
          assert all(v is False for v in r['authority'].values()), r['authority']
          print(r['receipt_sha256'])
          PY
