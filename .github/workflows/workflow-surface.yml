name: workflow-surface
# Retained 67-slot trees pass this check. Do not raise max_active_workflows.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'ci/workflow-recipes/**'
      - 'ci/workflow-surface.json'
      - 'host/workflow_surface.py'
      - 'test_workflow_surface.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  structure:
    # Structural YAML/Python validation has no x86 dependency. Keep this
    # workflow-edit gate off the saturated ubuntu-latest admission queue.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Test invalid workflows and preserved recipe retrieval
        run: python -B -m unittest -v test_workflow_surface.py
      - name: Check active workflow budget and archive inventory
        run: python -B host/workflow_surface.py check
