name: sol-forge-titan-e07-buy-product-boundary-repair

on:
  push:
    branches:
      - "sol-forge/titan-e07-buy-product-source-boundary-20260909-01"

permissions:
  contents: write

concurrency:
  group: sol-forge-titan-e07-buy-product-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[e07-repair-built]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Pin branch and source preimages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "BASE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          echo "FROZEN_PREIMAGE=$(git rev-parse HEAD:revenue/kaggriculture/cloud-execution-lab/frozen_selected.py)" >> "$GITHUB_ENV"
          echo "TEST_PREIMAGE=$(git rev-parse HEAD:revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py)" >> "$GITHUB_ENV"

      - name: Apply exact E07 source-boundary repair
        run: |
          python3 -B revenue/kaggriculture/cloud-execution-lab/repairs/e07_buy_product_source_boundary.py

      - name: Run discriminating E07 contracts before release rebuild
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONPATH: ${{ github.workspace }}/revenue/kaggriculture/cloud-execution-lab:${{ github.workspace }}/revenue/kaggriculture/cloud-quickstep:${{ github.workspace }}/revenue/kaggriculture/cloud-runtime-pulse
        run: |
          python3 -B -m unittest -v \
            test_e07_same_turn_funding.SameTurnFundingContracts

      - name: Rebuild deterministic current release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          python3 -B build_integrated.py | tee "$RUNNER_TEMP/e07-build.json"

      - name: Mount rebuilt runtime support
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          rm -rf "$RUNNER_TEMP/e07-runtime"
          mkdir -p "$RUNNER_TEMP/e07-runtime"
          tar -xzf exports/titan-current.tar.gz -C "$RUNNER_TEMP/e07-runtime"
          test -f "$RUNNER_TEMP/e07-runtime/observed_clone.py"
          test -f "$RUNNER_TEMP/e07-runtime/seller_snapshot.py"
          test -f "$RUNNER_TEMP/e07-runtime/scheduler.py"

      - name: Run E07 and neighboring market/release contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONPATH: ${{ github.workspace }}/revenue/kaggriculture/cloud-execution-lab:${{ github.workspace }}/revenue/kaggriculture/cloud-quickstep:${{ github.workspace }}/revenue/kaggriculture/cloud-runtime-pulse:${{ runner.temp }}/e07-runtime
        run: |
          python3 -B -m unittest -v \
            test_e07_hosted_source_path \
            test_e07_same_turn_funding \
            test_joint_market_slots \
            test_e10_floor_cycle \
            test_release_consistency \
            test_build_publication

      - name: Verify deterministic release is clean
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          python3 -B build_integrated.py --check | tee "$RUNNER_TEMP/e07-check.json"

      - name: Write durable repair receipt
        shell: python
        env:
          LAB: revenue/kaggriculture/cloud-execution-lab
          RECEIPT_PATH: p/sol-forge-titan-e07-buy-product-source-boundary-20260909-01.md
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          lab = root / os.environ["LAB"]
          source = lab / "frozen_selected.py"
          tests = lab / "test_e07_same_turn_funding.py"
          archive_receipt_path = lab / "runtime/integrated-selected/CURRENT-ARCHIVE.json"
          archive_receipt = json.loads(archive_receipt_path.read_text(encoding="utf-8"))
          archive = lab / archive_receipt["path"]
          source_manifest = lab / archive_receipt["source_manifest"]

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          run_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          text = f"""# SOL-FORGE — TITAN E07 BUY_PRODUCT source-boundary repair

Operation: `TITAN-E07-BUY-PRODUCT-SOURCE-BOUNDARY-REPAIR-20260909-01`

## Source identity

- Fresh base: `{os.environ['BASE_SHA']}`
- Builder event head: `{os.environ['GITHUB_SHA']}`
- `frozen_selected.py` preimage blob: `{os.environ['FROZEN_PREIMAGE']}`
- `test_e07_same_turn_funding.py` preimage blob: `{os.environ['TEST_PREIMAGE']}`

## Defect and repair

`fund_same_turn_acquisition()` previously considered every later selected SELL
as a funding source. When the first failing fixed-price acquisition appeared
before a later variable-price `BUY_PRODUCT`, a SELL after that hard boundary
could be moved ahead of both orders, changing market interleaving that the
prefix model explicitly refuses to simulate.

The repair caps source enumeration at the first `BUY_PRODUCT` barrier. A sale
before the barrier remains eligible; a sale after it remains in place. No
market row, sale quantity, actor action, acquisition target, or rival state is
invented.

## Verification

PASS on the exact runner checkout:

- `SameTurnFundingContracts`, including the new blocked-after-boundary witness
  and the preserving before-boundary countercase.
- `test_e07_hosted_source_path`
- `test_e07_same_turn_funding`
- `test_joint_market_slots`
- `test_e10_floor_cycle`
- `test_release_consistency`
- `test_build_publication`
- `python3 -B build_integrated.py --check`

Hosted run: {run_url}

## Regenerated canonical release

- Archive: `{archive_receipt['sha256']}` / {archive_receipt['bytes']} B /
  {archive_receipt['runtime_files']} runtime files
- Archive bytes verified: `{sha256(archive)}`
- Source-manifest receipt: `{archive_receipt['source_manifest_sha256']}`
- Source-manifest bytes verified: `{sha256(source_manifest)}`
- Patched source SHA256: `{sha256(source)}`
- Patched test SHA256: `{sha256(tests)}`

Changed paths generated before publication:

```text
{chr(10).join(changed)}
```

No gameplay, Kaggle submission, provider mutation, purchased infrastructure,
hidden-state assumption, or playing-strength claim was made.
"""
          destination = root / os.environ["RECEIPT_PATH"]
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(text, encoding="utf-8")

      - name: Guard changed paths and publish exact generated bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"

          git add \
            revenue/kaggriculture/cloud-execution-lab/frozen_selected.py \
            revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/exports/historical \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-TESTS.json \
            p/sol-forge-titan-e07-buy-product-source-boundary-20260909-01.md

          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          allowed_exact = {
              "revenue/kaggriculture/cloud-execution-lab/frozen_selected.py",
              "revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py",
              "revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz",
              "revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json",
              "revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json",
              "revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-TESTS.json",
              "p/sol-forge-titan-e07-buy-product-source-boundary-20260909-01.md",
          }
          allowed_prefix = (
              "revenue/kaggriculture/cloud-execution-lab/exports/historical/",
          )
          paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          unexpected = [
              p for p in paths
              if p not in allowed_exact and not p.startswith(allowed_prefix)
          ]
          if unexpected:
              raise SystemExit(f"unexpected generated paths: {unexpected}")
          required = {
              "revenue/kaggriculture/cloud-execution-lab/frozen_selected.py",
              "revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py",
              "revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz",
              "revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json",
              "revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json",
              "p/sol-forge-titan-e07-buy-product-source-boundary-20260909-01.md",
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f"required generated paths missing: {missing}")
          print("guarded changed paths:")
          print("\n".join(paths))
          PY

          git config user.name "SOL-FORGE"
          git config user.email "sol-forge@commons.local"
          git commit -m "fix(titan): stop E07 sale sources at BUY_PRODUCT boundary [e07-repair-built]"
          git push origin "HEAD:$GITHUB_REF_NAME"
