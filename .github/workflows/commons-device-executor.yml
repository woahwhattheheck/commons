name: commons-device-executor
on:
  workflow_run:
    workflows: ["commons-board"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commons-device-executor
  cancel-in-progress: false
jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, commons-device]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fire device verbs
        run: python3 action_executor.py --scope device > .action_changed.json
      - name: land action receipts
        run: python3 action_land.py
