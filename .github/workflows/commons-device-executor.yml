name: commons-device-executor
on:
  workflow_run:
    workflows: ["commons-board"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_pending: ${{ steps.pending.outputs.has_pending }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: pending
        name: measure history-unlatched device actions on current main
        run: >-
          python3 device_action_state.py preflight
          --github-output "$GITHUB_OUTPUT"
  cycle:
    needs: preflight
    if: needs.preflight.outputs.has_pending == 'true'
    uses: ./.github/workflows/commons-device-cycle.yml
    permissions:
      contents: write
    concurrency:
      group: commons-device-executor
      cancel-in-progress: false
      queue: max
