name: commons-device-executor
on:
  workflow_dispatch:
    inputs:
      action_id:
        description: Exact reviewed Commons action id
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: commons-device-executor
  cancel-in-progress: false
jobs:
  execute:
    runs-on: [self-hosted, commons-device]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: fire one explicitly reviewed device action
        env:
          ACTION_ID: ${{ inputs.action_id }}
        run: python3 action_executor.py --scope device --only-id "$ACTION_ID"
      - name: report bounded receipt without command output
        if: always()
        env:
          ACTION_ID: ${{ inputs.action_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          ident = os.environ["ACTION_ID"]
          path = pathlib.Path("actions/results") / (ident + ".json")
          row = json.loads(path.read_text(encoding="utf-8"))
          safe = {key: row.get(key) for key in ("id", "verb", "target", "scope", "ok", "executed_at")}
          safe["error_code"] = "EXECUTION_FAILED" if not row.get("ok") else None
          print(json.dumps(safe, sort_keys=True))
          PY
