name: titan v3 canonical closure diagnostics sol closure

on:
  push:
    branches:
      - 'sol/titan-v3-canonical-closure-diagnostics-20260910-01'
    paths:
      - '.github/workflows/titan-v3-canonical-closure-sol-closure.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/canonical-closure-20260910-sol-closure/**'

permissions:
  contents: write

concurrency:
  group: titan-v3-canonical-closure-sol-closure
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  LAB: revenue/kaggriculture/cloud-execution-lab
  CASE: revenue/kaggriculture/cloud-execution-lab/analysis/canonical-closure-20260910-sol-closure
  EXPECTED_BASE: 98a98108998efac9e53a8b045f0fb2c85a4b19e2
  PREDECESSOR_SHA256: 17f536087b3a6baf4ae1222a051285766a3ea8c2ca5af6edc190d4f527e12b86

jobs:
  close-current-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact fresh parent and untouched builder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git diff --exit-code "$EXPECTED_BASE" -- "$LAB/build_integrated.py"

      - name: Install exact idempotent diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          python "$CASE/apply_patch.py" | tee "$CASE/PATCH.json"
          second="$(python "$CASE/apply_patch.py")"
          python - "$second" <<'PY'
          import json, sys
          result = json.loads(sys.argv[1])
          if result.get('changed') is not False:
              raise SystemExit('diagnostic patch is not idempotent')
          PY

      - name: Run focused diagnostic contracts
        shell: bash
        run: |
          set -euo pipefail
          python "$CASE/test_diagnostics.py" -v
          python - "$LAB/build_integrated.py" "$CASE/apply_patch.py" "$CASE/verify_extracted.py" "$CASE/test_diagnostics.py" <<'PY'
          import sys
          from pathlib import Path
          for name in sys.argv[1:]:
              path = Path(name)
              compile(path.read_bytes(), str(path), 'exec')
          print('source compile PASS:', len(sys.argv)-1)
          PY

      - name: Capture exact pre-build drift
        shell: bash
        run: |
          set -euo pipefail
          python "$LAB/build_integrated.py" --diagnose > "$CASE/DRIFT-BEFORE.json"
          python - "$CASE/DRIFT-BEFORE.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          if report.get('status') != 'drift':
              raise SystemExit('expected the claimed stale publication before rebuild')
          print('pre-build runtime drift:', json.dumps(report['runtime'], sort_keys=True))
          PY

      - name: Rebuild the single current package and verify deterministic identity
        shell: bash
        run: |
          set -euo pipefail
          python "$LAB/build_integrated.py" > "$CASE/BUILD.json"
          python "$LAB/build_integrated.py" --check > "$CASE/CHECK.json"
          python "$LAB/build_integrated.py" --diagnose > "$CASE/DRIFT-AFTER.json"
          python - "$LAB" "$CASE/DETERMINISM.json" <<'PY'
          import hashlib
          import importlib.util
          import json
          import sys
          from pathlib import Path
          lab = Path(sys.argv[1])
          output = Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location('closure_builder', lab/'build_integrated.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          first = module.render()
          second = module.render()
          if first != second:
              raise SystemExit('two in-process deterministic renders differ')
          report = {
              'status': 'pass',
              'archive_sha256': hashlib.sha256(first[0]).hexdigest(),
              'manifest_sha256': hashlib.sha256(first[1]).hexdigest(),
              'receipt': first[2],
          }
          output.write_text(json.dumps(report, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Verify extracted archive closure without trusting the checkout
        shell: bash
        run: |
          set -euo pipefail
          python "$CASE/verify_extracted.py" \
            --archive "$LAB/exports/titan-current.tar.gz" \
            --receipt "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json" \
            --output "$CASE/EXTRACTED-SMOKE.json"

      - name: Validate custody, closeout state, and exact changed-path boundary
        shell: bash
        run: |
          set -euo pipefail
          python - "$LAB" "$CASE" "$EXPECTED_BASE" "$PREDECESSOR_SHA256" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          lab = Path(sys.argv[1])
          case = Path(sys.argv[2])
          expected_base = sys.argv[3]
          predecessor = sys.argv[4]
          before = json.loads((case/'DRIFT-BEFORE.json').read_text(encoding='utf-8'))
          after = json.loads((case/'DRIFT-AFTER.json').read_text(encoding='utf-8'))
          build = json.loads((case/'BUILD.json').read_text(encoding='utf-8'))
          check = json.loads((case/'CHECK.json').read_text(encoding='utf-8'))
          smoke = json.loads((case/'EXTRACTED-SMOKE.json').read_text(encoding='utf-8'))
          deterministic = json.loads((case/'DETERMINISM.json').read_text(encoding='utf-8'))
          if after.get('status') != 'clean':
              raise SystemExit('post-build diagnostics are not clean')
          if build != check or build != deterministic.get('receipt'):
              raise SystemExit('build, check, and independent render receipts differ')
          if smoke.get('sha256') != build.get('sha256'):
              raise SystemExit('extracted smoke did not consume the built archive')
          old = lab/'exports/historical'/f'titan-{predecessor}.tar.gz'
          if not old.is_file() or hashlib.sha256(old.read_bytes()).hexdigest() != predecessor:
              raise SystemExit('predecessor archive custody is missing or corrupt')

          runtime = before['runtime']
          exact_members = {
              'added': runtime['added'],
              'removed': runtime['removed'],
              'changed': [item['member'] for item in runtime['changed']],
              'unchanged': runtime['unchanged'],
          }
          closure = {
              'status': 'closed',
              'scope': 'package-source-pointer identity; no gameplay or config change',
              'base_commit': expected_base,
              'trigger_commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'predecessor_archive_sha256': predecessor,
              'pre_build': {
                  'status': before['status'],
                  'pointer_matches': before['pointer']['matches'],
                  'archive_matches': before['archive']['matches'],
                  'manifest_matches': before['manifest']['matches'],
                  'runtime': exact_members,
              },
              'published': build,
              'post_build_status': after['status'],
              'extracted_smoke': smoke,
              'determinism': deterministic,
          }
          (case/'CLOSURE.json').write_text(
              json.dumps(closure, indent=2, sort_keys=True)+'\n', encoding='utf-8')

          allowed = {
              str(lab/'build_integrated.py'),
              str(lab/'exports/titan-current.tar.gz'),
              str(old),
              str(lab/'runtime/integrated-selected/CURRENT-SOURCE.json'),
              str(lab/'runtime/integrated-selected/CURRENT-ARCHIVE.json'),
              *(str(case/name) for name in (
                  'PATCH.json', 'DRIFT-BEFORE.json', 'BUILD.json', 'CHECK.json',
                  'DRIFT-AFTER.json', 'DETERMINISM.json', 'EXTRACTED-SMOKE.json',
                  'CLOSURE.json')),
          }
          raw = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'])
          entries = [entry for entry in raw.split(b'\0') if entry]
          changed = set()
          for entry in entries:
              if len(entry) < 4:
                  raise SystemExit(f'malformed porcelain entry: {entry!r}')
              code = entry[:2].decode('ascii', 'strict')
              if 'R' in code or 'C' in code:
                  raise SystemExit('renames/copies are outside the closure boundary')
              changed.add(entry[3:].decode('utf-8', 'surrogateescape'))
          unexpected = sorted(changed-allowed)
          if unexpected:
              raise SystemExit('unexpected closure paths: '+', '.join(unexpected))
          required = {
              str(lab/'build_integrated.py'),
              str(lab/'exports/titan-current.tar.gz'),
              str(old),
              str(lab/'runtime/integrated-selected/CURRENT-SOURCE.json'),
              str(lab/'runtime/integrated-selected/CURRENT-ARCHIVE.json'),
              str(case/'CLOSURE.json'),
          }
          missing = sorted(required-changed)
          if missing:
              raise SystemExit('required closure paths did not change: '+', '.join(missing))
          print(json.dumps(closure, sort_keys=True))
          PY

      - name: Commit exact closure outputs to the claimed branch
        shell: bash
        run: |
          set -euo pipefail
          old="$LAB/exports/historical/titan-$PREDECESSOR_SHA256.tar.gz"
          git add -- \
            "$LAB/build_integrated.py" \
            "$LAB/exports/titan-current.tar.gz" \
            "$old" \
            "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" \
            "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json" \
            "$CASE/PATCH.json" \
            "$CASE/DRIFT-BEFORE.json" \
            "$CASE/BUILD.json" \
            "$CASE/CHECK.json" \
            "$CASE/DRIFT-AFTER.json" \
            "$CASE/DETERMINISM.json" \
            "$CASE/EXTRACTED-SMOKE.json" \
            "$CASE/CLOSURE.json"
          git diff --cached --check
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"
          git config user.name 'SOL-CLOSURE'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(titan): close canonical package drift' \
            -m 'Add exact non-mutating runtime-member diagnostics, preserve the 17f536 predecessor, rebuild the single current archive, and verify the extracted main.py::agent closure. No gameplay/config/Kaggle/provider change.'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish closure receipt in the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '# TITAN canonical closure — SOL-CLOSURE'
            echo
            echo '- Base: `'$EXPECTED_BASE'`'
            echo '- Predecessor archive: `'$PREDECESSOR_SHA256'`'
            echo '- Branch: `'$GITHUB_REF_NAME'`'
            echo
            if [[ -f "$CASE/CLOSURE.json" ]]; then
              echo '```json'
              cat "$CASE/CLOSURE.json"
              echo '```'
            else
              echo 'Closure receipt was not produced; inspect the failing step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
