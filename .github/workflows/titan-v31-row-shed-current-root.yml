name: titan-v31-row-shed-current-root

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root/**'
      - '.github/workflows/titan-v31-row-shed-current-root.yml'

permissions:
  contents: read

concurrency:
  group: titan-v31-row-shed-current-root-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact live root, shipped factors, and donor scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha }}'
          ROOT='8e3d92a286806f9f9525973ee7d359b629a11487'
          CASE='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root'
          R04='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py'
          APPLY='revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py'
          B5='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/b5_fertilize.py'
          JIT='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/jit_pass_fertilize.py'

          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git merge-base "$ROOT" HEAD)" = "$ROOT"
          test "$(git ls-remote origin refs/heads/titan/v3.1-20260911 | awk '{print $1}')" = "$ROOT"

          mapfile -t actual < <(git diff --name-only "$ROOT" HEAD | sort)
          expected=(
            '.github/workflows/titan-v31-row-shed-current-root.yml'
            "$CASE/README.md"
            "$CASE/candidate.py"
            "$CASE/row_shed.py"
            "$CASE/test_row_shed.py"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${expected[*]}"
          git diff --check "$ROOT" HEAD

          test "$(git rev-parse "$ROOT:$R04")" = '7edacbfb4916b8f241b689ded6643240ca02a9ec'
          test "$(git rev-parse "HEAD:$R04")" = '7edacbfb4916b8f241b689ded6643240ca02a9ec'
          test "$(git rev-parse "$ROOT:$APPLY")" = 'a43d6c470ab05d87803fb016966d1cc54fab9d17'
          test "$(git rev-parse "HEAD:$APPLY")" = 'a43d6c470ab05d87803fb016966d1cc54fab9d17'
          test "$(git rev-parse "HEAD:$B5")" = '2a9d606835b0d04d832a4737dcb381ad3fbef1ae'
          test "$(git rev-parse "HEAD:$JIT")" = '6ef7ddcd9590e3cb3f55ceb708b8026235d59410'

          grep -F '"r04_b5_carrot_fertilizer": True' "$APPLY"
          grep -F '"r04_b5_jit_fertilize": True' "$APPLY"
          grep -F '"r04_strawberry_topup": True' "$APPLY"
          grep -F '"r04_no_late_sale_advance": True' "$APPLY"
          grep -F '"r04_sale_fertilizer": True' "$APPLY"
          grep -F 'def order_sells(market, inventory):' "$R04"
          grep -F 'ordered = order_sells(market, inventory)' "$R04"
          test -z "$(git status --porcelain)"

      - name: Run focused row-shed contracts and bind wrapper tuple
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root
          python -B -m py_compile row_shed.py candidate.py test_row_shed.py
          python -B -m unittest -v test_row_shed.py |& tee "$RUNNER_TEMP/row-shed-tests.log"
          grep -E '^Ran 7 tests in [0-9.]+s$' "$RUNNER_TEMP/row-shed-tests.log"
          grep -Fx 'OK' "$RUNNER_TEMP/row-shed-tests.log"
          ! grep -E 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/row-shed-tests.log"
          python -B - <<'PY'
          import candidate
          cfg = candidate.CURRENT_8E3
          assert cfg['horizon'] == 8 and type(cfg['horizon']) is int
          assert cfg['opening'] == 0 and type(cfg['opening']) is int
          assert cfg['row_order'] is True
          assert cfg['evening_flush'] is True
          assert cfg['sale_fertilizer'] is True
          assert cfg['cattle_early'] is True
          assert cfg['strawberry_topup'] is True
          assert cfg['no_late_sale_advance'] is True
          assert cfg['no_late_sale_advance_step'] == 648 and type(cfg['no_late_sale_advance_step']) is int
          assert cfg['b5_carrot_fertilizer'] is True
          assert cfg['b5_jit_fertilize'] is True
          print('ROW_SHED_8E3_TUPLE_OK')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
