name: backup-ref-regressions

on:
  pull_request:
    paths:
      - "host/repo_backup.py"
      - "test_repo_backup.py"
      - "test_repo_backup_head_identity.py"
      - "test_repo_backup_refs.py"
      - "test_repo_backup_short_writes.py"
      - "test_repo_backup_manifest_encoding.py"
      - "test_backup_workflow_source_transfer.py"
      - "open_door_guard.py"
      - "open_door_guard_core.py"
      - "backups/README.md"
      - "ground/BACKUP_OPEN_REPO.md"
      - "AGENTS.md"
      - ".github/workflows/open-repo-backup.yml"
      - ".github/workflows/lattice-delta-backup-refs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /host/repo_backup.py
            /test_repo_backup.py
            /test_repo_backup_head_identity.py
            /test_repo_backup_refs.py
            /test_repo_backup_short_writes.py
            /test_repo_backup_manifest_encoding.py
            /test_backup_workflow_source_transfer.py
            /open_door_guard.py
            /open_door_guard_core.py
            /AGENTS.md
            /ground/BACKUP_OPEN_REPO.md
            /backups/README.md
            /.github/workflows/open-repo-backup.yml
            /.github/workflows/lattice-delta-backup-refs.yml
      - name: Package exact committed backup test sources
        shell: bash
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/backup-test-source.tar" HEAD -- \
            host/repo_backup.py test_repo_backup.py test_repo_backup_head_identity.py test_repo_backup_refs.py \
            test_repo_backup_short_writes.py test_repo_backup_manifest_encoding.py \
            test_backup_workflow_source_transfer.py open_door_guard.py open_door_guard_core.py AGENTS.md \
            ground/BACKUP_OPEN_REPO.md backups/README.md \
            .github/workflows/open-repo-backup.yml .github/workflows/lattice-delta-backup-refs.yml
          git rev-parse HEAD > "$RUNNER_TEMP/backup-test-source.commit"
      - uses: actions/upload-artifact@v4
        with:
          name: backup-test-source
          path: |
            ${{ runner.temp }}/backup-test-source.tar
            ${{ runner.temp }}/backup-test-source.commit
          if-no-files-found: error
          retention-days: 1

  restore-regressions:
    name: restore-regressions (${{ matrix.os }})
    needs: source-snapshot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      # Git for Windows rejects unrelated tree entries before sparse checkout.
      # Both platforms instead consume the same committed source archive.
      - uses: actions/download-artifact@v4
        with:
          name: backup-test-source
          path: ${{ runner.temp }}/backup-test-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore exact test source
        shell: python
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          import os
          from pathlib import Path
          import tarfile

          source = Path(os.environ["RUNNER_TEMP"]) / "backup-test-source"
          commit = (source / "backup-test-source.commit").read_text().strip()
          if commit != os.environ["EXPECTED_SOURCE_COMMIT"]:
              raise SystemExit("backup test source commit differs from workflow commit")
          with tarfile.open(source / "backup-test-source.tar", "r:") as archive:
              archive.extractall(path=os.environ["GITHUB_WORKSPACE"], filter="data")
          print(f"Backup test source commit: {commit}")
      - name: Git and Python versions
        run: |
          git --version
          python --version
      - name: Existing backup contracts and complete ref round trips
        run: python -m unittest -v test_repo_backup test_repo_backup_head_identity test_repo_backup_refs test_repo_backup_short_writes test_repo_backup_manifest_encoding test_backup_workflow_source_transfer
