name: dcsa-innovation-call-01
on:
  pull_request:
    paths: ['revenue/dcsa_innovation_call_01/**', '.github/workflows/dcsa-innovation-call-01.yml']
  push:
    paths: ['revenue/dcsa_innovation_call_01/**', '.github/workflows/dcsa-innovation-call-01.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m unittest discover -s revenue/dcsa_innovation_call_01/tests -v
      - run: python -O -m unittest discover -s revenue/dcsa_innovation_call_01/tests -v
      - run: python -m py_compile revenue/dcsa_innovation_call_01/carrier.py revenue/dcsa_innovation_call_01/tests/test_carrier.py
