name: verified-paid-proof

on:
  pull_request:
    paths:
      - 'revenue/verified_paid_proof/**'
      - '.github/workflows/verified-paid-proof.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/verified_paid_proof/**'
      - '.github/workflows/verified-paid-proof.yml'

permissions:
  contents: read

jobs:
  hostile-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normal interpreter
        run: python -m unittest revenue.verified_paid_proof.test_verified_paid_proof -v
      - name: Optimized interpreter
        run: python -O -m unittest revenue.verified_paid_proof.test_verified_paid_proof -v
      - name: Synthetic compile smoke
        run: |
          rm -rf /tmp/verified-paid-proof
          python -m revenue.verified_paid_proof.verified_paid_proof revenue/verified_paid_proof/example.synthetic.json --out-dir /tmp/verified-paid-proof
          test -s /tmp/verified-paid-proof/proof.json
          test -s /tmp/verified-paid-proof/proof.md
          test -s /tmp/verified-paid-proof/receipt.sha256
