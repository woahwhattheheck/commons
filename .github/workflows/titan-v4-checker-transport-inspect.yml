name: Titan V4 checker transport inspect

on:
  push:
    branches:
      - astra/titan-v4-checker-transport-inspect-20260911-01

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and inspect trusted checker transports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_transport() {
            local sha="$1"
            local stem="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "${stem}.gz"
            gzip -dc "${stem}.gz" > "${stem}"
            printf '%s bytes=%s gitblob=%s sha256=%s\n' \
              "${stem}" "$(wc -c < "${stem}")" "$(git hash-object "${stem}")" "$(sha256sum "${stem}" | awk '{print $1}')"
          }

          fetch_transport 82ea22d893638465e6d4b01307a314206ac77ced stage1_base
          fetch_transport 958640f146f1710c7e06a6dc78e78fafb57e5f23 stage1_patch
          fetch_transport 7d7a072c6daf57e3ce7eb3b9f76e735510483052 stage2_patch

          echo '--- stage1_patch file ---'
          file stage1_patch
          echo '--- stage1_patch head ---'
          sed -n '1,220p' stage1_patch
          echo '--- stage1_patch tail ---'
          tail -n 120 stage1_patch
          echo '--- stage1_patch interfaces ---'
          grep -nE 'argparse|sys\.argv|def main|__main__|Path\(|open\(|read_text|write_text|stdin|stdout' stage1_patch || true

          echo '--- stage2_patch file ---'
          file stage2_patch
          echo '--- stage2_patch head ---'
          sed -n '1,260p' stage2_patch
          echo '--- stage2_patch tail ---'
          tail -n 140 stage2_patch
          echo '--- stage2_patch interfaces ---'
          grep -nE 'argparse|sys\.argv|def main|__main__|Path\(|open\(|read_text|write_text|stdin|stdout' stage2_patch || true
