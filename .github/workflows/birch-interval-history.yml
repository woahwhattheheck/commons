name: birch-interval-history

on:
  pull_request:
    paths:
      - '.github/workflows/birch-interval-history.yml'
      - 'revenue/kaggriculture/cloud-market-game-theory/consumer-history-v2/interval-family/**'
      - 'revenue/kaggriculture/cloud-market-game-theory/consumer-history-v2/joint-capacity/reanalyze.py'
      - 'revenue/kaggriculture/cloud-market-response/selected_action_history.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/birch-interval-history.yml
            /revenue/kaggriculture/cloud-market-game-theory/consumer-history-v2/SOURCE-FREEZE.json
            /revenue/kaggriculture/cloud-market-game-theory/consumer-history-v2/results/*/history_on-*.json
            /revenue/kaggriculture/cloud-market-game-theory/consumer-history-v2/joint-capacity/reanalyze.py
            /revenue/kaggriculture/cloud-market-game-theory/consumer-history-v2/interval-family/
            /revenue/kaggriculture/cloud-market-response/selected_action_history.py
      - name: Fetch exact frozen history source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --filter=blob:none --no-tags --depth=1 origin 2fc1418f3724ac09232e35a2a583414ce0ee8f84
      - name: Test complete interval-family consumer
        shell: bash
        run: |
          set -euo pipefail
          DIR=revenue/kaggriculture/cloud-market-game-theory/consumer-history-v2/interval-family
          python3 -B "$DIR/test_interval_family.py" -v \
            2>&1 | tee "$RUNNER_TEMP/interval-family-tests.log"
      - name: Scan retained history-v2 bank
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/history-v2-interval-family"
          python3 -B revenue/kaggriculture/cloud-market-game-theory/consumer-history-v2/interval-family/scan_bank.py --output "$OUT" \
            2>&1 | tee "$OUT.log"
          cp "$OUT.log" "$OUT/execution.log"
          cp "$RUNNER_TEMP/interval-family-tests.log" "$OUT/tests.log"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: birch-interval-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-v2-interval-family/
          if-no-files-found: error
          retention-days: 7
