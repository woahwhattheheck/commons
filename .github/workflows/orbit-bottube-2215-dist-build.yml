name: ORBIT BoTTube 2215 dist build

on:
  push:
    branches:
      - 'orbit-sol/bottube-2215-dist-build-20260908-01'
    paths:
      - '.github/workflows/orbit-bottube-2215-dist-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact paid head
        uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/bottube
          ref: 4fca8b4a353fad7ca1513b8107ba559f6c5cb617
          fetch-depth: 0
          path: bottube

      - name: Use current hosted Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact head and record base tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C bottube rev-parse HEAD)" = "4fca8b4a353fad7ca1513b8107ba559f6c5cb617"
          mkdir -p evidence/js-sdk/dist
          {
            echo "head=$(git -C bottube rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } > evidence/tool-versions.txt

      - name: Install, attempt manifest build, and recover only known DTS crash
        shell: bash
        run: |
          set -euo pipefail
          cd bottube/js-sdk
          npm install --no-audit --no-fund
          echo "tsup=$(./node_modules/.bin/tsup --version | head -n 1)" >> ../../evidence/tool-versions.txt
          echo "typescript=$(./node_modules/.bin/tsc --version | head -n 1)" >> ../../evidence/tool-versions.txt

          set +e
          npm run build > ../../evidence/manifest-build.log 2>&1
          manifest_status=$?
          set -e
          echo "manifest_build_exit=$manifest_status" >> ../../evidence/tool-versions.txt

          if [ "$manifest_status" -eq 0 ]; then
            echo manifest > ../../evidence/build-mode.txt
          else
            if ! grep -q "useCaseSensitiveFileNames" ../../evidence/manifest-build.log; then
              cat ../../evidence/manifest-build.log >&2
              echo "Manifest build failed for an unrecognized reason" >&2
              exit "$manifest_status"
            fi

            echo fallback-after-known-dts-crash > ../../evidence/build-mode.txt

            # Restore the immutable paid-head tracked outputs/config after the
            # failed manifest build, then run tsup directly WITHOUT the package
            # script's hard-coded --dts flag. The temporary config disables DTS
            # only for this runtime-bundle recovery.
            git restore -- tsup.config.ts dist/index.js dist/index.mjs dist/index.d.ts dist/index.d.mts
            python - <<'PY'
          from pathlib import Path
          p = Path('tsup.config.ts')
          s = p.read_text()
          old = '  dts: true,'
          if s.count(old) != 1:
              raise SystemExit(f'expected one dts:true setting, found {s.count(old)}')
          p.write_text(s.replace(old, '  dts: false,'))
          PY
            ./node_modules/.bin/tsup src/index.ts --format cjs,esm --clean > ../../evidence/fallback-runtime-build.log 2>&1
            git restore -- tsup.config.ts

            # The runtime-only build cleans dist, so restore the old declarations
            # and apply exactly the source-level UploadOptions.filename addition.
            git restore -- dist/index.d.ts dist/index.d.mts
            python - <<'PY'
          from pathlib import Path
          old = "    /** Tags for the video. */\n    tags?: string[];\n}"
          new = "    /** Tags for the video. */\n    tags?: string[];\n    /** Multipart filename override, including the video extension. Useful for untyped Blobs. */\n    filename?: string;\n}"
          for name in ('dist/index.d.ts', 'dist/index.d.mts'):
              p = Path(name)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{name}: expected one UploadOptions tail, found {s.count(old)}')
              p.write_text(s.replace(old, new))
          PY
          fi

          rm -f package-lock.json

      - name: Record generated bytes and exact diff
        shell: bash
        run: |
          set -euo pipefail
          cd bottube
          git diff --check
          git diff --name-only > ../evidence/git-diff-name-only.txt
          git status --short --untracked-files=all > ../evidence/git-status-short.txt
          git diff -- js-sdk/dist/index.js js-sdk/dist/index.mjs js-sdk/dist/index.d.ts js-sdk/dist/index.d.mts > ../evidence/dist.patch

          expected="$(printf '%s\n' \
            js-sdk/dist/index.d.mts \
            js-sdk/dist/index.d.ts \
            js-sdk/dist/index.js \
            js-sdk/dist/index.mjs | sort)"
          actual="$(sort ../evidence/git-diff-name-only.txt)"
          if [ "$actual" != "$expected" ]; then
            echo "Tracked diff escaped the four requested dist paths" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

          unexpected_status="$(git status --porcelain | awk '{print $2}' | grep -Ev '^js-sdk/dist/(index\.js|index\.mjs|index\.d\.ts|index\.d\.mts)$' || true)"
          if [ -n "$unexpected_status" ]; then
            echo "Worktree output escaped the four requested dist paths" >&2
            printf '%s\n' "$unexpected_status" >&2
            exit 1
          fi

          for needle in \
            "Blob uploads need a supported video MIME type or an explicit filename option." \
            "video/mp4" \
            "video/webm" \
            "video/quicktime" \
            "video/x-matroska" \
            "video/x-msvideo"; do
            grep -Fq "$needle" js-sdk/dist/index.js
            grep -Fq "$needle" js-sdk/dist/index.mjs
          done
          grep -Fq "filename?: string;" js-sdk/dist/index.d.ts
          grep -Fq "filename?: string;" js-sdk/dist/index.d.mts

          : > ../evidence/dist-sha256.txt
          : > ../evidence/dist-git-blobs.txt
          for file in \
            js-sdk/dist/index.js \
            js-sdk/dist/index.mjs \
            js-sdk/dist/index.d.ts \
            js-sdk/dist/index.d.mts; do
            test -f "$file"
            sha256sum "$file" >> ../evidence/dist-sha256.txt
            printf '%s  %s\n' "$(git hash-object "$file")" "$file" >> ../evidence/dist-git-blobs.txt
            cp "$file" "../evidence/$file"
          done

      - name: Upload exact generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottube-2215-js-sdk-dist-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
