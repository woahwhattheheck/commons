name: titan-v31-b7-currentroot-gate

on:
  pull_request:
    branches: ['astra/v31-a612-restore-5f6-canonical-archive-20260911']
    paths:
      - '.github/workflows/titan-v31-b7-currentroot-gate.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v31-b7-currentroot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-currentroot-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROOT: revenue/kaggriculture/cloud-execution-lab/candidates/v3
      LIVE_BRANCH: titan/v3.1-20260911
      ROOT_SHA: 8e3d92a286806f9f9525973ee7d359b629a11487
      PARENT_SHA: 6e5e3c7cc5302d6db4b702cc4fd7c8ca721d7b8a
      R04_BLOB: 7edacbfb4916b8f241b689ded6643240ca02a9ec
      APPLY_BLOB: a43d6c470ab05d87803fb016966d1cc54fab9d17
      R01_TAPES_BLOB: a43289b9cc5e34a2481fddf652762a7d92f427ef
      KILL_WATER_BLOB: 9600f5a8543af257b23c9a380342d4654ac20f43
      STRAWBERRY_ENDGAME_BLOB: 9974ae6d276bc4ecea6cccf183a98e10a5a8d279
      L3_HELPER_BLOB: fb26e2ca9985cc65b1127f4eec654fb5cb2a3df0
      H4_HELPER_BLOB: d6e3ffb76856ff171dab2a45b4d3c1788f2b2cb8
      B5_HELPER_BLOB: 2a9d606835b0d04d832a4737dcb381ad3fbef1ae
      JIT_HELPER_BLOB: 6ef7ddcd9590e3cb3f55ceb708b8026235d59410
      B7_DONOR_BLOB: a27da659884c0f9a9594cbd9332b5edb4d7f3307
      PACKAGE_SHA256: 4d920b2d8948488dc4f491a3a2b3d038c830d723baaaaba1e4470799b66f7d13

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact stack, donor, scope, and live gameplay bytes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          SOURCE="$ROOT/experiments/b7_shed_room_guard.py"
          R04="$ROOT/overlay/r04_full_router.py"
          APPLY="$ROOT/apply_v3.py"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$B7_DONOR_BLOB"
          test "$(git rev-parse "HEAD:$R04")" = "$R04_BLOB"
          test "$(git rev-parse "HEAD:$APPLY")" = "$APPLY_BLOB"
          git diff --name-only "$PARENT_SHA" HEAD > /tmp/b7-paths
          python - <<'PY'
          from pathlib import Path
          actual=set(Path('/tmp/b7-paths').read_text().splitlines())
          expected={
            '.github/workflows/titan-v31-b7-currentroot-gate.yml',
            'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard.py',
            'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard/baseline.py',
            'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard/candidate.py',
            'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard/run_gate.py',
          }
          if actual != expected:
              raise SystemExit(f'B7 current-root scope drift: actual={sorted(actual)!r} expected={sorted(expected)!r}')
          print('B7_CURRENTROOT_SCOPE_OK', len(actual))
          PY
          git diff --check "$PARENT_SHA...HEAD"
          git fetch --no-tags origin "+refs/heads/$LIVE_BRANCH:refs/remotes/origin/$LIVE_BRANCH"
          LIVE="$(git rev-parse "refs/remotes/origin/$LIVE_BRANCH")"
          test "$(git merge-base "$ROOT_SHA" "$LIVE")" = "$ROOT_SHA"
          test "$(git rev-parse "$LIVE:$R04")" = "$R04_BLOB"
          test "$(git rev-parse "$LIVE:$APPLY")" = "$APPLY_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r01_tapes.py")" = "$R01_TAPES_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r04_kill_late_water.py")" = "$KILL_WATER_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r04_strawberry_endgame.py")" = "$STRAWBERRY_ENDGAME_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r04_no_late_sale_advance.py")" = "$L3_HELPER_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r04_h4_strawberry.py")" = "$H4_HELPER_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/b5_fertilize.py")" = "$B5_HELPER_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/jit_pass_fertilize.py")" = "$JIT_HELPER_BLOB"
          echo "B7_CURRENTROOT_LIVE_OK $LIVE"

      - name: Prove immutable-base rebuild and compile carrier
        shell: bash
        run: |
          set -euo pipefail
          (cd "$ROOT" && python -B build_v3.py --check) |& tee "$RUNNER_TEMP/b7-build.log"
          grep -F "V3 CHECK OK $PACKAGE_SHA256 139 files" "$RUNNER_TEMP/b7-build.log"
          python -B - <<'PY'
          from pathlib import Path
          root=Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments')
          for rel in ('b7_shed_room_guard.py','b7_shed_room_guard/baseline.py','b7_shed_room_guard/candidate.py','b7_shed_room_guard/run_gate.py'):
              path=root/rel
              compile(path.read_text(), str(path), 'exec')
              print('B7_COMPILE_OK', rel)
          PY
          test -z "$(git status --porcelain)"

      - name: Prove strict receipt normalizer rejects type and digest poison under optimization
        shell: bash
        run: |
          set -euo pipefail
          python -O -B - <<'PY'
          import copy
          import importlib.util
          from pathlib import Path

          path = Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b7_shed_room_guard/run_gate.py')
          spec = importlib.util.spec_from_file_location('b7_gate', path)
          gate = importlib.util.module_from_spec(spec)
          if spec.loader is None:
              raise SystemExit('B7 gate loader missing')
          spec.loader.exec_module(gate)
          label = 'poison'
          valid = [
              {
                  'opponent': label,
                  'seed': seed,
                  'candidate_seat': seat,
                  'status': 'complete',
                  'failure': None,
                  'scores': [1, 1],
                  'trace_sha256': '0' * 64,
              }
              for seed in gate.SEEDS for seat in (0, 1)
          ]
          if len(gate.exact_cells({'games': copy.deepcopy(valid)}, label)) != 16:
              raise SystemExit('B7 valid predecessor did not normalize to 16 exact cells')

          def rejected(name, mutate):
              games = copy.deepcopy(valid)
              mutate(games)
              try:
                  gate.exact_cells({'games': games}, label)
              except AssertionError:
                  print('B7_POISON_REJECTED', name)
                  return
              raise SystemExit(f'normalizer accepted poison: {name}')

          rejected('bool-seat', lambda g: g[0].__setitem__('candidate_seat', False))
          rejected('float-seat', lambda g: g[0].__setitem__('candidate_seat', 0.0))
          rejected('bool-seed', lambda g: g[0].__setitem__('seed', True))
          rejected('float-seed', lambda g: g[0].__setitem__('seed', float(g[0]['seed'])))
          rejected('bool-score', lambda g: g[0].__setitem__('scores', [True, 1]))
          rejected('nan-score', lambda g: g[0].__setitem__('scores', [float('nan'), 1]))
          rejected('posinf-score', lambda g: g[0].__setitem__('scores', [float('inf'), 1]))
          rejected('neginf-score', lambda g: g[0].__setitem__('scores', [float('-inf'), 1]))
          rejected('nonhex-trace', lambda g: g[0].__setitem__('trace_sha256', 'g' * 64))
          rejected('duplicate-cell', lambda g: g.append(copy.deepcopy(g[0])))
          rejected('missing-cell', lambda g: g.pop())
          PY

      - name: Run official-interpreter paired screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/b7-currentroot"
          python -B "$ROOT/experiments/b7_shed_room_guard/run_gate.py" --repo-root "$GITHUB_WORKSPACE" --output-dir "$OUT" |& tee "$RUNNER_TEMP/b7.log"
          grep -F 'B7_CURRENTROOT_RESULT ' "$RUNNER_TEMP/b7.log"
          OUT="$OUT" python -O -B - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['OUT'])/'b7-currentroot-receipt.json').read_text())
          s=r.get('summary')
          d=r.get('disposition')
          if r.get('schema') != 'titan-v31-b7-currentroot-gate/v2':
              raise SystemExit(f'B7 receipt schema drift: {r.get("schema")!r}')
          if not isinstance(s, dict):
              raise SystemExit('B7 receipt summary missing')
          if s.get('scheduled') != 16 or s.get('wins', 0)+s.get('ties', 0)+s.get('losses', 0) != 16:
              raise SystemExit(f'B7 receipt cardinality drift: {s!r}')
          if s.get('trace_changed_cells') == 0:
              expected='KILL_INACTIVE'
          elif s.get('losses', 0) > 0:
              expected='HOLD_NEGATIVE_CELL'
          elif s.get('mean_delta_margin', 0) > 0:
              expected='PASS_WIDEN_ONLY'
          else:
              expected='HOLD_NO_POSITIVE_MARGIN'
          if d != expected:
              raise SystemExit(f'B7 disposition mismatch: got={d!r} expected={expected!r} summary={s!r}')
          print('B7_CURRENTROOT_RECEIPT_OK', d, s)
          PY

      - name: Recheck live gameplay freshness after spend
        shell: bash
        run: |
          set -euo pipefail
          R04="$ROOT/overlay/r04_full_router.py"; APPLY="$ROOT/apply_v3.py"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin "+refs/heads/$LIVE_BRANCH:refs/remotes/origin/$LIVE_BRANCH"
          LIVE="$(git rev-parse "refs/remotes/origin/$LIVE_BRANCH")"
          test "$(git merge-base "$ROOT_SHA" "$LIVE")" = "$ROOT_SHA"
          test "$(git rev-parse "$LIVE:$R04")" = "$R04_BLOB"
          test "$(git rev-parse "$LIVE:$APPLY")" = "$APPLY_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r01_tapes.py")" = "$R01_TAPES_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r04_kill_late_water.py")" = "$KILL_WATER_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r04_strawberry_endgame.py")" = "$STRAWBERRY_ENDGAME_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r04_no_late_sale_advance.py")" = "$L3_HELPER_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/r04_h4_strawberry.py")" = "$H4_HELPER_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/b5_fertilize.py")" = "$B5_HELPER_BLOB"
          test "$(git rev-parse "$LIVE:$ROOT/overlay/jit_pass_fertilize.py")" = "$JIT_HELPER_BLOB"
          echo "B7_CURRENTROOT_POSTSPEND_FRESH $LIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: titan-v31-b7-currentroot-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/b7-currentroot/
            ${{ runner.temp }}/b7.log
            ${{ runner.temp }}/b7-build.log
          if-no-files-found: error
