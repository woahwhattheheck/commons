name: Reply-to-revenue event identity

on:
  pull_request:
    paths:
      - "host/reply_to_revenue.py"
      - "host/reply_to_revenue_core.py"
      - "test_reply_to_revenue.py"
      - "test_reply_to_revenue_event_identity.py"
      - ".github/workflows/reply-to-revenue-event-identity.yml"
  push:
    branches: [main]
    paths:
      - "host/reply_to_revenue.py"
      - "host/reply_to_revenue_core.py"
      - "test_reply_to_revenue.py"
      - "test_reply_to_revenue_event_identity.py"
      - ".github/workflows/reply-to-revenue-event-identity.yml"

permissions:
  contents: read

jobs:
  event-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact surface
        run: >-
          python -m py_compile
          host/reply_to_revenue.py
          host/reply_to_revenue_core.py
          test_reply_to_revenue.py
          test_reply_to_revenue_event_identity.py
      - name: Run reply-to-revenue regressions
        run: >-
          python -m unittest -v
          test_reply_to_revenue
          test_reply_to_revenue_event_identity
      - name: Run optimized regressions
        run: >-
          python -O -m unittest -v
          test_reply_to_revenue
          test_reply_to_revenue_event_identity
