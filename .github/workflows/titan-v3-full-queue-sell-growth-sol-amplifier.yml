name: titan-v3-full-queue-sell-growth-owner-recovery

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-full-queue-sell-growth-sol-amplifier.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3-full-queue-sell-growth-sol-amplifier/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts-and-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s\n' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/head.sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Isolate inherited non-executable package drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          lab = Path("revenue/kaggriculture/cloud-execution-lab").resolve()
          manifest_path = lab / "runtime/integrated-selected/CURRENT-SOURCE.json"
          archive_path = lab / "exports/titan-current.tar.gz"
          admitted = {
              "TITAN-RELEASE.md": "TITAN-RELEASE.md",
              "reference/decision/README.md": "reference/decision/README.md",
          }

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes)
          runtime = manifest.get("runtime")
          if not isinstance(runtime, dict) or not runtime:
              raise SystemExit("CURRENT-SOURCE runtime map missing")

          def scan() -> dict[str, dict[str, object]]:
              drift: dict[str, dict[str, object]] = {}
              for member, record in runtime.items():
                  if not isinstance(member, str) or not isinstance(record, dict):
                      raise SystemExit(f"malformed runtime record: {member!r}")
                  source_path = record.get("source_path")
                  if not isinstance(source_path, str):
                      raise SystemExit(f"missing source_path for {member}")
                  source = (lab / source_path).resolve()
                  if not source.is_file() or source.is_symlink():
                      raise SystemExit(f"runtime source missing or linked: {member} -> {source}")
                  data = source.read_bytes()
                  expected_sha = record.get("sha256")
                  expected_bytes = record.get("bytes")
                  actual_sha = sha256(data)
                  actual_bytes = len(data)
                  if actual_sha != expected_sha or actual_bytes != expected_bytes:
                      drift[member] = {
                          "source_path": source_path,
                          "manifest_sha256": expected_sha,
                          "manifest_bytes": expected_bytes,
                          "head_sha256": actual_sha,
                          "head_bytes": actual_bytes,
                      }
              return drift

          before = scan()
          if set(before) != set(admitted):
              raise SystemExit(
                  "unexpected canonical source drift; expected only "
                  + repr(sorted(admitted))
                  + ", got "
                  + repr(sorted(before))
              )

          restored: dict[str, dict[str, object]] = {}
          with tarfile.open(archive_path, mode="r:gz") as archive:
              for member, source_path in admitted.items():
                  if Path(member).suffix != ".md":
                      raise SystemExit(f"admitted drift is executable: {member}")
                  record = runtime[member]
                  if record.get("source_path") != source_path:
                      raise SystemExit(f"source-path mismatch for {member}")
                  target = (lab / source_path).resolve()
                  if target != (lab / source_path).absolute():
                      raise SystemExit(f"unexpected documentation path traversal: {member}")
                  info = archive.getmember(member)
                  if not info.isfile():
                      raise SystemExit(f"archive member is not a file: {member}")
                  stream = archive.extractfile(info)
                  if stream is None:
                      raise SystemExit(f"archive member unreadable: {member}")
                  data = stream.read()
                  if len(data) != record.get("bytes") or sha256(data) != record.get("sha256"):
                      raise SystemExit(f"archive/manifest identity mismatch for {member}")
                  target.write_bytes(data)
                  restored[member] = {
                      "source_path": source_path,
                      "archive_sha256": sha256(data),
                      "archive_bytes": len(data),
                  }

          after = scan()
          if after:
              raise SystemExit("documentation overlay did not close source drift: " + repr(after))

          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          receipt = {
              "schema_version": 1,
              "status": "isolated-non-executable-overlay",
              "git_head": head,
              "manifest_path": manifest_path.relative_to(Path.cwd()).as_posix(),
              "manifest_sha256": sha256(manifest_bytes),
              "archive_path": archive_path.relative_to(Path.cwd()).as_posix(),
              "archive_sha256": sha256(archive_path.read_bytes()),
              "admitted_members": sorted(admitted),
              "head_drift": before,
              "restored_from_canonical_archive": restored,
              "executable_drift_members": [],
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "DOC-DRIFT-OVERLAY.json"
          output.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Prove source seam, isolation, and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3-full-queue-sell-growth-sol-amplifier
          python "$ROOT/audit_change.py" --json "$RUNNER_TEMP/SOURCE-SEAM.json"
          cd "$ROOT"
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 python run_contracts.py \
            test_full_queue_sell_growth.py test_action_bound_panel.py
          python -m py_compile candidate.py growth_patch.py audit_change.py run_panel.py \
            run_contracts.py test_full_queue_sell_growth.py test_action_bound_panel.py

      - name: Verify overlaid canonical release and path confinement
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          (
            cd "$LAB"
            python build_integrated.py --check
          ) | tee "$RUNNER_TEMP/CANONICAL-CHECK.log"
          git diff --name-only -- . | LC_ALL=C sort > "$RUNNER_TEMP/overlay-paths.actual"
          printf '%s\n' \
            "$LAB/TITAN-RELEASE.md" \
            "$LAB/reference/decision/README.md" \
            | LC_ALL=C sort > "$RUNNER_TEMP/overlay-paths.expected"
          diff -u "$RUNNER_TEMP/overlay-paths.expected" "$RUNNER_TEMP/overlay-paths.actual"

      - name: Build pinned Apex opponent once
        shell: bash
        run: |
          set -euo pipefail
          APEX=revenue/kaggriculture/cloud-policy-portfolio/vendor/apex
          g++ -O3 -std=c++17 -shared -fPIC -I"$APEX/source/include" -o "$APEX/agent.so" \
            "$APEX/source/policy.cpp" "$APEX/submission_bridge.cpp"
          sha256sum "$APEX/agent.so" | tee "$RUNNER_TEMP/apex-agent.sha256"

      - name: Run 32-cell action-bound official-engine screen
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3-full-queue-sell-growth-sol-amplifier
          mkdir -p "$RUNNER_TEMP/full-queue-growth"
          set +e
          python "$ROOT/run_panel.py" \
            --head "$(git rev-parse HEAD)" \
            --seeds '2611092201,2611092203,2611092205,2611092207' \
            --opponents 'arlene,apex,public_bt12,v1' \
            --workers 4 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$RUNNER_TEMP/full-queue-growth/PANEL.json" \
            --markdown "$RUNNER_TEMP/full-queue-growth/PANEL.md"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "panel failed structurally with exit $rc" >&2
            exit "$rc"
          fi

      - name: Publish screen summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/full-queue-growth/PANEL.md" ]]; then
            cat "$RUNNER_TEMP/full-queue-growth/PANEL.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Saturated-queue SELL screen produced no verdict' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore exact PR-head documentation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          git checkout -- \
            "$LAB/TITAN-RELEASE.md" \
            "$LAB/reference/decision/README.md"
          git diff --exit-code -- .
          git status --porcelain --untracked-files=no | tee "$RUNNER_TEMP/CLEAN-TREE.txt"
          test ! -s "$RUNNER_TEMP/CLEAN-TREE.txt"

      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-full-queue-sell-growth-owner-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/head.sha
            ${{ runner.temp }}/DOC-DRIFT-OVERLAY.json
            ${{ runner.temp }}/SOURCE-SEAM.json
            ${{ runner.temp }}/CANONICAL-CHECK.log
            ${{ runner.temp }}/overlay-paths.actual
            ${{ runner.temp }}/overlay-paths.expected
            ${{ runner.temp }}/CLEAN-TREE.txt
            ${{ runner.temp }}/apex-agent.sha256
            ${{ runner.temp }}/full-queue-growth/
          if-no-files-found: error
          retention-days: 30
