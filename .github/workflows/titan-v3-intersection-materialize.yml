name: TITAN V3 intersection evidence gate materializer

on:
  push:
    branches:
      - sol-prism/titan-v3-paired-game-intersection-closure-20260910-01

permissions:
  contents: write

concurrency:
  group: titan-v3-intersection-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, verify, test, and publish source
        shell: bash
        run: |
          set -euo pipefail
          delivery='.titan-delivery/titan-v3-intersection-closure'
          target='revenue/kaggriculture/cloud-execution-lab/titan-v3-intersection-gate'
          patch_xz="$RUNNER_TEMP/titan-v3-intersection-closure.patch.xz"
          patch="$RUNNER_TEMP/titan-v3-intersection-closure.patch"

          test "$(find "$delivery" -maxdepth 1 -type f -name 'part-*.hex' | wc -l)" -eq 8
          cat "$delivery"/part-*.hex | tr -d '\n\r\t ' | xxd -r -p > "$patch_xz"
          echo '28dadad1b340c654c436f73f4cea7eac2f1d2dda285e2a802decb251a5cbd7f1  '"$patch_xz" | sha256sum -c -
          xz -dc "$patch_xz" > "$patch"
          echo '81cbfccf13bd944517c56271c4d0b2ab2a6e4d6dada83e80f59fc15c26dbadee  '"$patch" | sha256sum -c -

          git apply --check "$patch"
          git apply "$patch"

          cd "$target"
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python3 -m unittest -v test_intersection_gate.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            intersection_gate.py test_intersection_gate.py
          cd "$GITHUB_WORKSPACE"

          find "$target" -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .titan-delivery
          rm -f .github/workflows/titan-v3-intersection-materialize.yml

          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -f "$target/intersection_gate.py"
          test -f "$target/test_intersection_gate.py"
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'titan-v3: materialize paired intersection evidence gate'
          git push origin HEAD:${GITHUB_REF_NAME}
