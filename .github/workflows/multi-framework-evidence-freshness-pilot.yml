name: multi-framework evidence freshness pilot

on:
  pull_request:
    paths:
      - "revenue/multi_framework_evidence_freshness_pilot/**"
      - "revenue/multi_framework_evidence_freshness/**"
      - "tests/test_multi_framework_evidence_freshness_pilot.py"
      - ".github/workflows/multi-framework-evidence-freshness-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          revenue/multi_framework_evidence_freshness_pilot/pilot.py
          revenue/multi_framework_evidence_freshness_pilot/cli.py
          tests/test_multi_framework_evidence_freshness_pilot.py
      - name: Focused tests
        run: python -m unittest -v tests.test_multi_framework_evidence_freshness_pilot
      - name: Focused tests optimized
        run: python -O -m unittest -v tests.test_multi_framework_evidence_freshness_pilot
