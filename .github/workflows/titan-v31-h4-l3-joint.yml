name: titan-v31-h4-l3-joint

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_l3_joint/**'
      - '.github/workflows/titan-v31-h4-l3-joint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --name-only dc1779ed79cd7fdd091187df1e8f0c4e5f185555..HEAD | tee /tmp/joint-paths.txt
          python - <<'PY'
          from pathlib import Path
          paths = [line.strip() for line in Path('/tmp/joint-paths.txt').read_text().splitlines() if line.strip()]
          allowed = 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_l3_joint/'
          workflow = '.github/workflows/titan-v31-h4-l3-joint.yml'
          assert paths, 'empty joint diff'
          assert all(path == workflow or path.startswith(allowed) for path in paths), paths
          print('JOINT_SCOPE_PATHS', len(paths))
          PY

      - name: Run Riot V3.1 lane suite
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -v -s overlay/checks -p 'test_v3*.py' |& tee /tmp/joint-riot.log
          grep -F 'Ran 161 tests' /tmp/joint-riot.log
          grep -F 'OK' /tmp/joint-riot.log

      - name: Run H4 composition contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -v -s experiments/h4_l3_joint -p 'test_v31_h4_strawberry.py' |& tee /tmp/joint-h4.log
          grep -F 'Ran 13 tests' /tmp/joint-h4.log
          grep -F 'OK' /tmp/joint-h4.log

      - name: Prove exact H4 structural receipt
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B experiments/h4_l3_joint/h4_tape_screen.py > /tmp/joint-screen.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/joint-screen.json', encoding='utf-8'))
          assert data['tapes'] == 13
          assert data['opportunity_steps'] == 372
          assert data['opportunity_steps_pre_h3_cutoff'] == 292
          assert data['opportunity_steps_at_or_after_h3_cutoff'] == 80
          print('H4_STRUCTURAL_RECEIPT', 372, 292, 80)
          PY

      - name: Smoke exact V3.1 + H4 + L3 practice entrypoint
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('experiments/h4_l3_joint/joint_arm.py').resolve()
          spec = importlib.util.spec_from_file_location('h4_l3_joint_exact', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          if not callable(module.agent):
              raise SystemExit('joint agent is not callable')
          if module.verify_joint_state() is not True:
              raise SystemExit('joint baseline verifier did not return True')

          expected = {
              'SALE_HORIZON': 8,
              'OPEN_ROUNDTRIP': 0,
              'ROW_ORDER': True,
              'EVENING_FLUSH': True,
              'SALE_EXCLUDED': ('WHEAT',),
              '_V231_EARLY': True,
              'NO_LATE_SALE_ADVANCE': True,
              'NO_LATE_SALE_ADVANCE_STEP': 648,
          }
          for name, wanted in expected.items():
              actual = getattr(module.base, name)
              if type(actual) is not type(wanted) or actual != wanted:
                  raise SystemExit(f'{name} drifted: {actual!r} != {wanted!r}')
          if module.h4.STRAWBERRY_TOPUP is not True:
              raise SystemExit('H4 strawberry top-up is not enabled')

          # The practice arm is a fixed comparison target, not a knob playground.
          for kwargs in (
              {'row_order': False},
              {'evening_flush': False},
              {'sale_fertilizer': False},
              {'cattle_early': False},
              {'horizon': 7},
              {'opening': 1},
              {'no_late_sale_advance_step': 647},
          ):
              try:
                  module.install_joint(**kwargs)
              except ValueError:
                  pass
              else:
                  raise SystemExit(f'non-baseline override was accepted: {kwargs!r}')
          if module.verify_joint_state() is not True:
              raise SystemExit('negative override probes mutated the joint baseline')
          print('JOINT_ENTRYPOINT_OK V31_BASELINE_PLUS_H4_L3')
          PY

      - name: Prove optimized import keeps explicit baseline guard
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        env:
          PYTHONOPTIMIZE: '1'
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('experiments/h4_l3_joint/joint_arm.py').resolve()
          spec = importlib.util.spec_from_file_location('h4_l3_joint_optimized', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          if module.verify_joint_state() is not True:
              raise SystemExit('optimized joint baseline verification failed')
          print('JOINT_OPTIMIZED_BASELINE_OK')
          PY

      - name: Prove checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
