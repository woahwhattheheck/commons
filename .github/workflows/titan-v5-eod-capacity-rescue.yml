name: TITAN V5 EOD capacity rescue

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/eod-capacity-rescue/**"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/joint-liquidity-bench/paired.py"
      - "revenue/kaggriculture/cloud-execution-lab/eod_capacity_rescue.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_eod_capacity_rescue.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_eod_capacity_rescue_runtime.py"
      - "revenue/kaggriculture/cloud-execution-lab/main.py"
      - "revenue/kaggriculture/cloud-execution-lab/titan_runtime.py"
      - "revenue/kaggriculture/cloud-execution-lab/TITAN-CONFIG.json"
      - "revenue/kaggriculture/cloud-execution-lab/build_integrated.py"
      - ".github/workflows/titan-v5-eod-capacity-rescue.yml"
  push:
    branches:
      - "astra/titan-v5-eod-capacity-rescue-20260912"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-evidence-contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Source, composer and evidence contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile \
            eod_capacity_rescue.py test_eod_capacity_rescue.py test_eod_capacity_rescue_runtime.py \
            candidates/v5/eod-capacity-rescue/compose_current_runtime.py \
            candidates/v5/eod-capacity-rescue/paired_current.py \
            candidates/v5/eod-capacity-rescue/test_compose_current_runtime.py \
            candidates/v5/eod-capacity-rescue/test_paired_current.py \
            candidates/v5/eod-capacity-rescue/test_paired_current_custody.py
          python -B -m unittest -v test_eod_capacity_rescue.py
          python -O -B -m unittest -v test_eod_capacity_rescue.py
          cd candidates/v5/eod-capacity-rescue
          python -B -m unittest -v test_compose_current_runtime.py test_paired_current.py test_paired_current_custody.py
          python -O -B -m unittest -v test_compose_current_runtime.py test_paired_current.py test_paired_current_custody.py
          cd ../../..
          if grep -q 'eod_capacity_rescue: bool = False' titan_runtime.py; then
            python -B -m unittest -v test_eod_capacity_rescue_runtime.py test_overflow_safe_drop_runtime.py
            python -O -B -m unittest -v test_eod_capacity_rescue_runtime.py test_overflow_safe_drop_runtime.py
          else
            OUT="$RUNNER_TEMP/eod-dry-render"
            python -B candidates/v5/eod-capacity-rescue/compose_current_runtime.py --root . --out "$OUT"
            python -B -m py_compile "$OUT/main.py" "$OUT/titan_runtime.py" "$OUT/build_integrated.py"
            OUT="$OUT" python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          cfg = json.loads((out / 'TITAN-CONFIG.json').read_text())
          assert cfg['eod_capacity_rescue'] is False
          main = (out / 'main.py').read_text()
          assert main.index("self.diagnostics['overflow_safe_drop']") < main.index("self.diagnostics['eod_capacity_rescue']")
          PY
          fi
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          test -z "$(git status --porcelain)"

  integrate-and-publish-current:
    if: github.event_name == 'push' && github.ref_name == 'astra/titan-v5-eod-capacity-rescue-20260912'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify branch and live-main custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          branch_remote="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          main_remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$branch_remote" = "$GITHUB_SHA"
          git fetch --no-tags origin "$main_remote"
          git merge-base --is-ancestor "$main_remote" HEAD
      - name: Detect already-integrated successor
        id: integrated
        shell: bash
        run: |
          if grep -q 'eod_capacity_rescue: bool = False' revenue/kaggriculture/cloud-execution-lab/titan_runtime.py; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize, verify and build canonical package
        if: steps.integrated.outputs.skip != 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          OUT="$RUNNER_TEMP/eod-current-postimage"
          python -B "$LAB/candidates/v5/eod-capacity-rescue/compose_current_runtime.py" --root "$LAB" --out "$OUT"
          cp "$OUT/main.py" "$LAB/main.py"
          cp "$OUT/titan_runtime.py" "$LAB/titan_runtime.py"
          cp "$OUT/TITAN-CONFIG.json" "$LAB/TITAN-CONFIG.json"
          cp "$OUT/build_integrated.py" "$LAB/build_integrated.py"
          cd "$LAB"
          python -B -m py_compile \
            main.py titan_runtime.py build_integrated.py eod_capacity_rescue.py \
            test_eod_capacity_rescue.py test_eod_capacity_rescue_runtime.py \
            test_overflow_safe_drop_runtime.py test_entrypoint_deadline.py \
            test_final_market_pressure_entrypoint.py test_entrypoint_route_capsule.py \
            test_entrypoint_route_capsule_continuity.py test_entrypoint_route_capsule_inner_deadline.py
          python -B -m unittest -v \
            test_eod_capacity_rescue.py test_eod_capacity_rescue_runtime.py \
            test_overflow_safe_drop_runtime.py test_entrypoint_deadline.py \
            test_final_market_pressure_entrypoint.py test_entrypoint_route_capsule.py \
            test_entrypoint_route_capsule_continuity.py test_entrypoint_route_capsule_inner_deadline.py
          python -O -B -m unittest -v \
            test_eod_capacity_rescue.py test_eod_capacity_rescue_runtime.py \
            test_overflow_safe_drop_runtime.py test_entrypoint_deadline.py \
            test_final_market_pressure_entrypoint.py test_entrypoint_route_capsule.py \
            test_entrypoint_route_capsule_continuity.py test_entrypoint_route_capsule_inner_deadline.py
          python -B build_integrated.py
          python -B build_integrated.py --check
          python - <<'PY'
          import json, tarfile
          from pathlib import Path
          archive = Path('exports/titan-current.tar.gz')
          with tarfile.open(archive, 'r:gz') as tf:
              names = set(tf.getnames())
              assert 'eod_capacity_rescue.py' in names
              assert 'checks/test_eod_capacity_rescue.py' in names
              assert 'checks/test_eod_capacity_rescue_runtime.py' in names
              cfg = json.loads(tf.extractfile('TITAN-CONFIG.json').read())
              assert cfg['eod_capacity_rescue'] is False
              source = json.loads(tf.extractfile('SOURCE.json').read())
              assert source['runtime']['eod_capacity_rescue.py']['source_path'] == 'eod_capacity_rescue.py'
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Publish one same-carrier successor
        if: steps.integrated.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          branch_remote="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          main_remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$branch_remote" = "$GITHUB_SHA"
          git fetch --no-tags origin "$main_remote"
          git merge-base --is-ancestor "$main_remote" HEAD
          git add -A -- \
            "$LAB/main.py" "$LAB/titan_runtime.py" "$LAB/TITAN-CONFIG.json" "$LAB/build_integrated.py" \
            "$LAB/exports" \
            "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" \
            "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json"
          unexpected="$(git diff --cached --name-only | grep -Ev '^revenue/kaggriculture/cloud-execution-lab/(main.py|titan_runtime.py|TITAN-CONFIG.json|build_integrated.py|exports/|runtime/integrated-selected/CURRENT-(SOURCE|ARCHIVE)\.json)$' || true)"
          test -z "$unexpected"
          git diff --cached --check
          ! git diff --cached --quiet
          git config user.name 'titan-v5-eod-bot'
          git config user.email 'titan-v5-eod-bot@users.noreply.github.com'
          git commit -m 'TITAN V5 EOD: integrate after overflow and refresh package'
          branch_remote="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          main_remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$branch_remote" = "$GITHUB_SHA"
          git fetch --no-tags origin "$main_remote"
          git merge-base --is-ancestor "$main_remote" HEAD^
          git push origin "HEAD:${GITHUB_REF_NAME}"
