name: titan-v3-l01-focused-proof

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-l01-focused-proof.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/**'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'

permissions:
  contents: read

jobs:
  exact-head-l01-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PROOF_PARENT: '6ccb51e5fd6ac0e98cdab6e61b1164a5074fed55'
      SOURCE_PARENT: '35c036dd33545a98237c3e56a9f8744a20660e5f'
      V3_DIR: 'revenue/kaggriculture/cloud-execution-lab/candidates/v3'
      SOURCE: 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/l01_mechanics.py'
      SUITE: 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_l01.py'
      ZERO_SLICE: 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_l01_leanplant_zero_slice.py'
      APPLY: 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py'
      CANONICAL: 'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'
      SOURCE_BLOB: '26be9af162618d07dfa588f8565e8606ecc46843'
      SUITE_BLOB: '8c4a2955b39cb854822ab1f7e73f8e055bf4a274'
      ZERO_SLICE_BLOB: '316e5aa9a36e304f1ac76438783b4f0c6d623798'
      APPLY_BLOB: 'a7f716d742bd9ea45f2e370b2f151f5ee15ba042'
      CANONICAL_BLOB: 'f23e7bbf925b71bf2e45db3752cf8430e3a56e65'
      CANONICAL_SHA256: 'b567942e4fb4e0571ebf9f8eaaf143d4a9156df3289f09a98db37823ef4d68d9'
      CANONICAL_BYTES: '429604'
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Bind exact repair topology and one-path scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          workflow='.github/workflows/titan-v3-l01-focused-proof.yml'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git rev-parse HEAD^)" = "$PROOF_PARENT"
          test "$(git rev-parse HEAD^^)" = "$SOURCE_PARENT"
          test "$(git rev-list --count "$PROOF_PARENT"..HEAD)" = 1
          mapfile -t changed < <(git diff --name-only "$PROOF_PARENT" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$workflow"
          git diff --check "$PROOF_PARENT"..HEAD

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind reviewed L01 inputs and materializer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$SOURCE")" = "$SOURCE_BLOB"
          test "$(git hash-object "$SUITE")" = "$SUITE_BLOB"
          test "$(git hash-object "$ZERO_SLICE")" = "$ZERO_SLICE_BLOB"
          test "$(git hash-object "$APPLY")" = "$APPLY_BLOB"
          test "$(git hash-object "$CANONICAL")" = "$CANONICAL_BLOB"
          test "$(wc -c < "$CANONICAL" | tr -d ' ')" = "$CANONICAL_BYTES"
          printf '%s  %s\n' "$CANONICAL_SHA256" "$CANONICAL" | sha256sum -c -

      - name: Compile reviewed Python inputs without repository bytecode
        shell: python
        run: |
          import os
          from pathlib import Path
          for raw in (os.environ['SOURCE'], os.environ['SUITE'], os.environ['ZERO_SLICE'], os.environ['APPLY']):
              path = Path(raw)
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')

      - name: Materialize exact V3 package in runner temp
        shell: python
        run: |
          import os
          import shutil
          import tarfile
          from pathlib import Path

          canonical = Path(os.environ['CANONICAL'])
          overlay = Path(os.environ['V3_DIR']) / 'overlay'
          tree = Path(os.environ['RUNNER_TEMP']) / 'l01-materialized'
          if tree.exists():
              shutil.rmtree(tree)
          tree.mkdir(parents=True)

          with tarfile.open(canonical, mode='r:gz') as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  name = member.name[2:] if member.name.startswith('./') else member.name
                  rel = Path(name)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise RuntimeError(f'unsafe canonical member: {member.name}')
                  target = tree / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise RuntimeError(f'cannot read canonical member: {member.name}')
                  target.write_bytes(source.read())

          for source in sorted(overlay.rglob('*')):
              if not source.is_file() or '__pycache__' in source.parts or source.suffix == '.pyc':
                  continue
              target = tree / source.relative_to(overlay)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source.read_bytes())

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'L01_TREE={tree}\n')

      - name: Apply exact V3 integration edits to materialized package
        shell: bash
        run: |
          set -euo pipefail
          python -B "$APPLY" "$L01_TREE"
          test -f "$L01_TREE/titan_runtime.py"
          test -f "$L01_TREE/l01_mechanics.py"
          test -f "$L01_TREE/checks/test_v3_l01.py"
          test -f "$L01_TREE/checks/test_v3_l01_leanplant_zero_slice.py"
          test -f "$L01_TREE/TITAN-CONFIG.json"
          test -f "$L01_TREE/NOTICE"
          test -f "$L01_TREE/reference/next-panel/vendor/arlene.py"
          cmp --silent "$SOURCE" "$L01_TREE/l01_mechanics.py"
          cmp --silent "$SUITE" "$L01_TREE/checks/test_v3_l01.py"
          cmp --silent "$ZERO_SLICE" "$L01_TREE/checks/test_v3_l01_leanplant_zero_slice.py"

      - name: Compile materialized runtime and L01 suite
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['L01_TREE'])
          for rel in ('titan_runtime.py', 'l01_mechanics.py', 'checks/test_v3_l01.py', 'checks/test_v3_l01_leanplant_zero_slice.py'):
              path = root / rel
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')

      - name: Run declared L01 suite from materialized package
        shell: bash
        run: |
          set -euo pipefail
          cd "$L01_TREE"
          python -B -m unittest -v checks/test_v3_l01.py \
            2>&1 | tee "$RUNNER_TEMP/l01-focused-tests.log"

      - name: Emit exact-head materialized proof receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          expected_blobs = {
              'SOURCE': os.environ['SOURCE_BLOB'],
              'SUITE': os.environ['SUITE_BLOB'],
              'ZERO_SLICE': os.environ['ZERO_SLICE_BLOB'],
              'APPLY': os.environ['APPLY_BLOB'],
              'CANONICAL': os.environ['CANONICAL_BLOB'],
          }
          inputs = {}
          for key in ('SOURCE', 'SUITE', 'ZERO_SLICE', 'APPLY', 'CANONICAL'):
              path = Path(os.environ[key])
              data = path.read_bytes()
              entry = {
                  'bytes': len(data),
                  'git_blob': git_blob(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
              assert entry['git_blob'] == expected_blobs[key]
              inputs[str(path)] = entry

          tree = Path(os.environ['L01_TREE'])
          materialized = {}
          for rel in ('titan_runtime.py', 'l01_mechanics.py', 'checks/test_v3_l01.py', 'checks/test_v3_l01_leanplant_zero_slice.py', 'TITAN-CONFIG.json', 'NOTICE', 'reference/next-panel/vendor/arlene.py'):
              data = (tree / rel).read_bytes()
              materialized[rel] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          assert (tree / 'l01_mechanics.py').read_bytes() == Path(os.environ['SOURCE']).read_bytes()
          assert (tree / 'checks/test_v3_l01.py').read_bytes() == Path(os.environ['SUITE']).read_bytes()
          assert (tree / 'checks/test_v3_l01_leanplant_zero_slice.py').read_bytes() == Path(os.environ['ZERO_SLICE']).read_bytes()

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          proof_parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          source_parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^^'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD']
          assert proof_parent == os.environ['PROOF_PARENT']
          assert source_parent == os.environ['SOURCE_PARENT']
          log = Path(os.environ['RUNNER_TEMP']) / 'l01-focused-tests.log'
          receipt = {
              'schema': 'titan-v3-l01-focused-materialized-proof-receipt/v2',
              'head': head,
              'proof_parent': proof_parent,
              'source_parent': source_parent,
              'inputs': inputs,
              'materialized': materialized,
              'test_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'scope': 'focused proof only; exact canonical archive + reviewed V3 overlay + exact apply_v3 materialize the unchanged L01 declared suite and zero-slice killers',
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'l01-focused-proof-receipt.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text(), end='')

      - uses: actions/upload-artifact@v4
        with:
          name: titan-v3-l01-focused-materialized-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/l01-focused-tests.log
            ${{ runner.temp }}/l01-focused-proof-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Require clean repository checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
