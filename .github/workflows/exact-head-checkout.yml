name: Exact head checkout

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact 40-hex commit SHA to check out.
        required: true
        type: string
      fetch_depth:
        description: Checkout fetch depth. Keep at 1 unless a caller needs ancestry.
        required: false
        type: number
        default: 1
    outputs:
      checked_sha:
        description: Commit SHA actually checked out after identity verification.
        value: ${{ jobs.checkout.outputs.checked_sha }}

permissions:
  contents: read

jobs:
  checkout:
    name: Checkout and verify exact head
    runs-on: ubuntu-latest
    outputs:
      checked_sha: ${{ steps.verify.outputs.checked_sha }}
    steps:
      - name: Validate expected SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::expected_sha must be exactly 40 hexadecimal characters"
            exit 2
          fi

      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false

      - name: Verify checkout identity
        id: verify
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::checkout identity mismatch: expected $expected, got $actual"
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::tracked checkout is not clean immediately after checkout"
            git status --short
            exit 1
          fi
          echo "checked_sha=$actual" >> "$GITHUB_OUTPUT"
