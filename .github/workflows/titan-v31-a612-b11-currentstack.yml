name: TITAN V3.1 a612 B11 current-stack screen

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v31-a612-b11-currentstack.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b11_a612_currentstack/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind literal head, live canonical and exact source scope
        shell: bash
        run: |
          set -euo pipefail
          EVENT_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"

          CANONICAL=a6120d0ea1bdb75eb0da2239220efce551f624a6
          git fetch --no-tags origin refs/heads/titan/v3.1-20260911
          test "$(git rev-parse FETCH_HEAD)" = "$CANONICAL"
          git merge-base --is-ancestor "$CANONICAL" HEAD

          EXPECTED=$(printf '%s\n' \
            .github/workflows/titan-v31-a612-b11-currentstack.yml \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b11_a612_currentstack/b11_mirror_horizon.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b11_a612_currentstack/candidate.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b11_a612_currentstack/run_current_stack.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b11_a612_currentstack/test_current_stack.py | sort)
          ACTUAL=$(git diff --name-only "$CANONICAL"...HEAD | sort)
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Unexpected a612 evidence scope:" >&2
            printf '%s\n' "$ACTUAL" >&2
            exit 1
          fi

      - name: Pin shipped a612 and exact reviewed B11 donor
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL=a6120d0ea1bdb75eb0da2239220efce551f624a6
          V3=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          EXP=$V3/experiments/b11_a612_currentstack
          test "$(git rev-parse "$CANONICAL:$V3/overlay/r04_full_router.py")" = d797ecd6068dc714d2ba45d44c2d672842116c7b
          test "$(git rev-parse "$CANONICAL:$V3/overlay/r04_h4_strawberry.py")" = d6e3ffb76856ff171dab2a45b4d3c1788f2b2cb8
          test "$(git rev-parse "$CANONICAL:$V3/overlay/r04_no_late_sale_advance.py")" = fb26e2ca9985cc65b1127f4eec654fb5cb2a3df0
          test "$(git rev-parse "$CANONICAL:$V3/apply_v3.py")" = 7a96c0f1d38fff674493e92bc420eb3dfe821f20
          test "$(git rev-parse "$CANONICAL:$V3/build_v3.py")" = ec02a9ba52abc22ff9ec5aac3ea2351d80d1761d
          test "$(git hash-object "$EXP/b11_mirror_horizon.py")" = 94b270f36c4a27b3d958ac3420bbe5764ac327a1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Focused source composition tests
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b11_a612_currentstack
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest -v test_current_stack.py
          python -B - <<'PY'
          from pathlib import Path
          for path in (Path('candidate.py'), Path('b11_mirror_horizon.py'), Path('run_current_stack.py')):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          test -z "$(find . -name '__pycache__' -o -name '*.pyc' -print -quit)"

      - name: Official-interpreter paired current-stack screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/titan-v31-a612-b11-currentstack"
          mkdir -p "$OUT"
          python -B revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b11_a612_currentstack/run_current_stack.py \
            --repo-root "$PWD" \
            --output-dir "$OUT"
          cat "$OUT/receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v31-a612-b11-currentstack-${{ github.run_id }}
          path: ${{ runner.temp }}/titan-v31-a612-b11-currentstack/
          if-no-files-found: error
