name: TITAN V5 PLANTQUORUM current-native census

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/plantquorum-current-native/**"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/unit-phase-chaining/plant_quorum_admission.py"
      - "revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py"
      - ".github/workflows/titan-v5-plantquorum-current-native.yml"
  push:
    branches:
      - "astra/v5-plantquorum-current-native-20260912"
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/plantquorum-current-native/**"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v4/research/unit-phase-chaining/plant_quorum_admission.py"
      - "revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py"
      - ".github/workflows/titan-v5-plantquorum-current-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer-contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact event head
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Current-native observer contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/plantquorum-current-native
        run: |
          python -B -m unittest -v test_census.py
          python -O -B -m unittest -v test_census.py
      - name: Compile observer and canonical theorem
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          python -B -m py_compile candidates/v5/plantquorum-current-native/census.py candidates/v5/plantquorum-current-native/test_census.py candidates/v4/research/unit-phase-chaining/plant_quorum_admission.py
