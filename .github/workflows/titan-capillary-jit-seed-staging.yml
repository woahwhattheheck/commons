name: titan-capillary-jit-seed-staging

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/jit_seed_staging.py"
      - "revenue/kaggriculture/cloud-execution-lab/titan_capillary.py"
      - "revenue/kaggriculture/cloud-execution-lab/capillary_main.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_jit_seed_staging.py"
      - "revenue/kaggriculture/cloud-execution-lab/test_capillary_lifecycle.py"
      - "revenue/kaggriculture/cloud-execution-lab/receipts/capillary_jit_seed_staging.json"
      - ".github/workflows/titan-capillary-jit-seed-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic route, replay, lifecycle, and carrier certificates
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: python -m unittest -v test_jit_seed_staging.py test_capillary_lifecycle.py
      - name: Compile candidate and canonical carrier
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          python -m py_compile jit_seed_staging.py titan_capillary.py capillary_main.py test_jit_seed_staging.py test_capillary_lifecycle.py
