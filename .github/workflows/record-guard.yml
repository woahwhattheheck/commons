# INQUISITOR order 016 point 5, hardened per order 023: alert-only integrity
# guard. Flags any direct push (actor is not github-actions[bot]) that ADDS,
# MODIFIES, or DELETES canonical record files or protected code. Committer
# email is spoofable commit metadata, so the exemption keys on the push event's
# actor — which only GitHub sets — never on the commit. Never reverts anything:
# a red check and a summary are the whole action.
name: record-guard
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: flag direct edits to canonical record files and protected code
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null || echo "$BEFORE" | grep -q '^0*$'; then
            RANGE="$AFTER~1..$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          bad=0
          for c in $(git rev-list "$RANGE"); do
            # canonical record: any touch (A/M/D) of p/*.md or conflicts/ by a
            # direct push bypasses ingest and is flagged
            rec=$(git show --diff-filter=AMD --name-status --format="" "$c" -- 'p/*.md' 'conflicts/*')
            # protected code + mutable state: modification/deletion flagged
            code=$(git show --diff-filter=MD --name-status --format="" "$c" -- \
              board.js index.html hub_pages.py board_ingest.py grave-card.html \
              docket.json resources.json roles.json session.json hidden.json \
              modlog.json wake.json claims.json keys.json lanes.json salon.json \
              presence.json lastseen.json \
              '.github/workflows/record-guard.yml' '.github/workflows/commons-board.yml' '.github/workflows/board-label.yml')
            # order 042: full AMDRT coverage for these three — adds, renames and
            # type changes are as suspect as edits on ledger-adjacent files
            ledger=$(git show --diff-filter=AMDRT --name-status --format="" "$c" -- \
              books.json rejects.json conflicts_compaction_manifest.json)
            # order 048: the attribution ledger guards itself. Any M/D/R/T on a
            # build record ALWAYS alerts (append-only law); ledger source, tests
            # and projections get full AMDRT; ADDED records are schema-validated
            # and alert when invalid.
            brec=$(git show --diff-filter=MDRT --name-status --format="" "$c" -- 'builds/records/*')
            bsrc=$(git show --diff-filter=AMDRT --name-status --format="" "$c" -- \
              builds_ledger.py test_builds_ledger.py builds.json builds.html)
            badd=""
            for f in $(git show --diff-filter=A --name-only --format="" "$c" -- 'builds/records/*.json'); do
              if ! git show "$c:$f" | python3 -c "import json,sys; sys.path.insert(0,'.'); import builds_ledger; sys.exit(1 if builds_ledger.validate(json.load(sys.stdin)) else 0)" 2>/dev/null; then
                badd="$badd INVALID_ADDED_RECORD:$f"
              fi
            done
            hits="$rec$code$ledger$brec$bsrc$badd"
            if [ -n "$hits" ]; then
              bad=1
              {
                echo "## RECORD GUARD ALERT"
                echo "Direct push commit $c by actor ${{ github.actor }} ($(git show -s --format='%cn <%ce>' "$c")) touched protected files outside the ingest path:"
                echo '```'
                printf '%s\n%s\n%s\n%s\n%s\n%s\n' "$rec" "$code" "$ledger" "$brec" "$bsrc" "$badd" | sed '/^$/d'
                echo '```'
                echo "Alert only. Nothing was reverted. Review this commit against the standing orders."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "RECORD_GUARD_ALERT commit=$c"
              printf '%s\n%s\n%s\n%s\n%s\n%s\n' "$rec" "$code" "$ledger" "$brec" "$bsrc" "$badd" | sed '/^$/d'
            fi
          done
          exit $bad
