name: titan-v3-l01-materialize-sol-anchor

on:
  push:
    branches:
      - sol-anchor/titan-v3-l01-leanplant-idempotence-repair-20260910-01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titan-v3-l01-materialize-sol-anchor
  cancel-in-progress: false

jobs:
  materialize-exact-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and materialize exact Slack handoff
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          base64 --decode revenue/kaggriculture/cloud-execution-lab/candidates/.v3-handoff-f68792.b64 > "$payload"
          echo 'f68792bf7f0fb269864ef4ab25967292e2d4cd03439dbc5c52b98dfcebd1b728  '"$payload" | sha256sum --check --strict
          test "$(wc -c < "$payload")" -eq 27500
          python - "$payload" <<'PY'
          from pathlib import Path
          import sys
          import tarfile

          archive = Path(sys.argv[1])
          root = Path.cwd().resolve()
          expected = {
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/.gitignore',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/FILES.json',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/README.md',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/build_v3.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_features.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_l01.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/e11_rival_sell.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/e20_hire_guard.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/l01_mechanics.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/rival_model.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/shop_arb.py',
          }
          with tarfile.open(archive, 'r:gz') as tar:
              members = [member for member in tar.getmembers() if member.isfile()]
              normalized = {
                  member.name[2:] if member.name.startswith('./') else member.name
                  for member in members
              }
              assert normalized == expected, (sorted(normalized - expected), sorted(expected - normalized))
              for member in members:
                  name = member.name[2:] if member.name.startswith('./') else member.name
                  target = (root / name).resolve()
                  assert target == root / name
                  assert root in target.parents
                  source = tar.extractfile(member)
                  assert source is not None
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          print('HANDOFF_OK', len(expected), 'files')
          PY

      - name: Commit exact source on isolated repair ref
        run: |
          set -euo pipefail
          git config user.name tokenjunkielabs
          git config user.email tokenjunkielabs@gmail.com
          git rm revenue/kaggriculture/cloud-execution-lab/candidates/.v3-handoff-f68792.b64
          git rm .github/workflows/titan-v3-one-tree-land-sol-pro.yml
          git add revenue/kaggriculture/cloud-execution-lab/candidates/v3
          git diff --cached --check
          while IFS= read -r path; do
            case "$path" in
              revenue/kaggriculture/cloud-execution-lab/candidates/v3/*|revenue/kaggriculture/cloud-execution-lab/candidates/.v3-handoff-f68792.b64|.github/workflows/titan-v3-one-tree-land-sol-pro.yml) ;;
              *) echo "unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          test "$(git diff --cached --name-only --diff-filter=A | grep -c '^revenue/kaggriculture/cloud-execution-lab/candidates/v3/' || true)" -eq 13
          git commit -m 'chore(titan): expose exact V3 handoff for bounded repair'
          git push origin HEAD:sol-anchor/titan-v3-l01-leanplant-idempotence-repair-20260910-01
