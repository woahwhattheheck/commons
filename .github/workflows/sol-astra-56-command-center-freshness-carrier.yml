name: sol-astra-56 command-center freshness carrier
on:
  push:
    branches: ['sol-astra-56/cc-freshness-stage-20260909-01']
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-astra-56/cc-freshness-stage-20260909-01
          fetch-depth: 0
      - name: Apply bounded freshness repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          collectors = Path('integrations/command_center/collectors.py')
          text = collectors.read_text()
          old = '''def latest(items):
              values = [timestamp(item.get("updated_at")) for item in items]
          '''
          new = '''def latest(items):
              values = [timestamp(item.get("activity_observed_at")) for item in items]
          '''
          if text.count(old) != 1:
              raise SystemExit('collector latest() preimage mismatch')
          collectors.write_text(text.replace(old, new))

          tests = Path('integrations/command_center/test_collectors.py')
          text = tests.read_text()
          anchor = '''    def test_canonical_feature_and_vm_freshness_remain_source_grounded(self):
          '''
          addition = '''    def test_source_activity_summary_ignores_newer_metadata_timestamp(self):
              collector = LiveCollectors(self.store, {"github": {"enabled": False}},
                                         equipment=self.provider, clock=lambda: OBSERVED)
              source = collector._source("synthetic", "GitHub", "Synthetic", {"scope": "test"})
              batch = collector._batch(source, [{
                  "id": "work", "updated_at": "2026-09-07T21:00:00Z",
                  "activity_observed_at": "2026-09-07T20:00:00Z",
              }])
              self.assertEqual("2026-09-07T20:00:00Z", batch["source"]["activity_as_of"])
              metadata_only = collector._batch(source, [{
                  "id": "metadata-only", "updated_at": "2026-09-07T21:00:00Z",
                  "activity_observed_at": None,
              }])
              self.assertIsNone(metadata_only["source"]["activity_as_of"])

          '''
          if text.count(anchor) != 1 or 'test_source_activity_summary_ignores_newer_metadata_timestamp' in text:
              raise SystemExit('collector test insertion preimage mismatch')
          tests.write_text(text.replace(anchor, addition + anchor))
          PY
          git rm .github/workflows/sol-astra-56-command-center-freshness-carrier.yml
      - name: Verify command-center contracts
        run: |
          python3 -m unittest integrations.command_center.test_core integrations.command_center.test_server integrations.command_center.test_workstreams integrations.command_center.test_collectors integrations.command_center.test_work_integration integrations.command_center.test_collector_response_shapes integrations.command_center.test_collector_pagination_evidence integrations.command_center.test_document_retention -v
          python3 -m py_compile integrations/command_center/collectors.py integrations/command_center/test_collectors.py
          git diff --check
      - name: Commit tested two-file result
        run: |
          git config user.name 'sol-astra-56'
          git config user.email 'brycembusiness2@gmail.com'
          git add integrations/command_center/collectors.py integrations/command_center/test_collectors.py
          git commit -m 'Keep command-center source activity summaries strict'
          git push origin HEAD:sol-astra-56/cc-freshness-stage-20260909-01
