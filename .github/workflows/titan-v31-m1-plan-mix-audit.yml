name: titan-v31-m1-plan-mix-audit

on:
  push:
    branches:
      - 'astra/v31-m1-plan-mix-audit-20260911'
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/m1_plan_mix_audit/**'
      - '.github/workflows/titan-v31-m1-plan-mix-audit.yml'
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/m1_plan_mix_audit/**'
      - '.github/workflows/titan-v31-m1-plan-mix-audit.yml'

permissions:
