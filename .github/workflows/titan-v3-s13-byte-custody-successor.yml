name: titan-v3-s13-byte-custody-successor

on:
  pull_request:
    paths:
      - '.github/workflows/titan-v3-s13-byte-custody-successor.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-provenance-successor/certified_report_v3.py'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-provenance-successor/certified_report_v4.py'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-provenance-successor/test_certified_report_v3.py'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-provenance-successor/test_certified_report_v4.py'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-custody-closure/certified_report_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXACT_PARENT: 'e588a6508d8898c5fc49b2eac70f23cabb8cb5d4'
      DIR: 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-provenance-successor'
      V2: 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-custody-closure/certified_report_v2.py'
      V3_BLOB: 'a9e4be0c5e67f56fd1ceda6baf2d82b5000e6d3a'
      V2_BLOB: 'df35cf41cfa664c2832f54082ce80eb1c2b2bee6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact successor topology and three-path scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
          test "$(git rev-list --count "$EXACT_PARENT"..HEAD)" = 1
          cat > "$RUNNER_TEMP/EXPECTED-PATHS.txt" <<'EOF'
          .github/workflows/titan-v3-s13-byte-custody-successor.yml
          revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-provenance-successor/certified_report_v4.py
          revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-provenance-successor/test_certified_report_v4.py
          EOF
          git diff --name-only "$EXACT_PARENT"..HEAD | sort > "$RUNNER_TEMP/ACTUAL-PATHS.txt"
          sort -o "$RUNNER_TEMP/EXPECTED-PATHS.txt" "$RUNNER_TEMP/EXPECTED-PATHS.txt"
          diff -u "$RUNNER_TEMP/EXPECTED-PATHS.txt" "$RUNNER_TEMP/ACTUAL-PATHS.txt"
          git diff --check "$EXACT_PARENT"..HEAD
          test "$(git hash-object "$DIR/certified_report_v3.py")" = "$V3_BLOB"
          test "$(git hash-object "$V2")" = "$V2_BLOB"

      - name: Compile without repository bytecode
        shell: python
        run: |
          from pathlib import Path
          root = Path('${{ env.DIR }}')
          for name in (
              'certified_report_v3.py',
              'certified_report_v4.py',
              'test_certified_report_v3.py',
              'test_certified_report_v4.py',
          ):
              path = root / name
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')

      - name: Run parent provenance and byte-custody killers
        working-directory: revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-s13-certified-prefix695-provenance-successor
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            python -B -m unittest -v \
              test_certified_report_v3.py \
              test_certified_report_v4.py \
            2>&1 | tee "$RUNNER_TEMP/s13-byte-custody-tests.log"

      - name: Emit exact-head source receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          paths = [
              Path('.github/workflows/titan-v3-s13-byte-custody-successor.yml'),
              Path(os.environ['DIR']) / 'certified_report_v3.py',
              Path(os.environ['DIR']) / 'certified_report_v4.py',
              Path(os.environ['DIR']) / 'test_certified_report_v3.py',
              Path(os.environ['DIR']) / 'test_certified_report_v4.py',
              Path(os.environ['V2']),
          ]
          files = {}
          for path in paths:
              data = path.read_bytes()
              files[str(path)] = {
                  'bytes': len(data),
                  'git_blob': hashlib.sha1(
                      b'blob ' + str(len(data)).encode() + b'\0' + data
                  ).hexdigest(),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          assert files[str(Path(os.environ['DIR']) / 'certified_report_v3.py')]['git_blob'] == os.environ['V3_BLOB']
          assert files[os.environ['V2']]['git_blob'] == os.environ['V2_BLOB']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD']
          log = Path(os.environ['RUNNER_TEMP']) / 's13-byte-custody-tests.log'
          receipt = {
              'schema': 'titan-v3-s13-byte-custody-successor-source-receipt/v1',
              'head': head,
              'exact_parent': os.environ['EXACT_PARENT'],
              'files': files,
              'test_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'custody': (
                  'each evaluator file is captured once; the same immutable bytes feed '
                  'hashing, strict provenance parsing, activation checks, and inherited v2 math'
              ),
              'scope': (
                  'evidence-only byte-custody successor; parent v3 and exact v2 builder pinned; '
                  'no gameplay, evaluator, candidate, config, archive, pointer, provider, Kaggle, '
                  'promotion, merge, or submission mutation'
              ),
          }
          out = Path(os.environ['RUNNER_TEMP']) / 's13-byte-custody-source-receipt.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out.read_text(), end='')

      - uses: actions/upload-artifact@v4
        with:
          name: titan-v3-s13-byte-custody-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/s13-byte-custody-tests.log
            ${{ runner.temp }}/s13-byte-custody-source-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Require clean checkout
        run: test -z "$(git status --porcelain)"
