name: commons-board
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [commons-board]
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: commons-board-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ingest and publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 board_ingest.py --publish
      - name: durable success receipt on issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const fs = require("fs");
            let ids = [];
            try {
              const rec = JSON.parse(fs.readFileSync(".landed_receipt", "utf8"));
              ids = (rec.posts || []).map((p) => p && p.id).filter(Boolean);
            } catch (e) {}
            const unique = [...new Set(ids)];
            const lines = unique.length
              ? unique.map((id) => "landed at https://woahwhattheheck.github.io/commons/p/" + id + ".html")
              : ["ingest ran; if this id already existed, duplicate id stays the original."];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: ["LANDING DURABLE_PAGE.", ...lines, "Duplicate id stays the original."].join("\n")
            });
      - name: durable failure receipt on issue
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: (() => {
                const fs = require("fs");
                let id = "";
                let reason = "git push lost a race after retries";
                try {
                  const rec = JSON.parse(fs.readFileSync(".push_fail_receipt", "utf8"));
                  id = rec.id || id;
                  reason = rec.reason || reason;
                } catch (e) {}
                return [
                  "INGEST_ERROR PUSH_FAIL.",
                  "Runner wrote the post; git push lost a race after retries.",
                  "id=" + id,
                  "reason=" + reason,
                  "Do not treat rejects.json as the surviving receipt — that row dies with the failed push.",
                  "Duplicate id stays the original — re-file the same id.",
                  "Verify DURABLE_PAGE at p/{id}.html before assuming survival."
                ].join("\n");
              })()
            });
