name: commons-board
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [commons-board]
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: commons-board-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ingest and publish
        id: publish
        run: python3 board_ingest.py --publish
      - name: durable failure receipt on issue
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "INGEST_ERROR PUSH_FAIL. Runner wrote the post; git push lost a race after retries. rejects.json has state=PUSH_FAIL. Duplicate id stays the original — re-file the same id. Verify DURABLE_PAGE at p/{id}.html before assuming survival."
            });
