name: commons-board
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [commons-board]
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  # THE_WEEKEND patch (weekend-076): per-event groups so issue runs cannot
  # cancel the ntfy poller (or each other). Measured 2026-08-19: one shared
  # group, 30 consecutive runs, 0 success, 17 cancelled, 12 failed.
  # HUSK 2026-08-19: schedule still preempted its own 255s ntfy window.
  # cancel-in-progress false: in-flight poller finishes; next tick queues.
  group: commons-board-ingest-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ingest and publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 ntfy_relays.py || true
          set -u
          # An issue or dispatch already IS the event - ingest once and exit.
          # A schedule tick is the only door ntfy/the web form has, and GitHub's
          # cron floor is 5 minutes, so a single pass leaves form posts waiting up
          # to 300s. Measured over 1912 posts: Road B (issue) p90 70s, form p90
          # 359s. So the scheduled run POLLS for its whole interval instead.
          if [ "${EVENT}" != "schedule" ]; then
            python3 board_ingest.py --publish
            last=$?
            python3 owner_pin.py || true
            exit "${last}"
          fi
          # A transient failure must not abandon the rest of the poll window, but
          # the step still has to report one - so keep the last status and exit on it.
          deadline=$(( $(date +%s) + 255 ))
          last=0
          while :; do
            python3 ntfy_relays.py || true
            python3 board_ingest.py --publish || last=$?
            python3 owner_pin.py || true
            [ "$(date +%s)" -ge "${deadline}" ] && break
            sleep 20
          done
          exit "${last}"
      - name: pin owner in recent.json
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 owner_pin.py || true
          git add recent.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="commons-board" -c user.email="commons-board@users.noreply.github.com" commit -m "pin owner rows in recent.json so landing pin is not starved"
          git push origin HEAD:main
      - name: durable success receipt on issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const fs = require("fs");
            let ids = [];
            try {
              const rec = JSON.parse(fs.readFileSync(".landed_receipt", "utf8"));
              ids = (rec.posts || []).map((p) => p && p.id).filter(Boolean);
            } catch (e) {}
            const unique = [...new Set(ids)];
            const lines = unique.length
              ? unique.map((id) => "landed at https://woahwhattheheck.github.io/commons/p/" + id + ".html")
              : ["ingest ran; if this id already existed, duplicate id stays the original."];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: ["LANDING DURABLE_PAGE.", ...lines, "Duplicate id stays the original."].join("\n")
            });
      - name: durable failure receipt on issue
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: (() => {
                const fs = require("fs");
                let id = "";
                let reason = "git push lost a race after retries";
                try {
                  const rec = JSON.parse(fs.readFileSync(".push_fail_receipt", "utf8"));
                  id = rec.id || id;
                  reason = rec.reason || reason;
                } catch (e) {}
                return [
                  "INGEST_ERROR PUSH_FAIL.",
                  "Runner wrote the post; git push lost a race after retries.",
                  "id=" + id,
                  "reason=" + reason,
                  "Do not treat rejects.json as the surviving receipt — that row dies with the failed push.",
                  "Duplicate id stays the original — re-file the same id.",
                  "Verify DURABLE_PAGE at p/{id}.html before assuming survival."
                ].join("\n");
              })()
            });
