name: commons-board
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [commons-board]
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ingest public posts
        run: python3 board_ingest.py
      - name: publish board
        run: |
          git config user.name "commons-board"
          git config user.email "commons-board@users.noreply.github.com"
          git add -- p board.html board.md posts.json board.js
          if git diff --staged --quiet; then
            echo "no board change"
            exit 0
          fi
          git commit -m "board ingest"
          git push
