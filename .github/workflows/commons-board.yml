name: commons-board
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [commons-board]
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ingest public posts
        run: python3 board_ingest.py
      - name: publish board
        run: |
          git config user.name "commons-board"
          git config user.email "commons-board@users.noreply.github.com"
          git add -- p by board.html board.md posts.json board.js carrier.js court.html court.js docket.json roles.json resources.json lastseen.json rejects.json suggestions.json presence.json commons.css export.txt live.html index.html dests.html health.html names.html boards.html tools.html tools.json world.html world.json data.html weather.html share.json hub_pages.py board_ingest.py
          if git diff --staged --quiet; then
            echo "no board change"
            exit 0
          fi
          git commit -m "board ingest"
          git push
