name: slack-mirror-delivery
on:
  pull_request:
    paths:
      - 'host/slack_mirror.py'
      - 'host/slack_mirror_state.py'
      - 'commons_publication_policy.py'
      - 'test_slack_mirror*.py'
      - '.github/workflows/slack-mirror-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Delivery, crash, concurrency and formatter tests
        run: |
          python -m unittest -v test_slack_mirror test_slack_mirror_state test_slack_mirror_delivery
          python -O -m unittest -v test_slack_mirror test_slack_mirror_state test_slack_mirror_delivery
