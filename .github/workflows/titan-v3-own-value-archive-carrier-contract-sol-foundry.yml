name: titan-v3-own-value-archive-carrier-contract-sol-foundry

on:
  push:
    paths:
      - '.github/workflows/titan-v3-own-value-archive-carrier-contract-sol-foundry.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-own-value-archive-carrier-sol-foundry/**'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-own-value-objective-sol-objective/own_value_objective.py'
      - 'revenue/kaggriculture/cloud-execution-lab/build_integrated.py'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'
      - 'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json'
      - 'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json'
      - 'p/sol-foundry-titan-pr11899-archive-closure-carrier-20260909-01.md'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-own-value-archive-carrier-contract-sol-foundry.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-own-value-archive-carrier-sol-foundry/**'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-own-value-objective-sol-objective/own_value_objective.py'
      - 'revenue/kaggriculture/cloud-execution-lab/build_integrated.py'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'
      - 'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json'
      - 'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json'
      - 'p/sol-foundry-titan-pr11899-archive-closure-carrier-20260909-01.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-current-archive-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout and helper sources
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor aa33226abb0d5158510d85f2576f8207d53c2a85 HEAD
          LAB=revenue/kaggriculture/cloud-execution-lab
          PARENT="$LAB/analysis/titan-v3-own-value-objective-sol-objective"
          CASE="$LAB/analysis/titan-v3-own-value-archive-carrier-sol-foundry"
          verify_blob() {
            local path="$1" expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf '%s  %s\n' "$actual" "$path"
            test "$actual" = "$expected"
          }
          {
            printf '%s\n' "$EXPECTED_HEAD"
            verify_blob "$LAB/build_integrated.py" 05994d946885ff0fe2a2ce77439fd335174900aa
            verify_blob "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json" 8a9023bb85447f0aad088699ecf7f0a03b808201
            verify_blob "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" f5d8a9f1338dbef5396de8f23262453b0f70e832
            verify_blob "$LAB/reference/titan-current/latest/selected_sell_core.py" f23d3a8b5ee5e82029026e7f8f44eb36c143a5a3
            verify_blob "$PARENT/own_value_objective.py" 17c49e220de6b8c1c1ba15a95e4707a3d9cd1ea0
            verify_blob "$CASE/archive_runtime_guard.py" 2fbc4b45d2f0f06f8ccef2665d8d740d73c9e3db
            verify_blob "$CASE/archive_carrier.py" 2f5be09c36368732ddf80a84f3a86b36b2ae405e
            verify_blob "$CASE/verify_panel_binding.py" 82f0026fd1924ab3987aaf804eba7cc3f56cd87c
            verify_blob "$CASE/test_archive_carrier.py" d56ba9d313225da3cdfbaaf214537aeafd57f9fb
            verify_blob "$CASE/README.md" 4872d9a05ce9c7ee8750aee602a1cd6edec589db
            verify_blob "$CASE/RECEIPT.md" 4aa417257a962e4d23dd98111bd21b24556bff0f
            verify_blob p/sol-foundry-titan-pr11899-archive-closure-carrier-20260909-01.md 77aee39eec78d49caf130227c8e1f41e2c8a8802
          } | tee "$RUNNER_TEMP/source-blobs.txt"
          git diff --exit-code -- .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run adversarial carrier and binder contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-own-value-archive-carrier-sol-foundry
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python -m py_compile \
            archive_runtime_guard.py archive_carrier.py verify_panel_binding.py \
            test_archive_carrier.py
          python -m unittest -v test_archive_carrier.py \
            2>&1 | tee "$RUNNER_TEMP/FOCUSED-TESTS.txt"

      - name: Verify exact current integrated release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python build_integrated.py --check \
            | tee "$RUNNER_TEMP/CANONICAL-ARCHIVE-CHECK.json"
          git diff --exit-code -- .

      - name: Materialize, probe, and re-inventory both real archive arms
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          PARENT="$LAB/analysis/titan-v3-own-value-objective-sol-objective"
          CASE="$LAB/analysis/titan-v3-own-value-archive-carrier-sol-foundry"
          OUT="$RUNNER_TEMP/titan-v3-own-value-archive-carrier-contract"
          mkdir -p "$OUT"
          python "$CASE/archive_carrier.py" materialize \
            --lab-root "$LAB" \
            --pointer "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json" \
            --overlay "$PARENT/own_value_objective.py" \
            --output "$OUT/carrier" \
            --git-head "$(git rev-parse HEAD)" \
            | tee "$OUT/MATERIALIZE-STDOUT.json"
          python "$CASE/archive_carrier.py" probe \
            --entry "$OUT/carrier/control/control_entry.py" \
            --output "$OUT/CONTROL-PROBE.json" \
            > "$OUT/CONTROL-PROBE-STDOUT.json"
          python "$CASE/archive_carrier.py" probe \
            --entry "$OUT/carrier/candidate/candidate_entry.py" \
            --output "$OUT/CANDIDATE-PROBE.json" \
            > "$OUT/CANDIDATE-PROBE-STDOUT.json"
          python "$CASE/archive_carrier.py" verify \
            --root "$OUT/carrier" \
            --output "$OUT/POST-PROBE-VERIFY.json" \
            > "$OUT/POST-PROBE-VERIFY-STDOUT.json"
          OUT="$OUT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUT"])
          receipt = json.loads((out / "carrier" / "CARRIER-RECEIPT.json").read_text())
          control = json.loads((out / "CONTROL-PROBE.json").read_text())
          candidate = json.loads((out / "CANDIDATE-PROBE.json").read_text())
          post = json.loads((out / "POST-PROBE-VERIFY.json").read_text())
          assert receipt["canonical_runtime_equal"] is True
          assert receipt["canonical_repository_modified"] is False
          assert receipt["control"]["runtime_tree_sha256"] == receipt["candidate"]["runtime_tree_sha256"]
          assert control["runtime_receipt"]["runtime_tree_sha256"] == receipt["archive"]["runtime_tree_sha256"]
          assert candidate["runtime_receipt"]["runtime_tree_sha256"] == receipt["archive"]["runtime_tree_sha256"]
          assert control["module_origins"]["observed_clone"] == "observed_clone.py"
          assert candidate["module_origins"]["observed_clone"] == "observed_clone.py"
          assert control["install_receipt"] is None
          install = candidate["install_receipt"]
          assert install["changed_field"] == "MarketPath.score[0]"
          assert install["actual_git_blob"] == install["expected_git_blob"]
          assert install["canonical_files_modified"] is False
          assert post["canonical_runtime_equal"] is True
          assert set(post["arms"]) == {"control", "candidate"}
          PY
          git diff --exit-code -- .

      - name: Write immutable helper provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/titan-v3-own-value-archive-carrier-contract"
          mkdir -p "$OUT"
          OUT="$OUT" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          out = Path(os.environ["OUT"])
          files = {}
          for path in sorted(out.rglob("*")):
              if path.is_file() and path.name != "PROVENANCE.json":
                  files[path.relative_to(out).as_posix()] = {
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
          result = {
              "schema_version": 1,
              "operation": "TITAN-PR11899-ARCHIVE-CLOSURE-CARRIER-20260909-01",
              "git_head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "scope": "materializer_guard_binder_and_real_archive_import_probes",
              "files": files,
              "games_run": 0,
              "strength_claim": None,
              "promotion_authorized": False,
          }
          (out / "PROVENANCE.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain exact helper and real-archive probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-own-value-archive-carrier-contract-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-blobs.txt
            ${{ runner.temp }}/FOCUSED-TESTS.txt
            ${{ runner.temp }}/CANONICAL-ARCHIVE-CHECK.json
            ${{ runner.temp }}/titan-v3-own-value-archive-carrier-contract/
          if-no-files-found: error
          retention-days: 30

      - name: Assert terminal helper evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/titan-v3-own-value-archive-carrier-contract"
          test -s "$RUNNER_TEMP/source-blobs.txt"
          test -s "$RUNNER_TEMP/FOCUSED-TESTS.txt"
          test -s "$RUNNER_TEMP/CANONICAL-ARCHIVE-CHECK.json"
          test -s "$OUT/carrier/CARRIER-RECEIPT.json"
          test -s "$OUT/CONTROL-PROBE.json"
          test -s "$OUT/CANDIDATE-PROBE.json"
          test -s "$OUT/POST-PROBE-VERIFY.json"
          test -s "$OUT/PROVENANCE.json"
          git diff --exit-code -- .
