name: Process pending canonical TITAN ACTION

on:
  push:
    branches: [astra/orbit-action-wake-20260908]
    paths:
      - .github/workflows/orbit-canonical-adoption-action.yml

permissions:
  contents: read

jobs:
  execute-one:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Full-history partial sparse checkout of current main
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          cat > .git/info/sparse-checkout <<'EOF'
          /action_executor.py
          /p/
          /actions/
          /revenue/kaggriculture/
          EOF
          git fetch --filter=blob:none --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --detach origin/main
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Execute only the committed canonical-adoption ACTION
        working-directory: repo
        run: python3 action_executor.py --scope github --only-id cancel-canonical-adoption-20260908-01 > .action_changed.json
      - name: Pack exact changed bytes and effect receipt
        working-directory: repo
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          root = Path.cwd().resolve()
          out = root / '.action_artifact'
          data = json.loads((root / '.action_changed.json').read_text())
          deletions = {str(item).strip().replace('\\', '/') for item in (data.get('action_deletions') or [])}
          receipt_only = []
          out.mkdir()
          shutil.copyfile(root / '.action_changed.json', out / '.action_changed.json')
          for raw in data.get('changed') or []:
              name = str(raw).strip().replace('\\', '/')
              if not name or name in deletions:
                  continue
              src = Path(name).expanduser()
              if not src.is_absolute():
                  src = root / src
              src = src.resolve()
              try:
                  archive_name = src.relative_to(root)
              except ValueError:
                  receipt_only.append({'path': name, 'transport': 'executed; no Git artifact address'})
                  continue
              if not src.is_file():
                  receipt_only.append({'path': name, 'transport': 'executed; no regular-file bytes'})
                  continue
              dest = out / archive_name
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dest)
          (out / '.action_receipt_only.json').write_text(json.dumps(receipt_only, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-adoption-action-outputs
          path: repo/.action_artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  land-one:
    needs: execute-one
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            /action_land.py
            /actions/
            /revenue/kaggriculture/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: canonical-adoption-action-outputs
          path: ${{ runner.temp }}/canonical-adoption-action-outputs
      - name: Verify exact outputs on a fresh runner and land
        run: python3 action_land.py --source "${RUNNER_TEMP}/canonical-adoption-action-outputs"
