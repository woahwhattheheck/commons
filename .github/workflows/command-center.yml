name: command-center
on:
  push:
    branches: [main]
    
    paths: ['integrations/command_center/**', 'integrations/shared_equipment/services.py', 'command.html', '.github/workflows/command-center.yml']
  pull_request:
    paths: ['integrations/command_center/**', 'integrations/shared_equipment/services.py', 'command.html', '.github/workflows/command-center.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            integrations/command_center
            integrations/shared_equipment
            host
          sparse-checkout-cone-mode: true
      - name: Existing Commons admission contract
        run: python3 open_door_guard.py --diff HEAD^ HEAD
      - name: Shared state, operation journal, and HTTP contracts
        run: python3 -m unittest integrations.command_center.test_core integrations.command_center.test_server integrations.command_center.test_workstreams integrations.command_center.test_collectors integrations.command_center.test_work_integration integrations.command_center.test_collector_response_shapes integrations.command_center.test_collector_pagination_evidence integrations.command_center.test_document_retention integrations.command_center.test_observability integrations.command_center.test_summary integrations.command_center.test_request_budget integrations.command_center.test_mail_tracking integrations.command_center.test_mail_integration integrations.command_center.test_context_view integrations.command_center.test_context_integration integrations.command_center.test_slack_threads -v
      - name: Browser source syntax
        run: |
          node --check integrations/command_center/web/app.js
          node --check integrations/command_center/web/work.js
          node --check integrations/command_center/web/deathstar.js
          node --check integrations/command_center/web/mail.js
      - name: Dashboard presentation contracts
        run: node --test integrations/command_center/test_mail_render.cjs integrations/command_center/test_deathstar_render.cjs integrations/command_center/test_web.cjs integrations/command_center/test_work_detail.cjs integrations/command_center/test_work_activity_timestamp.cjs integrations/command_center/test_work_continuous_refresh.cjs integrations/command_center/test_command_page_refresh.cjs

      - name: Prepare exact-change GPT review packet
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python3 host/swarm_review.py packet --prs "$REVIEW_PR" --out "$RUNNER_TEMP/deathstar-review.json"
          status=$?
          set -e
          if [ ! -f "$RUNNER_TEMP/deathstar-review.json" ]; then
            python3 -c 'import json,os,sys; raw=sys.stdin.read(); print(raw); data=json.loads(raw) if raw.strip().startswith("{") else {}; reason=str(data.get("reason","")); sys.exit(0 if "no longer open" in reason else 1)' <<'EOF'
          $(python3 host/swarm_review.py packet --prs "$REVIEW_PR" --out "$RUNNER_TEMP/deathstar-review.json" 2>&1 | tail -1)
          EOF
          fi
          python3 -c 'import json,os,sys
p=os.environ.get("RUNNER_TEMP")+"/deathstar-review.json"
if not os.path.exists(p):
    sys.exit(0)
data=json.load(open(p))
if "prs" not in data:
    reason=str(data.get("reason",""))
    print(json.dumps(data))
    sys.exit(0 if "no longer open" in reason else 1)
print(json.dumps({"review_template":data["prs"][0]["review_template"],"review":data["prs"][0]["review"],"diff_truncated":data["prs"][0]["diff_truncated"]}))'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: deathstar-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/deathstar-review.json
          retention-days: 7
