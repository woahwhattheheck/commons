name: command-center
on:
  push:
    branches: [main, 'codex/command-center-*']
    paths: ['integrations/command_center/**', 'integrations/shared_equipment/services.py', 'command.html', '.github/workflows/command-center.yml']
  pull_request:
    paths: ['integrations/command_center/**', 'integrations/shared_equipment/services.py', 'command.html', '.github/workflows/command-center.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            integrations/command_center
            integrations/shared_equipment
            host
          sparse-checkout-cone-mode: true
      - name: Existing Commons admission contract
        run: python3 open_door_guard.py --diff HEAD^ HEAD
      - name: Shared state, operation journal, and HTTP contracts
        run: python3 -m unittest integrations.command_center.test_core integrations.command_center.test_server integrations.command_center.test_workstreams integrations.command_center.test_collectors integrations.command_center.test_work_integration integrations.command_center.test_collector_response_shapes integrations.command_center.test_collector_pagination_evidence integrations.command_center.test_document_retention integrations.command_center.test_observability integrations.command_center.test_summary integrations.command_center.test_request_budget integrations.command_center.test_mail_tracking integrations.command_center.test_mail_integration integrations.command_center.test_context_view integrations.command_center.test_context_integration -v
      - name: Browser source syntax
        run: |
          node --check integrations/command_center/web/app.js
          node --check integrations/command_center/web/work.js
          node --check integrations/command_center/web/deathstar.js
          node --check integrations/command_center/web/mail.js
      - name: Dashboard presentation contracts
        run: node --test integrations/command_center/test_mail_render.cjs integrations/command_center/test_deathstar_render.cjs integrations/command_center/test_web.cjs integrations/command_center/test_work_detail.cjs integrations/command_center/test_work_activity_timestamp.cjs integrations/command_center/test_work_continuous_refresh.cjs integrations/command_center/test_command_page_refresh.cjs

      - name: Prepare exact-change GPT review packet
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
        run: |
          python3 host/swarm_review.py packet --prs "$REVIEW_PR" --out "$RUNNER_TEMP/deathstar-review.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/deathstar-review.json")); print(json.dumps({"review_template":p["prs"][0]["review_template"],"review":p["prs"][0]["review"],"diff_truncated":p["prs"][0]["diff_truncated"]}))'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: deathstar-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/deathstar-review.json
          retention-days: 7
