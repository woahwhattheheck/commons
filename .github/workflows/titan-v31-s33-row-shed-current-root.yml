name: TITAN V3.1 S33 row-shed current-root custody

on:
  pull_request:
    branches:
      - titan/v3.1-20260911
    paths:
      - '.github/workflows/titan-v31-s33-row-shed-current-root.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root/**'
  push:
    branches:
      - astra/v31-8e3-row-shed-current-root-recompose-20260911

permissions:
  contents: read

concurrency:
  group: titan-v31-s33-row-shed-current-root-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE: 8e3d92a286806f9f9525973ee7d359b629a11487
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CASE: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root
      R04: revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py
      B5: revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/b5_fertilize.py
      JIT: revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/jit_pass_fertilize.py
      APPLY: revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py

    steps:
      - name: Checkout literal owner head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind live 8e3 root, shipped factors, and additive donor scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/titan/v3.1-20260911 | awk '{print $1}')" = "$BASE"

          test "$(git rev-parse "HEAD:$R04")" = '7edacbfb4916b8f241b689ded6643240ca02a9ec'
          test "$(git rev-parse "HEAD:$B5")" = '2a9d606835b0d04d832a4737dcb381ad3fbef1ae'
          test "$(git rev-parse "HEAD:$JIT")" = '6ef7ddcd9590e3cb3f55ceb708b8026235d59410'
          test "$(git rev-parse "HEAD:$APPLY")" = 'a43d6c470ab05d87803fb016966d1cc54fab9d17'

          git diff --name-only "$BASE"...HEAD > "$RUNNER_TEMP/row-shed-paths.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          case = 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root/'
          workflow = '.github/workflows/titan-v31-s33-row-shed-current-root.yml'
          paths = [p for p in Path(os.environ['RUNNER_TEMP'], 'row-shed-paths.txt').read_text().splitlines() if p]
          if not paths:
              raise SystemExit('row-shed donor has no delta')
          bad = [p for p in paths if p != workflow and not p.startswith(case)]
          if bad:
              raise SystemExit(f'row-shed scope escaped additive donor boundary: {bad!r}')
          required = {
              case + 'README.md',
              case + 'candidate.py',
              case + 'row_shed.py',
              case + 'test_row_shed.py',
              workflow,
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f'row-shed custody paths missing: {missing!r}')
          print('ROW_SHED_SCOPE_OK', len(paths))
          PY
          git diff --check "$BASE"...HEAD
          test -z "$(git status --porcelain)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile donor and run focused contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile candidate.py row_shed.py test_row_shed.py
          python -B -m unittest -v test_row_shed.py |& tee "$RUNNER_TEMP/row-shed-tests.log"
          grep -E '^Ran 11 tests in [0-9.]+s$' "$RUNNER_TEMP/row-shed-tests.log"
          grep -Fx 'OK' "$RUNNER_TEMP/row-shed-tests.log"
          ! grep -E 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/row-shed-tests.log"
          python -B - <<'PY'
          import candidate
          cfg = candidate.CURRENT_8E3
          assert cfg['horizon'] == 8 and type(cfg['horizon']) is int
          assert cfg['opening'] == 0 and type(cfg['opening']) is int
          assert cfg['row_order'] is True
          assert cfg['evening_flush'] is True
          assert cfg['sale_fertilizer'] is True
          assert cfg['cattle_early'] is True
          assert cfg['strawberry_topup'] is True
          assert cfg['no_late_sale_advance'] is True
          assert cfg['no_late_sale_advance_step'] == 648 and type(cfg['no_late_sale_advance_step']) is int
          assert cfg['b5_carrot_fertilizer'] is True
          assert cfg['b5_jit_fertilize'] is True
          print('ROW_SHED_8E3_TUPLE_OK')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
