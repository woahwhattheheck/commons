name: SOL-FULCRUM exact tree transport

on:
  push:
    branches:
      - sol-fulcrum/titan-v2-future-rival-ablation-20260909-01
    paths:
      - ".fulcrum-bootstrap/**"
      - ".github/workflows/sol-fulcrum-tree-transport.yml"

permissions:
  contents: write

jobs:
  install:
    if: "${{ github.event.head_commit.message == 'chore: stage SOL-FULCRUM exact tree' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and unpack exact authored tree
        run: python .fulcrum-bootstrap/install.py
      - name: Prove transported source
        shell: bash
        run: |
          set -euo pipefail
          CASE=revenue/kaggriculture/cloud-execution-lab/analysis/v2-future-rival-ablation-sol-fulcrum
          python -m py_compile "$CASE"/*.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s "$CASE" -p 'test_*.py' -v
          find "$CASE" -type d -name __pycache__ -prune -exec rm -rf {} +
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/titan-v2-future-rival-ablation-sol-fulcrum.yml
          git diff --check
      - name: Commit verified final tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          rm -rf .fulcrum-bootstrap .github/workflows/sol-fulcrum-tree-transport.yml
          git add -A
          git diff --cached --check
          git config user.name SOL-FULCRUM
          git config user.email tokenjunkielabs@gmail.com
          git commit -m 'titan: isolate V2 future-rival conservatism [fulcrum transport]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
