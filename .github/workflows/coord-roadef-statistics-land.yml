name: coord-roadef-statistics-land

on:
  push:
    branches:
      - work/coord-roadef-statistics-output-20260908

permissions:
  contents: write

concurrency:
  group: coord-roadef-statistics-land
  cancel-in-progress: true

jobs:
  apply-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/roadef-statistics-payload
            revenue/roadef2026/fleet-candidate
          sparse-checkout-cone-mode: false

      - name: Decode and apply source-pinned payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/roadef-statistics-payload
          cat .github/roadef-statistics-payload/part-* | base64 -d > /tmp/roadef-statistics-payload.tar.gz
          echo 'e2c12faca1565bd286203ff8a663d9f6446fca659f4d8d46c8a58fcdfa8145c4  /tmp/roadef-statistics-payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/roadef-statistics-payload.tar.gz -C /tmp/roadef-statistics-payload
          python3 /tmp/roadef-statistics-payload/apply.py

      - name: Verify publication identities and recorded native evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, py_compile

          root = Path('revenue/roadef2026/fleet-candidate')
          expected = {
              'main.cpp': (37776, '79362dbf9d47ca921de508a9253e7c2642c57459487a88ea754780b673961724'),
              'statistics-output-checks/README.md': (6261, '42d152a2aa025660a79afa8a2b3487b3e70d5691b1d1f9eaf429dcf3c78fe34d'),
              'statistics-output-checks/test_statistics_output.py': (13369, '75516589cb037424e346c0c9717188b1b171e6327ad3a831fab49b793d3d5633'),
              'statistics-output-checks/STATISTICS-OUTPUT-VALIDATION.json': (2245, '2b4d5d84692e72e3a172efbf7bb83e299a08a09b5bbeade09e78d1474a515490'),
              'statistics-output-checks/CURRENT-REGRESSIONS.json': (353, 'd330061162bcbe9fb0efc8f88ad7fa3791052ca2eb50b699fb885ac706669cfa'),
              'statistics-output-checks/current-regressions.log': (2991, '69a5a3b3425dd89d5e0d4dd8e8df4291bdc2037e66b34a32683208e633b205a3'),
          }
          for name, (size, digest) in expected.items():
              raw = (root / name).read_bytes()
              assert len(raw) == size, (name, len(raw), size)
              assert hashlib.sha256(raw).hexdigest() == digest, name

          manifest = json.loads((root / 'PUBLIC-SOURCE-MANIFEST.json').read_text())
          row = next(item for item in manifest['files'] if item['path'] == 'main.cpp')
          assert row == {
              'path': 'main.cpp',
              'bytes': 37776,
              'sha256': '79362dbf9d47ca921de508a9253e7c2642c57459487a88ea754780b673961724',
          }

          local = json.loads((root / 'statistics-output-checks/CURRENT-REGRESSIONS.json').read_text())
          assert local['tests_run'] == 24 and local['successful'] is True
          validation = json.loads((root / 'statistics-output-checks/STATISTICS-OUTPUT-VALIDATION.json').read_text())
          assert validation['candidate']['tests_run'] == 24
          assert validation['baseline']['failed_assertions_or_subtests'] == 25
          assert validation['official_checker']['executions'] == 6
          assert validation['submission_changed'] is False
          py_compile.compile(str(root / 'statistics-output-checks/test_statistics_output.py'), doraise=True)
          PY
          git diff --check

      - name: Commit verified implementation to this branch
        shell: bash
        run: |
          set -euo pipefail
          git add revenue/roadef2026/fleet-candidate/main.cpp \
                  revenue/roadef2026/fleet-candidate/PUBLIC-SOURCE-MANIFEST.json \
                  revenue/roadef2026/fleet-candidate/statistics-output-checks
          git diff --cached --check
          git config user.name commons-board
          git config user.email commons-board@users.noreply.github.com
          git commit -m 'fix(roadef): preserve solution and statistics outputs'
          git push origin HEAD:work/coord-roadef-statistics-output-20260908
