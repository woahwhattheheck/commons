name: titan-v31-d3-externality-gate

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/v31_externality_gate.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/test_v31_externality_gate.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/v31_delta_distribution_report.py'
      - '.github/workflows/titan-v31-d3-externality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  externality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind stacked scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e bc3de14fff86079e70659fd3c2ea42ffd2101b97^{commit}
          test "$(git merge-base bc3de14fff86079e70659fd3c2ea42ffd2101b97 HEAD)" = "bc3de14fff86079e70659fd3c2ea42ffd2101b97"
          git diff --name-only bc3de14fff86079e70659fd3c2ea42ffd2101b97..HEAD | tee /tmp/d3-paths.txt
          python - <<'PY'
          from pathlib import Path
          paths = [p for p in Path('/tmp/d3-paths.txt').read_text().splitlines() if p]
          allowed = {
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/v31_externality_gate.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/test_v31_externality_gate.py',
              '.github/workflows/titan-v31-d3-externality-gate.yml',
          }
          assert paths, 'empty D3 diff'
          assert set(paths) == allowed, paths
          print('D3_SCOPE_OK', len(paths))
          PY
          test -z "$(git status --porcelain)"

      - name: Syntax-check evidence tools without mutating checkout
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'v31_delta_distribution_report.py',
              'v31_externality_gate.py',
              'test_v31_externality_gate.py',
          ):
              path = Path(name)
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('D3_COMPILE_OK')
          PY
          test -z "$(git status --porcelain)"

      - name: Preserve parent score-normalization suite
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B test_v31_delta_distribution_report.py

      - name: Run D3 focused predecessors
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest -v test_v31_externality_gate.py

      - name: Prove checkout stayed clean
        run: test -z "$(git status --porcelain)"
