name: quill-outcome-funnel-truth

on:
  push:
    branches:
      - astra/quill-outcome-funnel-truth-20260908

permissions:
  contents: write

concurrency:
  group: quill-outcome-funnel-truth
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[quill-outcome-funnel-fixed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile compiled truth
        run: python .github/quill_outcome_funnel_repair.py

      - name: Execute outcome-commerce contracts
        run: |
          python -W error -m unittest -v test_outcome_commerce.py
          python -m json.tool revenue/outcome_commerce/catalog.json >/dev/null

      - name: Publish tested candidate
        run: |
          set -euo pipefail
          rm -f .github/workflows/quill-outcome-funnel-truth.yml
          rm -f .github/quill_outcome_funnel_repair.py
          git add -A .github/workflows/quill-outcome-funnel-truth.yml .github/quill_outcome_funnel_repair.py revenue/outcome_commerce/catalog.json test_outcome_commerce.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[quill-outcome-funnel-fixed] Reconcile outcome-commerce receipt census'
          git push origin HEAD:${GITHUB_REF_NAME}
