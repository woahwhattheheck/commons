name: Astra live-cash contract patch

on:
  push:
    branches:
      - astra/outcome-commerce-live-cash-contract-20260910

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard target paths against main drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE=42583518641ec67bdada02dff5183ee5206cba3f
          drift="$(git diff --name-only "$BASE"..origin/main -- revenue/outcome_commerce/catalog.schema.json revenue/outcome_commerce/catalog.json test_outcome_commerce.py)"
          if [ -n "$drift" ]; then
            echo "target-path drift since implementer base:" >&2
            printf '%s\n' "$drift" >&2
            exit 42
          fi
      - name: Refresh retained source hashes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "7e94f42e9a92e166f614916d63712403f6fc77f7": "e18c2865cf737eb2c76da23012dd0a890ccca202",
              "235c94284c14c179388b5e53b4b9d0f6a8a0dd7d": "7f7d41a94333a72cbd1f641f0c437557f3a95361",
              "258734957efc727f46f6315804b6034487e98896": "e607d3ba7cd24dd542b24a1e8be9e8579d6745ce",
              "b2c54753a82683a70831588366e35114ad644a65": "ec94c5a6113ce6de6fd601f8bd438d5e6b117b2f",
              "4fd23e7a10e90a5c988f3581d77e83b86e212884": "885dd967197935ca69cc25482f52fea09d2c5bc3",
              "62625136a9e5abfe77d9e7afa59e8ee67571b33e": "49cc55559e93595b22bbcef15de6f74ac8e0f3f4",
              "fa4ef433b0b233bb3ddc633c1828957e5d75e453": "6fb73c5837ac37ec7f48cc6efc12cc98797f12d8",
          }

          catalog_path = Path("revenue/outcome_commerce/catalog.json")
          catalog = catalog_path.read_text(encoding="utf-8")
          for old, new in replacements.items():
              count = catalog.count(old)
              if count != 1:
                  raise SystemExit(f"catalog expected exactly one {old}, found {count}")
              catalog = catalog.replace(old, new)
          catalog_path.write_text(catalog, encoding="utf-8")

          test_path = Path("test_outcome_commerce.py")
          test = test_path.read_text(encoding="utf-8")
          marker = "DIAGNOSTIC_SKUS = ("
          prefix, suffix = test.split(marker, 1)
          for old, new in replacements.items():
              count = prefix.count(old)
              if count != 1:
                  raise SystemExit(f"RECORDED_STRIPE_SKUS expected exactly one {old}, found {count}")
              prefix = prefix.replace(old, new)
          test_path.write_text(prefix + marker + suffix, encoding="utf-8")
      - name: Verify exact contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (Path('revenue/outcome_commerce/catalog.schema.json'), Path('revenue/outcome_commerce/catalog.json')):
              json.loads(path.read_text(encoding='utf-8'))
          schema = json.loads(Path('revenue/outcome_commerce/catalog.schema.json').read_text(encoding='utf-8'))
          live = schema['properties']['live_cash']
          assert live == {'$ref': '#/$defs/live_cash'}
          product = schema['$defs']['live_cash_product']
          assert product['additionalProperties'] is False
          assert product['required'] == ['name', 'price_usd', 'path']
          assert product['properties']['price_usd'] == {'type': 'integer', 'minimum': 1}
          assert schema['$defs']['live_cash']['additionalProperties'] is False
          PY
          python -m py_compile test_outcome_commerce.py
          python -W error -m unittest -q test_outcome_commerce.py
          git diff --check
          changed="$(git diff --name-only HEAD -- revenue/outcome_commerce/catalog.schema.json revenue/outcome_commerce/catalog.json test_outcome_commerce.py)"
          printf '%s\n' "$changed"
      - name: Commit verified three-path repair and remove transient runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "commons-board"
          git config user.email "commons-board@users.noreply.github.com"
          git add revenue/outcome_commerce/catalog.schema.json revenue/outcome_commerce/catalog.json test_outcome_commerce.py
          git rm .github/workflows/astra-live-cash-patch.yml
          git diff --cached --check
          git commit -m "fix(outcome-commerce): refresh live-cash contract"
          git push origin HEAD:astra/outcome-commerce-live-cash-contract-20260910
