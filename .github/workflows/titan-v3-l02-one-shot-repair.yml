name: titan-v3-l02-one-shot-repair

on:
  push:
    branches:
      - sol/titan-v3-l02-ledger-tranche-20260909-01
    paths:
      - '.github/workflows/titan-v3-l02-one-shot-repair.yml'

permissions:
  contents: write

concurrency:
  group: titan-v3-l02-one-shot-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/titan-v3-l02-ledger-tranche-20260909-01
          fetch-depth: 1

      - name: Apply exact repair, prove contracts, and remove carrier
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/l02-repair.patch
          git apply --check /tmp/l02-repair.patch
          git apply /tmp/l02-repair.patch
          cd revenue/kaggriculture/cloud-execution-lab/candidates/v3-l02-ledger-tranche
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_ledger_tranche.py test_panel.py
          python3 -m py_compile candidate.py ledger_tranche.py run_panel.py test_ledger_tranche.py test_panel.py
          cd ../../../../..
          python3 revenue/kaggriculture/cloud-execution-lab/build_integrated.py --check
          git diff --check
          git rm .github/workflows/titan-v3-l02-one-shot-repair.yml
          git config user.name 'SOL-MOMENTUM'
          git config user.email 'tokenjunkielabs@gmail.com'
          git add revenue/kaggriculture/cloud-execution-lab/candidates/v3-l02-ledger-tranche/README.md \
                  revenue/kaggriculture/cloud-execution-lab/candidates/v3-l02-ledger-tranche/run_panel.py \
                  revenue/kaggriculture/cloud-execution-lab/candidates/v3-l02-ledger-tranche/test_panel.py
          git commit -m 'titan: repair L02 isolated-worker source path'
          git push origin HEAD:sol/titan-v3-l02-ledger-tranche-20260909-01
