name: titan-v4-trust-root

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - titan/v4-20260911

# This job is the external trust root for the candidate-controlled pull_request
# workflow. It must never execute, source, import, or checkout PR HEAD code.
# Deliberately do not use a paths filter: workflow relevance is a trust decision,
# and GitHub may cap pull-request path-diff evaluation on very large changes.
permissions:
  contents: read

concurrency:
  group: titan-v4-trust-root-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workflow-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # Pin actions/checkout v4 by exact commit. Explicitly checkout trusted main,
      # never the pull-request head or merge ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-v4-trust-root.yml

      - name: Authenticate candidate workflow as Git data only
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKFLOW: .github/workflows/titan-v4-plumbing.yml
          # Frozen candidate-side evidence workflow. Upgrading this digest is a
          # deliberate trusted-main control-plane change, never a V4 PR change.
          APPROVED_WORKFLOW_BLOB: 2a1800c02d2a4c11293bdccc7914ab8f6fd93321
        run: |
          set -euo pipefail

          # Fetch PR/base commits into the object database only. Do not checkout
          # either commit and do not run any file obtained from either commit.
          git fetch --no-tags --filter=blob:none origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/titan-v4-candidate"
          CANDIDATE_SHA="$(git rev-parse refs/remotes/origin/titan-v4-candidate^{commit})"
          if [[ "$CANDIDATE_SHA" != "$HEAD_SHA" ]]; then
            echo "candidate ref/SHA mismatch: expected=$HEAD_SHA observed=$CANDIDATE_SHA" >&2
            exit 1
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none origin "$BASE_SHA"
          fi
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "refusing diverged V4 candidate: BASE_SHA is not an ancestor of HEAD_SHA" >&2
            exit 1
          fi

          entry="$(git ls-tree "$HEAD_SHA" -- "$WORKFLOW")"
          if [[ -z "$entry" ]]; then
            echo "candidate is missing $WORKFLOW" >&2
            exit 1
          fi
          read -r mode type object path <<<"$entry"
          if [[ "$mode" != "100644" || "$type" != "blob" || \
                "$path" != "$WORKFLOW" || -z "$object" ]]; then
            echo "candidate workflow must be one ordinary 100644 Git blob" >&2
            printf 'mode=%q type=%q object=%q path=%q\n' \
              "$mode" "$type" "$object" "$path" >&2
            exit 1
          fi
          if [[ "$object" != "$APPROVED_WORKFLOW_BLOB" ]]; then
            echo "candidate changed frozen Titan-V4 workflow authority" >&2
            echo "expected_blob=$APPROVED_WORKFLOW_BLOB observed_blob=$object" >&2
            exit 1
          fi

          echo "TITAN V4 TRUST ROOT OK head=$HEAD_SHA workflow_blob=$object"
