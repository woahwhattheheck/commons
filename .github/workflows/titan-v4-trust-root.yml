name: titan-v4-trust-root

# APPROVED_WORKFLOW_BLOB: 2a1800c02d2a4c11293bdccc7914ab8f6fd93321
# Git-data-only pin. Trusted checkout is main. Never execute PR HEAD.

on:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Pin candidate workflow blob as Git data only
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          APPROVED_WORKFLOW_BLOB: 2a1800c02d2a4c11293bdccc7914ab8f6fd93321
        run: |
          set -euo pipefail
          python3 host/titan_v4_trust_root.py \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --approved "$APPROVED_WORKFLOW_BLOB"
