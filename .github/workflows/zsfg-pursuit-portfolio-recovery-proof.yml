name: zsfg-pursuit-portfolio-recovery-proof
on:
  push:
    branches:
      - "zsfg-h7n2/pursuit-portfolio-trust-root-recovery-20260914"
permissions:
  contents: read
jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused pursuit-portfolio suite
        run: python -m unittest -v test_pursuit_portfolio.py test_pursuit_portfolio_current.py test_pursuit_portfolio_host.py test_pursuit_portfolio_host_root.py
      - name: Optimized-mode suite
        run: python -O -m unittest -v test_pursuit_portfolio.py test_pursuit_portfolio_current.py test_pursuit_portfolio_host.py test_pursuit_portfolio_host_root.py
      - name: Syntax proof
        run: python -m py_compile revenue/pursuit_portfolio/core.py revenue/pursuit_portfolio/core_v2.py revenue/pursuit_portfolio/current.py revenue/pursuit_portfolio/floor.py revenue/pursuit_portfolio/host.py revenue/pursuit_portfolio/publisher.py revenue/pursuit_portfolio/cli.py test_pursuit_portfolio.py test_pursuit_portfolio_current.py test_pursuit_portfolio_host.py test_pursuit_portfolio_host_root.py
