name: Mapping Equity carrier

on:
  push:
    paths:
      - 'revenue/bias-bounty-mapping-equity/**'
      - '.github/workflows/mapping-equity-carrier.yml'
  pull_request:
    paths:
      - 'revenue/bias-bounty-mapping-equity/**'
      - '.github/workflows/mapping-equity-carrier.yml'

permissions:
  contents: read

concurrency:
  group: mapping-equity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          revenue/bias-bounty-mapping-equity/mapping_equity.py
          revenue/bias-bounty-mapping-equity/mapping_equity_aggregate.py
          revenue/bias-bounty-mapping-equity/test_mapping_equity.py
          revenue/bias-bounty-mapping-equity/test_mapping_equity_aggregate.py
      - name: Deterministic aggregation plan
        working-directory: revenue/bias-bounty-mapping-equity
        run: python mapping_equity_aggregate.py plan | python -m json.tool >/dev/null
      - name: Normal hostile suite
        working-directory: revenue/bias-bounty-mapping-equity
        run: python -m unittest -v test_mapping_equity.py test_mapping_equity_aggregate.py
      - name: Optimized hostile suite
        working-directory: revenue/bias-bounty-mapping-equity
        run: python -O -m unittest -v test_mapping_equity.py test_mapping_equity_aggregate.py
