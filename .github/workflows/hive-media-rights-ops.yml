name: hive-media-rights-ops
on:
  pull_request:
    paths:
      - 'revenue/hive/media-rights-ops/**'
      - '.github/workflows/hive-media-rights-ops.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/hive/media-rights-ops/**'
      - '.github/workflows/hive-media-rights-ops.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        working-directory: revenue/hive/media-rights-ops
        run: python -m py_compile rights_model.py rights_store.py rights_export.py rights_http.py rights_ops.py test_rights_ops.py
      - name: Tests
        working-directory: revenue/hive/media-rights-ops
        run: |
          python -m unittest -v test_rights_ops.py
          python -O -m unittest -v test_rights_ops.py
      - name: CLI smoke
        working-directory: revenue/hive/media-rights-ops
        run: |
          tmp="$(mktemp -d)"
          python rights_ops.py import "$tmp/desk.sqlite3" example_manifest.json --at 2026-09-15T06:00:00Z
          printf '%s\n' '{"asset_id":"cut-a-15s","channel":"instagram","territory":"US","starts_at":"2026-10-01T12:00:00Z","ends_at":"2026-10-15T12:00:00Z"}' > "$tmp/intent.json"
          python rights_ops.py evaluate "$tmp/desk.sqlite3" "$tmp/intent.json" | grep READY_ON_SUPPLIED_AUTHORITY
          python rights_ops.py export "$tmp/desk.sqlite3" "$tmp/bundle" --as-of 2026-12-10T00:00:00Z --horizon-days 30
          test -s "$tmp/bundle/receipt.json"
