name: TITAN V3 P07 cardinality rescue

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/**'
      - '.github/workflows/titan-v3-p07-cardinality-rescue-sol-atlas.yml'
  workflow_dispatch:

concurrency:
  group: titan-v3-p07-cardinality-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run exact contracts
        shell: bash
        run: |
          set -euo pipefail
          DIR=revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas
          python3 -m py_compile "$DIR"/*.py
          python3 -m unittest discover -s "$DIR" -p 'test_*.py' -v
      - name: Render nonpublishing candidate archive
        shell: bash
        run: |
          set -euo pipefail
          DIR=revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas
          python3 "$DIR/build_candidate.py" \
            --output /tmp/titan-v3-p07-cardinality-rescue.tar.gz \
            --manifest-output /tmp/titan-v3-p07-source.json \
            --receipt-output /tmp/titan-v3-p07-receipt.json
          sha256sum /tmp/titan-v3-p07-cardinality-rescue.tar.gz
          python3 - <<'PY'
          import json, tarfile
          receipt=json.load(open('/tmp/titan-v3-p07-receipt.json'))
          assert receipt['canonical_publication_mutated'] is False
          assert receipt['candidate_id']=='titan-v3-p07-cardinality-rescue-20260910-01'
          with tarfile.open('/tmp/titan-v3-p07-cardinality-rescue.tar.gz','r:gz') as archive:
              assert {'main.py','TITAN-CONFIG.json','SOURCE.json','mechanics.py'} <= set(archive.getnames())
          PY
          git diff --exit-code -- \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json
