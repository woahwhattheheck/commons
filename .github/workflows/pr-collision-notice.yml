name: pr-collision-notice

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-collision-notice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target may write a comment, so execute only trusted
      # default-branch listener code. Never execute PR head. Base SHA still
      # supplies wake_jobs for the target branch.
      - name: checkout trusted listener from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            pr_collision_notice.py
          sparse-checkout-cone-mode: false
          path: listener
      - name: checkout target-branch wake jobs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            wake_jobs
          sparse-checkout-cone-mode: false
      - name: compare exact paths and update advisory notice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 listener/pr_collision_notice.py
