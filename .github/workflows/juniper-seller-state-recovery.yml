name: juniper-seller-state-recovery

on:
  push:
    branches:
      - codex/juniper-seller-state-recovery-20260908

permissions:
  contents: write

concurrency:
  group: juniper-seller-state-recovery
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[seller-state-recovery-published]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          lab=revenue/kaggriculture/cloud-execution-lab
          test "$(sha256sum "$lab/titan_runtime.py" | awk '{print $1}')" = 001ce55c72d02571b6b80291c3a2fec6061f6a3243093fd8e0b4dd29f08c4d6c
          test "$(git hash-object "$lab/build_integrated.py")" = 4fd185005d8d8125e77d8e288977d15047c38fc7
          test "$(sha256sum "$lab/test_seller_state_recovery.py" | awk '{print $1}')" = 06af343c810df30bc06c5e7fd502612ae248e733bfa4343039dd1f1bc36b5705
          test "$(sha256sum "$lab/recovery-checks/seller-state/PRODUCTION-RECOVERY.md" | awk '{print $1}')" = addfd4211194325d36a31393f97a99d7afb54bc14f10d635f30b85574951fc61
          test "$(sha256sum "$lab/recovery-checks/seller-state/PRODUCTION-RECOVERY.json" | awk '{print $1}')" = 98ffd85348102b0fdcff8ecc3200acb60d8b6a52ad635e63ccdd844ba9053516
          test "$(sha256sum "$lab/exports/titan-current.tar.gz" | awk '{print $1}')" = f623c088765301872123697db250b10651d3027cb347b5a05ceb7b7eb270f279
          test "$(wc -c < "$lab/exports/titan-current.tar.gz")" = 290697

      - name: Add completed seller checkpoint and package test
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('revenue/kaggriculture/cloud-execution-lab/titan_runtime.py')
          text = runtime.read_text()

          def replace_once(before, after):
              global text
              assert text.count(before) == 1, before[:80]
              text = text.replace(before, after)

          replace_once(
              "        self._completed_route = None\n\n    def _initialize(self):\n",
              "        self._completed_route = None\n"
              "        # Last seller state paired with an action that actually returned.\n"
              "        # The observation is queued only when a later selected action becomes\n"
              "        # the deadline fallback before its seller transform completes.\n"
              "        self._completed_seller_state = None\n"
              "        self._seller_recovery_observation = None\n\n"
              "    def _initialize(self):\n",
          )
          replace_once(
              "        if self._completed_route is not None:\n"
              "            self.controller.cur = self._completed_route\n"
              "        self.ready = True\n\n"
              "    def _seed_selected(self, obs, cfg, selected):\n",
              "        if self._completed_route is not None:\n"
              "            self.controller.cur = self._completed_route\n"
              "        if (f.consumer == 'frozen' and self._completed_seller_state is not None\n"
              "                and self._seller_recovery_observation is not None):\n"
              "            for name, value in self._completed_seller_state.items():\n"
              "                setattr(self.consumer, name, deepcopy(value))\n"
              "            skipped = deepcopy(self._seller_recovery_observation)\n"
              "            self.consumer.observe(skipped)\n"
              "            self.consumer.previous = skipped\n"
              "            self._seller_recovery_observation = None\n"
              "        self.ready = True\n\n"
              "    def _seller_checkpoint(self):\n"
              "        \"\"\"Detach only completed frozen-seller state needed after recovery.\"\"\"\n"
              "        if self.features.consumer != 'frozen' or self.history is not None:\n"
              "            return None\n"
              "        return {\n"
              "            'planned': deepcopy(self.consumer.planned),\n"
              "            'pending': deepcopy(self.consumer.pending),\n"
              "            'previous': self.consumer.previous,\n"
              "            'observed_harvests': deepcopy(self.consumer.observed_harvests),\n"
              "        }\n\n"
              "    def _seed_selected(self, obs, cfg, selected):\n",
          )
          replace_once(
              "        selected_checkpoint = None\n"
              "        stage = 'cold_start'\n",
              "        selected_checkpoint = None\n"
              "        seller_checkpoint = None\n"
              "        stage = 'cold_start'\n",
          )
          replace_once(
              "                stage = 'selected_transform'\n"
              "                output = self.transform_selected(obs, cfg, selected)\n"
              "                if self.history is not None:\n",
              "                stage = 'selected_transform'\n"
              "                output = self.transform_selected(obs, cfg, selected)\n"
              "                seller_checkpoint = self._seller_checkpoint()\n"
              "                if self.history is not None:\n",
          )
          replace_once(
              "                self._completed_route = selected_checkpoint[1]\n"
              "                self.diagnostics.update(status='completed', elapsed_seconds=time.perf_counter()-started,\n",
              "                self._completed_route = selected_checkpoint[1]\n"
              "                if seller_checkpoint is not None:\n"
              "                    self._completed_seller_state = seller_checkpoint\n"
              "                    self._seller_recovery_observation = None\n"
              "                self.diagnostics.update(status='completed', elapsed_seconds=time.perf_counter()-started,\n",
          )
          replace_once(
              "            if selected_checkpoint is not None and fallback is selected_checkpoint[0]:\n"
              "                self._completed_route = selected_checkpoint[1]\n"
              "            if self.history is not None:\n",
              "            if selected_checkpoint is not None and fallback is selected_checkpoint[0]:\n"
              "                self._completed_route = selected_checkpoint[1]\n"
              "                if (self.features.consumer == 'frozen' and self.history is None\n"
              "                        and self._completed_seller_state is not None):\n"
              "                    self._seller_recovery_observation = deepcopy(obs)\n"
              "            if self.history is not None:\n",
          )
          runtime.write_text(text)

          builder = Path('revenue/kaggriculture/cloud-execution-lab/build_integrated.py')
          text = builder.read_text()
          before = "'test_seed_derived.py','test_route_recovery.py','test_ordered_selected_sell.py'"
          after = "'test_seed_derived.py','test_route_recovery.py','test_seller_state_recovery.py','test_ordered_selected_sell.py'"
          assert text.count(before) == 1
          builder.write_text(text.replace(before, after))

      - name: Verify patched source identities
        shell: bash
        run: |
          set -euo pipefail
          lab=revenue/kaggriculture/cloud-execution-lab
          test "$(sha256sum "$lab/titan_runtime.py" | awk '{print $1}')" = d693e8663ea7691b7ecaf373cc2fe8273174292eb5bb03ea63762d338f0fbbf1
          test "$(sha256sum "$lab/build_integrated.py" | awk '{print $1}')" = 1d4c481465eb61b36ea0339773aab419ad4aeb4a92dc8d437e7fa56ffa4084ef
          python3 -m py_compile "$lab/titan_runtime.py" "$lab/test_seller_state_recovery.py" "$lab/build_integrated.py"
          git diff --check
          git add "$lab/titan_runtime.py" "$lab/build_integrated.py"

      - name: Run focused source tests
        shell: bash
        run: |
          set -euo pipefail
          lab=revenue/kaggriculture/cloud-execution-lab
          cd "$lab"
          python3 -B test_seller_state_recovery.py
          python3 -B test_worker_deadline.py
          python3 -B test_entrypoint_clock.py
          python3 -B test_module_recovery.py
          python3 -B test_route_recovery.py
          python3 -B test_seed_derived.py
          python3 -B test_terminal_history_join.py
          cd - >/dev/null
          git checkout -- .
          git clean -fd

      - name: Advance and verify the one CURRENT stream
        shell: bash
        run: |
          set -euo pipefail
          lab=revenue/kaggriculture/cloud-execution-lab
          python3 -B "$lab/build_integrated.py" > /tmp/build.json
          python3 -B "$lab/build_integrated.py" --check > /tmp/check.json
          cmp /tmp/build.json /tmp/check.json
          test "$(sha256sum "$lab/exports/titan-current.tar.gz" | awk '{print $1}')" = 687d5297c652ec8f4a793d14fab5b224d8341cb549f7f659153d93fdee451bd1
          test "$(wc -c < "$lab/exports/titan-current.tar.gz")" = 292389
          test "$(sha256sum "$lab/runtime/integrated-selected/CURRENT-SOURCE.json" | awk '{print $1}')" = ecabe7208df8b556958b242a0a6454ed596129143ca37a5425624394c513808a
          test "$(sha256sum "$lab/exports/historical/titan-f623c088765301872123697db250b10651d3027cb347b5a05ceb7b7eb270f279.tar.gz" | awk '{print $1}')" = f623c088765301872123697db250b10651d3027cb347b5a05ceb7b7eb270f279

      - name: Exercise the exact relocated package
        shell: bash
        run: |
          set -euo pipefail
          lab=revenue/kaggriculture/cloud-execution-lab
          mkdir /tmp/titan-package
          tar -xzf "$lab/exports/titan-current.tar.gz" -C /tmp/titan-package
          cd /tmp/titan-package
          export PYTHONPATH=".:checks"
          python3 -B checks/test_seller_state_recovery.py
          python3 -B checks/test_worker_deadline.py
          python3 -B checks/test_entrypoint_clock.py
          python3 -B checks/test_module_recovery.py
          python3 -B checks/test_route_recovery.py
          python3 -B checks/test_seed_derived.py
          python3 -B checks/test_terminal_history_join.py

      - name: Verify package bindings and write receipt
        shell: python
        run: |
          import hashlib, json, tarfile
          from pathlib import Path

          lab = Path('revenue/kaggriculture/cloud-execution-lab')
          archive = lab / 'exports/titan-current.tar.gz'
          manifest = lab / 'runtime/integrated-selected/CURRENT-SOURCE.json'
          pointer = json.loads((lab / 'runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())
          runtime = (lab / 'titan_runtime.py').read_bytes()
          test = (lab / 'test_seller_state_recovery.py').read_bytes()
          assert pointer['sha256'] == hashlib.sha256(archive.read_bytes()).hexdigest()
          assert pointer['bytes'] == 292389
          assert pointer['runtime_files'] == 79
          assert pointer['source_manifest_sha256'] == hashlib.sha256(manifest.read_bytes()).hexdigest()
          source = json.loads(manifest.read_text())
          assert source['runtime']['titan_runtime.py']['sha256'] == hashlib.sha256(runtime).hexdigest()
          assert source['runtime']['checks/test_seller_state_recovery.py']['sha256'] == hashlib.sha256(test).hexdigest()
          with tarfile.open(archive, 'r:gz') as tf:
              assert tf.extractfile('titan_runtime.py').read() == runtime
              assert tf.extractfile('checks/test_seller_state_recovery.py').read() == test
              assert hashlib.sha256(tf.extractfile('SOURCE.json').read()).hexdigest() == pointer['source_manifest_sha256']
          old = lab / 'exports/historical/titan-f623c088765301872123697db250b10651d3027cb347b5a05ceb7b7eb270f279.tar.gz'
          assert len(old.read_bytes()) == 290697
          lines = [
              '# TITAN completed seller-state recovery',
              '',
              'A timer-owned fallback that already has a complete selected action now preserves only the prior completed frozen-seller checkpoint, then observes the skipped public input once after fresh reconstruction. Interrupted production and first-call cancellation remain fresh.',
              '',
              '- previous CURRENT: `f623c088765301872123697db250b10651d3027cb347b5a05ceb7b7eb270f279` (290,697 bytes / 78 files)',
              f'- current CURRENT: `{pointer["sha256"]}` ({pointer["bytes"]} bytes / {pointer["runtime_files"]} files)',
              f'- source manifest: `{pointer["source_manifest_sha256"]}`',
              f'- runtime SHA-256: `{hashlib.sha256(runtime).hexdigest()}`',
              f'- new test SHA-256: `{hashlib.sha256(test).hexdigest()}`',
              '',
              'Executed: six new focused methods; 25 existing worker, entry-clock, module, route, seed and history methods; the same set from the relocated archive; deterministic builder/`--check`; packaged member and historical-archive identity.',
              '',
              'Retained-input evidence covers three positive step-450 cancellation boundaries and the step-447 interrupted-replanning negative. Three uninjected pairs match 2,154 actions and tracked seller states. No game, engine replay, seed, policy/default change, speed claim, provider upload or submission.',
          ]
          Path('p/juniper-seller-state-recovery-20260908-01.md').write_text('\n'.join(lines) + '\n')

      - name: Publish source and generated package
        shell: bash
        run: |
          set -euo pipefail
          lab=revenue/kaggriculture/cloud-execution-lab
          rm -f .github/workflows/juniper-seller-state-recovery.yml
          rm -f .juniper-seller-state-recovery-trigger
          git add -A \
            .github/workflows/juniper-seller-state-recovery.yml \
            .juniper-seller-state-recovery-trigger \
            "$lab/titan_runtime.py" \
            "$lab/build_integrated.py" \
            "$lab/test_seller_state_recovery.py" \
            "$lab/recovery-checks/seller-state/PRODUCTION-RECOVERY.md" \
            "$lab/recovery-checks/seller-state/PRODUCTION-RECOVERY.json" \
            "$lab/exports/titan-current.tar.gz" \
            "$lab/exports/historical" \
            "$lab/runtime/integrated-selected/CURRENT-SOURCE.json" \
            "$lab/runtime/integrated-selected/CURRENT-ARCHIVE.json" \
            p/juniper-seller-state-recovery-20260908-01.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[seller-state-recovery-published] Preserve completed frozen seller state'
          git push origin HEAD:${GITHUB_REF_NAME}
