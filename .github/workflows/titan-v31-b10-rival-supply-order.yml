name: TITAN V3.1 B10 rival supply SELL order

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v31-b10-rival-supply-order.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order/**"
  push:
    branches:
      - astra/v31-b10-rival-supply-order-20260911
      - astra/v31-b10-exec-prefix-custody-repair-20260911

permissions:
  contents: read

concurrency:
  group: titan-v31-b10-rival-supply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CASE: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order
      R04: revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py
      ENGINE: revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py
      EXPECTED_R04_BLOB: 21c4f1db0298f8955b1f5ad366bd780a89cad206
      EXPECTED_ENGINE_BLOB: 3c202c7ee921da239356789e266b694635103fc4
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout literal head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact frozen scope and source dependencies
        shell: bash
        run: |
          set -euo pipefail
          BASE=508b342fc46fa91e3d7cdc3f0b7e44934a187c14
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "HEAD:$R04")" = "$EXPECTED_R04_BLOB"
          test "$(git rev-parse "HEAD:$ENGINE")" = "$EXPECTED_ENGINE_BLOB"
          python - <<'PY'
          import subprocess
          base = '508b342fc46fa91e3d7cdc3f0b7e44934a187c14'
          expected = {
              '.github/workflows/titan-v31-b10-rival-supply-order.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order/README.md',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order/candidate.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order/test_candidate.py',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected B10 scope: {sorted(actual)}')
          print('B10_SCOPE_OK', len(actual))
          PY
          git diff --check
          test -z "$(git status --short)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and run focused predecessor suite
        working-directory: ${{ env.CASE }}
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile candidate.py test_candidate.py
          python -B -m unittest -v test_candidate.py 2>&1 | tee "$RUNNER_TEMP/B10-TEST.log"
          grep -E '^Ran 18 tests in [0-9.]+s$' "$RUNNER_TEMP/B10-TEST.log"
          grep -Fx 'OK' "$RUNNER_TEMP/B10-TEST.log"
          ! grep -E 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/B10-TEST.log"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --short)"

      - name: Upload source-contract receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v31-b10-rival-supply-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/B10-TEST.log
