name: titan-e13-funded-prefix-vm

on:
  push:
    branches:
      - sol/e13-funded-prefix-20260909-01

permissions:
  contents: write

concurrency:
  group: titan-e13-funded-prefix-vm
  cancel-in-progress: false

jobs:
  e13:
    if: ${{ !contains(github.event.head_commit.message, '[e13-vm-artifacts]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      LAB: revenue/kaggriculture/cloud-execution-lab
      RESULTS: revenue/kaggriculture/cloud-execution-lab/results/e13-funded-prefix-20260909
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Record immutable inputs and VM
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          cp "$LAB/exports/titan-current.tar.gz" "$RUNNER_TEMP/e13-baseline.tar.gz"
          {
            echo "operation=op:titan-v25-orders-20260909-E13"
            echo "branch=${GITHUB_REF_NAME}"
            echo "head=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "python=$(python3 --version 2>&1)"
            echo "uname=$(uname -a)"
            echo "cpu_count=$(getconf _NPROCESSORS_ONLN)"
            echo "mem_kib=$(awk '/MemTotal/{print $2}' /proc/meminfo)"
            echo "baseline_sha256=$(sha256sum "$RUNNER_TEMP/e13-baseline.tar.gz" | awk '{print $1}')"
            echo "baseline_bytes=$(stat -c %s "$RUNNER_TEMP/e13-baseline.tar.gz")"
            echo "engine_sha256=$(sha256sum "$LAB/reference/engine/kaggriculture.py" | awk '{print $1}')"
          } | tee "$RESULTS/VM-RECEIPT.txt"

      - name: Apply bounded E13 source patch
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          python3 -B e13_patch.py | tee "results/e13-funded-prefix-20260909/PATCH.log"
          python3 -m py_compile frozen_selected.py test_funded_prefix.py

      - name: Focused E13 and adjacent regressions
        id: tests
        continue-on-error: true
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -o pipefail
          python3 -B -m unittest -v \
            test_funded_prefix \
            test_scheduler \
            test_joint_market_slots \
            test_funded_payback_runtime \
            2>&1 | tee "results/e13-funded-prefix-20260909/TESTS.log"

      - name: Rebuild deterministic current release
        id: build
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -o pipefail
          python3 -B build_integrated.py 2>&1 | tee "results/e13-funded-prefix-20260909/BUILD.log"
          python3 -B build_integrated.py --check 2>&1 | tee -a "results/e13-funded-prefix-20260909/BUILD.log"
          sha256sum exports/titan-current.tar.gz runtime/integrated-selected/CURRENT-SOURCE.json runtime/integrated-selected/CURRENT-ARCHIVE.json \
            | tee "results/e13-funded-prefix-20260909/RELEASE-SHA256.txt"

      - name: Prepare exact baseline and E13 packages
        id: prep
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e13-baseline" "$RUNNER_TEMP/e13-candidate"
          tar -xzf "$RUNNER_TEMP/e13-baseline.tar.gz" -C "$RUNNER_TEMP/e13-baseline"
          tar -xzf "$LAB/exports/titan-current.tar.gz" -C "$RUNNER_TEMP/e13-candidate"
          test -f "$RUNNER_TEMP/e13-baseline/main.py"
          test -f "$RUNNER_TEMP/e13-candidate/main.py"
          printf 'candidate_sha256=%s\ncandidate_bytes=%s\n' \
            "$(sha256sum "$LAB/exports/titan-current.tar.gz" | awk '{print $1}')" \
            "$(stat -c %s "$LAB/exports/titan-current.tar.gz")" \
            | tee -a "$RESULTS/VM-RECEIPT.txt"

      - name: Canonical matched 64-game first screen
        id: baseline
        if: steps.prep.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -B "$LAB/reference/evaluator/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$LAB/reference/evaluator/loader.py" \
            --candidate "$RUNNER_TEMP/e13-baseline/main.py::agent" \
            --seeds '2027,6607,17011,104729,271828,314159,424242,8675309' \
            --output "$RESULTS/baseline-64.json" \
            2>&1 | tee "$RESULTS/baseline-64.log"

      - name: E13 matched 64-game first screen
        id: candidate
        if: steps.prep.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -B "$LAB/reference/evaluator/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$LAB/reference/evaluator/loader.py" \
            --candidate "$RUNNER_TEMP/e13-candidate/main.py::agent" \
            --seeds '2027,6607,17011,104729,271828,314159,424242,8675309' \
            --output "$RESULTS/e13-64.json" \
            2>&1 | tee "$RESULTS/e13-64.log"

      - name: Summarize matched evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, math, os, pathlib, statistics
          root=pathlib.Path(os.environ['RESULTS'])
          out={'operation':'op:titan-v25-orders-20260909-E13'}
          def load(name):
              p=root/name
              return json.loads(p.read_text()) if p.exists() else None
          b=load('baseline-64.json'); c=load('e13-64.json')
          out['baseline_present']=b is not None; out['candidate_present']=c is not None
          if b and c:
              def key(g): return (g['opponent'],g['seed'],g['candidate_seat'])
              bm={key(g):g for g in b['games']}; cm={key(g):g for g in c['games']}
              pairs=[]
              for k in sorted(set(bm)&set(cm)):
                  x,y=bm[k],cm[k]
                  row={'opponent':k[0],'seed':k[1],'seat':k[2],
                       'baseline_status':x['status'],'candidate_status':y['status'],
                       'same_trace':x.get('trace_sha256')==y.get('trace_sha256')}
                  if x['status']=='complete' and y['status']=='complete':
                      s=k[2]
                      row['baseline_margin']=x['scores'][s]-x['scores'][1-s]
                      row['candidate_margin']=y['scores'][s]-y['scores'][1-s]
                      row['margin_delta']=row['candidate_margin']-row['baseline_margin']
                      row['baseline_terminal_cash']=x['bank_snapshot'][s]
                      row['candidate_terminal_cash']=y['bank_snapshot'][s]
                      row['terminal_cash_delta']=row['candidate_terminal_cash']-row['baseline_terminal_cash']
                      daily=[d['bank'][s] for d in y.get('daily_bank',[])]
                      row['candidate_mean_daily_bank']=statistics.mean(daily) if daily else None
                  pairs.append(row)
              complete=[r for r in pairs if 'margin_delta' in r]
              margins=[r['margin_delta'] for r in complete]
              cash=[r['terminal_cash_delta'] for r in complete]
              daily=[r['candidate_mean_daily_bank'] for r in complete if r['candidate_mean_daily_bank'] is not None]
              candidate_games=[g for g in c['games'] if g['status']=='complete']
              cand_margins=[g['scores'][g['candidate_seat']]-g['scores'][1-g['candidate_seat']] for g in candidate_games]
              def p10(vals):
                  if not vals:return None
                  vals=sorted(vals);return vals[max(0,math.ceil(len(vals)*0.10)-1)]
              out.update(
                  scheduled_pairs=len(pairs),complete_pairs=len(complete),
                  changed_games=sum(not r['same_trace'] for r in pairs),
                  candidate_wins=sum(v>0 for v in cand_margins),
                  candidate_ties=sum(v==0 for v in cand_margins),
                  candidate_losses=sum(v<0 for v in cand_margins),
                  mean_margin_delta=statistics.mean(margins) if margins else None,
                  p10_margin_delta=p10(margins),min_margin_delta=min(margins) if margins else None,
                  mean_terminal_cash_delta=statistics.mean(cash) if cash else None,
                  p10_terminal_cash_delta=p10(cash),min_terminal_cash_delta=min(cash) if cash else None,
                  idle_cash_proxy_mean_daily_bank=statistics.mean(daily) if daily else None,
                  baseline_failures=sum(g['status']!='complete' for g in b['games']),
                  candidate_failures=sum(g['status']!='complete' for g in c['games']),
                  premature_sales='not directly classified by evaluator action tape; exact behavioral no-op/delta is changed_games plus targeted funded-prefix regressions',
                  failed_useful_acquisitions='guarded by baseline-relative acquisition certificate and focused regressions; not directly classified in tournament report')
              out['pairs']=pairs
          (root/'SUMMARY.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='pairs'},indent=2))
          PY
          {
            echo "tests=${{ steps.tests.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "prepare=${{ steps.prep.outcome }}"
            echo "baseline_panel=${{ steps.baseline.outcome }}"
            echo "candidate_panel=${{ steps.candidate.outcome }}"
          } | tee "$RESULTS/STEP-STATUS.txt"

      - name: Commit VM artifacts and remove one-shot machinery
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'commons-sol-e13-vm'
          git config user.email 'tokenjunkielabs@gmail.com'
          git rm --ignore-unmatch .github/workflows/titan-e13-vm.yml "$LAB/e13_patch.py"
          git add "$LAB/frozen_selected.py" \
                  "$LAB/exports/titan-current.tar.gz" \
                  "$LAB/exports/historical" \
                  "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" \
                  "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json" \
                  "$RESULTS"
          git commit -m 'E13 VM evidence and deterministic release [e13-vm-artifacts]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail receipt when a required gate failed
        if: always()
        run: |
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.prep.outcome }}' = success
          test '${{ steps.baseline.outcome }}' = success
          test '${{ steps.candidate.outcome }}' = success
