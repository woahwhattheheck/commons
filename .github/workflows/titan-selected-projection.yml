name: titan-selected-projection

on:
  pull_request:
    paths:
      - '.github/workflows/titan-selected-projection.yml'
      - 'revenue/kaggriculture/cloud-selected-projection/**'
      - 'revenue/kaggriculture/cloud-selected-market-checks/**'
      - 'revenue/kaggriculture/cloud-eval/**'
      - 'revenue/kaggriculture/20260907-offline-agent/**'
      - 'revenue/kaggriculture/cloud-execution-lab/**'
      - 'revenue/kaggriculture/cloud-execution-lab/integrated_selected.py'
      - 'revenue/kaggriculture/cloud-integration-differentials/**'
      - 'revenue/kaggriculture/cloud-composition-cases/cypress/**'
      - 'revenue/kaggriculture/cloud-composition-cases/cover/**'
      - 'revenue/kaggriculture/cloud-economic-stress/deadline_adapter.py'
      - 'revenue/kaggriculture/cloud-economic-stress/test_runner.py'
      - 'revenue/kaggriculture/cloud-economic-stress/runner.py'
      - 'revenue/kaggriculture/cloud-economic-stress/test_runner_guard_join.py'
      - 'revenue/kaggriculture/cloud-economic-stress/test_caller_handler.py'
      - 'revenue/kaggriculture/cloud-economic-stress/cancellation/**'
      - 'revenue/kaggriculture/cloud-economic-stress/funded_payback/**'
      - 'revenue/kaggriculture/cloud-quickstep/**'
      - 'revenue/kaggriculture/cloud-runtime-pulse/**'
      - 'revenue/kaggriculture/cloud-committed-seed-retry/**'
      - 'revenue/kaggriculture/cloud-opponent-league/lark-responsive/**'
      - 'revenue/kaggriculture/cloud-market-game-theory/adaptive/runtime.py'
      - 'revenue/kaggriculture/cloud-market-game-theory/adaptive/test_capture_binding.py'
      - 'revenue/kaggriculture/cloud-market-game-theory/adaptive/context_cases/test_market_context.py'
      - 'revenue/kaggriculture/cloud-market-game-theory/adaptive/test_lazy_offers.py'
      - 'revenue/kaggriculture/cloud-market-game-theory/selector.py'
      - 'revenue/kaggriculture/cloud-market-game-theory/solver.py'
      - 'revenue/kaggriculture/cloud-full-support/**'
      - 'revenue/kaggriculture/cloud-weighted-plan-selector/**'
      - 'revenue/kaggriculture/cloud-plan-continuation/continuation.py'
      - 'revenue/kaggriculture/cloud-observed-fills/observed_fills.py'
      - 'revenue/kaggriculture/cloud-market-game-theory/adaptive/recourse.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_score_schedule.py'
      - 'revenue/kaggriculture/cloud-execution-lab/selected_action_sell.py'
      - 'revenue/kaggriculture/cloud-execution-lab/ordered_selected_sell.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_ordered_selected_sell.py'
      - 'revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py'
      - 'revenue/kaggriculture/cloud-execution-lab/mechanics.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_selected_action_sell.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_engine_semantics.py'
      - 'revenue/kaggriculture/cloud-execution-lab/reference/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-selected-projection.yml
            /revenue/kaggriculture/cloud-selected-projection/
            /revenue/kaggriculture/cloud-selected-market-checks/
            /revenue/kaggriculture/cloud-eval/
            /revenue/kaggriculture/20260907-offline-agent/
            /revenue/kaggriculture/cloud-execution-lab/integrated_selected.py
            /revenue/kaggriculture/cloud-execution-lab/exports/integrated-selected-v1.tar.gz
            /revenue/kaggriculture/cloud-integration-differentials/
            /revenue/kaggriculture/cloud-composition-cases/cypress/
            /revenue/kaggriculture/cloud-composition-cases/cover/
            /revenue/kaggriculture/cloud-economic-stress/deadline_adapter.py
            /revenue/kaggriculture/cloud-economic-stress/test_runner.py
            /revenue/kaggriculture/cloud-economic-stress/runner.py
            /revenue/kaggriculture/cloud-economic-stress/test_runner_guard_join.py
            /revenue/kaggriculture/cloud-economic-stress/test_caller_handler.py
            /revenue/kaggriculture/cloud-economic-stress/cancellation/
            /revenue/kaggriculture/cloud-runtime-pulse/
            /revenue/kaggriculture/cloud-opponent-league/lark-responsive/
            /revenue/kaggriculture/cloud-market-game-theory/adaptive/runtime.py
            /revenue/kaggriculture/cloud-market-game-theory/adaptive/test_capture_binding.py
            /revenue/kaggriculture/cloud-market-game-theory/adaptive/context_cases/test_market_context.py
            /revenue/kaggriculture/cloud-market-game-theory/adaptive/test_lazy_offers.py
            /revenue/kaggriculture/cloud-market-game-theory/selector.py
            /revenue/kaggriculture/cloud-market-game-theory/solver.py
            /revenue/kaggriculture/cloud-full-support/
            /revenue/kaggriculture/cloud-weighted-plan-selector/
            /revenue/kaggriculture/cloud-plan-continuation/continuation.py
            /revenue/kaggriculture/cloud-observed-fills/observed_fills.py
            /revenue/kaggriculture/cloud-market-game-theory/adaptive/recourse.py
            /revenue/kaggriculture/cloud-execution-lab/test_score_schedule.py
            /revenue/kaggriculture/cloud-execution-lab/reference/integrated-selected/
            /revenue/kaggriculture/cloud-execution-lab/reference/next-panel/vendor/arlene.py
            /revenue/kaggriculture/cloud-execution-lab/selected_action_sell.py
            /revenue/kaggriculture/cloud-execution-lab/ordered_selected_sell.py
            /revenue/kaggriculture/cloud-execution-lab/test_ordered_selected_sell.py
            /revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py
            /revenue/kaggriculture/cloud-execution-lab/mechanics.py
            /revenue/kaggriculture/cloud-execution-lab/test_selected_action_sell.py
            /revenue/kaggriculture/cloud-execution-lab/test_engine_semantics.py
            /revenue/kaggriculture/cloud-execution-lab/reference/evaluator/
            /revenue/kaggriculture/cloud-execution-lab/reference/engine/
            /revenue/kaggriculture/cloud-execution-lab/reference/selected-action/
            /revenue/kaggriculture/cloud-execution-lab/reference/decision/
            /revenue/kaggriculture/cloud-execution-lab/reference/ordered-feasibility/atlas/projection.py
      - name: Record committed test and runtime inputs
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'projection-validation'
          out.mkdir()
          root = Path('revenue/kaggriculture')
          frozen = root/'cloud-execution-lab/exports/integrated-selected-v1.tar.gz'
          frozen_bytes = frozen.read_bytes()
          assert len(frozen_bytes) == 103527
          assert hashlib.sha256(frozen_bytes).hexdigest() == '95c7bf10a20149419e6208e43cdf2bf0728e22fe61b600180eaa1a3fbcc1b153'
          (out/frozen.name).write_bytes(frozen_bytes)
          roots = ('cloud-selected-projection', 'cloud-execution-lab',
                   'cloud-selected-market-checks', 'cloud-eval', '20260907-offline-agent',
                   'cloud-integration-differentials', 'cloud-composition-cases/cypress',
                   'cloud-market-game-theory/adaptive', 'cloud-composition-cases/cover',
                   'cloud-economic-stress', 'cloud-runtime-pulse',
                   'cloud-opponent-league/lark-responsive', 'cloud-full-support',
                   'cloud-weighted-plan-selector',
                   'cloud-plan-continuation', 'cloud-observed-fills')
          paths = [p for name in roots for p in (root/name).rglob('*') if p.is_file()]
          paths.append(root/'cloud-market-game-theory/selector.py')
          paths.append(root/'cloud-market-game-theory/solver.py')
          paths.append(Path('.github/workflows/titan-selected-projection.yml'))
          files = {}
          for path in sorted(paths):
              data = path.read_bytes()
              files[str(path)] = {'size': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                                 'git_blob': hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
          checkout = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert checkout == os.environ['GITHUB_SHA'], 'checkout must match the workflow event commit'
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pull = event.get('pull_request') or {}
          context = {'event': os.environ['GITHUB_EVENT_NAME'], 'event_sha': os.environ['GITHUB_SHA'],
                     'pull_request_head': (pull.get('head') or {}).get('sha'),
                     'pull_request_base': (pull.get('base') or {}).get('sha'),
                     'checkout_semantics': 'pull_request_merge' if pull else 'event_commit'}
          report = {'checkout': checkout, 'source_context': context,
                    'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'python': subprocess.check_output(['python3','--version'], text=True).strip(),
                    'files': files, 'scope': 'focused deterministic tests; no gameplay panels'}
          (out/'SOURCE-SNAPSHOT.json').write_text(json.dumps(report, indent=2)+'\n')
      - name: Existing selected-action SELL interface tests
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest test_selected_action_sell -v 2>&1 | tee "$RUNNER_TEMP/projection-validation/original-seller-tests.log"
      - name: Projection and ordered-transfer consumer tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 revenue/kaggriculture/cloud-selected-projection/test_projection.py \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --engine-loader "$LAB/reference/evaluator/loader.py" \
            --engine-cache "$LAB/reference/engine" \
            --seller "$LAB/selected_action_sell.py" \
            --report "$RUNNER_TEMP/projection-validation/projection-results.json" -v \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/projection-tests.log"
      - name: Existing market-contract consumer tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 revenue/kaggriculture/cloud-selected-market-checks/check_market_contracts.py \
            --lab "$LAB" \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --engine-loader "$LAB/reference/evaluator/loader.py" \
            --engine-cache "$LAB/reference/engine" \
            --json-output "$RUNNER_TEMP/projection-validation/market-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/market-tests.log"
      - name: Explicit and default offline loader binding tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 revenue/kaggriculture/cloud-selected-market-checks/test_engine_binding.py \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --engine-loader "$LAB/reference/evaluator/loader.py" \
            --engine-cache "$LAB/reference/engine" \
            --json-output "$RUNNER_TEMP/projection-validation/loader-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/loader-tests.log"
      - name: Empty-lot selected-action fallback tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB="$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-execution-lab"
          TITAN_SELL_FILE="$LAB/selected_action_sell.py" \
          TITAN_SELL_SUPPORT_DIR="$LAB" \
          TITAN_ENGINE_FILE="$LAB/reference/engine/kaggriculture.py" \
          TITAN_UPSTREAM_DIR="$LAB/reference/engine" \
          python3 revenue/kaggriculture/cloud-selected-market-checks/test_empty_lot.py \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/empty-lot-tests.log"
      - name: Joined ordered selected-action SELL tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest test_ordered_selected_sell -v 2>&1 | tee "$RUNNER_TEMP/projection-validation/joined-wrapper-tests.log"
      - name: Funded seed queue joined integration tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-composition-cases/cypress/test_funded_join.py \
            --json-output "$RUNNER_TEMP/projection-validation/funded-join-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/funded-join-tests.log"
      - name: Adaptive actor capture binding tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-market-game-theory/adaptive/test_capture_binding.py \
            --report "$RUNNER_TEMP/projection-validation/capture-binding-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/capture-binding-tests.log"
      - name: Adaptive economic-context tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 -B revenue/kaggriculture/cloud-market-game-theory/adaptive/context_cases/test_market_context.py \
            --engine "$LAB/reference/engine/kaggriculture.py" \
            --report "$RUNNER_TEMP/projection-validation/adaptive-context-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/adaptive-context-tests.log"
      - name: Adaptive lazy-offer and loader tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-market-game-theory/adaptive/test_lazy_offers.py -v \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/lazy-offers-tests.log"
      - name: Full-support final-pivot budget consumer tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-full-support/test_final_pivot_budget.py \
            --report "$RUNNER_TEMP/projection-validation/final-pivot-budget-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/final-pivot-budget-tests.log"
      - name: Adaptive-context combined-report binding tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-selected-projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v test_adaptive_context_report \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/adaptive-context-reporter-tests.log"
      - name: Dated market score schedule parity tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/test_score_schedule.py -v \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/score-schedule-tests.log"
      - name: Selected-market ledger schedule parity tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 -B revenue/kaggriculture/cloud-selected-market-checks/test_ledger_schedule.py \
            --lab "$LAB" \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --engine-loader "$LAB/reference/evaluator/loader.py" \
            --engine-cache "$LAB/reference/engine" \
            --report "$RUNNER_TEMP/projection-validation/ledger-schedule-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/ledger-schedule-tests.log"
      - name: Deadline cancellation regression tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-economic-stress/cancellation/test_deadline_cancellation.py \
            --report "$RUNNER_TEMP/projection-validation/deadline-cancellation.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/deadline-cancellation-tests.log"
      - name: Caller handler replacement boundary tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-economic-stress/test_caller_handler.py \
            --report "$RUNNER_TEMP/projection-validation/caller-handler-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/caller-handler-tests.log"
      - name: Actual stress-runner deadline boundary tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-economic-stress/test_runner_guard_join.py \
            --report "$RUNNER_TEMP/projection-validation/stress-runner-boundary.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/stress-runner-boundary-tests.log"
      - name: Retained stress-runner tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-economic-stress
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            test_runner.RunnerTests.test_known_order_cost_keeps_sequence \
            test_runner.RunnerTests.test_summary_counts_cash_and_timeouts \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/stress-runner-existing-tests.log"
      - name: Stress-runner combined-report binding tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-selected-projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v test_stress_runner_report \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/stress-runner-reporter-tests.log"
      - name: Selected-action queue-copy parity tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 -B revenue/kaggriculture/cloud-selected-market-checks/test_queue_copy.py \
            --lab "$LAB" \
            --report "$RUNNER_TEMP/projection-validation/queue-copy-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/queue-copy-tests.log"
      - name: Queue-copy combined-report binding tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-selected-projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v test_queue_copy_report \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/queue-copy-reporter-tests.log"
      - name: Existing workflow regression binding tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-composition-cases/cover/test_regression_bindings.py -v \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/workflow-bindings-tests.log"
      - name: Combined-report regression tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-selected-projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest test_combined_report test_report_publication test_caller_handler_report -v 2>&1 | tee "$RUNNER_TEMP/projection-validation/reporter-tests.log"
      - name: Bind all combined results to one source snapshot
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 revenue/kaggriculture/cloud-selected-projection/build_combined_report.py \
            --directory "$RUNNER_TEMP/projection-validation" \
            --include-reporter-tests --include-funded-join --include-runtime-regressions \
            --include-cancellation --include-caller-handler --include-ledger-schedule --include-stress-runner --include-queue-copy --include-adaptive-context \
            --output "$RUNNER_TEMP/projection-validation/COMBINED-RESULTS.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: titan-selected-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/projection-validation/
          if-no-files-found: error
          retention-days: 7

  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-selected-projection.yml
            /revenue/kaggriculture/cloud-execution-lab/
            /revenue/kaggriculture/cloud-economic-stress/funded_payback/
            /revenue/kaggriculture/cloud-quickstep/
            /revenue/kaggriculture/cloud-runtime-pulse/
            /revenue/kaggriculture/cloud-committed-seed-retry/
            /revenue/kaggriculture/cloud-opponent-league/lark-responsive/
            /revenue/kaggriculture/cloud-composition-cases/cover/
      - name: Record canonical source before checking
        id: canonical_snapshot
        shell: python
        run: |
          import hashlib, json, os, platform, subprocess, zlib
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'canonical-validation'
          out.mkdir(parents=True, exist_ok=True)
          roots = ['revenue/kaggriculture/cloud-execution-lab',
                   'revenue/kaggriculture/cloud-economic-stress/funded_payback',
                   'revenue/kaggriculture/cloud-quickstep',
                   'revenue/kaggriculture/cloud-runtime-pulse',
                   'revenue/kaggriculture/cloud-committed-seed-retry',
                   'revenue/kaggriculture/cloud-opponent-league/lark-responsive',
                   'revenue/kaggriculture/cloud-composition-cases/cover']
          paths = [p for root in roots for p in Path(root).rglob('*') if p.is_file()]
          paths.append(Path('.github/workflows/titan-selected-projection.yml'))
          files = {}
          for path in sorted(paths):
              data = path.read_bytes()
              files[str(path)] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                  'git_blob': hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if checkout != os.environ['GITHUB_SHA']:
              raise ValueError('Canonical checkout differs from workflow event')
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pull = event.get('pull_request') or {}
          report = {'checkout': checkout, 'event_sha': os.environ['GITHUB_SHA'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'pull_request_head': (pull.get('head') or {}).get('sha'),
              'pull_request_base': (pull.get('base') or {}).get('sha'),
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'python': platform.python_version(), 'zlib': zlib.ZLIB_RUNTIME_VERSION,
              'roots': roots, 'files': files, 'scope': 'canonical package consistency; no games'}
          (out/'SOURCE-SNAPSHOT.json').write_text(json.dumps(report, indent=2)+'\n')
      - name: Check the committed canonical package without rebuilding
        id: canonical_check
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/build_integrated.py --check \
            > "$RUNNER_TEMP/canonical-validation/current-check.json" \
            2> "$RUNNER_TEMP/canonical-validation/current-check.stderr"
          cat "$RUNNER_TEMP/canonical-validation/current-check.json"
      - name: Existing release consistency cases in temporary copies
        id: canonical_consistency
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v test_release_consistency \
            2>&1 | tee "$RUNNER_TEMP/canonical-validation/release-consistency-tests.log"
      - name: Committed seed retry source and canonical boundary tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB="$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-execution-lab"
          RUNTIME="$RUNNER_TEMP/canonical-validation/seed-retry-runtime"
          mkdir -p "$RUNTIME"
          tar -xzf "$LAB/exports/titan-current.tar.gz" -C "$RUNTIME"
          TITAN_TEST_RUNTIME="$RUNTIME" PYTHONPATH="$RUNTIME" \
            python3 -B revenue/kaggriculture/cloud-committed-seed-retry/test_seed_retry.py \
            2>&1 | tee "$RUNNER_TEMP/canonical-validation/committed-seed-retry-tests.log"
          (cd "$RUNTIME" && PYTHONPATH="$RUNTIME" \
            python3 -B -m unittest -v checks.test_committed_seed_retry_runtime) \
            2>&1 | tee "$RUNNER_TEMP/canonical-validation/committed-seed-retry-boundary-tests.log"
      - name: Canonical workflow boundary tests
        id: canonical_bindings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-composition-cases/cover/test_canonical_binding.py -v \
            2>&1 | tee "$RUNNER_TEMP/canonical-validation/canonical-binding-tests.log"
          python3 -B revenue/kaggriculture/cloud-composition-cases/cover/test_canonical_transport.py -v \
            2>&1 | tee "$RUNNER_TEMP/canonical-validation/canonical-transport-tests.log"
      - name: Record canonical result and source preservation
        if: ${{ always() }}
        env:
          SNAPSHOT_OUTCOME: ${{ steps.canonical_snapshot.outcome }}
          CHECK_OUTCOME: ${{ steps.canonical_check.outcome }}
          CONSISTENCY_OUTCOME: ${{ steps.canonical_consistency.outcome }}
          BINDINGS_OUTCOME: ${{ steps.canonical_bindings.outcome }}
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'canonical-validation'
          out.mkdir(parents=True, exist_ok=True)
          outcomes = {key: os.environ.get(key) for key in
              ['SNAPSHOT_OUTCOME', 'CHECK_OUTCOME', 'CONSISTENCY_OUTCOME', 'BINDINGS_OUTCOME']}
          problems = [key+': '+str(value) for key,value in outcomes.items() if value != 'success']
          result = {'successful': False, 'outcomes': outcomes, 'problems': problems,
                    'scope': 'package consistency, not gameplay or submission', 'full_games': 0}
          try:
              snapshot = json.loads((out/'SOURCE-SNAPSHOT.json').read_text())
              before = snapshot['files']
              paths = [p for root in snapshot['roots'] for p in Path(root).rglob('*') if p.is_file()]
              paths.append(Path('.github/workflows/titan-selected-projection.yml'))
              after = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
              changed = sorted(name for name in set(before)|set(after)
                  if before.get(name,{}).get('sha256') != after.get(name))
              result.update(checkout=snapshot['checkout'], event_sha=snapshot['event_sha'],
                  pull_request_head=snapshot['pull_request_head'],
                  source_files_checked=len(before), changed_paths=changed)
              if changed:
                  problems.append('Checked source changed during validation')
              if outcomes['CHECK_OUTCOME'] == 'success':
                  receipt = json.loads((out/'current-check.json').read_text())
                  lab = 'revenue/kaggriculture/cloud-execution-lab/'
                  archive = before[lab+receipt['path']]
                  manifest = before[lab+receipt['source_manifest']]
                  if (receipt['sha256'] != archive['sha256'] or receipt['bytes'] != archive['bytes']
                      or receipt['source_manifest_sha256'] != manifest['sha256']):
                      problems.append('Builder result differs from pre-check source snapshot')
                  result['release'] = receipt
          except (OSError, ValueError, KeyError, TypeError) as exc:
              problems.append(type(exc).__name__+': '+str(exc))
          result['successful'] = not problems
          (out/'CANONICAL-RESULTS.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result, sort_keys=True))
          if problems:
              raise SystemExit(1)
      - name: Retain checked canonical bytes for existing consumers
        shell: python
        run: |
          import hashlib, json, os, tempfile
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'canonical-validation'
          report = {'schema': 'titan.canonical.transfer.v1', 'successful': False,
                    'problems': [], 'scope': 'byte copy of the checked release; no rebuild'}
          try:
              checked = json.loads((out/'CANONICAL-RESULTS.json').read_text())
              snapshot = json.loads((out/'SOURCE-SNAPSHOT.json').read_text())
              if checked.get('successful') is not True or checked.get('changed_paths') != []:
                  raise ValueError('Canonical check did not finish successfully with unchanged source')
              for key in ('checkout', 'event_sha', 'pull_request_head'):
                  if checked[key] != snapshot[key]:
                      raise ValueError('Canonical result and snapshot identity differ: '+key)
                  report[key] = snapshot[key]
              lab = Path('revenue/kaggriculture/cloud-execution-lab')
              names = ('exports/titan-current.tar.gz',
                       'runtime/integrated-selected/CURRENT-ARCHIVE.json',
                       'runtime/integrated-selected/CURRENT-SOURCE.json')
              payload = {name: (lab/name).read_bytes() for name in names}
              records = {}
              for name, data in payload.items():
                  source = snapshot['files'][str(lab/name)]
                  digest = hashlib.sha256(data).hexdigest()
                  if source['bytes'] != len(data) or source['sha256'] != digest:
                      raise ValueError('Checked source changed before copying: '+name)
                  records[name] = {'bytes': len(data), 'sha256': digest}
              pointer = json.loads(payload[names[1]])
              if pointer != checked['release']:
                  raise ValueError('Release pointer differs from the successful check')
              if (pointer['path'] != names[0] or pointer['source_manifest'] != names[2]
                  or pointer['sha256'] != records[names[0]]['sha256']
                  or pointer['bytes'] != records[names[0]]['bytes']
                  or pointer['source_manifest_sha256'] != records[names[2]]['sha256']):
                  raise ValueError('Release pointer does not bind the copied payload')
              target = out/'checked-package'
              if target.exists():
                  raise ValueError('Checked-package destination is already present')
              with tempfile.TemporaryDirectory(prefix='canonical-copy-', dir=out.parent) as tmp:
                  staged = Path(tmp)/'checked-package'
                  for name, data in payload.items():
                      path = staged/name
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(data)
                      if path.read_bytes() != data:
                          raise OSError('Copied bytes differ: '+name)
                  staged.rename(target)
              report.update(successful=True, directory='checked-package', files=records,
                            release=pointer)
          except (OSError, ValueError, KeyError, TypeError) as exc:
              report['problems'].append(type(exc).__name__+': '+str(exc))
          (out/'PACKAGE-TRANSFER.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, sort_keys=True))
          if not report['successful']:
              raise SystemExit(1)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: titan-canonical-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-validation/
          if-no-files-found: error
          retention-days: 7
