name: titan-selected-projection

on:
  pull_request:
    paths:
      - '.github/workflows/titan-selected-projection.yml'
      - 'revenue/kaggriculture/cloud-selected-projection/**'
      - 'revenue/kaggriculture/cloud-selected-market-checks/**'
      - 'revenue/kaggriculture/cloud-eval/**'
      - 'revenue/kaggriculture/20260907-offline-agent/**'
      - 'revenue/kaggriculture/cloud-execution-lab/integrated_selected.py'
      - 'revenue/kaggriculture/cloud-integration-differentials/**'
      - 'revenue/kaggriculture/cloud-composition-cases/cypress/**'
      - 'revenue/kaggriculture/cloud-composition-cases/cover/**'
      - 'revenue/kaggriculture/cloud-economic-stress/deadline_adapter.py'
      - 'revenue/kaggriculture/cloud-economic-stress/test_runner.py'
      - 'revenue/kaggriculture/cloud-economic-stress/runner.py'
      - 'revenue/kaggriculture/cloud-economic-stress/test_runner_guard_join.py'
      - 'revenue/kaggriculture/cloud-economic-stress/cancellation/**'
      - 'revenue/kaggriculture/cloud-market-game-theory/adaptive/runtime.py'
      - 'revenue/kaggriculture/cloud-market-game-theory/adaptive/test_capture_binding.py'
      - 'revenue/kaggriculture/cloud-market-game-theory/adaptive/recourse.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_score_schedule.py'
      - 'revenue/kaggriculture/cloud-execution-lab/selected_action_sell.py'
      - 'revenue/kaggriculture/cloud-execution-lab/ordered_selected_sell.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_ordered_selected_sell.py'
      - 'revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py'
      - 'revenue/kaggriculture/cloud-execution-lab/mechanics.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_selected_action_sell.py'
      - 'revenue/kaggriculture/cloud-execution-lab/test_engine_semantics.py'
      - 'revenue/kaggriculture/cloud-execution-lab/reference/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-selected-projection.yml
            /revenue/kaggriculture/cloud-selected-projection/
            /revenue/kaggriculture/cloud-selected-market-checks/
            /revenue/kaggriculture/cloud-eval/
            /revenue/kaggriculture/20260907-offline-agent/
            /revenue/kaggriculture/cloud-execution-lab/integrated_selected.py
            /revenue/kaggriculture/cloud-execution-lab/exports/integrated-selected-v1.tar.gz
            /revenue/kaggriculture/cloud-integration-differentials/
            /revenue/kaggriculture/cloud-composition-cases/cypress/
            /revenue/kaggriculture/cloud-composition-cases/cover/
            /revenue/kaggriculture/cloud-economic-stress/deadline_adapter.py
            /revenue/kaggriculture/cloud-economic-stress/test_runner.py
            /revenue/kaggriculture/cloud-economic-stress/runner.py
            /revenue/kaggriculture/cloud-economic-stress/test_runner_guard_join.py
            /revenue/kaggriculture/cloud-economic-stress/cancellation/
            /revenue/kaggriculture/cloud-market-game-theory/adaptive/runtime.py
            /revenue/kaggriculture/cloud-market-game-theory/adaptive/test_capture_binding.py
            /revenue/kaggriculture/cloud-market-game-theory/adaptive/recourse.py
            /revenue/kaggriculture/cloud-execution-lab/test_score_schedule.py
            /revenue/kaggriculture/cloud-execution-lab/reference/integrated-selected/
            /revenue/kaggriculture/cloud-execution-lab/reference/next-panel/vendor/arlene.py
            /revenue/kaggriculture/cloud-execution-lab/selected_action_sell.py
            /revenue/kaggriculture/cloud-execution-lab/ordered_selected_sell.py
            /revenue/kaggriculture/cloud-execution-lab/test_ordered_selected_sell.py
            /revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py
            /revenue/kaggriculture/cloud-execution-lab/mechanics.py
            /revenue/kaggriculture/cloud-execution-lab/test_selected_action_sell.py
            /revenue/kaggriculture/cloud-execution-lab/test_engine_semantics.py
            /revenue/kaggriculture/cloud-execution-lab/reference/evaluator/
            /revenue/kaggriculture/cloud-execution-lab/reference/engine/
            /revenue/kaggriculture/cloud-execution-lab/reference/selected-action/
            /revenue/kaggriculture/cloud-execution-lab/reference/decision/
            /revenue/kaggriculture/cloud-execution-lab/reference/ordered-feasibility/atlas/projection.py
      - name: Record committed test and runtime inputs
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'projection-validation'
          out.mkdir()
          root = Path('revenue/kaggriculture')
          frozen = root/'cloud-execution-lab/exports/integrated-selected-v1.tar.gz'
          frozen_bytes = frozen.read_bytes()
          assert len(frozen_bytes) == 103527
          assert hashlib.sha256(frozen_bytes).hexdigest() == '95c7bf10a20149419e6208e43cdf2bf0728e22fe61b600180eaa1a3fbcc1b153'
          (out/frozen.name).write_bytes(frozen_bytes)
          roots = ('cloud-selected-projection', 'cloud-execution-lab',
                   'cloud-selected-market-checks', 'cloud-eval', '20260907-offline-agent',
                   'cloud-integration-differentials', 'cloud-composition-cases/cypress',
                   'cloud-market-game-theory/adaptive', 'cloud-composition-cases/cover',
                   'cloud-economic-stress')
          paths = [p for name in roots for p in (root/name).rglob('*') if p.is_file()]
          paths.append(Path('.github/workflows/titan-selected-projection.yml'))
          files = {}
          for path in sorted(paths):
              data = path.read_bytes()
              files[str(path)] = {'size': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                                 'git_blob': hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
          checkout = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert checkout == os.environ['GITHUB_SHA'], 'checkout must match the workflow event commit'
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pull = event.get('pull_request') or {}
          context = {'event': os.environ['GITHUB_EVENT_NAME'], 'event_sha': os.environ['GITHUB_SHA'],
                     'pull_request_head': (pull.get('head') or {}).get('sha'),
                     'pull_request_base': (pull.get('base') or {}).get('sha'),
                     'checkout_semantics': 'pull_request_merge' if pull else 'event_commit'}
          report = {'checkout': checkout, 'source_context': context,
                    'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'python': subprocess.check_output(['python3','--version'], text=True).strip(),
                    'files': files, 'scope': 'focused deterministic tests; no gameplay panels'}
          (out/'SOURCE-SNAPSHOT.json').write_text(json.dumps(report, indent=2)+'\n')
      - name: Existing selected-action SELL interface tests
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest test_selected_action_sell -v 2>&1 | tee "$RUNNER_TEMP/projection-validation/original-seller-tests.log"
      - name: Projection and ordered-transfer consumer tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 revenue/kaggriculture/cloud-selected-projection/test_projection.py \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --engine-loader "$LAB/reference/evaluator/loader.py" \
            --engine-cache "$LAB/reference/engine" \
            --seller "$LAB/selected_action_sell.py" \
            --report "$RUNNER_TEMP/projection-validation/projection-results.json" -v \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/projection-tests.log"
      - name: Existing market-contract consumer tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 revenue/kaggriculture/cloud-selected-market-checks/check_market_contracts.py \
            --lab "$LAB" \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --engine-loader "$LAB/reference/evaluator/loader.py" \
            --engine-cache "$LAB/reference/engine" \
            --json-output "$RUNNER_TEMP/projection-validation/market-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/market-tests.log"
      - name: Explicit and default offline loader binding tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 revenue/kaggriculture/cloud-selected-market-checks/test_engine_binding.py \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --engine-loader "$LAB/reference/evaluator/loader.py" \
            --engine-cache "$LAB/reference/engine" \
            --json-output "$RUNNER_TEMP/projection-validation/loader-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/loader-tests.log"
      - name: Empty-lot selected-action fallback tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB="$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-execution-lab"
          TITAN_SELL_FILE="$LAB/selected_action_sell.py" \
          TITAN_SELL_SUPPORT_DIR="$LAB" \
          TITAN_ENGINE_FILE="$LAB/reference/engine/kaggriculture.py" \
          TITAN_UPSTREAM_DIR="$LAB/reference/engine" \
          python3 revenue/kaggriculture/cloud-selected-market-checks/test_empty_lot.py \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/empty-lot-tests.log"
      - name: Joined ordered selected-action SELL tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest test_ordered_selected_sell -v 2>&1 | tee "$RUNNER_TEMP/projection-validation/joined-wrapper-tests.log"
      - name: Funded seed queue joined integration tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-composition-cases/cypress/test_funded_join.py \
            --json-output "$RUNNER_TEMP/projection-validation/funded-join-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/funded-join-tests.log"
      - name: Adaptive actor capture binding tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-market-game-theory/adaptive/test_capture_binding.py \
            --report "$RUNNER_TEMP/projection-validation/capture-binding-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/capture-binding-tests.log"
      - name: Dated market score schedule parity tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/test_score_schedule.py -v \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/score-schedule-tests.log"
      - name: Selected-market ledger schedule parity tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 -B revenue/kaggriculture/cloud-selected-market-checks/test_ledger_schedule.py \
            --lab "$LAB" \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --engine-loader "$LAB/reference/evaluator/loader.py" \
            --engine-cache "$LAB/reference/engine" \
            --report "$RUNNER_TEMP/projection-validation/ledger-schedule-results.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/ledger-schedule-tests.log"
      - name: Deadline cancellation regression tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-economic-stress/cancellation/test_deadline_cancellation.py \
            --report "$RUNNER_TEMP/projection-validation/deadline-cancellation.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/deadline-cancellation-tests.log"
      - name: Actual stress-runner deadline boundary tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-economic-stress/test_runner_guard_join.py \
            --report "$RUNNER_TEMP/projection-validation/stress-runner-boundary.json" \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/stress-runner-boundary-tests.log"
      - name: Retained stress-runner tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-economic-stress
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            test_runner.RunnerTests.test_known_order_cost_keeps_sequence \
            test_runner.RunnerTests.test_summary_counts_cash_and_timeouts \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/stress-runner-existing-tests.log"
      - name: Stress-runner combined-report binding tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-selected-projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v test_stress_runner_report \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/stress-runner-reporter-tests.log"
      - name: Existing workflow regression binding tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-composition-cases/cover/test_regression_bindings.py -v \
            2>&1 | tee "$RUNNER_TEMP/projection-validation/workflow-bindings-tests.log"
      - name: Combined-report regression tests
        if: ${{ !cancelled() }}
        working-directory: revenue/kaggriculture/cloud-selected-projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest test_combined_report -v 2>&1 | tee "$RUNNER_TEMP/projection-validation/reporter-tests.log"
      - name: Bind all combined results to one source snapshot
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 revenue/kaggriculture/cloud-selected-projection/build_combined_report.py \
            --directory "$RUNNER_TEMP/projection-validation" \
            --include-reporter-tests --include-funded-join --include-runtime-regressions \
            --include-cancellation --include-ledger-schedule --include-stress-runner \
            --output "$RUNNER_TEMP/projection-validation/COMBINED-RESULTS.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: titan-selected-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/projection-validation/
          if-no-files-found: error
          retention-days: 7
