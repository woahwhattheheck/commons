name: TITAN strict-dominance self-build

on:
  push:
    branches:
      - sol-pro/titan-strict-dominance-pressure-20260910-01
    paths:
      - .github/workflows/titan-strict-dominance-selfbuild.yml
  pull_request:
    branches:
      - sol-pro/titan-strict-dominance-pressure-20260910-01
    paths:
      - .github/workflows/titan-strict-dominance-selfbuild.yml
      - revenue/kaggriculture/cloud-opponent-league/lark-responsive/test_pressure_priority_strict_dominance.py

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PARENT_SHA: dfef8e57289b59c68bd45eb8f3fdd8ec610e0892
      PUBLICATION_BRANCH: sol-pro/titan-strict-dominance-pressure-20260910-01
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact head and stacked parent
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git status --porcelain)" = ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply fail-closed strict-dominance patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} drifted: expected one anchor, found {count}')
              return source.replace(old, new, 1)

          pressure = Path('revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py')
          source = pressure.read_text()

          old_signature = (
              'def transform(action: dict, observation: Mapping,\n'
              '              configuration: Mapping | None = None, *, quote: PriceFunction,\n'
              '              rival_supply: Mapping[str, int] | None = None) -> dict:'
          )
          new_signature = (
              'def transform(action: dict, observation: Mapping,\n'
              '              configuration: Mapping | None = None, *, quote: PriceFunction,\n'
              '              rival_supply: Mapping[str, int] | None = None,\n'
              '              strict_dominance: bool = False) -> dict:'
          )
          source = replace_exact(source, old_signature, new_signature, 'pressure transform signature')

          old_validation = (
              "    if not isinstance(action, dict) or not isinstance(action.get('market', []), list):\n"
              "        raise ValueError('parent policy must return an object with a market list')"
          )
          new_validation = (
              "    if not isinstance(strict_dominance, bool):\n"
              "        raise ValueError('strict_dominance must be boolean')\n"
              "    if not isinstance(action, dict) or not isinstance(action.get('market', []), list):\n"
              "        raise ValueError('parent policy must return an object with a market list')"
          )
          source = replace_exact(source, old_validation, new_validation, 'pressure transform validation')

          old_ranking = (
              '        ranked = sorted(zip(orders[start:stop], scores[start:stop]), key=lambda p: -p[1])\n'
              '        orders[start:stop] = [order for order, _ in ranked]'
          )
          new_ranking = (
              '        pairs = list(zip(orders[start:stop], scores[start:stop]))\n'
              '        if strict_dominance:\n'
              '            # Proxy magnitude cannot prove which exposed commodity is safe\n'
              '            # to demote against an unseen same-slot rival sale.\n'
              '            ranked = (\n'
              '                [pair for pair in pairs if pair[1] > 0]\n'
              '                + [pair for pair in pairs if pair[1] <= 0]\n'
              '            )\n'
              '        else:\n'
              '            ranked = sorted(pairs, key=lambda p: -p[1])\n'
              '        orders[start:stop] = [order for order, _ in ranked]'
          )
          source = replace_exact(source, old_ranking, new_ranking, 'pressure ranking implementation')
          compile(source, str(pressure), 'exec')
          pressure.write_text(source)

          runtime = Path('revenue/kaggriculture/cloud-execution-lab/titan_runtime.py')
          source = runtime.read_text()
          old_call = '        result = pressure.transform(selected, obs, cfg, quote=mechanics.market_price)'
          new_call = (
              '        result = pressure.transform(\n'
              '            selected, obs, cfg, quote=mechanics.market_price,\n'
              '            strict_dominance=True)'
          )
          source = replace_exact(source, old_call, new_call, 'canonical pressure call')
          compile(source, str(runtime), 'exec')
          runtime.write_text(source)
          PY

      - name: Compile generated source without cache artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = (
              Path('revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py'),
              Path('revenue/kaggriculture/cloud-execution-lab/titan_runtime.py'),
          )
          for path in paths:
              compile(path.read_bytes(), str(path), 'exec')
          PY

      - name: Run pressure module contracts
        working-directory: revenue/kaggriculture/cloud-opponent-league/lark-responsive
        run: |
          python -B -m unittest -v \
            test_pressure_priority.py \
            test_pressure_priority_public_flow.py \
            test_pressure_priority_strict_dominance.py

      - name: Run canonical runtime boundary contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: python -B -m unittest -v test_market_pressure_runtime.py

      - name: Rebuild and verify deterministic current archive
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          python -B build_integrated.py
          python -B build_integrated.py --check

      - name: Emit exact build receipt
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('revenue/kaggriculture/cloud-execution-lab')
          pointer = json.loads((root/'runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())
          pressure = Path('revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py')
          runtime = root/'titan_runtime.py'
          receipt = {
              'schema': 'titan-strict-dominance-build/v2',
              'generator_parent_sha': os.environ['EXPECTED_PARENT_SHA'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'archive': pointer,
              'pressure_priority_sha256': hashlib.sha256(pressure.read_bytes()).hexdigest(),
              'titan_runtime_sha256': hashlib.sha256(runtime.read_bytes()).hexdigest(),
              'tests': {
                  'generated_source_compile': 'pass',
                  'pressure_module_contracts': 'pass',
                  'canonical_runtime_boundary': 'pass',
                  'deterministic_build_check': 'pass',
              },
          }
          out = Path('revenue/kaggriculture/cloud-market-pressure-strict-dominance')
          out.mkdir(parents=True, exist_ok=True)
          (out/'BUILD.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY

      - name: Upload exact candidate archive and receipt
        uses: actions/upload-artifact@v4
        with:
          name: titan-strict-dominance-current
          if-no-files-found: error
          retention-days: 7
          path: |
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json
            revenue/kaggriculture/cloud-market-pressure-strict-dominance/BUILD.json

      - name: Publish tested source and deterministic archive to parent branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/sol-pro/titan-strict-dominance-pressure-20260910-01'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          rm .github/workflows/titan-strict-dominance-selfbuild.yml
          git config user.name 'commons-board'
          git config user.email 'commons-board@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'TITAN: contain pressure ranking to strict dominance'
          git push origin HEAD:"$PUBLICATION_BRANCH"
