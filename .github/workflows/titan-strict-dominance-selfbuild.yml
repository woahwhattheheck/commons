name: TITAN strict-dominance self-build transport repair

on:
  push:
    branches:
      - sol-pro/strict-dominance-selfbuild-transport-repair-20260910-01
    paths:
      - .github/workflows/titan-strict-dominance-selfbuild.yml

permissions:
  contents: write

concurrency:
  group: titan-strict-dominance-selfbuild-transport-repair
  cancel-in-progress: true

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact child head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind bootstrap chain to reviewed parent
        shell: bash
        env:
          EXPECTED_PARENT: dfef8e57289b59c68bd45eb8f3fdd8ec610e0892
          EXPECTED_FIRST_BOOTSTRAP: f89cf3aa3345a1c99660d88243ee443fb2f47bf3
          EXPECTED_SECOND_BOOTSTRAP: f9b419e5180e9cbb8c0959c185907625bc40cdcd
          EXPECTED_THIRD_BOOTSTRAP: b49b723d90d4baa6f9181cf771db95a472c65b94
          EXPECTED_BRANCH: sol-pro/strict-dominance-selfbuild-transport-repair-20260910-01
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_THIRD_BOOTSTRAP"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_SECOND_BOOTSTRAP"
          test "$(git rev-parse HEAD^^^)" = "$EXPECTED_FIRST_BOOTSTRAP"
          test "$(git rev-parse HEAD^^^^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --count "$EXPECTED_PARENT"..HEAD)" -eq 4
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/titan-strict-dominance-selfbuild.yml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact-block strict-dominance patch and contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          from pathlib import Path

          PRESSURE_BLOB = "7261674962d10fc8bc6af5ff73ff9212c40f61ad"
          RUNTIME_BLOB = "b952c9c228ecbde592bf3d2df01638677abb0d24"
          RUNTIME_TEST_BLOB = "bc675ad993673f732ffb21c8922e48d3add679a3"

          def git_blob(data: bytes) -> str:
              payload = b"blob " + str(len(data)).encode() + b"\0" + data
              return hashlib.sha1(payload).hexdigest()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label} drifted: expected one exact block, found {count}")
              result = source.replace(old, new, 1)
              expected_residual = new.count(old)
              if result.count(new) != 1 or result.count(old) != expected_residual:
                  raise SystemExit(f"{label} postcondition failed")
              return result

          pressure = Path("revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py")
          pressure_bytes = pressure.read_bytes()
          if git_blob(pressure_bytes) != PRESSURE_BLOB:
              raise SystemExit("pressure_priority.py source blob drifted")
          source = pressure_bytes.decode("utf-8")

          old_signature = (
              "def transform(action: dict, observation: Mapping,\n"
              "              configuration: Mapping | None = None, *, quote: PriceFunction,\n"
              "              rival_supply: Mapping[str, int] | None = None) -> dict:"
          )
          new_signature = (
              "def transform(action: dict, observation: Mapping,\n"
              "              configuration: Mapping | None = None, *, quote: PriceFunction,\n"
              "              rival_supply: Mapping[str, int] | None = None,\n"
              "              strict_dominance: bool = False) -> dict:"
          )
          source = replace_once(source, old_signature, new_signature, "pressure transform signature")

          old_documentation = (
              "    ``rival_supply`` is an optional product->public-quantity scenario. Missing\n"
              "    product keys retain the historical same-sized proxy for that product; an\n"
              "    explicit zero means no rival flow. Present malformed values (including\n"
              "    ``None``) are barriers, so ambiguity cannot silently become proxy evidence.\n"
              "\n"
              "    Preserve all orders, quantities, duplicate lots, economic barriers,"
          )
          new_documentation = (
              "    ``rival_supply`` is an optional product->public-quantity scenario. Missing\n"
              "    product keys retain the historical same-sized proxy for that product; an\n"
              "    explicit zero means no rival flow. Present malformed values (including\n"
              "    ``None``) are barriers, so ambiguity cannot silently become proxy evidence.\n"
              "\n"
              "    ``strict_dominance`` replaces magnitude sorting with a stable two-class\n"
              "    partition. Positive-exposure lots may cross zero-exposure lots, but retain\n"
              "    their parent relative order because proxy magnitude does not prove which\n"
              "    exposed commodity is safe to demote against an unseen same-slot rival sale.\n"
              "\n"
              "    Preserve all orders, quantities, duplicate lots, economic barriers,"
          )
          source = replace_once(
              source, old_documentation, new_documentation, "pressure transform documentation"
          )

          old_validation = (
              "    if not isinstance(action, dict) or not isinstance(action.get('market', []), list):\n"
              "        raise ValueError('parent policy must return an object with a market list')"
          )
          new_validation = (
              "    if not isinstance(strict_dominance, bool):\n"
              "        raise ValueError('strict_dominance must be boolean')\n"
              "    if not isinstance(action, dict) or not isinstance(action.get('market', []), list):\n"
              "        raise ValueError('parent policy must return an object with a market list')"
          )
          source = replace_once(source, old_validation, new_validation, "pressure validation")

          old_ranking = (
              "        ranked = sorted(zip(orders[start:stop], scores[start:stop]), key=lambda p: -p[1])\n"
              "        orders[start:stop] = [order for order, _ in ranked]"
          )
          new_ranking = (
              "        pairs = list(zip(orders[start:stop], scores[start:stop]))\n"
              "        if strict_dominance:\n"
              "            # Proxy magnitude cannot prove which exposed commodity is safe\n"
              "            # to demote against an unseen same-slot rival sale.\n"
              "            ranked = ([pair for pair in pairs if pair[1] > 0]\n"
              "                      + [pair for pair in pairs if pair[1] <= 0])\n"
              "        else:\n"
              "            ranked = sorted(pairs, key=lambda p: -p[1])\n"
              "        orders[start:stop] = [order for order, _ in ranked]"
          )
          source = replace_once(source, old_ranking, new_ranking, "pressure ranking implementation")

          pressure_tree = ast.parse(source, filename=str(pressure))
          transforms = [
              node for node in pressure_tree.body
              if isinstance(node, ast.FunctionDef) and node.name == "transform"
          ]
          if len(transforms) != 1:
              raise SystemExit("pressure transform AST identity failed")
          transform = transforms[0]
          kwonly = [argument.arg for argument in transform.args.kwonlyargs]
          if kwonly[-1:] != ["strict_dominance"]:
              raise SystemExit("strict_dominance is not the final keyword-only argument")
          default = transform.args.kw_defaults[-1]
          if not isinstance(default, ast.Constant) or default.value is not False:
              raise SystemExit("strict_dominance default is not literal False")
          pressure.write_text(source, encoding="utf-8", newline="\n")

          runtime = Path("revenue/kaggriculture/cloud-execution-lab/titan_runtime.py")
          runtime_bytes = runtime.read_bytes()
          if git_blob(runtime_bytes) != RUNTIME_BLOB:
              raise SystemExit("titan_runtime.py source blob drifted")
          runtime_source = runtime_bytes.decode("utf-8")
          old_call = (
              "        result = pressure.transform(selected, obs, cfg, quote=mechanics.market_price)"
          )
          new_call = (
              "        result = pressure.transform(\n"
              "            selected, obs, cfg, quote=mechanics.market_price,\n"
              "            strict_dominance=True)"
          )
          runtime_source = replace_once(
              runtime_source, old_call, new_call, "canonical pressure call"
          )
          runtime_tree = ast.parse(runtime_source, filename=str(runtime))
          strict_calls = []
          for node in ast.walk(runtime_tree):
              if not isinstance(node, ast.Call):
                  continue
              if not isinstance(node.func, ast.Attribute) or node.func.attr != "transform":
                  continue
              for keyword in node.keywords:
                  if keyword.arg == "strict_dominance":
                      strict_calls.append(keyword.value)
          if len(strict_calls) != 1:
              raise SystemExit("canonical strict-dominance call count is not one")
          if not isinstance(strict_calls[0], ast.Constant) or strict_calls[0].value is not True:
              raise SystemExit("canonical strict-dominance call is not literal True")
          runtime.write_text(runtime_source, encoding="utf-8", newline="\n")

          runtime_test = Path("revenue/kaggriculture/cloud-execution-lab/test_market_pressure_runtime.py")
          runtime_test_bytes = runtime_test.read_bytes()
          if git_blob(runtime_test_bytes) != RUNTIME_TEST_BLOB:
              raise SystemExit("test_market_pressure_runtime.py source blob drifted")
          runtime_test_source = runtime_test_bytes.decode("utf-8")
          old_expectation = (
              "        self.assertEqual(result['market'], [\n"
              "            ['SELL', 'MILK', 15], ['SELL', 'WOOL', 14],\n"
              "            ['HIRE'], ['SELL', 'MILK', 2], ['SELL', 'WOOL', 2],\n"
              "        ])"
          )
          new_expectation = (
              "        # Both lots have positive exposure. Strict dominance can move them\n"
              "        # ahead of zero exposure, but cannot justify reversing parent order.\n"
              "        self.assertEqual(result['market'], [\n"
              "            ['SELL', 'WOOL', 14], ['SELL', 'MILK', 15],\n"
              "            ['HIRE'], ['SELL', 'WOOL', 2], ['SELL', 'MILK', 2],\n"
              "        ])"
          )
          runtime_test_source = replace_once(
              runtime_test_source, old_expectation, new_expectation,
              "canonical strict-dominance runtime expectation"
          )
          ast.parse(runtime_test_source, filename=str(runtime_test))
          runtime_test.write_text(runtime_test_source, encoding="utf-8", newline="\n")
          PY

          PYCACHE_ROOT="$RUNNER_TEMP/titan-strict-dominance-pycache"
          rm -rf "$PYCACHE_ROOT"
          PYTHONPYCACHEPREFIX="$PYCACHE_ROOT" python -m py_compile \
            revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py \
            revenue/kaggriculture/cloud-execution-lab/titan_runtime.py \
            revenue/kaggriculture/cloud-execution-lab/test_market_pressure_runtime.py
          test "$(git diff --name-only | sort)" = $'revenue/kaggriculture/cloud-execution-lab/test_market_pressure_runtime.py\nrevenue/kaggriculture/cloud-execution-lab/titan_runtime.py\nrevenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py'
          mapfile -t checkout_bytecode < <(
            find . -path './.git' -prune -o \
              \( -type d -name __pycache__ -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) \
              -print
          )
          test "${#checkout_bytecode[@]}" -eq 0

      - name: Run pressure module contracts
        working-directory: revenue/kaggriculture/cloud-opponent-league/lark-responsive
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            test_pressure_priority.py \
            test_pressure_priority_public_flow.py \
            test_pressure_priority_strict_dominance.py

      - name: Run canonical runtime boundary contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          python -B -m unittest -v test_market_pressure_runtime.py

      - name: Rebuild and verify deterministic current archive
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          python -B build_integrated.py
          python -B build_integrated.py --check
          rm -rf /tmp/titan-strict-dominance-archive
          mkdir -p /tmp/titan-strict-dominance-archive
          tar -xzf exports/titan-current.tar.gz -C /tmp/titan-strict-dominance-archive
          cd /tmp/titan-strict-dominance-archive
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/titan-strict-dominance-archive-pycache" \
            python -m py_compile pressure_priority.py titan_runtime.py checks/test_market_pressure_runtime.py
          PYTHONPATH="$PWD" python -B checks/test_market_pressure_runtime.py

      - name: Emit exact build receipt
        shell: bash
        env:
          EXPECTED_PARENT: dfef8e57289b59c68bd45eb8f3fdd8ec610e0892
          EXPECTED_FIRST_BOOTSTRAP: f89cf3aa3345a1c99660d88243ee443fb2f47bf3
          EXPECTED_SECOND_BOOTSTRAP: f9b419e5180e9cbb8c0959c185907625bc40cdcd
          EXPECTED_THIRD_BOOTSTRAP: b49b723d90d4baa6f9181cf771db95a472c65b94
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("revenue/kaggriculture/cloud-execution-lab")
          pointer = json.loads((root / "runtime/integrated-selected/CURRENT-ARCHIVE.json").read_text())
          pressure = Path("revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py")
          runtime = root / "titan_runtime.py"
          runtime_test = root / "test_market_pressure_runtime.py"
          receipt = {
              "schema": "titan-strict-dominance-build/v5",
              "reviewed_parent": os.environ["EXPECTED_PARENT"],
              "bootstrap_chain": [
                  os.environ["EXPECTED_FIRST_BOOTSTRAP"],
                  os.environ["EXPECTED_SECOND_BOOTSTRAP"],
                  os.environ["EXPECTED_THIRD_BOOTSTRAP"],
                  os.environ["GITHUB_SHA"],
              ],
              "bootstrap_ref": os.environ["GITHUB_REF"],
              "archive": pointer,
              "pressure_priority_sha256": hashlib.sha256(pressure.read_bytes()).hexdigest(),
              "titan_runtime_sha256": hashlib.sha256(runtime.read_bytes()).hexdigest(),
              "runtime_contract_sha256": hashlib.sha256(runtime_test.read_bytes()).hexdigest(),
              "transport_guards": {
                  "exact_parent": True,
                  "exact_bootstrap_chain": True,
                  "exact_source_blobs": True,
                  "complete_block_replacements": True,
                  "exact_residual_anchor_counts": True,
                  "ast_postconditions": True,
                  "immediate_py_compile": True,
                  "checkout_bytecode_absent": True,
                  "standalone_archive_recheck": True,
                  "staged_path_allowlist": True,
              },
              "tests": {
                  "pressure_module_contracts": "pass",
                  "canonical_runtime_boundary": "pass",
                  "deterministic_build_check": "pass",
                  "standalone_archive_runtime": "pass",
              },
          }
          out = Path("revenue/kaggriculture/cloud-market-pressure-strict-dominance")
          out.mkdir(parents=True, exist_ok=True)
          (out / "BUILD.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
          python -m json.tool \
            revenue/kaggriculture/cloud-market-pressure-strict-dominance/BUILD.json \
            >/dev/null

      - name: Upload exact candidate archive and receipt
        uses: actions/upload-artifact@v4
        with:
          name: titan-strict-dominance-transport-repair-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json
            revenue/kaggriculture/cloud-market-pressure-strict-dominance/BUILD.json

      - name: Publish tested source and deterministic archive to child branch
        shell: bash
        env:
          TARGET_BRANCH: sol-pro/strict-dominance-selfbuild-transport-repair-20260910-01
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$GITHUB_SHA"
          rm .github/workflows/titan-strict-dominance-selfbuild.yml
          mapfile -t checkout_bytecode < <(
            find . -path './.git' -prune -o \
              \( -type d -name __pycache__ -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) \
              -print
          )
          test "${#checkout_bytecode[@]}" -eq 0
          git config user.name 'commons-board'
          git config user.email 'commons-board@users.noreply.github.com'
          git add -A
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -ge 8
          for path in "${staged[@]}"; do
            case "$path" in
              .github/workflows/titan-strict-dominance-selfbuild.yml|\
              revenue/kaggriculture/cloud-execution-lab/titan_runtime.py|\
              revenue/kaggriculture/cloud-execution-lab/test_market_pressure_runtime.py|\
              revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py|\
              revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz|\
              revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-*.tar.gz|\
              revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json|\
              revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json|\
              revenue/kaggriculture/cloud-market-pressure-strict-dominance/BUILD.json)
                ;;
              *)
                echo "unexpected staged path: $path" >&2
                exit 1
                ;;
            esac
          done
          for required in \
            .github/workflows/titan-strict-dominance-selfbuild.yml \
            revenue/kaggriculture/cloud-execution-lab/titan_runtime.py \
            revenue/kaggriculture/cloud-execution-lab/test_market_pressure_runtime.py \
            revenue/kaggriculture/cloud-opponent-league/lark-responsive/pressure_priority.py \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json \
            revenue/kaggriculture/cloud-market-pressure-strict-dominance/BUILD.json
          do
            if git diff --cached --quiet -- "$required"; then
              echo "required staged path missing: $required" >&2
              exit 1
            fi
          done
          git commit -m 'TITAN: transport-safe strict-dominance self-build'
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:$TARGET_BRANCH"
