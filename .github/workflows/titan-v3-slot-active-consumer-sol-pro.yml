name: TITAN V3 active frozen-consumer dependency repair bootstrap

on:
  push:
    branches:
      - sol-pro/titan-v3-slot-active-consumer-20260910-01

permissions:
  contents: write

concurrency:
  group: titan-v3-slot-active-consumer-repair-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticate-test-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PAYLOAD: .github/titan-v3-slot-active-consumer-repair-payload.tar.gz
      FAILURE_LOG: .github/titan-v3-slot-active-consumer-hosted-failure.log
      LAB: revenue/kaggriculture/cloud-execution-lab
      CASE: revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro
      NOTE: p/sol-pro-titan-v3-cross-product-slot-active-consumer-20260910-01.md
      WORKFLOW: .github/workflows/titan-v3-slot-active-consumer-sol-pro.yml
      EXPECTED_PAYLOAD_SHA256: ee8a4f5e0cdbdb9313fac6b6b3d016a767e44029b4ade444486f568b7c0e8b9e

    steps:
      - name: Checkout literal triggering branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Authenticate and install exact repair carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$PAYLOAD"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          rm -f "$FAILURE_LOG"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$PAYLOAD" -C "$work"
          test "$(find "$work" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = \
            "README.md active_witness.py project-note.md test_active_consumer.py workflow.yml "
          install -m 0644 "$work/README.md" "$CASE/README.md"
          install -m 0644 "$work/active_witness.py" "$CASE/active_witness.py"
          install -m 0644 "$work/test_active_consumer.py" "$CASE/test_active_consumer.py"
          install -m 0644 "$work/project-note.md" "$NOTE"
          install -m 0644 "$work/workflow.yml" "$WORKFLOW"
          rm "$PAYLOAD"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/README.md': '6e19cfb073b9f772510cbd2b04e094946a605eaeb2e62a72daac7ed9238492aa',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/active_witness.py': '9a1db838be6e544cc8167a23c72ade2f2e53717ccf319ceb1be14060815781c7',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/test_active_consumer.py': 'f47847e7985cbea42407f78c9adec599144a362a12c445c33343976a81755e5c',
              'p/sol-pro-titan-v3-cross-product-slot-active-consumer-20260910-01.md': '6b678dd769659f36e88d884ffb26f6c2cf4a321b13b6b680b61e97e6631ea9fb',
              '.github/workflows/titan-v3-slot-active-consumer-sol-pro.yml': '3c0eaccc95162d9afbab5efa756be01f0d4a3b96c15b541702bf819e145925e9',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY

      - name: Compile and execute exact active-consumer proof
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set +e
          proof_log="$RUNNER_TEMP/active-proof.log"
          {
            set -x
            python -B -m py_compile "$CASE"/*.py
            PYTHONPATH="$CASE" python -B -m unittest discover -s "$CASE" -p 'test_*.py' -v
            work="$(mktemp -d)"
            PYTHONPATH="$CASE" python -B "$CASE/active_witness.py" \
              --lab "$LAB" --output "$work/WITNESS.json"
            python - "$work/WITNESS.json" <<'PY'
          import json, sys
          row=json.load(open(sys.argv[1],encoding='utf-8'))
          assert row['verdicts']=={
              'emission_guard_restores_incumbent': True,
              'predecessor_detached': True,
              'successor_rejects_collision': True,
          }
          assert row['dependency_bridges']=={
              'observed_clone':{
                  'export':'detached_json_value',
                  'mode':'witness-local-json-roundtrip',
                  'module_file':'<titan-active-witness-observed-clone-bridge>',
                  'source_absent':True,
              },
              'seller_snapshot':{
                  'export':'seller_public_observation',
                  'mode':'witness-local-public-rival-snapshot',
                  'module_file':'<titan-active-witness-seller-snapshot-bridge>',
                  'source_absent':True,
              },
          }
          assert row['emission_guard']['selection_emission']['missing']=={'MILK':1}
          PY
          } >"$proof_log" 2>&1
          status=$?
          cat "$proof_log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish exact hosted failure receipt
        if: steps.proof.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'head=%s\nrun=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB"
            cat "$RUNNER_TEMP/active-proof.log"
          } > "$FAILURE_LOG"
          git config user.name "woahwhattheheck"
          git config user.email "brycembusiness2@gmail.com"
          git add "$FAILURE_LOG"
          git commit -m "test(titan): retain active-consumer hosted failure receipt [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1

      - name: Commit only the authenticated permanent carrier
        if: steps.proof.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "woahwhattheheck"
          git config user.email "brycembusiness2@gmail.com"
          git add -A -- "$CASE/README.md" \
                     "$CASE/active_witness.py" \
                     "$CASE/test_active_consumer.py" \
                     "$NOTE" \
                     "$WORKFLOW" \
                     "$PAYLOAD" \
                     "$FAILURE_LOG"
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = \
            ".github/titan-v3-slot-active-consumer-hosted-failure.log .github/titan-v3-slot-active-consumer-repair-payload.tar.gz .github/workflows/titan-v3-slot-active-consumer-sol-pro.yml p/sol-pro-titan-v3-cross-product-slot-active-consumer-20260910-01.md revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/README.md revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/active_witness.py revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/test_active_consumer.py "
          git commit -m "test(titan): close active witness dependency and emission custody [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
