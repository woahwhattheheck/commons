name: TITAN V3 active frozen-consumer dependency repair bootstrap

on:
  push:
    branches:
      - sol-pro/titan-v3-slot-active-consumer-20260910-01

permissions:
  contents: write

concurrency:
  group: titan-v3-slot-active-consumer-repair-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticate-test-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PAYLOAD: .github/titan-v3-slot-active-consumer-repair-payload.tar.gz
      FAILURE_LOG: .github/titan-v3-slot-active-consumer-hosted-failure.log
      LAB: revenue/kaggriculture/cloud-execution-lab
      CASE: revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro
      NOTE: p/sol-pro-titan-v3-cross-product-slot-active-consumer-20260910-01.md
      WORKFLOW: .github/workflows/titan-v3-slot-active-consumer-sol-pro.yml
      EXPECTED_PAYLOAD_SHA256: 5f94dc23dc76a2a0c41e9b6803ebaac9d6edca278041f5d8d8dc434826f80c11

    steps:
      - name: Checkout literal triggering branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Authenticate and install exact repair carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$PAYLOAD"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          rm -f "$FAILURE_LOG"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$PAYLOAD" -C "$work"
          test "$(find "$work" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = \
            "README.md active_witness.py project-note.md test_active_consumer.py workflow.yml "
          install -m 0644 "$work/README.md" "$CASE/README.md"
          install -m 0644 "$work/active_witness.py" "$CASE/active_witness.py"
          install -m 0644 "$work/test_active_consumer.py" "$CASE/test_active_consumer.py"
          install -m 0644 "$work/project-note.md" "$NOTE"
          install -m 0644 "$work/workflow.yml" "$WORKFLOW"
          rm "$PAYLOAD"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/README.md': '3bcad232e8b15a64cc431ba640cf7c6f51fbf9ff10fba2fd8b5b1d8c315ea697',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/active_witness.py': '1a9b8499ebdef5cc7d8da86458a2a4aa96b8b81f8be5e109e92d051d2f0833f0',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/test_active_consumer.py': 'dc0644fa88e98d42f21080a8f92bc6caa1ba721d62b7f0c68e20c4f76239244f',
              'p/sol-pro-titan-v3-cross-product-slot-active-consumer-20260910-01.md': '1adfc28ce62ab8f81de8f0ca70e47576f8791f27177cad3e141716a3358dafe4',
              '.github/workflows/titan-v3-slot-active-consumer-sol-pro.yml': '161c42b41adbcd55ffc50c5b230587b717d3cbc0bf4efc3867f51353cdb9f328',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          PY

      - name: Compile and execute exact active-consumer proof
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set +e
          proof_log="$RUNNER_TEMP/active-proof.log"
          {
            set -x
            python -B -m py_compile "$CASE"/*.py
            PYTHONPATH="$CASE" python -B -m unittest discover -s "$CASE" -p 'test_*.py' -v
            work="$(mktemp -d)"
            PYTHONPATH="$CASE" python -B "$CASE/active_witness.py" \
              --lab "$LAB" --output "$work/WITNESS.json"
            python - "$work/WITNESS.json" <<'PY'
          import json, sys
          row=json.load(open(sys.argv[1],encoding='utf-8'))
          assert row['verdicts']=={
              'emission_guard_restores_incumbent': True,
              'predecessor_detached': True,
              'successor_rejects_collision': True,
          }
          assert row['dependency_bridge']=={
              'export':'detached_json_value',
              'mode':'witness-local-json-roundtrip',
              'module_file':'<titan-active-witness-observed-clone-bridge>',
              'source_absent':True,
          }
          assert row['emission_guard']['selection_emission']['missing']=={'MILK':1}
          PY
          } >"$proof_log" 2>&1
          status=$?
          cat "$proof_log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish exact hosted failure receipt
        if: steps.proof.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 "$RUNNER_TEMP/active-proof.log" "$FAILURE_LOG"
          git config user.name "woahwhattheheck"
          git config user.email "brycembusiness2@gmail.com"
          git add "$FAILURE_LOG"
          git commit -m "test(titan): retain active-consumer hosted failure receipt [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1

      - name: Commit only the authenticated permanent carrier
        if: steps.proof.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "woahwhattheheck"
          git config user.email "brycembusiness2@gmail.com"
          git add "$CASE/README.md" \
                  "$CASE/active_witness.py" \
                  "$CASE/test_active_consumer.py" \
                  "$NOTE" \
                  "$WORKFLOW" \
                  "$PAYLOAD"
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = \
            ".github/titan-v3-slot-active-consumer-repair-payload.tar.gz .github/workflows/titan-v3-slot-active-consumer-sol-pro.yml p/sol-pro-titan-v3-cross-product-slot-active-consumer-20260910-01.md revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/README.md revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/active_witness.py revenue/kaggriculture/cloud-execution-lab/analysis/v3-slot-active-consumer-sol-pro/test_active_consumer.py "
          git commit -m "test(titan): close active witness dependency and emission custody [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
