name: astra-titan-v4-decorator-probe

on:
  push:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize pinned archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          lab = pathlib.Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3')
          archive = pathlib.Path('revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz')
          pinned = json.loads((lab / 'V3-MANIFEST.json').read_text())['base']['sha256']
          historical = f'revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-{pinned}.tar.gz'
          def digest(data): return hashlib.sha256(data).hexdigest()
          def cat(ref, path):
              p = subprocess.run(['git','cat-file','-e',f'{ref}:{path}'], capture_output=True)
              return None if p.returncode else subprocess.check_output(['git','cat-file','blob',f'{ref}:{path}'])
          chosen = None
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          for label, data in [('HEAD current', cat(head, str(archive)))]:
              if data is not None and digest(data) == pinned:
                  chosen = data
          if chosen is None:
              subprocess.run(['git','fetch','--no-tags','--filter=blob:none','origin','main'], check=True)
              main = subprocess.check_output(['git','rev-parse','FETCH_HEAD'], text=True).strip()
              for label, data in [('main historical', cat(main, historical)), ('main current', cat(main, str(archive)))]:
                  if data is not None and digest(data) == pinned:
                      chosen = data
                      break
          if chosen is None:
              raise SystemExit(f'cannot materialize pin {pinned}')
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_bytes(chosen)
          print('ARCHIVE_OK', pinned, len(chosen))
          PY
      - name: Inspect materialized TitanAgent decorator shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, pathlib, sys
          lab = pathlib.Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3').resolve()
          sys.path.insert(0, str(lab))
          import build_v3
          files = build_v3.package_files()
          src = files['titan_runtime.py'].decode('utf-8')
          tree = ast.parse(src, filename='titan_runtime.py')
          classes = [n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'TitanAgent']
          if not classes:
              raise SystemExit('NO_TITAN_AGENT')
          cls = classes[-1]
          methods = [n for n in cls.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == '_seller_state']
          if not methods:
              raise SystemExit('NO_SELLER_STATE')
          fn = methods[-1]
          print('SELLER_STATE_DECORATORS', [ast.unparse(d) for d in fn.decorator_list])
          print('SELLER_STATE_DECORATOR_AST', [ast.dump(d, include_attributes=False) for d in fn.decorator_list])
          print('SELLER_STATE_SIGNATURE', ast.unparse(fn).split(':',1)[0])
          decorator_names = {d.id for d in fn.decorator_list if isinstance(d, ast.Name)}
          for name in sorted(decorator_names):
              binders = []
              for n in tree.body:
                  if isinstance(n, (ast.Assign, ast.AnnAssign, ast.AugAssign, ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef, ast.Import, ast.ImportFrom)):
                      text = ast.unparse(n)
                      if name in text:
                          binders.append((getattr(n,'lineno',None), type(n).__name__, text[:180]))
              print('DECORATOR_MODULE_BINDERS', name, binders)
          calls = []
          for n in ast.walk(cls):
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr == '_seller_state':
                  calls.append(ast.unparse(n.func))
          print('SELLER_STATE_CALL_FORMS', sorted(set(calls)))
          reachable_decorated = []
          for n in cls.body:
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.decorator_list:
                  reachable_decorated.append((n.name, [ast.unparse(d) for d in n.decorator_list]))
          print('ALL_DECORATED_TITAN_METHODS', reachable_decorated)
          PY
