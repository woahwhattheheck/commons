name: RFP clarification questions

on:
  pull_request:
    paths:
      - "revenue/rfp_clarification_questions/**"
      - "revenue/procurement_solicitation_ingest/**"
      - ".github/workflows/rfp-clarification-questions.yml"
  push:
    branches: [main]
    paths:
      - "revenue/rfp_clarification_questions/**"
      - "revenue/procurement_solicitation_ingest/**"
      - ".github/workflows/rfp-clarification-questions.yml"

permissions:
  contents: read

concurrency:
  group: rfp-clarification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile revenue/rfp_clarification_questions/_core.py revenue/rfp_clarification_questions/_rows.py revenue/rfp_clarification_questions/_render.py revenue/rfp_clarification_questions/_engine.py revenue/rfp_clarification_questions/compiler.py revenue/rfp_clarification_questions/_test_support.py revenue/rfp_clarification_questions/test_compiler.py revenue/rfp_clarification_questions/test_dedupe.py revenue/rfp_clarification_questions/test_hostile.py
      - name: Focused tests
        run: python -m unittest -v revenue.rfp_clarification_questions.test_compiler revenue.rfp_clarification_questions.test_dedupe revenue.rfp_clarification_questions.test_hostile
      - name: Focused tests optimized
        run: python -O -m unittest -v revenue.rfp_clarification_questions.test_compiler revenue.rfp_clarification_questions.test_dedupe revenue.rfp_clarification_questions.test_hostile
