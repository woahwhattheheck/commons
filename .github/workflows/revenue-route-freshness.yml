name: revenue-route-freshness

on:
  pull_request:
    paths:
      - "apps/revenue_route_freshness/**"
      - ".github/workflows/revenue-route-freshness.yml"
  push:
    branches: [main]
    paths:
      - "apps/revenue_route_freshness/**"
      - ".github/workflows/revenue-route-freshness.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile apps/revenue_route_freshness/gate.py
      - name: Unit + hostile tests
        env: {PYTHONPATH: .}
        run: python -m unittest discover -s apps/revenue_route_freshness/tests -v
      - name: Optimized-mode predecessor killers
        env: {PYTHONPATH: .}
        run: python -O -m unittest discover -s apps/revenue_route_freshness/tests -v
      - name: Fixture decisions
        env: {PYTHONPATH: .}
        run: |
          python -m apps.revenue_route_freshness.gate apps/revenue_route_freshness/fixtures/ready.json | grep '"decision": "READY_FOR_MUSE_CENSUS"'
          python -m apps.revenue_route_freshness.gate apps/revenue_route_freshness/fixtures/dead_route.json | grep '"decision": "DEAD_ROUTE"'
