name: TITAN V3.1 fert-hand L3 fail-closed staging r6 struct-safe

on:
  pull_request:
    branches:
      - astra/v31-a612-restore-5f6-canonical-archive-20260911
    paths:
      - '.github/workflows/titan-v31-8e3-l3-failclosed-bootstrap-r2.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/**'

permissions:
  contents: read

jobs:
  current-fert-hand-compatibility:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact feature head read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind fert-hand P0, gameplay canonical, live control-plane tip, and Struct-safe reviewed donors
        shell: bash
        run: |
          set -euo pipefail
          BASE='46ade0009190124221cff5fd13e6bcb3f2126ac0'
          BASE_REF='astra/v31-a612-restore-5f6-canonical-archive-20260911'
          GAMEPLAY_CANONICAL='720c125c29faec426ebc0000f8d5e9dcdc07a827'
          CANONICAL_REF='refs/heads/titan/v3.1-20260911'
          EXPECTED_HEAD='${{ github.event.pull_request.head.sha }}'
          HEAD_REF='${{ github.event.pull_request.head.ref }}'
          V3='revenue/kaggriculture/cloud-execution-lab/candidates/v3'
          PATCH="$V3/experiments/l3_failclosed_consume_8e3/repair.patch"
          DONOR_TEST="$V3/experiments/l3_failclosed_consume_8e3/test_failclosed.py"
          ROUTER="$V3/overlay/r04_full_router.py"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$BASE_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git merge-base "$GAMEPLAY_CANONICAL" "$BASE")" = "$GAMEPLAY_CANONICAL"

          # The canonical branch may advance for CI/control-plane maintenance without
          # changing TITAN gameplay. Bind the live tip, then prove every delta from
          # the reviewed gameplay anchor is confined to the collision-listener file.
          git fetch --no-tags origin "$CANONICAL_REF"
          CANONICAL_TIP="$(git rev-parse FETCH_HEAD)"
          test "$(git merge-base "$GAMEPLAY_CANONICAL" "$CANONICAL_TIP")" = "$GAMEPLAY_CANONICAL"
          CONTROL_DELTA="$(git diff --name-only "$GAMEPLAY_CANONICAL".."$CANONICAL_TIP")"
          if [ -n "$CONTROL_DELTA" ]; then
            test "$CONTROL_DELTA" = '.github/workflows/pr-collision-notice.yml'
          fi
          test "$(git rev-parse "$CANONICAL_TIP:$ROUTER")" = '743185916233aeed41bedc8acfb8b61615ee7f4a'
          test "$(git rev-parse "$CANONICAL_TIP:$V3/build_v3.py")" = 'ec02a9ba52abc22ff9ec5aac3ea2351d80d1761d'
          echo "L3_R6_GAMEPLAY_CANONICAL=$GAMEPLAY_CANONICAL"
          echo "L3_R6_LIVE_CANONICAL_TIP=$CANONICAL_TIP"
          echo "L3_R6_CONTROL_DELTA=${CONTROL_DELTA:-<none>}"

          test "$(git rev-parse "$BASE:$ROUTER")" = '743185916233aeed41bedc8acfb8b61615ee7f4a'
          test "$(git rev-parse "$BASE:$V3/build_v3.py")" = '528cfabbe377f829cb584726c41bd2f64061373b'
          test "$(git hash-object "$PATCH")" = '84becf2f6135e2d9155863cf6887a340a7852dba'
          test "$(git hash-object "$DONOR_TEST")" = 'eeb07459a70a30eae689fc3e706d31b1916a6d97'
          git diff --name-only "$BASE"..HEAD > /tmp/l3-r6-staging-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/l3-r6-staging-paths.txt').read_text().splitlines())
          expected = {
              '.github/workflows/titan-v31-8e3-l3-failclosed-bootstrap-r2.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/repair.patch',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/test_failclosed.py',
          }
          if actual != expected:
              raise SystemExit(f'L3 r6 staging scope drift: {sorted(actual)!r}')
          print('L3_R6_STAGING_SCOPE_OK', len(actual))
          PY
          git diff --check "$BASE"..HEAD

      - name: Apply only the Struct-safe reviewed L3 repair
        shell: bash
        run: |
          set -euo pipefail
          V3='revenue/kaggriculture/cloud-execution-lab/candidates/v3'
          PATCH="$V3/experiments/l3_failclosed_consume_8e3/repair.patch"
          DONOR_TEST="$V3/experiments/l3_failclosed_consume_8e3/test_failclosed.py"
          ROUTER="$V3/overlay/r04_full_router.py"
          PROD_TEST="$V3/overlay/checks/test_v3_r04_l3_rival_gate.py"
          git apply --check "$PATCH"
          git apply "$PATCH"
          cp "$DONOR_TEST" "$PROD_TEST"
          test "$(git hash-object "$PROD_TEST")" = 'eeb07459a70a30eae689fc3e706d31b1916a6d97'
          python3 -m py_compile "$ROUTER" "$PROD_TEST"

      - name: Run fail-closed source contracts on Kaggle-shaped Struct fixtures
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v overlay/checks/test_v3_r04_l3_rival_gate.py |& tee /tmp/l3-r6-source-tests.log
          grep -F 'Ran 17 tests' /tmp/l3-r6-source-tests.log
          grep -F 'OK' /tmp/l3-r6-source-tests.log

      - name: Rebuild current fert-hand stack under normal and optimized Python
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B build_v3.py | tee /tmp/l3-r6-build.log
          python -B build_v3.py --check | tee /tmp/l3-r6-check.log
          PYTHONOPTIMIZE=1 python -B build_v3.py --check | tee /tmp/l3-r6-opt-check.log
          grep -F 'V3 CHECK OK' /tmp/l3-r6-check.log
          grep -F 'V3 CHECK OK' /tmp/l3-r6-opt-check.log
          rm -rf /tmp/l3-r6-tree
          python -B build_v3.py --tree /tmp/l3-r6-tree
          (
            cd /tmp/l3-r6-tree
            python -B -m unittest -v checks/test_v3_r04_l3_rival_gate.py |& tee /tmp/l3-r6-tree-tests.log
          )
          grep -F 'Ran 17 tests' /tmp/l3-r6-tree-tests.log
          grep -F 'OK' /tmp/l3-r6-tree-tests.log
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('/tmp/l3-r6-tree/TITAN-CONFIG.json').read_text())
          expected = {
              'r04_strawberry_topup': True,
              'r04_no_late_sale_advance': True,
              'r04_no_late_sale_advance_step': 648,
              'r04_sale_fertilizer': True,
              'r04_cattle_early': True,
              'r04_sale_horizon': 8,
              'r04_b5_carrot_fertilizer': True,
              'r04_b5_jit_fertilize': True,
              'r04_fert_hand': True,
          }
          for key, wanted in expected.items():
              got = cfg.get(key)
              if type(got) is not type(wanted) or got != wanted:
                  raise SystemExit(f'{key}: {got!r} != {wanted!r}')
          print('L3_R6_FERT_HAND_TUPLE_OK')
          PY
          rm -rf dist /tmp/l3-r6-tree

      - name: Terminal freshness rebind
        shell: bash
        run: |
          set -euo pipefail
          BASE='46ade0009190124221cff5fd13e6bcb3f2126ac0'
          BASE_REF='astra/v31-a612-restore-5f6-canonical-archive-20260911'
          GAMEPLAY_CANONICAL='720c125c29faec426ebc0000f8d5e9dcdc07a827'
          CANONICAL_REF='refs/heads/titan/v3.1-20260911'
          EXPECTED_HEAD='${{ github.event.pull_request.head.sha }}'
          HEAD_REF='${{ github.event.pull_request.head.ref }}'
          V3='revenue/kaggriculture/cloud-execution-lab/candidates/v3'
          ROUTER="$V3/overlay/r04_full_router.py"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$BASE_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git merge-base "$GAMEPLAY_CANONICAL" "$BASE")" = "$GAMEPLAY_CANONICAL"
          git fetch --no-tags origin "$CANONICAL_REF"
          CANONICAL_TIP="$(git rev-parse FETCH_HEAD)"
          test "$(git merge-base "$GAMEPLAY_CANONICAL" "$CANONICAL_TIP")" = "$GAMEPLAY_CANONICAL"
          CONTROL_DELTA="$(git diff --name-only "$GAMEPLAY_CANONICAL".."$CANONICAL_TIP")"
          if [ -n "$CONTROL_DELTA" ]; then
            test "$CONTROL_DELTA" = '.github/workflows/pr-collision-notice.yml'
          fi
          test "$(git rev-parse "$CANONICAL_TIP:$ROUTER")" = '743185916233aeed41bedc8acfb8b61615ee7f4a'
          test "$(git rev-parse "$CANONICAL_TIP:$V3/build_v3.py")" = 'ec02a9ba52abc22ff9ec5aac3ea2351d80d1761d'
          echo "L3_R6_STRUCT_SAFE_TERMINAL_FRESHNESS_OK gameplay=$GAMEPLAY_CANONICAL canonical_tip=$CANONICAL_TIP"
