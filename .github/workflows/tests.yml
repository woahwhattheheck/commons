  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # New automatic batteries supersede older runs for the same event/ref.
  # Each manual dispatch has its own group and survives later branch pushes.
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}"
  cancel-in-progress: true
jobs:
  battery:
    # Engine battery is the Commons publisher suite for main.
    # Frozen titan composition PRs add dedicated path-scoped gates; running
    # live-pin KEEP/readback tests against that snapshot is a false red.
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          # Several live-tree contracts classify exact ancestors and inspect
          # historical source objects. A depth-1 checkout turns those lawful
          # lookups into FOREIGN/NOT_LANDED false negatives.
          fetch-depth: 0

      - name: the whole battery, one failure fails the run
        id: battery
        run: |
          python3 host/ci_battery.py --results "$RUNNER_TEMP/commons-battery-results.nul"

      - name: a test file that vanished is a hole, not a pass
        run: |
          # Deleting a test is the cheapest way to make CI green and the most
          # expensive mistake in the repo. Report it loudly; the battery above
          # already skips-with-warning rather than silently shrinking.
          n=$(
            {
              find . -maxdepth 1 -type f \( -name 'test_*.py' -o -name 'test_*.js' \) -print
              find infra -type f -name 'test_*.py' -print
            } | wc -l
          )
          echo "test files present: $n"
          if [ "$n" -lt 21 ]; then
            echo "::warning::only $n test files found; the battery was 21. A test was removed or renamed."
            {
              echo "## TEST COUNT DROPPED"
              echo "Found **$n** test files; the battery was 21."
              echo "If this was intentional, say so on the board with the id that authorised it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: record checkout-linked battery results
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: >-
          python3 host/battery_report.py
          --results "$RUNNER_TEMP/commons-battery-results.nul"
          --output "$RUNNER_TEMP/commons-battery-report.json"
          --summary "$GITHUB_STEP_SUMMARY"
          --outcome "${{ steps.battery.outcome }}"

      - name: upload checkout-linked battery results
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: battery-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commons-battery-report.json
          if-no-files-found: error
          retention-days: 14

  runtime-provenance:
    name: runtime-provenance
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run retained runtime-provenance gate
        run: python -m unittest -v test_runtime_provenance.py

      - name: Run retained runtime-provenance gate under optimized Python
        run: python -O -m unittest -v test_runtime_provenance.py

      - name: Verify canonical registry
        run: python -m tools.runtime_provenance.runtime_registry verify runtime/agent_runtime_registry.json

      - name: Emit canonical registry digest
        run: python -m tools.runtime_provenance.runtime_registry digest runtime/agent_runtime_registry.json

  opencv-visual-evidence:
    name: opencv-visual-evidence (${{ matrix.python-version }})
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect OpenCV proof-surface changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          if git diff --name-only "$base" "$head" -- \
              'competitions/opencv-ai-2026/visual-evidence-gate/**' \
              'test_opencv_visual_evidence_gate.py' \
              '.github/workflows/tests.yml' \
              '.github/workflows/opencv-visual-evidence-gate.yml' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install isolated OpenCV test runtime
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: python -m pip install --disable-pip-version-check -r competitions/opencv-ai-2026/visual-evidence-gate/requirements-test.txt

      - name: Compile source
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: python -m py_compile competitions/opencv-ai-2026/visual-evidence-gate/visual_gate.py competitions/opencv-ai-2026/visual-evidence-gate/aws_lambda.py competitions/opencv-ai-2026/visual-evidence-gate/evaluate.py test_opencv_visual_evidence_gate.py

      - name: Normal hostile proof
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: PYTHONNOUSERSITE=1 python test_opencv_visual_evidence_gate.py

      - name: Optimized hostile proof
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: PYTHONNOUSERSITE=1 python -O test_opencv_visual_evidence_gate.py

      - name: Synthetic evaluation truth ceiling
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          PYTHONNOUSERSITE=1 python competitions/opencv-ai-2026/visual-evidence-gate/evaluate.py > /tmp/eval.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/eval.json'))
          assert d['passed'] == 4
          assert d['success_ppm'] == 1_000_000
          assert d['claims']['natural_video_accuracy_measured'] is False
          assert d['claims']['aws_runtime_evidenced'] is False
          assert d['claims']['competition_submission_evidenced'] is False
          PY

  non-main-base:
    if: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: engine battery stays on main
        run: |
          echo "Commons engine battery is scoped to main."
          echo "This PR targets ${{ github.base_ref }}; dedicated path-scoped gates bind this head."
          echo "Live-pin KEEP/readback tests are not titan composition proof."
