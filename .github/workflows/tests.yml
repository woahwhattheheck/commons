name: crm6-freshness-verification
on:
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        default: '305b07297f5e75a946fe5aab14ad1d87cce5ffea'
      phase:
        required: true
        type: choice
        options: [test, audit]
        default: test
      proof_run:
        required: false
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 100
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /host/
            /revenue/
            /p/
            /features/registry/
            /tests/test_ledger_crm6_composed_at_freshness_gate.py
            /test_lm_gtm_index.py
            /test_lm_gtm_relationship_handoff.py
            /test_lm_gtm_handoff_provenance.py
            /lm-gtm-index.html
            /fix_first.py
      - name: Run changed behavior and existing CRM6 contracts once
        if: inputs.phase == 'test'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 305b07297f5e75a946fe5aab14ad1d87cce5ffea HEAD
          python3 -m unittest -v tests/test_ledger_crm6_composed_at_freshness_gate.py test_lm_gtm_index.py test_lm_gtm_relationship_handoff.py test_lm_gtm_handoff_provenance.py
          python3 host/lm_gtm_index.py validate
          git status --porcelain=v1 --untracked-files=all
      - name: Verify exact tested bytes on current main
        if: inputs.phase == 'audit'
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN: ${{ inputs.proof_run }}
        run: |
          set -euo pipefail
          git fetch --depth=100 origin main
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          paths = ["host/lm_gtm_index.py","host/lm_gtm_relationship_handoff.py","revenue/lm_gtm_index/README.md","revenue/lm_gtm_index/state.json","tests/test_ledger_crm6_composed_at_freshness_gate.py","p/ledger-crm6-composed-at-freshness-gate-20260905-01.md","features/registry/ledger-crm6-composed-at-freshness-gate-20260905-01.json"]
          proof_id = os.environ["PROOF_RUN"]
          assert proof_id.isdigit()
          request = urllib.request.Request("https://api.github.com/repos/woahwhattheheck/commons/actions/runs/" + proof_id, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              proof = json.load(response)
          assert proof["conclusion"] == "success", "cached focused run must have succeeded"
          for path in paths:
              tested = subprocess.check_output(["git", "rev-parse", "305b07297f5e75a946fe5aab14ad1d87cce5ffea:" + path], text=True).strip()
              checked = subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip()
              current = subprocess.check_output(["git", "rev-parse", "origin/main:" + path], text=True).strip()
              assert tested == checked == current, path
              print("READBACK", path, current)
          subprocess.run(["git", "merge-base", "--is-ancestor", "305b07297f5e75a946fe5aab14ad1d87cce5ffea", "origin/main"], check=True)
          dirty = subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True).strip()
          assert not dirty, dirty
          main_sha = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          packet = {"outcome": "fixed", "observed_broken": True, "expected_contract": "Published CRM6 freshness implementation did not execute; existing twelve-hour warning needs an executable source-age report.", "changed_paths": paths, "tests": ["Focused CRM6 tests and actual CLI passed in Actions run " + proof_id], "main_sha": main_sha, "readback_verified": True}
          subprocess.run(["python3", "fix_first.py", "--json", json.dumps(packet)], check=True)
          print(json.dumps({"state": "LANDED", "work_sha": "305b07297f5e75a946fe5aab14ad1d87cce5ffea", "main_sha": main_sha, "readback_paths": len(paths), "dirty": False, "cached_test_run": proof_id}))
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit 305b07297f5e75a946fe5aab14ad1d87cce5ffea --required-path host/lm_gtm_index.py --required-path host/lm_gtm_relationship_handoff.py
