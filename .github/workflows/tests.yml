name: coordination-merge-verification
on:
  workflow_dispatch:
    inputs:
      verify_ref:
        description: Exact candidate or main ref to verify
        required: true
        default: 'main'
      expected_landed:
        description: Landed commit for the terminal audit; blank for preflight
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verify_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact integration classification
        run: |
          python3 - <<'PY'
          import json, subprocess
          from host.sprint_integration import classify_pair
          def git(*args):
              return subprocess.check_output(["git", *args])
          base = "27580fd0517083655c644b04de60393872118f78"
          candidate = "df62f014c1e26b9912754e5a59c376142c36e6f1"
          target = git("rev-parse", "origin/main").decode().strip()
          paths = git("diff", "--name-only", base, candidate).decode().splitlines()
          def snapshot(ref):
              return {p: git("show", ref + ":" + p) for p in paths}
          result = classify_pair(snapshot(base), snapshot(target), snapshot(candidate), meta={
              "base_sha": base, "left_sha": target, "right_sha": candidate,
              "left_label": "main", "right_label": "Autopsy intake source repair"
          })
          print(json.dumps(result, indent=2))
          assert result["verdict"] != "CONFLICT"
          PY
      - name: Landed presence, diagnostic role, and navigation checks
        run: |
          python3 test_digit_pixel_presence.py
          python3 integrations/transferable_roles/test_roles.py
          node test_door_hub.js
          python3 -m unittest -q test_right_now test_right_now_execution test_survival_offer_page_truth
          python3 host/right_now_revenue.py validate
      - name: Audit landed commit and required paths
        if: inputs.expected_landed != ''
        env:
          EXPECTED_LANDED: ${{ inputs.expected_landed }}
        run: |
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --repo . --target-ref origin/main --expected-commit "$EXPECTED_LANDED" --required-path revenue/agent_failure_autopsy/INTAKE.md --required-path revenue/production_survival/INTAKE.md --required-path pixels/DIGIT.json --required-path integrations/transferable_roles/fixtures/synthetic_diagnostic_fulfillment_role.json --required-path test_door_hub.js
