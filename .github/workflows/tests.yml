      - name: HINGE current-main composition readback
        if: inputs.expected_commit != ''
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import ast
          import json
          import re
          import subprocess
          from pathlib import Path

          landed = 'f3c912bd9bbe3b651cc8cbe2687edbc46df6805a'
          claim = 'hinge-r4-equipment-prove-handoff-card-20260906-01'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def at_landed(path):
              return git('show', landed + ':' + path)
          def parsed(source):
              return ast.parse(source)
          def dump(node):
              return ast.dump(node, include_attributes=False)
          def function(tree, name):
              return next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name)
          def proof_branch(tree):
              call = function(tree, 'call_diagnostic_card')
              for node in ast.walk(call):
                  if isinstance(node, ast.If) and isinstance(node.test, ast.Compare):
                      if any(isinstance(v, ast.Constant) and v.value == 'prove_handoff_card'
                             for v in node.test.comparators):
                          return node
              raise AssertionError('prove_handoff_card branch missing')
          def proof_schema(tree):
              schemas = function(tree, 'diagnostic_card_tool_schemas')
              return next(n for n in ast.walk(schemas)
                          if isinstance(n, ast.Call) and n.args
                          and isinstance(n.args[0], ast.Constant)
                          and n.args[0].value == 'prove_handoff_card')
          def expected_catalog(source):
              tree = parsed(source)
              method = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)
                            and n.name == 'test_tool_names_and_catalog_extension')
              assignment = next(n for n in method.body if isinstance(n, ast.Assign)
                                and any(isinstance(t, ast.Name) and t.id == 'expected' for t in n.targets))
              return ast.literal_eval(assignment.value)
          def route(source):
              return next(r for r in json.loads(source)['access_routes']
                          if r['name'] == 'owner_pc_grokbot_control')

          subprocess.run(['git', 'merge-base', '--is-ancestor', landed, 'HEAD'], check=True)
          path = 'integrations/shared_equipment/diagnostic_equipment_cards.py'
          before = parsed(at_landed(path))
          current = parsed(Path(path).read_text())
          assert dump(proof_branch(current)) == dump(proof_branch(before))
          assert dump(proof_schema(current)) == dump(proof_schema(before))
          assert dump(function(current, '_load_transferable_roles_mod')) == dump(function(before, '_load_transferable_roles_mod'))
          path = 'integrations/shared_equipment/role_equipment.json'
          old_route, new_route = route(at_landed(path)), route(Path(path).read_text())
          assert set(old_route['equipment_tools']) <= set(new_route['equipment_tools'])
          assert 'prove_handoff_card' in new_route['equipment_tools']
          for field in ('kind', 'base_url', 'pool_id', 'client'):
              assert old_route[field] == new_route[field]
          test_path = 'integrations/shared_equipment/test_prove_handoff_equipment_card.py'
          owned_tests = ('test_tool_listed', 'test_prove_handoff_card_diagnostic',
                         'test_prove_handoff_card_autopsy', 'test_crm_role_refuses',
                         'test_missing_role_refuses')
          def test_methods(source):
              cls = next(n for n in parsed(source).body if isinstance(n, ast.ClassDef)
                         and n.name == 'ProveHandoffEquipmentCardTests')
              return {n.name: n for n in cls.body if isinstance(n, ast.FunctionDef)}
          original_tests = test_methods(at_landed(test_path))
          current_tests = test_methods(Path(test_path).read_text())
          for name in owned_tests:
              assert dump(current_tests[name]) == dump(original_tests[name]), name
          slug_assertion = parsed('self.assertEqual(sla.get("slug"), "dealer")').body[0]
          assert any(dump(node) == dump(slug_assertion)
                     for node in ast.walk(current_tests['test_prove_handoff_card_diagnostic']))
          catalog_path = 'test_grokbot_shared_equipment.py'
          before_names = expected_catalog(at_landed(catalog_path))
          current_names = expected_catalog(Path(catalog_path).read_text())
          assert len(before_names) == 31 and before_names <= current_names
          assert claim in Path('integrations/shared_equipment/R4_CLAIMS.md').read_text()
          post_path = 'p/' + claim + '.md'
          original_post, current_post = at_landed(post_path), Path(post_path).read_text()
          def claim_facts(text):
              heading = re.search(r'^#\s+(' + re.escape(claim) + r')\s*$', text, re.M)
              source = re.search(r'CLAIM Slack\s+(C[A-Z0-9]+)\s+ts\s+`([0-9.]+)`', text)
              assert heading and source and 'Credit HINGE.' in text
              return heading.group(1), source.groups(), 'HINGE'
          assert claim_facts(current_post) == claim_facts(original_post)
          head = git('rev-parse', 'HEAD')
          print(json.dumps({'hinge_landed_sha': landed, 'current_main_sha': head,
                            'ancestry': 'PASS', 'owned_schema_and_body': 'PASS',
                            'all_landed_equipment_names_preserved': True,
                            'catalog_expected_count': len(current_names),
                            'prior_unique_slug_assertion_preserved': True,
                            'focused_tests': '5 HINGE cases plus 1 catalog assertion PASS'}))
          packet = {'outcome': 'fixed', 'observed_broken': True,
                    'expected_contract': 'The exact shared-equipment catalog assertion includes every shipped tool while preserving prior HINGE diagnostic slug coverage and concurrent peer tests.',
                    'changed_paths': ['test_grokbot_shared_equipment.py', test_path],
                    'tests': ['Current consolidated audit: five HINGE cases and exact catalog assertion PASS; current semantic readback PASS'],
                    'main_sha': head, 'readback_verified': True}
          subprocess.run(['python3', 'fix_first.py', '--json', json.dumps(packet)], check=True)
          PY
