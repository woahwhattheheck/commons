name: Listing completion packet verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  completion-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate actual integrated completion packet
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/woahwhattheheck/commons/69c0b5539799ba35bd9c0c1eba5d8b2b3595d0d3/fix_first.py --output "$RUNNER_TEMP/fix_first.py"
          python3 "$RUNNER_TEMP/fix_first.py" --json '{"outcome":"fixed","observed_broken":true,"expected_contract":"Listing exports must preserve the canonical Survival README route and retain Autopsy at agent-rescue.html","changed_paths":["host/listing_registry.py","test_listing_registry.py","revenue/listing_registry/registry.json","revenue/listing_registry/assets.json"],"tests":["33999517783: 23 listing tests, validate and self-test PASS"],"main_sha":"69c0b5539799ba35bd9c0c1eba5d8b2b3595d0d3","readback_verified":true}'
