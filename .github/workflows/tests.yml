name: current-main-pr-verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /integrations/
            /test_grokbot_control.py
            /test_grokbot_shared_equipment.py
            /test_grokbot_paid_case.py
            /revenue/agent_failure_autopsy/offer.json
            /revenue/agent_failure_autopsy/RUNBOOK.md
            /features/registry/spark-g2-autopsy-case-submit-helper-20260905-01.json
            /p/spark-g2-autopsy-case-submit-helper-20260905-01.md
            /test_agent_triage_autopsy_next_step.py
            /agent-triage.js
            /agent-triage.html
            /features/registry/spark-g2-paid-case-attribution-20260905-01.json
            /p/spark-g2-paid-case-attribution-20260905-01.md
            /p/quill-triage-autopsy-next-step-20260905-01.md
            /p/hinge-r4-autopsy-intake-seats-test-pins-20260905-01.md
      - name: Verify new batch on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 99b4e5b8f0d126f0e23032128b1a1ec28c3a3487 HEAD
          git rev-parse HEAD
          python3 test_grokbot_control.py
          python3 test_grokbot_shared_equipment.py
          python3 test_grokbot_paid_case.py
          python3 -m unittest -v test_agent_triage_autopsy_next_step
          python3 integrations/transferable_roles/test_roles.py
          python3 integrations/transferable_roles/test_autopsy_intake_seats_pointers.py
      - name: Verify legacy SQLite migration and durable case restart
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3, tempfile
          from integrations.grokbot_control.store import RunStore
          with tempfile.TemporaryDirectory() as directory:
              path = pathlib.Path(directory) / "legacy.sqlite3"
              with sqlite3.connect(path) as db:
                  db.execute("CREATE TABLE runs(run_id TEXT PRIMARY KEY, session_id TEXT NOT NULL, pool_id TEXT NOT NULL, seat TEXT NOT NULL, status TEXT NOT NULL, prompt TEXT NOT NULL, result_text TEXT, error TEXT, attribution_json TEXT, parent_run_id TEXT, created_at REAL NOT NULL, updated_at REAL NOT NULL)")
                  db.execute("INSERT INTO runs VALUES(?,?,?,?,?,?,?,?,?,?,?,?)", ("legacy","session","grokbot","TEST","completed","existing prompt","existing result",None,None,None,1.0,2.0))
              store = RunStore(path)
              legacy = store.get_run("legacy")
              assert legacy["prompt"] == "existing prompt" and legacy["result_text"] == "existing result" and legacy["case"] is None
              created = store.create_run(pool_id="grokbot", seat="TEST", prompt="new", case={"offer_id":"offer-test","case_ref":"opaque-test"})
              run_id = created["run_id"]
              store.close()
              reopened = RunStore(path)
              assert reopened.get_run(run_id)["case"] == {"offer_id":"offer-test","case_ref":"opaque-test"}
              assert reopened.get_run("legacy")["result_text"] == "existing result"
              reopened.close()
          print("LEGACY_MIGRATION_AND_CASE_RESTART_PASS")
          PY
      - name: Exercise actual triage browser script
        run: |
          node - <<'JS'
          const fs = require('fs'), vm = require('vm'), assert = require('assert');
          const nodes = new Map();
          const node = id => {
            if (!nodes.has(id)) nodes.set(id,{value:'', hidden:true, addEventListener(type,fn){ this[type] = fn; }});
            return nodes.get(id);
          };
          vm.runInNewContext(fs.readFileSync('agent-triage.js','utf8'), {document:{getElementById:node},navigator:{}});
          node('expected-outcome').value = 'finish once';
          node('observed-failure').value = 'retry loop';
          node('triage-form').submit({preventDefault(){}});
          let packet = JSON.parse(node('triage-json').value);
          assert.strictEqual(packet.paid_next_step.id,'agent-failure-autopsy-29');
          assert.strictEqual(packet.paid_next_step.price,'$29');
          assert.strictEqual(packet.paid_next_step.href,'./agent-rescue.html');
          assert.ok(node('triage-markdown').value.includes('**retry loop**.'));
          assert.strictEqual(packet.telemetry,false);
          node('observed-failure').value = 'lost state after restart';
          node('triage-form').submit({preventDefault(){}});
          packet = JSON.parse(node('triage-json').value);
          assert.strictEqual(packet.paid_next_step.id,'ho-agent-failure-diagnostic');
          assert.strictEqual(packet.paid_next_step.price,'$199');
          console.log('TRIAGE_REAL_SCRIPT_OFFER_AND_MARKDOWN_PASS');
          JS
      - name: Current-main readback and clean terminal audit
        run: |
          set -euo pipefail
          git fetch --depth=100 origin main
          python3 - <<'PY'
          import subprocess
          paths = ["integrations/grokbot_control/paid_case.py","integrations/grokbot_control/__init__.py","test_grokbot_paid_case.py","revenue/agent_failure_autopsy/offer.json","revenue/agent_failure_autopsy/RUNBOOK.md","features/registry/spark-g2-autopsy-case-submit-helper-20260905-01.json","p/spark-g2-autopsy-case-submit-helper-20260905-01.md","integrations/grokbot_control/store.py","integrations/grokbot_control/gateway.py","integrations/grokbot_control/client.py","integrations/grokbot_control/README.md","integrations/shared_equipment/peers.py","test_grokbot_control.py","test_grokbot_shared_equipment.py","features/registry/spark-g2-paid-case-attribution-20260905-01.json","p/spark-g2-paid-case-attribution-20260905-01.md","agent-triage.js","agent-triage.html","test_agent_triage_autopsy_next_step.py","p/quill-triage-autopsy-next-step-20260905-01.md","integrations/transferable_roles/test_roles.py","integrations/transferable_roles/test_autopsy_intake_seats_pointers.py","p/hinge-r4-autopsy-intake-seats-test-pins-20260905-01.md"]
          for path in paths:
              expected = subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              actual = subprocess.check_output(["git","rev-parse","origin/main:"+path],text=True).strip()
              assert actual == expected,path
              print("READBACK",path,actual)
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit 99b4e5b8f0d126f0e23032128b1a1ec28c3a3487 --required-path integrations/grokbot_control/store.py --required-path agent-triage.js --required-path integrations/transferable_roles/test_roles.py
