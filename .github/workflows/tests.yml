          inputs = {"carrier.js":"d705dffc848e1b4dfc8fb8a3ce6b0647802f8553","distribution.html":"92d8a7cce05734326a4dd3a175ffcb641c1e43d9","docs/TITAN_HANDS.md":"f0cea0dd009bbc63fb6f93e142a2494428fbff11","evidence/README.md":"bbdf2fdd9a971ce5d84b556f784e4249b150e698","excerpts/20260828/ringdelta_xor8.mno":"d1ba9f0321797eafb963bab6e7a806f35e9b398d","features/registry/feature-tracker-20260828-01.json":"04adae2ff83c48422272581f7eb2c85801440e78","ground/03_EVIDENCE_ANNEX.md":"881315c45212c41bd74892b075af24b97fa4d7de","ground/DISTRIBUTION.md":"d67e594295248744eb87d7535ceacb3131522418","ground/FEATURES.md":"b41e7fc5e2d2abff32caa1f340f464dd4cc6b2c8","ground/FEATURE_TRACKER.md":"0076d16807ae1d2f315cc83da6a83432ba67ffdb","ground/RESOURCE_LEDGER.json":"76ab92547c9111cd5524350a2215202c7524edf5","ground/RINGDELTA.json":"799dd3ef5ef19e8b6112a707bf68dc712390e6d0","ground/RINGDELTA.md":"cb1cd479634596aee893302a67f6e14788a6ab94","ground/SWARM.md":"d70f02e238066facc3677fada5caa43126369cdc","ground/TRUST.md":"182ac8aeb75156985f9073e9ec342b590543ebcc","host/distribution.py":"cf93d28991340fb9efa00a37a899627c50d7f9fb","host/feature_tracker.py":"d5b29a776b8934348c89aeeb829db518b2af4a86","host/opportunity_registry.py":"61c10232b61568c910e1fe083182bb76aee4320b","host/resource_ledger.py":"db37296595ac702a0ae7605cca2399f1423b3904","host/ringdelta.py":"3a39aaea8e355b3083a07930b2926539e4d02b8d","host/titan_hands/linux_atspi.py":"ad32dc3cd9ee6c220a145e792db66052be2ab9be","host/titan_hands/one_tool.py":"c4461c16899eeb037b0e27799c398be04597693e","host/trust_cache.py":"b57ef2a5c1e045fcb360098ec8e0f35eb3cf047b","p/bernays-production-survival-operating-system-20260826-01.md":"932df06f38bb0e72bb17313de41340ace754fa79","p/coil-titan-hands-linux-atspi-land-20260827-01.md":"f3cd288a09c0d46ac7b622dcf17eb127b79464e5","p/emissary-titan-hands-features-20260826-01.md":"25abe9abfae9b8b28c08e1e570493220afecf701","p/grok-distribution-layer-20260828-01.md":"fedf2c16085be01a6e5be47c4ed72be7669a58b1","resources.html":"c396e44c2e342c9e1f7453490183af9e4825e2e0","revenue/distribution/channels.json":"c0254ba55f316f9d6619471d14c1dc8c4024947a","revenue/ip/collaboration_targets.json":"830baa1ca1f1566292611421825623fa12320c33","revenue/ip/grants_ledger.json":"2ec1c948a18ab787b6ae635ce34eb51357df4c64","revenue/ip/opportunity_seed.json":"887f36c3df917b79266b2cee81bda141f1f65c0b","revenue/ip/whitebox_collaboration_offers.json":"2beb6bf61d8fb04dc6fb0d74094717db488789b3","revenue/listing_registry/registry.json":"1ba273bbc57fcabf696bc439ff464ab0064e897f","ringdelta.html":"b6da96877b7ccd6142943a57e5699185156c12b9","swarm-mail.html":"e8cdfd84fbea36dc709e5dc5249e66a27c497097","test_feature_tracker.py":"7ee1b9898cdd77fbaa10ed044819e91f6c30132e","test_opportunity_registry.py":"fa655605a05da110ff5d25b2755f9e33fa02df91","titan-hands.html":"36dec29b989c07d4f6a3198dee7ad345d624c227","titan-hour.html":"64e8939d49c512247bb3810e28322a9632ed6661","trust.html":"f1c1853c54b4d9c8142256c414f8e4ad0b30f025"}
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          for commit in (tested, landed):
              subprocess.run(['git', 'merge-base', '--is-ancestor', commit, 'origin/main'], check=True)
          for path, blob in expected.items():
