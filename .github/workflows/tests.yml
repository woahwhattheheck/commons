name: Listing route focused verification
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
        default: codex/listing-survival-route-20260905-01
      regenerate:
        type: boolean
        default: true
      expected_commit:
        type: string
        default: ''
permissions:
  contents: write
jobs:
  listing-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REPAIR_BRANCH: codex/listing-survival-route-20260905-01
      TARGET_REF: ${{ inputs.target_ref }}
      REGENERATE: ${{ inputs.regenerate }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      AUDIT_SCRIPT_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate canonical listing exports
        if: inputs.regenerate
        run: |
          test "$TARGET_REF" = "$REPAIR_BRANCH"
          python3 host/listing_registry.py export
          git diff --stat
          git diff --check
      - name: Verify listing engine, checked-in routes and exports
        run: |
          python3 -m unittest -q test_listing_registry test_quill_seo_survival_autopsy_truth test_survival_offer_page_truth
          python3 host/listing_registry.py validate
          python3 host/listing_registry.py --self-test
      - name: Commit generated exports to repair branch
        if: inputs.regenerate
        run: |
          git add -- revenue/listing_registry/registry.json revenue/listing_registry/assets.json revenue/listing_registry/schema.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Regenerate listing exports from canonical offer routes"
            git push origin "HEAD:$REPAIR_BRANCH"
          fi
          git status --porcelain
          git rev-parse HEAD
      - name: Verify current-main ancestry and clean terminal
        if: ${{ !inputs.regenerate }}
        run: |
          test "$TARGET_REF" = main
          test -n "$EXPECTED_COMMIT"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "audit_git_terminal.py").write_bytes(base64.b64decode(os.environ["AUDIT_SCRIPT_B64"]))
          PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --repo . --fetch --target-ref origin/main --expected-commit "$EXPECTED_COMMIT" --required-path host/listing_registry.py --required-path test_listing_registry.py --required-path revenue/listing_registry/registry.json --required-path revenue/listing_registry/assets.json --required-path revenue/listing_registry/schema.json
