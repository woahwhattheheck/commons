name: current-main-pr-verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /integrations/
            /revenue/
            /test_grokbot_shared_equipment.py
      - name: Verify new Autopsy and cash equipment cards and refund remedy
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ba951183a6d6bad7f10de4be2b17fcb0eb8d15b6 HEAD
          python3 -m unittest -v integrations.shared_equipment.test_diagnostic_equipment_cards.DiagnosticEquipmentCardTests.test_open_obligations_cash_card integrations.shared_equipment.test_diagnostic_equipment_cards.DiagnosticEquipmentCardTests.test_autopsy_case_and_receipt_cards integrations.shared_equipment.test_diagnostic_equipment_cards.DiagnosticEquipmentCardTests.test_autopsy_case_receipt_survive_transfer integrations.shared_equipment.test_diagnostic_equipment_cards.DiagnosticEquipmentCardTests.test_crm_role_refuses test_grokbot_shared_equipment.TestGrokBotSharedEquipment.test_tool_names_and_catalog_extension test_grokbot_shared_equipment.TestGrokBotSharedEquipment.test_role_equipment_route_present
          python3 -m unittest discover -v -s integrations/transferable_roles -p test_handoff_execute_survive.py -k test_diagnostic_export_import_then_prove
          python3 integrations/transferable_roles/test_autopsy_sla_cli.py
          git fetch --depth=100 origin main
          python3 - <<'PY'
          import subprocess
          for path in ["integrations/shared_equipment/diagnostic_equipment_cards.py","integrations/shared_equipment/test_diagnostic_equipment_cards.py","integrations/shared_equipment/role_equipment.json","integrations/shared_equipment/R4_CLAIMS.md","test_grokbot_shared_equipment.py","integrations/transferable_roles/autopsy_fulfill.py","integrations/transferable_roles/test_autopsy_sla_cli.py","integrations/transferable_roles/test_handoff_execute_survive.py","integrations/transferable_roles/R4_CLAIMS_HANDOFF.md","integrations/transferable_roles/README.md","p/hinge-r4-equipment-autopsy-case-receipt-cards-20260905-01.md","p/wedge-autopsy-sla-refund-miss-remedy-20260905-01.md","p/rivet-r4-handoff-prove-diag-export-import-20260905-01.md","p/wedge-r4-equipment-open-obligations-cash-card-20260905-01.md"]:
              expected = subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              actual = subprocess.check_output(["git","rev-parse","origin/main:"+path],text=True).strip()
              assert expected == actual,path
              print("READBACK",path,actual)
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit ba951183a6d6bad7f10de4be2b17fcb0eb8d15b6 --required-path integrations/shared_equipment/test_diagnostic_equipment_cards.py
