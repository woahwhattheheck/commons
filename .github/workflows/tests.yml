name: webmcp-pad-restoration-verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact webmcp-pad main commit to verify"
        required: true
permissions:
  contents: read
concurrency:
  group: webmcp-pad-restoration-verification-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: ${{ github.event.inputs.source_sha }}
    steps:
      - name: Check out exact private pad source in cloud
        uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/webmcp-pad
          ref: ${{ github.event.inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.WEBMCP_PAD_TOKEN }}
      - name: Verify plain source and exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          pad = Path("pad.html").read_text(encoding="utf-8")
          adapter = Path("api/mcp.py").read_text(encoding="utf-8")
          assert "registerTool" in pad
          assert "DecompressionStream" not in pad
          assert "titanmcp" in adapter or "webmcp-pad" in adapter
          print("PLAIN_SOURCE_OK", len(pad.encode("utf-8")))
          PY
      - name: Run Python standard-library regression suite
        run: python3 -m unittest discover -v -p 'test_*.py'
      - name: Run existing browser contract and focus regressions
        if: always()
        run: |
          set -euo pipefail
          node test_webmcp_contract.js
          node test_pad_focus.js
      - name: Read back current main and clean source state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.WEBMCP_PAD_TOKEN }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          gh auth setup-git
          git fetch --no-tags origin main:refs/remotes/origin/main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          echo "CURRENT_MAIN=$CURRENT_MAIN"
          STATUS="$(gh api "repos/woahwhattheheck/webmcp-pad/compare/$SOURCE_SHA...$CURRENT_MAIN" --jq .status)"
          case "$STATUS" in identical|ahead) ;; *) echo "::error::source is not on current main: $STATUS"; exit 1 ;; esac
          for path in pad.html api/mcp.py vercel.json test_bake_contract.py test_vercel_include_first_party.py probe_live.py test_probe_live.py test_titanmcp_gpt_use_http_transport.py; do
            LOCAL_BLOB="$(git rev-parse "HEAD:$path")"
            CURRENT_BLOB="$(gh api "repos/woahwhattheheck/webmcp-pad/contents/$path?ref=$CURRENT_MAIN" --jq .sha)"
            test "$LOCAL_BLOB" = "$CURRENT_BLOB"
            echo "READBACK_OK $path $CURRENT_BLOB"
          done
          echo "ANCESTRY_PASS source=$SOURCE_SHA main=$CURRENT_MAIN clean=true"
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --repo . --target-ref origin/main --expected-commit "$SOURCE_SHA" --required-path pad.html --required-path api/mcp.py --required-path vercel.json --required-path test_bake_contract.py --required-path test_vercel_include_first_party.py --required-path probe_live.py --required-path test_probe_live.py --required-path test_titanmcp_gpt_use_http_transport.py
