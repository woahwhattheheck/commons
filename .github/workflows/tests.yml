name: current-main-diagnostic-cash-repair
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1000
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /integrations/
            /revenue/
            /commons_publication_policy.py
            /fix_first.py
            /salvage.html
            /test_digit-salvage-live-cash-20260905-01.py
      - name: Verify repaired diagnostic assertions and new cash fields
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 31fa945c30f8a28c695b4c31ba9c4ab0b346bcb8 HEAD
          python3 -m unittest -v integrations.transferable_roles.test_handoff_execute_survive.HandoffExecuteSurviveTests.test_diagnostic_transfer_then_prove integrations.transferable_roles.test_handoff_execute_survive.HandoffExecuteSurviveTests.test_diagnostic_export_import_then_prove integrations.transferable_roles.test_handoff_execute_survive.HandoffExecuteSurviveTests.test_diagnostic_release_then_equip_prove integrations.transferable_roles.test_autopsy_fulfill_cli.AutopsyFulfillCliTests.test_autopsy_deadline_executes integrations.transferable_roles.test_autopsy_fulfill_cli.AutopsyFulfillCliTests.test_documented_commands_run_without_equipping integrations.transferable_roles.test_open_obligations_cash_marker.OpenObligationsCashMarkerTests.test_mixed_store_marks_paid_roles_only integrations.transferable_roles.test_open_obligations_cash_marker.OpenObligationsCashMarkerTests.test_cli_open_obligations_preserves_cash_marker integrations.transferable_roles.test_open_obligations_cash_marker.OpenObligationsCashMarkerTests.test_cash_only_filters_to_paid_roles
          python3 -c 'import runpy; runpy.run_path("test_digit-salvage-live-cash-20260905-01.py")["test_live_cash"](); print("PASS salvage assertion")'
          git fetch --depth=1000 origin main
          python3 - <<'PY'
          import subprocess
          for path in ["integrations/shared_equipment/test_diagnostic_equipment_cards.py","integrations/shared_equipment/R4_CLAIMS.md","integrations/transferable_roles/test_handoff_execute_survive.py","integrations/transferable_roles/R4_CLAIMS_HANDOFF.md","test_digit-salvage-live-cash-20260905-01.py","p/rivet-r4-equipment-autopsy-validate-survive-handoff-20260905-01.md","p/wedge-r4-equipment-open-obligations-cash-survive-handoff-20260905-01.md","p/rivet-r4-handoff-prove-diag-sla-diagnostic-usd-20260905-01.md","integrations/transferable_roles/autopsy_fulfill.py","integrations/transferable_roles/test_autopsy_fulfill_cli.py","integrations/transferable_roles/roles.py","integrations/transferable_roles/test_open_obligations_cash_marker.py","revenue/dealer_service_lead_rescue/contract.json"]:
              expected = subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              actual = subprocess.check_output(["git","rev-parse","origin/main:"+path],text=True).strip()
              assert expected == actual,path
              print("READBACK",path,actual)
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit 31fa945c30f8a28c695b4c31ba9c4ab0b346bcb8 --required-path integrations/shared_equipment/test_diagnostic_equipment_cards.py
          python3 fix_first.py --json '{"outcome":"fixed","observed_broken":true,"expected_contract":"Root-level salvage assertion must read the repository HTML","changed_paths":["test_digit-salvage-live-cash-20260905-01.py"],"tests":["This run:3 repaired diagnostic cases,5 new cash cases and corrected salvage assertion PASS"],"main_sha":"8ac659c987b42b11716f7dd04e9c4e0b244fdfb9","readback_verified":true}'
          python3 fix_first.py --json '{"outcome":"fixed","observed_broken":true,"expected_contract":"Diagnostic successor SLA preserves canonical refund wording and its separate199USD price across handoffs","changed_paths":["integrations/transferable_roles/test_handoff_execute_survive.py"],"tests":["This run:3 corrected diagnostic successor cases PASS;5 equipment cases already passed34004182800 and are not rerun"],"main_sha":"f92425948fb435fd3bcf55fd0d04bcf1f044cab6","readback_verified":true}'
