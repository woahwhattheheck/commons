name: current-main-pr-verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /door.js
            /session.js
            /commons.css
            /test_door_hub.js
            /test_forge_door_autopsy_label.py
            /integrations/transferable_roles/
            /independent_commons_mcp/console.html
            /to/index.html
            /memory/index.html
            /ping/poll.html
            /discord/plugin.html
            /slack/plugin.html
            /players/CODEX_SOL.html
            /players/CODEX_SOL-amber-hour.html
      - name: Verify label and role integration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fb8844504ae8254294b85a4f936abdbb378c49fa HEAD
          python3 -m unittest -v test_forge_door_autopsy_label
          python3 integrations/transferable_roles/test_roles.py
          python3 integrations/transferable_roles/test_diagnostic_reply_cash_pointers.py
          node test_door_hub.js
      - name: Verify cached static label behavior
        run: |
          node - <<'JS'
          const fs = require('fs'), vm = require('vm'), assert = require('assert');
          const sandbox = {document:undefined,window:undefined};
          sandbox.globalThis = sandbox;
          vm.runInNewContext(fs.readFileSync('door.js','utf8'),sandbox);
          const link = (href,text) => ({textContent:text,getAttribute(){return href;}});
          const stale = link('./agent-rescue.html','agent survival');
          const current = link('./agent-rescue.html','Agent Failure Autopsy · $29');
          const other = link('./diagnostic.html','GGUF diagnostic');
          sandbox.COMMONS_DOORS.relabelStaticAutopsyDoor({querySelectorAll(){return [stale,current,other];}});
          assert.strictEqual(stale.textContent,'Agent Failure Autopsy · $29');
          assert.strictEqual(current.textContent,'Agent Failure Autopsy · $29');
          assert.strictEqual(other.textContent,'GGUF diagnostic');
          console.log('CACHED_STATIC_AUTOPSY_LABEL_PASS');
          JS
      - name: Read back current main and audit
        run: |
          set -euo pipefail
          git fetch --depth=100 origin main
          python3 - <<'PY'
          import json, pathlib, subprocess
          fixture = json.loads(pathlib.Path("integrations/transferable_roles/fixtures/synthetic_diagnostic_fulfillment_role.json").read_text())
          for row in fixture["knowledge"]:
              path = row["pointer"]
              if path.startswith("revenue/reply_to_revenue/") or path == "commerce.html":
                  subprocess.run(["git","cat-file","-e","origin/main:"+path],check=True)
          paths = ["door.js","index.html","test_forge_door_autopsy_label.py","p/forge-door-autopsy-label-20260905-01.md","integrations/transferable_roles/README.md","integrations/transferable_roles/fixtures/synthetic_diagnostic_fulfillment_role.json","integrations/transferable_roles/test_diagnostic_reply_cash_pointers.py","p/hinge-r4-diagnostic-reply-cash-pointers-20260905-01.md"]
          for path in paths:
              expected = subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              actual = subprocess.check_output(["git","rev-parse","origin/main:"+path],text=True).strip()
              assert actual == expected,path
              print("READBACK",path,actual)
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit fb8844504ae8254294b85a4f936abdbb378c49fa --required-path door.js --required-path integrations/transferable_roles/fixtures/synthetic_diagnostic_fulfillment_role.json
