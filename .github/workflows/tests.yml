name: HTML admission context verification
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
        default: codex/guard-html-admission-context-20260905-01
      expected_commit:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  guard-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      AUDIT_SCRIPT_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify guard behavior and reproduce the original failure
        if: inputs.expected_commit == ''
        run: |
          python3 test_open_door_guard.py
          git fetch --no-tags --depth=1 origin fd293ff5b5b8f0e8682ab088208bb5f4cd3ba940
          git fetch --no-tags --depth=1 origin 6df92e0fd47b35b58bac9e79eaec953e51f62d62
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          base = 'fd293ff5b5b8f0e8682ab088208bb5f4cd3ba940'
          head = '6df92e0fd47b35b58bac9e79eaec953e51f62d62'
          original = Path(os.environ['RUNNER_TEMP']) / 'original_guard.py'
          original.write_bytes(subprocess.check_output(['git', 'show', base + ':open_door_guard.py']))
          old = subprocess.run(['python3', str(original), '--diff', base, head], capture_output=True, text=True)
          assert old.returncode == 1, (old.returncode, old.stdout, old.stderr)
          violations = [line for line in old.stderr.splitlines() if ': [admission-phrase]' in line]
          assert len(violations) == 3, old.stderr
          assert all(line.startswith('feature-tracker.html:') for line in violations), old.stderr
          print('ORIGINAL_FAILURE_REPRODUCED: three HTML admission-phrase false positives')
          subprocess.run(['python3', 'open_door_guard.py', '--diff', base, head], check=True)
          PY
      - name: Verify exact blobs and clean checkout
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {'open_door_guard.py': '861958e91177fedd09db974345a2838387e7f2b7', 'test_open_door_guard.py': '2fb0d87bf8cdec0908ef8e579d32a6166dec602e'}
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
              assert actual == sha, (path, actual, sha)
              print('READBACK', path, actual)
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          PY
      - name: Verify the repaired Slack chunk reference
        if: inputs.expected_commit != ''
        run: |
          python3 test_commons_slack_full_body_chunk.py
          git merge-base --is-ancestor c4fddcf3c25ba81b70ee63b05f5d2655e6e7dd0f origin/main
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          path = 'ground/COMMONS_SLACK_FULL_BODY_CHUNK.json'
          landed = 'c4fddcf3c25ba81b70ee63b05f5d2655e6e7dd0f'
          actual = subprocess.check_output(['git', 'rev-parse', landed + ':' + path], text=True).strip()
          assert actual == 'fc09f874c9cb277412f29c77156edbc664e7561e', actual
          catalog = json.loads(Path(path).read_text())
          test_blob = subprocess.check_output(['git', 'rev-parse', 'HEAD:test_commons_slack_full_body.py'], text=True).strip()
          assert catalog['keep_unread']['test_commons_slack_full_body.py'] == test_blob[:8]
          packet = {'outcome': 'fixed', 'observed_broken': True, 'expected_contract': 'The Slack chunk catalog points at the composed full-body test revision without changing its behavioral coverage.', 'changed_paths': [path], 'tests': ['All6 standalone Slack chunk cases passed in this actual cloud run.', 'Catalog pin matches the actual full-body test Git blob, original repair blob and landed ancestry verified.'], 'main_sha': landed, 'readback_verified': True, 'report_only_sessions': 0, 'unconsumed_findings': 0}
          subprocess.run(['python3', 'fix_first.py', '--json', json.dumps(packet)], check=True)
          print('SLACK_CATALOG_COMPOSITION_PASS', actual, test_blob)
          PY
      - name: Verify the existing marker deployment test contract
        if: inputs.expected_commit != ''
        run: |
          python3 -m unittest -v test_webmcp_pad_production.WebmcpPadProductionWorkflowTests.test_marker_push_and_dispatch_never_target_commons_mcp
          git merge-base --is-ancestor 92ee798acf0aaebdc2d328884cb4a58341ac4879 origin/main
          python3 - <<'PY'
          import json, subprocess
          path = 'test_webmcp_pad_production.py'
          landed = '92ee798acf0aaebdc2d328884cb4a58341ac4879'
          blob = subprocess.check_output(['git', 'rev-parse', landed + ':' + path], text=True).strip()
          assert blob == 'd72645822e37a6b15ffa41ed14a39be570cba658', blob
          packet = {'outcome': 'fixed', 'observed_broken': True, 'expected_contract': 'The production workflow test recognizes the existing owner-authorized marker-only push and explicit dispatch, preserving no-PR and project-target safeguards.', 'changed_paths': [path], 'tests': ['The changed current-main WebMCP deployment test passed in this actual run.', 'Original landed test blob and main ancestry verified.'], 'main_sha': landed, 'readback_verified': True, 'report_only_sessions': 0, 'unconsumed_findings': 0}
          subprocess.run(['python3', 'fix_first.py', '--json', json.dumps(packet)], check=True)
          print('WEBMCP_MARKER_CONTRACT_PASS', blob)
          PY
      - name: Read back landed CRM6 semantics and run the remaining small and registry cases
        if: inputs.expected_commit != ''
        run: |
          set -euo pipefail
          # The 67-case CRM6 run34002209092 and tracker run34002697528 already passed.
          # Preserve current peer additions; this step does not rerun those suites.
          for ref in 305b07297f5e75a946fe5aab14ad1d87cce5ffea 1667d0adb97ba691a5cfafb5bd144174fb0a18c0 2b7794d2eb5134007d3ea4ba935ab11e7f4f80b0; do
            git cat-file -e "$ref^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$ref"
          done
          python3 test_coil_tools_json_live_cash.py
          python3 -c 'import runpy; runpy.run_path("test_digit_mcp_tool_drift_eyebrow.py")["test_eyebrow_not_survival_sell"](); print("PASS drift eyebrow assertion")'
          python3 -m unittest -v tests/test_ledger_crm6_landed_registry_pins.py
          python3 - <<'PY'
          import ast, json, re, subprocess
          from pathlib import Path

          SOURCE = "305b07297f5e75a946fe5aab14ad1d87cce5ffea"
          LANDED = "49dd90b1ac4fa162ce0bf6474069d986415cd0c8"
          DOCUMENTED = "1667d0adb97ba691a5cfafb5bd144174fb0a18c0"
          PROJECTED = "2b7794d2eb5134007d3ea4ba935ab11e7f4f80b0"
          FEATURE = "ledger-crm6-composed-at-freshness-gate-20260905-01"
          main_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def source(ref, path):
              return subprocess.check_output(["git", "show", ref + ":" + path], text=True)
          def dump(node):
              return ast.dump(node, include_attributes=False)

          unchanged = {
              "host/lm_gtm_index.py": "fb30cf7195901c730598b90a6a834673cee17746",
              "tests/test_ledger_crm6_composed_at_freshness_gate.py": "525054a481495b12a6e0e1d9a11237101ed3cc3e",
              "p/ledger-crm6-composed-at-freshness-gate-20260905-01.md": "5386c0c7ca0f9671e97b15479b29867a550d63ff",
              "features/registry/ledger-crm6-composed-at-freshness-gate-20260905-01.json": "a43bf77c193fc5b20b4481dabf867a957761fbf0",
          }
          for path, expected in unchanged.items():
              assert git("rev-parse", SOURCE + ":" + path) == expected, path
              actual = git("rev-parse", "HEAD:" + path)
              assert actual == expected, (path, actual)
              print("CRM6_EXACT_READBACK", path, actual)

          # The shared state contract now also documents the later mailbox feature.
          # CRM6 owns this freshness command; unrelated state and contract additions remain live.
          state_path = "revenue/lm_gtm_index/state.json"
          assert git("rev-parse", SOURCE + ":" + state_path) == "911b5045e552234ae4bba38ced28daafae65d741"
          original_state = json.loads(source(SOURCE, state_path))
          current_state = json.loads(Path(state_path).read_text())
          assert current_state["contract"]["check_freshness"] == original_state["contract"]["check_freshness"]
          print("CRM6_FRESHNESS_STATE_CONTRACT_PRESERVED", git("rev-parse", "HEAD:" + state_path))

          # The later mailbox feature is additive in the shared handoff module.
          # Compare the owned freshness blocks, keyword defaults and CLI wiring.
          def freshness_nodes(text):
              functions = {n.name:n for n in ast.parse(text).body if isinstance(n, ast.FunctionDef)}
              result = {}
              handoff = functions["relationship_handoff"]
              defaults = dict(zip((a.arg for a in handoff.args.kwonlyargs), handoff.args.kw_defaults))
              for name in ("include_index_freshness", "as_of"):
                  result["default:" + name] = dump(defaults[name])
              branches = [n for n in handoff.body if isinstance(n, ast.If)
                          and isinstance(n.test, ast.Name) and n.test.id == "include_index_freshness"]
              assert len(branches) == 1
              result["handoff"] = dump(branches[0])
              brief = functions["successor_brief"]
              assignments = [n for n in brief.body if isinstance(n, ast.Assign)
                             and any(isinstance(t, ast.Name) and t.id == "freshness" for t in n.targets)]
              branches = [n for n in brief.body if isinstance(n, ast.If)
                          and any(isinstance(t, ast.Name) and t.id == "freshness" for t in ast.walk(n.test))]
              assert len(assignments) == len(branches) == 1
              result["brief_assignment"], result["brief_branch"] = dump(assignments[0]), dump(branches[0])
              for flag in ("--index-freshness", "--as-of"):
                  calls = [n for n in ast.walk(functions["build_parser"]) if isinstance(n, ast.Call)
                           and isinstance(n.func, ast.Attribute) and n.func.attr == "add_argument"
                           and n.args and isinstance(n.args[0], ast.Constant) and n.args[0].value == flag]
                  assert len(calls) == 1
                  result["flag:" + flag] = dump(calls[0])
              calls = [n for n in ast.walk(functions["main"]) if isinstance(n, ast.Call)
                       and isinstance(n.func, ast.Name) and n.func.id == "relationship_handoff"]
              assert len(calls) == 1
              for name in ("include_index_freshness", "as_of"):
                  keywords = [k for k in calls[0].keywords if k.arg == name]
                  assert len(keywords) == 1
                  result["call:" + name] = dump(keywords[0])
              return result
          handoff_path = "host/lm_gtm_relationship_handoff.py"
          assert freshness_nodes(source(SOURCE, handoff_path)) == freshness_nodes(Path(handoff_path).read_text())
          print("CRM6_FRESHNESS_AST_PRESERVED", git("rev-parse", "HEAD:" + handoff_path),
                "peer mailbox additions retained; original whole-module run remains historical")

          readme_path = "revenue/lm_gtm_index/README.md"
          def section(text):
              matches = re.findall(r"(?ms)^## Saved INDEX freshness\n(.*?)(?=^## |\Z)", text)
              assert len(matches) == 1
              return matches[0].strip()
          assert section(source(DOCUMENTED, readme_path)) == section(Path(readme_path).read_text())
          print("CRM6_DOCUMENTED_SECTION_PRESERVED", git("rev-parse", "HEAD:" + readme_path))

          old_tracker = json.loads(source(PROJECTED, "feature-tracker.json"))
          tracker = json.loads(Path("feature-tracker.json").read_text())
          old_rows = {row["id"]:row for row in old_tracker["features"]}
          rows = {row["id"]:row for row in tracker["features"]}
          assert old_rows.keys() <= rows.keys(), sorted(old_rows.keys() - rows.keys())
          assert old_rows[FEATURE] == rows[FEATURE]
          def html_row(text):
              matches = [row for row in re.findall(r"<tr\b[^>]*>.*?</tr>", text, re.S) if FEATURE in row]
              assert len(matches) == 1
              return matches[0]
          assert html_row(source(PROJECTED, "feature-tracker.html")) == html_row(Path("feature-tracker.html").read_text())
          print("CRM6_PROJECTION_PRESERVED", json.dumps({
              "previous_rows":len(old_rows), "current_rows":len(rows),
              "old_ids_preserved":True, "owned_row_preserved":True,
              "json_blob":git("rev-parse","HEAD:feature-tracker.json"),
              "html_blob":git("rev-parse","HEAD:feature-tracker.html")}))

          for path in ["tools.json", "test_coil_tools_json_live_cash.py",
                       "revenue/agent_failure_autopsy/offer.json",
                       "test_digit_mcp_tool_drift_eyebrow.py", "mcp-tool-drift.html"]:
              print("CRM6_NEW_CASE_READBACK", path, git("rev-parse", "HEAD:" + path))
          for landed in (LANDED, DOCUMENTED, PROJECTED,
                         "ee14634ab1ed99d6002d8455f11b0dcb663f4c85",
                         "55ad22389764383c71f4659dbb700c7092b2fa7b"):
              subprocess.run(["git", "merge-base", "--is-ancestor", landed, "HEAD"], check=True)
          assert not git("status", "--porcelain=v1", "--untracked-files=all")

          packets = [
              {
                  "outcome":"fixed", "observed_broken":True,
                  "expected_contract":"Published CRM6 freshness implementation did not execute; existing twelve-hour warning needs an executable source-age report.",
                  "changed_paths":list(unchanged) + [state_path, handoff_path, readme_path, "feature-tracker.json", "feature-tracker.html"],
                  "tests":["Actions34002209092 passed67 focused CRM6 cases and committed INDEX validation.",
                           "Actions34002697528 regenerated112 tracker rows, preserved111 IDs and passed standalone test_feature_tracker.py.",
                           "This audit: exact owned source and unchanged freshness AST/documented section/tracker row readback; current peer additions preserved."],
                  "main_sha":main_sha, "readback_verified":True
              },
              {
                  "outcome":"fixed", "observed_broken":True,
                  "expected_contract":"The shared equipment exact catalog test must include newly exposed Autopsy and cash queue tools while retaining every existing tool; cash capability metadata is not proof of payment",
                  "changed_paths":["test_grokbot_shared_equipment.py","integrations/shared_equipment/diagnostic_equipment_cards.py","integrations/shared_equipment/test_diagnostic_equipment_cards.py"],
                  "tests":["34002436192: 10 focused tests, 14 exact current-main blobs and clean terminal audit PASS"],
                  "main_sha":"ba951183a6d6bad7f10de4be2b17fcb0eb8d15b6", "readback_verified":True
              },
              {
                  "outcome":"fixed", "observed_broken":True,
                  "expected_contract":"Autopsy catalog sku matches canonical offer_id; root-level drift test reads repository HTML",
                  "changed_paths":["tools.json","test_coil_tools_json_live_cash.py","test_digit_mcp_tool_drift_eyebrow.py"],
                  "tests":["Current audit: cash unittest and explicitly invoked drift eyebrow function PASS"],
                  "main_sha":main_sha, "readback_verified":True
              }
          ]
          for packet in packets:
              subprocess.run(["python3", "fix_first.py", "--json", json.dumps(packet)], check=True)
          print("CRM6_CONSOLIDATED_AUDIT_PASS", json.dumps({
              "main_sha":main_sha, "landed_sha":LANDED, "cached_67_case_run":34002209092,
              "new_small_cases":2, "new_registry_cases":3,
              "fix_first_packets":3, "runtime_suite_repeated":False}))
          PY
      - name: Reuse the passed opportunity bake and verify landed receipts
        if: inputs.expected_commit != ''
        run: |
          python3 - <<'PY'
          import json, subprocess
          landed = 'a401fbca318c8c27209513ef2c063d4212c97ae4'
          tested = '3dd84e574e0a5919284ff92316c08ead47e91a75'
          expected = {"host/opportunity_registry.py":"61c10232b61568c910e1fe083182bb76aee4320b","opportunity.html":"e7ddca7968e943925b912ea1d4a186080c9fa060","revenue/ip/opportunity_registry.json":"3b1886684921432698a4f8c8c13389786ddcd485","revenue/ip/packets/packet-commons-public-license-unknown.md":"7462594c05d99d5de1054f625c271d966d6a2b19","revenue/ip/packets/packet-nlnet-codesupply-ois-2026.md":"e87370cf079918dceb5953a0975da98340b0e861","revenue/ip/packets/packet-nlnet-restack-ois-2026.md":"19ae1e428a076a8425ff2d4b6b4a8342dc59e17d","revenue/ip/packets/packet-nsf-pesose-26-506.md":"3d30c319fb0b6446295571151f927822b5ee2053","revenue/ip/packets/packet-nsf-sbir-sttr-26-510.md":"073fc039da810adef396cf05e4b1fc1ab83fe441","revenue/ip/packets/packet-procurement-gsa-schedule.md":"85fec1ff2560a1e062cad19f822a5f965e6b7d55","revenue/ip/packets/packet-procurement-public-rfp-pack.md":"ead9acf6979964c8c963ef8f1cf70fd12bc41351","revenue/ip/packets/packet-procurement-sam-gov-procurement.md":"d0e5c170ee7a1747e3bb711ccfa93c1895cda750","revenue/ip/packets/packet-research-bitsandbytes-foundation.md":"93dc4f6d7eb2871895600cafe6b4693f57675536","revenue/ip/packets/packet-research-eleutherai-lm-eval-harness.md":"4f3cc2525ce45d2f23ed605ae4d18e4e787ca0bd","revenue/ip/packets/packet-research-ggml-llama-cpp.md":"123ca43d0c3353495d01f07b56efd6f25f1d60ad","revenue/ip/packets/packet-research-hugging-face-hub.md":"0a9a23c8aca589a70fecbe12e9dd9474931cb847","revenue/ip/packets/packet-research-mlcommons-inference.md":"f59c7d56815c30e8d6266fbbafb8b2e5e2e6d151","revenue/ip/packets/packet-research-nvidia-tensorrt-llm.md":"96470409457e97aef5335825fa5a5340a18783ef","revenue/ip/packets/packet-sovereign-tech-fund-rolling.md":"ed722565cac1e832cf3460edafd6d5bf915fa2aa","revenue/ip/packets/packet-titan-hands-activation-hour.md":"6a267145616125ffa707ca0f959c81d3892f6841","revenue/ip/packets/packet-whitebox-advisory-hour.md":"0f56b0eea27eb1009859eaca45e195f4fe4ec1fc","revenue/ip/packets/packet-whitebox-archiv