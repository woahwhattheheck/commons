name: current-main-pr-verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /integrations/
            /revenue/agent_failure_autopsy/
            /revenue/dealer_service_lead_rescue/
            /revenue/referral_intake_completeness/
            /revenue/repair_booking_preflight/
            /revenue/plant_downtime_handoff/
            /dealer-service-lead-rescue.html
            /dealer-service-lead-rescue.js
            /referral-intake-completeness.html
            /referral-intake-completeness.js
            /plant-downtime-handoff.html
            /plant-downtime-handoff.js
            /repair-booking-preflight.html
            /tests/test_forge_diag_postpay_receipt_handoff.py
      - name: Verify landed wrappers and buyer packet behavior
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1ad9bdaf567bd891586c5c52eceb3bde80f3abf5 HEAD
          python3 -m unittest discover -v -s integrations/transferable_roles -p 'test_*.py'
          python3 -m unittest discover -v -s tests -p test_forge_diag_postpay_receipt_handoff.py
      - name: Read back current main and audit
        run: |
          set -euo pipefail
          git fetch --depth=100 origin main
          python3 - <<'PY'
          import subprocess
          paths = ["integrations/transferable_roles/diagnostic_contract.py","integrations/transferable_roles/cli.py","integrations/transferable_roles/test_diagnostic_contract_cli.py","integrations/transferable_roles/test_autopsy_case_cli.py","dealer-service-lead-rescue.html","referral-intake-completeness.html","plant-downtime-handoff.html","tests/test_forge_diag_postpay_receipt_handoff.py","integrations/transferable_roles/test_autopsy_fulfill_cli.py","integrations/transferable_roles/autopsy_paid.py","integrations/transferable_roles/autopsy_fulfill.py","integrations/transferable_roles/fixtures/synthetic_agent_failure_autopsy_role.json","integrations/transferable_roles/fixtures/synthetic_diagnostic_fulfillment_role.json","revenue/dealer_service_lead_rescue/contract.json","revenue/referral_intake_completeness/contract.json","revenue/repair_booking_preflight/contract.json","revenue/plant_downtime_handoff/contract.json","revenue/agent_failure_autopsy/fulfillment.py"]
          for path in paths:
              expected = subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              actual = subprocess.check_output(["git","rev-parse","origin/main:"+path],text=True).strip()
              assert actual == expected,path
              print("READBACK",path,actual)
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit 1ad9bdaf567bd891586c5c52eceb3bde80f3abf5 --required-path integrations/transferable_roles/cli.py --required-path tests/test_forge_diag_postpay_receipt_handoff.py
