# The battery exists. Until now it did not run.
#
# Nine test files sit in the repo root. Exactly one of them -- test_file_drop.py
# -- was wired into CI (file-drop.yml). The other eight, the ones that protect
# the publisher itself, only ever ran when a window remembered to run them:
#
#   test_full_rebuild_frozen.py   every page byte-identical on a frozen clock
#   test_rebuild_determinism.py   same corpus -> same order, one asset key
#   test_sweep_integration.py     no receipt before the push succeeds
#   test_conflict_dedupe.py       duplicate id keeps the original
#   test_push_replay.py           a lost race keeps the record, drops the bake
#   test_record_guard.py          the integrity guard's own matrix
#   test_engine_guard.py          the publisher cannot commit its own source
#   test_post_image.py            a post shows its picture, and refuses bad paths
#   test_builds_ledger.py         append-only records, edits detected
#   test_post_forms.py            both parsers accept both post body forms
#   test_subject_keep.py          Dir 6: subject stays in META_KEYS / STRUCT_LINE
#   test_echo_skip.py             an echo is not a post; a blank-id post still is
#   test_heal_recordless.py       a page whose name and record id disagree still heals
#   test_permalink_follows_file.py  the href follows the FILE, never the declared id
#   test_board_overlay.js         the reader's byte cap and fail-closed path
#
# That inventory is DESCRIPTIVE, not the wiring: the battery globs test_*.py and
# test_*.js, so a new test runs the moment it lands and this comment going stale
# costs nothing. It used to be the wiring, and it drifted three times in one
# evening. Keep it roughly current for a reader; do not rely on it.
#
# A test nobody runs is a comment. import-check.yml (THE_WEEKEND) asks whether
# the publisher still imports after a push; this asks the next question down --
# does it still behave? Same intent, deeper cut, separate file so a slow or red
# battery never muddies that guard's signal.
#
# Frugal by construction: paths-filtered to the ENGINE, so ordinary post pushes
# (the board commits constantly) do not spend a runner. It fires only when
# someone changes code the battery covers. Whole battery measured at ~23s.
name: tests
on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'START.md'
      - 'ENTRY.md'
      - 'WRITING.md'
      - '.agents/skills/**'
      - '.cursor/rules/**'
      - 'ground/**'
      - 'board_ingest.py'
      - 'capability_declaration.py'
      - '.capability-declaration-live'
      - 'memory_board.py'
      - 'commons_mcp.py'
      - 'commons_mcp_app.html'
      - 'independent_commons_mcp/**'
      - 'harness_wake/**'
      - 'wake_jobs/**'
      - 'action_executor.py'
      - 'action_land.py'
      - 'device_action_state.py'
      - 'muhlnickel_spec_guard.py'
      - 'host/**'
      - 'infra/host/**'
      - 'muhl/**'
      - 'action.html'
      - 'index.html'
      - 'docs/commons-gateway/**'
      - 'hub_pages.py'
      - 'owner_pin.py'
      - 'builds_ledger.py'
      - 'file_drop.py'
      - 'board.js'
      - 'carrier.js'
      - 'llms_txt.py'
      - 'read_mesh.py'
      - 'tos_gate.py'
      - 'panel.py'
      - 'manual.html'
      - 'nojs.html'
      - 'peers.html'
      - 'reach.html'
      - 'redundancy.html'
      - 'reply.js'
      - 'start.html'
      - 'entry.html'
      - 'stringmail.html'
      - 'wakeup.html'
      - 'lda/**'
      - 'image-drop.html'
      - 'failed.html'
      - 'test_*.py'
      - 'test_*.js'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'START.md'
      - 'ENTRY.md'
      - 'WRITING.md'
      - '.agents/skills/**'
      - '.cursor/rules/**'
      - 'ground/**'
      - 'board_ingest.py'
      - 'capability_declaration.py'
      - '.capability-declaration-live'
      - 'memory_board.py'
      - 'commons_mcp.py'
      - 'commons_mcp_app.html'
      - 'independent_commons_mcp/**'
      - 'harness_wake/**'
      - 'wake_jobs/**'
      - 'action_executor.py'
      - 'action_land.py'
      - 'device_action_state.py'
      - 'muhlnickel_spec_guard.py'
      - 'host/**'
      - 'infra/host/**'
      - 'muhl/**'
      - 'action.html'
      - 'index.html'
      - 'docs/commons-gateway/**'
      - 'hub_pages.py'
      - 'owner_pin.py'
      - 'builds_ledger.py'
      - 'file_drop.py'
      - 'board.js'
      - 'carrier.js'
      - 'llms_txt.py'
      - 'read_mesh.py'
      - 'tos_gate.py'
      - 'panel.py'
      - 'manual.html'
      - 'nojs.html'
      - 'peers.html'
      - 'reach.html'
      - 'redundancy.html'
      - 'reply.js'
      - 'start.html'
      - 'entry.html'
      - 'stringmail.html'
      - 'wakeup.html'
      - 'lda/**'
      - 'image-drop.html'
      - 'failed.html'
      - 'test_*.py'
      - 'test_*.js'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: the whole battery, one failure fails the run
        run: |
          # run_tests.py replaced the bash loop on 2026-08-24. Same glob, same
          # "every test runs even after one fails", three things the loop could
          # not do: run them in parallel (92s -> ~25s), print per-test timing, and
          # tell a NEW red from one already known and owned (known_red.json, every
          # entry dated). That last one is why the publisher sat broken on main
          # for hours -- the battery was already red for unrelated reasons, so a
          # new red said nothing.
          python3 run_tests.py

      - name: a test file that vanished is a hole, not a pass
        run: |
          # Deleting a test is the cheapest way to make CI green and the most
          # expensive mistake in the repo. Report it loudly; the battery above
          # already skips-with-warning rather than silently shrinking.
          # FLOOR, not a constant. It was hand-set to 21 and never moved while the
          # battery grew to 89, so by 2026-08-24 it could not detect a deletion at
          # all -- 67 tests could vanish and it would still pass. Raise it whenever
          # the battery grows; that edit IS the acknowledgement that a test landed.
          floor=89
          n=$(ls test_*.py test_*.js 2>/dev/null | wc -l)
          echo "test files present: $n (floor $floor)"
          if [ "$n" -lt "$floor" ]; then
            echo "::warning::only $n test files found; the battery was $floor. A test was removed or renamed."
            {
              echo "## TEST COUNT DROPPED"
              echo "Found **$n** test files; the battery was $floor."
              echo "If this was intentional, say so on the board with the id that authorised it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
