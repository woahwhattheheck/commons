name: current-main-pr-verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /integrations/
            /revenue/
            /clans.json
            /test_grokbot_shared_equipment.py
            /fix_first.py
      - name: Verify diagnostic equipment and handoff SLA behavior
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4af942e9acf01598d98c06a327a9b25179093ae3 HEAD
          python3 -m unittest -v test_grokbot_shared_equipment integrations.shared_equipment.test_diagnostic_equipment_cards
          python3 integrations/transferable_roles/test_handoff_execute_survive.py
          python3 integrations/transferable_roles/test_autopsy_sla_cli.py
          python3 integrations/transferable_roles/test_autopsy_fulfill_cli.py
      - name: Read back current main and audit
        run: |
          set -euo pipefail
          git fetch --depth=100 origin main
          python3 - <<'PY'
          import subprocess
          paths = ["integrations/shared_equipment/diagnostic_equipment_cards.py","integrations/shared_equipment/peers.py","integrations/shared_equipment/role_equipment.json","integrations/shared_equipment/test_diagnostic_equipment_cards.py","test_grokbot_shared_equipment.py","integrations/transferable_roles/README.md","integrations/transferable_roles/handoff_execute.py","integrations/transferable_roles/test_handoff_execute_survive.py","p/tenon-r4-equipment-diagnostic-cards-20260905-01.md","p/rivet-r4-handoff-prove-diag-receipt-fulfill-20260905-01.md","integrations/transferable_roles/cli.py","integrations/transferable_roles/autopsy_fulfill.py","integrations/transferable_roles/test_autopsy_sla_cli.py","p/wedge-autopsy-fulfill-sla-status-20260905-01.md","p/hinge-r4-handoff-prove-diag-sla-20260905-01.md"]
          for path in paths:
              expected = subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              actual = subprocess.check_output(["git","rev-parse","origin/main:"+path],text=True).strip()
              assert actual == expected,path
              print("READBACK",path,actual)
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit 4af942e9acf01598d98c06a327a9b25179093ae3 --required-path integrations/shared_equipment/diagnostic_equipment_cards.py --required-path integrations/transferable_roles/handoff_execute.py
      - name: Validate actual completed repair packets
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          packets = json.loads("[{\"outcome\":\"fixed\",\"observed_broken\":true,\"expected_contract\":\"Documented CLI --store must work before or after subcommands; diagnostic repair cards must load their actual offer and acceptance shape; buyer packets must retain the declared delivery window alongside the start clock.\",\"changed_paths\":[\"integrations/transferable_roles/cli.py\",\"integrations/transferable_roles/diagnostic_contract.py\",\"dealer-service-lead-rescue.html\",\"plant-downtime-handoff.html\",\"referral-intake-completeness.html\"],\"tests\":[\"33998032932 attempt 2: 50 role tests including real CLI and 2 buyer packet/click-handler tests PASS\"],\"main_sha\":\"1ad9bdaf567bd891586c5c52eceb3bde80f3abf5\",\"readback_verified\":true},{\"outcome\":\"fixed\",\"observed_broken\":true,\"expected_contract\":\"Diagnostic RoleStore must preserve every fixture obligation, including newly added deadline and SLA obligations; the fixture test must compare the actual declared IDs while retaining required intake, diagnose and settle obligations.\",\"changed_paths\":[\"integrations/transferable_roles/test_roles.py\"],\"tests\":[\"33999622149 attempt 2: 67 role tests plus 3 CRM6 assertions PASS\"],\"main_sha\":\"f47caafef246b3eba42a1ed62cec9da9fba626a9\",\"readback_verified\":true},{\"outcome\":\"fixed\",\"observed_broken\":true,\"expected_contract\":\"A local handoff helper must report local execution and leave absent G2 receipt identifiers and payment evidence empty, rather than fabricate service operations.\",\"changed_paths\":[\"integrations/transferable_roles/handoff_execute.py\",\"integrations/transferable_roles/test_handoff_execute_survive.py\"],\"tests\":[\"33999622149 attempt 2: 67 role tests including handoff transfer, export/import, CLI, truthful empty receipt IDs PASS\"],\"main_sha\":\"27aeaeaad2f55eb4862beaa2b80f785238400096\",\"readback_verified\":true},{\"outcome\":\"fixed\",\"observed_broken\":true,\"expected_contract\":\"The exact equipment catalog assertion must include the two intentionally added diagnostic card tools, and shared route metadata must expose both names.\",\"changed_paths\":[\"test_grokbot_shared_equipment.py\"],\"tests\":[\"Current workflow: test_grokbot_shared_equipment and diagnostic equipment card tests PASS before this step\"],\"main_sha\":\"44531df427ca0c25d93698dca737a61f509ee0fb\",\"readback_verified\":true}]")
          for packet in packets:
              subprocess.run(["git","merge-base","--is-ancestor",packet["main_sha"],"origin/main"],check=True)
              packet["tests"].append("readback and terminal audit: workflow " + os.environ["GITHUB_RUN_ID"] + " PASS")
              result = subprocess.run(["python3","fix_first.py","--json",json.dumps(packet)],check=True,text=True,capture_output=True)
              print(result.stdout)
          PY
