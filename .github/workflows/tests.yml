name: Feature tracker presence verification
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
        default: codex/feature-tracker-test-presence-20260905-01
      regenerate:
        type: boolean
        default: true
      expected_commit:
        type: string
        default: ''
permissions:
  contents: write
jobs:
  tracker-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REPAIR_BRANCH: codex/feature-tracker-test-presence-20260905-01
      TARGET_REF: ${{ inputs.target_ref }}
      REGENERATE: ${{ inputs.regenerate }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      AUDIT_SCRIPT_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate current feature tracker
        if: inputs.regenerate
        run: |
          test "$TARGET_REF" = "$REPAIR_BRANCH"
          python3 host/feature_tracker.py --write > "$RUNNER_TEMP/tracker-projection.json"
          git diff --stat
          git diff --check
      - name: Verify presence semantics and projection consumers
        run: |
          python3 test_feature_tracker.py
          python3 -m unittest -v test_grounding_door test_feature_tracker_hub_pages test_feature_tracker_door_hub
          python3 -m unittest discover -s tests -p test_ledger_crm6_feature_tracker_write.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          projection = json.loads(Path("feature-tracker.json").read_text())
          rows = projection["features"]
          headless = [r for r in rows if "integrations/shared_equipment/headless.py" in r["claimed_paths"]]
          assert len(headless) == 1, headless
          assert headless[0]["source_status"] == "SOURCE_BUILT", headless
          assert headless[0]["test_status"] == "TESTS_PRESENT", headless
          assert all(r["test_status"] != "TESTED" and r["rollup"] != "TESTED" for r in rows)
          print("HEADLESS_PRESENT", headless[0]["id"], "FEATURE_ROWS", len(rows))
          PY
      - name: Commit generated exports to repair branch
        if: inputs.regenerate
        run: |
          git add -- feature-tracker.json feature-tracker.html
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh feature tracker with truthful test-file presence and current registry"
            git push origin "HEAD:$REPAIR_BRANCH"
          fi
          git status --porcelain
          git rev-parse HEAD
      - name: Verify current-main ancestry and clean terminal
        if: ${{ !inputs.regenerate }}
        run: |
          test "$TARGET_REF" = main
          test -n "$EXPECTED_COMMIT"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "audit_git_terminal.py").write_bytes(base64.b64decode(os.environ["AUDIT_SCRIPT_B64"]))
          PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --repo . --fetch --target-ref origin/main --expected-commit "$EXPECTED_COMMIT" --required-path host/feature_tracker.py --required-path test_feature_tracker.py --required-path test_grounding_door.py --required-path ground/FEATURE_TRACKER.md --required-path feature-tracker.json --required-path feature-tracker.html
      - name: Verify exact landed blobs and completed repair packet
        if: ${{ !inputs.regenerate }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          expected = {'host/feature_tracker.py': 'd5b29a776b8934348c89aeeb829db518b2af4a86', 'test_feature_tracker.py': '7ee1b9898cdd77fbaa10ed044819e91f6c30132e', 'test_grounding_door.py': '0908ec9531ac4632bf382cb3cc263d062a8b1ae4', 'ground/FEATURE_TRACKER.md': 'd733e674b7ceec89b15b7d207bc1af736750b919', 'feature-tracker.json': '4523284575d7171908aab29d3f2f4748c5386ac1', 'feature-tracker.html': '21e7f736f9167329eb6be9f9652cc07c83408f6e'}
          for path, expected_blob in expected.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'origin/main:' + path], text=True).strip()
              assert actual == expected_blob, (path, actual, expected_blob)
              print('READBACK', path, actual)
          packet = {'outcome': 'fixed', 'observed_broken': True, 'expected_contract': 'Source-derived claims require actual behavior evidence; test-file presence cannot establish successful execution, and a feature with no claimed implementation remains planned.', 'changed_paths': ['host/feature_tracker.py', 'test_feature_tracker.py', 'test_grounding_door.py', 'ground/FEATURE_TRACKER.md', 'feature-tracker.json', 'feature-tracker.html'], 'tests': ['34000729009: feature tracker standalone suite, seven grounding/hub tests, and three CRM6 tests passed; deliberately failing fixture confirms presence does not claim execution'], 'main_sha': '6df92e0fd47b35b58bac9e79eaec953e51f62d62', 'readback_verified': True, 'report_only_sessions': 0, 'unconsumed_findings': 0}
          packet['tests'].append('Current-main workflow ' + os.environ['GITHUB_RUN_ID'] + ': same focused tests and clean landed audit passed before this step')
          subprocess.run(['python3', 'fix_first.py', '--json', json.dumps(packet)], check=True)
          PY
