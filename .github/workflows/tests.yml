name: current-main-pr-verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /integrations/
            /revenue/
            /feature-tracker.json
            /feature-tracker.html
            /features/registry/ledger-crm6-relationship-handoff-20260904-01.json
            /tests/test_ledger_crm6_feature_tracker_write.py
            /p/ledger-crm6-feature-tracker-write-20260905-02.md
      - name: Verify current role behavior and CRM6 projection
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fa6402d57931e0b9b813634565209128f745c5ff HEAD
          git merge-base --is-ancestor 84d1ce431b81fa4627419cc239b9125e12dc8a03 HEAD
          git merge-base --is-ancestor 1ec58d6fe4175794ff5412d0c4dec5f35738b3f8 HEAD
          git merge-base --is-ancestor e4693260573acf77bbdae189592d1643d2df49d4 HEAD
          python3 -m unittest discover -v -s integrations/transferable_roles -p 'test_*.py'
          python3 -m unittest discover -v -s tests -p test_ledger_crm6_feature_tracker_write.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          tracker = json.loads(Path("feature-tracker.json").read_text())
          rows = {row["id"]:row for row in tracker["features"]}
          for key in ["ledger-crm6-relationship-handoff-20260904-01","spark-g2-equipment-paid-case-tools-20260905-01"]:
              assert key in rows
              assert key in Path("feature-tracker.html").read_text()
          print("CURRENT_CRM6_AND_G2_PROJECTIONS_PRESERVED")
          PY
      - name: Read back current main and audit
        run: |
          set -euo pipefail
          git fetch --depth=100 origin main
          python3 - <<'PY'
          import subprocess
          paths = ["integrations/transferable_roles/README.md","integrations/transferable_roles/cli.py","integrations/transferable_roles/diagnostic_fulfill.py","integrations/transferable_roles/fixtures/synthetic_diagnostic_fulfillment_role.json","integrations/transferable_roles/test_diagnostic_fulfill_cli.py","p/wedge-diag-fulfill-deadline-cli-20260905-01.md","integrations/transferable_roles/diagnostic_receipt.py","integrations/transferable_roles/test_diagnostic_receipt_cli.py","p/tenon-r4-diagnostic-receipt-go-spec-20260905-02.md","integrations/transferable_roles/roles.py","integrations/transferable_roles/test_open_obligations_cash_marker.py","p/hinge-r4-open-obligations-cash-marker-20260905-01.md","tests/test_ledger_crm6_feature_tracker_write.py","p/ledger-crm6-feature-tracker-write-20260905-02.md","feature-tracker.json","feature-tracker.html"]
          for path in paths:
              expected = subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              actual = subprocess.check_output(["git","rev-parse","origin/main:"+path],text=True).strip()
              assert actual == expected,path
              print("READBACK",path,actual)
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit fa6402d57931e0b9b813634565209128f745c5ff --required-path integrations/transferable_roles/roles.py --required-path tests/test_ledger_crm6_feature_tracker_write.py
