name: Live cash generator focused verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-cash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify current-main cash doors and actual generator behavior
        run: |
          git merge-base --is-ancestor c661a28d9b493fc39af427bf8151ad94620ce8f6 HEAD
          python3 -m unittest -v test_bass_change_live_cash test_bass_delta_live_cash test_bass_features_live_cash test_change_rate_single_read_digest test_live_cash_regeneration
      - name: Read back the exact approved fragments and current source
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          import hub_pages, llms_txt

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def source(commit, path):
              return subprocess.check_output(["git", "show", commit + ":" + path], text=True)

          original_md = source("e3bd058d5fb01355c66c8ddf3290bf5eac145054", "change.md")
          approved_md = "\n## Live cash" + original_md.split("## Live cash", 1)[1]
          assert llms_txt.CHANGE_LIVE_CASH == approved_md
          md = Path("change.md").read_text(encoding="utf-8")
          assert md.count("## Live cash") == 1 and approved_md in md
          assert len(Path("change.md").read_bytes()) <= 2048
          for original, path in (
              ("feafc0440185849aae298471fcc80715eba02056", "delta.html"),
              ("123756b67769b6f0bf35537a076369aa14442a7f", "features.html"),
          ):
              approved = re.search(r'\n<section id="live-cash"[^>]*>.*?</section>\n', source(original, path), re.S).group()
              assert hub_pages.LIVE_CASH_HTML == approved, path
              current = Path(path).read_text(encoding="utf-8")
              assert current.count('id="live-cash"') == 1 and approved in current, path
          paths = ['hub_pages.py', 'llms_txt.py', 'delta.html', 'features.html', 'change.md', 'test_live_cash_regeneration.py']
          print("CASH_CURRENT_MAIN_READBACK", json.dumps({
              "head": git("rev-parse", "HEAD"),
              "blobs": {path: git("rev-parse", "HEAD:" + path) for path in paths},
              "approved_fragment_readback": "PASS",
              "existing_cash_tests": 3, "existing_digest_tests": 7, "new_generator_tests": 3,
          }))
          PY
      - name: Verify landed ancestry and repair completion
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'audit_git_terminal.py').write_bytes(base64.b64decode(''))
          PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --target-ref origin/main --expected-commit c661a28d9b493fc39af427bf8151ad94620ce8f6 --required-path hub_pages.py --required-path llms_txt.py --required-path delta.html --required-path features.html --required-path change.md --required-path test_live_cash_regeneration.py
          python3 fix_first.py --json '{"outcome": "fixed", "observed_broken": true, "expected_contract": "The approved BASS cash sections remain in change.md, delta.html and features.html after their actual generators run; the rate digest retains PR counts and its 2048 UTF-8 byte limit.", "changed_paths": ["hub_pages.py", "llms_txt.py", "delta.html", "features.html", "change.md", "test_live_cash_regeneration.py"], "tests": ["13 focused unittest cases passed in this cloud job, including real repeat regeneration from absent outputs and Unicode-ID overflow.", "Exact original BASS fragments read back from this current-main checkout; terminal ancestry/clean checks passed."], "main_sha": "c661a28d9b493fc39af427bf8151ad94620ce8f6", "readback_verified": true, "report_only_sessions": 0, "unconsumed_findings": 0}'
