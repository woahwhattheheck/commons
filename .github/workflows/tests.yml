name: current-main-pr-verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /integrations/
            /revenue/
            /clans.json
            /right-now.html
            /agent-runaway-cost.html
            /agentic-production-failure.html
            /ai-agent-stop-button.html
            /distro.html
            /test_quill_seo_survival_autopsy_truth.py
            /test_survival_offer_page_truth.py
            /test_grokbot_paid_case_receipt.py
            /test_grokbot_shared_equipment.py
      - name: Verify new equipment receipts and SEO routes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7f33278f500a0190bc9dab780c9c26faab5ad384 HEAD
          git merge-base --is-ancestor 125bfba590f22efaeffc7a5935feb296d866ee2c HEAD
          git merge-base --is-ancestor aa3e1c447e2e3bd857693e8ae6fdd716029fe466 HEAD
          python3 -m unittest -v test_grokbot_paid_case_receipt test_grokbot_shared_equipment test_quill_seo_survival_autopsy_truth test_survival_offer_page_truth
          python3 -m unittest discover -v -s integrations/transferable_roles -p 'test_*_cli.py'
          python3 - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          from test_grokbot_shared_equipment import GrokBotEquipmentFixture
          sys.path.insert(0, str(Path("integrations/transferable_roles").resolve()))
          from roles import RoleStore
          with GrokBotEquipmentFixture() as fx:
              built = fx.eq.call("grokbot_case_from_autopsy_offer", {"case_ref": "opaque-equipment-roundtrip"})
              assert built["ok"], built
              submitted = fx.eq.call("grokbot_submit", {"prompt": "synthetic receipt round trip", "async": False, "case": built["case"]})
              assert submitted["status"] == "completed", submitted
              inspected = fx.eq.call("grokbot_inspect", {"run_id": submitted["run_id"]})
              for response in [submitted, inspected]:
                  receipt = fx.eq.call("grokbot_receipt_row_from_case", {"case": built["case"], "submit_response": response})
                  assert receipt["ok"], receipt
                  row = receipt["case_row"]
                  assert row["g2_run_id"] == response["run_id"]
                  assert row["g2_session_id"] == response["session_id"]
                  assert row["case_ref"] == response["case"]["case_ref"]
                  assert row["state"] == "UNVERIFIED"
                  assert "payment_observed_at" not in row
          print("ACTUAL_ECHO_SUBMIT_INSPECT_RECEIPT_PASS")
          with tempfile.TemporaryDirectory() as tmp:
              store = RoleStore(tmp)
              fixture = Path("integrations/transferable_roles/fixtures/synthetic_diagnostic_fulfillment_role.json")
              role = store.create(json.loads(fixture.read_text()))
              assert role["occupant"] is None
              before = {p.name: p.read_bytes() for p in Path(tmp).glob("*.json")}
              for slug in ["dealer", "referral", "plant"]:
                  result = subprocess.run([sys.executable, "integrations/transferable_roles/cli.py",
                      "diagnostic-receipt", role["role_id"], "--slug", slug, "--store", tmp],
                      check=False, capture_output=True, text=True)
                  assert result.returncode == 0, result.stderr
                  card = json.loads(result.stdout)
                  source = json.loads(Path(card["pointer"]).read_text())
                  for key in ["receipt_id", "status", "cash_usd", "payment_verified", "buyer_delivery"]:
                      assert card[key] == source[key], (slug,key)
              result = subprocess.run([sys.executable, "integrations/transferable_roles/cli.py",
                  "diagnostic-receipt", role["role_id"], "--slug", "repair", "--store", tmp],
                  check=False, capture_output=True, text=True)
              assert result.returncode == 2
              assert "no receipt.json twin" in json.loads(result.stderr)["error"]
              assert {p.name: p.read_bytes() for p in Path(tmp).glob("*.json")} == before
          print("ACTUAL_DIAGNOSTIC_RECEIPT_CLI_PASS")
          PY
      - name: Read back current main and audit
        run: |
          set -euo pipefail
          git fetch --depth=100 origin main
          python3 - <<'PY'
          import subprocess
          paths = ["features/registry/spark-g2-equipment-paid-case-tools-20260905-01.json","integrations/grokbot_control/README.md","integrations/grokbot_control/__init__.py","integrations/grokbot_control/paid_case.py","integrations/shared_equipment/peers.py","integrations/shared_equipment/role_equipment.json","p/spark-g2-equipment-paid-case-tools-20260905-01.md","test_grokbot_paid_case_receipt.py","test_grokbot_shared_equipment.py","integrations/transferable_roles/README.md","integrations/transferable_roles/cli.py","integrations/transferable_roles/diagnostic_receipt.py","integrations/transferable_roles/fixtures/synthetic_diagnostic_fulfillment_role.json","integrations/transferable_roles/test_diagnostic_receipt_cli.py","p/tenon-r4-diagnostic-receipt-cli-20260905-01.md","agent-runaway-cost.html","agentic-production-failure.html","ai-agent-stop-button.html","distro.html","test_quill_seo_survival_autopsy_truth.py","test_survival_offer_page_truth.py"]
          for path in paths:
              expected = subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              actual = subprocess.check_output(["git","rev-parse","origin/main:"+path],text=True).strip()
              assert actual == expected,path
              print("READBACK",path,actual)
          PY
          cat > "$RUNNER_TEMP/audit_git_terminal.py" <<'AUDIT_PY'
          #!/usr/bin/env python3
          """Fail closed unless Git work is clean and the landed commit is on target."""
          
          from __future__ import annotations
          
          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          
          def git(repo: Path, *args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)}: {proc.stderr.strip()}")
              return proc.stdout.strip()
          
          
          def exists(repo: Path, revision: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "cat-file", "-e", revision],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def is_ancestor(repo: Path, older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "-C", str(repo), "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0
          
          
          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo", default=".")
              parser.add_argument("--target-ref", default="origin/main")
              parser.add_argument("--expected-commit", help="Landed/merge commit; defaults to HEAD")
              parser.add_argument("--required-path", action="append", default=[])
              parser.add_argument("--fetch", action="store_true")
              args = parser.parse_args()
          
              repo = Path(args.repo).resolve()
              result: dict[str, object] = {
                  "repo": str(repo),
                  "target_ref": args.target_ref,
                  "checks": {},
                  "errors": [],
              }
              checks = result["checks"]
              errors = result["errors"]
          
              try:
                  root = Path(git(repo, "rev-parse", "--show-toplevel")).resolve()
                  result["repo"] = str(root)
                  repo = root
          
                  if args.fetch:
                      remote = args.target_ref.split("/", 1)[0]
                      git(repo, "fetch", "--prune", remote)
                      checks["fetched"] = remote
          
                  dirty = [line for line in git(repo, "status", "--porcelain=v1", "--untracked-files=all").splitlines() if line]
                  checks["clean"] = not dirty
                  if dirty:
                      errors.append("worktree has tracked or untracked changes")
                      result["dirty_entries"] = dirty
          
                  head = git(repo, "rev-parse", "HEAD")
                  result["head"] = head
                  result["branch"] = git(repo, "branch", "--show-current") or "DETACHED"
          
                  checks["target_exists"] = exists(repo, args.target_ref)
                  if not checks["target_exists"]:
                      errors.append(f"target ref does not exist: {args.target_ref}")
                  else:
                      target_head = git(repo, "rev-parse", args.target_ref)
                      result["target_head"] = target_head
                      expected = args.expected_commit or head
                      if not exists(repo, expected):
                          checks["expected_commit_exists"] = False
                          errors.append(f"expected commit does not exist: {expected}")
                      else:
                          expected = git(repo, "rev-parse", expected)
                          result["expected_commit"] = expected
                          checks["expected_commit_exists"] = True
                          checks["landed_ancestry"] = is_ancestor(repo, expected, target_head)
                          if not checks["landed_ancestry"]:
                              errors.append("expected commit is not an ancestor of target head")
          
                      path_results = {}
                      for required_path in args.required_path:
                          normalized = required_path.replace("\\", "/").lstrip("/")
                          path_results[normalized] = exists(repo, f"{args.target_ref}:{normalized}")
                          if not path_results[normalized]:
                              errors.append(f"required path missing from target: {normalized}")
                      checks["required_paths"] = path_results
          
                  result["state"] = "LANDED" if not errors else "UNFINISHED"
              except Exception as exc:
                  errors.append(str(exc))
                  result["state"] = "UNFINISHED"
          
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["state"] == "LANDED" else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          AUDIT_PY
          python3 "$RUNNER_TEMP/audit_git_terminal.py" --expected-commit 7f33278f500a0190bc9dab780c9c26faab5ad384 --required-path integrations/transferable_roles/diagnostic_receipt.py --required-path integrations/grokbot_control/paid_case.py
