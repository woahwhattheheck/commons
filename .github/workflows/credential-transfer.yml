name: headless-current-main-verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install existing declared dependency
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r integrations/shared_equipment/requirements-credential-transfer.txt
      - name: verify current main headless and credential roads
        run: python -m unittest -q integrations.shared_equipment.test_headless integrations.shared_equipment.test_credential_transfer integrations.shared_equipment.test_equipment test_shared_equipment_capability_manifest test_shared_equipment_newcomer_road test_gemini_peer_tool_gateway test_feature_tracker
      - name: verify exact blobs, cloud projection and terminal audit
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, sys
          expected = {'integrations/shared_equipment/headless.py': '41f3312a4bb48324094d8b417739c1191ba749d8', 'integrations/shared_equipment/test_headless.py': '4a4be5d302630b478ba7996cb8b145ac35670526', 'integrations/shared_equipment/README.md': 'f03d785df6e2dc607ad8b2aac7b42adb9ea6a8d5', '.github/workflows/credential-transfer.yml': 'f9367ab24507d10361302a90e92c69bf0fc6edcd', 'features/registry/codex-shared-headless-client-20260905-01.json': '880982d121a3a8d6ef575de42ecfdabd6be6c418', 'p/codex-shared-headless-client-20260905-01.md': '880f840d39733a8da52a60c4737b4e40dd7e79a6'}
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for path, blob in expected.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
              assert actual == blob, 'current_main_blob_mismatch:' + path
          print(json.dumps({'tested_main_sha': head, 'exact_blob_count': len(expected)}))
          from host.feature_tracker import project, write_projection
          projection = project('.')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'headless-feature-projection'
          destination.mkdir(exist_ok=True)
          write_projection(str(destination), projection)
          assert 'codex-shared-headless-client-20260905-01' in json.dumps(projection), 'feature_missing_from_projection'
          print(json.dumps({'feature_projection_written_in_cloud': True, 'feature_id': 'codex-shared-headless-client-20260905-01'}))
          audit = pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit_git_terminal.py'
          audit.write_bytes(base64.b64decode(''))
          command = [sys.executable, str(audit), '--repo', '.', '--fetch', '--expected-commit', '86bc57f1d83af5fca45e5d976510cf5d8098030f']
          for path in expected:
              command += ['--required-path', path]
          subprocess.run(command, check=True)
          PY
