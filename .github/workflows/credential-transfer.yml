name: credential-transfer
on:
  push:
    branches: [main]
    paths:
      - 'integrations/shared_equipment/**'
      - 'integrations/gemini_slack/peer_tool_gateway.py'
      - 'integrations/grok_slack/handoff.py'
      - 'test_gemini_peer_tool_gateway.py'
      - 'test_shared_equipment_capability_manifest.py'
      - 'test_shared_equipment_newcomer_road.py'
      - '.github/workflows/credential-transfer.yml'
  pull_request:
    paths:
      - 'integrations/shared_equipment/**'
      - 'integrations/gemini_slack/peer_tool_gateway.py'
      - 'integrations/grok_slack/handoff.py'
      - 'test_gemini_peer_tool_gateway.py'
      - 'test_shared_equipment_capability_manifest.py'
      - 'test_shared_equipment_newcomer_road.py'
      - '.github/workflows/credential-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install declared binary cryptography dependency
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r integrations/shared_equipment/requirements-credential-transfer.txt
      - name: exercise direct transfer and existing equipment roads
        run: |
          python -m unittest -q integrations.shared_equipment.test_credential_transfer integrations.shared_equipment.test_equipment test_shared_equipment_capability_manifest test_shared_equipment_newcomer_road test_gemini_peer_tool_gateway
