name: uiowa-100-run-evidence

on:
  pull_request:
    paths:
      - 'revenue/uiowa_rfq_18649_operator_handoff/**'
      - 'revenue/uiowa_rfq_18649_workshare/**'
      - 'revenue/uiowa_rfq_18649_workbench/**'
      - 'revenue/uiowa_rfq_18649_rating_model/**'
      - 'revenue/uiowa_rfq_18649_security_event_review/**'
      - 'revenue/uiowa_rfq_18649_observability/**'
      - 'revenue/uiowa_rfq_18649_handoff/**'
      - 'revenue/uiowa_rfq_18649_prioritization/**'
      - 'revenue/uiowa_rfq_18649_outcome_measurement/**'
      - 'revenue/uiowa_rfq_18649_traceability_rehearsal/**'
      - '.github/workflows/uiowa-100-run-evidence.yml'

permissions:
  contents: read

concurrency:
  group: uiowa-100-run-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  operator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: revenue/uiowa_rfq_18649_operator_handoff
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind checkout and require both test suites
        run: |
          git rev-parse HEAD
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames(
              ['test_operator_handoff', 'tests.test_run_evidence'])
          count = suite.countTestCases()
          print(f'operator tests collected: {count}')
          if count < 46:
              raise SystemExit('Expected original operator tests and all 38 evidence regressions')
          PY
      - name: Original and evidence tests, normal Python
        run: |
          set -euo pipefail
          python -m unittest -v test_operator_handoff tests.test_run_evidence 2>&1 | tee "$RUNNER_TEMP/uiowa-100-tests-normal.log"
      - name: Original and evidence tests, optimized Python
        run: |
          set -euo pipefail
          python -O -m unittest -v test_operator_handoff tests.test_run_evidence 2>&1 | tee "$RUNNER_TEMP/uiowa-100-tests-optimized.log"
      - name: Execute the actual checked-in eight-asset sample
        run: |
          python preflight.py
          python sample_run.py --out "$RUNNER_TEMP/uiowa-100-plan" --dry-run
          python sample_run.py --out "$RUNNER_TEMP/uiowa-100-executed"
      - name: Verify artifact bytes and preserve completed output on retry
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          plan = json.loads((base / 'uiowa-100-plan/sample-run-receipt.json').read_text())
          out = base / 'uiowa-100-executed'
          receipt = json.loads((out / 'sample-run-receipt.json').read_text())
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def snapshot():
              return {str(p.relative_to(out)): digest(p) for p in out.rglob('*') if p.is_file()}
          require(plan['status'] == 'PLANNED' and plan['execution_verified'] is False
                  and plan['attempted_steps'] == 0, 'Plan promoted to execution')
          require(receipt['status'] == 'PASSED' and receipt['execution_verified'] is True,
                  'Actual sample did not verify')
          require(receipt['attempted_steps'] == receipt['planned_steps'] == len(receipt['steps']),
                  'Partial sample was promoted')
          require(len({s['asset_id'] for s in receipt['steps']}) == 8,
                  'Expected all eight catalogued executable assets')
          require(bool(receipt['outputs']), 'No generated artifact evidence')
          for row in receipt['outputs']:
              path = out / row['path']
              require(row['path'] != 'sample-run-receipt.json', 'Receipt inventoried itself')
              require(path.is_file() and not path.is_symlink(), 'Non-regular artifact')
              require(path.stat().st_size == row['bytes'] and digest(path) == row['sha256'],
                      'Artifact inventory does not match the persisted bytes')
          before = snapshot()
          retry = subprocess.run([sys.executable, 'sample_run.py', '--out', str(out)],
                                 capture_output=True, text=True, check=False, timeout=30)
          require(retry.returncode == 2 and 'new or empty' in retry.stderr,
                  'Completed output directory was not refused on retry')
          require(snapshot() == before, 'Retry changed previously completed output')
          validation = {'status': 'PASS', 'scope': 'checked-in synthetic operator sample only',
                        'assets': 8, 'steps': len(receipt['steps']),
                        'outputs': len(receipt['outputs']), 'preserved_retry_exit': retry.returncode,
                        'receipt_sha256': digest(out / 'sample-run-receipt.json'),
                        'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          (base / 'uiowa-100-validation.json').write_text(json.dumps(validation, indent=2) + '\n')
          print(json.dumps(validation, sort_keys=True))
          PY
      - name: Retain test logs and sample receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiowa-100-run-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/uiowa-100-tests-*.log
            ${{ runner.temp }}/uiowa-100-plan/
            ${{ runner.temp }}/uiowa-100-executed/
            ${{ runner.temp }}/uiowa-100-validation.json
