name: zr91313-rustchain-n64-dgb-bench

on:
  push:
    branches:
      - zr91313/rustchain-n64-dgb-bench
    paths:
      - .github/workflows/zr91313-rustchain-n64-dgb-bench.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: ed807ee64964851984ca9d0e9eab65dfc43d17ad
  DGB_SHA: 64207bb8e7e7673b896af11336a805fec1becfcd
  DGB_RUN_ID: '34719960431'
  DGB_ZIP_SHA256: 80c74c4f2fb42ab7800e988348b6fb44f796211d9324591c0053fff447877b7a
  LIBDRAGON_IMAGE_DIGEST: sha256:1f208e26f7ca4da57755525555a2f72553701a578ddd925db88de1e9fe850d94

jobs:
  build-roms:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: ghcr.io/dragonminded/libdragon@sha256:1f208e26f7ca4da57755525555a2f72553701a578ddd925db88de1e9fe850d94
    env:
      N64_INST: /n64_toolchain
    steps:
      - name: Build libdragon in pinned toolchain image
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch=trunk https://github.com/DragonMinded/libdragon.git /tmp/libdragon
          git -C /tmp/libdragon rev-parse HEAD | tee /tmp/libdragon.sha
          cd /tmp/libdragon
          JOBS=2 ./build.sh
          test -f "$N64_INST/include/n64.mk"
          ln -sfn "$N64_INST/include/n64.mk" "$N64_INST/n64.mk"
          readlink -f "$N64_INST/n64.mk" | tee /tmp/n64mk_compat_link.txt
          printf '%s\n' "$LIBDRAGON_IMAGE_DIGEST" | tee /tmp/libdragon-image-digest.txt
          sha256sum "$N64_INST/include/n64.mk" | tee /tmp/n64mk_sha256.txt

      - name: Checkout exact Legend of Elya revision
        shell: bash
        run: |
          set -euxo pipefail
          git init /work/elya
          git -C /work/elya remote add origin https://github.com/Scottcjn/legend-of-elya-n64.git
          git -C /work/elya fetch --depth=1 origin "$TARGET_SHA"
          git -C /work/elya checkout --detach FETCH_HEAD
          test "$(git -C /work/elya rev-parse HEAD)" = "$TARGET_SHA"

      - name: Build scalar and RSP RATE_PROBE ROMs
        shell: bash
        run: |
          set -euxo pipefail
          cd /work/elya
          make clean || true
          make -j2 base SGAI_BITS=2 EXTRA='-DRATE_PROBE'
          cp legend_of_elya.z64 /tmp/scalar_rate_probe.z64
          make clean || true
          make -j2 base-rsp-ovl SGAI_BITS=2 EXTRA='-DRATE_PROBE'
          cp legend_of_elya_rsp_ovl.z64 /tmp/rsp_rate_probe.z64
          sha256sum /tmp/*_rate_probe.z64 | tee /tmp/rom_sha256.txt

      - name: Assemble ROM provenance
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /rom-evidence
          for f in /tmp/libdragon.sha /tmp/libdragon-image-digest.txt /tmp/n64mk_sha256.txt /tmp/n64mk_compat_link.txt /tmp/rom_sha256.txt /tmp/scalar_rate_probe.z64 /tmp/rsp_rate_probe.z64; do
            [ -f "$f" ] && cp "$f" /rom-evidence/
          done
          printf 'target_sha=%s\nlibdragon_image=%s\n' "$TARGET_SHA" "$LIBDRAGON_IMAGE_DIGEST" > /rom-evidence/versions.txt

      - name: Upload exact RATE_PROBE ROMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zr91313-rate-probe-roms
          path: /rom-evidence
          if-no-files-found: error
          retention-days: 7

  benchmark:
    needs: build-roms
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Download exact RATE_PROBE ROMs from build job
        uses: actions/download-artifact@v4
        with:
          name: zr91313-rate-probe-roms
          path: /tmp/roms

      - name: Install dgb-n64 runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl unzip xvfb xauth \
            libsdl2-2.0-0 libdbus-1-3 libsamplerate0 libasound2t64 libpulse0 \
            libx11-6 libxext6 libxcursor1 libxi6 libxfixes3 libxrandr2 libxss1 \
            libdrm2 libgbm1 libwayland-client0 libwayland-cursor0 libxkbcommon0 \
            libdecor-0-0 mesa-vulkan-drivers libvulkan1
          ldd --version | head -1 | tee /tmp/glibc-version.txt
          strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 | grep '^GLIBCXX_' | sort -V | tail -1 | tee /tmp/glibcxx-version.txt

      - name: Verify ROM provenance from build job
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/roms
          sha256sum scalar_rate_probe.z64 rsp_rate_probe.z64 | tee /tmp/rom_sha256_benchmark.txt
          grep -F '54abd9197e5c8de487f6bff865f42974e1146a6639a8a1ed93ccde1310d006fb' /tmp/rom_sha256_benchmark.txt
          grep -F 'ddfee650835bffbc7f70cea60ee030a8ebacd56d11af62c46a5f7b064305f7e8' /tmp/rom_sha256_benchmark.txt
          cat versions.txt
          cat libdragon.sha

      - name: Download and verify exact dgb-n64 build artifact
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 \
            "https://nightly.link/Dillonb/n64/actions/runs/${DGB_RUN_ID}/n64-linux.zip" \
            -o /tmp/dgb.zip
          echo "${DGB_ZIP_SHA256}  /tmp/dgb.zip" | sha256sum -c -
          unzip -q /tmp/dgb.zip -d /tmp/dgb
          chmod +x /tmp/dgb/n64
          strings /tmp/dgb/n64 | grep -Fx "$DGB_SHA" | tee /tmp/dgb_embedded_sha.txt
          /tmp/dgb/n64 --help 2>&1 | tee /tmp/dgb_help.txt

      - name: Write bounded PTY runner
        shell: bash
        run: |
          cat >/tmp/run_dgb_rate.py <<'PY'
          #!/usr/bin/env python3
          import os, pty, select, signal, subprocess, sys, time

          emulator, rom, logpath = sys.argv[1:4]
          marker = sys.argv[4] if len(sys.argv) > 4 else "RATE_DONE"
          timeout = float(sys.argv[5]) if len(sys.argv) > 5 else 2700.0
          master, slave = pty.openpty()
          env = os.environ.copy()
          env.update({
              "SDL_AUDIODRIVER": "dummy",
              "LIBGL_ALWAYS_SOFTWARE": "1",
              "MESA_VK_DEVICE_SELECT": "llvmpipe",
          })
          cmd = ["xvfb-run", "-a", emulator, rom]
          proc = subprocess.Popen(
              cmd, stdout=slave, stderr=slave, stdin=subprocess.DEVNULL,
              close_fds=True, start_new_session=True, env=env)
          os.close(slave)
          start = time.monotonic()
          buf = b""
          records = []
          saw = False
          try:
              while True:
                  now = time.monotonic()
                  if now - start > timeout:
                      records.append((now - start, "HOST TIMEOUT"))
                      break
                  ready, _, _ = select.select([master], [], [], 0.1)
                  if ready:
                      try:
                          chunk = os.read(master, 65536)
                      except OSError:
                          break
                      if not chunk:
                          break
                      buf += chunk
                      while b"\n" in buf:
                          raw, buf = buf.split(b"\n", 1)
                          text = raw.decode("utf-8", "replace").rstrip("\r")
                          records.append((time.monotonic() - start, text))
                          if marker in text:
                              saw = True
                      if saw:
                          break
                  elif proc.poll() is not None:
                      break
          finally:
              if buf:
                  records.append((time.monotonic() - start, buf.decode("utf-8", "replace")))
              for sig in (signal.SIGINT, signal.SIGKILL):
                  if proc.poll() is not None:
                      break
                  try:
                      os.killpg(os.getpgid(proc.pid), sig)
                  except ProcessLookupError:
                      break
                  for _ in range(30):
                      if proc.poll() is not None:
                          break
                      time.sleep(0.1)
              try:
                  os.close(master)
              except OSError:
                  pass
          with open(logpath, "w", encoding="utf-8") as fh:
              for dt, text in records:
                  fh.write(f"{dt:10.3f}  {text}\n")
          with open(logpath, encoding="utf-8") as fh:
              sys.stdout.write(fh.read())
          raise SystemExit(0 if saw else 1)
          PY
          chmod +x /tmp/run_dgb_rate.py

      - name: Run scalar RATE_PROBE on dgb-n64
        shell: bash
        run: |
          set -o pipefail
          python3 /tmp/run_dgb_rate.py /tmp/dgb/n64 /tmp/roms/scalar_rate_probe.z64 /tmp/scalar_dgb.log RATE_DONE 2700 \
            | tee /tmp/scalar_console.txt

      - name: Run RSP-overlay RATE_PROBE on dgb-n64
        shell: bash
        run: |
          set -o pipefail
          python3 /tmp/run_dgb_rate.py /tmp/dgb/n64 /tmp/roms/rsp_rate_probe.z64 /tmp/rsp_dgb.log RATE_DONE 2700 \
            | tee /tmp/rsp_console.txt

      - name: Assemble independent-emulator evidence
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/evidence
          for f in \
            /tmp/glibc-version.txt /tmp/glibcxx-version.txt /tmp/rom_sha256_benchmark.txt \
            /tmp/dgb_embedded_sha.txt /tmp/dgb_help.txt /tmp/run_dgb_rate.py \
            /tmp/scalar_dgb.log /tmp/rsp_dgb.log /tmp/scalar_console.txt /tmp/rsp_console.txt; do
            [ -f "$f" ] && cp "$f" /tmp/evidence/
          done
          cp /tmp/roms/versions.txt /tmp/roms/libdragon.sha /tmp/roms/rom_sha256.txt /tmp/evidence/ 2>/dev/null || true
          printf 'target_sha=%s\ndgb_sha=%s\ndgb_run_id=%s\ndgb_zip_sha256=%s\n' \
            "$TARGET_SHA" "$DGB_SHA" "$DGB_RUN_ID" "$DGB_ZIP_SHA256" > /tmp/evidence/benchmark_versions.txt
          for f in /tmp/scalar_dgb.log /tmp/rsp_dgb.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E 'RATE |RSPPATH|token|TOKEN|OUT|RATE_DONE' "$f" || true
          done | tee /tmp/evidence/rate_markers.txt

      - name: Upload raw independent-emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zr91313-rustchain-16517-n64-dgb
          path: /tmp/evidence
          if-no-files-found: error
          retention-days: 7
