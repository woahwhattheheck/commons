name: Runtime provenance

on:
  pull_request:
    paths:
      - "tools/runtime_provenance/**"
      - "runtime/agent_runtime_registry.json"
      - "ground/AGENT_RUNTIME_PROVENANCE.md"
      - ".github/workflows/runtime-provenance.yml"
  push:
    branches:
      - main
    paths:
      - "tools/runtime_provenance/**"
      - "runtime/agent_runtime_registry.json"
      - "ground/AGENT_RUNTIME_PROVENANCE.md"
      - ".github/workflows/runtime-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run runtime-provenance tests
        run: python -m unittest discover -s tools/runtime_provenance -p 'test_*.py' -v

      - name: Run optimized runtime-provenance tests
        run: python -O -m unittest discover -s tools/runtime_provenance -p 'test_*.py' -v

      - name: Verify canonical registry
        run: python -m tools.runtime_provenance.runtime_registry verify runtime/agent_runtime_registry.json

      - name: Emit canonical registry digest
        run: python -m tools.runtime_provenance.runtime_registry digest runtime/agent_runtime_registry.json
