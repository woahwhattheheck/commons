name: commons-action-executor
on:
  workflow_run:
    workflows: ["commons-board"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commons-action-executor
  cancel-in-progress: false
jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fire GitHub verbs
        id: fire
        run: python3 action_executor.py --scope github > .action_changed.json
      - name: land outputs and receipts
        run: python3 action_land.py
