name: TITAN V5 V31 V4 E20 productive-detour ablation

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/research/v4-e20-productive-detour-ablation/**"
      - ".github/workflows/titan-v5-v31-v4-e20-detour-ablation.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact PR head with submitted history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact event head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab/candidates/v5/research/v4-e20-productive-detour-ablation
          python -m py_compile \
            ablate_e20_productive_detour.py \
            build_submitted_v4_treatment.py \
            trace_capture.py \
            paired.py \
            test_ablate_e20_productive_detour.py \
            test_build_submitted_v4_treatment.py \
            test_trace_capture.py \
            test_paired.py
          python -B -m unittest -v \
            test_ablate_e20_productive_detour.py \
            test_build_submitted_v4_treatment.py \
            test_trace_capture.py \
            test_paired.py
          python -O -B -m unittest -v \
            test_ablate_e20_productive_detour.py \
            test_build_submitted_v4_treatment.py \
            test_trace_capture.py \
            test_paired.py
          git diff --exit-code
