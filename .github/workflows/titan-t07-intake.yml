name: TITAN T07 public source intake
on:
  push:
    branches: [work/astra-elm-t07-20260907]
    paths: [.github/workflows/titan-t07-intake.yml]
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture public sources without executing downloaded code
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request, urllib.error
          root = pathlib.Path('t07-intake')
          root.mkdir()
          commons = 'https://raw.githubusercontent.com/woahwhattheheck/commons/8329e78768906dc6e75ca3712e1690adc1ab2148/revenue/kaggriculture/cloud-frontier-policy/next-panel/'
          engine = 'https://raw.githubusercontent.com/Kaggle/kaggle-environments/28b6d8af3ce73926b3d0fda1410c1ddd8384ab8c/'
          sources = {
              'barnyard-page.html': 'https://www.kaggle.com/code/romanrozen/strong-barnyard-economist?scriptVersionId=341074820',
              'barnyard-pull.json': 'https://www.kaggle.com/api/v1/kernels/pull/romanrozen/strong-barnyard-economist',
              'barnyard-v7-download': 'https://www.kaggle.com/kernels/scriptcontent/341074820/download',
          }
          for name in ['measure.py', 'prepare.py', 'UPSTREAM.json', 'NEXT-DISTRIBUTION-NOTICE.txt', 'NOTICE.txt', 'LICENSE', 'README.md', 'vendor/arlene.py', 'vendor/arlene-metadata.json', 'vendor/apex.ipynb', 'vendor/apex-metadata.json']:
              sources['baseline/' + name] = commons + name
          for name in ['kaggle_environments/envs/kaggriculture/kaggriculture.py', 'kaggle_environments/envs/kaggriculture/kaggriculture.json', 'kaggle_environments/envs/kaggriculture/utils.py', 'LICENSE']:
              sources['engine/' + name] = engine + name
          rows = []
          for name, url in sources.items():
              row = {'path': name, 'requested_url': url}
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'commons-titan-public-source-intake/1.0'})
                  try:
                      response = urllib.request.urlopen(req, timeout=35)
                  except urllib.error.HTTPError as exc:
                      response = exc
                  with response as r:
                      body = r.read(8 * 1024 * 1024 + 1)
                      if len(body) > 8 * 1024 * 1024:
                          raise ValueError('response exceeds bounded intake size')
                      row.update(status=r.status, content_type=r.headers.get('Content-Type'), final_url=r.geturl(), bytes=len(body), sha256=hashlib.sha256(body).hexdigest())
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(body)
              except Exception as exc:
                  row['error_type'] = type(exc).__name__
              rows.append(row)
              print(json.dumps({k: v for k, v in row.items() if k not in ('requested_url', 'final_url')}, sort_keys=True))
          manifest = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'workflow_sha': os.environ['GITHUB_SHA'], 'executed_downloaded_code': False, 'requests': rows}
          (root / 'INTAKE.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
      - name: Retain exact raw bytes for inspection
        uses: actions/upload-artifact@v4
        with:
          name: titan-t07-public-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: t07-intake/
          if-no-files-found: error
          retention-days: 30
