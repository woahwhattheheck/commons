name: titan-v5-v31-champion-ratchet

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v5-v31-champion-ratchet.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/champion-ratchet/**"

permissions:
  contents: read

concurrency:
  group: titan-v5-v31-champion-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run champion-ratchet contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/champion-ratchet
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m py_compile champion_gate.py test_champion_gate.py
          python -B -m unittest -v test_champion_gate
          python -O -B -m unittest -v test_champion_gate
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
