name: open-door-guard

# Mirror open_door_guard.py active suffixes and historical-data exclusions.
# Guard source and its own matrix still trigger through the Python patterns.
on:
  pull_request:
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cfg'
      - '**/*.cmd'
      - '**/*.conf'
      - '**/*.cpp'
      - '**/*.css'
      - '**/*.go'
      - '**/*.h'
      - '**/*.html'
      - '**/*.java'
      - '**/*.js'
      - '**/*.json'
      - '**/*.jsx'
      - '**/*.kt'
      - '**/*.md'
      - '**/*.mjs'
      - '**/*.php'
      - '**/*.ps1'
      - '**/*.py'
      - '**/*.rb'
      - '**/*.rs'
      - '**/*.scala'
      - '**/*.sh'
      - '**/*.sql'
      - '**/*.svelte'
      - '**/*.swift'
      - '**/*.txt'
      - '**/*.toml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.vue'
      - '**/*.xml'
      - '**/*.yaml'
      - '**/*.yml'
      - '!p/**'
      - '!by/**'
      - '!to/**'
      - '!d/**'
      - '!chunks/**'
      - '!excerpts/**'
      - '!drop/patches/**'
      - '!muhl/lda-docs/**'
      - '!builds/records/**'
      - '!board.html'
      - '!board.md'
      - '!fresh.md'
      - '!export.txt'
      - '!posts.json'
      - '!recent.json'
      - '!revenue/data/board_feed_sample_20260830.json'
  push:
    branches: [main]
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cfg'
      - '**/*.cmd'
      - '**/*.conf'
      - '**/*.cpp'
      - '**/*.css'
      - '**/*.go'
      - '**/*.h'
      - '**/*.html'
      - '**/*.java'
      - '**/*.js'
      - '**/*.json'
      - '**/*.jsx'
      - '**/*.kt'
      - '**/*.md'
      - '**/*.mjs'
      - '**/*.php'
      - '**/*.ps1'
      - '**/*.py'
      - '**/*.rb'
      - '**/*.rs'
      - '**/*.scala'
      - '**/*.sh'
      - '**/*.sql'
      - '**/*.svelte'
      - '**/*.swift'
      - '**/*.txt'
      - '**/*.toml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.vue'
      - '**/*.xml'
      - '**/*.yaml'
      - '**/*.yml'
      - '!p/**'
      - '!by/**'
      - '!to/**'
      - '!d/**'
      - '!chunks/**'
      - '!excerpts/**'
      - '!drop/patches/**'
      - '!muhl/lda-docs/**'
      - '!builds/records/**'
      - '!board.html'
      - '!board.md'
      - '!fresh.md'
      - '!export.txt'
      - '!posts.json'
      - '!recent.json'
      - '!revenue/data/board_feed_sample_20260830.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-added-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The guard diffs BASE..HEAD; it needs those two commits' trees, not
        # history.  A full clone of this repo costs the runner ~130-150 s per
        # run (measured on eight green runs, guard itself 0-1 s).  Fetch HEAD
        # shallow here and the base commit shallow below; GitHub serves a
        # reachable commit by SHA at depth 1.  Fallbacks are unchanged.

      - name: reject newly added Action Pad or Commons admission locks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "$base" || true
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}"; then
            git fetch --quiet --deepen=1 origin 2>/dev/null || true
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          python3 open_door_guard.py --diff "$base" HEAD

      - name: verify the guard's own matrix
        run: python3 test_open_door_guard.py
