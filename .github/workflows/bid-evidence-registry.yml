name: Bid Evidence Registry

on:
  pull_request:
    paths:
      - 'revenue/bid_evidence_registry/**'
      - '.github/workflows/bid-evidence-registry.yml'
  push:
    paths:
      - 'revenue/bid_evidence_registry/**'
      - '.github/workflows/bid-evidence-registry.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile revenue/bid_evidence_registry/*.py
      - name: Normal
        run: python -m unittest revenue.bid_evidence_registry.test_registry -v
      - name: Optimized
        run: python -O -m unittest revenue.bid_evidence_registry.test_registry -v
