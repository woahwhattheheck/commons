name: titan-v2-delayed-rival-ablation-sol-caliber

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v2-delayed-rival-ablation-sol-caliber.yml"
      - "revenue/kaggriculture/cloud-execution-lab/analysis/v2-delayed-rival-ablation-sol-caliber/**"
      - "revenue/kaggriculture/cloud-execution-lab/analysis/v2-target-domain-ablation-sol-bulwark/materialize.py"
      - "revenue/kaggriculture/cloud-execution-lab/analysis/v2-target-domain-ablation-sol-bulwark/compare.py"
      - "p/sol-caliber-titan-v2-delayed-rival-ablation-20260909-01.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-causal-screen:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LAB: revenue/kaggriculture/cloud-execution-lab
      KAG: revenue/kaggriculture
      CASE: revenue/kaggriculture/cloud-execution-lab/analysis/v2-delayed-rival-ablation-sol-caliber
      SEEDS: "539131249,1834999074,2609097301,2611092207"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source identities
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object "$LAB/runtime/variants/v1/scheduler.py")" = "cbc502a92fe9d790cfaf763f6990d1057bc9b82d"
          test "$(git hash-object "$LAB/runtime/variants/v2/scheduler.py")" = "7c068b7078c3d7c09bb3836590ad42b0af934cdf"
          test "$(git hash-object "$LAB/runtime/variants/v2/candidate.py")" = "8db1262a2d38cc3115d06732383e18e1132ccfba"
          test "$(git hash-object "$LAB/analysis/v2-target-domain-ablation-sol-bulwark/materialize.py")" = "e7740bbd2f5ad71f565073445535d6941184288c"
          test "$(git hash-object "$LAB/analysis/v2-target-domain-ablation-sol-bulwark/compare.py")" = "6d66238b2ce1f11f26752049c106502be5ef0ec7"
          test "$(git hash-object "$CASE/materialize.py")" = "f115eaf5119e14c8c13d8e799b5ef30e8bd66a7d"
          test "$(git hash-object "$CASE/compare.py")" = "90c1f79dff43c9cd4501b778962abdd2d00c52fa"
          test "$(git hash-object "$CASE/test_materialize.py")" = "c8d2d1fcf38cf7fc127368c1d8a8d9d1d4467ed2"
          test "$(git hash-object "$CASE/test_compare.py")" = "aa5eb034603aa5b61bd313bf3824de6cbae4aff8"
          test "$(git hash-object "$CASE/README.md")" = "a25dff8c95d780d5d9ba42fae2be3e90f02f4546"
          test "$(git hash-object "p/sol-caliber-titan-v2-delayed-rival-ablation-20260909-01.md")" = "916e672ced6798fa35e7907e5acef3b7134a38c5"
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          printf 'exact_head=%s\n' "$EXPECTED_HEAD"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned official-interpreter dependency
        run: python -m pip install --disable-pip-version-check "kaggle-environments==1.32.7"

      - name: Run one-factor and actual-source contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/analysis/v2-delayed-rival-ablation-sol-caliber
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v test_materialize.py test_compare.py
          python -B -m py_compile materialize.py compare.py test_materialize.py test_compare.py

      - name: Materialize exact frozen V2 ablation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v2-delayed-rival-ablation"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python -B "$CASE/materialize.py" \
            --source "$LAB/runtime/variants/v2" \
            --output "$OUT/candidate" \
            --receipt "$OUT/MATERIALIZATION.json"
          cat "$OUT/MATERIALIZATION.json"

      - name: Verify canonical package stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$LAB"
            python -B build_integrated.py --check
          )
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"

      - name: Run frozen V2 control panel
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v2-delayed-rival-ablation"
          python -B "$KAG/cloud-eval/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$LAB/runtime/variants/v2/candidate.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$OUT/control.json"

      - name: Run delayed-rival ablation panel
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v2-delayed-rival-ablation"
          python -B "$KAG/cloud-eval/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$OUT/candidate/candidate.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$OUT/candidate.json"

      - name: Classify one-factor own-cash signal
        id: classify
        if: always()
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/v2-delayed-rival-ablation"
          python -B "$CASE/compare.py" \
            --control "$OUT/control.json" \
            --candidate "$OUT/candidate.json" \
            --receipt "$OUT/MATERIALIZATION.json" \
            --head "$(git rev-parse HEAD)" \
            --output "$OUT/ABLATION-REPORT.json" \
            --markdown "$OUT/ABLATION-REPORT.md"
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish readable result
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/v2-delayed-rival-ablation/ABLATION-REPORT.md"
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# V2 delayed-rival ablation did not reach classification" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v2-delayed-rival-ablation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v2-delayed-rival-ablation/
          if-no-files-found: error
          retention-days: 30

      - name: Assert exact head stayed clean
        if: always()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"

      - name: Require broad own-cash upside
        if: always()
        shell: bash
        run: test "${{ steps.classify.outputs.exit_code }}" = "0"
