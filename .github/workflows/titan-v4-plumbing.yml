name: titan-v4-plumbing

on:
  pull_request:
    branches:
      - titan/v4-20260911
    paths:
      - '.github/workflows/titan-v4-plumbing.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v4.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/build_v3.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/check_v4_plumbing.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/check_v4_plumbing_monotonic.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json'
  push:
    branches:
      - titan/v4-20260911
    paths:
      - '.github/workflows/titan-v4-plumbing.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v4.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/build_v3.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/check_v4_plumbing.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/check_v4_plumbing_monotonic.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v4-plumbing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-v4-plumbing.yml
            /revenue/kaggriculture/cloud-execution-lab/candidates/v3/
            /revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz

      - name: Materialize digest-pinned canonical archive
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          head_sha = os.environ["HEAD_SHA"]
          archive = pathlib.Path(
              "revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz"
          )
          lab = pathlib.Path("revenue/kaggriculture/cloud-execution-lab/candidates/v3")
          pinned = json.loads(lab.joinpath("V3-MANIFEST.json").read_text(encoding="utf-8"))["base"]["sha256"]
          historical = (
              "revenue/kaggriculture/cloud-execution-lab/exports/historical/"
              f"titan-{pinned}.tar.gz"
          )
          archive.parent.mkdir(parents=True, exist_ok=True)

          def digest_of(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def fetch(ref: str) -> str:
              subprocess.run(
                  ["git", "fetch", "--no-tags", "--filter=blob:none", "--depth=1", "origin", ref],
                  check=True,
              )
              return subprocess.check_output(["git", "rev-parse", "FETCH_HEAD"], text=True).strip()

          def cat_file(sha: str, path: str):
              probe = subprocess.run(
                  ["git", "cat-file", "-e", f"{sha}:{path}"],
                  capture_output=True,
              )
              if probe.returncode != 0:
                  return None
              return subprocess.check_output(["git", "cat-file", "blob", f"{sha}:{path}"])

          tried = []

          def consider(label: str, data):
              if data is None:
                  tried.append(f"{label}=missing")
                  return None
              digest = digest_of(data)
              tried.append(f"{label}={digest}")
              if digest == pinned:
                  return data
              return None

          fetch(head_sha)
          chosen = consider("HEAD titan-current", cat_file(head_sha, str(archive)))
          if chosen is None:
              main_sha = fetch("main")
              chosen = consider(
                  "main digest-addressed historical",
                  cat_file(main_sha, historical),
              ) or consider("main titan-current", cat_file(main_sha, str(archive)))
          if chosen is None:
              sys.stderr.write(
                  f"canonical archive pin {pinned} not found; tried {', '.join(tried)}\n"
              )
              sys.exit(1)
          archive.write_bytes(chosen)
          print("CANONICAL ARCHIVE OK", digest_of(chosen), archive.stat().st_size)
          PY

      - name: Capture exact target V4 apply layer
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          APPLY=revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v4.py
          if [[ -n "${BASE_SHA:-}" ]]; then
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              echo "refusing zero/unknown predecessor SHA" >&2
              exit 1
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA"
            fi

            # The promotion-state wrapper reconstructs the base package by
            # swapping only base apply_v4.py into the HEAD build recipe. That
            # comparison is exact only while the frozen V3/build inputs are
            # byte-identical to the target. Fail closed on any drift instead of
            # letting HEAD rewrite both sides of the monotonicity proof.
            for frozen in \
              revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py \
              revenue/kaggriculture/cloud-execution-lab/candidates/v3/build_v3.py \
              revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json
            do
              if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$frozen"; then
                echo "::error file=$frozen::V4 plumbing guard requires this frozen V3/build input to match the exact target base"
                git diff -- "$BASE_SHA" "$HEAD_SHA" -- "$frozen"
                exit 1
              fi
            done

            git cat-file blob "${BASE_SHA}:${APPLY}" > "$RUNNER_TEMP/base_apply_v4.py"
          else
            cp "$APPLY" "$RUNNER_TEMP/base_apply_v4.py"
          fi

      - name: Verify monotonic V4 plumbing and materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          python3 -m py_compile \
            "$LAB/check_v4_plumbing.py" \
            "$LAB/check_v4_plumbing_monotonic.py"
          python3 -O "$LAB/check_v4_plumbing.py" \
            --base-apply-v4 "$RUNNER_TEMP/base_apply_v4.py"
          python3 -O "$LAB/check_v4_plumbing_monotonic.py" \
            --base-apply-v4 "$RUNNER_TEMP/base_apply_v4.py"
          python3 - <<'PY'
          import ast
          import pathlib
          import sys

          lab = pathlib.Path("revenue/kaggriculture/cloud-execution-lab/candidates/v3")
          sys.path.insert(0, str(lab))
          import build_v3

          runtime = build_v3.package_files()["titan_runtime.py"].decode("utf-8")
          tree = ast.parse(runtime, filename="titan_runtime.py")

          def direct_names(target):
              if isinstance(target, ast.Name):
                  return {target.id}
              if isinstance(target, (ast.Tuple, ast.List)):
                  out = set()
                  for item in target.elts:
                      out.update(direct_names(item))
                  return out
              return set()

          def final_live_class(name):
              found = None
              class_defs = []
              for node in tree.body:
                  if isinstance(node, ast.ClassDef):
                      if node.name == name:
                          class_defs.append(node)
                          found = node
                      continue
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.name == name:
                          found = None
                      continue
                  if isinstance(node, ast.Assign):
                      if any(name in direct_names(target) for target in node.targets):
                          found = None
                      continue
                  if isinstance(node, ast.AnnAssign):
                      if name in direct_names(node.target):
                          found = None
                      continue
                  if isinstance(node, ast.AugAssign):
                      if name in direct_names(node.target):
                          found = None
                      continue
                  if isinstance(node, ast.Delete):
                      if any(name in direct_names(target) for target in node.targets):
                          found = None
                      continue
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      for alias in node.names:
                          bound = alias.asname or alias.name.split(".", 1)[0]
                          if bound == name:
                              found = None
              if len(class_defs) != 1 or found is not class_defs[0]:
                  raise SystemExit(
                      f"materialized titan_runtime.py has shadowed/rebound {name}; "
                      "plumbing audit must bind the live runtime class"
                  )
              return found

          for required in ("Features", "TitanAgent"):
              final_live_class(required)

          poison = ast.parse(
              "class TitanAgent:\n    pass\nclass TitanAgent:\n    pass\n"
          )
          original = tree
          tree = poison
          try:
              try:
                  final_live_class("TitanAgent")
              except SystemExit:
                  pass
              else:
                  raise SystemExit(
                      "internal class-binding regression: duplicate TitanAgent false-passed"
                  )
          finally:
              tree = original

          print("V4 LIVE CLASS BINDINGS OK", "Features", "TitanAgent")
          PY
