name: titan-v4-plumbing

on:
  pull_request:
    branches:
      - titan/v4-20260911
    paths:
      - '.github/workflows/titan-v4-plumbing.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/**'
  push:
    branches:
      - titan/v4-20260911
    paths:
      - '.github/workflows/titan-v4-plumbing.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v4-plumbing-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-v4-plumbing.yml
            /revenue/kaggriculture/cloud-execution-lab/candidates/v3/
            /revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz

      - name: Materialize digest-pinned canonical archive
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          head_sha = os.environ["HEAD_SHA"]
          archive = pathlib.Path(
              "revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz"
          )
          lab = pathlib.Path("revenue/kaggriculture/cloud-execution-lab/candidates/v3")
          pinned = json.loads(
              lab.joinpath("V3-MANIFEST.json").read_text(encoding="utf-8")
          )["base"]["sha256"]
          historical = (
              "revenue/kaggriculture/cloud-execution-lab/exports/historical/"
              f"titan-{pinned}.tar.gz"
          )
          archive.parent.mkdir(parents=True, exist_ok=True)

          def digest_of(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def fetch(ref: str) -> str:
              subprocess.run(
                  ["git", "fetch", "--no-tags", "--filter=blob:none", "--depth=1", "origin", ref],
                  check=True,
              )
              return subprocess.check_output(
                  ["git", "rev-parse", "FETCH_HEAD"], text=True
              ).strip()

          def cat_file(sha: str, path: str):
              probe = subprocess.run(
                  ["git", "cat-file", "-e", f"{sha}:{path}"],
                  capture_output=True,
              )
              if probe.returncode != 0:
                  return None
              return subprocess.check_output(["git", "cat-file", "blob", f"{sha}:{path}"])

          tried = []

          def consider(label: str, data):
              if data is None:
                  tried.append(f"{label}=missing")
                  return None
              digest = digest_of(data)
              tried.append(f"{label}={digest}")
              if digest == pinned:
                  return data
              return None

          fetch(head_sha)
          chosen = consider("HEAD titan-current", cat_file(head_sha, str(archive)))
          if chosen is None:
              main_sha = fetch("main")
              chosen = consider(
                  "main digest-addressed historical",
                  cat_file(main_sha, historical),
              ) or consider("main titan-current", cat_file(main_sha, str(archive)))
          if chosen is None:
              sys.stderr.write(
                  f"canonical archive pin {pinned} not found; tried {', '.join(tried)}\n"
              )
              sys.exit(1)

          archive.write_bytes(chosen)
          print("CANONICAL ARCHIVE OK", digest_of(chosen), archive.stat().st_size)
          PY

      - name: Capture exact target V4 layer and pin
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          LAB=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          APPLY="$LAB/apply_v4.py"
          MANIFEST="$LAB/V3-MANIFEST.json"

          if [[ -n "${BASE_SHA:-}" ]]; then
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              echo "refusing zero/unknown predecessor SHA" >&2
              exit 1
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA"
            fi
            git cat-file blob "${BASE_SHA}:${APPLY}" > "$RUNNER_TEMP/base_apply_v4.py"
            git cat-file blob "${BASE_SHA}:${MANIFEST}" > "$RUNNER_TEMP/base_manifest.json"

            python3 - <<'PY'
          import json
          import os
          import pathlib

          lab = pathlib.Path("revenue/kaggriculture/cloud-execution-lab/candidates/v3")
          head = json.loads(lab.joinpath("V3-MANIFEST.json").read_text(encoding="utf-8"))
          base = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "base_manifest.json").read_text(encoding="utf-8")
          )
          head_pin = head["base"]["sha256"]
          base_pin = base["base"]["sha256"]
          if head_pin != base_pin:
              raise SystemExit(
                  f"V4 plumbing guard forbids silent canonical base repin: {base_pin} -> {head_pin}"
              )
          print("V4 BASE PIN OK", head_pin)
          PY
          else
            cp "$APPLY" "$RUNNER_TEMP/base_apply_v4.py"
          fi

      - name: Verify monotonic V4 plumbing and materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          python3 -m py_compile "$LAB/check_v4_plumbing.py"
          python3 -O "$LAB/check_v4_plumbing.py" --self-test
          python3 -O "$LAB/check_v4_plumbing.py" \
            --base-apply-v4 "$RUNNER_TEMP/base_apply_v4.py"
