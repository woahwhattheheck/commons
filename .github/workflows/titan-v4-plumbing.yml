name: titan-v4-plumbing

on:
  pull_request:
    branches:
      - titan/v4-20260911
    paths:
      - '.github/workflows/titan-v4-plumbing.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/**'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/historical/**'
  push:
    branches:
      - titan/v4-20260911
    paths:
      - '.github/workflows/titan-v4-plumbing.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/**'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/historical/**'
  workflow_dispatch:

permissions:
  contents: read

# PR updates may cancel stale runs for that PR. Pushes and manual checks are
# evidence for a specific tree transition and must never cancel one another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('titan-v4-plumbing-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('titan-v4-plumbing-push-{0}-{1}', github.event.before, github.sha) || format('titan-v4-plumbing-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Ancestry is part of the proof. Keep full commit history while blob
          # filtering + sparse checkout keep the transfer small.
          fetch-depth: 0
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-v4-plumbing.yml
            /revenue/kaggriculture/cloud-execution-lab/candidates/v3/
            /revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz

      - name: Materialize digest-pinned canonical archive
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          head_sha = os.environ["HEAD_SHA"]
          archive = pathlib.Path(
              "revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz"
          )
          lab = pathlib.Path("revenue/kaggriculture/cloud-execution-lab/candidates/v3")
          pinned = json.loads(
              lab.joinpath("V3-MANIFEST.json").read_text(encoding="utf-8")
          )["base"]["sha256"]
          historical = (
              "revenue/kaggriculture/cloud-execution-lab/exports/historical/"
              f"titan-{pinned}.tar.gz"
          )
          archive.parent.mkdir(parents=True, exist_ok=True)

          def digest_of(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def fetch(ref: str) -> str:
              subprocess.run(
                  ["git", "fetch", "--no-tags", "--filter=blob:none", "origin", ref],
                  check=True,
              )
              return subprocess.check_output(
                  ["git", "rev-parse", "FETCH_HEAD"], text=True
              ).strip()

          def cat_file(sha: str, path: str):
              probe = subprocess.run(
                  ["git", "cat-file", "-e", f"{sha}:{path}"],
                  capture_output=True,
              )
              if probe.returncode != 0:
                  return None
              return subprocess.check_output(
                  ["git", "cat-file", "blob", f"{sha}:{path}"]
              )

          tried = []

          def consider(label: str, data):
              if data is None:
                  tried.append(f"{label}=missing")
                  return None
              digest = digest_of(data)
              tried.append(f"{label}={digest}")
              return data if digest == pinned else None

          chosen = consider("HEAD titan-current", cat_file(head_sha, str(archive)))
          if chosen is None:
              main_sha = fetch("main")
              chosen = consider(
                  "main digest-addressed historical", cat_file(main_sha, historical)
              ) or consider("main titan-current", cat_file(main_sha, str(archive)))
          if chosen is None:
              sys.stderr.write(
                  f"canonical archive pin {pinned} not found; tried {', '.join(tried)}\n"
              )
              raise SystemExit(1)
          archive.write_bytes(chosen)
          print("CANONICAL ARCHIVE OK", digest_of(chosen), archive.stat().st_size)
          PY

      - name: Capture exact predecessor contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          LAB=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          APPLY="$LAB/apply_v4.py"
          CHECK="$LAB/check_v4_plumbing.py"

          BASE_SHA="$EVENT_BASE_SHA"
          if [[ -z "$BASE_SHA" && "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "refusing missing/zero predecessor SHA" >&2
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none origin "$BASE_SHA"
          fi
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "refusing diverged/stale V4 carrier: BASE_SHA is not an ancestor of HEAD_SHA" >&2
            echo "BASE_SHA=$BASE_SHA HEAD_SHA=$HEAD_SHA" >&2
            exit 1
          fi

          # The predecessor checker may import build_v3 while proving the HEAD
          # package. Keep that build oracle trustworthy by requiring these exact
          # recipe/manifest inputs to match BASE. Candidate apply_v4.py and
          # overlay/** remain free to change and are the package surface under test.
          for frozen in \
            "$LAB/apply_v3.py" \
            "$LAB/build_v3.py" \
            "$LAB/V3-MANIFEST.json"
          do
            if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$frozen"; then
              echo "::error file=$frozen::V4 plumbing guard requires this build-oracle input to match exact predecessor"
              git diff -- "$BASE_SHA" "$HEAD_SHA" -- "$frozen"
              exit 1
            fi
          done

          git cat-file blob "${BASE_SHA}:${APPLY}" > "$RUNNER_TEMP/base_apply_v4.py"
          if git cat-file -e "${BASE_SHA}:${CHECK}" 2>/dev/null; then
            git cat-file blob "${BASE_SHA}:${CHECK}" > "$RUNNER_TEMP/base_check_v4_plumbing.py"
          else
            : > "$RUNNER_TEMP/base_check_v4_plumbing.py"
          fi
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/base_sha.txt"

      - name: Verify V4 plumbing and materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          ARCHIVE=revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz
          BASE_SHA="$(cat "$RUNNER_TEMP/base_sha.txt")"

          # Once the guard has landed, every successor must satisfy the exact
          # predecessor checker too. Run it from an isolated package-recipe tree:
          # BASE build_v3/apply_v3/manifest + HEAD apply_v4/overlay. This prevents
          # candidate-controlled root modules/import paths from fabricating the
          # package oracle while still testing the actual candidate package surface.
          if [[ -s "$RUNNER_TEMP/base_check_v4_plumbing.py" ]]; then
            ROOT="$RUNNER_TEMP/trusted-root"
            TRUSTED="$ROOT/candidates/v3"
            mkdir -p "$TRUSTED" "$ROOT/exports"
            cp "$RUNNER_TEMP/base_check_v4_plumbing.py" "$TRUSTED/check_v4_plumbing.py"
            git cat-file blob "${BASE_SHA}:${LAB}/build_v3.py" > "$TRUSTED/build_v3.py"
            git cat-file blob "${BASE_SHA}:${LAB}/apply_v3.py" > "$TRUSTED/apply_v3.py"
            git cat-file blob "${BASE_SHA}:${LAB}/V3-MANIFEST.json" > "$TRUSTED/V3-MANIFEST.json"
            cp "$LAB/apply_v4.py" "$TRUSTED/apply_v4.py"
            cp -a "$LAB/overlay" "$TRUSTED/overlay"
            cp "$ARCHIVE" "$ROOT/exports/titan-current.tar.gz"
            python3 -O "$TRUSTED/check_v4_plumbing.py" \
              --base-apply-v4 "$RUNNER_TEMP/base_apply_v4.py"
          fi

          python3 -m py_compile "$LAB/check_v4_plumbing.py"
          python3 -O "$LAB/check_v4_plumbing.py" --self-test
          python3 -O "$LAB/check_v4_plumbing.py" \
            --base-apply-v4 "$RUNNER_TEMP/base_apply_v4.py"
