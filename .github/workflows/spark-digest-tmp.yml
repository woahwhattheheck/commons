name: spark-digest-tmp
on:
  push:
    branches: [spark-digest-tmp-20260905]
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute digests
        run: |
          python3 <<'PY'
          import base64,hashlib,json,urllib.request
          UA={'User-Agent':'SPARK'}
          lines=[]
          worked_ref=None
          for path in ['revenue/production_survival/offer.json','revenue/right_now/catalog.json']:
           u=f'https://api.github.com/repos/woahwhattheheck/commons/contents/{path}?ref=spark-survival-offer-page-truth-20260905-01'
           try:
            o=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA)))
            if worked_ref is None: worked_ref='spark-survival-offer-page-truth-20260905-01'
           except Exception:
            u=f'https://api.github.com/repos/woahwhattheheck/commons/contents/{path}?ref=4cfeaa8082dc492679fc1312ee0fc5b6d8fca591'
            o=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA)))
            if worked_ref is None: worked_ref='4cfeaa8082dc492679fc1312ee0fc5b6d8fca591'
           line=f"{path} {hashlib.sha256(base64.b64decode(o['content'])).hexdigest()}"
           print(line)
           lines.append(line)
          open('digests.txt','w').write('\n'.join(lines)+f'\nREF:{worked_ref}\n')
          PY
      - name: Commit digests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add digests.txt
          git commit -m "chore: temporary digest output" || exit 0
          git push
