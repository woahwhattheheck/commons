name: birch-joint-capacity-canonical-adopt

on:
  push:
    branches:
      - codex/birch-joint-capacity-canonical-20260908

permissions:
  contents: write

concurrency:
  group: birch-joint-capacity-canonical-adopt
  cancel-in-progress: false

jobs:
  adopt:
    if: ${{ !contains(github.event.head_commit.message, '[joint-capacity-canonical-adopted]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect completed branch
        id: guard
        shell: bash
        run: |
          if [ ! -f .github/workflows/birch-joint-capacity-canonical-adopt.yml ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build the one canonical package from exact current source
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_a=revenue/kaggriculture/cloud-market-response/selected_action_history.py
          source_b=revenue/kaggriculture/cloud-execution-lab/reference/titan-history/selected_action_history.py
          test "$(git hash-object "$source_a")" = 7967fb43c64bc3154fe7da609497873163c773eb
          test "$(git hash-object "$source_b")" = 7967fb43c64bc3154fe7da609497873163c773eb

          lab=revenue/kaggriculture/cloud-execution-lab
          old_sha=$(sha256sum "$lab/exports/titan-current.tar.gz" | awk '{print $1}')
          old_bytes=$(wc -c < "$lab/exports/titan-current.tar.gz")
          printf '%s\n' "$old_sha" > /tmp/old-sha
          printf '%s\n' "$old_bytes" > /tmp/old-bytes

          python3 -B "$lab/build_integrated.py" > /tmp/build-receipt.json
          python3 -B "$lab/build_integrated.py" --check > /tmp/check-receipt.json
          cmp /tmp/build-receipt.json /tmp/check-receipt.json

          python3 -B "$source_a" >/dev/null 2>&1 || true
          python3 -B revenue/kaggriculture/cloud-market-response/test_joint_sale_capacity.py
          (
            cd "$lab"
            python3 -B -m unittest -v test_history_archive test_terminal_history_join test_release_consistency
          )

      - name: Verify packaged source identity and record adoption
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: python
        run: |
          import hashlib, json, tarfile
          from pathlib import Path

          root = Path('revenue/kaggriculture/cloud-execution-lab')
          source = root / 'reference/titan-history/selected_action_history.py'
          archive = root / 'exports/titan-current.tar.gz'
          current = json.loads((root/'runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())
          manifest = json.loads((root/'runtime/integrated-selected/CURRENT-SOURCE.json').read_text())
          old_sha = Path('/tmp/old-sha').read_text().strip()
          old_bytes = int(Path('/tmp/old-bytes').read_text())
          new_data = archive.read_bytes()
          source_data = source.read_bytes()

          assert current['sha256'] == hashlib.sha256(new_data).hexdigest()
          assert current['bytes'] == len(new_data)
          assert current['source_manifest_sha256'] == hashlib.sha256(
              (root/'runtime/integrated-selected/CURRENT-SOURCE.json').read_bytes()).hexdigest()
          expected_source_sha = hashlib.sha256(source_data).hexdigest()
          assert manifest['runtime']['reference/titan-history/selected_action_history.py']['sha256'] == expected_source_sha
          assert manifest['runtime']['reference/titan-history/selected_action_history.py']['bytes'] == len(source_data)

          with tarfile.open(archive, 'r:gz') as tf:
              packaged = tf.extractfile('reference/titan-history/selected_action_history.py').read()
              packaged_manifest = tf.extractfile('SOURCE.json').read()
          assert packaged == source_data
          assert hashlib.sha256(packaged_manifest).hexdigest() == current['source_manifest_sha256']

          historical = root/'exports/historical'/f'titan-{old_sha}.tar.gz'
          if old_sha != current['sha256']:
              assert historical.exists()
              old_data = historical.read_bytes()
              assert len(old_data) == old_bytes
              assert hashlib.sha256(old_data).hexdigest() == old_sha

          note = Path('p/astra-birch-joint-capacity-canonical-adoption-20260908-01.md')
          note.write_text(f'''# TITAN joint-capacity canonical adoption\n\n## Change\n\nThe existing deterministic TITAN builder adopted the landed shared-capacity prior-sale source into the one current package. Default configuration and policy selection are unchanged.\n\n- source Git blob: `7967fb43c64bc3154fe7da609497873163c773eb`\n- previous archive SHA-256: `{old_sha}` ({old_bytes} bytes)\n- current archive SHA-256: `{current["sha256"]}` ({current["bytes"]} bytes)\n- current source-manifest SHA-256: `{current["source_manifest_sha256"]}`\n- packaged runtime files: `{current["runtime_files"]}`\n\nThe archive member `reference/titan-history/selected_action_history.py` is byte-identical to the landed repository source. The superseded current archive is retained under its digest when the bytes changed.\n\n## Validation\n\n- `python3 -B build_integrated.py`\n- `python3 -B build_integrated.py --check`\n- focused shared-capacity tests\n- existing history-archive, terminal-history, and release-consistency tests\n\nThis is source-closure adoption only: no default/configuration change, game, seed, strength attribution, provider upload, or submission.\n''', encoding='utf-8')

      - name: Publish generated package and remove temporary automation
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/birch-joint-capacity-canonical-adopt.yml
          rm -f .birch-joint-capacity-canonical-trigger
          git add -A \
            .github/workflows/birch-joint-capacity-canonical-adopt.yml \
            .birch-joint-capacity-canonical-trigger \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/exports/historical \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json \
            p/astra-birch-joint-capacity-canonical-adoption-20260908-01.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[joint-capacity-canonical-adopted] Refresh current TITAN source closure'
          git push origin HEAD:${GITHUB_REF_NAME}
