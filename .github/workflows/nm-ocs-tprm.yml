name: NM OCS TPRM carrier

on:
  pull_request:
    paths:
      - 'revenue/nm_ocs_tprm/**'
      - '.github/workflows/nm-ocs-tprm.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/nm_ocs_tprm/**'
      - '.github/workflows/nm-ocs-tprm.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Normal tests
        run: python -m unittest discover -s revenue/nm_ocs_tprm/tests -p 'test_*.py' -v
      - name: Optimized tests
        run: python -O -m unittest discover -s revenue/nm_ocs_tprm/tests -p 'test_*.py' -v
      - name: Compile
        run: python -m compileall -q revenue/nm_ocs_tprm
      - name: Verify source manifest
        run: python revenue/nm_ocs_tprm/verify_manifest.py
