name: TITAN V4 ROWSHED graph-postimage field

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/titan-v4-row-shed-postimage-field.yml
      - revenue/kaggriculture/cloud-execution-lab/candidates/v4/COMPOSITION.json
      - revenue/kaggriculture/cloud-execution-lab/candidates/v4/check_composition_graph.py
      - revenue/kaggriculture/cloud-execution-lab/candidates/v4/build_composed_postimage.py
      - revenue/kaggriculture/cloud-execution-lab/candidates/v4/run_composed_postimage.py
      - revenue/kaggriculture/cloud-execution-lab/candidates/v4/postimage_trust.py
      - revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/gameplay/row-shed-sell-order/**
  pull_request:
    paths:
      - .github/workflows/titan-v4-row-shed-postimage-field.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: titan-v4-row-shed-postimage-field
  cancel-in-progress: false

jobs:
  field:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate canonical graph and row-shed source generation
        shell: bash
        run: |
          set -euo pipefail
          V4=revenue/kaggriculture/cloud-execution-lab/candidates/v4
          ROW="$V4/repairs/gameplay/row-shed-sell-order"
          test "$(git hash-object "$V4/COMPOSITION.json")" = 925221c32f4af05765d35113a2a5498ba80a0c04
          test "$(git hash-object "$V4/check_composition_graph.py")" = fd360bec637d802664d3617c250fb676cca03456
          test "$(git hash-object "$V4/build_composed_postimage.py")" = e99068258744382609a4e0eddbcbdbac6c852ac7
          test "$(git hash-object "$V4/run_composed_postimage.py")" = 97fbfc26cbccd88d3027dd01c86c80c894329535
          test "$(git hash-object "$V4/postimage_trust.py")" = 4666f06e31f232cd4175be58621b6607ca2772d7
          test "$(git hash-object "$ROW/COMPOSER-READY.json")" = beb000a661a30de1b2bf746af85722cda3fd21c7
          test "$(git hash-object "$ROW/compose.py")" = 02295e66b58353051665ff533f4c4112e0449766
          test "$(git hash-object "$ROW/row_shed_sell_order.py")" = 9df048a4ba866d154861b6885f59502cf9e01cae
          pushd "$ROW"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest discover -v -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python -OB -m unittest discover -v -p 'test_*.py'
          python -B -m py_compile compose.py row_shed_sell_order.py
          popd
          PYTHONDONTWRITEBYTECODE=1 python -B "$V4/run_composed_postimage.py" --workspace "$V4" --check
          PYTHONDONTWRITEBYTECODE=1 python -OB "$V4/run_composed_postimage.py" --workspace "$V4" --check

      - name: Recover exact authenticated b567 composition foundation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/row-shed-foundation.zip"
          EXTRACT="$RUNNER_TEMP/row-shed-foundation-artifact"
          BASE="$RUNNER_TEMP/row-shed-b567"
          GRAPH="$RUNNER_TEMP/row-shed-graph"
          PATCH="$RUNNER_TEMP/row-shed-compose"
          ON="$RUNNER_TEMP/row-shed-on"
          OUT="$RUNNER_TEMP/row-shed-evidence"
          mkdir -p "$EXTRACT" "$BASE" "$OUT"
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10175943272/zip" \
            -o "$ZIP"
          echo "3a3b74936d238bf884f89a1b279f42676cda35c590f131a6a3548de52d61b4e8  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$EXTRACT"
          TAR="$EXTRACT/checked-package/exports/titan-current.tar.gz"
          echo "b567942e4fb4e0571ebf9f8eaaf143d4a9156df3289f09a98db37823ef4d68d9  $TAR" | sha256sum -c -
          tar -xzf "$TAR" -C "$BASE"
          test "$(git hash-object "$BASE/main.py")" = 4a8cf7bcda1f0fea231a144692cb84a779a9e73e
          test "$(git hash-object "$BASE/frozen_selected.py")" = fc7baf5c179818a55037f6a61d92984d81d1a21c
          printf 'ROW_SHED_BASE=%s\n' "$BASE" >> "$GITHUB_ENV"
          printf 'ROW_SHED_GRAPH=%s\n' "$GRAPH" >> "$GITHUB_ENV"
          printf 'ROW_SHED_PATCH=%s\n' "$PATCH" >> "$GITHUB_ENV"
          printf 'ROW_SHED_ON=%s\n' "$ON" >> "$GITHUB_ENV"
          printf 'ROW_SHED_OUT=%s\n' "$OUT" >> "$GITHUB_ENV"

      - name: Materialize the sole authenticated V4 graph postimage
        shell: bash
        run: |
          set -euo pipefail
          V4=revenue/kaggriculture/cloud-execution-lab/candidates/v4
          PYTHONDONTWRITEBYTECODE=1 python -B "$V4/run_composed_postimage.py" \
            --workspace "$V4" \
            --package "$ROW_SHED_BASE" \
            --output "$ROW_SHED_GRAPH"
          python - "$ROW_SHED_GRAPH" "$ROW_SHED_OUT/graph-identity.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root, out = Path(sys.argv[1]), Path(sys.argv[2])
          frozen = (root / "frozen_selected.py").read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(frozen)).encode("ascii") + b"\0" + frozen).hexdigest()
          sha = hashlib.sha256(frozen).hexdigest()
          if blob != "4a5d3d5f4bed04acf73c7339e41fed56badf34c9":
              raise SystemExit(f"wrong graph predecessor Git blob: {blob}")
          if sha != "4dc1de418632edd0a0bb66b9b01ab267c73225badabf0b62b5dee81d50233c5e":
              raise SystemExit(f"wrong graph predecessor SHA256: {sha}")
          receipt = root / "V4-POSTIMAGE.json"
          if not receipt.is_file():
              raise SystemExit("authenticated graph runner did not publish V4-POSTIMAGE.json")
          json.dump({
              "schema": "titan-v4-row-shed-graph-identity/v1",
              "foundation_sha256": "b567942e4fb4e0571ebf9f8eaaf143d4a9156df3289f09a98db37823ef4d68d9",
              "frozen_selected_git_blob": blob,
              "frozen_selected_sha256": sha,
              "graph_receipt_sha256": hashlib.sha256(receipt.read_bytes()).hexdigest(),
              "production_activated": False,
              "promotion_authorized": False,
          }, out.open("w"), sort_keys=True, indent=2)
          PY

      - name: Compose row-shed onto the exact graph predecessor
        shell: bash
        run: |
          set -euo pipefail
          V4=revenue/kaggriculture/cloud-execution-lab/candidates/v4
          ROW="$V4/repairs/gameplay/row-shed-sell-order"
          PYTHONDONTWRITEBYTECODE=1 python -B "$ROW/compose.py" \
            --package "$ROW_SHED_GRAPH" \
            --output "$ROW_SHED_PATCH" \
            --frozen-blob 4a5d3d5f4bed04acf73c7339e41fed56badf34c9
          mkdir -p "$ROW_SHED_ON"
          cp -a "$ROW_SHED_GRAPH/." "$ROW_SHED_ON/"
          cp "$ROW_SHED_PATCH/frozen_selected.py" "$ROW_SHED_ON/frozen_selected.py"
          cp "$ROW_SHED_PATCH/row_shed_sell_order.py" "$ROW_SHED_ON/row_shed_sell_order.py"
          python - "$ROW_SHED_GRAPH" "$ROW_SHED_ON" "$ROW_SHED_PATCH" "$ROW_SHED_OUT/construction.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          control, treatment, patch, out = map(Path, sys.argv[1:])
          def git_blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          def files(root):
              return {p.relative_to(root).as_posix(): p for p in root.rglob("*") if p.is_file()}
          a, b = files(control), files(treatment)
          changed = []
          for rel in sorted(set(a) | set(b)):
              if rel not in a or rel not in b or a[rel].read_bytes() != b[rel].read_bytes():
                  changed.append(rel)
          expected = ["frozen_selected.py", "row_shed_sell_order.py"]
          if changed != expected:
              raise SystemExit(f"row-shed overlay changed unexpected runtime files: {changed}")
          helper = (treatment / "row_shed_sell_order.py").read_bytes()
          if git_blob(helper) != "9df048a4ba866d154861b6885f59502cf9e01cae":
              raise SystemExit("row-shed helper Git identity drift")
          if hashlib.sha256(helper).hexdigest() != "ebde4930a46f4bc582fcf5b0f039138d0d91d3686ee114e2266a79d72461bb23":
              raise SystemExit("row-shed helper SHA256 drift")
          frozen = (treatment / "frozen_selected.py").read_bytes()
          compose_receipt = patch / "ROW-SHED-COMPOSITION.json"
          if not compose_receipt.is_file():
              raise SystemExit("row-shed composer did not publish its receipt")
          json.dump({
              "schema": "titan-v4-row-shed-construction/v1",
              "control_graph_frozen_git_blob": "4a5d3d5f4bed04acf73c7339e41fed56badf34c9",
              "control_graph_frozen_sha256": "4dc1de418632edd0a0bb66b9b01ab267c73225badabf0b62b5dee81d50233c5e",
              "treatment_frozen_git_blob": git_blob(frozen),
              "treatment_frozen_sha256": hashlib.sha256(frozen).hexdigest(),
              "row_shed_helper_git_blob": git_blob(helper),
              "row_shed_helper_sha256": hashlib.sha256(helper).hexdigest(),
              "compose_receipt_sha256": hashlib.sha256(compose_receipt.read_bytes()).hexdigest(),
              "changed_runtime_files": changed,
              "field_probe_is_production_source": False,
              "production_activated": False,
              "promotion_authorized": False,
          }, out.open("w"), sort_keys=True, indent=2)
          PY
          cp "$ROW_SHED_PATCH/ROW-SHED-COMPOSITION.json" "$ROW_SHED_OUT/ROW-SHED-COMPOSITION.json"
          cp "$ROW_SHED_GRAPH/V4-POSTIMAGE.json" "$ROW_SHED_OUT/V4-POSTIMAGE.json"

      - name: Add field-only diagnostics probe without changing returned actions
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ROW_SHED_ON/row_shed_probe.py" <<'PY'
          """Field-only observer for fresh row-shed applications; returned action is untouched."""
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import main as _main

          TELEMETRY = Path(__file__).with_name("row-shed-telemetry.jsonl")

          def agent(observation, configuration):
              action = _main.agent(observation, configuration)
              consumer = getattr(getattr(_main, "_INSTANCE", None), "consumer", None)
              diag = getattr(consumer, "row_shed_diagnostics", None)
              parent_diag = getattr(consumer, "diagnostics", None)
              fresh = (isinstance(parent_diag, dict)
                       and parent_diag.get("step") == observation.get("step"))
              if fresh and isinstance(diag, dict) and diag.get("status") == "applied":
                  record = {
                      "step": observation.get("step"),
                      "player": observation.get("player"),
                      "diagnostics": diag,
                      "returned_market": action.get("market", []) if isinstance(action, dict) else None,
                  }
                  payload = json.dumps(record, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n"
                  fd = os.open(TELEMETRY, os.O_WRONLY | os.O_CREAT | os.O_APPEND, 0o600)
                  try:
                      os.write(fd, payload.encode("utf-8"))
                  finally:
                      os.close(fd)
              return action
          PY
          python - "$ROW_SHED_ON/row_shed_probe.py" "$ROW_SHED_OUT/probe-identity.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          src, out = map(Path, sys.argv[1:])
          data = src.read_bytes()
          compile(data, str(src), "exec")
          blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          json.dump({
              "schema": "titan-v4-row-shed-field-probe/v1",
              "git_blob": blob,
              "sha256": hashlib.sha256(data).hexdigest(),
              "field_only": True,
              "returned_action_mutation": False,
              "logs_only_fresh_applied_callbacks": True,
          }, out.open("w"), sort_keys=True, indent=2)
          PY
          rm -f "$ROW_SHED_ON/row-shed-telemetry.jsonl"

      - name: Official-engine both-seat control field
        shell: bash
        run: |
          set -euo pipefail
          EVAL="$ROW_SHED_GRAPH/checks/reference/evaluator/evaluate.py"
          ENGINE="$ROW_SHED_GRAPH/checks/reference/engine"
          LOADER="$ROW_SHED_GRAPH/checks/reference/evaluator/loader.py"
          PYTHONDONTWRITEBYTECODE=1 python -B "$EVAL" \
            --engine-dir "$ENGINE" \
            --loader "$LOADER" \
            --candidate "$ROW_SHED_GRAPH/main.py::agent" \
            --opponent "graph=$ROW_SHED_GRAPH/main.py::agent" \
            --seeds 2027,6607,104729 \
            --output "$ROW_SHED_OUT/control.json"

      - name: Official-engine both-seat row-shed treatment field
        shell: bash
        run: |
          set -euo pipefail
          EVAL="$ROW_SHED_GRAPH/checks/reference/evaluator/evaluate.py"
          ENGINE="$ROW_SHED_GRAPH/checks/reference/engine"
          LOADER="$ROW_SHED_GRAPH/checks/reference/evaluator/loader.py"
          PYTHONDONTWRITEBYTECODE=1 python -B "$EVAL" \
            --engine-dir "$ENGINE" \
            --loader "$LOADER" \
            --candidate "$ROW_SHED_ON/row_shed_probe.py::agent" \
            --opponent "graph=$ROW_SHED_GRAPH/main.py::agent" \
            --seeds 2027,6607,104729 \
            --output "$ROW_SHED_OUT/treatment.json"
          if [[ -f "$ROW_SHED_ON/row-shed-telemetry.jsonl" ]]; then
            cp "$ROW_SHED_ON/row-shed-telemetry.jsonl" "$ROW_SHED_OUT/row-shed-telemetry.jsonl"
          else
            : > "$ROW_SHED_OUT/row-shed-telemetry.jsonl"
          fi

      - name: Publish natural-engagement and paired field receipt
        shell: bash
        run: |
          set -euo pipefail
          python - "$ROW_SHED_OUT" <<'PY'
          import json, statistics, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          control = json.loads((out / "control.json").read_text())
          treatment = json.loads((out / "treatment.json").read_text())
          expected_seeds = [2027, 6607, 104729]
          for name, report in (("control", control), ("treatment", treatment)):
              if report.get("engine_ref") != "28b6d8af3ce73926b3d0fda1410c1ddd8384ab8c":
                  raise SystemExit(f"{name}: wrong official-engine ref")
              if report.get("seeds") != expected_seeds:
                  raise SystemExit(f"{name}: seed panel drift")
              summary = report.get("summary", {}).get("graph", {})
              if summary.get("scheduled") != 6 or summary.get("completed") != 6 or summary.get("failed") != 0:
                  raise SystemExit(f"{name}: incomplete official field: {summary}")
          if control.get("engine_sha256") != treatment.get("engine_sha256"):
              raise SystemExit("control/treatment official engine identity mismatch")
          if control.get("loader_sha256") != treatment.get("loader_sha256"):
              raise SystemExit("control/treatment loader identity mismatch")
          if control.get("evaluator_sha256") != treatment.get("evaluator_sha256"):
              raise SystemExit("control/treatment evaluator identity mismatch")

          def game_map(report):
              return {(g["seed"], g["candidate_seat"]): g for g in report["games"]}
          cg, tg = game_map(control), game_map(treatment)
          if sorted(cg) != sorted(tg):
              raise SystemExit("control/treatment cell mismatch")
          cells = []
          trace_changes = 0
          margin_deltas = []
          for key in sorted(cg):
              c, t = cg[key], tg[key]
              if c.get("status") != "complete" or t.get("status") != "complete":
                  raise SystemExit(f"incomplete paired cell {key}")
              seat = key[1]
              c_margin = c["scores"][seat] - c["scores"][1-seat]
              t_margin = t["scores"][seat] - t["scores"][1-seat]
              delta = t_margin - c_margin
              margin_deltas.append(delta)
              changed = c.get("trace_sha256") != t.get("trace_sha256")
              trace_changes += int(changed)
              cells.append({
                  "seed": key[0],
                  "candidate_seat": seat,
                  "control_margin": c_margin,
                  "treatment_margin": t_margin,
                  "paired_margin_delta": delta,
                  "trace_changed": changed,
              })

          def bind_returned_reorder(scores, returned_market):
              def result(bound, reason, *, diagnostic_reordered=False, original=None, ranked=None, positions=None):
                  return {
                      "bound": bound,
                      "reason": reason,
                      "diagnostic_reordered": diagnostic_reordered,
                      "original_order": [] if original is None else original,
                      "ranked_order": [] if ranked is None else ranked,
                      "returned_positions": [] if positions is None else positions,
                  }

              if not isinstance(scores, list) or len(scores) < 2:
                  return result(False, "invalid_scores")
              normalized = []
              for position, score in enumerate(scores):
                  if not isinstance(score, dict):
                      return result(False, "invalid_score_entry")
                  original_index = score.get("original_index")
                  item = score.get("item")
                  requested = score.get("requested")
                  impact = score.get("impact")
                  if type(original_index) is not int or original_index != position:
                      return result(False, "invalid_original_index")
                  if type(item) is not str or not item:
                      return result(False, "invalid_item")
                  if type(requested) is not int or requested < 0:
                      return result(False, "invalid_requested")
                  if type(impact) is not int:
                      return result(False, "invalid_impact")
                  normalized.append((original_index, item, requested, impact))

              signatures = [(entry[1], entry[2]) for entry in normalized]
              if len(set(signatures)) != len(signatures):
                  return result(False, "duplicate_diagnostic_signature")
              ranked_entries = sorted(normalized, key=lambda entry: entry[3], reverse=True)
              original = [entry[0] for entry in normalized]
              ranked = [entry[0] for entry in ranked_entries]
              if ranked == original:
                  return result(False, "diagnostic_identity", original=original, ranked=ranked)
              if not isinstance(returned_market, list):
                  return result(False, "returned_market_not_list", diagnostic_reordered=True, original=original, ranked=ranked)

              leading = []
              for row in returned_market:
                  if not row:
                      break
                  if not isinstance(row, list):
                      return result(False, "malformed_returned_leading_row", diagnostic_reordered=True, original=original, ranked=ranked)
                  if not row or row[0] != "SELL":
                      break
                  if len(row) < 3 or type(row[1]) is not str or not row[1] or type(row[2]) is not int or row[2] < 0:
                      return result(False, "malformed_returned_sell", diagnostic_reordered=True, original=original, ranked=ranked)
                  leading.append((row[1], row[2]))

              ranked_signatures = [(entry[1], entry[2]) for entry in ranked_entries]
              positions = []
              for signature in ranked_signatures:
                  matches = [index for index, candidate in enumerate(leading) if candidate == signature]
                  if len(matches) != 1:
                      return result(False, "returned_signature_missing_or_ambiguous", diagnostic_reordered=True, original=original, ranked=ranked)
                  positions.append(matches[0])
              if positions != sorted(positions):
                  return result(False, "returned_order_does_not_preserve_rank", diagnostic_reordered=True, original=original, ranked=ranked, positions=positions)
              return result(True, "bound", diagnostic_reordered=True, original=original, ranked=ranked, positions=positions)

          predecessor_scores = [
              {"original_index": 0, "item": "CARROT", "requested": 1, "impact": 1},
              {"original_index": 1, "item": "WOOL", "requested": 1, "impact": 10},
          ]
          restored = bind_returned_reorder(predecessor_scores, [["SELL", "CARROT", 1], ["SELL", "WOOL", 1]])
          if restored["bound"] or restored["reason"] != "returned_order_does_not_preserve_rank":
              raise SystemExit(f"returned-action predecessor false-green: {restored}")
          survived = bind_returned_reorder(predecessor_scores, [["SELL", "WOOL", 1], ["SELL", "CARROT", 1]])
          if not survived["bound"]:
              raise SystemExit(f"returned-action positive control failed: {survived}")
          duplicate = bind_returned_reorder(predecessor_scores, [["SELL", "WOOL", 1], ["SELL", "CARROT", 1], ["SELL", "CARROT", 1]])
          if duplicate["bound"] or duplicate["reason"] != "returned_signature_missing_or_ambiguous":
              raise SystemExit(f"duplicate returned-row ambiguity false-green: {duplicate}")
          changed_quantity = bind_returned_reorder(predecessor_scores, [["SELL", "WOOL", 1], ["SELL", "CARROT", 2]])
          if changed_quantity["bound"] or changed_quantity["reason"] != "returned_signature_missing_or_ambiguous":
              raise SystemExit(f"changed-quantity returned-row false-green: {changed_quantity}")

          telemetry = []
          tele_path = out / "row-shed-telemetry.jsonl"
          if tele_path.is_file():
              telemetry = [json.loads(line) for line in tele_path.read_text().splitlines() if line.strip()]
          applied = []
          internal_reordered = []
          reordered = []
          unbound_reorders = []
          invalid_bindings = []
          for rec in telemetry:
              diag = rec.get("diagnostics") or {}
              if diag.get("status") != "applied":
                  continue
              applied.append(rec)
              scores = diag.get("scores") or []
              binding = bind_returned_reorder(scores, rec.get("returned_market"))
              if binding["diagnostic_reordered"]:
                  witness = {
                      "step": rec.get("step"),
                      "player": rec.get("player"),
                      "original_order": binding["original_order"],
                      "ranked_order": binding["ranked_order"],
                      "returned_positions": binding["returned_positions"],
                      "returned_action_binding": binding["reason"],
                      "scores": scores,
                      "returned_market": rec.get("returned_market"),
                  }
                  internal_reordered.append(witness)
                  if binding["bound"]:
                      reordered.append(witness)
                  else:
                      unbound_reorders.append(witness)
              elif binding["reason"] != "diagnostic_identity":
                  invalid_bindings.append({
                      "step": rec.get("step"),
                      "player": rec.get("player"),
                      "returned_action_binding": binding["reason"],
                      "scores": scores,
                      "returned_market": rec.get("returned_market"),
                  })

          receipt = {
              "schema": "titan-v4-row-shed-postimage-field/v2",
              "generation": "authenticated-b567-composition-foundation",
              "foundation_sha256": "b567942e4fb4e0571ebf9f8eaaf143d4a9156df3289f09a98db37823ef4d68d9",
              "graph_frozen_git_blob": "4a5d3d5f4bed04acf73c7339e41fed56badf34c9",
              "graph_frozen_sha256": "4dc1de418632edd0a0bb66b9b01ab267c73225badabf0b62b5dee81d50233c5e",
              "row_shed_helper_git_blob": "9df048a4ba866d154861b6885f59502cf9e01cae",
              "seeds": expected_seeds,
              "both_seats": True,
              "scheduled_games_per_arm": 6,
              "applied_callbacks": len(applied),
              "natural_activation_witness": bool(applied),
              "internal_reorder_candidates": len(internal_reordered),
              "returned_action_unbound_reorder_candidates": len(unbound_reorders),
              "returned_action_binding_failures": len(invalid_bindings),
              "natural_reorder_callbacks": len(reordered),
              "natural_reorder_witness": bool(reordered),
              "returned_action_binding_required": True,
              "reorder_witnesses": reordered[:20],
              "unbound_reorder_candidates": unbound_reorders[:20],
              "invalid_binding_callbacks": invalid_bindings[:20],
              "paired_cells": cells,
              "trace_changed_cells": trace_changes,
              "paired_margin_delta_mean": statistics.mean(margin_deltas),
              "paired_margin_delta_median": statistics.median(margin_deltas),
              "trace_delta_is_advisory_only": True,
              "economics_are_promotion_authority": False,
              "production_activated": False,
              "promotion_authorized": False,
          }
          if invalid_bindings:
              receipt["verdict"] = "HOLD_RETURNED_ACTION_BINDING_INVALID"
          elif reordered:
              receipt["verdict"] = "NATURAL_REORDER_WITNESS"
          elif unbound_reorders:
              receipt["verdict"] = "HOLD_REORDER_NOT_BOUND_TO_RETURNED_ACTION"
          elif applied:
              receipt["verdict"] = "NATURAL_ENGAGEMENT_NO_REORDER_IN_PANEL"
          else:
              receipt["verdict"] = "HOLD_NO_NATURAL_ENGAGEMENT_IN_PANEL"
          (out / "FIELD-RECEIPT.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          print(json.dumps({
              "verdict": receipt["verdict"],
              "applied_callbacks": receipt["applied_callbacks"],
              "internal_reorder_candidates": receipt["internal_reorder_candidates"],
              "natural_reorder_callbacks": receipt["natural_reorder_callbacks"],
              "returned_action_unbound_reorder_candidates": receipt["returned_action_unbound_reorder_candidates"],
              "trace_changed_cells": trace_changes,
              "paired_margin_delta_mean": receipt["paired_margin_delta_mean"],
          }, sort_keys=True))
          PY

      - name: Bind checkout and source identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${ROW_SHED_OUT:-$RUNNER_TEMP/row-shed-evidence}"
          mkdir -p "$OUT"
          printf 'ROW_SHED_OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$OUT/checkout-commit.txt"
          V4=revenue/kaggriculture/cloud-execution-lab/candidates/v4
          ROW="$V4/repairs/gameplay/row-shed-sell-order"
          sha256sum \
            "$V4/COMPOSITION.json" \
            "$V4/check_composition_graph.py" \
            "$V4/build_composed_postimage.py" \
            "$V4/run_composed_postimage.py" \
            "$V4/postimage_trust.py" \
            "$ROW/COMPOSER-READY.json" \
            "$ROW/compose.py" \
            "$ROW/row_shed_sell_order.py" \
            > "$OUT/source-sha256.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-v4-row-shed-postimage-field-${{ github.run_id }}
          path: ${{ env.ROW_SHED_OUT }}
          retention-days: 14
          if-no-files-found: error