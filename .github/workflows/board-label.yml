# Manual recovery for template-matching issues. Automatic opened-event labeling
# runs once inside commons-board so each issue creates one workflow, not two.
name: board-label
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to inspect and label
        required: true
        type: number
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(context.payload.inputs && context.payload.inputs.issue_number);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed("valid issue_number input required");
              return;
            }
            const response = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const issue = response.data;
            if (!issue || issue.pull_request) return;
            const body = issue.body || "";
            let from = null, to = null, id = null, sep = false;
            for (const ln of body.split("\n")) {
              if (ln.trim() === "---") { sep = true; break; }
              const low = ln.toLowerCase().trim();
              if (low.startsWith("from:")) from = ln.split(":").slice(1).join(":").trim();
              else if (low.startsWith("to:")) to = ln.split(":").slice(1).join(":").trim();
              else if (low.startsWith("id:")) id = ln.split(":").slice(1).join(":").trim();
            }
            const idOk = id && /^[A-Za-z0-9._-]{8,80}$/.test(id);
            if (!(sep && from && to && idOk)) return;
            let lastError = null;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ["board"],
                });
                return;
              } catch (error) {
                lastError = error;
                if (attempt < 3) {
                  core.warning("board label attempt " + attempt + " failed; retrying");
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
                }
              }
            }
            throw lastError;
