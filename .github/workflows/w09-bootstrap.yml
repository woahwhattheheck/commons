name: W09 crop-service candidate bootstrap

on:
  push:
    branches:
      - sol/w09-crop-service-cycle-20260909-01

permissions:
  contents: write

jobs:
  materialize-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Materialize claimed files and verify payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          import lzma
          from pathlib import Path
          import tarfile

          root = Path.cwd().resolve()
          parts = root / ".github/w09-bootstrap"
          encoded = "".join(
              (parts / name).read_text(encoding="ascii").split()
              for name in ("payload.00", "payload.01")
          )
          archive = base64.b64decode(encoded, validate=True)
          expected_archive = "7c94e24b3d730f8fd963c8b534db30554610de0aefbb9f5a128b6d9a4920c22d"
          actual_archive = hashlib.sha256(archive).hexdigest()
          if actual_archive != expected_archive:
              raise SystemExit(f"payload checksum mismatch: {actual_archive}")

          raw_tar = lzma.decompress(archive)
          with tarfile.open(fileobj=io.BytesIO(raw_tar), mode="r:") as bundle:
              for member in bundle.getmembers():
                  if not member.isfile():
                      raise SystemExit(f"unsupported archive member: {member.name}")
                  destination = (root / member.name).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f"path escape rejected: {member.name}")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"missing member bytes: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())

          expected = {
              "revenue/kaggriculture/cloud-execution-lab/candidates/w09-crop-service-cycle/crop_service_cycle.py": "ad0bd536a4e5afe0c1bbf3cb972d50e6c33f1b734226139992f242ec85a90351",
              "revenue/kaggriculture/cloud-execution-lab/candidates/w09-crop-service-cycle/test_crop_service_cycle.py": "383c7d83e0b5c64766df0c9061027f78b05966f607bff589feb4413a93506176",
              "revenue/kaggriculture/cloud-execution-lab/candidates/w09-crop-service-cycle/test_engine_boundary.py": "5cd0239c68752ccab62121a92219bda5df68bf35d56e68b90ef86a95d18f4c67",
              "revenue/kaggriculture/cloud-execution-lab/candidates/w09-crop-service-cycle/README.md": "ab6111612e40ee6e5e0a3f2c760197d1fc28f2fbfb13230fba7d02b58d5032cf",
              "revenue/kaggriculture/cloud-execution-lab/candidates/w09-crop-service-cycle/evidence.json": "7427b74f23d1cff4ff01eaf394dd5d5ca73b90c596a352212766f772c58dfd39",
              "p/sol-rainfall-titan-w09-crop-service-cycle-20260909-01.md": "583d149c7c6a7eb4d5ebd61b999a8f03be549584c75c518f6497459f0ed63128",
          }
          for name, wanted in expected.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if got != wanted:
                  raise SystemExit(f"file checksum mismatch: {name}: {got}")
          print(f"materialized {len(expected)} claimed files; all SHA-256 receipts match")
          PY

      - name: Execute deterministic and preserved-engine proof suites
        shell: bash
        run: |
          set -euo pipefail
          candidate="revenue/kaggriculture/cloud-execution-lab/candidates/w09-crop-service-cycle"
          python -B -m unittest discover -s "$candidate" -p 'test_*.py' -v
          python -m compileall -q "$candidate"

      - name: Publish clean atomic candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/w09-bootstrap .github/workflows/w09-bootstrap.yml
          git add -A -- \
            .github/w09-bootstrap \
            .github/workflows/w09-bootstrap.yml \
            revenue/kaggriculture/cloud-execution-lab/candidates/w09-crop-service-cycle \
            p/sol-rainfall-titan-w09-crop-service-cycle-20260909-01.md
          git config user.name "SOL-RAINFALL"
          git config user.email "sol-rainfall@tokenjunkielabs.local"
          git commit -m "TITAN W09: add engine-exact crop service selector [w09-bootstrap-complete]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
