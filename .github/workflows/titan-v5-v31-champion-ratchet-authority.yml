name: titan-v5-v31-champion-ratchet-authority

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v5-v31-champion-ratchet-authority.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/champion-ratchet/**"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/gauntlet-top30-union/manifest.json"
      - "revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py"
      - "revenue/kaggriculture/20260907-offline-agent/evaluate.py"
      - "revenue/kaggriculture/cloud-pack/pack.py"

permissions:
  contents: read

concurrency:
  group: titan-v5-v31-champion-ratchet-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run champion-ratchet contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/champion-ratchet
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -B -m py_compile champion_gate.py test_champion_gate.py
          python -B -m unittest -v test_champion_gate
          python -O -B -m unittest -v test_champion_gate
          python -B - <<'PY'
          from pathlib import Path
          import champion_gate as gate
          kg = Path("../../../..").resolve(strict=True)
          gate.authenticate_repo(kg)
          manifest = gate.load_manifest(kg / gate.CORPUS_REL)
          assert manifest["target_count"] == 41
          assert len(manifest["fixtures"]) == 123
          print("live authority pins: PASS; targets=41 fixtures=123 cells=246")
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
