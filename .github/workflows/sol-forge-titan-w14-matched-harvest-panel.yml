name: sol-forge-titan-w14-matched-harvest-panel

on:
  push:
    branches:
      - "sol-forge/titan-w14-realized-rule-composition-20260909-01"

permissions:
  contents: write

concurrency:
  group: sol-forge-titan-w14-matched-harvest-panel
  cancel-in-progress: false

jobs:
  matched-panel:
    if: ${{ !contains(github.event.head_commit.message, '[w14-matched-harvest]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Pin checkout and extract exact canonical archive
        shell: bash
        env:
          LAB: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf "$RUNNER_TEMP/titan"
          mkdir -p "$RUNNER_TEMP/titan"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          lab = Path(os.environ["LAB"])
          receipt = json.loads((lab / "runtime/integrated-selected/CURRENT-ARCHIVE.json").read_text())
          archive = lab / receipt["path"]
          source = lab / receipt["source_manifest"]
          assert archive.stat().st_size == receipt["bytes"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == receipt["sha256"]
          assert hashlib.sha256(source.read_bytes()).hexdigest() == receipt["source_manifest_sha256"]
          Path(os.environ["RUNNER_TEMP"], "archive_sha256").write_text(receipt["sha256"])
          PY
          tar -xzf "$LAB/exports/titan-current.tar.gz" -C "$RUNNER_TEMP/titan"
          test -f "$RUNNER_TEMP/titan/main.py"
          test -f "$RUNNER_TEMP/titan/checks/reference/engine/kaggriculture.py"

      - name: Compile and run fail-closed composition contracts
        shell: bash
        env:
          ROOT: revenue/kaggriculture/cloud-execution-lab/analysis/w14-realized-rule-composition
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            "$ROOT/last_tick_harvest.py" \
            "$ROOT/last_tick_harvest_agent.py" \
            "$ROOT/matched_harvest_panel.py" \
            "$ROOT/test_last_tick_harvest.py"
          python3 -B -m unittest -v "$ROOT/test_last_tick_harvest.py"
          find "$ROOT" -name __pycache__ -type d -prune -exec rm -rf {} +

      - name: Assemble exact evaluator-only candidate wrapper
        shell: bash
        env:
          ROOT: revenue/kaggriculture/cloud-execution-lab/analysis/w14-realized-rule-composition
        run: |
          set -euo pipefail
          cp "$ROOT/last_tick_harvest.py" "$RUNNER_TEMP/titan/last_tick_harvest.py"
          cp "$ROOT/last_tick_harvest_agent.py" "$RUNNER_TEMP/titan/w14_variant.py"
          PYTHONPATH="$RUNNER_TEMP/titan" python3 -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "titan/w14_variant.py"
          spec = importlib.util.spec_from_file_location("w14_variant_smoke", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert callable(module.agent)
          PY

      - name: Run eight complete matched official pairs against reacting Arlene
        shell: bash
        env:
          LAB: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          OUT="$LAB/analysis/w14-realized-rule-composition/matched-harvest-panel.json"
          python3 -B "$LAB/analysis/w14-realized-rule-composition/matched_harvest_panel.py" \
            --evaluator "$LAB/reference/evaluator/evaluate.py" \
            --loader revenue/kaggriculture/20260907-offline-agent/evaluate.py \
            --engine-dir "$RUNNER_TEMP/titan/checks/reference/engine" \
            --baseline "$RUNNER_TEMP/titan/main.py" \
            --variant "$RUNNER_TEMP/titan/w14_variant.py" \
            --opponent "$LAB/reference/next-panel/vendor/arlene.py" \
            --environment-seeds 261140014 261140015 261140016 261140017 \
            --candidate-seats 0 1 \
            --rng-seed 20260907 \
            --source-commit "$GITHUB_SHA" \
            --archive-sha256 "$(cat "$RUNNER_TEMP/archive_sha256")" \
            --output "$OUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("revenue/kaggriculture/cloud-execution-lab/analysis/w14-realized-rule-composition/matched-harvest-panel.json")
          report = json.loads(path.read_text())
          aggregate = report["aggregate"]
          assert aggregate["complete_pairs"] == 8
          assert report["conclusion_gate"]["all_exact_pairs_complete"] is True
          assert report["conclusion_gate"]["default_activation_authorized"] is False
          anchor = next(
              row for row in report["pairs"]
              if row["cell_key"] == {"environment_seed": 261140014, "candidate_seat": 0}
          )
          assert anchor["baseline"]["scores"] == [88184.0, 87850.0]
          assert aggregate["total_activations"] > 0
          print(json.dumps(aggregate, indent=2, sort_keys=True))
          print(json.dumps(report["conclusion_gate"], indent=2, sort_keys=True))
          PY

      - name: Publish exact matched-panel receipt
        shell: bash
        env:
          OUT: revenue/kaggriculture/cloud-execution-lab/analysis/w14-realized-rule-composition/matched-harvest-panel.json
          WORKFLOW: .github/workflows/sol-forge-titan-w14-matched-harvest-panel.yml
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git rm "$WORKFLOW"
          git add "$OUT"
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n%s\n' "$WORKFLOW" "$OUT" | sort)"
          git config user.name "SOL-FORGE"
          git config user.email "sol-forge@commons.local"
          git commit -m "analysis(titan): publish W14 matched harvest panel [w14-matched-harvest]"
          git push origin "HEAD:$GITHUB_REF_NAME"
