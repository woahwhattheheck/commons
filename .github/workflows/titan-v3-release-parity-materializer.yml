name: titan-v3-release-parity-materializer

on:
  push:
    branches:
      - 'sol/relay-titan-v3-release-parity-20260909-01'
    paths:
      - '.github/workflows/titan-v3-release-parity-materializer.yml'

permissions:
  contents: write

concurrency:
  group: titan-v3-release-parity-materializer
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify immutable source parent and reproduce stale release
        shell: bash
        env:
          EXPECTED_PARENT: 83aea6e6dfbcb991fa9783337473ce70d4e6b8ad
          EXPECTED_OLD_ARCHIVE: 3b4b083ec2647bb0e715978c2565e916da0ee94c08b234902e3a7e4d3418c320
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          LAB=revenue/kaggriculture/cloud-execution-lab
          python3 - <<'PY'
          import json
          from pathlib import Path
          lab = Path('revenue/kaggriculture/cloud-execution-lab')
          config = json.loads((lab/'TITAN-CONFIG.json').read_text())
          pointer = json.loads((lab/'runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())
          builder = (lab/'build_integrated.py').read_text()
          assert config['early_capital'] is True
          assert pointer['sha256'] == '3b4b083ec2647bb0e715978c2565e916da0ee94c08b234902e3a7e4d3418c320'
          assert "mapping['checks/test_early_capital.py']='test_early_capital.py'" in builder
          assert "'operating_stock.py','crop_release.py','early_capital.py'" in builder
          PY
          if python3 -B "$LAB/build_integrated.py" --check > precheck.stdout 2> precheck.stderr; then
            echo 'Expected stale-release check to fail, but it passed' >&2
            exit 1
          fi
          grep -q 'Current release pointer differs from current source' precheck.stderr

      - name: Run focused source test and materialize deterministic release
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          (
            cd "$LAB"
            python3 -B -m unittest test_early_capital -v
            python3 -B build_integrated.py > "$GITHUB_WORKSPACE/build-receipt.json"
            python3 -B build_integrated.py --check > "$GITHUB_WORKSPACE/check-receipt.json"
          ) 2>&1 | tee build-and-test.log

      - name: Verify archive closure and write durable receipt
        shell: bash
        env:
          SOURCE_PARENT: 83aea6e6dfbcb991fa9783337473ce70d4e6b8ad
          OLD_ARCHIVE: 3b4b083ec2647bb0e7159783337473ce70d4e6b8ad
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, tarfile
          from pathlib import Path

          root = Path('.')
          lab = root/'revenue/kaggriculture/cloud-execution-lab'
          archive_path = lab/'exports/titan-current.tar.gz'
          pointer_path = lab/'runtime/integrated-selected/CURRENT-ARCHIVE.json'
          source_path = lab/'runtime/integrated-selected/CURRENT-SOURCE.json'
          receipt = json.loads(pointer_path.read_text())
          source = json.loads(source_path.read_text())
          archive = archive_path.read_bytes()
          assert hashlib.sha256(archive).hexdigest() == receipt['sha256']
          assert len(archive) == receipt['bytes']
          assert hashlib.sha256(source_path.read_bytes()).hexdigest() == receipt['source_manifest_sha256']
          assert receipt['runtime_files'] == len(source['runtime'])
          assert source['default']['early_capital'] is True
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              names = tf.getnames()
              assert len(names) == receipt['runtime_files'] + 1
              assert len(names) == len(set(names))
              for required in ('main.py', 'TITAN-CONFIG.json', 'early_capital.py',
                               'checks/test_early_capital.py', 'SOURCE.json'):
                  assert required in names
              packaged_config = json.loads(tf.extractfile('TITAN-CONFIG.json').read())
              packaged_source = tf.extractfile('SOURCE.json').read()
              assert packaged_config['early_capital'] is True
              assert packaged_source == source_path.read_bytes()
              assert tf.extractfile('early_capital.py').read() == (lab/'early_capital.py').read_bytes()
              assert tf.extractfile('checks/test_early_capital.py').read() == (lab/'test_early_capital.py').read_bytes()

          old_digest = '3b4b083ec2647bb0e715978c2565e916da0ee94c08b234902e3a7e4d3418c320'
          historical = lab/'exports/historical'/f'titan-{old_digest}.tar.gz'
          assert historical.exists()
          assert hashlib.sha256(historical.read_bytes()).hexdigest() == old_digest

          out = root/'p/sol-relay-titan-v3-release-parity-20260909-01.md'
          out.parent.mkdir(parents=True, exist_ok=True)
          lines = [
              '# TITAN V3 canonical release parity — early capital',
              '',
              'Operation: `TITAN-V3-EARLY-CAPITAL-CANONICAL-RELEASE-PARITY-20260909-01`',
              '',
              f'- Immutable source parent: `{os.environ["SOURCE_PARENT"]}`',
              f'- Materializer event commit: `{os.environ["GITHUB_SHA"]}`',
              f'- Superseded canonical archive: `{old_digest}`',
              f'- Rebuilt canonical archive: `{receipt["sha256"]}` ({receipt["bytes"]} bytes; {receipt["runtime_files"]} runtime files)',
              f'- Rebuilt source manifest: `{receipt["source_manifest_sha256"]}`',
              '- Entrypoint: `main.py::agent`',
              '- Canonical configuration read from both source manifest and tarball: `early_capital=true`.',
              '- Required package members verified: `early_capital.py`, `checks/test_early_capital.py`, `main.py`, `TITAN-CONFIG.json`, `SOURCE.json`.',
              '- Superseded archive preserved byte-exactly under `exports/historical/`.',
              '',
              '## Verification actually run',
              '',
              '- Pre-build `python3 -B build_integrated.py --check`: failed closed with `Current release pointer differs from current source` (the reproduced defect).',
              '- `python3 -B -m unittest test_early_capital -v`: passed.',
              '- `python3 -B build_integrated.py`: rebuilt deterministic release.',
              '- Post-build `python3 -B build_integrated.py --check`: passed.',
              '- Independent tar closure: archive/source hashes, member uniqueness/count, source-to-package byte equality, config equality, and historical archive identity all passed.',
              '',
              'No strategy, runtime, configuration, opponent, game, Kaggle, provider, credential, or spend behavior was changed by this repair.',
              '',
          ]
          out.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit generated bytes with guarded branch head
        shell: bash
        env:
          BRANCH: sol/relay-titan-v3-release-parity-20260909-01
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          rm .github/workflows/titan-v3-release-parity-materializer.yml
          git add -A -- \
            .github/workflows/titan-v3-release-parity-materializer.yml \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/exports/historical/ \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json \
            p/sol-relay-titan-v3-release-parity-20260909-01.md
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          required = {
              '.github/workflows/titan-v3-release-parity-materializer.yml',
              'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz',
              'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json',
              'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json',
              'p/sol-relay-titan-v3-release-parity-20260909-01.md',
          }
          assert required <= changed, (required - changed, changed)
          allowed = required | {
              'revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-3b4b083ec2647bb0e715978c2565e916da0ee94c08b234902e3a7e4d3418c320.tar.gz',
          }
          assert changed <= allowed, (changed - allowed, changed)
          PY
          git config user.name 'SOL-RELAY release materializer'
          git config user.email 'tokenjunkielabs@gmail.com'
          git commit -m 'fix(titan): rebuild canonical release after early capital'
          git push origin "HEAD:refs/heads/$BRANCH"
