name: Learn2Design public evidence

on:
  pull_request:
    paths:
      - 'revenue/learn2design2026/**'
      - 'test_learn2design2026.py'
      - 'test_learn2design2026_evidence.py'
      - 'test_learn2design2026_provenance.py'
      - '.github/workflows/learn2design-public-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-development-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: 'true'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout Commons candidate sources
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify integrity and recorded provenance before external install
        run: |
          python -m unittest -v test_learn2design2026_evidence.py test_learn2design2026_provenance.py
          python -O -m unittest -v test_learn2design2026_evidence.py test_learn2design2026_provenance.py
          python -m unittest -v test_learn2design2026.py
          python revenue/learn2design2026/evidence.py verify-manifest
          python revenue/learn2design2026/evidence.py compare \
            revenue/learn2design2026/recorded_runs/34938483198/serial_v1.json \
            revenue/learn2design2026/recorded_runs/34938483198/vectorized_v2.json \
            --out /tmp/learn2design-recorded-comparison.json

      - name: Checkout pinned organizer source
        uses: actions/checkout@v4
        with:
          repository: artificial-scientist-lab/Learn2Design-2026
          ref: 84a4b0a4c7e0f3b702459ffc8ba6a1d84d34cefa
          path: _organizer_learn2design
          persist-credentials: false

      - name: Install organizer CPU stack and serial-v1 dependency
        run: |
          python -m pip install --disable-pip-version-check -e ./_organizer_learn2design 'optax>=0.2.3,<1'

      - name: Measure frozen serial v1 on public ConstrainedVoyager cell
        run: |
          mkdir -p revenue/learn2design2026/evidence_runs
          python revenue/learn2design2026/evidence.py measure \
            --candidate serial_v1 \
            --organizer-source _organizer_learn2design \
            --out revenue/learn2design2026/evidence_runs/serial_v1.json \
            --require-measured

      - name: Measure vectorized v2 on the identical public cell
        run: |
          python revenue/learn2design2026/evidence.py measure \
            --candidate vectorized_v2 \
            --organizer-source _organizer_learn2design \
            --out revenue/learn2design2026/evidence_runs/vectorized_v2.json \
            --require-measured

      - name: Compare fresh candidates without self-attesting execution provenance
        run: |
          python revenue/learn2design2026/evidence.py verify-integrity revenue/learn2design2026/evidence_runs/serial_v1.json
          python revenue/learn2design2026/evidence.py verify-integrity revenue/learn2design2026/evidence_runs/vectorized_v2.json
          python revenue/learn2design2026/evidence.py compare-candidates \
            revenue/learn2design2026/evidence_runs/serial_v1.json \
            revenue/learn2design2026/evidence_runs/vectorized_v2.json \
            --out revenue/learn2design2026/evidence_runs/comparison.candidate.json

      - name: Upload candidate receipts for independent provider retrieval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learn2design-public-evidence
          path: revenue/learn2design2026/evidence_runs/*.json
          if-no-files-found: warn
          retention-days: 14
