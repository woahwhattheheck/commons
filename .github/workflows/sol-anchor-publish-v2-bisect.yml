name: SOL Anchor publish V2 legacy bisect

on:
  push:
    branches:
      - sol-anchor/titan-v2-legacy-bisect-20260909-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-anchor/titan-v2-legacy-bisect-20260909-01
          fetch-depth: 0

      - name: Reassemble, verify, and extract payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          expected_chunks = [Path(f'.sol-anchor-publish/chunk{i:02d}') for i in range(8)]
          actual_chunks = sorted(Path('.sol-anchor-publish').glob('chunk*'))
          if actual_chunks != expected_chunks:
              raise SystemExit(f'chunk set mismatch: {actual_chunks!r}')

          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in actual_chunks)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected_digest = 'c79d549b538a8c88f77c090896c4a406b9ebef37237dd55fc2fc24095ffa48af'
          if digest != expected_digest:
              raise SystemExit(f'payload digest mismatch: {digest}')

          expected = {
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/README.md',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/run_bisect.py',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/test_run_bisect.py',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/RESULTS.md',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/SUMMARY.json',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/PAIRED-CELLS.csv',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/SHARD-HASHES.csv',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/ISOLATION.json',
              'revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect/HARNESS.json',
              'p/titan-v2-submitted-legacy-feature-bisect-20260909-01.md',
          }

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(
                      f'payload member mismatch; missing={sorted(expected - names)} '
                      f'extra={sorted(names - expected)}'
                  )
              for member in members:
                  path = PurePosixPath(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts or '.' in path.parts:
                      raise SystemExit(f'unsafe payload member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable payload member: {member.name}')
                  target = Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          PY

      - name: Verify published lane
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab/analysis/v2-legacy-feature-bisect
          python3 -m unittest -v test_run_bisect.py
          python3 -m py_compile run_bisect.py test_run_bisect.py

      - name: Commit final additive evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sol-anchor-publish
          rm -f .github/workflows/sol-anchor-publish-v2-bisect.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'analysis: publish submitted V2 legacy-feature bisect'
          git push origin HEAD:sol-anchor/titan-v2-legacy-bisect-20260909-01
