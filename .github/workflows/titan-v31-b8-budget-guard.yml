name: Titan V3.1 B8 additive budget guard

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b8_budget_guard/**'
      - '.github/workflows/titan-v31-b8-budget-guard.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind frozen parent and additive scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=508b342fc46fa91e3d7cdc3f0b7e44934a187c14
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py")" = 21c4f1db0298f8955b1f5ad366bd780a89cad206
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r01_tapes.py")" = a43289b9cc5e34a2481fddf652762a7d92f427ef
          while IFS= read -r path; do
            case "$path" in
              revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b8_budget_guard/*|.github/workflows/titan-v31-b8-budget-guard.yml) ;;
              *) echo "unexpected B8 scope path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)

      - name: Compile and run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b8_budget_guard
          python -m py_compile "$ROOT/b8_budget_guard.py" "$ROOT/candidate.py" "$ROOT/census.py" "$ROOT/test_b8_budget_guard.py"
          python "$ROOT/test_b8_budget_guard.py"

      - name: Prove frozen-tape structural reachability
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b8_budget_guard
          python "$ROOT/census.py" | tee /tmp/b8-census.json
          python - <<'PY'
          import json
          with open('/tmp/b8-census.json', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['frozen_tapes'] == 13, data
          assert set(data['turns_per_tape']) == {719}, data
          assert data['reachable_windows'] > 0, data
          print('B8_REACHABILITY', data['reachable_windows'], data['reachable_by_layer'], data['reserve_min'], data['reserve_max'])
          PY

      - name: Require clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
