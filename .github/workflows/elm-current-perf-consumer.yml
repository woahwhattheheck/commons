name: ELM TITAN current performance consumer

on:
  push:
    branches:
      - astra/elm-current-perf-consumer-20260908-1158

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify exact canonical preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/frozen_selected.py)" = 58fde0ad70cbec2c653c7383a6c2835e6726423a
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/scheduler.py)" = 97085acebd7268e87a09e4b5c1bf7d049038cb25
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/reference/integrated-selected/alder/seed_budget.py)" = ef21710d6275a7146854b0fde46f00beb2dcb372
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/reference/titan-current/deadline_adapter.py)" = 184ff5354451d764df95ffb5c952eecd0f4266f0
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/build_integrated.py)" = 898bb7a23e0c45ea4a5f33acaf167861d5b5eba2
          git apply --check --directory=revenue/kaggriculture/cloud-execution-lab revenue/kaggriculture/cloud-quickstep/frozen_selected.integration.patch
          git apply --check revenue/kaggriculture/cloud-worker-trace/worker-trace-lines.patch

      - name: Compose landed helper sources into canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          git apply --directory=revenue/kaggriculture/cloud-execution-lab revenue/kaggriculture/cloud-quickstep/frozen_selected.integration.patch
          git apply revenue/kaggriculture/cloud-worker-trace/worker-trace-lines.patch
          python - <<'PY'
          from pathlib import Path

          root = Path('revenue/kaggriculture/cloud-execution-lab')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          scheduler = root / 'scheduler.py'
          replace_once(
              scheduler,
              'import mechanics as m\n',
              'import mechanics as m\nfrom observed_clone import detached_json_value\n',
          )
          replace_once(
              scheduler,
              "    farm, private = copy.deepcopy(obs['farms'][obs['player']]), copy.deepcopy(obs['private'])\n",
              "    farm = detached_json_value(obs['farms'][obs['player']])\n    private = detached_json_value(obs['private'])\n",
          )

          seed = root / 'reference/integrated-selected/alder/seed_budget.py'
          replace_once(seed, 'from collections import Counter\n', 'from plant_suffix import immutable_plant_suffixes\n')
          old_suffix = '''    for name, route in routes.items():\n        suffix = [Counter() for _ in range(len(route) + 1)]\n        for t in range(len(route) - 1, -1, -1):\n            suffix[t] = suffix[t + 1].copy()\n            row = route[t]\n            for action in [row.get("farmer", []), *row.get("hands", [])]:\n                if len(action) >= 2 and action[0] == "PLANT":\n                    suffix[t][action[1]] += 1\n        suffixes[name] = tuple(MappingProxyType(dict(c)) for c in suffix)\n'''
          new_suffix = '''    for name, route in routes.items():\n        suffixes[name] = immutable_plant_suffixes(route)\n'''
          replace_once(seed, old_suffix, new_suffix)

          builder = root / 'build_integrated.py'
          anchor = "    mapping={p:p for p in RUNTIME if p not in ('integrated_main.py','integrated_parent.py')}\n"
          mapped = anchor + "    mapping['seller_snapshot.py']='../cloud-quickstep/seller_snapshot.py'\n" + "    mapping['observed_clone.py']='../cloud-runtime-pulse/observed_clone.py'\n" + "    mapping['plant_suffix.py']='../cloud-runtime-pulse/plant_suffix.py'\n"
          replace_once(builder, anchor, mapped)
          PY

      - name: Run source-bound component checks
        shell: bash
        run: |
          set -euo pipefail
          python -B revenue/kaggriculture/cloud-runtime-pulse/test_observed_clone.py
          python -B revenue/kaggriculture/cloud-runtime-pulse/test_plant_suffix.py
          python -B revenue/kaggriculture/cloud-worker-trace/trace_compatibility_check.py \
            --source revenue/kaggriculture/cloud-execution-lab/reference/titan-current/deadline_adapter.py \
            --report /tmp/worker-trace-composed.json
          python -B -m py_compile \
            revenue/kaggriculture/cloud-execution-lab/frozen_selected.py \
            revenue/kaggriculture/cloud-execution-lab/scheduler.py \
            revenue/kaggriculture/cloud-execution-lab/reference/integrated-selected/alder/seed_budget.py \
            revenue/kaggriculture/cloud-execution-lab/reference/titan-current/deadline_adapter.py \
            revenue/kaggriculture/cloud-execution-lab/build_integrated.py

      - name: Rebuild and verify the single CURRENT package
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab
          python -B build_integrated.py | tee /tmp/build-receipt.json
          python -B build_integrated.py --check | tee /tmp/check-receipt.json
          rm -rf /tmp/titan-current-extracted
          mkdir -p /tmp/titan-current-extracted
          tar -xzf exports/titan-current.tar.gz -C /tmp/titan-current-extracted
          python -B ../cloud-quickstep/test_fastpath.py --package /tmp/titan-current-extracted
          PYTHONPATH=/tmp/titan-current-extracted:/tmp/titan-current-extracted/checks python -B /tmp/titan-current-extracted/checks/test_route_recovery.py
          PYTHONPATH=/tmp/titan-current-extracted:/tmp/titan-current-extracted/checks python -B /tmp/titan-current-extracted/checks/test_module_recovery.py
          PYTHONPATH=/tmp/titan-current-extracted:/tmp/titan-current-extracted/checks python -B /tmp/titan-current-extracted/checks/test_seed_derived.py
          PYTHONPATH=/tmp/titan-current-extracted:/tmp/titan-current-extracted/checks python -B /tmp/titan-current-extracted/checks/test_worker_deadline.py
          PYTHONPATH=/tmp/titan-current-extracted:/tmp/titan-current-extracted/checks python -B /tmp/titan-current-extracted/checks/test_entrypoint_clock.py
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          receipt = json.loads((root/'runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())
          assert receipt['runtime_files'] == 83, receipt
          manifest = json.loads((root/'runtime/integrated-selected/CURRENT-SOURCE.json').read_text())
          for name in ('seller_snapshot.py','observed_clone.py','plant_suffix.py'):
              assert name in manifest['runtime'], name
          assert hashlib.sha256((root/'reference/titan-current/deadline_adapter.py').read_bytes()).hexdigest() == '7f70a25dfb703f50aa83cd281a9722d575571da1073e605c5927fc35453ab486'
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Commit coherent rebuilt package and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/elm-current-perf-consumer.yml
          git add revenue/kaggriculture/cloud-execution-lab
          git diff --cached --check
          git commit -m 'Compose TITAN performance helpers into current package'
          git push origin HEAD:${GITHUB_REF_NAME}
