name: titan-canonical-rebuild-evidence

on:
  push:
    branches:
      - sol/aperture-titan-canonical-drift-rebuild-20260910-01

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/titan-canonical-rebuild-evidence.yml
            /revenue/kaggriculture/cloud-execution-lab/
            /revenue/kaggriculture/cloud-economic-stress/funded_payback/
            /revenue/kaggriculture/cloud-quickstep/
            /revenue/kaggriculture/cloud-runtime-pulse/
            /revenue/kaggriculture/cloud-committed-seed-retry/
            /revenue/kaggriculture/cloud-opponent-league/lark-responsive/

      - name: Snapshot sealed release and exact current inputs
        shell: python
        run: |
          import hashlib, importlib.util, json, os, platform, shutil, zlib
          from pathlib import Path

          lab = Path('revenue/kaggriculture/cloud-execution-lab').resolve()
          out = Path(os.environ['RUNNER_TEMP']) / 'titan-canonical-rebuild'
          out.mkdir(parents=True, exist_ok=True)
          record = lab / 'runtime/integrated-selected'
          before = json.loads((record / 'CURRENT-ARCHIVE.json').read_text())
          archive = lab / before['path']
          if hashlib.sha256(archive.read_bytes()).hexdigest() != before['sha256']:
              raise ValueError('Committed archive does not match its pre-rebuild pointer')
          shutil.copy2(archive, out / 'previous-titan-current.tar.gz')
          shutil.copy2(record / 'CURRENT-ARCHIVE.json', out / 'BEFORE-ARCHIVE.json')
          shutil.copy2(record / 'CURRENT-SOURCE.json', out / 'BEFORE-SOURCE.json')

          spec = importlib.util.spec_from_file_location('titan_build', lab / 'build_integrated.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          inputs = {}
          for member, source in sorted(module.source_files().items()):
              data = (lab / source).read_bytes()
              inputs[member] = {
                  'source_path': source,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'bytes': len(data),
              }
          snapshot = {
              'checkout': os.environ['GITHUB_SHA'],
              'python': platform.python_version(),
              'zlib': zlib.ZLIB_RUNTIME_VERSION,
              'input_count': len(inputs),
              'inputs': inputs,
          }
          (out / 'CURRENT-INPUTS.json').write_text(json.dumps(snapshot, indent=2, sort_keys=True) + '\n')

      - name: Deterministically rebuild the canonical triplet
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/build_integrated.py \
            | tee "$RUNNER_TEMP/titan-canonical-rebuild/build-result.json"
          python3 -B revenue/kaggriculture/cloud-execution-lab/build_integrated.py --check \
            | tee "$RUNNER_TEMP/titan-canonical-rebuild/check-result.json"

      - name: Run release consistency contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v test_release_consistency \
            2>&1 | tee "$RUNNER_TEMP/titan-canonical-rebuild/release-consistency.log"

      - name: Prove the rebuild changed only the admitted documentation seam
        shell: python
        run: |
          import hashlib, json, os, shutil, tarfile
          from pathlib import Path

          lab = Path('revenue/kaggriculture/cloud-execution-lab').resolve()
          out = Path(os.environ['RUNNER_TEMP']) / 'titan-canonical-rebuild'
          record = lab / 'runtime/integrated-selected'
          before = json.loads((out / 'BEFORE-ARCHIVE.json').read_text())
          after = json.loads((record / 'CURRENT-ARCHIVE.json').read_text())
          current_inputs = json.loads((out / 'CURRENT-INPUTS.json').read_text())['inputs']
          old_archive = out / 'previous-titan-current.tar.gz'
          new_archive = lab / after['path']
          new_source_path = lab / after['source_manifest']

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if digest(old_archive) != before['sha256'] or old_archive.stat().st_size != before['bytes']:
              raise ValueError('Superseded archive identity changed')
          if digest(new_archive) != after['sha256'] or new_archive.stat().st_size != after['bytes']:
              raise ValueError('Rebuilt archive does not match its pointer')
          if digest(new_source_path) != after['source_manifest_sha256']:
              raise ValueError('Rebuilt source manifest does not match its pointer')

          def members(path):
              with tarfile.open(path, 'r:gz') as archive:
                  result = {}
                  for item in archive.getmembers():
                      if not item.isfile():
                          raise ValueError('Canonical archive contains a non-file member')
                      result[item.name] = archive.extractfile(item).read()
                  return result

          old_members = members(old_archive)
          new_members = members(new_archive)
          changed_members = sorted(
              name for name in set(old_members) | set(new_members)
              if old_members.get(name) != new_members.get(name)
          )
          expected_members = ['SOURCE.json', 'TITAN-RELEASE.md', 'reference/decision/README.md']
          if changed_members != expected_members:
              raise ValueError('Unexpected canonical member delta: ' + repr(changed_members))
          if set(old_members) != set(new_members) or len(new_members) != 110:
              raise ValueError('Canonical member set changed')

          old_source = json.loads(old_members['SOURCE.json'])
          new_source = json.loads(new_members['SOURCE.json'])
          source_changes = sorted(
              name for name in set(old_source['runtime']) | set(current_inputs)
              if old_source['runtime'].get(name) != current_inputs.get(name)
          )
          expected_sources = ['TITAN-RELEASE.md', 'reference/decision/README.md']
          if source_changes != expected_sources:
              raise ValueError('Unexpected pre-rebuild source drift: ' + repr(source_changes))
          if new_source['runtime'] != current_inputs:
              raise ValueError('Rebuilt SOURCE.json does not bind every current input')
          if after['runtime_files'] != len(current_inputs) or len(current_inputs) != 109:
              raise ValueError('Canonical runtime input count changed')

          historical = lab / 'exports/historical' / ('titan-' + before['sha256'] + '.tar.gz')
          if not historical.exists() or historical.read_bytes() != old_archive.read_bytes():
              raise ValueError('Superseded archive was not retained byte-for-byte')

          shutil.copy2(new_archive, out / 'titan-current.tar.gz')
          shutil.copy2(new_source_path, out / 'CURRENT-SOURCE.json')
          shutil.copy2(record / 'CURRENT-ARCHIVE.json', out / 'CURRENT-ARCHIVE.json')
          evidence = {
              'successful': True,
              'checkout': os.environ['GITHUB_SHA'],
              'scope': 'canonical documentation/source-manifest rebuild; no gameplay, config, provider, or submission change',
              'previous': {
                  'sha256': before['sha256'],
                  'bytes': before['bytes'],
              },
              'rebuilt': {
                  'sha256': after['sha256'],
                  'bytes': after['bytes'],
                  'source_manifest_sha256': after['source_manifest_sha256'],
              },
              'changed_source_members': source_changes,
              'changed_archive_members': changed_members,
              'unchanged_archive_members': len(new_members) - len(changed_members),
              'runtime_inputs': len(current_inputs),
              'historical_archive_retained': True,
          }
          (out / 'REBUILD-EVIDENCE.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          print(json.dumps(evidence, sort_keys=True))

      - name: Upload exact rebuild evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-canonical-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/titan-canonical-rebuild/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
