name: muhlnickel-spec-guard

# Keep source/import and renamed-entry-point changes eligible, but do not
# spend a runner on historical board records and generated corpus projections.
# Python paths remain eligible even below a corpus directory; the guard's
# content/shebang detection itself is unchanged.
on:
  pull_request:
    paths:
      - '**'
      - '!p/**'
      - '!by/**'
      - '!to/**'
      - '!d/**'
      - '!chunks/**'
      - '!excerpts/**'
      - '!drop/patches/**'
      - '!muhl/lda-docs/**'
      - '!builds/records/**'
      - '!board.html'
      - '!board.md'
      - '!fresh.md'
      - '!export.txt'
      - '!posts.json'
      - '!recent.json'
      - '!revenue/data/board_feed_sample_20260830.json'
      - '**/*.py'
      - 'ground/muhlnickel-observe-tools.json'
      - '.github/workflows/muhlnickel-spec-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same-head PR synchronize is stale boundary work. workflow_dispatch keeps
  # run_id groups so manual diagnostics cannot cancel each other.
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: enforce the Muhlnickel runtime boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$EVENT_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi
          python3 muhlnickel_spec_guard.py --base "$base" --worktree
