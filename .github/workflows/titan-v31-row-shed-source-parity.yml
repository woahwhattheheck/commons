name: TITAN V3.1 row-shed S33 source parity

on:
  push:
    branches:
      - claude/v31-row-shed-20260911
    paths:
      - '.github/workflows/titan-v31-row-shed-source-parity.yml'

permissions:
  contents: write

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow-creation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind TDD predecessor and workflow-only trigger commit
        shell: bash
        run: |
          set -euo pipefail
          PREDECESSOR='0cb700918196817f5ef0c184491bea40e9a6af91'
          WORKFLOW='.github/workflows/titan-v31-row-shed-source-parity.yml'
          test "$(git rev-parse HEAD^)" = "$PREDECESSOR"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW"
          test "$(git rev-parse "$PREDECESSOR:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py")" = '366c0245014989c772561ad55b20bd8a80e6275f'
          test "$(git rev-parse "$PREDECESSOR:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v31_row_shed.py")" = 'bfd3371258f71415e180ca4af2b63c9d43468015'

      - name: Port exact reviewed S33 fail-closed semantics into production seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('def order_sells(market, inventory, shed=None):')
          end = text.index('\n\n# EVENING_FLUSH', start)
          replacement = '''def _strict_nonnegative_int(value):
              return type(value) is int and value >= 0


          def _projection_is_complete(market, lead, shed):
              """Require coherent projected stock for every known leading SELL row."""
              if type(shed) is not dict:
                  return False
              for order in market[:lead]:
                  if not isinstance(order, list) or len(order) < 3 or order[0] != "SELL":
                      return False
                  item = order[1]
                  if item not in _RO_PARAMS:
                      continue
                  if not _strict_nonnegative_int(order[2]):
                      return False
                  available = shed.get(item)
                  if not _strict_nonnegative_int(available):
                      return False
              return True


          def order_sells(market, inventory, shed=None):
              """Stable-sort only the contiguous leading SELL block by row price impact.

              With a complete projected-shed map, known rows use the realizable quantity
              min(requested, shed[item]). Missing or malformed projection evidence falls the
              whole block back to incumbent requested-quantity ROW_ORDER. Malformed authored
              quantities preserve the raw parent order rather than inventing coercion semantics.
              """
              if not isinstance(market, list) or not isinstance(inventory, dict):
                  return market
              lead = 0
              while lead < len(market) and market[lead] and market[lead][0] == "SELL":
                  lead += 1
              if lead < 2:
                  return market

              use_projection = shed is not None and _projection_is_complete(market, lead, shed)
              ranked = []
              for index, order in enumerate(market[:lead]):
                  if not isinstance(order, list) or len(order) < 3:
                      return market
                  item = order[1]
                  if item not in _RO_PARAMS:
                      score = 0
                  else:
                      requested = order[2]
                      if not _strict_nonnegative_int(requested):
                          return market
                      quantity = min(requested, shed[item]) if use_projection else requested
                      level = inventory.get(item, _RO_I0)
                      if type(level) is not int:
                          return market
                      score = (_ro_price(item, level) - _ro_price(item, level + quantity)) * quantity
                  ranked.append((score, index, order))
              ranked.sort(key=lambda row: row[0], reverse=True)
              return [row[2] for row in ranked] + market[lead:]
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          text = text[:start] + replacement + text[end:]

          old = '''    if ROW_ORDER and not ((configuration or {}).get("marketParams") or {}):
              inventory = (observation.get("market") or {}).get("inventory") or {}
              market = [list(o) for o in action.get("market") or [] if o]
              shed = projected_shed(action, FarmView(observation)) if ROW_SHED else None
              ordered = order_sells(market, inventory, shed)
              if ordered != market:
                  action = dict(action)
                  action["market"] = ordered
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    if ROW_ORDER and not ((configuration or {}).get("marketParams") or {}):
              inventory = (observation.get("market") or {}).get("inventory") or {}
              # Empty/falsey rows are execution barriers and positions. Never compact them:
              # S33 only re-ranks the contiguous leading SELL block.
              market = action.get("market") or []
              shed = projected_shed(action, FarmView(observation)) if ROW_SHED else None
              ordered = order_sells(market, inventory, shed)
              if ordered != market:
                  action = dict(action)
                  action["market"] = ordered
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in text:
              raise SystemExit('expected v3_agent ROW_ORDER predecessor block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m py_compile revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py

      - name: Run strict row-shed production contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v overlay/checks/test_v31_row_shed.py |& tee /tmp/row-shed-parity-tests.log
          grep -F 'OK' /tmp/row-shed-parity-tests.log

      - name: Commit source only after exact feature-head CAS
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py'
          test "$(git diff --name-only)" = "$SOURCE"
          EXPECTED_HEAD='${{ github.sha }}'
          REMOTE_BEFORE="$(git ls-remote origin refs/heads/claude/v31-row-shed-20260911 | awk '{print $1}')"
          test "$REMOTE_BEFORE" = "$EXPECTED_HEAD"
          git config user.name 'Astra Titan Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add "$SOURCE"
          git diff --cached --check
          git commit -m 'fix(titan): preserve reviewed S33 row-shed semantics'
          git push origin HEAD:refs/heads/claude/v31-row-shed-20260911
