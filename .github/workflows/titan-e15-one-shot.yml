name: titan-e15-one-shot

on:
  push:
    branches:
      - sol/titan-v25-e15-passive-voi-20260909-01
    paths:
      - .github/workflows/titan-e15-one-shot.yml

permissions:
  contents: write

jobs:
  patch-test-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assert isolated E15 branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/sol/titan-v25-e15-passive-voi-20260909-01"
          test -z "$(git status --porcelain)"
      - name: Apply bounded passive-VOI patch and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py')
          s=p.read_text()
          marker='''    return ledger\n\ndef optimize_lot(*,item,quantity,inventory,params,shops,config,now,dates,\n'''
          helper='''    return ledger\n\ndef probability_free_voi(scenario_names, reference, rows, selected, *, terminal=False, reference_feasible=True):\n    \"\"\"Bound decision-value claims when scenario probabilities are unknown.\n\n    ``rows`` contains only already-feasible, all-scenario productive plans scored\n    by the existing optimizer.  This helper never searches for an information-\n    generating action and never turns a scenario into a forecast.  It reports\n    whether one executable plan is best in every included scenario; otherwise\n    the expected value of additional information has a hard lower bound of zero.\n    \"\"\"\n    names=tuple(scenario_names)\n    if not reference_feasible:\n        return {'status':'not_applicable_forced_feasibility','probabilities':None,\n                'positive_cost_probe_allowed':False,\n                'positive_cost_probe_reason':'feasibility_repair_not_an_information_trade',\n                'decision_can_change_with_free_information':False,\n                'expected_voi_bounds':{'lower':0.0,'upper_bound':0.0}}\n    base=tuple(reference); chosen=tuple(selected)\n    candidates=[(base,tuple(0.0 for _ in names))]\n    seen={base}\n    for plan,deltas in rows:\n        plan=tuple(plan);deltas=tuple(float(v) for v in deltas)\n        if len(deltas)!=len(names):raise ValueError('scenario vector width mismatch')\n        if plan in seen:continue\n        seen.add(plan);candidates.append((plan,deltas))\n    winners={};common=None\n    for index,name in enumerate(names):\n        top=max(row[1][index] for row in candidates)\n        plans=[row[0] for row in candidates if round(row[1][index]-top,8)==0]\n        winners[name]=[list(plan) for plan in plans]\n        ids=set(plans);common=ids if common is None else common & ids\n    common=common or set()\n    selected_deltas=next((d for plan,d in candidates if plan==chosen),tuple(0.0 for _ in names))\n    regrets=[]\n    for index in range(len(names)):\n        regrets.append(max(row[1][index] for row in candidates)-selected_deltas[index])\n    receipt_regret=max(regrets,default=0.0)\n    actionable_upper=0.0 if terminal else receipt_regret\n    changes=not bool(common)\n    return {'status':'certified_probability_free','probabilities':None,\n            'scenario_winners':winners,\n            'universal_winners':[list(plan) for plan in sorted(common)],\n            'selected_plan':list(chosen),'selected_is_universal':chosen in common,\n            'decision_can_change_with_free_information':changes,\n            'ambiguity':'scenario_rankings_cross' if changes else 'one_plan_weakly_dominates',\n            'conditional_receipt_regret_upper_bound':round(receipt_regret,8),\n            'expected_voi_bounds':{'lower':0.0,'upper_bound':round(actionable_upper,8)},\n            'collection_recommendation':('none_terminal' if terminal else\n                'passive_only_if_public_observation_resolves_scenario' if changes else\n                'none_decision_invariant'),\n            'positive_cost_probe_allowed':False,\n            'positive_cost_probe_reason':'uncalibrated_scenario_probabilities'}\n\ndef optimize_lot(*,item,quantity,inventory,params,shops,config,now,dates,\n'''
          if s.count(marker)!=1:raise SystemExit('E15 insert marker mismatch')
          s=s.replace(marker,helper)
          old='''    best_plan=tuple(reference);best_key=(0.0,0.0,0.0) if reference_feasible else (-float('inf'),-float('inf'),0.0);best_scores=baseline\n    found_feasible=reference_feasible\n    candidates={tuple(reference)}\n'''
          new='''    best_plan=tuple(reference);best_worst=0.0 if reference_feasible else -float('inf');best_scores=baseline\n    best_deltas=tuple(0.0 for _ in scenarios) if reference_feasible else None\n    found_feasible=reference_feasible\n    decision_rows=[]\n    candidates={tuple(reference)}\n'''
          if s.count(old)!=1:raise SystemExit('E15 init marker mismatch')
          s=s.replace(old,new)
          old='''        deltas=[s[0]-b[0] for s,b in zip(scores,baseline)]\n        key=(round(min(deltas),8),round(sum(deltas),8),float(dict(plan).get(now,0)))\n        # Require improvement in every explicit scenario; ties preserve reference.\n        if (key[0]>0 or not reference_feasible) and key>best_key:\n            best_key,best_plan,best_scores=key,plan,scores\n            found_feasible=True\n    return best_plan,{'item':item,'quantity':quantity,'rival_scenario_quantity':rival_quantity,\n        'reference':list(reference),'plan':list(best_plan),'minimum_now':minimum_now,\n        'scenarios':{name:{'reference_relative_value':b[0],'relative_value':s[0],\n                          'own_receipts':s[1],'rival_receipts':s[2],'carry_units':s[3]}\n                     for (name,_,_),b,s in zip(scenarios,baseline,best_scores)},\n        'worst_relative_gain':best_key[0] if found_feasible else 0.0,'forced_feasibility':not reference_feasible and found_feasible,\n        'feasible':found_feasible,'plans_evaluated':len(candidates)}\n'''
          new='''        deltas=tuple(float(s[0]-b[0]) for s,b in zip(scores,baseline))\n        worst=round(min(deltas),8)\n        if not (worst>0 or not reference_feasible):continue\n        if reference_feasible:decision_rows.append((tuple(plan),deltas))\n        choose=not found_feasible or worst>best_worst\n        if (not choose and found_feasible and worst==best_worst and best_deltas is not None):\n            # Equal-worst vectors use only probability-free Pareto dominance.\n            # Crossing vectors retain deterministic candidate order; do not\n            # smuggle equal scenario probabilities in through a sum tie-break.\n            choose=(all(new>=old for new,old in zip(deltas,best_deltas)) and\n                    any(new>old for new,old in zip(deltas,best_deltas)))\n        if choose:\n            best_worst,best_plan,best_scores,best_deltas=worst,plan,scores,deltas\n            found_feasible=True\n    information=probability_free_voi(\n        [name for name,_,_ in scenarios],reference,decision_rows,best_plan,\n        terminal=end==last,reference_feasible=reference_feasible)\n    return best_plan,{'item':item,'quantity':quantity,'rival_scenario_quantity':rival_quantity,\n        'reference':list(reference),'plan':list(best_plan),'minimum_now':minimum_now,\n        'scenarios':{name:{'reference_relative_value':b[0],'relative_value':s[0],\n                          'own_receipts':s[1],'rival_receipts':s[2],'carry_units':s[3]}\n                     for (name,_,_),b,s in zip(scenarios,baseline,best_scores)},\n        'worst_relative_gain':best_worst if found_feasible else 0.0,'forced_feasibility':not reference_feasible and found_feasible,\n        'feasible':found_feasible,'plans_evaluated':len(candidates),\n        'passive_information':information}\n'''
          if s.count(old)!=1:raise SystemExit('E15 selection marker mismatch')
          p.write_text(s.replace(old,new))

          test=Path('revenue/kaggriculture/cloud-execution-lab/test_e15_passive_voi.py')
          test.write_text('''# SPDX-License-Identifier: Apache-2.0\nimport unittest\n\nimport mechanics as m\nfrom selected_sell_core import optimize_lot, probability_free_voi\n\n\nclass PassiveVOITests(unittest.TestCase):\n    def test_universal_winner_makes_more_information_a_noop(self):\n        ref=((10,0),);a=((10,1),);b=((10,2),)\n        r=probability_free_voi(('s0','s1'),ref,[(a,(5,5)),(b,(4,3))],a)\n        self.assertFalse(r['decision_can_change_with_free_information'])\n        self.assertTrue(r['selected_is_universal'])\n        self.assertEqual(r['expected_voi_bounds'],{'lower':0.0,'upper_bound':0.0})\n        self.assertEqual(r['collection_recommendation'],'none_decision_invariant')\n        self.assertFalse(r['positive_cost_probe_allowed'])\n\n    def test_crossing_rankings_are_ambiguous_without_probabilities(self):\n        ref=((10,0),);a=((10,1),);b=((10,2),)\n        r=probability_free_voi(('low','high'),ref,[(a,(5,1)),(b,(1,5))],a)\n        self.assertTrue(r['decision_can_change_with_free_information'])\n        self.assertEqual(r['universal_winners'],[])\n        self.assertEqual(r['expected_voi_bounds'],{'lower':0.0,'upper_bound':4.0})\n        self.assertEqual(r['collection_recommendation'],'passive_only_if_public_observation_resolves_scenario')\n        self.assertFalse(r['positive_cost_probe_allowed'])\n        self.assertIsNone(r['probabilities'])\n\n    def test_ties_keep_probability_free_universal_winner(self):\n        ref=((10,0),);a=((10,1),);b=((10,2),)\n        r=probability_free_voi(('a','b'),ref,[(a,(5,5)),(b,(5,4))],a)\n        self.assertEqual(r['universal_winners'],[list(a)])\n        self.assertEqual(len(r['scenario_winners']['a']),2)\n        self.assertFalse(r['decision_can_change_with_free_information'])\n\n    def test_terminal_has_no_actionable_payback_window(self):\n        ref=((718,0),);a=((718,1),);b=((718,2),)\n        r=probability_free_voi(('low','high'),ref,[(a,(5,1)),(b,(1,5))],a,terminal=True)\n        self.assertGreater(r['conditional_receipt_regret_upper_bound'],0)\n        self.assertEqual(r['expected_voi_bounds']['upper_bound'],0.0)\n        self.assertEqual(r['collection_recommendation'],'none_terminal')\n        self.assertFalse(r['positive_cost_probe_allowed'])\n\n    def test_forced_feasibility_is_not_mislabeled_as_information_value(self):\n        r=probability_free_voi(('s',),((10,0),),[],((10,1),),reference_feasible=False)\n        self.assertEqual(r['status'],'not_applicable_forced_feasibility')\n        self.assertFalse(r['positive_cost_probe_allowed'])\n        self.assertEqual(r['expected_voi_bounds']['lower'],0.0)\n\n    def test_optimizer_exposes_certificate_without_probe_action(self):\n        plan,info=optimize_lot(item='STRAWBERRY',quantity=3,inventory=9900,\n            params=m.MARKET_PARAMS,shops=[],config={},now=10,dates=[10,11],\n            reference=((10,3),),rival_quantity=2,capacity_ok=lambda _plan: True,last=718)\n        self.assertIn('passive_information',info)\n        self.assertIsNone(info['passive_information']['probabilities'])\n        self.assertFalse(info['passive_information']['positive_cost_probe_allowed'])\n        self.assertIsInstance(plan,tuple)\n\n\nif __name__=='__main__':\n    unittest.main(verbosity=2)\n''')
          PY
      - name: Run focused E15 and seller regressions
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v test_e15_passive_voi.py test_selected_action_sell.py
          python3 -B -m unittest -v test_scheduler.py
      - name: Rebuild and verify canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/build_integrated.py
          python3 -B revenue/kaggriculture/cloud-execution-lab/build_integrated.py --check
      - name: Audit generated paths and commit E15 bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed={
            'revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py',
            'revenue/kaggriculture/cloud-execution-lab/test_e15_passive_voi.py',
            'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz',
            'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json',
            'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json',
          }
          changed=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
            path=line[3:].split(' -> ')[-1]
            changed.append(path)
          unexpected=[p for p in changed if p not in allowed and not p.startswith('revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-')]
          if unexpected:raise SystemExit('unexpected paths: '+repr(unexpected))
          required={'revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py','revenue/kaggriculture/cloud-execution-lab/test_e15_passive_voi.py'}
          if not required.issubset(changed):raise SystemExit('missing E15 source/test delta: '+repr(changed))
          print('\n'.join(changed))
          PY
          git add -- revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py \
            revenue/kaggriculture/cloud-execution-lab/test_e15_passive_voi.py \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/exports/historical/ \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Titan V2.5 E15: certify passive information value"
          git push origin "HEAD:${GITHUB_REF_NAME}"
