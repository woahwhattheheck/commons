# Deploy woahwhattheheck/webmcp-pad to its OWN Vercel project (default: webmcp-pad).
#
# This file lives in woahwhattheheck/commons only because the Vercel deploy
# secrets live here. It deploys a DIFFERENT repository. It reads exactly two
# secrets for auth: VERCEL_TEAM_TOKEN (team-scoped, CLI-compatible) and
# VERCEL_ORG_ID (presence check only). It NEVER exports VERCEL_PROJECT_ID to
# the Vercel CLI, because that id belongs to commons-spark-mcp and exporting
# it would redeploy the Commons MCP from webmcp-pad source. VERCEL_PROJECT_ID
# is read once, under the name FORBIDDEN_PROJECT_ID, purely as a tripwire: if
# the linked project id ever equals it, the job fails before deploying.
#
# Vercel CLI reads VERCEL_ORG_ID and VERCEL_PROJECT_ID as a pair and errors if
# only one is defined, so neither is exported into the deploy shell. Team
# targeting is done with --scope woahwhatthehecks-projects instead.
#
# workflow_dispatch ONLY. It never runs on push and never runs on pull_request,
# so nothing in the commons corpus (p/**, board.md, posts.json, llms.txt) can
# roll it, and no PR can deploy. It never touches commons-spark-mcp: no path in
# this file references that project, its id, its domain, or spark-mcp-production.
#
# The checkout path is literally "webmcp-pad" so that the documented fallback
# (vercel deploy --prod --yes in an unlinked directory auto-creates a project
# named after the directory) lands on the right project name if vercel link
# fails.
name: webmcp-pad-production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "woahwhattheheck/webmcp-pad ref to deploy (branch, tag, or full SHA)"
        required: false
        default: "main"
      project:
        description: "Vercel project name to create/deploy into (must not be commons-spark-mcp)"
        required: false
        default: "webmcp-pad"

concurrency:
  group: webmcp-pad-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      live_url: ${{ steps.verify.outputs.live_url }}
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      alias_url: ${{ steps.deploy.outputs.alias_url }}
    env:
      VERCEL_SCOPE: woahwhatthehecks-projects
      PAD_REPO: woahwhattheheck/webmcp-pad
      PAD_REF: ${{ inputs.ref }}
      PAD_PROJECT: ${{ inputs.project }}
    steps:
      - name: refuse any project name that could overwrite the Commons MCP
        run: |
          set -euo pipefail
          if [ -z "${PAD_PROJECT}" ]; then
            echo "::error::project input is empty"
            exit 1
          fi
          if [ "${PAD_PROJECT}" = "commons-spark-mcp" ]; then
            echo "::error::refusing to deploy webmcp-pad into commons-spark-mcp"
            exit 1
          fi
          if ! printf '%s' "${PAD_PROJECT}" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::project must match ^[a-z0-9][a-z0-9-]{0,62}$ (got: ${PAD_PROJECT})"
            exit 1
          fi
          echo "target Vercel project: ${PAD_PROJECT}"
          echo "source: ${PAD_REPO}@${PAD_REF}"

      - name: detect Vercel credentials without printing values
        id: creds
        env:
          HAVE_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN != '' }}
          HAVE_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
        run: |
          set -euo pipefail
          MISSING=""
          if [ "${HAVE_TOKEN}" != "true" ]; then MISSING="${MISSING} VERCEL_TEAM_TOKEN"; fi
          if [ "${HAVE_ORG}" != "true" ]; then MISSING="${MISSING} VERCEL_ORG_ID"; fi
          if [ -z "${MISSING}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TEAM_TOKEN present (value not printed)"
            echo "VERCEL_ORG_ID present (value not printed)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## webmcp-pad-production skipped"
              echo
              echo "Missing GitHub Actions secret(s) on woahwhattheheck/commons:"
              for name in ${MISSING}; do
                echo "- ${name}"
              done
              echo
              echo "Exact UI action: open"
              echo "https://github.com/woahwhattheheck/commons/settings/secrets/actions"
              echo "-> New repository secret (values from Vercel, never from chat or git):"
              echo
              echo "1. VERCEL_TEAM_TOKEN - Vercel -> Account Settings -> Tokens -> Create,"
              echo "   scoped to the team woahwhatthehecks-projects (CLI-compatible token)."
              echo "2. VERCEL_ORG_ID - Vercel -> any project in that team -> Settings -> General."
              echo
              echo "Do NOT add or reuse VERCEL_PROJECT_ID as a deploy target here. That"
              echo "secret belongs to another project and is used by this workflow only"
              echo "as a tripwire."
              echo
              echo "Then re-run: Actions -> webmcp-pad-production -> Run workflow."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: checkout woahwhattheheck/webmcp-pad at the requested ref
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/webmcp-pad
          ref: ${{ inputs.ref }}
          path: webmcp-pad
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.WEBMCP_PAD_TOKEN || github.token }}

      - name: confirm the checked-out tree is the pad, not a blob
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/webmcp-pad"
          for f in pad.html api/mcp.py vercel.json LICENSE; do
            if [ ! -f "$f" ]; then
              echo "::error::${PAD_REPO}@${PAD_REF} is missing ${f}"
              exit 1
            fi
          done
          echo "checked out $(git rev-parse HEAD)"
          ls -la
          echo "pad.html bytes: $(wc -c < pad.html)"
          echo "api/mcp.py bytes: $(wc -c < api/mcp.py)"
          BAD=""
          if ! grep -q 'registerTool' pad.html; then
            BAD="${BAD} pad.html-has-no-registerTool"
          fi
          if ! grep -Eq 'titanmcp|webmcp-pad' api/mcp.py; then
            BAD="${BAD} api/mcp.py-does-not-name-titanmcp-or-webmcp-pad"
          fi
          if [ -d pad_blob ] || [ -d api/_blob ]; then
            BAD="${BAD} self-extracting-blob-directories-present"
          fi
          if [ -n "${BAD}" ]; then
            {
              echo "## webmcp-pad-production refused a sealed-blob ref"
              echo
              echo "${PAD_REPO}@${PAD_REF} is not plain source:${BAD}"
              echo
              echo "The judge page must contain literal registerTool and the adapter must"
              echo "name serverInfo titanmcp (or webmcp-pad). A self-extracting base64 pad.html fails both"
              echo "and is not readable source for the OSS-repo requirement."
              echo
              echo "Fix: re-run this workflow with ref set to the branch that holds plain"
              echo "source, or land plain source on main first."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::refusing to deploy a non-plain-source ref:${BAD}"
            exit 1
          fi
          echo "plain source confirmed"

      - name: setup node
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: link and deploy to production
        id: deploy
        if: steps.creds.outputs.present == 'true'
        env:
          # Fed from the TEAM token on purpose. The project-scoped newer-format
          # token is rejected by Vercel CLI 56.x.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
          # Tripwire only. Deliberately NOT named VERCEL_PROJECT_ID so the
          # Vercel CLI can never pick it up and target the wrong project.
          FORBIDDEN_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          unset VERCEL_ORG_ID || true
          unset VERCEL_PROJECT_ID || true
          cd "${GITHUB_WORKSPACE}/webmcp-pad"

          npm install --global vercel@56.1.0
          vercel --version

          LINKED=no
          if vercel link --yes --token="${VERCEL_TOKEN}" --scope "${VERCEL_SCOPE}" --project "${PAD_PROJECT}"; then
            LINKED=yes
            echo "vercel link ok"
          else
            echo "::warning::vercel link failed; falling back to directory-named auto-create (dir is literally webmcp-pad)"
            rm -rf .vercel
          fi

          if [ "${LINKED}" = "yes" ] && [ -f .vercel/project.json ]; then
            PID="$(jq -r '.projectId // empty' .vercel/project.json)"
            if [ -z "${PID}" ]; then
              echo "::error::.vercel/project.json has no projectId"
              exit 1
            fi
            if [ -n "${FORBIDDEN_PROJECT_ID:-}" ] && [ "${PID}" = "${FORBIDDEN_PROJECT_ID}" ]; then
              echo "::error::linked project id equals the pre-existing VERCEL_PROJECT_ID secret. Refusing to deploy."
              exit 1
            fi
            echo "linked project ${PAD_PROJECT} (project id not printed)"
          fi

          vercel deploy --prod --yes --token="${VERCEL_TOKEN}" --scope "${VERCEL_SCOPE}" | tee /tmp/deploy.log

          DEPLOY_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/deploy.log | tail -n 1 || true)"
          if [ -z "${DEPLOY_URL}" ]; then
            echo "::error::could not parse a deployment URL out of the vercel deploy output"
            exit 1
          fi
          echo "deployment URL: ${DEPLOY_URL}"
          echo "deployment_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

          ALIAS_URL=""
          if vercel inspect "${DEPLOY_URL}" --token="${VERCEL_TOKEN}" --scope "${VERCEL_SCOPE}" > /tmp/inspect.log 2>&1; then
            ALIAS_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/inspect.log | grep -E "^https://${PAD_PROJECT}\.vercel\.app$" | head -n 1 || true)"
            if [ -z "${ALIAS_URL}" ]; then
              ALIAS_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/inspect.log | grep -vE '^https://[A-Za-z0-9.-]*-[a-z0-9]{9}-' | head -n 1 || true)"
            fi
          else
            echo "::warning::vercel inspect failed; trying alias ls"
          fi
          if [ -z "${ALIAS_URL}" ]; then
            if vercel alias ls --token="${VERCEL_TOKEN}" --scope "${VERCEL_SCOPE}" > /tmp/alias.log 2>&1; then
              HOSTNAME_HIT="$(grep -Eo "${PAD_PROJECT}[A-Za-z0-9.-]*\.vercel\.app" /tmp/alias.log | head -n 1 || true)"
              if [ -n "${HOSTNAME_HIT}" ]; then ALIAS_URL="https://${HOSTNAME_HIT}"; fi
            else
              echo "::warning::vercel alias ls failed"
            fi
          fi
          if [ -z "${ALIAS_URL}" ]; then
            ALIAS_URL="https://${PAD_PROJECT}.vercel.app"
            echo "::warning::alias not discovered; assuming the conventional production alias"
          fi
          echo "production alias candidate: ${ALIAS_URL}"
          echo "alias_url=${ALIAS_URL}" >> "$GITHUB_OUTPUT"
          echo "candidates=${ALIAS_URL} ${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: wait for a live WebMCP door and a live MCP adapter
        id: verify
        if: steps.creds.outputs.present == 'true'
        env:
          CANDIDATES: ${{ steps.deploy.outputs.candidates }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
        run: |
          set -uo pipefail
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"webmcp-pad-production","version":"1"}}}'
          WINDOW_SECS=180
          LIVE=""
          CODE="000"
          NAME=""
          VER=""
          DEADLINE=$(( $(date +%s) + WINDOW_SECS ))
          ATTEMPT=0
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            for U in ${CANDIDATES}; do
              # curl does not truncate -o files when a connection fails, so a stale
              # response from a previous candidate or attempt would read as a pass.
              # Clear every probe file before each candidate.
              rm -f /tmp/pad.html /tmp/pad.hdr /tmp/init.raw /tmp/init.json
              OK_HTML=no
              OK_MCP=no
              CODE="$(curl -sSL -m 20 -o /tmp/pad.html -D /tmp/pad.hdr -w '%{http_code}' "${U}/webmcp")" || true
              [ -n "${CODE}" ] || CODE="000"
              if [ "${CODE}" = "200" ] && [ -s /tmp/pad.hdr ] && [ -s /tmp/pad.html ] && grep -qi '^content-type:[[:space:]]*text/html' /tmp/pad.hdr && grep -q 'registerTool' /tmp/pad.html; then
                OK_HTML=yes
              fi
              curl -sSL -m 20 -X POST "${U}/mcp" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2025-03-26' --data "${INIT}" -o /tmp/init.raw || true
              NAME=""
              VER=""
              if [ -s /tmp/init.raw ]; then
                sed -e 's/^data: //' /tmp/init.raw > /tmp/init.json 2>/dev/null || true
                NAME="$(jq -r '.result.serverInfo.name // empty' /tmp/init.json 2>/dev/null)" || NAME=""
                VER="$(jq -r '.result.serverInfo.version // empty' /tmp/init.json 2>/dev/null)" || VER=""
              fi
              case "${NAME}" in titanmcp|webmcp-pad) OK_MCP=yes ;; esac
              echo "attempt ${ATTEMPT} ${U} http=${CODE} html=${OK_HTML} mcp=${OK_MCP} serverInfo=${NAME:-none}/${VER:-none}"
              if [ "${OK_HTML}" = "yes" ] && [ "${OK_MCP}" = "yes" ]; then
                LIVE="${U}"
                break 2
              fi
            done
            sleep 10
          done

          if [ -z "${LIVE}" ]; then
            {
              echo "## webmcp-pad-production FAILED verification"
              echo
              echo "Deploy returned a URL but no candidate served a valid door within ${WINDOW_SECS}s (${ATTEMPT} attempts)."
              echo
              echo "Tried: ${CANDIDATES}"
              echo
              echo "Both are required, on the same origin:"
              echo "- GET <origin>/webmcp -> 200, text/html, body contains registerTool"
              echo "- POST <origin>/mcp initialize -> result.serverInfo.name == titanmcp (or webmcp-pad)"
              echo
              echo "Last /webmcp status: ${CODE}. Last serverInfo.name: ${NAME:-none}."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::webmcp-pad is not live on any candidate URL"
            exit 1
          fi

          PAD_BYTES="$(wc -c < /tmp/pad.html)"
          rm -f /tmp/tools.raw /tmp/tools.json /tmp/catalog.json
          curl -sSL -m 20 -X POST "${LIVE}/mcp" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2025-03-26' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' -o /tmp/tools.raw || true
          TOOL_NAMES=""
          TOOL_COUNT=0
          if [ -s /tmp/tools.raw ]; then
            sed -e 's/^data: //' /tmp/tools.raw > /tmp/tools.json 2>/dev/null || true
            TOOL_NAMES="$(jq -r '[.result.tools[]?.name] | join(" ")' /tmp/tools.json 2>/dev/null)" || TOOL_NAMES=""
            TOOL_COUNT="$(jq -r '[.result.tools[]?.name] | length' /tmp/tools.json 2>/dev/null)" || TOOL_COUNT=0
          fi
          [ -n "${TOOL_COUNT}" ] || TOOL_COUNT=0
          MISSING=""
          for want in create_room list_rooms post_message list_messages invite_agent set_role list_roles list_operators get_operator submit_task plan_task assign_piece list_assignments check_subscription create_play_token request_setup get_setup_status list_research_power list_custom_tooling list_connectors get_connector attach_connector_to_room; do
            case " ${TOOL_NAMES} " in
              *" ${want} "*) : ;;
              *) MISSING="${MISSING} ${want}" ;;
            esac
          done
          CAT_CODE="$(curl -sSL -m 20 -o /tmp/catalog.json -w '%{http_code}' "${LIVE}/connectors/catalog.json")" || true
          [ -n "${CAT_CODE}" ] || CAT_CODE="000"

          echo "live_url=${LIVE}" >> "$GITHUB_OUTPUT"
          echo "tool_count=${TOOL_COUNT}" >> "$GITHUB_OUTPUT"

          {
            echo "## webmcp-pad is live"
            echo
            echo "**LIVE_URL: ${LIVE}**"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| source | ${PAD_REPO}@${PAD_REF} |"
            echo "| Vercel project | ${PAD_PROJECT} |"
            echo "| deployment | ${DEPLOYMENT_URL} |"
            echo "| production alias | ${ALIAS_URL} |"
            echo "| judge page | ${LIVE}/webmcp -> 200 text/html, ${PAD_BYTES} bytes, registerTool present |"
            echo "| MCP endpoint | ${LIVE}/mcp -> serverInfo ${NAME}/${VER} |"
            echo "| tools/list | ${TOOL_COUNT} tools |"
            echo "| /connectors/catalog.json | HTTP ${CAT_CODE} |"
            echo
            if [ -n "${MISSING}" ]; then
              echo "Advisory only, not a deploy failure - tools/list is missing:${MISSING}"
              echo
            fi
            echo "Open ${LIVE}/webmcp in the ChatGPT in-app browser, or in Chrome with"
            echo "chrome://flags/#enable-webmcp-testing enabled."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -n "${MISSING}" ]; then
            echo "::warning::tools/list is missing:${MISSING}"
          fi
