name: titan-v3-own-value-bound-panel-sol-closure

on:
  push:
    paths:
      - '.github/workflows/titan-v3-own-value-bound-panel-sol-closure.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-own-value-bound-panel-sol-closure/**'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-own-value-bound-panel-sol-closure.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-own-value-bound-panel-sol-closure/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-archive-paired-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SEEDS: '539131249,1834999074,2609097301,2609097302,2609097303,2609097304,2611092201,2611092207'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      EXPECTED_ARCHIVE_SHA256: '17f536087b3a6baf4ae1222a051285766a3ea8c2ca5af6edc190d4f527e12b86'
      EXPECTED_SOURCE_MANIFEST_SHA256: '1feec5a68ffde28ab7b5c7d2c92a34aa66ff5705b7d88182ef6af98df8bb5083'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact stack and selected archive
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          PARENT="$LAB/analysis/titan-v3-own-value-objective-sol-objective"
          CARRIER="$LAB/analysis/titan-v3-own-value-archive-carrier-sol-foundry"

          verify_blob() {
            local path="$1" expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf '%s  %s\n' "$actual" "$path"
            test "$actual" = "$expected"
          }

          {
            printf 'head %s\n' "$EXPECTED_HEAD"
            verify_blob "$LAB/build_integrated.py" 05994d946885ff0fe2a2ce77439fd335174900aa
            verify_blob "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json" 8a9023bb85447f0aad088699ecf7f0a03b808201
            verify_blob "$LAB/runtime/integrated-selected/CURRENT-SOURCE.json" f5d8a9f1338dbef5396de8f23262453b0f70e832
            verify_blob "$PARENT/own_value_objective.py" 17c49e220de6b8c1c1ba15a95e4707a3d9cd1ea0
            verify_blob "$PARENT/compare.py" 9a4642211f2fe16da4452aad0a084a1efa85bb31
            verify_blob "$CARRIER/archive_runtime_guard.py" 2fbc4b45d2f0f06f8ccef2665d8d740d73c9e3db
            verify_blob "$CARRIER/archive_carrier.py" 2f5be09c36368732ddf80a84f3a86b36b2ae405e
            verify_blob "$CARRIER/verify_panel_binding.py" 82f0026fd1924ab3987aaf804eba7cc3f56cd87c
            verify_blob "$KAG/cloud-eval/evaluate.py" 077feb2208b6e0c1727835eb4f8089709bf67f3b
            verify_blob "$LAB/runtime/variants/v1/candidate.py" 8db1262a2d38cc3115d06732383e18e1132ccfba
            verify_blob "$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py" bdb9cf58148a3c7961c085f4902759537decabf6
          } | tee "$RUNNER_TEMP/SOURCE-BLOBS.txt"

          LAB="$LAB" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          lab = Path(os.environ["LAB"])
          pointer = json.loads(
              (lab / "runtime/integrated-selected/CURRENT-ARCHIVE.json").read_text(
                  encoding="utf-8"
              )
          )
          assert pointer["sha256"] == os.environ["EXPECTED_ARCHIVE_SHA256"]
          assert pointer["source_manifest_sha256"] == os.environ[
              "EXPECTED_SOURCE_MANIFEST_SHA256"
          ]
          assert pointer["bytes"] == 427870
          assert pointer["runtime_files"] == 109
          archive = lab / pointer["path"]
          payload = archive.read_bytes()
          assert len(payload) == pointer["bytes"]
          assert hashlib.sha256(payload).hexdigest() == pointer["sha256"]
          print(json.dumps(pointer, sort_keys=True))
          PY
          git diff --exit-code -- .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned official-interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run policy, comparator, carrier, and binder contracts
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          PARENT="$LAB/analysis/titan-v3-own-value-objective-sol-objective"
          CARRIER="$LAB/analysis/titan-v3-own-value-archive-carrier-sol-foundry"

          (
            cd "$PARENT"
            python -m py_compile \
              own_value_objective.py candidate.py mechanism_witness.py compare.py \
              test_own_value_objective.py test_compare.py
            python -m unittest -v test_own_value_objective.py test_compare.py
            python mechanism_witness.py
          ) 2>&1 | tee "$RUNNER_TEMP/OBJECTIVE-CONTRACTS.txt"

          (
            cd "$CARRIER"
            python -m py_compile \
              archive_runtime_guard.py archive_carrier.py verify_panel_binding.py \
              test_archive_carrier.py
            python -m unittest -v test_archive_carrier.py
          ) 2>&1 | tee "$RUNNER_TEMP/CARRIER-CONTRACTS.txt"

          git diff --exit-code -- .

      - name: Verify exact current integrated release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python build_integrated.py --check \
            | tee "$RUNNER_TEMP/CANONICAL-ARCHIVE-CHECK.json"
          git diff --exit-code -- .

      - name: Materialize and probe both complete archive arms
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          PARENT="$LAB/analysis/titan-v3-own-value-objective-sol-objective"
          CARRIER="$LAB/analysis/titan-v3-own-value-archive-carrier-sol-foundry"
          OUT="$RUNNER_TEMP/titan-v3-own-value-bound-panel"
          mkdir -p "$OUT"

          python "$CARRIER/archive_carrier.py" materialize \
            --lab-root "$LAB" \
            --pointer "$LAB/runtime/integrated-selected/CURRENT-ARCHIVE.json" \
            --overlay "$PARENT/own_value_objective.py" \
            --output "$OUT/carrier" \
            --git-head "$(git rev-parse HEAD)" \
            | tee "$OUT/MATERIALIZE-STDOUT.json"

          python "$CARRIER/archive_carrier.py" probe \
            --entry "$OUT/carrier/control/control_entry.py" \
            --output "$OUT/CONTROL-PROBE.json" \
            > "$OUT/CONTROL-PROBE-STDOUT.json"
          python "$CARRIER/archive_carrier.py" probe \
            --entry "$OUT/carrier/candidate/candidate_entry.py" \
            --output "$OUT/CANDIDATE-PROBE.json" \
            > "$OUT/CANDIDATE-PROBE-STDOUT.json"
          python "$CARRIER/archive_carrier.py" verify \
            --root "$OUT/carrier" \
            --output "$OUT/PRE-PANEL-VERIFY.json" \
            > "$OUT/PRE-PANEL-VERIFY-STDOUT.json"

          OUT="$OUT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUT"])
          receipt = json.loads((out / "carrier/CARRIER-RECEIPT.json").read_text())
          control = json.loads((out / "CONTROL-PROBE.json").read_text())
          candidate = json.loads((out / "CANDIDATE-PROBE.json").read_text())
          pre = json.loads((out / "PRE-PANEL-VERIFY.json").read_text())
          assert receipt["archive"]["sha256"] == os.environ["EXPECTED_ARCHIVE_SHA256"]
          assert receipt["archive"]["source_manifest_sha256"] == os.environ[
              "EXPECTED_SOURCE_MANIFEST_SHA256"
          ]
          assert receipt["canonical_runtime_equal"] is True
          assert receipt["canonical_repository_modified"] is False
          assert control["install_receipt"] is None
          install = candidate["install_receipt"]
          assert install["changed_field"] == "MarketPath.score[0]"
          assert install["actual_git_blob"] == install["expected_git_blob"]
          assert install["canonical_files_modified"] is False
          assert pre["canonical_runtime_equal"] is True
          PY
          git diff --exit-code -- .

      - name: Run bound canonical-control panel
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          OUT="$RUNNER_TEMP/titan-v3-own-value-bound-panel"

          python "$KAG/cloud-eval/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$OUT/carrier/control/control_entry.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260910 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --recheck-first \
            --output "$OUT/control.json"

      - name: Run bound own-value candidate panel
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          OUT="$RUNNER_TEMP/titan-v3-own-value-bound-panel"

          python "$KAG/cloud-eval/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$OUT/carrier/candidate/candidate_entry.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260910 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --recheck-first \
            --output "$OUT/candidate.json"

      - name: Bind reports and classify paired own-cash evidence
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          PARENT="$LAB/analysis/titan-v3-own-value-objective-sol-objective"
          CARRIER="$LAB/analysis/titan-v3-own-value-archive-carrier-sol-foundry"
          OUT="$RUNNER_TEMP/titan-v3-own-value-bound-panel"

          python "$CARRIER/verify_panel_binding.py" \
            --receipt "$OUT/carrier/CARRIER-RECEIPT.json" \
            --control "$OUT/control.json" \
            --candidate "$OUT/candidate.json" \
            --output "$OUT/PANEL-BINDING.json" \
            | tee "$OUT/PANEL-BINDING-STDOUT.json"

          python "$PARENT/compare.py" \
            --control "$OUT/control.json" \
            --candidate "$OUT/candidate.json" \
            --head "$(git rev-parse HEAD)" \
            --output "$OUT/PAIRED-REPORT.json" \
            --markdown "$OUT/PAIRED-REPORT.md" \
            | tee "$OUT/PAIRED-REPORT-STDOUT.json"

          cat "$OUT/PAIRED-REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          OUT="$OUT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["OUT"]) / "PAIRED-REPORT.json").read_text()
          )
          print(f"verdict={report['verdict']}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"verdict={report['verdict']}\n")
              handle.write(
                  f"mean_own_cash_delta={report['overall']['mean_own_cash_delta']}\n"
              )
              handle.write(
                  f"trace_changed_cells={report['overall']['trace_changed_cells']}\n"
              )
          PY

      - name: Re-inventory both arms after gameplay
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          CARRIER="$LAB/analysis/titan-v3-own-value-archive-carrier-sol-foundry"
          OUT="$RUNNER_TEMP/titan-v3-own-value-bound-panel"

          python "$CARRIER/archive_carrier.py" verify \
            --root "$OUT/carrier" \
            --output "$OUT/POST-PANEL-VERIFY.json" \
            > "$OUT/POST-PANEL-VERIFY-STDOUT.json"
          OUT="$OUT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["OUT"]) / "POST-PANEL-VERIFY.json").read_text()
          )
          assert report["canonical_runtime_equal"] is True
          assert set(report["arms"]) == {"control", "candidate"}
          PY
          git diff --exit-code -- .

      - name: Write immutable experiment provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/titan-v3-own-value-bound-panel"
          mkdir -p "$OUT"
          OUT="$OUT" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          out = Path(os.environ["OUT"])
          files = {}
          for path in sorted(out.rglob("*")):
              if path.is_file() and path.name != "PROVENANCE.json":
                  files[path.relative_to(out).as_posix()] = {
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }

          def load(name):
              path = out / name
              return json.loads(path.read_text()) if path.is_file() else None

          paired = load("PAIRED-REPORT.json")
          binding = load("PANEL-BINDING.json")
          result = {
              "schema_version": 1,
              "operation": "titan-v3-own-value-bound-gameplay-screen-20260910-01",
              "git_head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "stack_base": "f5020986a864463485ef1c8a032226ecfe82e983",
              "archive_sha256": os.environ["EXPECTED_ARCHIVE_SHA256"],
              "source_manifest_sha256": os.environ[
                  "EXPECTED_SOURCE_MANIFEST_SHA256"
              ],
              "seeds": [int(value) for value in os.environ["SEEDS"].split(",")],
              "opponents": ["arlene", "v1"],
              "both_seats": True,
              "planned_games_per_arm": 32,
              "planned_games_total": 64,
              "binding": binding,
              "verdict": paired.get("verdict") if paired else None,
              "overall": paired.get("overall") if paired else None,
              "canonical_release_modified": False,
              "promotion_authorized": False,
              "hosted_leaderboard_claim": False,
              "files": files,
          }
          (out / "PROVENANCE.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain complete bound gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-own-value-bound-panel-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/SOURCE-BLOBS.txt
            ${{ runner.temp }}/OBJECTIVE-CONTRACTS.txt
            ${{ runner.temp }}/CARRIER-CONTRACTS.txt
            ${{ runner.temp }}/CANONICAL-ARCHIVE-CHECK.json
            ${{ runner.temp }}/titan-v3-own-value-bound-panel/
          if-no-files-found: error
          retention-days: 30

      - name: Assert terminal experiment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/titan-v3-own-value-bound-panel"
          test -s "$RUNNER_TEMP/SOURCE-BLOBS.txt"
          test -s "$RUNNER_TEMP/OBJECTIVE-CONTRACTS.txt"
          test -s "$RUNNER_TEMP/CARRIER-CONTRACTS.txt"
          test -s "$RUNNER_TEMP/CANONICAL-ARCHIVE-CHECK.json"
          test -s "$OUT/carrier/CARRIER-RECEIPT.json"
          test -s "$OUT/CONTROL-PROBE.json"
          test -s "$OUT/CANDIDATE-PROBE.json"
          test -s "$OUT/PRE-PANEL-VERIFY.json"
          test -s "$OUT/control.json"
          test -s "$OUT/candidate.json"
          test -s "$OUT/PANEL-BINDING.json"
          test -s "$OUT/PAIRED-REPORT.json"
          test -s "$OUT/PAIRED-REPORT.md"
          test -s "$OUT/POST-PANEL-VERIFY.json"
          test -s "$OUT/PROVENANCE.json"
          git diff --exit-code -- .
