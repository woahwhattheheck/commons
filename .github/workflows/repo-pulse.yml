# repo-pulse — lossless 5-minute change index for main, posted to Slack.
#
# The engine lives in repo_pulse.py (imported by test_repo_pulse.py). This
# workflow fetches those two files over the API so it never clones the ~1GB
# tree. Cursor state is a cache, not a commit: committing evidence onto main
# would make the pulse appear in its own next pulse.
#
# LOOP SAFETY — do not remove the COMMONS_SLACK_MIRROR header the engine
# emits. slack_ingest.should_skip() refuses that claim, so the digest cannot
# create a board issue that becomes the next digest, forever.
#
# Quiet windows emit nothing except a once-an-hour heartbeat.
# Until SLACK_WEBHOOK_URL exists the digest goes to the job summary instead
# of failing, so the schedule can be live before the credential is.
name: repo-pulse

on:
  schedule:
    # Offset off :00 — GitHub delays scheduled runs hardest at the top of the hour.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render to the job log instead of posting to Slack"
        type: boolean
        default: false
  pull_request:
    paths:
      - "repo_pulse.py"
      - "test_repo_pulse.py"
      - ".github/workflows/repo-pulse.yml"
  push:
    branches: [main]
    paths:
      - "repo_pulse.py"
      - "test_repo_pulse.py"
      - ".github/workflows/repo-pulse.yml"

concurrency:
  group: repo-pulse
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  pages: read
  actions: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore cursor from the previous run
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .pulse-state.json
          key: repo-pulse-cursor-${{ github.run_id }}
          restore-keys: |
            repo-pulse-cursor-

      - name: Fetch engine, run fixtures, post digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          PULSE_STATE: .pulse-state.json
          PULSE_EVIDENCE: repo-pulse/latest.json
          PULSE_REPORT_IDLE: "false"
          PULSE_IDLE_HEARTBEAT_MINUTES: "60"
          PULSE_MAX_COMMIT_LINES: "8"
          PULSE_FALLBACK_MINUTES: "5"
          PULSE_DRY_RUN: ${{ (inputs.dry_run || github.event_name == 'pull_request') && 'true' || '' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pulse repo-pulse
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents"
          fetch() {
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: repo-pulse/2.1" \
              "${api}/$1?ref=${GITHUB_SHA}" -o "/tmp/pulse/$1"
          }
          fetch repo_pulse.py
          fetch test_repo_pulse.py
          python3 /tmp/pulse/test_repo_pulse.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR dry-run: fixtures passed; skipping live digest so a preview cannot move the cursor."
            exit 0
          fi
          python3 /tmp/pulse/repo_pulse.py
          if [ -f repo-pulse/latest.json ]; then
            python3 -c "import json,sys; json.load(open('repo-pulse/latest.json')); print('evidence ok')"
          fi

      - name: Upload machine-readable evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: repo-pulse-latest
          path: repo-pulse/latest.json
          retention-days: 14
          if-no-files-found: warn

      - name: Save cursor for the next run
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .pulse-state.json
          key: repo-pulse-cursor-${{ github.run_id }}
