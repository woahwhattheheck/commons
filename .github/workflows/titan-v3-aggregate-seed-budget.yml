name: titan-v3 aggregate seed budget

on:
  push:
    branches:
      - sol-granary/titan-v3-aggregate-seed-budget-20260909-01
    paths:
      - revenue/kaggriculture/cloud-execution-lab/candidates/v3-aggregate-seed-budget/**
      - .github/workflows/titan-v3-aggregate-seed-budget.yml
  pull_request:
    paths:
      - revenue/kaggriculture/cloud-execution-lab/candidates/v3-aggregate-seed-budget/**
      - .github/workflows/titan-v3-aggregate-seed-budget.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v3-aggregate-seed-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned official-engine dependency
        run: python -m pip install --disable-pip-version-check kaggle-environments==1.32.7

      - name: Compile and run focused contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3-aggregate-seed-budget
        run: |
          set -euo pipefail
          python -m py_compile \
            aggregate_seed_budget.py audit_routes.py candidate_runtime.py main.py \
            test_aggregate_seed_budget.py test_candidate_runtime.py \
            test_entrypoint_load.py test_official_engine.py
          python -m unittest -v \
            test_aggregate_seed_budget.py test_candidate_runtime.py \
            test_entrypoint_load.py test_official_engine.py

      - name: Decode exact route bank and require an applicable shape
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3-aggregate-seed-budget
        run: |
          set -uo pipefail
          set +e
          python audit_routes.py \
            --output route-audit.json \
            --require-tail-safe | tee route-audit.stdout.json
          audit_status=${PIPESTATUS[0]}
          set -e
          python - "$audit_status" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          status = int(sys.argv[1])
          report = json.loads(Path("route-audit.json").read_text(encoding="utf-8"))
          if report.get("schema") != "titan-v3-aggregate-seed-route-audit/v1":
              raise SystemExit("unexpected route-audit schema")
          if report.get("route_count") != 4:
              raise SystemExit(f"expected exact four-route bank, got {report.get('route_count')!r}")
          if report.get("duplicate_count") != len(report.get("duplicates", [])):
              raise SystemExit("duplicate count mismatch")
          if report.get("tail_safe_count") != len(report.get("tail_safe", [])):
              raise SystemExit("tail-safe count mismatch")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Exact route audit",
              "",
              f"- routes: {report['route_count']}",
              f"- duplicate same-crop active-prefix rows: {report['duplicate_count']}",
              f"- strict trailing opportunities: {report['tail_safe_count']}",
          ]
          if report["tail_safe_count"] == 0:
              lines += ["- disposition: **NO_SIGNAL / REJECT BEFORE GAMES**"]
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")

          if report["tail_safe_count"] == 0:
              if status != 3:
                  raise SystemExit(f"zero-opportunity audit returned unexpected status {status}")
              print("NO_SIGNAL: exact routes expose no strict trailing duplicate seed order", file=sys.stderr)
              raise SystemExit(3)
          if status != 0:
              raise SystemExit(f"route audit failed with status {status}")
          PY

      - name: Bind exact candidate source bytes
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3-aggregate-seed-budget
        run: |
          set -euo pipefail
          sha256sum \
            aggregate_seed_budget.py audit_routes.py candidate_runtime.py main.py \
            test_aggregate_seed_budget.py test_candidate_runtime.py \
            test_entrypoint_load.py test_official_engine.py README.md > SOURCE.sha256
          cat SOURCE.sha256

      - name: Upload exact route and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-aggregate-seed-route-audit
          path: |
            revenue/kaggriculture/cloud-execution-lab/candidates/v3-aggregate-seed-budget/route-audit.json
            revenue/kaggriculture/cloud-execution-lab/candidates/v3-aggregate-seed-budget/route-audit.stdout.json
            revenue/kaggriculture/cloud-execution-lab/candidates/v3-aggregate-seed-budget/SOURCE.sha256
          if-no-files-found: warn
          retention-days: 14
