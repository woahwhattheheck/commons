name: birch-joint-capacity-apply

on:
  push:
    branches:
      - codex/birch-joint-capacity-20260908
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birch-joint-capacity-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[joint-capacity-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reassemble exact tested payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .birch-joint-capacity/part00 \
            .birch-joint-capacity/p01_0 \
            .birch-joint-capacity/p01_1 \
            .birch-joint-capacity/p01_2 \
            .birch-joint-capacity/p01_3 \
            .birch-joint-capacity/p02_0 \
            .birch-joint-capacity/p02_1 \
            .birch-joint-capacity/p02_2 \
            .birch-joint-capacity/p02_3 \
            .birch-joint-capacity/p03_0 \
            .birch-joint-capacity/p03_1 \
            .birch-joint-capacity/p03_2 \
            .birch-joint-capacity/p03_3 > /tmp/birch-payload.b64
          test "$(wc -c < /tmp/birch-payload.b64)" -eq 13852
          base64 --decode /tmp/birch-payload.b64 > /tmp/birch-payload.tar.gz
          echo '438e0a73d54ff730c43c23a56157d89a4a6a9cd7bee9653458299e5209afda6b  /tmp/birch-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/birch-payload.tar.gz -C .
      - name: Verify exact source objects and execute focused suite
        shell: bash
        run: |
          set -euo pipefail
          source_a=revenue/kaggriculture/cloud-market-response/selected_action_history.py
          source_b=revenue/kaggriculture/cloud-execution-lab/reference/titan-history/selected_action_history.py
          test_file=revenue/kaggriculture/cloud-market-response/test_joint_sale_capacity.py
          guide=revenue/kaggriculture/cloud-market-response/JOINT-SALE-CAPACITY.md
          results=revenue/kaggriculture/cloud-market-response/JOINT-SALE-CAPACITY-RESULTS.json
          test "$(git hash-object "$source_a")" = 7967fb43c64bc3154fe7da609497873163c773eb
          test "$(git hash-object "$source_b")" = 7967fb43c64bc3154fe7da609497873163c773eb
          test "$(git hash-object "$test_file")" = 1c0dcafd3936dd675ce710a376453922465742ed
          test "$(git hash-object "$guide")" = 624ba4c18ea7bbfed3e9a9719bcd4aa380ebdc72
          test "$(git hash-object "$results")" = aa1872cb41e47f93a3ff013c3b4d62d338974b46
          python -B "$test_file"
          test "$(git hash-object revenue/kaggriculture/cloud-market-response/JOINT-SALE-CAPACITY-TEST.json)" = d50127fccf735c85271fc071727bf58ecd638335
      - name: Publish scoped source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .birch-joint-capacity
          rm -f .github/workflows/birch-joint-capacity-apply.yml
          git add -A \
            .birch-joint-capacity \
            .github/workflows/birch-joint-capacity-apply.yml \
            revenue/kaggriculture/cloud-market-response/selected_action_history.py \
            revenue/kaggriculture/cloud-market-response/test_joint_sale_capacity.py \
            revenue/kaggriculture/cloud-market-response/JOINT-SALE-CAPACITY.md \
            revenue/kaggriculture/cloud-market-response/JOINT-SALE-CAPACITY-RESULTS.json \
            revenue/kaggriculture/cloud-market-response/JOINT-SALE-CAPACITY-TEST.json \
            revenue/kaggriculture/cloud-execution-lab/reference/titan-history/selected_action_history.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[joint-capacity-applied] Tighten prior sale history with shared shed capacity'
          git push origin HEAD:${GITHUB_REF_NAME}
