name: sol-kestrel-titan-e07-boundary-bootstrap

on:
  push:
    branches:
      - "sol-kestrel/titan-e07-buy-product-boundary-20260909-01"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-kestrel-titan-e07-boundary
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply, verify, package, and publish exact repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/sol_kestrel_titan_e07_boundary.py
