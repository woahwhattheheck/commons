name: sol-kestrel-titan-e07-boundary-bootstrap

on:
  push:
    branches:
      - "sol-kestrel/titan-e07-buy-product-boundary-20260909-01"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-kestrel-titan-e07-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact hard-boundary repair and discriminating contracts
        shell: python
        env:
          LAB: revenue/kaggriculture/cloud-execution-lab
        run: |
          import os
          from pathlib import Path

          lab = Path(os.environ["LAB"])
          source = lab / "frozen_selected.py"
          tests = lab / "test_e07_same_turn_funding.py"

          old = "    for source in range(target+1,len(original)):\n"
          new = (
              "    source_limit=barrier if barrier is not None else len(original)\n"
              "    for source in range(target+1,source_limit):\n"
          )
          text = source.read_text(encoding="utf-8")
          if new in text:
              print("repair already present; no source rewrite")
          else:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one vulnerable source scan, found {text.count(old)}")
              source.write_text(text.replace(old, new, 1), encoding="utf-8")

          marker = "    def test_sell_after_buy_product_boundary_cannot_move_into_prefix(self):"
          test_text = tests.read_text(encoding="utf-8")
          if marker not in test_text:
              insertion = '''    def test_sell_after_buy_product_boundary_cannot_move_into_prefix(self):
        obs,base=fixture(shed={'MILK':1},money=0)
        base['market']=[[],['BUY_SEED','CARROT',1],
                        ['BUY_PRODUCT','WHEAT',1],['SELL','MILK',1]]
        original=deepcopy(base['market'])
        out,info=fund(obs,base,{'MILK'})
        self.assertEqual(out,original)
        self.assertEqual(info['reason'],'no-safe-prefix-sale')
        self.assertEqual(info['target_index'],1)
        self.assertEqual(sale_quantities(out),sale_quantities(original))
        self.assertEqual(base['market'],original)

    def test_sell_before_buy_product_boundary_can_still_fund_fixed_buy(self):
        obs,base=fixture(shed={'MILK':2},money=0)
        base['market']=[[],['BUY_SEED','CARROT',1],
                        ['SELL','MILK',2],['BUY_PRODUCT','WHEAT',1]]
        original=deepcopy(base['market'])
        out,info=fund(obs,base,{'MILK'})
        self.assertTrue(info['applied'])
        self.assertEqual((info['target_index'],info['source_index']),(1,2))
        self.assertEqual(out[0],['SELL','MILK',1])
        self.assertEqual(out[1],original[1])
        self.assertEqual(out[2],['SELL','MILK',1])
        self.assertEqual(out[3],original[3])
        self.assertEqual(sale_quantities(out),sale_quantities(original))
        self.assertEqual(base['market'],original)

'''
              sentinel = "\n\nclass CanonicalSameTurnFundingBinding(unittest.TestCase):"
              if test_text.count(sentinel) != 1:
                  raise SystemExit("canonical test insertion point changed")
              tests.write_text(test_text.replace(sentinel, "\n\n" + insertion + "class CanonicalSameTurnFundingBinding(unittest.TestCase):", 1), encoding="utf-8")

      - name: Run focused source contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONPATH: ${{ github.workspace }}/revenue/kaggriculture/cloud-runtime-pulse:${{ github.workspace }}/revenue/kaggriculture/cloud-quickstep:${{ github.workspace }}/revenue/kaggriculture/cloud-execution-lab
        run: |
          python3 -B -m py_compile frozen_selected.py test_e07_same_turn_funding.py
          python3 -B -m unittest -v \
            test_e07_hosted_source_path \
            test_e07_same_turn_funding \
            test_joint_market_slots \
            test_e10_floor_cycle

      - name: Rebuild and verify canonical current release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        env:
          PYTHONPATH: ${{ github.workspace }}/revenue/kaggriculture/cloud-runtime-pulse:${{ github.workspace }}/revenue/kaggriculture/cloud-quickstep:${{ github.workspace }}/revenue/kaggriculture/cloud-execution-lab
        run: |
          old_sha="$(python3 - <<'PY'
          import json
          print(json.load(open('runtime/integrated-selected/CURRENT-ARCHIVE.json'))['sha256'])
          PY
          )"
          printf '%s\n' "$old_sha" > "$RUNNER_TEMP/old-archive-sha"
          python3 -B build_integrated.py | tee "$RUNNER_TEMP/build.json"
          python3 -B build_integrated.py --check | tee "$RUNNER_TEMP/check.json"
          python3 -B -m unittest -v test_release_consistency test_build_publication

      - name: Record exact cloud receipt and validate write surface
        shell: python
        env:
          LAB: revenue/kaggriculture/cloud-execution-lab
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          lab = pathlib.Path(os.environ["LAB"])
          old_sha = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "old-archive-sha").read_text().strip()
          archive = lab / "exports/titan-current.tar.gz"
          source_manifest = lab / "runtime/integrated-selected/CURRENT-SOURCE.json"
          archive_receipt = lab / "runtime/integrated-selected/CURRENT-ARCHIVE.json"
          historical = lab / "exports/historical" / f"titan-{old_sha}.tar.gz"
          receipt_path = pathlib.Path("p/sol-kestrel-titan-e07-source-boundary-repair-20260909-01.md")
          receipt_path.parent.mkdir(parents=True, exist_ok=True)

          def digest(path):
              data = path.read_bytes()
              return {"path": str(path), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          receipt = json.loads(archive_receipt.read_text())
          body = f'''# SOL-KESTREL — TITAN E07 BUY_PRODUCT source-boundary repair

Operation: `TITAN-E07-BUY-PRODUCT-SOURCE-BOUNDARY-REPAIR-20260909-02`
Workflow run: `{os.environ['GITHUB_RUN_ID']}` attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`
Cloud checkout before publication: `{subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()}`

## Repair

`fund_same_turn_acquisition` now limits candidate SELL sources to the half-open interval after the failing fixed acquisition and before the first later `BUY_PRODUCT` hard boundary. A variable-price purchase therefore cannot be crossed while a safe pre-boundary SELL remains eligible.

## Discriminating contracts

- target index 1, `BUY_PRODUCT` barrier index 2, SELL source index 3: unchanged queue, `no-safe-prefix-sale`, exact sale quantities preserved;
- target index 1, SELL source index 2, `BUY_PRODUCT` barrier index 3: the safe sale still funds the fixed acquisition without moving either purchase.

## Verification actually run

- `py_compile` for source and focused test;
- `test_e07_hosted_source_path`;
- `test_e07_same_turn_funding`;
- `test_joint_market_slots`;
- `test_e10_floor_cycle`;
- deterministic `build_integrated.py` and `--check`;
- `test_release_consistency`;
- `test_build_publication`.

## Release identities

- previous current archive preserved as `exports/historical/titan-{old_sha}.tar.gz`;
- new current archive: `{receipt['sha256']}` / `{receipt['bytes']}` bytes / `{receipt['runtime_files']}` runtime files;
- current source manifest: `{receipt['source_manifest_sha256']}`.

No official games, Kaggle/provider action, submission, rank, or playing-strength claim was made. This is a fail-closed market-order correctness repair.
'''
          receipt_path.write_text(body, encoding="utf-8")

          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).splitlines())
          allowed = {
              str(lab / "frozen_selected.py"),
              str(lab / "test_e07_same_turn_funding.py"),
              str(archive),
              str(source_manifest),
              str(archive_receipt),
              str(historical),
              str(receipt_path),
          }
          unexpected = sorted(changed - allowed)
          missing = sorted({str(lab / "frozen_selected.py"), str(lab / "test_e07_same_turn_funding.py"), str(archive), str(source_manifest), str(archive_receipt), str(receipt_path)} - changed)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          if missing:
              raise SystemExit(f"expected changed paths missing: {missing}")
          if historical.exists() and hashlib.sha256(historical.read_bytes()).hexdigest() != old_sha:
              raise SystemExit("historical archive preservation hash mismatch")
          print(json.dumps({"changed_paths": sorted(changed), "new_archive": digest(archive), "historical": digest(historical)}, indent=2))

      - name: Commit exact repaired source, tests, and rebuilt release
        run: |
          old_sha="$(cat "$RUNNER_TEMP/old-archive-sha")"
          git config user.name "SOL-KESTREL"
          git config user.email "brycembusiness2@gmail.com"
          git add \
            revenue/kaggriculture/cloud-execution-lab/frozen_selected.py \
            revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            "revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-${old_sha}.tar.gz" \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json \
            p/sol-kestrel-titan-e07-source-boundary-repair-20260909-01.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair commit needed"
            exit 0
          fi
          git commit -m "fix(titan): stop E07 funding at BUY_PRODUCT boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
