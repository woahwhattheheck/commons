      - "sol-kestrel/titan-e07-buy-product-boundary-20260909-02"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-kestrel-titan-e07-boundary-sparse-u22
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            revenue/kaggriculture
            p
          persist-credentials: true
      - name: Apply, verify, package, and publish exact repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
