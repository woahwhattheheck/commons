name: titan-v4-floor-rebind-pr

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/performance/funding-replay/**'
      - '.github/workflows/titan-v4-floor-rebind-pr.yml'

permissions:
  contents: read

jobs:
  exact-current-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/performance/funding-replay/
            /revenue/kaggriculture/cloud-execution-lab/selected_sell_core.py
            /revenue/kaggriculture/cloud-execution-lab/frozen_selected.py
            /revenue/kaggriculture/cloud-execution-lab/exec_pace_runtime.py
      - name: Bind exact event tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --short
      - name: Current-ABI economic-floor contracts
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/performance/funding-replay/test_forced_feasibility_floor.py -v
      - name: Optimized-mode contracts
        run: |
          set -euo pipefail
          python3 -O -B revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/performance/funding-replay/test_forced_feasibility_floor.py -v
