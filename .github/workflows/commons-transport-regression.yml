name: Commons transport regression
on:
  push:
    branches: [main, codex/deathstar-bounty-fixes-20260906, 'codex/command-center-*']
    paths:
      - integrations/shared_equipment/**
      - integrations/gemini_slack/**
      - integrations/claude_headless/**
      - host/toolbench.py
      - toolbench/**
      - test_commons_transport_outcomes.py
      - test_claude_client_transport_outcomes.py
      - test_toolbench_snapshot_consistency.py
      - test_gemini_peer_tool_gateway.py
      - test_gemini_tool_result_boundary.py
      - test_toolbench.py
      - test_client.py
      - test_claude_headless.py
      - test_commons_transport_workflow.py
      - .github/workflows/commons-transport-regression.yml
  pull_request:
    paths:
      - integrations/shared_equipment/**
      - integrations/gemini_slack/**
      - integrations/claude_headless/**
      - host/toolbench.py
      - toolbench/**
      - test_commons_transport_outcomes.py
      - test_claude_client_transport_outcomes.py
      - test_toolbench_snapshot_consistency.py
      - test_gemini_peer_tool_gateway.py
      - test_gemini_tool_result_boundary.py
      - test_toolbench.py
      - test_client.py
      - test_claude_headless.py
      - test_commons_transport_workflow.py
      - .github/workflows/commons-transport-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bundle:
    name: Prepare exact transport regression sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            integrations
            host
            toolbench
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Check transport workflow trigger coverage
        run: python -m unittest -v test_commons_transport_workflow
      - name: Archive the selected committed test sources
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          expected = os.environ["GITHUB_SHA"]
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit("source commit differs from the workflow commit")
          entries = subprocess.check_output(
              ["git", "ls-tree", "-z", actual]).split(b"\0")
          roots = []
          for entry in entries:
              if not entry:
                  continue
              metadata, name = entry.split(b"\t", 1)
              mode, kind, _ = metadata.decode().split()
              if kind == "blob":
                  if mode not in ("100644", "100755"):
                      raise SystemExit("root source is not a regular file")
                  roots.append(name.decode("utf-8"))
          paths = roots + ["integrations", "host", "toolbench"]
          output = Path(os.environ["RUNNER_TEMP"]) / "commons-transport-source"
          output.mkdir(parents=True, exist_ok=True)
          archive_path = output / "sources.tar"
          subprocess.run(
              ["git", "archive", "--format=tar", "--output=" + str(archive_path),
               actual, "--", *paths], check=True)
          with tarfile.open(archive_path, "r:") as archive:
              members = archive.getmembers()
              if not all(member.isfile() or member.isdir() for member in members):
                  raise SystemExit("source archive includes a non-regular member")
              if "toolbench/example.json" not in {member.name for member in members}:
                  raise SystemExit("toolbench example fixture is absent")
          data = archive_path.read_bytes()
          manifest = {
              "source_commit": actual,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "archive_sha256": hashlib.sha256(data).hexdigest(),
              "archive_size": len(data),
              "paths": paths,
          }
          (output / "source-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "source_commit": actual, "archive_sha256": manifest["archive_sha256"],
              "archive_size": len(data), "members": len(members)}))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commons-transport-source-${{ github.run_id }}
          path: ${{ runner.temp }}/commons-transport-source/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  regression:
    name: Transport and checkpoint / ${{ matrix.os }}
    needs: source-bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: commons-transport-source-${{ github.run_id }}
          path: ${{ runner.temp }}/commons-transport-source
      - name: Verify and extract the exact regression sources
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile

          bundle = Path(os.environ["RUNNER_TEMP"]) / "commons-transport-source"
          manifest = json.loads(
              (bundle / "source-manifest.json").read_text(encoding="utf-8"))
          if manifest["source_commit"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("source bundle has a different workflow commit")
          if manifest["workflow_run_id"] != os.environ["GITHUB_RUN_ID"]:
              raise SystemExit("source bundle has a different workflow run")
          archive_path = bundle / "sources.tar"
          data = archive_path.read_bytes()
          if (len(data) != manifest["archive_size"] or
                  hashlib.sha256(data).hexdigest() != manifest["archive_sha256"]):
              raise SystemExit("source archive differs from its manifest")
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          workspace.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, "r:") as archive:
              for member in archive.getmembers():
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit("source archive includes a non-regular member")
                  target = (workspace / member.name).resolve()
                  if not target.is_relative_to(workspace):
                      raise SystemExit("source archive member leaves the workspace")
              archive.extractall(workspace, filter="data")
          if not (workspace / "toolbench/example.json").is_file():
              raise SystemExit("toolbench example fixture was not extracted")
          print(json.dumps({
              "source_commit": manifest["source_commit"],
              "archive_sha256": manifest["archive_sha256"]}))
      - name: Install existing sealed-transfer test dependency
        run: python -m pip install --no-cache-dir -r integrations/shared_equipment/requirements-credential-transfer.txt
      - name: Run port and existing native regressions
        run: >-
          python -W error -m unittest -v
          test_commons_transport_outcomes
          test_claude_client_transport_outcomes
          test_toolbench_snapshot_consistency
          test_gemini_peer_tool_gateway
          test_gemini_tool_result_boundary
          test_toolbench
          test_client
          test_claude_headless
          integrations.shared_equipment.test_equipment
