name: titan-v31-r04-fast-clone-production-port

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/r04_fast_clone/production.patch"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/r04_fast_clone/validate_production_patch.py"
      - ".github/workflows/titan-v31-r04-fast-clone-production-port.yml"

permissions:
  contents: read

concurrency:
  group: titan-v31-r04-fast-clone-production-port-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  production-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply and prove frozen-base R04 fast clone
        env:
          TITAN_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/r04_fast_clone/validate_production_patch.py
