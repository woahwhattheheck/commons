name: juniper-caller-handler-canonical-adopt

on:
  push:
    branches:
      - codex/juniper-caller-handler-canonical-20260908

permissions:
  contents: write

concurrency:
  group: juniper-caller-handler-canonical-adopt
  cancel-in-progress: false

jobs:
  adopt:
    if: ${{ !contains(github.event.head_commit.message, '[caller-handler-canonical-adopted]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Compose owning main-thread handoff with current worker guard
        shell: bash
        run: |
          set -euo pipefail
          owner=revenue/kaggriculture/cloud-economic-stress/deadline_adapter.py
          lab=revenue/kaggriculture/cloud-execution-lab
          target=$lab/reference/titan-current/deadline_adapter.py

          test "$(git hash-object "$owner")" = f918325f36493bf4cfc46c274f57128fc7b0fc82
          test "$(git hash-object "$target")" = c605905a7962c3a4611bae101b50eb7fa3480691
          test "$(sha256sum "$lab/exports/titan-current.tar.gz" | awk '{print $1}')" = 501695d66c2642d452180b2f129d181ba0ede02647b70ddd74ebd82e3762011c
          test "$(wc -c < "$lab/exports/titan-current.tar.gz")" = 290630

          python3 - <<'PY'
          from pathlib import Path

          path = Path('revenue/kaggriculture/cloud-execution-lab/reference/titan-current/deadline_adapter.py')
          text = path.read_text()
          before = '''        caller_token = _ACTIVE_TIMER.set(self.caller_timer)
          try:
              if callable(self.previous):
          '''
          after = '''        caller_token = _ACTIVE_TIMER.set(self.caller_timer)
          try:
              # Let the caller observe and replace its own binding. Keep our
              # dispatcher installed again while the guarded work resumes.
              signal.signal(signal.SIGALRM, self.previous)
              if callable(self.previous):
          '''
          assert text.count(before) == 1
          text = text.replace(before, after)
          before = '''            now = time.monotonic()
              remaining, self.outer_interval = signal.setitimer(signal.ITIMER_REAL, 0)
              self.outer_at = now + remaining if remaining > 0 else None

          def _dispatch(self, signum, frame):
          '''
          after = '''            now = time.monotonic()
              remaining, self.outer_interval = signal.setitimer(signal.ITIMER_REAL, 0)
              self.outer_at = now + remaining if remaining > 0 else None
              self.previous = signal.getsignal(signal.SIGALRM)
              signal.signal(signal.SIGALRM, self._dispatch)

          def _dispatch(self, signum, frame):
          '''
          assert text.count(before) == 1
          path.write_text(text.replace(before, after))
          PY

          test "$(sha256sum "$target" | awk '{print $1}')" = 6e677016ac93350a5eb0b6f3345fb94726e78d5416d20bb81e7e5bc8ffdc8da2
          python3 -m py_compile "$target"

      - name: Exercise caller handoff and retain worker-thread behavior
        shell: bash
        run: |
          set -euo pipefail
          stress=revenue/kaggriculture/cloud-economic-stress
          lab=revenue/kaggriculture/cloud-execution-lab
          python3 -B "$stress/test_caller_handler.py" \
            --adapter "$lab/reference/titan-current/deadline_adapter.py" \
            --report /tmp/caller-handler-results.json
          (
            cd "$lab"
            python3 -B -m unittest -v \
              test_worker_deadline \
              test_entrypoint_clock \
              test_module_recovery \
              test_route_recovery \
              test_history_archive \
              test_terminal_history_join \
              test_release_consistency
          )

      - name: Rebuild and verify the one CURRENT package
        shell: bash
        run: |
          set -euo pipefail
          lab=revenue/kaggriculture/cloud-execution-lab
          old_sha=$(sha256sum "$lab/exports/titan-current.tar.gz" | awk '{print $1}')
          old_bytes=$(wc -c < "$lab/exports/titan-current.tar.gz")
          printf '%s\n' "$old_sha" > /tmp/old-sha
          printf '%s\n' "$old_bytes" > /tmp/old-bytes

          python3 -B "$lab/build_integrated.py" > /tmp/build-receipt.json
          python3 -B "$lab/build_integrated.py" --check > /tmp/check-receipt.json
          cmp /tmp/build-receipt.json /tmp/check-receipt.json

          test "$(sha256sum "$lab/exports/titan-current.tar.gz" | awk '{print $1}')" = f623c088765301872123697db250b10651d3027cb347b5a05ceb7b7eb270f279
          test "$(wc -c < "$lab/exports/titan-current.tar.gz")" = 290697
          test "$(sha256sum "$lab/runtime/integrated-selected/CURRENT-SOURCE.json" | awk '{print $1}')" = c2b4294c6014514e93f3d92ecd17b8e6a01b3533df6cb81e0b47d67fc74d6197

      - name: Verify archive members and write source-bound receipt
        shell: python
        run: |
          import hashlib, json, tarfile
          from pathlib import Path

          root = Path('revenue/kaggriculture/cloud-execution-lab')
          source = root / 'reference/titan-current/deadline_adapter.py'
          archive = root / 'exports/titan-current.tar.gz'
          pointer_path = root / 'runtime/integrated-selected/CURRENT-ARCHIVE.json'
          manifest_path = root / 'runtime/integrated-selected/CURRENT-SOURCE.json'
          current = json.loads(pointer_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          old_sha = Path('/tmp/old-sha').read_text().strip()
          old_bytes = int(Path('/tmp/old-bytes').read_text())
          data = archive.read_bytes()
          source_data = source.read_bytes()

          assert current['sha256'] == hashlib.sha256(data).hexdigest()
          assert current['bytes'] == len(data)
          assert current['runtime_files'] == 78
          assert current['source_manifest_sha256'] == hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          row = manifest['runtime']['reference/titan-current/deadline_adapter.py']
          assert row['sha256'] == hashlib.sha256(source_data).hexdigest()
          assert row['bytes'] == len(source_data)
          with tarfile.open(archive, 'r:gz') as tf:
              assert tf.extractfile('reference/titan-current/deadline_adapter.py').read() == source_data
              packaged_manifest = tf.extractfile('SOURCE.json').read()
          assert hashlib.sha256(packaged_manifest).hexdigest() == current['source_manifest_sha256']

          historical = root / 'exports/historical' / f'titan-{old_sha}.tar.gz'
          assert historical.exists()
          old = historical.read_bytes()
          assert len(old) == old_bytes
          assert hashlib.sha256(old).hexdigest() == old_sha

          caller = json.loads(Path('/tmp/caller-handler-results.json').read_text())
          assert not caller['failures'] and not caller['errors']
          note = Path('p/juniper-caller-handler-canonical-adoption-20260908-01.md')
          note.write_text(f'''# TITAN caller-handler canonical adoption

## Change

The owning main-thread caller-handler rebinding repair was composed into the current worker-thread-capable deadline guard. Worker tracing, cancellation identity, fallback policy, budgets, configuration and default policy are unchanged.

- owning source blob: `f918325f36493bf4cfc46c274f57128fc7b0fc82`
- previous canonical reference blob: `c605905a7962c3a4611bae101b50eb7fa3480691`
- composed reference SHA-256: `{hashlib.sha256(source_data).hexdigest()}`
- previous archive SHA-256: `{old_sha}` ({old_bytes} bytes)
- current archive SHA-256: `{current['sha256']}` ({current['bytes']} bytes)
- current source-manifest SHA-256: `{current['source_manifest_sha256']}`

The caller receives its own handler disposition during delivery, and any replacement is recaptured before the guard dispatcher resumes. The worker-thread trace path remains in the same source and does not access signal handlers.

## Executed validation

- caller-handler suite: {caller['tests_run']} methods, zero failures/errors
- existing worker-deadline, entry-clock, module-recovery, route-recovery, history and release-consistency suites
- deterministic builder and `--check` byte agreement
- packaged source/member/manifest identity
- superseded archive retained under its digest

This is source/package publication only. It adds no policy, game, seed, strength attribution, provider upload or submission.
''', encoding='utf-8')

      - name: Publish generated package and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/juniper-caller-handler-canonical-adopt.yml
          git add -A \
            .github/workflows/juniper-caller-handler-canonical-adopt.yml \
            revenue/kaggriculture/cloud-execution-lab/reference/titan-current/deadline_adapter.py \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/exports/historical \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json \
            p/juniper-caller-handler-canonical-adoption-20260908-01.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[caller-handler-canonical-adopted] Compose deadline source and refresh CURRENT TITAN'
          git push origin HEAD:${GITHUB_REF_NAME}
