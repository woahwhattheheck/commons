name: astra-v4-runtime-shape-probe

on:
  push:
    branches:
      - astra/v4-runtime-shape-probe-20260911
    paths:
      - '.github/workflows/astra-v4-runtime-shape-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-v4-runtime-shape-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revenue/kaggriculture/cloud-execution-lab/candidates/v3/
            /revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz
      - name: Recover manifest-pinned canonical archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          lab = pathlib.Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3')
          archive = pathlib.Path('revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz')
          pin = json.loads((lab/'V3-MANIFEST.json').read_text())['base']['sha256']
          historical = f'revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-{pin}.tar.gz'
          def digest(data): return hashlib.sha256(data).hexdigest()
          def cat(ref, path):
              p = subprocess.run(['git','cat-file','-e',f'{ref}:{path}'], capture_output=True)
              if p.returncode: return None
              return subprocess.check_output(['git','cat-file','blob',f'{ref}:{path}'])
          data = archive.read_bytes() if archive.exists() else None
          if data is None or digest(data) != pin:
              subprocess.run(['git','fetch','--no-tags','--filter=blob:none','origin','main'], check=True)
              main = subprocess.check_output(['git','rev-parse','FETCH_HEAD'], text=True).strip()
              candidates = [cat(main, historical), cat(main, str(archive))]
              data = next((x for x in candidates if x is not None and digest(x) == pin), None)
          if data is None:
              raise SystemExit(f'could not recover pinned canonical archive {pin}')
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_bytes(data)
          print('PINNED_ARCHIVE', digest(data), len(data))
          PY
      - name: Materialize and print exact runtime AST facts
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          OUT="$RUNNER_TEMP/titan-v3-tree"
          python3 "$LAB/build_v3.py" --tree "$OUT"
          python3 - "$OUT/titan_runtime.py" "$OUT/r04_full_router.py" <<'PY'
          import ast, pathlib, sys

          runtime_path = pathlib.Path(sys.argv[1])
          router_path = pathlib.Path(sys.argv[2])
          runtime_text = runtime_path.read_text(encoding='utf-8')
          router_text = router_path.read_text(encoding='utf-8')
          rt = ast.parse(runtime_text, filename=str(runtime_path))
          rr = ast.parse(router_text, filename=str(router_path))

          def decs(node):
              return [ast.dump(d, include_attributes=False) for d in node.decorator_list]

          agent = next(n for n in rt.body if isinstance(n, ast.ClassDef) and n.name == 'TitanAgent')
          methods = {n.name:n for n in agent.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          target = methods['_seller_state']
          print('SELLER_STATE_DECORATORS', decs(target))
          print('SELLER_STATE_SIGNATURE', ast.unparse(target.args))
          lines = runtime_text.splitlines()
          lo = max(0, target.lineno - 4)
          hi = min(len(lines), target.lineno + 7)
          for i in range(lo, hi):
              print(f'SELLER_STATE_SOURCE {i+1}: {lines[i]}')

          # Conservative reachable self.method closure from act, for decorator inventory
          seen=set(); stack=['act']
          install_calls=[]
          while stack:
              name=stack.pop()
              if name in seen or name not in methods: continue
              seen.add(name)
              fn=methods[name]
              for n in ast.walk(fn):
                  if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and isinstance(n.func.value, ast.Name) and n.func.value.id=='self' and n.func.attr in methods:
                      stack.append(n.func.attr)
                  if isinstance(n, ast.ImportFrom) and n.module=='r04_full_router':
                      pass
                  if isinstance(n, ast.Call):
                      for kw in n.keywords:
                          if kw.arg and kw.arg in {'place_delivery','gpr_reserve','b10_grain_reserve','dead_sell_slot','s4_route12_seed_reserve'}:
                              install_calls.append((name, getattr(n,'lineno',-1), ast.unparse(n)))
          print('REACHABLE_AGENT_METHODS', sorted(seen))
          for name in sorted(seen):
              if methods[name].decorator_list:
                  print('REACHABLE_DECORATED', name, decs(methods[name]))
          for row in install_calls:
              print('R04_RUNTIME_CALL', row)

          features = next(n for n in rt.body if isinstance(n, ast.ClassDef) and n.name == 'Features')
          print('FEATURES_CLASS_DECORATORS', decs(features))
          for n in features.body:
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.decorator_list:
                  print('FEATURES_DECORATED_METHOD', n.name, decs(n))

          # Any module-level attribute writes to protected class objects.
          for n in rt.body:
              if isinstance(n, (ast.Assign, ast.AnnAssign, ast.AugAssign, ast.Delete)):
                  text = ast.unparse(n)
                  if 'TitanAgent.' in text or 'Features.' in text:
                      print('PROTECTED_POST_CLASS_WRITE', getattr(n,'lineno',-1), text)

          install = next(n for n in rr.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name=='install')
          print('INSTALL_DECORATORS', decs(install))
          print('INSTALL_SIGNATURE', ast.unparse(install.args))
          for n in ast.walk(install):
              if isinstance(n, ast.Return):
                  print('INSTALL_RETURN', getattr(n,'lineno',-1), ast.unparse(n.value) if n.value else 'None')
          for n in rr.body:
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name in {'v3_agent','_v3_core','_v3_stack'}:
                  print('ROUTER_ROOT_DEF', n.name, decs(n), ast.unparse(n.args))
          PY
