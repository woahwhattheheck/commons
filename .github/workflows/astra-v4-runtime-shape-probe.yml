name: astra-v4-runtime-shape-probe

on:
  push:
    branches:
      - astra/v4-runtime-shape-probe-20260911
    paths:
      - '.github/workflows/astra-v4-runtime-shape-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-v4-runtime-shape-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revenue/kaggriculture/cloud-execution-lab/candidates/v3/
            /revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz
      - name: Recover manifest-pinned canonical archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          lab = pathlib.Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3')
          archive = pathlib.Path('revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz')
          pin = json.loads((lab/'V3-MANIFEST.json').read_text())['base']['sha256']
          historical = f'revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-{pin}.tar.gz'
          def digest(data): return hashlib.sha256(data).hexdigest()
          def cat(ref, path):
              p = subprocess.run(['git','cat-file','-e',f'{ref}:{path}'], capture_output=True)
              if p.returncode: return None
              return subprocess.check_output(['git','cat-file','blob',f'{ref}:{path}'])
          data = archive.read_bytes() if archive.exists() else None
          if data is None or digest(data) != pin:
              subprocess.run(['git','fetch','--no-tags','--filter=blob:none','origin','main'], check=True)
              main = subprocess.check_output(['git','rev-parse','FETCH_HEAD'], text=True).strip()
              candidates = [cat(main, historical), cat(main, str(archive))]
              data = next((x for x in candidates if x is not None and digest(x) == pin), None)
          if data is None:
              raise SystemExit(f'could not recover pinned canonical archive {pin}')
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_bytes(data)
          print('PINNED_ARCHIVE', digest(data), len(data))
          PY
      - name: Materialize and print exact decorator AST
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          OUT="$RUNNER_TEMP/titan-v3-tree"
          python3 "$LAB/build_v3.py" --tree "$OUT"
          python3 - "$OUT/titan_runtime.py" <<'PY'
          import ast, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))
          agent = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'TitanAgent')
          target = next(n for n in agent.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == '_seller_state')
          print('SELLER_STATE_DECORATORS', ast.dump(target.decorator_list, include_attributes=False))
          print('SELLER_STATE_SIGNATURE', ast.unparse(target.args))
          lines = text.splitlines()
          lo = max(0, target.lineno - 4)
          hi = min(len(lines), target.lineno + 6)
          for i in range(lo, hi):
              print(f'SELLER_STATE_SOURCE {i+1}: {lines[i]}')
          names = sorted({d.id for d in target.decorator_list if isinstance(d, ast.Name)})
          module_bound = set()
          class_bound = set()
          def bind_target(t):
              if isinstance(t, ast.Name): return {t.id}
              if isinstance(t, (ast.Tuple, ast.List)):
                  out=set()
                  for e in t.elts: out |= bind_target(e)
                  return out
              return set()
          for n in tree.body:
              if isinstance(n, ast.Assign):
                  for t in n.targets: module_bound |= bind_target(t)
              elif isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  module_bound.add(n.name)
              elif isinstance(n, (ast.Import, ast.ImportFrom)):
                  for a in n.names: module_bound.add(a.asname or a.name.split('.',1)[0])
          for n in agent.body:
              if isinstance(n, ast.Assign):
                  for t in n.targets: class_bound |= bind_target(t)
              elif isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  class_bound.add(n.name)
              elif isinstance(n, (ast.Import, ast.ImportFrom)):
                  for a in n.names: class_bound.add(a.asname or a.name.split('.',1)[0])
          print('DECORATOR_NAMES', names)
          print('DECORATOR_MODULE_BOUND', sorted(set(names) & module_bound))
          print('DECORATOR_CLASS_BOUND', sorted(set(names) & class_bound))
          PY
