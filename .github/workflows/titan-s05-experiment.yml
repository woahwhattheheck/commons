name: TITAN S05 exact event-macro screen
on:
  pull_request:
    paths:
      - '.github/workflows/titan-s05-experiment.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/s05-experiment-20260909/**'
permissions:
  contents: read
jobs:
  s05-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact evaluator dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'
      - name: Materialize pinned current runtime
        shell: bash
        run: |
          set -euo pipefail
          DISPATCH=741d76f345921ded3cd436dab02fe5b8555f2d25
          ROOT=revenue/kaggriculture/cloud-execution-lab
          git worktree add --detach /tmp/s05-dispatch "$DISPATCH"
          cd /tmp/s05-dispatch/$ROOT
          python build_integrated.py --check
          test "$(sha256sum exports/titan-current.tar.gz | awk '{print $1}')" = '0215384841e2eec7f919f82ea900f343f1dc75665747a45e8df8f6b33316c1e5'
          rm -rf /tmp/s05-runtime && mkdir /tmp/s05-runtime
          tar -xzf exports/titan-current.tar.gz -C /tmp/s05-runtime
          test "$(sha256sum /tmp/s05-runtime/SOURCE.json | awk '{print $1}')" = '374ebfbed35ee9102fe75db855de03e848a3dbca487f13d66bca29248c71bb54'
      - name: Stage S05 experiment into pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-execution-lab/s05-experiment-20260909"
          cp "$SRC/s05_event_macros.py" /tmp/s05-runtime/
          cp "$SRC/s05_agent_shadow.py" /tmp/s05-runtime/
          cp "$SRC/s05_agent_prior.py" /tmp/s05-runtime/
          cp "$SRC/test_s05_event_macros.py" /tmp/s05-runtime/
          cp "$SRC/test_s05_engine_precision.py" /tmp/s05-runtime/
          cp "$SRC/run_s05_full.py" /tmp/s05-runtime/
          cp "$SRC/summarize_s05.py" /tmp/s05-runtime/
      - name: Exact predicate and counterexample contracts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/s05-runtime
          S05_RUNTIME_ROOT=/tmp/s05-runtime PYTHONPATH=. python test_s05_event_macros.py -v
          S05_RUNTIME_ROOT=/tmp/s05-runtime PYTHONPATH=. python test_s05_engine_precision.py -v
      - name: Fresh exact-agent S panel
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/s05-runtime
          S05_RUNTIME_ROOT=/tmp/s05-runtime S05_DISPATCH_MAIN=741d76f345921ded3cd436dab02fe5b8555f2d25 S05_SEEDS=16 S05_WORKERS=2 S05_RESULT_PATH="$RUNNER_TEMP/S05-S-SCREEN.json" PYTHONPATH=. python run_s05_full.py
          S05_RUNTIME_ROOT=/tmp/s05-runtime S05_RESULT_PATH="$RUNNER_TEMP/S05-S-SCREEN.json" S05_SUMMARY_PATH="$RUNNER_TEMP/S05-SUMMARY.json" S05_ARCHIVE_SHA=0215384841e2eec7f919f82ea900f343f1dc75665747a45e8df8f6b33316c1e5 PYTHONPATH=. python summarize_s05.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-s05-exact-screen
          path: |
            ${{ runner.temp }}/S05-S-SCREEN.json
            ${{ runner.temp }}/S05-SUMMARY.json
            /tmp/s05-dispatch/revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz
            /tmp/s05-runtime/SOURCE.json
          if-no-files-found: warn
          retention-days: 30
