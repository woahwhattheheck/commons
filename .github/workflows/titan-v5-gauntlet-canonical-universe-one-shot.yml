name: titan-v5-gauntlet-canonical-universe-one-shot

on:
  push:
    branches:
      - astra/v5-v31-v4-gauntlet-reducer-20260912
    paths:
      - ".github/workflows/titan-v5-gauntlet-canonical-universe-one-shot.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/apply_canonical_universe_v4.py"

permissions:
  contents: write

concurrency:
  group: titan-v5-gauntlet-canonical-universe-one-shot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 256

      - name: Assert exact staging head and capture fresh main
        env:
          BRANCH: astra/v5-v31-v4-gauntlet-reducer-20260912
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git fetch --no-tags --depth=256 origin main "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "${{ github.sha }}"
          git merge-base origin/main HEAD >/dev/null
          echo "MERGED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply canonical-universe + multi-index closure
        env:
          FROZEN_MANIFEST: ${{ runner.temp }}/titan-v5-gauntlet-manifest-510ca5c5.json
        run: |
          set -euo pipefail
          manifest_rel="revenue/kaggriculture/cloud-execution-lab/candidates/v5/gauntlet-top30-union/manifest.json"
          git show "${{ github.sha }}:${manifest_rel}" > "$FROZEN_MANIFEST"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          frozen = Path(os.environ["FROZEN_MANIFEST"])
          expected = "510ca5c5438fb65d29755f2009f07bb85bbf3e8963054b88c4abe3ec3737924e"
          if len(expected) != 64:
              raise SystemExit("historical canonical manifest SHA pin must be 64 hex characters")
          actual = hashlib.sha256(frozen.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"historical canonical manifest mismatch: {actual} != {expected}")
          print(f"historical canonical manifest: {actual}")
          PY
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/apply_canonical_universe_v4.py")
          text = path.read_text()
          expected = "510ca5c5438fb65d29755f2009f07bb85bbf3e8963054b88c4abe3ec3737924e"
          if text.count(expected) != 2:
              raise SystemExit("canonical manifest SHA authority anchors drifted")
          old_manifest = 'CANONICAL_MANIFEST = ROOT / "revenue/kaggriculture/cloud-execution-lab/candidates/v5/gauntlet-top30-union/manifest.json"'
          frozen = str(Path(os.environ["FROZEN_MANIFEST"]))
          new_manifest = f"CANONICAL_MANIFEST = Path({frozen!r})"
          if text.count(old_manifest) != 1:
              raise SystemExit("patcher manifest authority anchor drifted")
          text = text.replace(old_manifest, new_manifest, 1)
          old_scope = 'run("git", "diff", "--name-only", BASE)'
          new_scope = 'run("git", "diff", "--name-only", "origin/main...HEAD")'
          if text.count(old_scope) != 1:
              raise SystemExit("one-shot scope-fence anchor drifted")
          path.write_text(text.replace(old_scope, new_scope, 1))
          PY
          python revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/apply_canonical_universe_v4.py
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path("revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge")
          frozen_name = "canonical-manifest-510ca5c5438fb65d.json"
          snapshot = root / frozen_name
          snapshot.write_bytes(Path(os.environ["FROZEN_MANIFEST"]).read_bytes())

          reducer = root / "reduce_gauntlet.py"
          text = reducer.read_text()
          old = 'CANONICAL_MANIFEST_PATH = CANONICAL_PACKAGE / "manifest.json"'
          new = f'CANONICAL_MANIFEST_PATH = Path(__file__).resolve().parent / "{frozen_name}"'
          if text.count(old) != 1:
              raise SystemExit("reducer live-manifest authority anchor drifted")
          text = text.replace(old, new, 1)
          old_authority = '    manifest_path = (root / "manifest.json").resolve(strict=True)\n    if not manifest_path.is_relative_to(root):\n        raise ReductionError("canonical manifest escaped corpus root")\n'
          new_authority = '    manifest_path = CANONICAL_MANIFEST_PATH.resolve(strict=True)\n'
          if text.count(old_authority) != 1:
              raise SystemExit("canonical materialization live-manifest anchor drifted")
          reducer.write_text(text.replace(old_authority, new_authority, 1))

          test = root / "test_reduce_gauntlet.py"
          text = test.read_text()
          old = '["B", "A"]'
          new = '["recorded-submission:2", "recorded-submission:1"]'
          if text.count(old) != 1:
              raise SystemExit("synthetic family expectation anchor drifted")
          test.write_text(text.replace(old, new, 1))

          readme = root / "README.md"
          text = readme.read_text()
          note = (
              "\n### Frozen corpus authority\n\n"
              "The reducer binds the historical shard panel to immutable `canonical-manifest-510ca5c5438fb65d.json` "
              "(SHA256 `510ca5c5438fb65d29755f2009f07bb85bbf3e8963054b88c4abe3ec3737924e`). "
              "The live `gauntlet-top30-union/manifest.json` is leaderboard-derived and may advance independently. "
              "`--corpus` supplies the pinned materializer plus replay bytes; it cannot redefine the 41-submission / 123-fixture universe.\n"
          )
          if "### Frozen corpus authority" in text:
              raise SystemExit("frozen corpus authority note already present unexpectedly")
          readme.write_text(text.rstrip() + "\n" + note)
          PY

      - name: Run reducer contracts normal and optimized
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m py_compile reduce_gauntlet.py test_reduce_gauntlet.py
          python -B -m unittest -v test_reduce_gauntlet
          python -O -B -m unittest -v test_reduce_gauntlet
          python - <<'PY'
          import hashlib
          import reduce_gauntlet as rg
          raw = rg._read_regular_bytes(rg.CANONICAL_MANIFEST_PATH)
          assert hashlib.sha256(raw).hexdigest() == rg.CANONICAL_MANIFEST_SHA256
          assert callable(rg._captured_materializer())
          rows, by_id, authority = rg._canonical_materialization(rg.CANONICAL_PACKAGE)
          assert len(rows) == 123 and len(by_id) == 123
          assert authority["source_manifest_sha256"] == rg.CANONICAL_MANIFEST_SHA256
          print("canonical source pins + 123-fixture frozen materialization: PASS")
          print("canonical materialization:", authority["materialization_manifest_sha256"])
          PY
          find .. -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Diff and cleanliness gates
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain | grep -E '__pycache__|\.pyc$' || true)"
          changed="$(git diff --name-only origin/main...HEAD; git diff --name-only; git ls-files --others --exclude-standard)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | sort -u | grep -Ev '^(\.github/workflows/titan-v5-(v31-v4-gauntlet-reducer|gauntlet-canonical-universe-one-shot)\.yml|revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/(README\.md|reduce_gauntlet\.py|test_reduce_gauntlet\.py|apply_canonical_universe_v4\.py|canonical-manifest-510ca5c5438fb65d\.json))$' || true)"
          test -z "$unexpected"

      - name: Publish one permanent same-branch successor
        env:
          BRANCH: astra/v5-v31-v4-gauntlet-reducer-20260912
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=256 origin main "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "${{ github.sha }}"
          test "$(git rev-parse origin/main)" = "$MERGED_MAIN"
          git rm .github/workflows/titan-v5-gauntlet-canonical-universe-one-shot.yml
          git rm revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/apply_canonical_universe_v4.py
          git add \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/README.md \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/reduce_gauntlet.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/test_reduce_gauntlet.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/canonical-manifest-510ca5c5438fb65d.json
          git diff --cached --check
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          unexpected="$(printf '%s\n' "$staged" | grep -Ev '^(\.github/workflows/titan-v5-gauntlet-canonical-universe-one-shot\.yml|revenue/kaggriculture/cloud-execution-lab/candidates/v5/archive-version-bridge/(README\.md|reduce_gauntlet\.py|test_reduce_gauntlet\.py|apply_canonical_universe_v4\.py|canonical-manifest-510ca5c5438fb65d\.json))$' || true)"
          test -z "$unexpected"
          git commit -m "fix(v5): freeze gauntlet evidence universe across shard indexes"
          git push origin HEAD:"$BRANCH"
