name: capability-entrypoints

on:
  push:
    branches:
      - main
    paths: &entrypoint_paths
      - '.github/workflows/capability-entrypoints.yml'
      - 'test_capability_entrypoints.py'
      - 'test_chargeable_checkout_eof.py'
      - 'p/grok-build-chargeable-checkout-20260828-01.md'
      - 'index.html'
      - 'resources.html'
      - 'commerce.html'
      - 'revenue/outcome_commerce/manifest.json'
      - 'revenue/outcome_commerce/catalog.json'
      - 'orchestration.html'
      - 'orchestration/jeffersonville/frameworks.json'
      - 'orchestration/jeffersonville/topology.json'
      - 'coordination/connector_preflight/**'
  pull_request:
    paths: *entrypoint_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: one-link capability contracts
        run: python -B -W error -m unittest -q test_capability_entrypoints.py test_chargeable_checkout_eof.py
      - name: open-door anti-regression
        run: git show --format= --no-ext-diff HEAD | python open_door_guard.py --diff-file -
      - name: whitespace guard
        run: git diff --check HEAD^

  connector-preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile connector preflight
        run: >-
          python -m py_compile
          coordination/connector_preflight/core.py
          coordination/connector_preflight/latest.py
          coordination/connector_preflight/cli.py
          coordination/connector_preflight/publication.py
          coordination/connector_preflight/test_preflight.py
          coordination/connector_preflight/test_latest.py
          coordination/connector_preflight/test_publication.py
      - name: Connector preflight unit and hostile tests
        run: python -m unittest -q coordination.connector_preflight.test_preflight coordination.connector_preflight.test_latest coordination.connector_preflight.test_publication
      - name: Connector preflight optimized Python tests
        run: python -O -m unittest -q coordination.connector_preflight.test_preflight coordination.connector_preflight.test_latest coordination.connector_preflight.test_publication
