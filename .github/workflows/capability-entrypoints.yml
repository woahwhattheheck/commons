name: capability-entrypoints

on:
  push:
    branches:
      - main
    paths: &entrypoint_paths
      - '.github/workflows/capability-entrypoints.yml'
      - 'test_capability_entrypoints.py'
      - 'test_chargeable_checkout_eof.py'
      - 'p/grok-build-chargeable-checkout-20260828-01.md'
      - 'index.html'
      - 'resources.html'
      - 'commerce.html'
      - 'revenue/outcome_commerce/manifest.json'
      - 'revenue/outcome_commerce/catalog.json'
      - 'orchestration.html'
      - 'orchestration/jeffersonville/frameworks.json'
      - 'orchestration/jeffersonville/topology.json'
      - 'coordination/connector_preflight/**'
      - 'revenue/mmsd_ai_governance_policy/**'
      - 'revenue/hive_photo_meal_journal/**'
      - 'tests/test_mealframe.py'
      - 'tests/test_mealframe_security.py'
      - 'p/ztk-q4m7-hive019-mealframe-recovery-20260914.md'
      - 'revenue/organization_outbound_lease/**'
      - 'tests/test_organization_outbound_lease.py'
      - 'tests/test_organization_outbound_lease_trust.py'
  pull_request:
    paths: *entrypoint_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: one-link capability contracts
        run: python -B -W error -m unittest -q test_capability_entrypoints.py test_chargeable_checkout_eof.py
      - name: open-door anti-regression
        run: git show --format= --no-ext-diff HEAD | python open_door_guard.py --diff-file -
      - name: whitespace guard
        run: git diff --check HEAD^

  connector-preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile connector preflight
        run: >-
          python -m py_compile
          coordination/connector_preflight/core.py
          coordination/connector_preflight/latest.py
          coordination/connector_preflight/cli.py
          coordination/connector_preflight/publication.py
          coordination/connector_preflight/test_preflight.py
          coordination/connector_preflight/test_latest.py
          coordination/connector_preflight/test_publication.py
      - name: Connector preflight unit and hostile tests
        run: python -m unittest -q coordination.connector_preflight.test_preflight coordination.connector_preflight.test_latest coordination.connector_preflight.test_publication
      - name: Connector preflight optimized Python tests
        run: python -O -m unittest -q coordination.connector_preflight.test_preflight coordination.connector_preflight.test_latest coordination.connector_preflight.test_publication

  mmsd-ai-governance-policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile AI governance evidence core
        run: >-
          python -m py_compile
          revenue/mmsd_ai_governance_policy/engine.py
          revenue/mmsd_ai_governance_policy/test_engine.py
          revenue/mmsd_ai_governance_policy/test_verify_hostiles.py
      - name: AI governance unit and hostile tests
        run: python -m unittest -q revenue.mmsd_ai_governance_policy.test_engine revenue.mmsd_ai_governance_policy.test_verify_hostiles
      - name: AI governance optimized Python tests
        run: python -O -m unittest -q revenue.mmsd_ai_governance_policy.test_engine revenue.mmsd_ai_governance_policy.test_verify_hostiles

  mealframe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile MealFrame
        run: >-
          python -m py_compile
          revenue/hive_photo_meal_journal/journal.py
          revenue/hive_photo_meal_journal/server.py
          tests/test_mealframe.py
          tests/test_mealframe_security.py
      - name: MealFrame normal tests with resource warnings fatal
        run: >-
          python -W error::ResourceWarning tests/test_mealframe.py &&
          python -W error::ResourceWarning tests/test_mealframe_security.py
      - name: MealFrame optimized tests with resource warnings fatal
        run: >-
          python -O -W error::ResourceWarning tests/test_mealframe.py &&
          python -O -W error::ResourceWarning tests/test_mealframe_security.py

  organization-outbound-lease:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile organization outbound lease
        run: >-
          python -m py_compile
          revenue/organization_outbound_lease/__init__.py
          revenue/organization_outbound_lease/core.py
          revenue/organization_outbound_lease/stores.py
          revenue/organization_outbound_lease/strict.py
          revenue/organization_outbound_lease/trust.py
          revenue/organization_outbound_lease/cli.py
          tests/test_organization_outbound_lease.py
          tests/test_organization_outbound_lease_trust.py
      - name: Organization outbound lease unit and hostile tests
        run: python -m unittest -q tests.test_organization_outbound_lease tests.test_organization_outbound_lease_trust
      - name: Organization outbound lease optimized Python tests
        run: python -O -m unittest -q tests.test_organization_outbound_lease tests.test_organization_outbound_lease_trust
