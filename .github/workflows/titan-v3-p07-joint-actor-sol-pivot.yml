name: titan-v3-p07-joint-actor-sol-pivot

on:
  push:
    branches:
      - sol-pivot/titan-v3-p07-joint-actor-integration-20260910-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-contracts-and-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact checkout and additive scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3-p07-joint-actor-sol-pivot
          git diff --name-only HEAD^ HEAD | tee "$RUNNER_TEMP/changed.txt"
          while IFS= read -r path; do
            case "$path" in
              "$ROOT"/*|.github/workflows/titan-v3-p07-joint-actor-sol-pivot.yml|p/sol-pivot-titan-v3-p07-joint-actor-20260910-01.md) ;;
              *) echo "out-of-scope path: $path" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/head.sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned official interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run 20 pair-atomic and fail-closed contracts
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          ROOT="$LAB/candidates/v3-p07-joint-actor-sol-pivot"
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            PYTHONPATH="$LAB:$ROOT" \
            python -m unittest discover -s "$ROOT/tests" -p 'test_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile \
            "$ROOT/candidate.py" "$ROOT/p07_atomic.py" \
            "$ROOT/p07_current_hire.py" "$ROOT/run_panel.py"
          git diff --exit-code

      - name: Bind current execution closure
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          ROOT="$LAB/candidates/v3-p07-joint-actor-sol-pivot"
          sha256sum \
            "$LAB/main.py" \
            "$LAB/titan_runtime.py" \
            "$LAB/spatial_tempo.py" \
            "$LAB/joint_assignment.py" \
            "$LAB/reference/engine/kaggriculture.py" \
            "$LAB/TITAN-CONFIG.json" \
            "$ROOT/candidate.py" \
            "$ROOT/p07_atomic.py" \
            "$ROOT/p07_current_hire.py" \
            "$ROOT/run_panel.py" \
            | tee "$RUNNER_TEMP/SOURCE-CLOSURE.sha256"

      - name: Run action-bound all-step official census
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3-p07-joint-actor-sol-pivot
          mkdir -p "$RUNNER_TEMP/p07"
          set +e
          python "$ROOT/run_panel.py" \
            --head "$(git rev-parse HEAD)" \
            --seeds '2611092301,2611092303' \
            --opponents 'arlene,v1' \
            --workers 1 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$RUNNER_TEMP/p07/PANEL.json" \
            --markdown "$RUNNER_TEMP/p07/PANEL.md"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "P07 census failed structurally with exit $rc" >&2
            exit "$rc"
          fi
          printf '%s\n' "$rc" > "$RUNNER_TEMP/p07/VERDICT-EXIT.txt"

      - name: Publish exact census summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/p07/PANEL.md" ]]; then
            cat "$RUNNER_TEMP/p07/PANEL.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# P07 census produced no report' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain source, action, score, and all-step evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-p07-joint-actor-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/head.sha
            ${{ runner.temp }}/changed.txt
            ${{ runner.temp }}/SOURCE-CLOSURE.sha256
            ${{ runner.temp }}/p07/
          if-no-files-found: error
          retention-days: 30
