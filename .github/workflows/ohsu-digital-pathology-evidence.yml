name: OHSU Digital Pathology Evidence

on:
  pull_request:
    paths:
      - 'revenue/ohsu_digital_pathology_ims/**'
      - '.github/workflows/ohsu-digital-pathology-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/ohsu_digital_pathology_ims/**'
      - '.github/workflows/ohsu-digital-pathology-evidence.yml'

permissions:
  contents: read

jobs:
  focused-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: revenue/ohsu_digital_pathology_ims
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Production retained root is not provisioned by source
        run: |
          test ! -e /etc/commons/ohsu_digital_pathology_ims/trusted_completeness.sha256
      - name: Compile
        run: >-
          python -m py_compile
          qualification.py
          current_authority.py
          integration_contract.py
          cli.py
          test_qualification.py
          test_current_authority.py
          test_integration_contract.py
          test_cli.py
      - name: Unit tests
        run: python -m unittest -v
      - name: Optimized-mode unit tests
        run: python -O -m unittest -v
      - name: Public listing remains HOLD under fresh-process current authority
        shell: bash
        run: |
          set +e
          python cli.py fixtures/public_listing_only.json > /tmp/ohsu-digital-pathology-receipt.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          with open('/tmp/ohsu-digital-pathology-receipt.json', encoding='utf-8') as fh:
              receipt = json.load(fh)
          assert receipt['decision'] == 'HOLD'
          assert receipt['current_authority'] is False
          assert receipt['current_authority_mode'] == 'FRESH_ISOLATED_VERIFIER_RETAINED_ROOT_V2'
          assert receipt['trusted_completeness_root_source'] == '/etc/commons/ohsu_digital_pathology_ims/trusted_completeness.sha256'
          assert 'FULL_RFP_PACKAGE_NOT_CAPTURED' in receipt['holds']
          assert 'MINIMUM_QUALIFICATIONS_NOT_CAPTURED' in receipt['holds']
          assert 'TRUSTED_COMPLETENESS_ROOT_MISSING_OR_INVALID' in receipt['holds']
          assert receipt['proposal_submission_authorized'] is False
          PY
      - name: Current CLI has no caller clock override
        shell: bash
        run: |
          set +e
          python cli.py fixtures/public_listing_only.json --evaluated-at 2026-09-13T09:30:00Z >/tmp/clock.out 2>/tmp/clock.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'unrecognized arguments: --evaluated-at' /tmp/clock.err
