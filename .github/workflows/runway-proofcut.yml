name: proofcut-verify
on:
  pull_request:
    paths:
      - 'competitions/runway-hackathon-2026/proofcut/**'
  push:
    paths:
      - 'competitions/runway-hackathon-2026/proofcut/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: competitions/runway-hackathon-2026/proofcut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python tools/release_gate.py
