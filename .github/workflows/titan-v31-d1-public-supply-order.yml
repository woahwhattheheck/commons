name: titan-v31-d1-public-supply-order

on:
  pull_request:
    branches:
      - 'titan/v3.1-20260911'
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/d1_public_supply_order/**'
      - '.github/workflows/titan-v31-d1-public-supply-order.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v31-d1-public-supply-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-paired-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact head, frozen base, and five-path scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE=508b342fc46fa91e3d7cdc3f0b7e44934a187c14
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          python - <<'PY'
          import subprocess
          base = '508b342fc46fa91e3d7cdc3f0b7e44934a187c14'
          expected = {
              '.github/workflows/titan-v31-d1-public-supply-order.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/d1_public_supply_order/README.md',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/d1_public_supply_order/d1_public_supply_order.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/d1_public_supply_order/run_d1_screen.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/d1_public_supply_order/test_d1_public_supply_order.py',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected D1 scope: {sorted(actual)}')
          print('D1_SCOPE_OK', len(actual))
          PY
          test -z "$(git status --porcelain)"

      - name: Fetch immutable canonical carrier
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/pull/12392/head:refs/remotes/origin/titan-d1-canonical-carrier'
          test "$(git rev-parse refs/remotes/origin/titan-d1-canonical-carrier)" = 'c580f7805cc7468094c0e880f4923133d45d70d0'
          git cat-file -e '508b342fc46fa91e3d7cdc3f0b7e44934a187c14^{commit}'
          git cat-file -e 'c580f7805cc7468094c0e880f4923133d45d70d0^{commit}'
          test -z "$(git status --porcelain)"

      - name: Focused D1 source contracts
        shell: bash
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/d1_public_supply_order
        run: |
          set -euo pipefail
          env -u PYTHONOPTIMIZE python -B -m unittest -v test_d1_public_supply_order.py
          python -B - <<'PY'
          from pathlib import Path
          for name in (
              'd1_public_supply_order.py',
              'run_d1_screen.py',
              'test_d1_public_supply_order.py',
          ):
              source = Path(name).read_text(encoding='utf-8')
              compile(source, name, 'exec')
              print('syntax_ok', name)
          PY
          test -z "$(git status --porcelain)"

      - name: Receipt normalization poison contracts survive optimized Python
        shell: bash
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/d1_public_supply_order
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/d1-receipt-contract.py" <<'PY'
          from __future__ import annotations

          import copy
          import importlib.util
          import math
          from pathlib import Path

          here = Path.cwd().resolve()
          repo = here
          while repo != repo.parent and not (repo / '.git').exists():
              repo = repo.parent
          if not (repo / '.git').exists():
              raise SystemExit('repo root not found')

          runner_path = here / 'run_d1_screen.py'
          spec = importlib.util.spec_from_file_location('d1_runner_contract', runner_path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot import D1 runner')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)

          label = 'synthetic'
          candidate_main = runner_path
          fingerprint = {
              'entry': candidate_main.name,
              'callable': 'agent',
              'sha256': runner.sha256_file(candidate_main),
          }
          games = []
          for seed in runner.SEEDS:
              for seat in (0, 1):
                  games.append({
                      'opponent': label,
                      'seed': seed,
                      'candidate_seat': seat,
                      'status': 'complete',
                      'failure': None,
                      'scores': [100.0 + seat, 90.0 - seat],
                      'trace_sha256': 'a' * 64,
                  })
          valid = {
              'schema_version': 1,
              'engine_ref': runner.ENGINE_REF,
              'evaluator_sha256': runner.sha256_file(repo / runner.EVALUATOR_REL),
              'candidate': dict(fingerprint),
              'opponents': {label: dict(fingerprint)},
              'seeds': list(runner.SEEDS),
              'agent_rng_seed': runner.AGENT_RNG_SEED,
              'reproducibility': {
                  'checked': True,
                  'same_trace_and_scores': True,
                  'original_trace': 'b' * 64,
                  'replay_trace': 'b' * 64,
              },
              'games': games,
          }

          def validate(report):
              runner.validate_evaluator_report(report, label, candidate_main, candidate_main, repo)
              cells = runner.exact_cells(report, label)
              if len(cells) != len(runner.SEEDS) * 2:
                  raise AssertionError(f'wrong validated cell count: {len(cells)}')
              first = cells[(runner.SEEDS[0], 0)]
              own, rival = runner.side_scores(first)
              if not (own == 100.0 and rival == 90.0):
                  raise AssertionError(f'validated side-score projection drift: {(own, rival)!r}')

          def rejects(name, mutate):
              poisoned = copy.deepcopy(valid)
              mutate(poisoned)
              try:
                  validate(poisoned)
              except (AssertionError, SystemExit):
                  print('reject_ok', name)
                  return
              raise SystemExit(f'{name}: poison was accepted')

          validate(copy.deepcopy(valid))

          rejects('bool-schema', lambda r: r.__setitem__('schema_version', True))
          rejects('bool-seed-metadata', lambda r: r['seeds'].__setitem__(0, True))
          rejects('rng-drift', lambda r: r.__setitem__('agent_rng_seed', runner.AGENT_RNG_SEED + 1))
          rejects('candidate-fingerprint-drift', lambda r: r['candidate'].__setitem__('sha256', 'c' * 64))
          rejects('opponent-fingerprint-drift', lambda r: r['opponents'][label].__setitem__('sha256', 'd' * 64))
          rejects('extra-opponent', lambda r: r['opponents'].__setitem__('extra', dict(fingerprint)))
          rejects('recheck-not-run', lambda r: r['reproducibility'].__setitem__('checked', False))
          rejects('recheck-failed', lambda r: r['reproducibility'].__setitem__('same_trace_and_scores', False))
          rejects('replay-trace-poison', lambda r: r['reproducibility'].__setitem__('replay_trace', 'not-a-sha'))
          rejects('replay-trace-drift', lambda r: r['reproducibility'].__setitem__('replay_trace', 'c' * 64))
          rejects('bool-game-seed', lambda r: r['games'][0].__setitem__('seed', True))
          rejects('bool-seat', lambda r: r['games'][0].__setitem__('candidate_seat', False))
          rejects('float-seat', lambda r: r['games'][0].__setitem__('candidate_seat', 0.0))
          rejects('bool-score', lambda r: r['games'][0].__setitem__('scores', [True, 90.0]))
          rejects('nan-score', lambda r: r['games'][0].__setitem__('scores', [math.nan, 90.0]))
          rejects('positive-infinity', lambda r: r['games'][0].__setitem__('scores', [math.inf, 90.0]))
          rejects('negative-infinity', lambda r: r['games'][0].__setitem__('scores', [-math.inf, 90.0]))
          rejects('trace-poison', lambda r: r['games'][0].__setitem__('trace_sha256', 'not-a-sha'))
          rejects('uppercase-trace', lambda r: r['games'][0].__setitem__('trace_sha256', 'A' * 64))
          rejects('duplicate-cell', lambda r: r['games'].append(copy.deepcopy(r['games'][0])))
          rejects('missing-cell', lambda r: r['games'].pop())

          print('D1_RECEIPT_NORMALIZATION_CONTRACT_OK', len(runner.SEEDS) * 2)
          PY
          env -u PYTHONOPTIMIZE python -B "$RUNNER_TEMP/d1-receipt-contract.py"
          PYTHONOPTIMIZE=1 python -B "$RUNNER_TEMP/d1-receipt-contract.py"
          test -z "$(git status --porcelain)"

      - name: Exact V3.1 paired externality screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/titan-d1-public-supply"
          mkdir -p "$OUT"
          env -u PYTHONOPTIMIZE python -B \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/d1_public_supply_order/run_d1_screen.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$OUT" | tee "$OUT/run.log"
          grep -F 'D1_RESULT ' "$OUT/run.log"
          test -s "$OUT/D1-PAIRED-RECEIPT.json"
          test -s "$OUT/control-v31-vs-v31.json"
          test -s "$OUT/d1-vs-v31.json"

      - name: Prove checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Upload exact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v31-d1-public-supply-order-${{ github.run_id }}
          path: ${{ runner.temp }}/titan-d1-public-supply/
          if-no-files-found: warn
          retention-days: 14