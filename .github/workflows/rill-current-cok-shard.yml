name: rill-current-cok-shard
on:
  push:
    branches: ["astra/rill-current-87d7-cok-shard-20260908"]
    paths:
      - ".github/workflows/rill-current-cok-shard.yml"
      - ".tmp/rill-current-cok-shard.zip"
permissions:
  contents: write
concurrency:
  group: rill-current-cok-shard-arm
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/rill-current-87d7-cok-shard-20260908
          fetch-depth: 0
      - name: Verify and publish exact result packet
        shell: bash
        run: |
          set -euo pipefail
          PACKET=.tmp/rill-current-cok-shard.zip
          test "$(sha256sum "$PACKET" | cut -d' ' -f1)" = "5aad7610844c48b039df94850ef4651ea6d4c381601e9547a1b356db560e7d51"
          rm -rf /tmp/rill-current-cok
          mkdir -p /tmp/rill-current-cok
          unzip -q "$PACKET" -d /tmp/rill-current-cok
          DEST=revenue/kaggriculture/cloud-current-cok-shard
          test ! -e "$DEST"
          cp -a /tmp/rill-current-cok/cloud-current-cok-shard "$DEST"
          python "$DEST/verify_results.py"
          git rm .github/workflows/rill-current-cok-shard.yml "$PACKET"
          git add "$DEST"
          python - <<'PY'
          import subprocess
          expected={
              '.github/workflows/rill-current-cok-shard.yml',
              '.tmp/rill-current-cok-shard.zip',
              'revenue/kaggriculture/cloud-current-cok-shard/NOTICE.md',
              'revenue/kaggriculture/cloud-current-cok-shard/README.md',
              'revenue/kaggriculture/cloud-current-cok-shard/RESULTS.json',
              'revenue/kaggriculture/cloud-current-cok-shard/verify_results.py',
              'revenue/kaggriculture/cloud-current-cok-shard/logs/current-vs-cok-9969001.log',
              'revenue/kaggriculture/cloud-current-cok-shard/logs/current-vs-cok-9969019.log',
              'revenue/kaggriculture/cloud-current-cok-shard/raw/current-vs-cok-9969001.json',
              'revenue/kaggriculture/cloud-current-cok-shard/raw/current-vs-cok-9969019.json',
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().split())
          assert actual==expected, sorted(actual)
          PY
          git config user.name woahwhattheheck
          git config user.email brycembusiness2@gmail.com
          git commit -m "Record current TITAN versus COK V10 development shard"
          git push origin HEAD:astra/rill-current-87d7-cok-shard-20260908
