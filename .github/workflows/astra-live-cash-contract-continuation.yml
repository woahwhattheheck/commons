name: Astra live-cash contract continuation

on:
  push:
    branches:
      - astra/live-cash-contract-continuation-20260911

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/live-cash-contract-continuation-20260911
          fetch-depth: 0
      - name: Run guarded three-path continuation
        run: python .github/astra-live-cash-contract-continuation.py
