name: Astra live-cash contract continuation

on:
  push:
    branches:
      - astra/live-cash-contract-continuation-20260911

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/live-cash-contract-continuation-20260911
          fetch-depth: 0

      - name: Guard fresh-main ownership and source blobs
        env:
          BASE_SHA: 1931a6bdd6ba8243377eee6567a30fdea895565b
        run: |
          set -euo pipefail
          git fetch origin main
          drift="$(git diff --name-only "$BASE_SHA"..origin/main -- revenue/outcome_commerce/catalog.schema.json revenue/outcome_commerce/catalog.json test_outcome_commerce.py)"
          if [ -n "$drift" ]; then
            echo "owned target-path drift since continuation base:" >&2
            printf '%s\n' "$drift" >&2
            exit 42
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('revenue/outcome_commerce/catalog.schema.json').read_text())
          catalog = json.loads(Path('revenue/outcome_commerce/catalog.json').read_text())
          assert 'live_cash' not in schema['properties']
          assert 'live_cash' not in schema['$defs']
          assert 'live_cash_product' not in schema['$defs']
          assert isinstance(catalog['live_cash'], dict)
          assert catalog['live_cash']['products']
          PY
          python - <<'PY'
          import subprocess
          expected = {
              'land/sku-tip-20260826.md': 'e18c2865cf737eb2c76da23012dd0a890ccca202',
              'land/sku-seat-20260826.md': '7f7d41a94333a72cbd1f641f0c437557f3a95361',
              'land/sku-unlock-20260826.md': 'e607d3ba7cd24dd542b24a1e8be9e8579d6745ce',
              'land/sku-monthly-tip-20260826.md': 'ec94c5a6113ce6de6fd601f8bd438d5e6b117b2f',
              'land/sku-boost-20260826.md': '885dd967197935ca69cc25482f52fea09d2c5bc3',
              'land/sku-whitebox-hour-20260826.md': '49cc55559e93595b22bbcef15de6f74ac8e0f3f4',
              'land/sku-muhlnickel-titan-20260826.md': '6fb73c5837ac37ec7f48cc6efc12cc98797f12d8',
          }
          for path, want in expected.items():
              got = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if got != want:
                  raise SystemExit(f'{path}: authoritative blob drift {got} != {want}')
          PY

      - name: Apply exact three-path handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          schema_path = Path('revenue/outcome_commerce/catalog.schema.json')
          schema_raw = schema_path.read_text(encoding='utf-8')
          top_old = '    "listings": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/listing"}}\n  },'
          top_new = '    "listings": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/listing"}},\n    "live_cash": {"$ref": "#/$defs/live_cash"}\n  },'
          if schema_raw.count(top_old) != 1:
              raise SystemExit(f'schema top-level anchor count={schema_raw.count(top_old)}')
          schema_raw = schema_raw.replace(top_old, top_new, 1)

          defs_old = '''    "string_list": {
      "type": "array",
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "funnel_truth": {'''
          defs_new = '''    "string_list": {
      "type": "array",
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "live_cash_product": {
      "type": "object",
      "additionalProperties": false,
      "required": ["name", "price_usd", "path"],
      "properties": {
        "name": {"type": "string", "minLength": 1},
        "price_usd": {"type": "integer", "minimum": 1},
        "path": {"type": "string", "minLength": 1}
      }
    },
    "live_cash": {
      "type": "object",
      "additionalProperties": false,
      "required": ["cite", "note", "products"],
      "properties": {
        "cite": {
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {"type": "string", "minLength": 1}
        },
        "note": {"type": "string", "minLength": 1},
        "products": {
          "type": "array",
          "items": {"$ref": "#/$defs/live_cash_product"}
        }
      }
    },
    "funnel_truth": {'''
          if schema_raw.count(defs_old) != 1:
              raise SystemExit(f'schema defs anchor count={schema_raw.count(defs_old)}')
          schema_raw = schema_raw.replace(defs_old, defs_new, 1)
          schema_path.write_text(schema_raw, encoding='utf-8')

          replacements = {
              '7e94f42e9a92e166f614916d63712403f6fc77f7': 'e18c2865cf737eb2c76da23012dd0a890ccca202',
              '235c94284c14c179388b5e53b4b9d0f6a8a0dd7d': '7f7d41a94333a72cbd1f641f0c437557f3a95361',
              '258734957efc727f46f6315804b6034487e98896': 'e607d3ba7cd24dd542b24a1e8be9e8579d6745ce',
              'b2c54753a82683a70831588366e35114ad644a65': 'ec94c5a6113ce6de6fd601f8bd438d5e6b117b2f',
              '4fd23e7a10e90a5c988f3581d77e83b86e212884': '885dd967197935ca69cc25482f52fea09d2c5bc3',
              '62625136a9e5abfe77d9e7afa59e8ee67571b33e': '49cc55559e93595b22bbcef15de6f74ac8e0f3f4',
              'fa4ef433b0b233bb3ddc633c1828957e5d75e453': '6fb73c5837ac37ec7f48cc6efc12cc98797f12d8',
          }

          catalog_path = Path('revenue/outcome_commerce/catalog.json')
          catalog_raw = catalog_path.read_text(encoding='utf-8')
          for old, new in replacements.items():
              count = catalog_raw.count(old)
              if count != 1:
                  raise SystemExit(f'catalog expected exactly one {old}, found {count}')
              catalog_raw = catalog_raw.replace(old, new, 1)
          catalog_path.write_text(catalog_raw, encoding='utf-8')

          test_path = Path('test_outcome_commerce.py')
          test_raw = test_path.read_text(encoding='utf-8')
          marker = 'DIAGNOSTIC_SKUS = ('
          if test_raw.count(marker) != 1:
              raise SystemExit('DIAGNOSTIC_SKUS marker drift')
          prefix, suffix = test_raw.split(marker, 1)
          for old, new in replacements.items():
              count = prefix.count(old)
              if count != 1:
                  raise SystemExit(f'RECORDED_STRIPE_SKUS expected exactly one {old}, found {count}')
              prefix = prefix.replace(old, new, 1)
          test_path.write_text(prefix + marker + suffix, encoding='utf-8')

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          json.loads(catalog_path.read_text(encoding='utf-8'))
          assert schema['properties']['live_cash'] == {'$ref': '#/$defs/live_cash'}
          assert schema['$defs']['live_cash_product'] == {
              'type': 'object',
              'additionalProperties': False,
              'required': ['name', 'price_usd', 'path'],
              'properties': {
                  'name': {'type': 'string', 'minLength': 1},
                  'price_usd': {'type': 'integer', 'minimum': 1},
                  'path': {'type': 'string', 'minLength': 1},
              },
          }
          assert schema['$defs']['live_cash'] == {
              'type': 'object',
              'additionalProperties': False,
              'required': ['cite', 'note', 'products'],
              'properties': {
                  'cite': {
                      'type': 'array',
                      'minItems': 1,
                      'uniqueItems': True,
                      'items': {'type': 'string', 'minLength': 1},
                  },
                  'note': {'type': 'string', 'minLength': 1},
                  'products': {
                      'type': 'array',
                      'items': {'$ref': '#/$defs/live_cash_product'},
                  },
              },
          }
          PY

      - name: Verify tests and three-path confinement
        env:
          BASE_SHA: 1931a6bdd6ba8243377eee6567a30fdea895565b
        run: |
          set -euo pipefail
          python -m json.tool revenue/outcome_commerce/catalog.schema.json >/dev/null
          python -m json.tool revenue/outcome_commerce/catalog.json >/dev/null
          python -m py_compile test_outcome_commerce.py
          python -W error -m unittest -q test_outcome_commerce.py
          git diff --check
          rm .github/workflows/astra-live-cash-contract-continuation.yml
          changed="$(git diff --name-only "$BASE_SHA" --)"
          expected="$(printf '%s\n' revenue/outcome_commerce/catalog.json revenue/outcome_commerce/catalog.schema.json test_outcome_commerce.py | sort)"
          actual="$(printf '%s\n' "$changed" | sort)"
          test "$actual" = "$expected"

      - name: Publish verified continuation
        env:
          BRANCH: astra/live-cash-contract-continuation-20260911
        run: |
          set -euo pipefail
          git config user.name "astra-continuation"
          git config user.email "astra-continuation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(outcome-commerce): complete live-cash contract"
          git push origin "HEAD:$BRANCH"
