name: titan-v3-intent-priority-fresh-main-port

on:
  push:
    branches:
      - sol-helios/titan-v3-intent-priority-fresh-main-port-20260910-01
  pull_request:
    paths:
      - ".github/workflows/titan-v3-intent-priority-fresh-main-port.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/intent_priority/**"

permissions:
  contents: read

concurrency:
  group: titan-v3-intent-priority-port-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-main-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LAB: revenue/kaggriculture/cloud-execution-lab
      LANE: revenue/kaggriculture/cloud-execution-lab/candidates/v3/intent_priority
      SCHEDULER: revenue/kaggriculture/cloud-execution-lab/scheduler.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run current-seam, semantic, and executable-overlay contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/intent_priority
        run: python -B -m unittest -v test_materialize test_overlay

      - name: Materialize isolated executable candidate and bind receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intent-priority"
          python -B "$LANE/build_overlay.py" \
            --source-lab "$LAB" \
            --output "$RUNNER_TEMP/intent-priority/overlay" \
            --receipt "$RUNNER_TEMP/intent-priority/PORT-RECEIPT.json"
          python -B -m py_compile \
            "$RUNNER_TEMP/intent-priority/overlay/scheduler.py" \
            "$RUNNER_TEMP/intent-priority/overlay/entrypoint.py"
          python -B -I -c \
            'import runpy,sys; ns=runpy.run_path(sys.argv[1]); assert callable(ns["agent"]); import scheduler; assert scheduler.__file__ == sys.argv[2]' \
            "$RUNNER_TEMP/intent-priority/overlay/entrypoint.py" \
            "$RUNNER_TEMP/intent-priority/overlay/scheduler.py"
          test -z "$(git status --porcelain)"
          sha256sum \
            "$SCHEDULER" \
            "$RUNNER_TEMP/intent-priority/overlay/scheduler.py" \
            "$RUNNER_TEMP/intent-priority/overlay/entrypoint.py" \
            "$RUNNER_TEMP/intent-priority/PORT-RECEIPT.json" \
            | tee "$RUNNER_TEMP/intent-priority/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: titan-v3-intent-priority-port-${{ github.sha }}
          path: ${{ runner.temp }}/intent-priority/
          if-no-files-found: error
          retention-days: 14
