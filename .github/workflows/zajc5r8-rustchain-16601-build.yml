name: ZAJ-C5R8 build RustChain 16601 package

on:
  push:
    branches:
      - zajc5r8/rustchain-16601-dialup-island

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg python3-pil
      - name: Build package
        run: python3 revenue/rustchain_16601_dialup_island/build_package.py
      - name: Re-verify package
        run: python3 revenue/rustchain_16601_dialup_island/verify_package.py
      - name: Commit generated publication assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revenue/rustchain_16601_dialup_island
          git diff --cached --quiet && exit 0
          git commit -m 'build(revenue): generate RustChain #16601 production assets'
          git push
