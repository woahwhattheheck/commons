name: uiowa-001-131-ebid-pack

on:
  pull_request:
    paths:
      - 'revenue/uiowa_rfq_18649_ebid_pack/**'
      - '.github/workflows/uiowa-001-131-ebid-pack.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/uiowa_rfq_18649_ebid_pack/**'
      - '.github/workflows/uiowa-001-131-ebid-pack.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact branch bytes
        run: |
          python -m py_compile \
            revenue/uiowa_rfq_18649_ebid_pack/render_ebid.py \
            revenue/uiowa_rfq_18649_ebid_pack/test_render_ebid.py

      - name: Unit and hostile tests
        working-directory: revenue/uiowa_rfq_18649_ebid_pack
        run: python -m unittest -v test_render_ebid.py

      - name: Re-render prepared pack from committed sources
        working-directory: revenue/uiowa_rfq_18649_ebid_pack
        run: |
          python render_ebid.py --mode prepared --out /tmp/uiowa-ebid-generated
          diff -ru outputs /tmp/uiowa-ebid-generated

      - name: Assert full submission gate fails closed
        working-directory: revenue/uiowa_rfq_18649_ebid_pack
        run: |
          set +e
          python render_ebid.py --mode submit-ready --out /tmp/uiowa-ebid-submit > /tmp/submit.out 2> /tmp/submit.err
          rc=$?
          set -e
          test "$rc" -eq 3
          grep -q 'submission_ready=false' /tmp/submit.out
          grep -q 'source_refresh:' /tmp/submit.err
          grep -q 'supplier_information:' /tmp/submit.err
          grep -q 'audited_financial_statements' /tmp/submit.err
          grep -q 'fee_for_services:' /tmp/submit.err

      - name: Assert current deadline overlay
        working-directory: revenue/uiowa_rfq_18649_ebid_pack
        run: |
          grep -q '2026-09-29 15:00 CT' source-state.json
          ! grep -q '"confirmed": true' source-state.json
