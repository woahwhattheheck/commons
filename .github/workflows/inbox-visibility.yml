name: Inbox visibility
on:
  push:
    branches: [main]
    paths:
      - host/inbox_slack_relay.py
      - host/inbox_visibility.json
      - tests/test_inbox_slack_relay.py
      - test_inbox_slack_relay_charset.py
      - test_inbox_slack_relay_alternatives.py
      - test_inbox_slack_relay_headers.py
      - .github/workflows/inbox-visibility.yml
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: read
concurrency:
  group: inbox-visibility
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check delivery bindings without exposing values
        id: bindings
        env:
          GH_NOTIFICATIONS_TOKEN: ${{ secrets.GH_NOTIFICATIONS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GMAIL_AUTHORIZED_USER_JSON: ${{ secrets.GMAIL_AUTHORIZED_USER_JSON }}
        run: |
          python3 - <<'PY'
          import os
          names = ('GH_NOTIFICATIONS_TOKEN', 'SLACK_BOT_TOKEN', 'GMAIL_AUTHORIZED_USER_JSON')
          missing = [name for name in names if not os.environ.get(name)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ready=' + ('false' if missing else 'true') + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              if missing:
                  f.write('## BLOCKED — no automatic inbox delivery\n\nMissing runtime bindings: ' + ', '.join(missing) + '.\n\nThe configuration probe completed, not inbox delivery. No source was marked read/done. Resolve through existing private credential custody or use the existing-runtime installer.\n')
              else:
                  f.write('## Configuration present — delivery still requires the receipt below\n')
          print('BLOCKED: delivery bindings missing; scheduled delivery skipped' if missing else 'Bindings present; validating actual delivery next')
          PY
      - uses: actions/checkout@v4
        if: steps.bindings.outputs.ready == 'true' || github.event_name != 'schedule'
        with:
          persist-credentials: false
          sparse-checkout: |
            host
            tests
            integrations
      - name: Regression tests
        if: steps.bindings.outputs.ready == 'true' || github.event_name != 'schedule'
        run: |
          python3 -m unittest discover -s tests -p test_inbox_slack_relay.py -v
          python3 -m unittest test_inbox_slack_relay_charset test_inbox_slack_relay_alternatives test_inbox_slack_relay_headers -v
      - uses: actions/cache/restore@v4
        if: steps.bindings.outputs.ready == 'true'
        with:
          path: .inbox-state/state.sqlite3
          key: inbox-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: inbox-state-v1-
      - name: Deliver contents and publish transport and coverage receipt
        if: steps.bindings.outputs.ready == 'true'
        env:
          GH_NOTIFICATIONS_TOKEN: ${{ secrets.GH_NOTIFICATIONS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GMAIL_AUTHORIZED_USER_JSON: ${{ secrets.GMAIL_AUTHORIZED_USER_JSON }}
        run: |
          set +e
          python3 -m host.inbox_slack_relay --state .inbox-state/state.sqlite3 > "$RUNNER_TEMP/inbox-receipt.json"
          set -e
          cat "$RUNNER_TEMP/inbox-receipt.json"
          python3 - <<'PY'
          import json, os, sys
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'inbox-receipt.json')) as f:
              receipt = json.load(f)
          # A delivered DEGRADED health report is not a process failure or an
          # empty inbox. Keep its source errors/pending counts visible in Slack
          # and the summary without generating repetitive workflow-failure mail.
          sys.exit(0 if receipt.get('status') in {'LIVE', 'DEGRADED'} else 2)
          PY
      - uses: actions/cache/save@v4
        if: always() && steps.bindings.outputs.ready == 'true'
        with:
          path: .inbox-state/state.sqlite3
          key: inbox-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
