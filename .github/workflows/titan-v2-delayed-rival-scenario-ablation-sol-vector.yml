name: titan-v2-delayed-rival-scenario-ablation-sol-vector

on:
  push:
    paths:
      - '.github/workflows/titan-v2-delayed-rival-scenario-ablation-sol-vector.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/v2-delayed-rival-scenario-ablation-sol-vector/**'
      - 'p/sol-vector-titan-v2-delayed-rival-scenario-ablation-20260909-01.md'
  pull_request:
    paths:
      - '.github/workflows/titan-v2-delayed-rival-scenario-ablation-sol-vector.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/analysis/v2-delayed-rival-scenario-ablation-sol-vector/**'
      - 'p/sol-vector-titan-v2-delayed-rival-scenario-ablation-20260909-01.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-delayed-rival-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SEEDS: '539131249,1834999074,2609097301,2609097302,2609097303,2609097304,2611092201,2611092207'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s\n' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/exact-head.sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned official-interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run one-factor and comparison contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/analysis/v2-delayed-rival-scenario-ablation-sol-vector
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python -m unittest -v test_materialize.py test_compare.py
          python -m py_compile materialize.py compare.py test_materialize.py test_compare.py

      - name: Materialize exact V2 one-factor arm
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          CASE="$LAB/analysis/v2-delayed-rival-scenario-ablation-sol-vector"
          OUT="$RUNNER_TEMP/v2-delayed-rival-scenario-ablation"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python "$CASE/materialize.py" \
            --source "$LAB/runtime/variants/v2" \
            --output "$OUT/candidate" \
            --receipt "$OUT/MATERIALIZATION.json"

      - name: Verify canonical package stayed unchanged
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python build_integrated.py --check
          git diff --exit-code -- .

      - name: Run frozen V2 control panel
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          OUT="$RUNNER_TEMP/v2-delayed-rival-scenario-ablation"
          python "$KAG/cloud-eval/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$LAB/runtime/variants/v2/candidate.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$OUT/control.json"

      - name: Run delayed-rival scenario ablation panel
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          OUT="$RUNNER_TEMP/v2-delayed-rival-scenario-ablation"
          python "$KAG/cloud-eval/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$OUT/candidate/candidate.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds "$SEEDS" \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$OUT/candidate.json"

      - name: Classify one-factor causal signal
        shell: bash
        run: |
          set -euo pipefail
          CASE=revenue/kaggriculture/cloud-execution-lab/analysis/v2-delayed-rival-scenario-ablation-sol-vector
          OUT="$RUNNER_TEMP/v2-delayed-rival-scenario-ablation"
          python "$CASE/compare.py" \
            --control "$OUT/control.json" \
            --candidate "$OUT/candidate.json" \
            --receipt "$OUT/MATERIALIZATION.json" \
            --head "$(git rev-parse HEAD)" \
            --output "$OUT/ABLATION-REPORT.json" \
            --markdown "$OUT/ABLATION-REPORT.md"

      - name: Validate classification artifact
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/v2-delayed-rival-scenario-ablation/ABLATION-REPORT.json"
          python - "$REPORT" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["operation"] == "titan-v2-delayed-rival-scenario-ablation-20260909-sol-vector-01"
          assert report["verdict"] in {
              "UPSIDE_SCREEN",
              "NO_ACTION_SIGNAL",
              "ACTION_NO_SCORE_SIGNAL",
              "REGRESSION",
              "MIXED",
          }
          assert isinstance(report["advance_candidate"], bool)
          assert report["overall"]["cells"] == 32
          print(
              json.dumps(
                  {
                      "verdict": report["verdict"],
                      "advance_candidate": report["advance_candidate"],
                      "changed_cells": report["overall"]["changed_cells"],
                      "mean_own_delta": report["overall"]["mean_own_delta"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Publish readable result
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/v2-delayed-rival-scenario-ablation/ABLATION-REPORT.md"
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# V2 delayed-rival scenario ablation did not reach classification' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v2-delayed-rival-scenario-ablation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-head.sha
            ${{ runner.temp }}/v2-delayed-rival-scenario-ablation/
          if-no-files-found: error
          retention-days: 30

      - name: Assert checkout stayed clean
        if: always()
        run: git diff --exit-code -- .
