      - name: Require exact changed-path ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_STATUS'
          import subprocess
          expected = {
              '.github/workflows/titan-w15-throughput.yml',
              'p/sol-w15-exact-game-throughput-20260909-01.md',
              'revenue/kaggriculture/cloud-execution-lab/tools/w15_throughput/README.md',
              'revenue/kaggriculture/cloud-execution-lab/tools/w15_throughput/__init__.py',
              'revenue/kaggriculture/cloud-execution-lab/tools/w15_throughput/benchmark.py',
              'revenue/kaggriculture/cloud-execution-lab/tools/w15_throughput/exact_pool.py',
              'revenue/kaggriculture/cloud-execution-lab/tools/w15_throughput/fake_evaluator.py',
              'revenue/kaggriculture/cloud-execution-lab/tools/w15_throughput/test_exact_pool.py',
              '.github/workflows/sol-w15-publisher.yml'
          }
          raw = subprocess.check_output(['git','status','--porcelain=v1','-z'])
          entries = [entry for entry in raw.decode().split(chr(0)) if entry]
          paths = []
          for entry in entries:
              if len(entry) < 4:
                  raise SystemExit(f'malformed git status entry: {entry!r}')
              path = entry[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          if set(paths) != expected or len(paths) != len(expected):
              raise SystemExit(f'changed path mismatch: observed={sorted(paths)} expected={sorted(expected)}')
          print('owned_paths_ok', len(paths))
          PY_STATUS
