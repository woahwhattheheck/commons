name: SOL W15 verified payload publisher

on:
  push:
    branches:
      - "sol/w15-exact-game-throughput-20260909-01"

permissions:
  contents: write

concurrency:
  group: sol-w15-publisher-20260909-01
  cancel-in-progress: false

jobs:
