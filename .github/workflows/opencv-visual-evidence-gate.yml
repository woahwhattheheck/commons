name: opencv-visual-evidence-gate

on:
  pull_request:
    paths:
      - 'competitions/opencv-ai-2026/visual-evidence-gate/**'
      - 'test_opencv_visual_evidence_gate.py'
      - '.github/workflows/opencv-visual-evidence-gate.yml'
  push:
    branches: [main]
    paths:
      - 'competitions/opencv-ai-2026/visual-evidence-gate/**'
      - 'test_opencv_visual_evidence_gate.py'
      - '.github/workflows/opencv-visual-evidence-gate.yml'

permissions:
  contents: read

jobs:
  hostile-proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated OpenCV test runtime
        run: python -m pip install --disable-pip-version-check -r competitions/opencv-ai-2026/visual-evidence-gate/requirements-test.txt
      - name: Compile source
        run: python -m py_compile competitions/opencv-ai-2026/visual-evidence-gate/visual_gate.py competitions/opencv-ai-2026/visual-evidence-gate/aws_lambda.py competitions/opencv-ai-2026/visual-evidence-gate/evaluate.py test_opencv_visual_evidence_gate.py
      - name: Normal hostile proof
        run: PYTHONNOUSERSITE=1 python test_opencv_visual_evidence_gate.py
      - name: Optimized hostile proof
        run: PYTHONNOUSERSITE=1 python -O test_opencv_visual_evidence_gate.py
      - name: Synthetic evaluation truth ceiling
        run: |
          PYTHONNOUSERSITE=1 python competitions/opencv-ai-2026/visual-evidence-gate/evaluate.py > /tmp/eval.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/eval.json'))
          assert d['passed'] == 4
          assert d['success_ppm'] == 1_000_000
          assert d['claims']['natural_video_accuracy_measured'] is False
          assert d['claims']['aws_runtime_evidenced'] is False
          assert d['claims']['competition_submission_evidenced'] is False
          PY
