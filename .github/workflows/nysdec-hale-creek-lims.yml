name: nysdec-hale-creek-lims-rfi

on:
  pull_request:
    paths:
      - 'opportunities/nysdec_hale_creek_lims/**'
      - 'tests/test_nysdec_hale_creek_lims.py'
      - '.github/workflows/nysdec-hale-creek-lims.yml'
  push:
    branches: [main]
    paths:
      - 'opportunities/nysdec_hale_creek_lims/**'
      - 'tests/test_nysdec_hale_creek_lims.py'
      - '.github/workflows/nysdec-hale-creek-lims.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parse
        run: python -m py_compile opportunities/nysdec_hale_creek_lims/carrier.py tests/test_nysdec_hale_creek_lims.py
      - name: Test normal
        run: python -m unittest -v tests.test_nysdec_hale_creek_lims
      - name: Test optimized
        run: python -O -m unittest -v tests.test_nysdec_hale_creek_lims
      - name: Real CLI compile and verify
        run: |
          tmp="$(mktemp -d)"
          python opportunities/nysdec_hale_creek_lims/carrier.py compile             --source opportunities/nysdec_hale_creek_lims/source_snapshot.json             --output "$tmp/receipt.json"
          python opportunities/nysdec_hale_creek_lims/carrier.py verify             --source opportunities/nysdec_hale_creek_lims/source_snapshot.json             --receipt "$tmp/receipt.json"             --output "$tmp/verify.json"
