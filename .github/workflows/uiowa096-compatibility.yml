name: UIOWA096 compatibility

on:
  pull_request:
    paths:
      - 'revenue/uiowa_rfq_18649_interchange/compatibility/**'
      - 'revenue/uiowa_rfq_18649_workbench/**'
      - 'revenue/uiowa_rfq_18649_workshare/**'
      - '.github/workflows/uiowa096-compatibility.yml'
  push:
    branches:
      - main
    paths:
      - 'revenue/uiowa_rfq_18649_interchange/compatibility/**'
      - '.github/workflows/uiowa096-compatibility.yml'

permissions:
  contents: read

jobs:
  real-upstream-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm runtime and actual upstream sources
        run: |
          python --version
          node --version
          test -f revenue/uiowa_rfq_18649_workshare/compiler.py
          test -f revenue/uiowa_rfq_18649_workbench/app.js
          git rev-parse HEAD
          git ls-files -s revenue/uiowa_rfq_18649_workbench/app.js revenue/uiowa_rfq_18649_workshare
      - name: Run independent oracle and real compiler-to-workbench tests
        run: python -m unittest discover -s revenue/uiowa_rfq_18649_interchange/compatibility -p 'test_*.py' -v
      - name: Check optimized Python behavior
        run: python -O -m unittest discover -s revenue/uiowa_rfq_18649_interchange/compatibility -p 'test_*.py' -v
