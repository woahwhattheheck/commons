name: commons-discord-cloud

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "p/**"
      - "commons_discord.py"
      - "discord_ingest.py"
      - "host/discord_mirror.py"
      - "infra/discord/**"
      - ".github/workflows/commons-discord-cloud.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: commons-discord-cloud
  cancel-in-progress: false

jobs:
  inbound:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: pull Discord into the canonical open Commons issue road
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          COMMONS_DISCORD_CHANNEL: ${{ vars.COMMONS_DISCORD_CHANNEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 commons_discord.py doctor > /tmp/commons-discord-doctor.json
          python3 infra/discord/assert_ready.py discord_to_commons /tmp/commons-discord-doctor.json
          python3 commons_discord.py sync-in

  outbound:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: mirror only newly landed Commons records
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMONS_DISCORD_CHANNEL: ${{ vars.COMMONS_DISCORD_CHANNEL }}
        shell: bash
        run: |
          set -euo pipefail
          # Validate the complete push range before the first Discord call. A shallow
          # checkout need not contain the predecessor of a multi-commit push.
          if [[ ! "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$BEFORE_SHA" == '0000000000000000000000000000000000000000' ]] ||
             [[ ! "${EXPECTED_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Discord mirror: exact nonzero push predecessor and head are required; reconcile an initial push manually.' >&2
            exit 2
          fi
          if [[ "$(git rev-parse --verify HEAD)" != "$EXPECTED_HEAD_SHA" ]]; then
            echo 'Discord mirror: checkout does not match the event head.' >&2
            exit 2
          fi
          git cat-file -e "${EXPECTED_HEAD_SHA}^{commit}"
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # Commons is public. Fetch only this exact predecessor, not full history,
            # and do not persist or print any credentials.
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          git cat-file -e "${BEFORE_SHA}^{commit}"
          plan=$(mktemp)
          doctor=$(mktemp)
          trap 'rm -f "$plan" "$doctor"' EXIT
          # Do not stream Git into a sender: a late diff error must send nothing.
          # NUL boundaries preserve spaces, tabs, Unicode and newlines in record names.
          git diff --no-ext-diff --no-textconv --no-renames --diff-filter=AM \
            --name-only -z "$BEFORE_SHA" "$EXPECTED_HEAD_SHA" -- 'p/*.md' > "$plan"
          while IFS= read -r -d '' record; do
            if [[ ! -f "$record" || -L "$record" ]]; then
              echo 'Discord mirror: planned record is not a regular, nonsymlink file.' >&2
              exit 2
            fi
          done < "$plan"
          if [[ ! -s "$plan" ]]; then
            exit 0
          fi
          python3 commons_discord.py doctor > "$doctor"
          python3 infra/discord/assert_ready.py commons_to_discord "$doctor"
          while IFS= read -r -d '' record; do
            python3 commons_discord.py to-discord send "$record"
          done < "$plan"
