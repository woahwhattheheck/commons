name: TITAN E07 BUY_PRODUCT boundary carrier

on:
  push:
    branches:
      - sol-e07-v3-buy-product-boundary-20260909-02

permissions:
  contents: write

concurrency:
  group: titan-e07-boundary-carrier-20260909-02
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply narrow source and regression repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('revenue/kaggriculture/cloud-execution-lab/frozen_selected.py')
          text = source.read_text()
          old = """    before=baseline['outcomes'][target]
              candidates=[]
              targets=set(targets)
              for source in range(target+1,len(original)):
          """
          new = """    before=baseline['outcomes'][target]
              candidates=[]
              targets=set(targets)
              source_limit=barrier if barrier is not None else len(original)
              for source in range(target+1,source_limit):
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact E07 source seam, found {text.count(old)}')
          source.write_text(text.replace(old, new))

          test = Path('revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py')
          test_text = test.read_text()
          anchor = '\n\nclass CanonicalSameTurnFundingBinding(unittest.TestCase):'
          method = """
              def test_sale_after_variable_price_buy_cannot_cross_boundary(self):
                  obs,base=fixture(shed={'MILK':1},money=0)
                  base['market']=[[],['BUY_SEED','CARROT',1],
                                  ['BUY_PRODUCT','WHEAT',1],['SELL','MILK',1]]
                  original=deepcopy(base['market'])
                  out,info=fund(obs,base,{'MILK'})
                  self.assertEqual(out,original)
                  self.assertEqual(info['reason'],'no-safe-prefix-sale')
                  self.assertEqual(info['target_index'],1)
                  self.assertEqual(sale_quantities(out),sale_quantities(original))
          """
          if method.strip() in test_text:
              raise SystemExit('regression already present; refusing duplicate insertion')
          if test_text.count(anchor) != 1:
              raise SystemExit(f'expected one E07 test insertion anchor, found {test_text.count(anchor)}')
          test.write_text(test_text.replace(anchor, '\n' + method + anchor))

          carrier = Path('.github/workflows/titan-e07-boundary-carrier.yml')
          carrier.unlink()
          PY
          git diff --check

      - name: Prove focused behavior before publication
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_e07_same_turn_funding.SameTurnFundingContracts 2>&1 | tee /tmp/e07-focused.log

      - name: Rebuild canonical TITAN release from repaired source
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python build_integrated.py 2>&1 | tee /tmp/e07-build.log
          python build_integrated.py --check 2>&1 | tee /tmp/e07-check.log

      - name: Run E07 and neighboring contracts on rebuilt release
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_e07_same_turn_funding \
            test_joint_market_slots \
            test_e10_floor_cycle \
            test_funded_prefix \
            test_release_consistency \
            test_build_publication 2>&1 | tee /tmp/e07-neighbors.log
          python -m compileall -q frozen_selected.py test_e07_same_turn_funding.py
          python build_integrated.py --check

      - name: Write durable repair receipt and constrain changed paths
        shell: bash
        env:
          BASE_SHA: f1dd26fc53ba8aa2535760ed5799879056530be4
          OPERATION: titan-e07-buy-product-source-boundary-repair-20260909-02
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path('.')
          lab = root / 'revenue/kaggriculture/cloud-execution-lab'
          pointer = json.loads((lab / 'runtime/integrated-selected/CURRENT-ARCHIVE.json').read_text())
          source = lab / 'frozen_selected.py'
          test = lab / 'test_e07_same_turn_funding.py'
          summaries = []
          for name in ('/tmp/e07-focused.log', '/tmp/e07-neighbors.log'):
              lines = Path(name).read_text().splitlines()
              summaries.extend(line for line in lines if line.startswith('Ran ') or line == 'OK')
          receipt = root / 'p/sol-e07-buy-product-boundary-repair-20260909-02.md'
          receipt.write_text(
              '# SOL E07 BUY_PRODUCT source-boundary repair\n\n'
              f'- Operation: `{os.environ["OPERATION"]}`\n'
              f'- Exact base: `{os.environ["BASE_SHA"]}`\n'
              '- Upstream blocker: PR #11162 review `5157299922`; integration input comment `5606311135`.\n'
              '- Repair: candidate funding SELL sources are bounded strictly before the first variable-price `BUY_PRODUCT` barrier.\n'
              '- Regression: failing fixed BUY before barrier plus only funding SELL after barrier leaves the entire queue and sale quantities unchanged with `no-safe-prefix-sale`.\n'
              f'- Source SHA-256: `{hashlib.sha256(source.read_bytes()).hexdigest()}`\n'
              f'- Test SHA-256: `{hashlib.sha256(test.read_bytes()).hexdigest()}`\n'
              f'- Canonical archive: `{pointer["sha256"]}` / {pointer["bytes"]} bytes / {pointer["runtime_files"]} files.\n'
              f'- Canonical source manifest: `{pointer["source_manifest_sha256"]}`.\n'
              f'- Test summaries: `{'; '.join(summaries)}`.\n'
              '- Commands: focused E07 class; canonical build + `--check`; full E07, joint-slot, E10, funded-prefix, release-consistency, and publication suites; compileall.\n'
              '- Evidence boundary: no official games, playing-strength claim, Kaggle submission, provider action, or owner-PC execution.\n'
          )

          raw = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          paths = [line[3:] for line in raw]
          allowed = {
              '.github/workflows/titan-e07-boundary-carrier.yml',
              'p/sol-e07-buy-product-boundary-repair-20260909-02.md',
              'revenue/kaggriculture/cloud-execution-lab/frozen_selected.py',
              'revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py',
              'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz',
              'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json',
              'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json',
          }
          unexpected = [p for p in paths if p not in allowed and not re.fullmatch(
              r'revenue/kaggriculture/cloud-execution-lab/exports/historical/titan-[0-9a-f]{64}\.tar\.gz', p)]
          if unexpected:
              raise SystemExit(f'unexpected changed paths: {unexpected}')
          required = {
              'revenue/kaggriculture/cloud-execution-lab/frozen_selected.py',
              'revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py',
              'revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz',
              'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json',
              'revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json',
              'p/sol-e07-buy-product-boundary-repair-20260909-02.md',
              '.github/workflows/titan-e07-boundary-carrier.yml',
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f'missing expected changed paths: {missing}')
          print('\n'.join(raw))
          PY
          git diff --check

      - name: Commit verified repair and push non-force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SOL E07 V3'
          git config user.email 'tokenjunkielabs@gmail.com'
          git add -A -- \
            .github/workflows/titan-e07-boundary-carrier.yml \
            p/sol-e07-buy-product-boundary-repair-20260909-02.md \
            revenue/kaggriculture/cloud-execution-lab/frozen_selected.py \
            revenue/kaggriculture/cloud-execution-lab/test_e07_same_turn_funding.py \
            revenue/kaggriculture/cloud-execution-lab/exports/titan-current.tar.gz \
            revenue/kaggriculture/cloud-execution-lab/exports/historical \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-SOURCE.json \
            revenue/kaggriculture/cloud-execution-lab/runtime/integrated-selected/CURRENT-ARCHIVE.json
          git diff --cached --check
          git commit -m 'Repair E07 BUY_PRODUCT source boundary'
          git push origin HEAD:sol-e07-v3-buy-product-boundary-20260909-02
