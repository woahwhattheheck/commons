name: TITAN V3.1 8e3 L3 fail-closed package bootstrap

on:
  pull_request:
    branches:
      - astra/v31-a612-restore-5f6-canonical-archive-20260911
    paths:
      - '.github/workflows/titan-v31-8e3-l3-failclosed-bootstrap.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/**'

permissions:
  contents: write

jobs:
  consume-reviewed-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout writable feature branch at exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Bind stacked base, exact bootstrap scope, and donor bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='6e5e3c7cc5302d6db4b702cc4fd7c8ca721d7b8a'
          BASE_REF='astra/v31-a612-restore-5f6-canonical-archive-20260911'
          EXPECTED_HEAD='${{ github.event.pull_request.head.sha }}'
          PATCH='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/repair.patch'
          DONOR_TEST='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/test_failclosed.py'
          ROUTER='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py'
          PROD_TEST='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_r04_l3_rival_gate.py'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git fetch --no-tags origin "$BASE_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE:$ROUTER")" = '7edacbfb4916b8f241b689ded6643240ca02a9ec'
          test "$(git rev-parse "$BASE:$PROD_TEST")" = '543101ea0499a529e024675d8299a896b3e5f9dd'
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py")" = 'a43d6c470ab05d87803fb016966d1cc54fab9d17'
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/build_v3.py")" = '528cfabbe377f829cb584726c41bd2f64061373b'
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/FILES.json")" = 'f79539bde12aa679ad506996454627b6f2ad8cbb'
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json")" = '5501fc5dbbe2bf361d1d7fd110bcb520da7cf005'
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_h4_strawberry.py")" = 'd6e3ffb76856ff171dab2a45b4d3c1788f2b2cb8'
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_no_late_sale_advance.py")" = 'fb26e2ca9985cc65b1127f4eec654fb5cb2a3df0'
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/b5_fertilize.py")" = '2a9d606835b0d04d832a4737dcb381ad3fbef1ae'
          test "$(git rev-parse "$BASE:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/jit_pass_fertilize.py")" = '6ef7ddcd9590e3cb3f55ceb708b8026235d59410'
          test "$(git hash-object "$PATCH")" = 'bc7f57e2fc1a806a7050f0bf88f9f776e9dbeb3c'
          test "$(git hash-object "$DONOR_TEST")" = 'b572bb0adad3b8ca53100d4d44b35c5a374e8302'
          git diff --name-only "$BASE"..HEAD > /tmp/l3-bootstrap-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/l3-bootstrap-paths.txt').read_text().splitlines())
          expected = {
              '.github/workflows/titan-v31-8e3-l3-failclosed-bootstrap.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/repair.patch',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/test_failclosed.py',
          }
          if actual != expected:
              raise SystemExit(f'prebootstrap scope drift: actual={sorted(actual)!r}')
          print('L3_PREBOOTSTRAP_SCOPE_OK', len(actual))
          PY
          git diff --check "$BASE"..HEAD

      - name: Apply reviewed fail-closed repair and replace stale packaged contract
        shell: bash
        run: |
          set -euo pipefail
          PATCH='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/repair.patch'
          DONOR_TEST='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/test_failclosed.py'
          ROUTER='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py'
          PROD_TEST='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_r04_l3_rival_gate.py'
          git apply --check "$PATCH"
          git apply "$PATCH"
          cp "$DONOR_TEST" "$PROD_TEST"
          test "$(git hash-object "$PROD_TEST")" = 'b572bb0adad3b8ca53100d4d44b35c5a374e8302'
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_r04_l3_rival_gate.py',
          ):
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          PY

      - name: Run production-path fail-closed predecessors
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v overlay/checks/test_v3_r04_l3_rival_gate.py |& tee /tmp/l3-production-tests.log
          grep -F 'Ran 17 tests' /tmp/l3-production-tests.log
          grep -F 'OK' /tmp/l3-production-tests.log

      - name: Regenerate package through immutable-base builder and preserve shipped stack
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B build_v3.py | tee /tmp/l3-build.log
          python -B build_v3.py --check | tee /tmp/l3-build-check.log
          grep -F 'V3 BUILD' /tmp/l3-build.log
          grep -F 'V3 CHECK OK' /tmp/l3-build-check.log
          rm -rf /tmp/l3-materialized
          python -B build_v3.py --tree /tmp/l3-materialized | tee /tmp/l3-tree.log
          (
            cd /tmp/l3-materialized
            python -B -m unittest -v checks/test_v3_r04_l3_rival_gate.py |& tee /tmp/l3-materialized-tests.log
          )
          grep -F 'Ran 17 tests' /tmp/l3-materialized-tests.log
          grep -F 'OK' /tmp/l3-materialized-tests.log
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('/tmp/l3-materialized/TITAN-CONFIG.json').read_text())
          assert cfg['r04_strawberry_topup'] is True
          assert cfg['r04_no_late_sale_advance'] is True
          assert cfg['r04_no_late_sale_advance_step'] == 648
          assert cfg['r04_sale_fertilizer'] is True
          assert cfg['r04_cattle_early'] is True
          assert cfg['r04_sale_horizon'] == 8
          assert cfg['r04_b5_carrot_fertilizer'] is True
          assert cfg['r04_b5_jit_fertilize'] is True
          print('L3_CONFIG_PRESERVED_OK_B5_JIT')
          PY
          rm -rf dist

      - name: Install permanent read-only exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/titan-v31-current-l3-failclosed-package.yml <<'YAML'
          name: TITAN V3.1 current L3 fail-closed package gate

          on:
            pull_request:
              branches:
                - astra/v31-a612-restore-5f6-canonical-archive-20260911
                - titan/v3.1-20260911
              paths:
                - '.github/workflows/titan-v31-current-l3-failclosed-package.yml'
                - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py'
                - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_r04_l3_rival_gate.py'
                - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/FILES.json'
                - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            exact-source-package-custody:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Checkout exact event head
                  uses: actions/checkout@v4
                  with:
                    ref: __EVENT_HEAD_EXPR__
                    fetch-depth: 0

                - name: Bind exact PR base, live base, final scope, and shipped bytes
                  shell: bash
                  run: |
                    set -euo pipefail
                    EXPECTED_BASE='__EVENT_BASE_EXPR__'
                    EXPECTED_HEAD='__EVENT_HEAD_EXPR__'
                    BASE_REF='__EVENT_BASE_REF_EXPR__'
                    ROUTER='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py'
                    PROD_TEST='revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_r04_l3_rival_gate.py'
                    test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
                    test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
                    git fetch --no-tags origin "$BASE_REF"
                    test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"
                    test "$(git hash-object "$ROUTER")" = '__POST_BOOTSTRAP_ROUTER_BLOB__'
                    test "$(git hash-object "$PROD_TEST")" = 'b572bb0adad3b8ca53100d4d44b35c5a374e8302'
                    test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/apply_v3.py)" = 'a43d6c470ab05d87803fb016966d1cc54fab9d17'
                    test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/build_v3.py)" = '528cfabbe377f829cb584726c41bd2f64061373b'
                    test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_h4_strawberry.py)" = 'd6e3ffb76856ff171dab2a45b4d3c1788f2b2cb8'
                    test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_no_late_sale_advance.py)" = 'fb26e2ca9985cc65b1127f4eec654fb5cb2a3df0'
                    test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/b5_fertilize.py)" = '2a9d606835b0d04d832a4737dcb381ad3fbef1ae'
                    test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/jit_pass_fertilize.py)" = '6ef7ddcd9590e3cb3f55ceb708b8026235d59410'
                    git diff --name-only "$EXPECTED_BASE"..HEAD > /tmp/l3-final-paths.txt
                    python - <<'PY'
                    from pathlib import Path
                    actual = set(Path('/tmp/l3-final-paths.txt').read_text().splitlines())
                    expected = {
                        '.github/workflows/titan-v31-current-l3-failclosed-package.yml',
                        'revenue/kaggriculture/cloud-execution-lab/candidates/v3/FILES.json',
                        'revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json',
                        'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py',
                        'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_r04_l3_rival_gate.py',
                    }
                    if actual != expected:
                        raise SystemExit(f'final L3 scope drift: {sorted(actual)!r}')
                    print('L3_FINAL_SCOPE_OK', len(actual))
                    PY

                - name: Run fail-closed contracts and verify deterministic package
                  working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
                  shell: bash
                  run: |
                    set -euo pipefail
                    python -B -m unittest -v overlay/checks/test_v3_r04_l3_rival_gate.py |& tee /tmp/l3-tests.log
                    grep -F 'Ran 17 tests' /tmp/l3-tests.log
                    grep -F 'OK' /tmp/l3-tests.log
                    python -B build_v3.py --check | tee /tmp/l3-check.log
                    grep -F 'V3 CHECK OK' /tmp/l3-check.log
                    rm -rf /tmp/l3-final-tree
                    python -B build_v3.py --tree /tmp/l3-final-tree
                    (
                      cd /tmp/l3-final-tree
                      python -B -m unittest -v checks/test_v3_r04_l3_rival_gate.py |& tee /tmp/l3-tree-tests.log
                    )
                    grep -F 'Ran 17 tests' /tmp/l3-tree-tests.log
                    grep -F 'OK' /tmp/l3-tree-tests.log
                    python - <<'PY'
                    import json
                    from pathlib import Path
                    cfg = json.loads(Path('/tmp/l3-final-tree/TITAN-CONFIG.json').read_text())
                    assert cfg['r04_strawberry_topup'] is True
                    assert cfg['r04_no_late_sale_advance'] is True
                    assert cfg['r04_no_late_sale_advance_step'] == 648
                    assert cfg['r04_sale_fertilizer'] is True
                    assert cfg['r04_cattle_early'] is True
                    assert cfg['r04_sale_horizon'] == 8
                    assert cfg['r04_b5_carrot_fertilizer'] is True
                    assert cfg['r04_b5_jit_fertilize'] is True
                    print('L3_FINAL_CONFIG_OK_B5_JIT')
                    PY

                - name: Prove checkout stayed clean
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -z "$(git status --porcelain)"
          YAML
          ROUTER_BLOB="$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py)"
          ROUTER_BLOB="$ROUTER_BLOB" python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('.github/workflows/titan-v31-current-l3-failclosed-package.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '__EVENT_HEAD_EXPR__': '$' + '{{ github.event.pull_request.head.sha || github.sha }}',
              '__EVENT_BASE_EXPR__': '$' + '{{ github.event.pull_request.base.sha }}',
              '__EVENT_BASE_REF_EXPR__': '$' + '{{ github.event.pull_request.base.ref }}',
              '__POST_BOOTSTRAP_ROUTER_BLOB__': os.environ['ROUTER_BLOB'],
          }
          router = replacements['__POST_BOOTSTRAP_ROUTER_BLOB__']
          if len(router) != 40 or any(ch not in '0123456789abcdef' for ch in router):
              raise SystemExit(f'invalid repaired router blob {router!r}')
          expected_counts = {
              '__EVENT_HEAD_EXPR__': 2,
              '__EVENT_BASE_EXPR__': 1,
              '__EVENT_BASE_REF_EXPR__': 1,
              '__POST_BOOTSTRAP_ROUTER_BLOB__': 1,
          }
          for token, count in expected_counts.items():
              if text.count(token) != count:
                  raise SystemExit(f'unexpected template token count {token}: {text.count(token)} != {count}')
          for token, value in replacements.items():
              text = text.replace(token, value)
          if any(token in text for token in replacements):
              raise SystemExit('unresolved permanent-gate template token')
          path.write_text(text, encoding='utf-8')
          print('L3_PERMANENT_GATE_TEMPLATE_OK', router)
          PY

      - name: Collapse bootstrap to final production delta
        shell: bash
        run: |
          set -euo pipefail
          BASE='6e5e3c7cc5302d6db4b702cc4fd7c8ca721d7b8a'
          git rm .github/workflows/titan-v31-8e3-l3-failclosed-bootstrap.yml
          git rm revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/repair.patch
          git rm revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/l3_failclosed_consume_8e3/test_failclosed.py
          git add \
            .github/workflows/titan-v31-current-l3-failclosed-package.yml \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/FILES.json \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_r04_l3_rival_gate.py
          git diff --cached --name-only "$BASE" > /tmp/l3-final-staged.txt
          python - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/l3-final-staged.txt').read_text().splitlines())
          expected = {
              '.github/workflows/titan-v31-current-l3-failclosed-package.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/FILES.json',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/V3-MANIFEST.json',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/checks/test_v3_r04_l3_rival_gate.py',
          }
          if actual != expected:
              raise SystemExit(f'final staged scope drift: {sorted(actual)!r}')
          print('L3_FINAL_STAGED_SCOPE_OK', len(actual))
          PY
          git diff --cached --check

      - name: Commit only after exact remote-head compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD='${{ github.event.pull_request.head.sha }}'
          HEAD_REF='${{ github.event.pull_request.head.ref }}'
          REMOTE_BEFORE="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          test "$REMOTE_BEFORE" = "$EXPECTED_HEAD"
          git config user.name 'Astra Titan Integration'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'TITAN V3.1: make rival-gated L3 fail closed on current B5+JIT stack'
          FINAL_HEAD="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "FINAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          echo "L3 production consumer pushed $FINAL_HEAD"
