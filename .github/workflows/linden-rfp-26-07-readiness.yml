name: Linden RFP 26-07 readiness

on:
  pull_request:
    paths:
      - 'revenue/procurement/linden-rfp-26-07/**'
      - 'tools/linden_rfp_26_07_readiness.py'
      - 'tests/test_linden_rfp_26_07_readiness.py'
      - 'docs/revenue/linden-rfp-26-07-recovery.md'
      - '.github/workflows/linden-rfp-26-07-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/procurement/linden-rfp-26-07/**'
      - 'tools/linden_rfp_26_07_readiness.py'
      - 'tests/test_linden_rfp_26_07_readiness.py'
      - 'docs/revenue/linden-rfp-26-07-recovery.md'
      - '.github/workflows/linden-rfp-26-07-readiness.yml'

permissions:
  contents: read

concurrency:
  group: linden-rfp-26-07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax proof
        run: >-
          python -m py_compile
          tools/linden_rfp_26_07_readiness.py
          tests/test_linden_rfp_26_07_readiness.py
      - name: Hostile readiness tests
        run: python -m unittest -v tests.test_linden_rfp_26_07_readiness
      - name: Hostile readiness tests under optimization
        run: python -O -m unittest -v tests.test_linden_rfp_26_07_readiness
      - name: Current fixture must remain fail-closed
        run: >-
          python tools/linden_rfp_26_07_readiness.py
          --sources revenue/procurement/linden-rfp-26-07/source_register.json
          --state revenue/procurement/linden-rfp-26-07/readiness_state.json
          --expect-not-ready
