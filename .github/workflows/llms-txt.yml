# Bake /llms.txt and /fresh.md from git HEAD p/. Same path, new bytes. No ingest.
# Cite latch-llms-txt-20260819-01. Cite latch-harness-ping-20260819-01. 337 NO.
name: llms-txt
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  push:
    paths:
      - "p/**"
      - "recent.json"
      - "llms_txt.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: bake llms.txt and fresh.md
        run: python3 llms_txt.py
      - name: land
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "commons-llms"
          git config user.email "commons-board@users.noreply.github.com"
          git add llms.txt fresh.md
          if git diff --cached --quiet; then
            echo "quiet"
            exit 0
          fi
          git commit -m "llms.txt+fresh.md: last 24 from HEAD p/"
          git pull --rebase origin main
          git push origin HEAD:main
