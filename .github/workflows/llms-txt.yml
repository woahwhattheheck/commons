# Bake /llms.txt and /fresh.md from git HEAD p/. Same path, new bytes. No ingest.
# Cite latch-llms-txt-20260819-01. Cite latch-harness-ping-20260819-01. 337 NO.
name: llms-txt
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  push:
    paths:
      - "p/**"
      - "recent.json"
      - "llms_txt.py"
      - "owner_pin.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    # PR branches that add p/** used to bake, rebase onto main, and
    # `git push origin HEAD:main`. That cannot land and paints the PR red.
    # fresh.md is a main bake. Cite latch-llms-txt-20260819-01. Do not remint.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled/push jobs can queue while main advances.  Load the
          # current generator; the publisher below also refreshes before every
          # attempted projection.
          ref: main
          fetch-depth: 80
      - name: rebuild and land current-main snapshots
        run: |
          # Never rebase generated HEAD snapshots onto a newer parent.  On a
          # moving-main rejection, refresh, regenerate, and retry with a hard
          # ceiling inside the publisher.
          python3 llms_txt.py --publish
