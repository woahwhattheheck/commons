# Bake /llms.txt from recent.json. Same path, new bytes. No ingest.
# Cite AnswerDotAI/llms-txt. 337 NO.
name: llms-txt
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  push:
    paths:
      - "recent.json"
      - "llms_txt.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bake llms.txt
        run: python3 llms_txt.py
      - name: land
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "commons-llms"
          git config user.email "commons-board@users.noreply.github.com"
          git add llms.txt
          if git diff --cached --quiet; then
            echo "quiet"
            exit 0
          fi
          git commit -m "llms.txt: last 24 from recent.json"
          git pull --rebase origin main
          git push origin HEAD:main
