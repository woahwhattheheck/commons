name: titan-v31-e7-post-tick-flush

on:
  pull_request:
    branches:
      - 'titan/v3.1-20260911'
      - 'astra/v31-e7-post-town-tick-20260911'
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/e7_post_tick_evening_flush.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/test_e7_post_tick_evening_flush.py'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/e7_post_tick/**'
      - '.github/workflows/titan-v31-e7-post-tick-flush.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact frozen scope and imported blobs
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD='${{ github.event.pull_request.head.sha || github.sha }}'
          BASE='508b342fc46fa91e3d7cdc3f0b7e44934a187c14'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py)" = '21c4f1db0298f8955b1f5ad366bd780a89cad206'
          test "$(git rev-parse HEAD:revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r01_tapes.py)" = 'a43289b9cc5e34a2481fddf652762a7d92f427ef'
          git diff --name-only "$BASE"..HEAD > /tmp/e7-paths.txt
          python - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/e7-paths.txt').read_text().splitlines())
          expected = {
              '.github/workflows/titan-v31-e7-post-tick-flush.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/e7_post_tick_evening_flush.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/test_e7_post_tick_evening_flush.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/e7_post_tick/candidate.py',
          }
          assert actual == expected, (sorted(actual), sorted(expected))
          print('E7 EXACT SCOPE OK', len(actual))
          PY

      - name: Compile and run E7 predecessors
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments
        run: |
          set -euo pipefail
          python -B -m py_compile e7_post_tick_evening_flush.py test_e7_post_tick_evening_flush.py e7_post_tick/candidate.py
          python -B -m unittest -v test_e7_post_tick_evening_flush.py

      - name: Smoke exact evaluator custody and package neutrality
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import importlib.util
          from pathlib import Path
          import build_v3

          candidate = Path('experiments/e7_post_tick/candidate.py').resolve()
          spec = importlib.util.spec_from_file_location('e7_candidate', candidate)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = {
              'r04_sale_horizon': 8,
              'r04_open_roundtrip': 0,
              'r04_row_order': True,
              'r04_native_evening_flush': False,
              'r04_sale_fertilizer': True,
              'r04_cattle_early': True,
              'e7_post_tick_evening_flush': True,
              'control_evening_flush': True,
              'turns_per_day': 24,
              'town_center_sell_interval': 24,
              'official_interpreter_commit': '28b6d8af3ce73926b3d0fda1410c1ddd8384ab8c',
              'official_engine_sha256': 'bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e',
          }
          assert module.E7_EVALUATOR_CONFIG == expected
          assert module.agent.telemetry == {}
          assert not any(name.startswith('experiments/') for name in build_v3.source_shas())
          print('E7 SOURCE GATE OK')
          PY

      - name: Prove checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
