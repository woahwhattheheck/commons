name: titan-v3-whole-seed-land-bootstrap

on:
  push:
    branches:
      - 'gpt56/titan-v3-seed-land-whole-row-composition-20260910-02'

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact whole-seed and land composition
        env:
          SEED_HEAD: eef44eb74e427a2cfd96eedece6f99ed41ad330a
          LAND_HEAD: 69b07cf42d3111469e8523f84efd9014cc30c0a9
          LAND_BRANCH: titan-v3-land-target-successor-12107
          LAB: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$LAND_BRANCH:refs/remotes/origin/$LAND_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$LAND_BRANCH)" = "$LAND_HEAD"
          git show "$LAND_HEAD:$LAB/test_early_capital_real_target.py" \
            > "$RUNNER_TEMP/land-donor.py"

          git apply --check .github/titan-v3-whole-seed-land-source.patch
          git apply .github/titan-v3-whole-seed-land-source.patch
          python3 "$LAB/compose_whole_seed_land_test.py" \
            "$RUNNER_TEMP/land-donor.py" \
            "$LAB/test_early_capital_whole_seed_land_composition.py"
          cp .github/titan-v3-whole-seed-land-final.yml \
            .github/workflows/titan-v3-cumulative-seed-row-allocation.yml
          rm \
            .github/titan-v3-whole-seed-land-source.patch \
            .github/titan-v3-whole-seed-land-final.yml \
            "$LAB/compose_whole_seed_land_test.py"

      - name: Authenticate and prove postimage before publishing
        env:
          SEED_HEAD: eef44eb74e427a2cfd96eedece6f99ed41ad330a
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            early_capital.py \
            test_early_capital.py \
            test_early_capital_executable_prefix.py \
            test_early_capital_cumulative_seed_rows.py \
            test_early_capital_whole_seed_land_composition.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 python3 - <<'PY'
          import importlib
          import unittest

          names = [
              'test_early_capital',
              'test_early_capital_executable_prefix',
              'test_early_capital_cumulative_seed_rows',
              'test_early_capital_whole_seed_land_composition',
          ]
          modules = [importlib.import_module(name) for name in names]
          modules[2].SOURCE_BLOB = (
              '944f769c23f98ed65bfc33bf707452e46f3d7a06'
          )
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.loadTestsFromModule(module)
              for module in modules
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          expected = {
              'revenue/kaggriculture/cloud-execution-lab/early_capital.py':
                  '944f769c23f98ed65bfc33bf707452e46f3d7a06',
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_whole_seed_land_composition.py':
                  'a53795540a375ccb11b3eb0de48fd242dc3bb84b',
              '.github/workflows/titan-v3-cumulative-seed-row-allocation.yml':
                  '150764b36a1afdde2c0a98badfae85cf0b14a225',
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_cumulative_seed_rows.py':
                  '439295e239ae814a98d2ad90fc614dd04a821012',
          }
          for raw, wanted in expected.items():
              data = Path(raw).read_bytes()
              actual = hashlib.sha1(
                  b'blob ' + str(len(data)).encode() + b'\0' + data
              ).hexdigest()
              assert actual == wanted, (raw, actual, wanted)
          allowed = {
              '.github/workflows/titan-v3-cumulative-seed-row-allocation.yml',
              'revenue/kaggriculture/cloud-execution-lab/early_capital.py',
              'revenue/kaggriculture/cloud-execution-lab/test_early_capital_whole_seed_land_composition.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['SEED_HEAD']], text=True
          ).splitlines())
          assert changed == allowed, (changed, allowed)
          subprocess.check_call(['git', 'diff', '--check', os.environ['SEED_HEAD']])
          PY

      - name: Commit authenticated postimage
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Sol Pro'
          git config user.email 'tokenjunkielabs@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'TITAN V3: compose whole-row seed and real land targets'
          git push origin HEAD:${{ github.ref_name }}
