name: titan-v3-seed-land-bootstrap

on:
  push:
    branches:
      - 'gpt56/titan-v3-seed-land-composition-20260910-01'

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact donor composition
        env:
          LAND_HEAD: 69b07cf42d3111469e8523f84efd9014cc30c0a9
          LAND_BRANCH: titan-v3-land-target-successor-12107
          LAB: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$LAND_BRANCH:refs/remotes/origin/$LAND_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$LAND_BRANCH)" = "$LAND_HEAD"
          git show "$LAND_HEAD:$LAB/test_early_capital_real_target.py" \
            > "$RUNNER_TEMP/land-donor.py"

          git apply --check .github/titan-v3-seed-land-source.patch
          git apply .github/titan-v3-seed-land-source.patch
          python3 "$LAB/compose_seed_land_test.py" \
            "$RUNNER_TEMP/land-donor.py" \
            "$LAB/test_early_capital_seed_land_composition.py"
          cp .github/titan-v3-seed-land-final.yml \
            .github/workflows/titan-v3-cumulative-seed-row-allocation.yml
          rm \
            .github/titan-v3-seed-land-source.patch \
            .github/titan-v3-seed-land-final.yml \
            "$LAB/compose_seed_land_test.py"

      - name: Prove the materialized tree before publishing it
        working-directory: revenue/kaggriculture/cloud-execution-lab
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            early_capital.py \
            test_early_capital.py \
            test_early_capital_executable_prefix.py \
            test_early_capital_cumulative_seed_rows.py \
            test_early_capital_seed_land_composition.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 python3 - <<'PY'
          import importlib
          import unittest

          names = [
              'test_early_capital',
              'test_early_capital_executable_prefix',
              'test_early_capital_cumulative_seed_rows',
              'test_early_capital_seed_land_composition',
          ]
          modules = [importlib.import_module(name) for name in names]
          # The parent module is retained byte-exact. Rebind only its source-
          # identity assertion to the authenticated composition postimage.
          modules[2].EARLY_CAPITAL_BLOB = (
              'ff5fee9159dbe0ef7e4f2400de1a35cab03980f8'
          )
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.loadTestsFromModule(module)
              for module in modules
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Commit authenticated postimage
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Sol Pro'
          git config user.email 'tokenjunkielabs@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'TITAN V3: compose certified seed and land allocation'
          git push origin HEAD:${{ github.ref_name }}
