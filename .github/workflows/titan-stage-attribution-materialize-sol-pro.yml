name: TITAN stage-attribution one-shot materializer

on:
  push:
    branches:
      - sol-pro/titan-v3-execution-stage-first-divergence-20260910-01
    paths:
      - .stage-attribution-bootstrap/**
      - .github/workflows/titan-stage-attribution-materialize-sol-pro.yml

permissions:
  contents: write

concurrency:
  group: titan-stage-attribution-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'woahwhattheheck/commons'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ab2c8ff0368e410f175279b0e0299993209c2670
      BRANCH: sol-pro/titan-v3-execution-stage-first-divergence-20260910-01
      DEST: revenue/kaggriculture/cloud-execution-lab/analysis/titan-v3-execution-stage-attribution-sol-pro
      FINAL_WORKFLOW: .github/workflows/titan-v3-execution-stage-first-divergence-sol-pro.yml
      BOOTSTRAP_WORKFLOW: .github/workflows/titan-stage-attribution-materialize-sol-pro.yml
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'

    steps:
      - name: Check out exact transport head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20

      - name: Verify transport, materialize, test, and publish final tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"

          cat > /tmp/chunk-sha256.txt <<'EOF'
          dbe8af7d3689d193c80b14e5d80e78ad3bd65780da2f209df3e7427f613f7333  .stage-attribution-bootstrap/part-00.b64
          2ee72e1dd8d20972d79a872e3b537afa30c44c2d14a1ea1c6d3ac23ccc13f002  .stage-attribution-bootstrap/part-01.b64
          56bdeed1ee8044cc3daee08847bf63624617cbb3fec3c580aabb02495d858f42  .stage-attribution-bootstrap/part-02.b64
          390b36515c7d542df97eb474afa2cc4ee531113d7b6783bd1f5c2455c1cdc132  .stage-attribution-bootstrap/part-03.b64
          b53a1c80fe68e8d5be193caad8531830cf87fd93f9e4f8be736267d5b2791188  .stage-attribution-bootstrap/part-04.b64
          EOF
          sha256sum -c /tmp/chunk-sha256.txt
          cat .stage-attribution-bootstrap/part-*.b64 | base64 --decode > /tmp/stage-attribution.tgz
          echo '98f5c51fba3d4c96b4cf5447712ab97b51f66ba47050a95a36383b2ba4188f0e  /tmp/stage-attribution.tgz' | sha256sum -c -

          rm -rf /tmp/stage-attribution-unpack
          mkdir /tmp/stage-attribution-unpack
          tar -xzf /tmp/stage-attribution.tgz -C /tmp/stage-attribution-unpack
          find /tmp/stage-attribution-unpack -type f -printf '%P\n' | LC_ALL=C sort > /tmp/actual-members.txt
          cat > /tmp/expected-members.txt <<'EOF'
          README.md
          SOURCE-PINS.json
          stage_attribution.py
          test_stage_attribution.py
          workflow.yml
          EOF
          LC_ALL=C sort -o /tmp/expected-members.txt /tmp/expected-members.txt
          diff -u /tmp/expected-members.txt /tmp/actual-members.txt
          test -z "$(find /tmp/stage-attribution-unpack -type l -print -quit)"

          mkdir -p "$DEST" "$(dirname "$FINAL_WORKFLOW")"
          install -m 0644 /tmp/stage-attribution-unpack/README.md "$DEST/README.md"
          install -m 0644 /tmp/stage-attribution-unpack/SOURCE-PINS.json "$DEST/SOURCE-PINS.json"
          install -m 0644 /tmp/stage-attribution-unpack/stage_attribution.py "$DEST/stage_attribution.py"
          install -m 0644 /tmp/stage-attribution-unpack/test_stage_attribution.py "$DEST/test_stage_attribution.py"
          install -m 0644 /tmp/stage-attribution-unpack/workflow.yml "$FINAL_WORKFLOW"

          python "$DEST/stage_attribution.py" verify-pins \
            --root "$GITHUB_WORKSPACE" \
            --pins "$DEST/SOURCE-PINS.json" \
            --output /tmp/source-receipt.json
          (
            cd "$DEST"
            python -B -m py_compile stage_attribution.py test_stage_attribution.py
            python -B -m unittest -v test_stage_attribution.py
          )

          rm -rf .stage-attribution-bootstrap
          rm -f "$BOOTSTRAP_WORKFLOW"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git config user.name 'SOL PRO stage-attribution carrier'
          git config user.email 'tokenjunkielabs@gmail.com'
          git commit -m 'test(titan): attribute first selected-runtime divergence'
          git push origin "HEAD:refs/heads/$BRANCH"
