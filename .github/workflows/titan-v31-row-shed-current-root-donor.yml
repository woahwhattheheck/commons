name: TITAN V3.1 row-shed current-root donor

on:
  pull_request:
    paths:
      - ".github/workflows/titan-v31-row-shed-current-root-donor.yml"
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-donor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact 8e3 ancestry and donor scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=8e3d92a286806f9f9525973ee7d359b629a11487
          TARGET=revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE:$TARGET")" = 7edacbfb4916b8f241b689ded6643240ca02a9ec
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/titan-v31-row-shed-current-root-donor.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root/README.md',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root/repair.patch',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/row_shed_current_root/test_repair.py',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '8e3d92a286806f9f9525973ee7d359b629a11487..HEAD'],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'donor scope drift: {sorted(actual)}')
          PY

      - name: Apply exact donor and run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=revenue/kaggriculture/cloud-execution-lab/candidates/v3
          TARGET="$ROOT/overlay/r04_full_router.py"
          PATCH="$ROOT/experiments/row_shed_current_root/repair.patch"
          TEST="$ROOT/experiments/row_shed_current_root/test_repair.py"
          git apply --check "$PATCH"
          git apply "$PATCH"
          test "$(git diff --name-only)" = "$TARGET"
          git diff --check
          python -B -m py_compile "$TARGET" "$TEST"
          python -B "$TEST" -v
          git checkout -- "$TARGET"
          test -z "$(git status --porcelain)"
