name: TITAN V4 WF1 current-native field gate
on:
  pull_request:
    paths:
      - revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/gameplay/wf1-wheat-fertilize/**
      - .github/workflows/titan-v4-wf1-field.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: titan-v4-wf1-field-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  current-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate source postimage
        shell: bash
        run: |
          set -euo pipefail
          SRC=revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/gameplay/wf1-wheat-fertilize
          test "$(git hash-object "$SRC/r04_wheat_fert.py")" = b35a30431f64c1d6b40d1d599190338a9d50b555
          test "$(git hash-object "$SRC/wf1_current_adapter.py")" = 5b8f4c0144ce43ae449373a6a188ce03409a16ee
          python -B -m py_compile "$SRC/r04_wheat_fert.py" "$SRC/wf1_current_adapter.py" "$SRC/wf1_native_entry.py" "$SRC/run_wf1_current_field.py"
      - name: Focused current-source regressions
        shell: bash
        run: |
          set -euo pipefail
          SRC=revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/gameplay/wf1-wheat-fertilize
          pushd "$SRC"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v test_r04_wheat_fert_recovery test_wf1_current_adapter test_wf1_selected_collision
          PYTHONDONTWRITEBYTECODE=1 python -OB -m unittest -v test_r04_wheat_fert_recovery test_wf1_current_adapter test_wf1_selected_collision
          popd
      - name: Recover authenticated canonical runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=10180428228
          ZIP="$RUNNER_TEMP/wf1-canonical.zip"
          EXTRACT="$RUNNER_TEMP/wf1-artifact"
          RUNTIME="$RUNNER_TEMP/wf1-runtime"
          mkdir -p "$EXTRACT" "$RUNTIME"
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$ZIP"
          echo "737c0b2b69147a826d1000f3b2266b70a579fffd0ab91d4126c6c9a84159d799  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$EXTRACT"
          TAR="$EXTRACT/checked-package/exports/titan-current.tar.gz"
          echo "b567942e4fb4e0571ebf9f8eaaf143d4a9156df3289f09a98db37823ef4d68d9  $TAR" | sha256sum -c -
          tar -xzf "$TAR" -C "$RUNTIME"
          test "$(sha256sum "$RUNTIME/main.py" | awk '{print $1}')" = c4c22d0f2b1071cadf6a9f74effccc8cb20ea9f4d10ca1cf9f1fe57351709dc1
          SRC="$GITHUB_WORKSPACE/revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/gameplay/wf1-wheat-fertilize"
          cp "$SRC/r04_wheat_fert.py" "$RUNTIME/r04_wheat_fert.py"
          cp "$SRC/wf1_current_adapter.py" "$RUNTIME/wf1_current_adapter.py"
          cp "$SRC/wf1_native_entry.py" "$RUNTIME/wf1_native_entry.py"
          printf 'WF1_RUNTIME=%s\n' "$RUNTIME" >> "$GITHUB_ENV"
          printf 'WF1_RESULTS=%s\n' "$RUNNER_TEMP/wf1-results" >> "$GITHUB_ENV"
      - name: Paired both-seat current-native gate
        shell: bash
        run: |
          set -euo pipefail
          SRC=revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/gameplay/wf1-wheat-fertilize
          mkdir -p "$WF1_RESULTS"
          PYTHONDONTWRITEBYTECODE=1 python -B "$SRC/run_wf1_current_field.py" \
            --runtime "$WF1_RUNTIME" \
            --output "$WF1_RESULTS" \
            --seeds 2026091201,2026091207,2026091213,2026091219 \
            | tee "$WF1_RESULTS/summary.log"
      - name: Pin checkout and source hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WF1_RESULTS"
          git rev-parse HEAD > "$WF1_RESULTS/checkout-commit.txt"
          SRC=revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/gameplay/wf1-wheat-fertilize
          sha256sum "$SRC/r04_wheat_fert.py" "$SRC/wf1_current_adapter.py" "$SRC/wf1_native_entry.py" "$SRC/run_wf1_current_field.py" > "$WF1_RESULTS/source-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-v4-wf1-current-field-${{ github.run_id }}
          path: ${{ env.WF1_RESULTS }}
          retention-days: 14
          if-no-files-found: error
