name: TITAN V3 T02 land-unlock JIT census

on:
  workflow_dispatch:
  push:
    branches:
      - sol-terrace/titan-v3-t02-land-unlock-jit-20260910-01
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3-t02-land-unlock-jit-sol-terrace/**"
      - ".github/workflows/titan-v3-t02-land-unlock-jit-sol-terrace.yml"
      - "p/sol-terrace-titan-v3-t02-land-unlock-jit-20260910-01.md"
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v3-t02-land-unlock-jit-sol-terrace/**"
      - ".github/workflows/titan-v3-t02-land-unlock-jit-sol-terrace.yml"
      - "p/sol-terrace-titan-v3-t02-land-unlock-jit-20260910-01.md"

permissions:
  contents: read

concurrency:
  group: titan-v3-t02-land-unlock-jit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-bound-census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pure contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3-t02-land-unlock-jit-sol-terrace
        run: python -m unittest -v test_land_unlock_jit.py

      - name: Exact-current route census
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3-t02-land-unlock-jit-sol-terrace
        run: python audit_current_routes.py --output CURRENT-CENSUS.json --require-relocation

      - name: Validate census schema and source binding
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3-t02-land-unlock-jit-sol-terrace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("CURRENT-CENSUS.json").read_text())
          assert report["schema"] == "titan.t02.land-unlock-jit.census.v1"
          expected_routes = [
              "7015cc00acfa4922",
              "a84d06f1d12add7c",
              "ab9669b9abfbea4e",
              "dc76e4003029ac51",
          ]
          assert report["route_count"] == 4
          assert report["source"]["route_ids"] == expected_routes
          assert report["source"]["route_lengths"] == {key: 720 for key in expected_routes}
          assert report["source"]["route_bank_sha256"] == (
              "4d1f8382d971e5baa815c614241e85473ae82018886e62e08b13375cbe01e76c"
          )
          assert report["purchase_count"] == len(report["purchases"]) == 8
          assert report["relocation_count"] == len(report["relocations"]) == 4
          assert report["routes_with_relocations"] == expected_routes
          assert set(report["source"]["git_blobs"]) == {
              "frozen_selected.py",
              "scheduler.py",
              "mechanics.py",
              "reference/next-panel/vendor/arlene.py",
          }
          for item in report["relocations"]:
              assert item["purchase_step"] == 150
              assert item["purchase_slot"] == 4
              assert item["target_step"] == 154
              assert item["target_slot"] == 1
              assert item["target_kind"] == "append_capacity"
              assert item["target_quadrant"] == "NE"
              assert item["first_effect_step"] == 155
              assert item["first_effect_worker"] == 0
              assert item["first_effect_action"] == ["BUILD_PASTURE"]
              assert item["first_effect_position"] == [5, 3]
              assert item["saved_cash_turns"] == 4
          signatures = {}
          for item in report["purchases"]:
              key = (
                  item["purchase_step"], item["purchase_slot"], item["target_quadrant"],
                  item["first_effect_step"], tuple(item["first_effect_action"] or []),
              )
              signatures[key] = signatures.get(key, 0) + 1
          assert signatures == {
              (150, 4, "NE", 155, ("BUILD_PASTURE",)): 4,
              (265, 7, "SW", 266, ("PLANT", "STRAWBERRY")): 4,
          }
          assert report["summary"]["target_kinds"] == {"append_capacity": 4}
          print(json.dumps(report["summary"], sort_keys=True))
          PY

      - name: Upload exact census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-t02-land-unlock-jit-census
          path: revenue/kaggriculture/cloud-execution-lab/candidates/v3-t02-land-unlock-jit-sol-terrace/CURRENT-CENSUS.json
          if-no-files-found: error
          retention-days: 14
