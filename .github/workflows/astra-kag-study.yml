name: ASTRA frozen Kaggriculture study
on:
  push:
    branches: [main, build/astra-kag-improve-20260907]
    paths:
      - revenue/kaggriculture/cloud-market/**
      - .github/workflows/astra-kag-study.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          persist-credentials: false
          sparse-checkout: |
            revenue/kaggriculture
            .github/scripts
      - name: Prepare frozen device-team sources and official engine
        run: |
          mkdir -p "$RUNNER_TEMP/kag-study"
          python -B revenue/kaggriculture/cloud-market/study.py prepare --root "$RUNNER_TEMP/kag-study"
          cp revenue/kaggriculture/20260907-offline-agent/LICENSE* "$RUNNER_TEMP/kag-study/peer/"
          docker pull python:3.11-slim
          docker image inspect python:3.11-slim --format '{{.Id}}' > "$RUNNER_TEMP/kag-study/runtime-image.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/kag-study/checkout.txt"
      - name: Discover available Commons capabilities without device writes
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          url='https://commons-spark-mcp.vercel.app/mcp'
          headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}
          def call(method,params,i):
              req=urllib.request.Request(url,json.dumps({'jsonrpc':'2.0','id':i,'method':method,'params':params}).encode(),headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  session=response.headers.get('mcp-session-id')
                  if session: headers['mcp-session-id']=session
                  text=response.read().decode()
              if text.lstrip().startswith('{'): return json.loads(text)
              for line in text.splitlines():
                  if line.startswith('data: '):
                      value=json.loads(line[6:])
                      if value.get('id')==i: return value
              raise RuntimeError('No matching MCP response')
          call('initialize',{'protocolVersion':'2024-11-05','capabilities':{},'clientInfo':{'name':'astra-kag-study','version':'1'}},1)
          tools=call('tools/list',{},2)['result']['tools']
          tool=next(t for t in tools if t['name']=='discover_commons_capabilities')
          if tool.get('inputSchema',{}).get('required'):
              result={'tool_schema':tool,'status':'required_arguments_need_inspection'}
          else:
              result=call('tools/call',{'name':tool['name'],'arguments':{}},3)
          Path(os.environ['RUNNER_TEMP'],'kag-study','commons-discovery.json').write_text(json.dumps(result,indent=2))
          print('Commons capability discovery response retained; no device command executed.')
          PY
      - name: Tests then development selection then untouched validation offline
        run: |
          IMAGE=$(cat "$RUNNER_TEMP/kag-study/runtime-image.txt")
          docker run --rm --network none --read-only --cpus 1.6 --memory 6656m \
            --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            -v "$GITHUB_WORKSPACE/revenue/kaggriculture:/work:ro" \
            -v "$RUNNER_TEMP/kag-study:/results:rw" \
            -e KAG_EVAL_ENGINE_DIR=/results/engine -e PYTHONDONTWRITEBYTECODE=1 \
            -e KAG_RUNTIME_IMAGE="$IMAGE" -w /work "$IMAGE" sh -ec '
              cd /work/cloud-eval
              python -B test_evaluator.py > /results/evaluator-tests.log 2>&1 || { cat /results/evaluator-tests.log; exit 1; }
              cd /work/cloud-market
              python -B test_study.py > /results/study-tests.log 2>&1 || { cat /results/study-tests.log; exit 1; }
              python -B study.py development --root /results
              python -B study.py validation --root /results
            '
      - name: Current main readback
        if: github.ref == 'refs/heads/main'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          git fetch --filter=blob:none --depth=100 origin main
          git diff --exit-code HEAD origin/main -- revenue/kaggriculture/cloud-market .github/workflows/astra-kag-study.yml
          python .github/scripts/audit_git_terminal.py --target-ref origin/main --expected-commit "$EXPECTED_COMMIT" --required-path revenue/kaggriculture/cloud-market/study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-kag-study-${{ github.run_id }}
          path: ${{ runner.temp }}/kag-study/
          retention-days: 30
          if-no-files-found: error
