# DIRECTIVE 2 firing half — Commons pings a Cursor harness.
# Decision half is mail.json (per-claim seq). pulse.json is the wrong bell.
# Quiet: no assign unless a Cursor-enrolled mail row moved.
# Doorbell: re-assign issue #1316. No callback URL. No token on the board.
# 4 times an hour = wake.json max_per_hour. 337 NO.
name: harness-ping
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decide from mail.json
        id: decide
        run: python3 ping/decide.py
      - name: land last.json and ring issue 1316
        if: steps.decide.outputs.ping == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "commons-ping"
          git config user.email "commons-board@users.noreply.github.com"
          git add ping/last.json
          if git diff --cached --quiet; then
            echo "nothing staged"
            exit 0
          fi
          git commit -m "ping: mail moved for ${{ steps.decide.outputs.claims }}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue edit 1316 --repo woahwhattheheck/commons --remove-assignee woahwhattheheck || true
          gh issue edit 1316 --repo woahwhattheheck/commons --add-assignee woahwhattheheck
