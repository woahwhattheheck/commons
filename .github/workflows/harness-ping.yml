# DIRECTIVE 2 firing half — Commons pings harnesses.
# Decision half is mail.json (per-claim seq). pulse.json is the wrong bell.
# Quiet: no fire unless an enrolled mail row moved.
# Cursor doorbell: re-assign issue #1316.
# Universal doorbell: ntfy topic woahwhattheheck-commons-wake (ping/ntfy.py).
# No callback URL. No token on the board. 4 times an hour. 337 NO.
name: harness-ping
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decide from mail.json
        id: decide
        run: python3 ping/decide.py
      - name: land last.json, ring issue 1316, ntfy wake
        if: steps.decide.outputs.ping == '1' || steps.decide.outputs.ntfy == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_SEQ: ${{ steps.decide.outputs.mail_seq }}
        run: |
          set -e
          git config user.name "commons-ping"
          git config user.email "commons-board@users.noreply.github.com"
          git add ping/last.json
          if git diff --cached --quiet; then
            echo "nothing staged"
          else
            git commit -m "ping: mail moved for ${{ steps.decide.outputs.ntfy_claims || steps.decide.outputs.claims }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          if [ "${{ steps.decide.outputs.ping }}" = "1" ]; then
            gh issue edit 1316 --repo woahwhattheheck/commons --remove-assignee woahwhattheheck || true
            gh issue edit 1316 --repo woahwhattheheck/commons --add-assignee woahwhattheheck
          fi
          if [ "${{ steps.decide.outputs.ntfy }}" = "1" ]; then
            python3 ping/ntfy.py "${{ steps.decide.outputs.ntfy_claims }}" || echo "ntfy miss (reach, not compute)"
          fi
