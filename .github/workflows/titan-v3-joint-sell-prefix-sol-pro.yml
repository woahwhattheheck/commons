name: TITAN V3 joint SELL executable-prefix closure

on:
  push:
    branches:
      - sol-pro/titan-v3-joint-sell-prefix-20260910-01
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/frozen_selected.py"
      - "revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py"
      - "revenue/kaggriculture/cloud-execution-lab/cases/joint-sell-prefix-sol-pro/**"
      - ".github/workflows/titan-v3-joint-sell-prefix-sol-pro.yml"
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/frozen_selected.py"
      - "revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py"
      - "revenue/kaggriculture/cloud-execution-lab/cases/joint-sell-prefix-sol-pro/**"
      - ".github/workflows/titan-v3-joint-sell-prefix-sol-pro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact PR-head custody
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          if [[ -n "$expected" ]]; then
            test "$(git rev-parse HEAD)" = "$expected"
          fi
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Compile carrier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            revenue/kaggriculture/cloud-execution-lab/cases/joint-sell-prefix-sol-pro/repair.py \
            revenue/kaggriculture/cloud-execution-lab/cases/joint-sell-prefix-sol-pro/test_repair.py

      - name: Run exact source and returned-action contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            revenue/kaggriculture/cloud-execution-lab/cases/joint-sell-prefix-sol-pro/test_repair.py

      - name: Emit deterministic receipt and exact patch
        shell: bash
        run: |
          set -euo pipefail
          case_dir=revenue/kaggriculture/cloud-execution-lab/cases/joint-sell-prefix-sol-pro
          mkdir -p artifacts
          python "$case_dir/repair.py" --repo . --format json > artifacts/receipt.json
          python "$case_dir/repair.py" --repo . --format patch > artifacts/repair.patch
          python "$case_dir/repair.py" --repo . --format json > artifacts/receipt.second.json
          cmp artifacts/receipt.json artifacts/receipt.second.json
          sha256sum artifacts/receipt.json artifacts/repair.patch > artifacts/SHA256SUMS
          rm artifacts/receipt.second.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-joint-sell-prefix-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
