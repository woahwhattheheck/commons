name: Astra SOL Puzzle71 Current Review
on:
  push:
    branches:
      - astra-sol/puzzle71-review-run-20260909-01

permissions:
  contents: read

jobs:
  current-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin superseding live-instrument blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object host/muhl_puzzle71_organs_add.py)" = "9128536487cb20181bf4dc96605a23a515ba9854"
          test "$(git hash-object host/muhl_puzzle71_fire_add.py)" = "72e8544056c248b56975317887f39494798ff731"
          test "$(git hash-object test_muhl_puzzle71_organs.py)" = "156ad8cb91a199ceb52bef7243c7b509ca139c36"
          test "$(git hash-object test_muhl_puzzle71_live_instrument.py)" = "d02db36fd9b75a84a223bbda841d7b89dd2cffd3"
          printf 'BLOB_PINS_OK\n'
      - name: Compile bounded helpers and tests
        run: python3 -m py_compile host/muhl_puzzle71_organs_add.py host/muhl_puzzle71_fire_add.py host/muhl_puzzle71_organs_cloud.py host/muhl_puzzle71_fire_cloud.py test_muhl_puzzle71_organs.py test_muhl_puzzle71_live_instrument.py
      - name: Run synthetic and live-instrument boundary tests
        run: python3 -B -m unittest -v test_muhl_puzzle71_organs.py test_muhl_puzzle71_live_instrument.py
      - name: Prove evidence carrier is workflow-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD^ -- . ':(exclude).github/workflows/astra-sol-puzzle71-current-review.yml'
