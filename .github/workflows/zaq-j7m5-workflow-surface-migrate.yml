name: zaq-j7m5-workflow-surface-migrate
on:
  push:
    branches:
      - 'zaq-j7m5/workflow-surface-14644'
    paths:
      - '.github/workflows/zaq-j7m5-workflow-surface-migrate.yml'
      - 'tools/zaq_j7m5_workflow_surface_migrate.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fence workflow-surface authority against moving main
        run: |
          set -euo pipefail
          BASE='3a02f826e634a5f43d752d54b033e313397116f1'
          git fetch origin main
          git merge-base --is-ancestor "$BASE" origin/main || {
            echo "origin/main is no longer descended from recovery base $BASE" >&2
            exit 1
          }
          if ! git diff --quiet "$BASE"..origin/main -- \
            .github/workflows \
            ci/workflow-surface.json \
            ci/workflow-recipes \
            host/workflow_surface.py \
            test_workflow_surface.py; then
            echo 'workflow-surface authority paths changed on main after recovery branch cut; abort instead of rebasing or guessing' >&2
            git diff --name-status "$BASE"..origin/main -- \
              .github/workflows \
              ci/workflow-surface.json \
              ci/workflow-recipes \
              host/workflow_surface.py \
              test_workflow_surface.py >&2
            exit 1
          fi
          echo "fenced_recovery_base=$BASE"
          echo "observed_origin_main=$(git rev-parse origin/main)"
      - name: Install structural parser
        run: python -m pip install PyYAML==6.0.3
      - name: Migrate escaped workflows into exact-byte recipes
        run: python -B tools/zaq_j7m5_workflow_surface_migrate.py
      - name: Run hostile structural unit suite
        run: python -B -m unittest -v test_workflow_surface.py
      - name: Verify bounded active surface and archive inventory
        run: python -B host/workflow_surface.py check
      - name: Reject whitespace damage
        run: git diff --check
      - name: Commit exact migration to recovery branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'Z-AuroraQuarry-0821-J7M5'
          git config user.email 'zaq-j7m5@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'migration produced no changes' >&2; exit 1; }
          git commit -m 'ci: restore bounded workflow surface and recipe integrity (#14644)'
          git push origin HEAD:"$BRANCH"
