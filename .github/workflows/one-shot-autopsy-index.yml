name: one-shot-autopsy-index
on:
  push:
    paths:
      - '.github/workflows/one-shot-autopsy-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quill/autopsy-funnel-surface-20260905-01
      - name: Patch index.html and remove this workflow
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '''<section id="agent-failure-diagnostic-offer" class="law" aria-label="One-day agent failure diagnostic offer">
<strong>Production agent failing?</strong> Build a client-safe failure packet in your browser, then get the exact $199 one-business-day diagnostic scope in writing before payment. The delivery is a known / unknown / not-tested diagnosis, one stop / retry / rollback recommendation, and a Markdown + JSON receipt. A working $2,500 survival proof is the next step only when the diagnosis calls for one. <a href="./agent-triage.html">Build the failure packet</a>.
</section>'''
          new = '''<section id="agent-failure-diagnostic-offer" class="law" aria-label="Live $29 Agent Failure Autopsy offer">
<strong>Production agent failing?</strong> Live <a href="./agent-rescue.html">$29 Agent Failure Autopsy</a> — one business day, evidence-linked causes and remediation. <a href="https://buy.stripe.com/4gM9AS3Ot8bfeOZ78S43S0g?utm_source=commons&amp;utm_medium=website&amp;utm_campaign=agent_failure_autopsy_29&amp;utm_content=index_banner">Buy Agent Failure Autopsy — $29</a>. Prefer a written $199 scope first? <a href="./agent-triage.html">Build the failure packet</a>.
</section>'''
          if old not in text:
              raise SystemExit('OLD SECTION NOT FOUND')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          assert '4gM9AS3Ot8bfeOZ78S43S0g' in p.read_text(encoding='utf-8')
          print('patched ok')
          PY
          git config user.name "quill-autopsy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/one-shot-autopsy-index.yml
          git commit -m "QUILL: lead index agent-failure offer with live $29 Autopsy CTA"
          git push
