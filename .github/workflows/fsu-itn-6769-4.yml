name: FSU ITN 6769-4 qualification

on:
  pull_request:
    paths:
      - 'revenue/fsu_itn_6769_4/**'
      - '.github/workflows/fsu-itn-6769-4.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/fsu_itn_6769_4/**'
      - '.github/workflows/fsu-itn-6769-4.yml'

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hostile tests
        working-directory: revenue/fsu_itn_6769_4
        run: |
          python -m unittest -v test_qualifier.py
          python -O -m unittest -v test_qualifier.py
      - name: Current public snapshot stays fail-closed
        working-directory: revenue/fsu_itn_6769_4
        run: |
          out="$(mktemp)"
          rm -f "$out"
          state="$(python cli.py compile --source public_snapshot.json --as-of 2026-09-13T10:50:00Z --out "$out")"
          test "$state" = "HOLD_RAW_PACKET_REQUIRED"
          python cli.py verify --source public_snapshot.json --receipt "$out" --as-of 2026-09-13T10:50:00Z | grep -Fx VERIFIED
