name: recon-portfolio
on:
  pull_request:
    paths:
      - 'revenue/recon_portfolio/**'
      - 'tests/test_recon_portfolio.py'
      - '.github/workflows/recon-portfolio.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/recon_portfolio/**'
      - 'tests/test_recon_portfolio.py'
      - '.github/workflows/recon-portfolio.yml'
permissions:
  contents: read
concurrency:
  group: recon-portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile revenue/recon_portfolio/validate.py revenue/recon_portfolio/render.py tests/test_recon_portfolio.py
      - run: python revenue/recon_portfolio/validate.py
      - run: python revenue/recon_portfolio/render.py --check
      - run: python -m unittest tests.test_recon_portfolio -v
      - run: python -O -m unittest tests.test_recon_portfolio -v
