name: titan-v31-artifact-reachability

on:
  pull_request:
    branches:
      - titan/v3.1-20260911
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/**'
      - 'revenue/kaggriculture/cloud-execution-lab/exports/historical/**'
      - '.github/workflows/titan-v31-artifact-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialized-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact package-custody parent and H4 composition scope
        shell: bash
        run: |
          set -euo pipefail
          PARENT=c580f7805cc7468094c0e880f4923133d45d70d0
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor "$PARENT" HEAD
          python - <<'PY'
          import subprocess

          parent = 'c580f7805cc7468094c0e880f4923133d45d70d0'
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', parent, 'HEAD'], text=True
          ).splitlines())
          expected = {
              '.github/workflows/titan-v31-artifact-reachability.yml',
              '.github/workflows/titan-v31-h4-strawberry.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/H4-STRAWBERRY-TOPUP.md',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/check_v31_artifact_reachability.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/test_v31_artifact_reachability.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_strawberry/candidate.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_strawberry/h4_tape_screen.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_strawberry/r04_h4_strawberry.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_strawberry/test_v31_h4_strawberry.py',
          }
          if actual != expected:
              raise SystemExit(f'unexpected H4/reachability composition scope: {sorted(actual)}')

          expected_blobs = {
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/check_v31_artifact_reachability.py': '8316523c060389237bf5faef5990a6c86ab732d9',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/test_v31_artifact_reachability.py': 'd470296569e8b05f2f8f7479f7ad3c5af280df38',
              '.github/workflows/titan-v31-h4-strawberry.yml': '44a3f8ace007e53ebc824ff2cb30f4aaa7953122',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/H4-STRAWBERRY-TOPUP.md': '0798fc828cab046c1ace592cbca2e6af84f82e8b',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_strawberry/candidate.py': '38c09c9cb413f417dc3957f4390ce8bcf9b0e360',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_strawberry/h4_tape_screen.py': '446d3dd1b6016434134f6aa99f08ac20d15d8cb1',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_strawberry/r04_h4_strawberry.py': 'ecad11eb195a82273f73b78ac7b319552a27cbcd',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/h4_strawberry/test_v31_h4_strawberry.py': '8ea684db83c4a2a2e67cb38a30f8c67b0f1ed742',
          }
          for path, expected_sha in expected_blobs.items():
              actual_sha = subprocess.check_output(
                  ['git', 'rev-parse', f'HEAD:{path}'], text=True
              ).strip()
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f'blob drift for {path}: {actual_sha} != {expected_sha}'
                  )
          print('V31_H4_REACHABILITY_SCOPE_OK', len(actual))
          print('V31_H4_COMPOSITION_BLOBS_OK', len(expected_blobs))
          PY

      - name: Run focused reachability predecessors
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v test_v31_artifact_reachability.py |& tee /tmp/v31-reach-unit.log
          grep -F 'Ran 14 tests' /tmp/v31-reach-unit.log
          grep -F 'OK' /tmp/v31-reach-unit.log

      - name: Prove frozen canonical build and runtime reachability
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        shell: bash
        env:
          PYTHONOPTIMIZE: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          import sys
          print(sys.flags.optimize)
          PY
          )" = "0"
          python -B build_v3.py --check |& tee /tmp/v31-build.log
          grep -F 'V3 CHECK OK ' /tmp/v31-build.log
          python -B check_v31_artifact_reachability.py |& tee /tmp/v31-reach.log
          grep -F 'V31 REACHABILITY OK ' /tmp/v31-reach.log

      - name: Prove checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
