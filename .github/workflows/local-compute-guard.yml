name: local-compute-guard

# The placement guard reads this fixed set of rules and compatibility files.
on:
  push:
    branches:
      - main
    paths:
      - 'local_compute_guard.py'
      - 'test_local_compute_guard.py'
      - '.github/workflows/local-compute-guard.yml'
      - 'infra/discord/install_windows_runtime.ps1'
      - 'infra/discord/run_bridge_windows.ps1'
      - 'infra/discord/health_watch_windows_runtime.ps1'
      - 'host/titan_hands/register_codex.ps1'
      - 'muhl/containers/MUHL_VISIBLE/FOUNDRY_FOREVER.bat'
      - 'muhl/containers/MUHL_VISIBLE/muhl_foundry_live.py'
      - '.github/workflows/commons-board.yml'
      - '.github/workflows/commons-discord-cloud.yml'
      - '.github/workflows/muhlnickel-foundry-cloud.yml'
      - 'host/pfc_harness.py'
      - 'infra/host/pfc_harness.py'
      - 'infra/host/sdc_fwd_sdc.py'
      - 'infra/host/sdc_fwd_start.py'
      - 'muhl/desktop/MUHLNICKEL_HARNESSES/pfc_harness.py'
  pull_request:
    paths:
      - 'local_compute_guard.py'
      - 'test_local_compute_guard.py'
      - '.github/workflows/local-compute-guard.yml'
      - 'infra/discord/install_windows_runtime.ps1'
      - 'infra/discord/run_bridge_windows.ps1'
      - 'infra/discord/health_watch_windows_runtime.ps1'
      - 'host/titan_hands/register_codex.ps1'
      - 'muhl/containers/MUHL_VISIBLE/FOUNDRY_FOREVER.bat'
      - 'muhl/containers/MUHL_VISIBLE/muhl_foundry_live.py'
      - '.github/workflows/commons-board.yml'
      - '.github/workflows/commons-discord-cloud.yml'
      - '.github/workflows/muhlnickel-foundry-cloud.yml'
      - 'host/pfc_harness.py'
      - 'infra/host/pfc_harness.py'
      - 'infra/host/sdc_fwd_sdc.py'
      - 'infra/host/sdc_fwd_start.py'
      - 'muhl/desktop/MUHLNICKEL_HARNESSES/pfc_harness.py'
  workflow_dispatch:

concurrency:
  # placement checks the tree at HEAD, never a diff, so a newer push to main
  # (or to the same PR head) supersedes a queued one.  Dispatch keeps run_id.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: keep automatic compute off the owner laptop
        run: python3 local_compute_guard.py
