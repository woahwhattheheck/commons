name: titan-v5-champion-integrate-one-shot

on:
  push:
    branches:
      - sol/v5-paired-economics-release-firewall-clean-20260912

permissions:
  contents: write

concurrency:
  group: titan-v5-champion-integrate-one-shot
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v5-paired-economics-release-firewall-clean-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tighten staging patcher duplicate-line guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/apply_champion_integration.py')
          s = p.read_text(encoding='utf-8')
          old = '    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one source match, found {count}")\n'
          new = '    if count != 1 and not (label == "permanent normal test list" and count == 2):\n        raise SystemExit(f"{label}: expected exactly one source match, found {count}")\n'
          if s.count(old) != 1:
              raise SystemExit('staging patcher guard moved')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply champion integration to working tree
        run: python revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/apply_champion_integration.py
      - name: Compile and run permanent contracts before publication
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B -m py_compile \
            economics_gate.py champion_gate.py release_transaction.py promotion_gate.py \
            test_economics_gate.py test_champion_gate.py test_release_transaction.py test_promotion_gate.py
          python -B -m unittest -v \
            test_economics_gate test_champion_gate test_release_transaction test_promotion_gate
          python -O -B -m unittest -v \
            test_economics_gate test_champion_gate test_release_transaction test_promotion_gate
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Publish only permanent postimage
        env:
          BRANCH: sol/v5-paired-economics-release-firewall-clean-20260912
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/titan-v5-champion-integrate-one-shot.yml
          git rm revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/apply_champion_integration.py
          git add \
            .github/workflows/titan-v5-promotion-release-gates.yml \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/README.md \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/champion_gate.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/test_champion_gate.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/release_transaction.py \
            revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/test_release_transaction.py
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/titan-v5-(promotion-release-gates|champion-integrate-one-shot)\.yml|revenue/kaggriculture/cloud-execution-lab/candidates/v5/promotion-gate/(README\.md|champion_gate\.py|test_champion_gate\.py|release_transaction\.py|test_release_transaction\.py|apply_champion_integration\.py))$' || true)"
          test -z "$unexpected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(v5): make submitted V3.1 champion ratchet release-mandatory"
          git push origin HEAD:"$BRANCH"
