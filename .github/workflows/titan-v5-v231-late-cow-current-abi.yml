name: TITAN V5 V231 late COW current ABI

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/research/v231-late-cow-current-abi/**"
      - ".github/workflows/titan-v5-v231-late-cow-current-abi.yml"
  push:
    branches:
      - "astra/v5-v31-v231-late-cow-current-abi-20260912"
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/v5/research/v231-late-cow-current-abi/**"
      - ".github/workflows/titan-v5-v231-late-cow-current-abi.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and focused contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v5/research/v231-late-cow-current-abi
        run: |
          python -m py_compile v231_late_current.py test_v231_late_current.py
          python -B -m unittest -v test_v231_late_current.py
          python -O -B -m unittest -v test_v231_late_current.py
