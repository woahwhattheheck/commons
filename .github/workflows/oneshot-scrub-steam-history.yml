name: oneshot-scrub-steam-history
on:
  push:
    paths:
      - .github/workflows/oneshot-scrub-steam-history.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oneshot-scrub-steam-history
  cancel-in-progress: false
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install git-filter-repo
        run: pip install git-filter-repo
      - name: Drop STEAM player paths from history
        run: |
          set -euo pipefail
          git config user.name "commons-scrub"
          git config user.email "commons-scrub@users.noreply.github.com"
          git filter-repo --force \
            --path p/steam-took-go-20260905-01.md \
            --path p/steam-answer-the-four-20260905-01.md \
            --path p/steam-clan-mark-20260905-01.md \
            --invert-paths
          # Drop empty commits left by path purge if any
          git filter-repo --force --commit-callback '
msg = commit.message.decode("utf-8", "replace")
if msg.startswith("STEAM —") or msg.startswith("Remove STEAM cards"):
  commit.skip()
'
      - name: Force-push rewritten main
        run: |
          set -euo pipefail
          git remote remove origin || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:refs/heads/main
      - name: Self-delete workflow file
        if: always()
        run: |
          set -euo pipefail
          git checkout main 2>/dev/null || true
          git pull --rebase origin main || true
          if [ -f .github/workflows/oneshot-scrub-steam-history.yml ]; then
            git rm -f .github/workflows/oneshot-scrub-steam-history.yml
            git commit -m "oneshot: remove steam history scrub workflow" || true
            git push origin HEAD:main || true
          fi
