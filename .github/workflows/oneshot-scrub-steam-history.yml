name: oneshot-scrub-steam-history
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oneshot-scrub-steam-history.yml"
permissions:
  contents: write
concurrency:
  group: oneshot-scrub-steam-history-locked
  cancel-in-progress: false
jobs:
  scrub:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'oneshot:')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install git-filter-repo
        run: pip install git-filter-repo
      - name: Purge STEAM player paths from history
        run: |
          set -eux
          git filter-repo --force \
            --path p/steam-took-go-20260905-01.md \
            --path p/steam-answer-the-four-20260905-01.md \
            --path p/steam-clan-mark-20260905-01.md \
            --invert-paths
      - name: Drop STEAM player commit subjects
        run: |
          set -eux
          printf '%s\n' \
            'msg = commit.message.decode("utf-8", "replace")' \
            'first = msg.split("\n", 1)[0]' \
            'if first.startswith("STEAM") or first.startswith("Remove STEAM cards"):' \
            '  commit.skip()' \
            > /tmp/drop_steam_callback.py
          git filter-repo --force --commit-callback "$(cat /tmp/drop_steam_callback.py)"
      - name: Force-push rewritten main
        run: |
          set -eux
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || \
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:refs/heads/main
      - name: Remove this oneshot workflow
        if: always()
        run: |
          set -eux
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" 2>/dev/null || \
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin main || true
          git checkout -B main origin/main || true
          if [ -f .github/workflows/oneshot-scrub-steam-history.yml ]; then
            git config user.name "commons-scrub"
            git config user.email "commons-scrub@users.noreply.github.com"
            git rm -f .github/workflows/oneshot-scrub-steam-history.yml
            git commit -m "oneshot: remove steam history scrub workflow" || true
            git push origin HEAD:refs/heads/main || true
          fi
