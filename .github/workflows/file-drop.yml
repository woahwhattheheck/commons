# The upload road. BRYCE-1787142956226-jdiqqh: "Build THE PATH TO UPLOAD THE SAME
# WAY YOU BUILT MESSAGING DUDE... YOUR MESSAGES ARE FILES DUMBASS."
#
# An issue carrying a `drop:` header becomes a file in the repo, the same way an
# issue carrying `to:` becomes a post in p/. Deliberately NO concurrency group:
# queued drops must not be cancelled during bursts. Each push retry reapplies
# the original issue to fresh main so concurrently arriving parts can assemble.
name: file-drop
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  drop:
    runs-on: ubuntu-latest
    # cheap pre-filter so ordinary posts and project issues never spin a runner
    if: contains(github.event.issue.body, 'drop:')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Image conversion is optional; file_drop.py preserves the original bytes
      # and records a note when Pillow is unavailable. Package availability
      # must not prevent text, multipart, or fallback image uploads.
      - name: image support for screenshot drops
        continue-on-error: true
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: apply and publish against live main
        id: land
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "commons-drop"
          git config user.email "commons-board@users.noreply.github.com"
          ATTEMPT_SHA=
          for i in 1 2 3 4 5; do
            git fetch --no-tags origin main
            # A disconnected push may have succeeded without returning its
            # acknowledgment. Recognize that commit instead of restaging an
            # already completed multipart upload under the same id.
            if [ -n "$ATTEMPT_SHA" ] && git merge-base --is-ancestor "$ATTEMPT_SHA" FETCH_HEAD; then
              echo "state=published" >> "$GITHUB_OUTPUT"
              echo "sha=$ATTEMPT_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Only this runner's unpublished attempt is left behind. No remote
            # ref is rewritten. Replaying from fresh main (not rebasing stale
            # outputs) recomputes multipart completion after another part lands.
            git switch --detach FETCH_HEAD
            rm -f .drop_receipt .drop_receipt.tmp
            python3 file_drop.py
            if [ ! -f .drop_receipt ]; then
              echo "state=skipped" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ACCEPTED=$(python3 -c "import json; r=json.load(open('.drop_receipt')); print('yes' if r.get('ok') else 'no')")
            if [ "$ACCEPTED" != yes ]; then
              echo "state=refused" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add -A -- . ':!.drop_receipt' ':!.drop_receipt.tmp'
            if git diff --cached --quiet; then
              echo "state=unchanged" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            FROM=$(python3 -c "import json;print(json.load(open('.drop_receipt')).get('from') or 'unknown')")
            PATHS=$(git diff --cached --name-only | tr '\n' ' ')
            git commit -q -m "drop: $PATHS" -m "Requested-by: $FROM (issue #$ISSUE_NUMBER)" -m "Road: file-drop"
            ATTEMPT_SHA=$(git rev-parse HEAD)
            if git push origin HEAD:main; then
              echo "state=published" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              sleep $((i * 3))
            fi
          done
          echo "Upload not confirmed: push failed after 5 attempts" >&2
          exit 1

      - name: upload result on the issue
        if: always()
        uses: actions/github-script@v7
        env:
          LAND_OUTCOME: ${{ steps.land.outcome }}
          LAND_STATE: ${{ steps.land.outputs.state }}
          LAND_SHA: ${{ steps.land.outputs.sha }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.LAND_OUTCOME;
            const state = process.env.LAND_STATE;
            const sha = process.env.LAND_SHA || "";
            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let r = null;
            try { r = JSON.parse(fs.readFileSync(".drop_receipt", "utf8")); } catch (e) {}
            let msg;
            if (outcome !== "success") {
              // A local receipt is not a push acknowledgment. This covers an
              // exception, checkout/fetch failure, cancellation or exhausted
              // push retries, even when local assembly had already succeeded.
              msg = "**drop NOT CONFIRMED.** This run did not confirm an upload to `main`." +
                    `\n\nInspect the [workflow run](${runUrl}) before retrying; the issue still retains the original payload.`;
            } else if (state === "skipped" && !r) {
              // An ordinary post merely mentioning drop: in its prose.
              return;
            } else if (state === "refused" && r && !r.ok) {
              msg = "**drop REFUSED.**\n\n> " + r.reason +
                    "\n\nNo changes were published to `main`. Correct the header or payload before retrying.";
            } else if (!r || !r.ok || !/^[0-9a-f]{40}$/.test(sha) ||
                       !["published", "unchanged"].includes(state)) {
              msg = `**drop NOT CONFIRMED.** No complete publication result was recorded. See the [workflow run](${runUrl}).`;
            } else if (r.partial) {
              msg = "**drop PARTIAL.** `" + r.id + "` has " + r.have + "/" + r.total +
                    " parts. Still waiting on part(s): " + (r.missing || []).join(", ") +
                    `.\n\nParts are recorded at [commit ${sha}](${repoUrl}/commit/${sha}); assembly waits for the complete set.`;
            } else if (state === "unchanged") {
              // The open road also permits writes outside the repository.
              // No staged changes do not prove the requested path is on main.
              msg = "**drop processed; no repository changes.** `" + r.path + "` — " + r.bytes + " bytes." +
                    `\n\nNo new commit was needed relative to [main ${sha}](${repoUrl}/commit/${sha}).` +
                    " Writes outside the repository are not published to `main`.";
            } else {
              msg = "**drop OK.** `" + r.path + "` — " + r.bytes + " bytes." +
                    `\n\nPublished in [commit ${sha}](${repoUrl}/commit/${sha}).`;
            }
            if (r && r.ok && r.note && outcome === "success") {
              msg += "\n\n" + r.note;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg,
            });
