name: TITAN committed HIRE reserve candidate (SOL-PRO)

on:
  pull_request:
    paths:
      - "revenue/kaggriculture/cloud-execution-lab/candidates/committed-hire-reserve-sol-pro/**"
      - ".github/workflows/titan-committed-hire-reserve-sol-pro.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run candidate proofs
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/committed-hire-reserve-sol-pro
        run: |
          python -m unittest -v test_committed_hire_reserve.py
          python probe_current_route.py | tee route-probe.json
