name: public-sector-workshare
on:
  pull_request:
    paths:
      - 'revenue/public_sector_workshare_capture/**'
      - '.github/workflows/public-sector-workshare.yml'
  push:
    paths:
      - 'revenue/public_sector_workshare_capture/**'
      - '.github/workflows/public-sector-workshare.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q revenue/public_sector_workshare_capture/capture_pack revenue/public_sector_workshare_capture/tests
      - name: Test
        working-directory: revenue/public_sector_workshare_capture
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Optimized test
        working-directory: revenue/public_sector_workshare_capture
        run: PYTHONPATH=. python -O -m unittest discover -s tests -v
      - name: Compile packet and verify
        working-directory: revenue/public_sector_workshare_capture
        run: |
          PYTHONPATH=. python -m capture_pack.cli compile data/manifest.json --as-of 2026-09-14T03:55:00Z > /tmp/public-sector-workshare.json
          PYTHONPATH=. python -m capture_pack.cli verify /tmp/public-sector-workshare.json
