name: pinellas-26-0795-rfi

on:
  pull_request:
    paths:
      - 'opportunities/pinellas_26_0795_rfi_digital_evidence/**'
      - '.github/workflows/pinellas-26-0795-rfi.yml'
  push:
    branches: [main]
    paths:
      - 'opportunities/pinellas_26_0795_rfi_digital_evidence/**'
      - '.github/workflows/pinellas-26-0795-rfi.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opportunities/pinellas_26_0795_rfi_digital_evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile custody sources
        run: >-
          python -m py_compile
          custody_reference.py
          current_custody_service.py
          tests/test_custody_reference.py
          tests/test_current_custody_service.py
      - name: Custody hostile tests
        run: python -m unittest discover -s tests -v
      - name: Custody hostile tests optimized mode
        run: python -O -m unittest discover -s tests -v
      - name: Assert response package remains externally blocked
        run: |
          set +e
          python ../../tools/proposal_gate/proposal_gate.py gate_requirements.json gate_evidence.json --check > /tmp/pinellas-gate.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          data = json.load(open('/tmp/pinellas-gate.json'))
          assert data['submission_ready'] is False, data
          assert data['blocking_requirements'], data
          PY
