name: titan-v3-dual-predecessor-equal-results-sol-trident

on:
  push:
    paths:
      - '.github/workflows/titan-v3-dual-predecessor-equal-results-sol-trident.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate/dual_predecessor_gate.py'
      - 'revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate/_dual_predecessor_gate_core.py'
      - 'revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate/test_equal_result_identity.py'
      - 'revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate/PANEL-IDENTITY.md'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-dual-predecessor-equal-results-sol-trident.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate/dual_predecessor_gate.py'
      - 'revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate/_dual_predecessor_gate_core.py'
      - 'revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate/test_equal_result_identity.py'
      - 'revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate/PANEL-IDENTITY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-gate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run complete custody gate suite and identity regression
        shell: bash
        run: |
          set -euo pipefail
          cd revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate
          PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 python -m unittest -v \
            test_validation.py \
            test_policy_cli.py \
            test_numeric_closure.py \
            test_derived_numeric_closure.py \
            test_dual_predecessor_gate.py \
            test_equal_result_identity.py
          python -m py_compile \
            _dual_predecessor_gate_core.py \
            dual_predecessor_gate.py \
            test_equal_result_identity.py

      - name: Verify wrapper changes only the intended theorem
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path('revenue/kaggriculture/cloud-execution-lab/titan-v3-paired-game-gate')
          wrapper = ast.parse((root / 'dual_predecessor_gate.py').read_text(encoding='utf-8'))
          names = {node.name for node in wrapper.body if isinstance(node, ast.FunctionDef)}
          if names != {'_validate_cross_comparison'}:
              raise SystemExit(f'unexpected wrapper function surface: {sorted(names)}')
          text = (root / 'dual_predecessor_gate.py').read_text(encoding='utf-8')
          if 'baseline_games_sha256' in text or 'panels must be byte-distinct' in text:
              raise SystemExit('unsound result-byte inequality survived in public gate')
          print('PASS: only cross-comparison theorem is overridden')
          PY
