name: titan-v31-b2-row-frontrun-audit

on:
  pull_request:
    paths:
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b2_row_frontrun/**'
      - '.github/workflows/titan-v31-b2-row-frontrun-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind frozen source and audit-only scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: 508b342fc46fa91e3d7cdc3f0b7e44934a187c14
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "$EXPECTED_BASE^{commit}"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r01_tapes.py)" = "a43289b9cc5e34a2481fddf652762a7d92f427ef"
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/candidates/v3/overlay/r04_full_router.py)" = "21c4f1db0298f8955b1f5ad366bd780a89cad206"
          test "$(git hash-object revenue/kaggriculture/cloud-execution-lab/reference/engine/kaggriculture.py)" = "3c202c7ee921da239356789e266b694635103fc4"
          git diff --name-only "$EXPECTED_BASE"...HEAD | tee /tmp/b2-paths.txt
          python - <<'PY'
          from pathlib import Path
          paths = {p for p in Path('/tmp/b2-paths.txt').read_text().splitlines() if p}
          allowed = {
              '.github/workflows/titan-v31-b2-row-frontrun-audit.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b2_row_frontrun/audit_row_residual.py',
          }
          if paths != allowed:
              raise SystemExit(
                  'B2 audit scope drift: '
                  f'actual={sorted(paths)!r} expected={sorted(allowed)!r}'
              )
          print('B2_AUDIT_SCOPE_OK', len(paths))
          PY
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile audit without mutating checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b2_row_frontrun/audit_row_residual.py')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('B2_AUDIT_COMPILE_OK')
          PY

      - name: Decode frozen tapes and enumerate row-order residual
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b2_row_frontrun/audit_row_residual.py | tee /tmp/b2-row-frontrun-audit.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/b2-row-frontrun-audit.json'))
          print('B2_TOTALS', json.dumps(report['totals'], sort_keys=True))
          print('B2_BY_ITEM', json.dumps(report['by_item'], sort_keys=True))
          print('B2_CROSSED_SHAPES', json.dumps(report['by_crossed_shape'], sort_keys=True))
          print('B2_CANDIDATE_BY_PLAN', json.dumps(report['candidate_by_plan'], sort_keys=True))
          for row in report['occurrences']:
              if row['candidate_shape']:
                  print('B2_CANDIDATE', json.dumps(row, sort_keys=True))
          PY

      - name: Upload exact source-audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: b2-row-frontrun-audit
          path: /tmp/b2-row-frontrun-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Prove checkout stayed clean
        run: test -z "$(git status --porcelain)"
