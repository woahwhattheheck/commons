name: titan-v31-a612-b10-public-supply

on:
  pull_request:
    branches:
      - titan/v3.1-20260911
    paths:
      - '.github/workflows/titan-v31-a612-b10-public-supply.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order/**'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_a612_exec/**'

permissions:
  contents: read

jobs:
  current-a612-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact a612 parent, reviewed B10, and evidence scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='a6120d0ea1bdb75eb0da2239220efce551f624a6'
          V3='revenue/kaggriculture/cloud-execution-lab/candidates/v3'
          DONOR="$V3/experiments/b10_rival_supply_order"
          EXEC="$V3/experiments/b10_a612_exec"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object "$DONOR/candidate.py")" = 'f70de1c87db6fa5449d6090cb0ea4cc6d9d8ff51'
          test "$(git hash-object "$DONOR/test_candidate.py")" = '6587f672ec63b2c0126516cf37cebc1b9aa78847'
          test "$(git hash-object "$EXEC/baseline.py")" = '09757fb4f7849505e3a8df5a8116bb32a1ef4cd4'
          test "$(git rev-parse HEAD:$V3/apply_v3.py)" = '7a96c0f1d38fff674493e92bc420eb3dfe821f20'
          test "$(git rev-parse HEAD:$V3/overlay/r04_full_router.py)" = 'd797ecd6068dc714d2ba45d44c2d672842116c7b'
          test "$(git rev-parse HEAD:$V3/overlay/r01_tapes.py)" = 'a43289b9cc5e34a2481fddf652762a7d92f427ef'
          test "$(git rev-parse HEAD:revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py)" = '1fb6b655bb4ca1e1684be165a8ef513e2e6c2325'
          cat > /tmp/expected <<'EOF'
          .github/workflows/titan-v31-a612-b10-public-supply.yml
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_a612_exec/baseline.py
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_a612_exec/candidate.py
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_a612_exec/paired_report.py
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order/candidate.py
          revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order/test_candidate.py
          EOF
          sort -o /tmp/expected /tmp/expected
          git diff --name-only "$BASE...HEAD" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          echo B10_A612_CUSTODY_OK

      - name: Run reviewed B10 predecessors and current build check
        shell: bash
        run: |
          set -euo pipefail
          (
            cd revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_rival_supply_order
            python3 -B -m unittest -v test_candidate.py
          )
          python3 -B revenue/kaggriculture/cloud-execution-lab/candidates/v3/build_v3.py --check
          python3 - <<'PY'
          from pathlib import Path
          root = Path('revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_a612_exec')
          for path in root.glob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          test -z "$(git status --porcelain)"

      - name: Prepare pinned official interpreter
        shell: bash
        run: |
          set -euo pipefail
          python3 -B revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py --prepare-engine /tmp/kag-engine

      - name: Require a612 is still canonical before evaluator spend
        shell: bash
        run: |
          set -euo pipefail
          BASE='a6120d0ea1bdb75eb0da2239220efce551f624a6'
          git fetch --no-tags origin '+refs/heads/titan/v3.1-20260911:refs/remotes/origin/titan/v3.1-20260911'
          test "$(git rev-parse refs/remotes/origin/titan/v3.1-20260911)" = "$BASE"

      - name: Run exact a612 control
        shell: bash
        run: |
          set -euo pipefail
          EVAL='revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py'
          DIR='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_a612_exec'
          python3 -B "$EVAL" \
            --engine-dir /tmp/kag-engine \
            --candidate "$DIR/baseline.py" \
            --opponent "a612=$DIR/baseline.py" \
            --seeds 2611151001,2611151002,2611151003,2611151004 \
            --rng-seed 20260911 \
            --recheck-first \
            --output /tmp/b10-a612-control.json

      - name: Run reviewed B10 after exact a612 parent
        shell: bash
        run: |
          set -euo pipefail
          EVAL='revenue/kaggriculture/cloud-execution-lab/reference/evaluator/evaluate.py'
          DIR='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_a612_exec'
          python3 -B "$EVAL" \
            --engine-dir /tmp/kag-engine \
            --candidate "$DIR/candidate.py" \
            --opponent "a612=$DIR/baseline.py" \
            --seeds 2611151001,2611151002,2611151003,2611151004 \
            --rng-seed 20260911 \
            --recheck-first \
            --output /tmp/b10-a612-candidate.json

      - name: Derive strict paired verdict
        shell: bash
        run: |
          set -euo pipefail
          DIR='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/b10_a612_exec'
          python3 -B "$DIR/paired_report.py" \
            /tmp/b10-a612-control.json /tmp/b10-a612-candidate.json \
            --json-out /tmp/b10-a612-receipt.json \
            --markdown-out /tmp/b10-a612-receipt.md
          cat /tmp/b10-a612-receipt.md
          cat /tmp/b10-a612-receipt.md >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck canonical before receipt publication
        shell: bash
        run: |
          set -euo pipefail
          BASE='a6120d0ea1bdb75eb0da2239220efce551f624a6'
          git fetch --no-tags origin '+refs/heads/titan/v3.1-20260911:refs/remotes/origin/titan/v3.1-20260911'
          test "$(git rev-parse refs/remotes/origin/titan/v3.1-20260911)" = "$BASE"
          test -z "$(git status --porcelain)"

      - name: Retain exact B10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: titan-v31-a612-b10-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/b10-a612-control.json
            /tmp/b10-a612-candidate.json
            /tmp/b10-a612-receipt.json
            /tmp/b10-a612-receipt.md
          if-no-files-found: error
          retention-days: 7
