name: titan-v3-receding-reserve-release

on:
  push:
    paths:
      - '.github/workflows/titan-v3-receding-reserve-release.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3-receding-reserve-release/**'
      - 'p/sol-level-titan-v3-receding-reserve-release-20260909-01.md'
  pull_request:
    paths:
      - '.github/workflows/titan-v3-receding-reserve-release.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3-receding-reserve-release/**'
      - 'p/sol-level-titan-v3-receding-reserve-release-20260909-01.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts-and-development-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s\n' "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/exact-head.sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned official-interpreter dependency
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'

      - name: Run predecessor-discriminating contracts
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3-receding-reserve-release
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python - <<'PY'
          import unittest
          import test_compare_panel
          import test_reserve_release
          import test_strict_gate

          expected = {
              test_reserve_release: 14,
              test_compare_panel: 5,
              test_strict_gate: 5,
          }
          loader = unittest.defaultTestLoader
          for module, count in expected.items():
              actual = loader.loadTestsFromModule(module).countTestCases()
              if actual != count:
                  raise SystemExit(
                      f"{module.__name__}: discovered {actual} tests; expected {count}"
                  )
              print(f"{module.__name__}: discovered {actual} tests")
          PY
          python -m unittest -v \
            test_reserve_release.py test_compare_panel.py test_strict_gate.py
          python -m py_compile \
            bootstrap.py control.py candidate.py reserve_release.py \
            compare_panel.py strict_gate.py test_reserve_release.py \
            test_compare_panel.py test_strict_gate.py

      - name: Verify canonical source and archive stayed unchanged
        working-directory: revenue/kaggriculture/cloud-execution-lab
        shell: bash
        run: |
          set -euo pipefail
          python build_integrated.py --check
          git diff --exit-code -- .

      - name: Run exact control panel
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          CASE="$LAB/candidates/v3-receding-reserve-release"
          OUT="$RUNNER_TEMP/receding-reserve-panel"
          mkdir -p "$OUT"
          python "$KAG/cloud-eval/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$CASE/control.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds '2609097301,2609097302' \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$OUT/control.json"

      - name: Run guarded reserve-release panel
        shell: bash
        run: |
          set -euo pipefail
          LAB=revenue/kaggriculture/cloud-execution-lab
          KAG=revenue/kaggriculture
          CASE="$LAB/candidates/v3-receding-reserve-release"
          OUT="$RUNNER_TEMP/receding-reserve-panel"
          python "$KAG/cloud-eval/evaluate.py" \
            --engine-dir "$LAB/reference/engine" \
            --loader "$KAG/20260907-offline-agent/evaluate.py" \
            --candidate "$CASE/candidate.py::agent" \
            --opponent "arlene=$LAB/runtime/variants/v1/reference/next-panel/vendor/arlene.py::agent" \
            --opponent "v1=$LAB/runtime/variants/v1/candidate.py::agent" \
            --seeds '2609097301,2609097302' \
            --rng-seed 20260909 \
            --action-timeout 1.0 \
            --startup-timeout 15 \
            --game-timeout 180 \
            --output "$OUT/candidate.json"

      - name: Gate complete paired evidence
        shell: bash
        run: |
          set -euo pipefail
          CASE=revenue/kaggriculture/cloud-execution-lab/candidates/v3-receding-reserve-release
          OUT="$RUNNER_TEMP/receding-reserve-panel"
          python "$CASE/compare_panel.py" \
            --control "$OUT/control.json" \
            --candidate "$OUT/candidate.json" \
            --head "$(git rev-parse HEAD)" \
            --output "$OUT/PAIRED-REPORT.json" \
            --markdown "$OUT/PAIRED-REPORT.md"
          python "$CASE/strict_gate.py" \
            --report "$OUT/PAIRED-REPORT.json" \
            --output "$OUT/STRICT-GATE.json" \
            --markdown "$OUT/STRICT-GATE.md"

      - name: Publish readable result
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/receding-reserve-panel/PAIRED-REPORT.md" ]]; then
            cat "$RUNNER_TEMP/receding-reserve-panel/PAIRED-REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Receding reserve panel did not reach comparison' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$RUNNER_TEMP/receding-reserve-panel/STRICT-GATE.md" ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/receding-reserve-panel/STRICT-GATE.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v3-receding-reserve-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-head.sha
            ${{ runner.temp }}/receding-reserve-panel/
          if-no-files-found: error
          retention-days: 30

      - name: Assert checkout stayed clean
        if: always()
        shell: bash
        run: git diff --exit-code -- .
