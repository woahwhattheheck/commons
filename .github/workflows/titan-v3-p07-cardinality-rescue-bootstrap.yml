name: TITAN V3 P07 source bootstrap

on:
  push:
    branches:
      - sol-atlas/titan-v3-p07-cardinality-rescue-20260910-01
    paths:
      - 'p07-bootstrap.b64.part-*'
      - '.github/workflows/titan-v3-p07-cardinality-rescue-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: titan-v3-p07-source-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize deterministic source tree
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(p07-bootstrap.b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo 'carrier already consumed; nothing to do'
            exit 0
          fi
          test ${#parts[@]} -eq 3
          test "$(sha256sum p07-bootstrap.b64.part-00 | awk '{print $1}')" = 8c54c096c277c70915304af8488aef4c01bec2b0d38c72425afa4a3b20b6ca2d
          test "$(sha256sum p07-bootstrap.b64.part-01 | awk '{print $1}')" = f54800798ac3387620b6e35130cda055ba9b82ffc4ed7594256e0d1675ef6248
          test "$(sha256sum p07-bootstrap.b64.part-02 | awk '{print $1}')" = bca8d0b3b74aacf4515891ca12e5dbacc51b20d13dd5ce0a342c7957073008e9
          cat "${parts[@]}" | base64 --decode > p07-bootstrap.tar.gz
          test "$(sha256sum p07-bootstrap.tar.gz | awk '{print $1}')" = 05edc2c97a265d976c303631dabf3feb608eaf836e5eb24592b660856db3bd29
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          expected = {
              '.github/workflows/titan-v3-p07-cardinality-rescue-sol-atlas.yml',
              'p/sol-atlas-titan-v3-p07-cardinality-rescue-20260910-01.md',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/README.md',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/TITAN-CONFIG.json',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/VALIDATION.json',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/build_candidate.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/main.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/test_build_candidate.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/test_joint_actor_assignment.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/test_live_mechanics.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/p07-cardinality-rescue-sol-atlas/test_main_joint_actor_assignment.py',
          }
          with tarfile.open('p07-bootstrap.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              assert names == expected, (names - expected, expected - names)
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute()
                  assert '..' not in path.parts
                  assert member.isfile()
          PY
          tar -xzf p07-bootstrap.tar.gz
          rm p07-bootstrap.tar.gz "${parts[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize TITAN V3 P07 cardinality-rescue candidate'
          git push origin HEAD:sol-atlas/titan-v3-p07-cardinality-rescue-20260910-01
