name: ZHD Mapping Equity M1 proof

on:
  push:
    branches:
      - zhd-k8p3/mapping-equity-m1-recovery-20260914

permissions:
  contents: read

concurrency:
  group: zhd-mapping-equity-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact aggregation carrier
        working-directory: revenue/bias-bounty-mapping-equity/aggregation
        run: python -m py_compile aggregate.py _zsa_d6p2_core.py test_aggregate.py test_recovery.py
      - name: Normal hostile contract suite
        working-directory: revenue/bias-bounty-mapping-equity/aggregation
        run: python -m unittest -v test_aggregate.py test_recovery.py
      - name: Optimized hostile contract suite
        working-directory: revenue/bias-bounty-mapping-equity/aggregation
        run: python -O -m unittest -v test_aggregate.py test_recovery.py
      - name: Byte-deterministic plan
        working-directory: revenue/bias-bounty-mapping-equity/aggregation
        run: |
          python aggregate.py plan --region northern-ca --sql > /tmp/plan-1.json
          python aggregate.py plan --region northern-ca --sql > /tmp/plan-2.json
          cmp /tmp/plan-1.json /tmp/plan-2.json
          python -m json.tool /tmp/plan-1.json >/dev/null
