name: pilot-delivery-renewal-expansion-gate

on:
  pull_request:
    paths:
      - 'revenue/pilot_delivery_renewal_expansion_gate/**'
      - 'test_pilot_delivery_renewal_expansion_gate.py'
      - 'test_pilot_delivery_renewal_reload_trust_root.py'
      - '.github/workflows/pilot-delivery-renewal-expansion-gate.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/pilot_delivery_renewal_expansion_gate/**'
      - 'test_pilot_delivery_renewal_expansion_gate.py'
      - 'test_pilot_delivery_renewal_reload_trust_root.py'
      - '.github/workflows/pilot-delivery-renewal-expansion-gate.yml'

permissions:
  contents: read

concurrency:
  group: pilot-delivery-renewal-expansion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: >-
          python -m py_compile
          revenue/pilot_delivery_renewal_expansion_gate/_trusted_runtime.py
          revenue/pilot_delivery_renewal_expansion_gate/common.py
          revenue/pilot_delivery_renewal_expansion_gate/model.py
          revenue/pilot_delivery_renewal_expansion_gate/engine.py
          revenue/pilot_delivery_renewal_expansion_gate/test_gate.py
          test_pilot_delivery_renewal_expansion_gate.py
          test_pilot_delivery_renewal_reload_trust_root.py
      - name: Contract tests
        run: >-
          python -m unittest -v
          test_pilot_delivery_renewal_expansion_gate
          test_pilot_delivery_renewal_reload_trust_root
      - name: Optimized contract tests
        run: >-
          python -O -m unittest -v
          test_pilot_delivery_renewal_expansion_gate
          test_pilot_delivery_renewal_reload_trust_root
