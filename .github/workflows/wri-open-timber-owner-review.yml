name: WRI Open Timber owner-review proposal

on:
  pull_request:
    paths:
      - "revenue/wri_open_timber_portal/**"
      - ".github/workflows/wri-open-timber-owner-review.yml"
  push:
    branches: [main]
    paths:
      - "revenue/wri_open_timber_portal/**"
      - ".github/workflows/wri-open-timber-owner-review.yml"

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Proposal contract
        run: python -m unittest -v revenue.wri_open_timber_portal.test_owner_review_proposal
      - name: Proposal contract optimized
        run: python -O -m unittest -v revenue.wri_open_timber_portal.test_owner_review_proposal
      - name: Existing WRI carrier regression
        run: |
          python -m unittest -v revenue.wri_open_timber_portal.test_engine revenue.wri_open_timber_portal.test_cli
          python -O -m unittest -v revenue.wri_open_timber_portal.test_engine revenue.wri_open_timber_portal.test_cli
