name: SaaS migration parity pilot

on:
  pull_request:
    paths:
      - 'commercial/saas-migration-parity-pilot/**'
      - '.github/workflows/saas-migration-parity-pilot.yml'
  push:
    paths:
      - 'commercial/saas-migration-parity-pilot/**'
      - '.github/workflows/saas-migration-parity-pilot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused acceptance
        working-directory: commercial/saas-migration-parity-pilot
        run: |
          python -m unittest -v test_parity.py
          python -O -m unittest -v test_parity.py
          python -m py_compile errors.py parity_schema.py secure_io.py parity.py synthetic_fixture.py test_parity.py
          tmpdir="$(mktemp -d)"
          python synthetic_fixture.py > "$tmpdir/input-a.json"
          python synthetic_fixture.py > "$tmpdir/input-b.json"
          cmp "$tmpdir/input-a.json" "$tmpdir/input-b.json"
          python parity.py compile --input "$tmpdir/input-a.json" --report-json "$tmpdir/report-a.json" --report-md "$tmpdir/report-a.md"
          python parity.py verify --input "$tmpdir/input-a.json" --report-json "$tmpdir/report-a.json"
          rm "$tmpdir/report-a.json" "$tmpdir/report-a.md"
          python parity.py compile --input "$tmpdir/input-a.json" --report-json "$tmpdir/report-a.json" --report-md "$tmpdir/report-a.md"
          python parity.py compile --input "$tmpdir/input-b.json" --report-json "$tmpdir/report-b.json" --report-md "$tmpdir/report-b.md"
          cmp "$tmpdir/report-a.json" "$tmpdir/report-b.json"
          cmp "$tmpdir/report-a.md" "$tmpdir/report-b.md"
