name: TERN-DELTA one-shot timeline path regression
on:
  push:
    branches: [tern-delta/observatory-paths-20260906-01]
    paths: [.github/workflows/tern-delta-observatory-paths.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /protocol/
            /observatory.js
            /observatory.html
            /test_observatory_renderer.js
            /test_observatory_timeline_paths.py
            /test_observatory_timeline_paths.js
            /.github/workflows/tern-delta-observatory-paths.yml
      - name: Reproduce missing paths, apply minimal fix, run regressions
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          evidence = Path(os.environ['RUNNER_TEMP']) / 'tern-delta-evidence'
          evidence.mkdir()
          expected = {
              'protocol/projector.py': '75e90956adbbf32e9cb1e04e268ac87a0a476a69',
              'observatory.js': '3eb367f4a524411d21c5a8a31d0e57f2c659bab5',
              'observatory.html': '412430ec8c839562533d1034bdf79fe0be28582a',
          }
          def blob(path):
              data = Path(path).read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, sha in expected.items():
              assert blob(name) == sha, f'Unexpected source bytes: {name}'

          results = []
          def run(label, command, expected_code=0, contains=None):
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (evidence / (label + '.txt')).write_text(result.stdout, encoding='utf-8')
              print(label, result.returncode, '\n' + result.stdout, flush=True)
              results.append({'label': label, 'command': command, 'exit_code': result.returncode})
              assert result.returncode == expected_code, f'{label}: unexpected exit code'
              if contains is not None:
                  assert contains in result.stdout, f'{label}: expected failure reason not found'

          run('before-python', [sys.executable, 'test_observatory_timeline_paths.py', '-v'], 1, 'FAILED (failures=5)')
          run('before-renderer', ['node', 'test_observatory_timeline_paths.js'], 1, 'secondary path should match')

          def replace_once(name, old, new):
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              assert source.count(old) == 1, f'Unexpected patch context: {name}'
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          old = '            "path": (event.get("claimed_paths") or [UNKNOWN])[0] if event.get("claimed_paths") else UNKNOWN,\n'
          replace_once('protocol/projector.py', old,
                       old + '            "claimed_paths": list(event.get("claimed_paths") or []),\n')
          old = '      if (filter.path && text(row.path).toLowerCase().indexOf(filter.path.toLowerCase()) < 0) return false;'
          new = '''      if (filter.path) {
                  // New bakes retain every event path; old bakes have only path.
                  const paths = Array.isArray(row.claimed_paths) && row.claimed_paths.length ? row.claimed_paths : [text(row.path)];
                  const needle = filter.path.toLowerCase();
                  if (!paths.some(function (path) {
                    return typeof path === "string" && path.toLowerCase().indexOf(needle) >= 0;
                  })) return false;
                }'''
          replace_once('observatory.js', old, new)
          replace_once('observatory.html', './observatory.js?v=20260906tern1', './observatory.js?v=20260906terndelta1')

          run('after-python', [sys.executable, 'test_observatory_timeline_paths.py', '-v'])
          run('after-renderer', ['node', 'test_observatory_timeline_paths.js'])
          run('existing-renderer', ['node', '--test', 'test_observatory_renderer.js'])
          run('renderer-syntax', ['node', '--check', 'observatory.js'])
          run('python-syntax', [sys.executable, '-m', 'compileall', '-q', 'protocol', 'test_observatory_timeline_paths.py'])
          run('diff-check', ['git', 'diff', '--check'])
          changed = [*expected, 'test_observatory_timeline_paths.py', 'test_observatory_timeline_paths.js']
          manifest = {'base': 'c7addd678ff9a2bfb0fc917079d137e2bc422427', 'before_blobs': expected,
                      'after_blobs': {name: blob(name) for name in changed}, 'commands': results}
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          diff = subprocess.check_output(['git', 'diff', '--', *expected], text=True)
          (evidence / 'source.patch').write_text(diff, encoding='utf-8')
          source_dir = evidence / 'source'
          source_dir.mkdir()
          for name in [*changed, 'test_observatory_renderer.js', *map(str, Path('protocol').glob('*.py'))]:
              target = source_dir / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          inventory = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD'], text=True)
          (evidence / 'related-test-inventory.txt').write_text('\n'.join(
              name for name in inventory.splitlines()
              if 'test' in name.lower() and any(word in name.lower() for word in ('observatory', 'protocol', 'projector'))
          ) + '\n', encoding='utf-8')
          PY
      - name: Commit only the scoped repair and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/projector.py observatory.js observatory.html test_observatory_timeline_paths.py test_observatory_timeline_paths.js
          git rm .github/workflows/tern-delta-observatory-paths.yml
          git diff --cached --check
          git commit -m 'fix(observatory): retain and search every per-event timeline path'
          git push origin HEAD:tern-delta/observatory-paths-20260906-01
          git rev-parse HEAD | tee "$RUNNER_TEMP/tern-delta-evidence/final-head.txt"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tern-delta-timeline-path-evidence
          path: ${{ runner.temp }}/tern-delta-evidence
          retention-days: 14
