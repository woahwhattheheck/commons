name: service-deal-economics

on:
  pull_request:
    paths:
      - 'revenue/service_deal_economics/**'
      - '.github/workflows/service-deal-economics.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/service_deal_economics/**'
      - '.github/workflows/service-deal-economics.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile revenue/service_deal_economics/*.py
      - run: python -m unittest -v revenue.service_deal_economics.test_engine
      - run: python -O -m unittest -v revenue.service_deal_economics.test_engine
