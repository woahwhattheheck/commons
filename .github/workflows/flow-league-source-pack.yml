name: T09 public source pack
on:
  push:
    branches: [work/flow-opponent-league-20260907]
    paths: [.github/workflows/flow-league-source-pack.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source and record content hashes
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request
          root = pathlib.Path('source-pack')
          root.mkdir()
          records = []
          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'commons-T09-public-source-pack'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return response.read()
          def save(url, destination, expected_blob=None):
              data = get(url)
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if expected_blob and blob != expected_blob:
                  raise RuntimeError('source blob mismatch: ' + destination)
              path = root / destination
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              records.append({'path': destination, 'url': url, 'git_blob': blob, 'sha256': hashlib.sha256(data).hexdigest()})
          def directory(repo, ref, source, dest):
              api = f'https://api.github.com/repos/{repo}/contents/{source}?ref={ref}'
              entries = json.loads(get(api))
              for entry in entries:
                  name = entry['name']
                  if entry['type'] == 'file' and (name.endswith('.py') or name.startswith(('LICENSE', 'UPSTREAM', 'COPYING'))):
                      save(entry['download_url'], dest + '/' + name, entry['sha'])
          repo = 'woahwhattheheck/commons'
          frontier = '8329e78768906dc6e75ca3712e1690adc1ab2148'
          cap = '473e63d7151d4acdcdeeb76c784aaf4054c062e3'
          prefix = 'revenue/kaggriculture/'
          for path in ('cloud-frontier-policy/next-panel', 'cloud-frontier-policy/next-panel/vendor', 'cloud-eval', 'cloud-resource-use'):
              directory(repo, frontier, prefix + path, path)
          directory(repo, cap, prefix + 'cloud-model-lab', 'cloud-model-lab')
          engine = '28b6d8af3ce73926b3d0fda1410c1ddd8384ab8c'
          for name in ('kaggriculture.py', 'kaggriculture.json'):
              save(f'https://raw.githubusercontent.com/Kaggle/kaggle-environments/{engine}/kaggle_environments/envs/kaggriculture/{name}', 'engine/' + name)
          save(f'https://raw.githubusercontent.com/Kaggle/kaggle-environments/{engine}/kaggle_environments/utils.py', 'engine/utils.py')
          save(f'https://raw.githubusercontent.com/Kaggle/kaggle-environments/{engine}/LICENSE', 'engine/LICENSE')
          (root / 'SOURCE_MANIFEST.json').write_text(json.dumps({'complete': True, 'commons_frontier_ref': frontier, 'commons_cap_ref': cap, 'engine_ref': engine, 'files': records}, indent=2) + '\n')
          print('Verified public source files:', len(records))
      - uses: actions/upload-artifact@v4
        with:
          name: flow-league-source-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-pack/
          if-no-files-found: error
          retention-days: 14
