name: Streaming Rendition QA Pilot
on:
  pull_request:
    paths:
      - 'revenue/streaming_rendition_qa_pilot/**'
      - 'streaming_rendition_qa_pilot_standalone.py'
      - 'streaming_rendition_qa_pilot_package.py'
      - 'test_streaming_rendition_qa_pilot.py'
      - '.github/workflows/streaming-rendition-qa-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/streaming_rendition_qa_pilot/**'
      - 'streaming_rendition_qa_pilot_standalone.py'
      - 'streaming_rendition_qa_pilot_package.py'
      - 'test_streaming_rendition_qa_pilot.py'
      - '.github/workflows/streaming-rendition-qa-pilot.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile revenue/streaming_rendition_qa_pilot/*.py streaming_rendition_qa_pilot_standalone.py streaming_rendition_qa_pilot_package.py test_streaming_rendition_qa_pilot.py
      - run: python test_streaming_rendition_qa_pilot.py
      - run: python -O test_streaming_rendition_qa_pilot.py
      - run: |
          python streaming_rendition_qa_pilot_package.py /tmp/a.zip
          python streaming_rendition_qa_pilot_package.py /tmp/b.zip
          cmp /tmp/a.zip /tmp/b.zip
