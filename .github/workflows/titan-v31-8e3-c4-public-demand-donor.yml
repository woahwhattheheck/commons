name: TITAN V3.1 8e3 C4 public-demand donor

on:
  pull_request:
    branches:
      - titan/v3.1-20260911
    paths:
      - '.github/workflows/titan-v31-8e3-c4-public-demand-donor.yml'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_town_demand_boundary/**'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_predebt_repair/**'
      - 'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_current_root_rebind/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-v31-8e3-c4-public-demand-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-root-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout literal event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind literal 8e3 root, repaired donor bytes, and six-path scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT='8e3d92a286806f9f9525973ee7d359b629a11487'
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          V3='revenue/kaggriculture/cloud-execution-lab/candidates/v3'
          CAND="$V3/experiments/c4_town_demand_boundary/candidate.py"
          TEST="$V3/experiments/c4_town_demand_boundary/test_candidate.py"
          PATCH="$V3/experiments/c4_predebt_repair/repair.patch"
          KILLERS="$V3/experiments/c4_predebt_repair/test_predebt_repair.py"
          R04="$V3/overlay/r04_full_router.py"
          APPLY="$V3/apply_v3.py"
          B5="$V3/overlay/b5_fertilize.py"
          JIT="$V3/overlay/jit_pass_fertilize.py"

          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git fetch --no-tags origin '+refs/heads/titan/v3.1-20260911:refs/remotes/origin/titan/v3.1-20260911'
          test "$(git rev-parse refs/remotes/origin/titan/v3.1-20260911)" = "$ROOT"
          test "$(git merge-base "$ROOT" HEAD)" = "$ROOT"

          # Candidate differs from reviewed #12468 only by the current-root import binding repair.
          test "$(git rev-parse "HEAD:$CAND")" = '2ed3f7a7b915e0cab385f62ee7fc528d51a79828'
          test "$(git rev-parse "HEAD:$TEST")" = 'ea30a397d3ec6baddea60d667efdd011e3779228'
          test "$(git rev-parse "HEAD:$PATCH")" = '9933b22d187daee8ae7ee394690b0d3f19c73cb6'
          test "$(git rev-parse "HEAD:$KILLERS")" = '49f35001a52dbb313a0b62160eb32426efa8053d'

          # Current shipped 8e3 gameplay bytes: C4 delegates to this exact incumbent stack.
          test "$(git rev-parse "HEAD:$R04")" = '7edacbfb4916b8f241b689ded6643240ca02a9ec'
          test "$(git rev-parse "HEAD:$APPLY")" = 'a43d6c470ab05d87803fb016966d1cc54fab9d17'
          test "$(git rev-parse "HEAD:$B5")" = '2a9d606835b0d04d832a4737dcb381ad3fbef1ae'
          test "$(git rev-parse "HEAD:$JIT")" = '6ef7ddcd9590e3cb3f55ceb708b8026235d59410'

          python - <<'PY'
          import subprocess
          root = '8e3d92a286806f9f9525973ee7d359b629a11487'
          expected = {
              '.github/workflows/titan-v31-8e3-c4-public-demand-donor.yml',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_town_demand_boundary/candidate.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_town_demand_boundary/test_candidate.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_predebt_repair/repair.patch',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_predebt_repair/test_predebt_repair.py',
              'revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_current_root_rebind/README.md',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{root}..HEAD'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'C4 current-root scope drift: {sorted(actual)!r}')
          print('C4_8E3_SCOPE_OK', len(actual))
          PY
          git diff --check "$ROOT"..HEAD
          test -z "$(git status --porcelain)"

      - name: Prove C4 imports the exact current V3 overlay parent
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_town_demand_boundary
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import candidate
          expected = (candidate.V3 / 'overlay' / 'r04_full_router.py').resolve()
          actual = Path(candidate.base.__file__).resolve()
          if actual != expected:
              raise SystemExit(f'C4 parent import drift: {actual} != {expected}')
          if candidate.V3.name != 'v3':
              raise SystemExit(f'C4 V3 root drift: {candidate.V3}')
          print('C4_PARENT_IMPORT_BOUND', actual)
          PY
          test -z "$(find . -type d -name __pycache__ -print -quit)"

      - name: Apply reviewed whole-predebt repair ephemerally
        shell: bash
        run: |
          set -euo pipefail
          V3='revenue/kaggriculture/cloud-execution-lab/candidates/v3'
          CAND="$V3/experiments/c4_town_demand_boundary/candidate.py"
          PATCH="$V3/experiments/c4_predebt_repair/repair.patch"
          git apply --check "$PATCH"
          git apply "$PATCH"
          test "$(git diff --name-only)" = "$CAND"
          python - "$CAND" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY
          git hash-object "$CAND" | tee "$RUNNER_TEMP/c4-repaired-postimage.txt"
          test -z "$(find . -type d -name __pycache__ -print -quit)"

      - name: Run inherited C4 predecessors
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_town_demand_boundary
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v test_candidate.py |& tee "$RUNNER_TEMP/c4-parent.log"
          grep -F 'Ran 14 tests' "$RUNNER_TEMP/c4-parent.log"
          grep -F 'OK' "$RUNNER_TEMP/c4-parent.log"

      - name: Run whole-predebt killers
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v experiments/c4_predebt_repair/test_predebt_repair.py |& tee "$RUNNER_TEMP/c4-repair.log"
          grep -F 'Ran 4 tests' "$RUNNER_TEMP/c4-repair.log"
          grep -F 'OK' "$RUNNER_TEMP/c4-repair.log"

      - name: Restore donor, recheck live root, and prove clean checkout
        shell: bash
        run: |
          set -euo pipefail
          ROOT='8e3d92a286806f9f9525973ee7d359b629a11487'
          CAND='revenue/kaggriculture/cloud-execution-lab/candidates/v3/experiments/c4_town_demand_boundary/candidate.py'
          git checkout -- "$CAND"
          test -z "$(git status --porcelain)"
          # A proof that started on 8e3 must not finish green after canonical has advanced.
          git fetch --no-tags origin '+refs/heads/titan/v3.1-20260911:refs/remotes/origin/titan/v3.1-20260911'
          test "$(git rev-parse refs/remotes/origin/titan/v3.1-20260911)" = "$ROOT"
          echo C4_8E3_REPAIRED_DONOR_OK

      - name: Upload source-proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v31-8e3-c4-public-demand-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/c4-parent.log
            ${{ runner.temp }}/c4-repair.log
            ${{ runner.temp }}/c4-repaired-postimage.txt
          if-no-files-found: error
          retention-days: 14
