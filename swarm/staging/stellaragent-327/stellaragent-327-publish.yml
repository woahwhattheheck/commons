name: Publish StellarAgent 327 source

on:
  push:
    branches:
      - zz-sol-nightjar/stellaragent-327-cli-limits

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zz-sol-nightjar/stellaragent-327-cli-limits
          fetch-depth: 0
      - name: Install exact claimant source
        env:
          SOURCE_BASE: https://raw.githubusercontent.com/woahwhattheheck/commons/c2aab174df7ae33dd590a9ece997cff3de77aedd/swarm/staging/stellaragent-327
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "$SOURCE_BASE/packages/cli/src/index.ts" \
            --output packages/cli/src/index.ts
          curl --fail --silent --show-error --location \
            "$SOURCE_BASE/packages/cli/src/__tests__/cli.test.ts" \
            --output packages/cli/src/__tests__/cli.test.ts
          rm -f .github/workflows/stellaragent-327-publish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/cli/src/index.ts packages/cli/src/__tests__/cli.test.ts \
            .github/workflows/stellaragent-327-publish.yml
          git commit -m "feat(cli): add limits set and show commands"
          git push origin HEAD:zz-sol-nightjar/stellaragent-327-cli-limits
