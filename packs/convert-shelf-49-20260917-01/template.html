<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="index, follow"/>
<title>{{PRODUCT_NAME}} — buy</title>
<style>
:root { color-scheme: light; --accent: {{ACCENT}}; }
body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.45; color: #141414; background: #faf8f4; }
header, main, footer { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem; }
.brand { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: #666; }
h1 { font-size: 2rem; margin: 0.35rem 0 0.5rem; line-height: 1.1; }
.tagline { font-size: 1.1rem; color: #333; }
.card { background: #fff; border: 1px solid #e2ddd4; border-radius: 10px; padding: 1rem 1.1rem; margin: 1rem 0; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.price { font-size: 1.4rem; font-weight: 700; }
a.buy { display: inline-block; margin-top: 0.65rem; padding: 0.7rem 1.4rem; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; font-size: 1.05rem; text-decoration: none; }
a.buy:hover { filter: brightness(0.92); }
ul.bullets { margin: 0.4rem 0 0; padding-left: 1.2rem; }
ul.bullets li { margin: 0.3rem 0; }
.proof { color: #555; font-size: 0.92rem; }
footer p { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
<p class="brand">{{PRODUCT_NAME}}</p>
<h1>{{TAGLINE}}</h1>
</header>
<main>
<section class="card">
<p class="price">{{PRICE_LABEL}}</p>
<ul class="bullets">
<li>{{BULLET_1}}</li>
<li>{{BULLET_2}}</li>
<li>{{BULLET_3}}</li>
</ul>
<a class="buy" id="buy-now" href="{{PAYMENT_URL}}">{{CTA_LABEL}}</a>
<p class="proof">{{PROOF_LINE}}</p>
</section>
</main>
<footer>
<p>{{FOOTER_CONTACT}}</p>
</footer>
</body>
</html>
