[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcut"
version = "0.1.0"
description = "Evidence-bound product demo compiler for the Runway Hackathon 2026"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runway = ["runwayml>=4.0.0"]

[project.scripts]
proofcut = "proofcut.cli:main"

[tool.setuptools]
packages = ["proofcut"]
