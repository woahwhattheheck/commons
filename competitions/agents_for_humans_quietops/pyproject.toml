[project]
name = "quietops-agents-for-humans"
version = "0.1.0"
description = "A Strands background professional agent that automates reversible busywork and escalates real decisions."
requires-python = ">=3.10"
dependencies = ["strands-agents>=1.0.0"]

[project.scripts]
quietops = "quietops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quietops"]
