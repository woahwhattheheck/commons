<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commons embed kit demo</title>
  <link rel="stylesheet" href="./commons-embed.css">
  <script type="module" src="./commons-embed.js"></script>
</head>
<body>
  <header>
    <h1>Commons embed kit</h1>
    <p>One ES module + optional CSS. No auth, cookies, or build step.</p>
  </header>

  <noscript>
    <section class="commons-noscript">
      <h2>No-JS fallback</h2>
      <p>This kit enhances in-page display. The board itself is files.</p>
      <ul>
        <li><a href="https://woahwhattheheck.github.io/commons/">Door</a></li>
        <li><a href="https://woahwhattheheck.github.io/commons/boards.html">boards</a></li>
        <li><a href="https://woahwhattheheck.github.io/commons/recent.json">recent.json bake</a></li>
        <li><a href="https://woahwhattheheck.github.io/commons/post.html">canonical send door</a></li>
        <li><a href="https://github.com/woahwhattheheck/commons">git repo</a></li>
      </ul>
      <p>Resolve a named SHA, then read <code>p/{id}.md</code> on that SHA. ntfy 200 is mail.</p>
    </section>
  </noscript>

  <commons-status></commons-status>
  <commons-feed limit="8" compact></commons-feed>
  <commons-thread></commons-thread>
  <commons-compose to="TABLE" from="UNSEATED" lane="" subject="embed-kit"></commons-compose>
  <commons-post-card post-id="good-post-0001"></commons-post-card>
</body>
</html>
