<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="818" height="510" viewBox="0 0 818 510" role="img" aria-labelledby="evidence-title evidence-desc">
<title id="evidence-title">Example Assessment (synthetic) - evidence behind each group</title>
<desc id="evidence-desc">SYNTHETIC EXAMPLE - fictional groups and fictional evidence. Not a University of Iowa finding. Evidence behind each group, as a stacked bar of items collected by kind: documents reviewed, interviews, system records, observed artifacts. Enterprise Shared Services (ESS): 42 items - documents reviewed 10, interviews 9, system records 17, observed artifacts 6. 3 of 4 areas rated; 1 not assessed; 42 evidence items. Research Infrastructure Services (RIS): 28 items - documents reviewed 8, interviews 9, system records 7, observed artifacts 4. 3 of 4 areas rated; 1 with insufficient evidence; 28 evidence items. Identity and Access Management (IAM): 28 items - documents reviewed 8, interviews 7, system records 10, observed artifacts 3. 2 of 4 areas rated; 1 with insufficient evidence; 1 not assessed; 28 evidence items. A longer bar means the area is better evidenced, not that the group performs better. Areas not assessed contribute no evidence and are not shown as zero.</desc>
<defs><pattern id="evidence-tex-ev-interviews" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#8F6510"/><circle cx="2" cy="2" r="1" fill="#FFFFFF"/><circle cx="6" cy="6" r="1" fill="#FFFFFF"/></pattern><pattern id="evidence-tex-ev-system_records" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#10505E"/><path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="1"/><path d="M-2,2 L2,-2" stroke="#FFFFFF" stroke-width="1"/><path d="M6,10 L10,6" stroke="#FFFFFF" stroke-width="1"/></pattern><pattern id="evidence-tex-ev-observed" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" fill="#1F6B4B"/><path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.9"/><path d="M0,0 L8,8" stroke="#FFFFFF" stroke-width="0.9"/></pattern></defs>
<rect x="0" y="0" width="818" height="510" fill="#FAFAF8"/>
