<text x="24" y="56" font-size="12" fill="#55554F" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Three fictional technology groups, four assessment areas  |  SYNTHETIC EXAMPLE - fictional groups and fictional evidence. Not a University of Iowa finding.</text>
